<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>4D gauge lattice, projected</title>
<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

// ---------------------------------------------------------------- spheres

// ---------------------------------------------------------------- solid objects (meshes)

/**

    box(sx = 1, sy = 1, sz = 1) {

    X[0] = a0; X[1] = r * st * Math.cos(ph); X[2] = r * st * Math.sin(ph); X[3] = r * ct;
    qmul(X, qdag(Vn, tmp), link(lat, s, mu));
  }}}
  for (let o = 0; o < overrelax; o++) {
    for (let s = s0; s < s1; s++) {for (let mu = 0; mu < D; mu++) {
      staple(lat, s, mu, A);
      const k = Math.hypot(A[0], A[1], A[2], A[3]);
      if (k < 1e-12) continue;
      for (let i = 0; i < 4; i++) Vn[i] = A[i] / k;
      // U → V† U† V† : leaves the local action unchanged (microcanonical), decorrelates fast
      const U = link(lat, s, mu);
      qmul(qdag(Vn, tmp), qdag(U, X), A);
      qmul(A, qdag(Vn, tmp), U);
    }}
  }
  // re-unitarise against round-off
  for (let i = s0 * D; i < s1 * D; i++) {
    const o = 4 * i, n = Math.hypot(lat.U[o], lat.U[o + 1], lat.U[o + 2], lat.U[o + 3]);
    for (let k = 0; k < 4; k++) lat.U[o + k] /= n;
  }
  if (s1 === lat.V) lat.sweeps++;
}

/**
 * Local gauge transformation U_μ(s) → g(s) U_μ(s) g(s+μ)†: physics must not change. Pass a rand
 * function (default lat.rand; pass your own to leave the Markov chain untouched) for a random g,
 * or an array of V quaternions to apply a given g. Returns g.
 */
function gaugeTransform(lat, randOrG = lat.rand) {
  const g = typeof randOrG === 'function' ? Array.from({ length: lat.V }, () => randomSU2(randOrG)) : randOrG;
  if (g.length !== lat.V) throw new Error(`gaugeTransform: need ${lat.V} SU(2) elements`);
  const t = new Float64Array(4), d = new Float64Array(4);
  for (let s = 0; s < lat.V; s++) {for (let mu = 0; mu < lat.D; mu++) {
    const U = link(lat, s, mu);
    qmul(g[s], U, t);
    qmul(t, qdag(g[lat.up[s * lat.D + mu]], d), U);
  }}
  return g;
}

/**
 * Centre transformation: multiply every link along `dir` that leaves the slice x_dir = slice by
 * −1 (the Z₂ centre of SU(2)). Plaquettes and the action are unchanged; Polyakov loops along dir
 * change sign. In the confined phase ⟨P⟩ = 0 respects this symmetry; deconfinement breaks it.
 */
function centreTransform(lat, { dir = lat.D - 1, slice = 0 } = {}) {
  for (let s = 0; s < lat.V; s++) {
    if (siteCoords(lat, s)[dir] !== slice) continue;
    const o = 4 * (s * lat.D + dir);
    for (let k = 0; k < 4; k++) lat.U[o + k] = -lat.U[o + k];
  }
}

/**
 * Lattice Landau gauge: maximise F = (1/(V·D)) Σ ½Tr U_μ(x) by site-wise gauge transformations,
 * with over-relaxation exponent omega (1 = plain, ~1.7 faster). Stops when the gauge-condition
 * violation θ = (1/V) Σ_x |Σ_μ (A_μ(x) − A_μ(x−μ))|² < tol, where A_μ is the vector part of U_μ.
 * Changes lat in place (an exactly gauge-equivalent configuration) and returns
 * { theta, F, iterations, g } with the accumulated g. The result is one Gribov copy, not unique.
 */
function landauGauge(lat, { omega = 1.7, tol = 1e-12, maxIterations = 5000 } = {}) {
  const { V, D, U, dn } = lat;
  const g = Array.from({ length: V }, () => Float64Array.from([1, 0, 0, 0]));
  const K = new Float64Array(4), h = new Float64Array(4), t = new Float64Array(4);
  const theta = () => {
    let sum = 0;
    for (let s = 0; s < V; s++) {
      const d = [0, 0, 0];
      for (let mu = 0; mu < D; mu++) {
        const a = 4 * (s * D + mu), b = 4 * (dn[s * D + mu] * D + mu);
        for (let k = 0; k < 3; k++) d[k] += U[a + 1 + k] - U[b + 1 + k];
      }
      sum += d[0] * d[0] + d[1] * d[1] + d[2] * d[2];
    }
    return sum / V;
  };
  const F = () => { let f = 0; for (let i = 0; i < V * D; i++) f += U[4 * i]; return f / (V * D); };
  let it = 0, th = theta();
  for (; it < maxIterations && th > tol; it++) {
    for (let s = 0; s < V; s++) {
      // K = Σ_μ [U_μ(s) + U_μ(s−μ)†]; the best h maximises ½Tr(h K): h = K†/|K|
      K.fill(0);
      for (let mu = 0; mu < D; mu++) {
        const a = 4 * (s * D + mu), b = 4 * (dn[s * D + mu] * D + mu);
        K[0] += U[a] + U[b];
        for (let k = 1; k < 4; k++) K[k] += U[a + k] - U[b + k];
      }
      const n = Math.hypot(K[0], K[1], K[2], K[3]);
      if (!(n > 0)) continue;
      h[0] = K[0] / n; h[1] = -K[1] / n; h[2] = -K[2] / n; h[3] = -K[3] / n;
      if (omega !== 1) h.set(qexp(qlog(h).map(v => v * omega)));
      // apply h at s: U_μ(s) → h U_μ(s), U_μ(s−μ) → U_μ(s−μ) h†
      for (let mu = 0; mu < D; mu++) {
        const a = 4 * (s * D + mu), b = 4 * (dn[s * D + mu] * D + mu);
        qmulInto(t, 0, h, 0, U, a); U.set(t, a);
        qmulInto(t, 0, U, b, h, 0, false, true); U.set(t, b);
      }
      qmulInto(t, 0, h, 0, g[s], 0); g[s].set(t);
    }
    th = theta();
  }
  return { theta: th, F: F(), iterations: it, g, converged: th <= tol };
}

/** Total Wilson action S/β = Σ_P (1 − ½ Tr U_P). */
function action(lat) {
  const nP = lat.V * lat.D * (lat.D - 1) / 2;
  return nP * (1 - plaquette(lat));
}

/** Average plaquette ⟨½ Tr U_P⟩. */
function plaquette(lat) {
  const { V, D, up } = lat;
  const t1 = new Float64Array(4), t2 = new Float64Array(4), t3 = new Float64Array(4);
  let sum = 0, n = 0;
  for (let s = 0; s < V; s++) {for (let mu = 0; mu < D; mu++) {for (let nu = mu + 1; nu < D; nu++) {
    qmul(link(lat, s, mu), link(lat, up[s * D + mu], nu), t1);
    qmul(t1, qdag(link(lat, up[s * D + nu], mu), t2), t3);
    qmul(t3, qdag(link(lat, s, nu), t2), t1);
    sum += t1[0]; n++;
  }}}
  return sum / n;
}

/**
 * Average R×T Wilson loop ⟨½ Tr W⟩ over all sites and all planes μ < ν, with R along μ
 * (the lower index) and T along ν. On an anisotropic lattice W(R,T) ≠ W(T,R) in general.
 * Loops must fit in the lattice without wrapping: R, T < extent of every direction.
 */
function wilsonLoop(lat, R, T) {
  if (R >= Math.min(...lat.dims) || T >= Math.min(...lat.dims)) throw new Error(`wilsonLoop: R, T must be < lattice extent ${Math.min(...lat.dims)}`);
  const { V, D, up } = lat;
  let sum = 0, n = 0;
  const P = new Float64Array(4), t = new Float64Array(4), d = new Float64Array(4);
  for (let mu = 0; mu < D; mu++) {for (let nu = 0; nu < D; nu++) {
    if (mu >= nu) continue;                                  // each plane once
    for (let s0 = 0; s0 < V; s0++) {
      P.fill(0); P[0] = 1;
      let s = s0;
      const go = (dir, steps, back) => {
        for (let i = 0; i < steps; i++) {
          if (!back) { qmul(P, link(lat, s, dir), t); P.set(t); s = up[s * D + dir]; }
          else { s = lat.dn[s * D + dir]; qmul(P, qdag(link(lat, s, dir), d), t); P.set(t); }
        }
      };
      go(mu, R, false); go(nu, T, false); go(mu, R, true); go(nu, T, true);
      sum += P[0]; n++;
    }
  }}
  return sum / n;
}

/** Creutz ratio χ(R,T) = −ln[ W(R,T) W(R−1,T−1) / (W(R,T−1) W(R−1,T)) ] → σa² for large loops. */
const creutzRatio = (W, R, T) => -Math.log(W(R, T) * W(R - 1, T - 1) / (W(R, T - 1) * W(R - 1, T)));

// ---------------------------------------------------------------- fast measurements and fields

/** Coordinates of site s (axis 0 fastest), and the inverse. */
function siteCoords(lat, site) {
  const x = [];
  let s = site;
  for (const n of lat.dims) { x.push(s % n); s = Math.floor(s / n); }
  return x;
}
function siteIndex(lat, x) {
  let s = 0, stride = 1;
  lat.dims.forEach((n, mu) => { s += ((x[mu] % n) + n) % n * stride; stride *= n; });
  return s;
}

/** Products of `len` consecutive links along μ from every site: out[(s·len + r−1)·4..] = U_μ(s)…U_μ(s+(r−1)μ). */
function lineProducts(lat, mu, len) {
  const { V, D, U, up } = lat, out = new Float64Array(V * len * 4);
  for (let s = 0; s < V; s++) {
    out.set(U.subarray(4 * (s * D + mu), 4 * (s * D + mu) + 4), s * len * 4);
    let x = up[s * D + mu];
    for (let r = 2; r <= len; r++) { qmulInto(out, (s * len + r - 1) * 4, out, (s * len + r - 2) * 4, U, 4 * (x * D + mu)); x = up[x * D + mu]; }
  }
  return out;
}
/** shift[s·(n+1) + r] = s + rμ. */
function shifts(lat, mu, n) {
  const { V, D, up } = lat, out = new Int32Array(V * (n + 1));
  for (let s = 0; s < V; s++) { let x = s; for (let r = 0; r <= n; r++) { out[s * (n + 1) + r] = x; x = up[x * D + mu]; } }
  return out;
}

/**
 * Every Wilson loop ⟨½Tr W(R,T)⟩ for 1 ≤ R ≤ Rmax, 1 ≤ T ≤ Tmax in one pass, averaged over sites and
 * planes with the same convention as wilsonLoop (planes μ < ν, R along μ, T along ν), or over the
 * given planes [[μ, ν], …] (e.g. [[0, 3], [1, 3], [2, 3]] for spatial R and Euclidean time T).
 * Uses ½Tr(XY†) = X·Y for SU(2): two quaternion products per loop. Returns W(R, T) as a function
 * with W.values (Float64Array, index (R−1)·Tmax + T−1: the vector to resample together), W.Rmax, W.Tmax.
 */
function wilsonLoops(lat, { Rmax, Tmax = Rmax, planes: chosen } = {}) {
  const { V, D, dims } = lat;
  const planes = chosen ?? Array.from({ length: D }, (_a, mu) => Array.from({ length: D - mu - 1 }, (_b, k) => [mu, mu + k + 1])).flat();
  if (!(Rmax >= 1 && Tmax >= 1)) throw new Error('wilsonLoops: Rmax and Tmax must be ≥ 1');
  for (const [mu, nu] of planes) {
    if (!(mu >= 0 && nu >= 0 && mu < D && nu < D && mu !== nu)) throw new Error(`wilsonLoops: bad plane [${mu}, ${nu}]`);
    if (Rmax >= dims[mu] || Tmax >= dims[nu]) throw new Error(`wilsonLoops: loops must not wrap: Rmax < ${dims[mu]}, Tmax < ${dims[nu]} in plane [${mu}, ${nu}]`);
  }
  const values = new Float64Array(Rmax * Tmax), X = new Float64Array(4), Y = new Float64Array(4);
  const lines = new Map(), shift = new Map();
  const L = mu => { if (!lines.has(mu)) { lines.set(mu, lineProducts(lat, mu, Math.max(Rmax, Tmax))); shift.set(mu, shifts(lat, mu, Math.max(Rmax, Tmax))); } return lines.get(mu); };
  const n = Math.max(Rmax, Tmax);
  for (const [mu, nu] of planes) {
    const Lm = L(mu), Ln = L(nu), Sm = shift.get(mu), Sn = shift.get(nu);
    for (let s = 0; s < V; s++) {
      for (let R = 1; R <= Rmax; R++) {
        const sR = Sm[s * (n + 1) + R];
        for (let T = 1; T <= Tmax; T++) {
          const sT = Sn[s * (n + 1) + T];
          qmulInto(X, 0, Lm, (s * n + R - 1) * 4, Ln, (sR * n + T - 1) * 4);     // along μ, then ν
          qmulInto(Y, 0, Ln, (s * n + T - 1) * 4, Lm, (sT * n + R - 1) * 4);     // along ν, then μ
          values[(R - 1) * Tmax + T - 1] += X[0] * Y[0] + X[1] * Y[1] + X[2] * Y[2] + X[3] * Y[3];
        }
      }
    }
  }
  for (let i = 0; i < values.length; i++) values[i] /= V * planes.length;
  const W = (R, T) => {
    if (!(R >= 1 && R <= Rmax && T >= 1 && T <= Tmax)) throw new Error(`wilsonLoops: W(${R}, ${T}) outside 1..${Rmax} × 1..${Tmax}`);
    return values[(R - 1) * Tmax + T - 1];
  };
  return Object.assign(W, { values, Rmax, Tmax });
}

/**
 * Polyakov loop: the ½Tr of the product of all links along `dir` (default the last axis, Euclidean
 * time), from every site with x_dir = 0. In a finite periodic box ⟨P⟩ ≈ 0 means the confined
 * phase; a large |⟨P⟩| means the box is too short/hot to confine. Returns { mean, values }.
 */
function polyakovLoop(lat, { dir = lat.D - 1 } = {}) {
  const { V, D, U, up, dims } = lat;
  const values = [], P = new Float64Array(4), t = new Float64Array(4);
  for (let s = 0; s < V; s++) {
    if (siteCoords(lat, s)[dir] !== 0) continue;
    P.set(U.subarray(4 * (s * D + dir), 4 * (s * D + dir) + 4));
    let x = up[s * D + dir];
    for (let k = 1; k < dims[dir]; k++) { qmulInto(t, 0, P, 0, U, 4 * (x * D + dir)); P.set(t); x = up[x * D + dir]; }
    values.push(P[0]);
  }
  return { mean: values.reduce((a, b) => a + b, 0) / values.length, values: Float64Array.from(values) };
}

/**
 * Local action density: values[s·nP + p] = 1 − ½Tr U_P for the plaquette at site s in plane
 * planes[p] = [μ, ν] (μ < ν). Its mean is 1 − plaquette(lat). Gauge invariant site by site.
 */
function plaquetteField(lat) {
  const { V, D, U, up } = lat;
  const planes = [];
  for (let mu = 0; mu < D; mu++) for (let nu = mu + 1; nu < D; nu++) planes.push([mu, nu]);
  const values = new Float64Array(V * planes.length), t = new Float64Array(8);
  for (let s = 0; s < V; s++) {
    planes.forEach(([mu, nu], p) => {
      qmulInto(t, 0, U, 4 * (s * D + mu), U, 4 * (up[s * D + mu] * D + nu));
      qmulInto(t, 4, U, 4 * (s * D + nu), U, 4 * (up[s * D + nu] * D + mu));
      values[s * planes.length + p] = 1 - (t[0] * t[4] + t[1] * t[5] + t[2] * t[6] + t[3] * t[7]);
    });
  }
  return { values, planes };
}

/**
 * APE smearing (Albanese et al., PLB 192 (1987) 163) of the links in `dirs` (default all but the
 * last axis: spatial smearing for time-slice operators), using only staples within `dirs`:
 *   U'_μ = Proj_SU(2)[ (1 − α) U_μ + α/(2(n − 1)) Σ_{ν ∈ dirs, ν ≠ μ} (staples) ],  n = |dirs|.
 * For SU(2) the projection is exact (normalise the quaternion). Links along other axes are copied.
 * Returns a new lattice object (same geometry) and leaves lat unchanged; smeared links are for
 * measurement only, never for updates.
 */
function apeSmear(lat, { alpha = 0.5, steps = 1, dirs: chosen } = {}) {
  const dirs = chosen ?? Array.from({ length: lat.D - 1 }, (_, k) => k);
  if (!(alpha >= 0 && alpha <= 1)) throw new Error('apeSmear: alpha must be in [0, 1]');
  if (dirs.length < 2) throw new Error('apeSmear: need at least two smearing directions');
  let cur = { ...lat, U: Float64Array.from(lat.U) };
  const A = new Float64Array(4), w = alpha / (2 * (dirs.length - 1));
  for (let k = 0; k < steps; k++) {
    const next = Float64Array.from(cur.U);
    for (let s = 0; s < lat.V; s++) {
      for (const mu of dirs) {
        staple(cur, s, mu, A, dirs);
        const o = 4 * (s * lat.D + mu);
        // staple() returns the dagger of the usual staple sum: Σ staples = A†
        const q = [(1 - alpha) * cur.U[o] + w * A[0], (1 - alpha) * cur.U[o + 1] - w * A[1], (1 - alpha) * cur.U[o + 2] - w * A[2], (1 - alpha) * cur.U[o + 3] - w * A[3]];
        const n = Math.hypot(...q);
        for (let i = 0; i < 4; i++) next[o + i] = q[i] / n;
      }
    }
    cur = { ...cur, U: next };
  }
  return cur;
}

/** Strong-coupling expansion of the average plaquette in d dimensions: u + 2(d − 2)u⁵, u = I₂(β)/I₁(β). Exact in d = 2 (infinite volume). */
function strongCouplingPlaquette(beta, d) {
  const u = besselI(2, beta) / besselI(1, beta);
  return u + 2 * (d - 2) * u ** 5;
}

// ---------------------------------------------------------------- topology (4D)

/** Ordered product of links along a path from site s; steps are +(μ+1) forward, −(μ+1) backward. */
function walk(lat, s0, steps, out, tmp) {
  const { D, U, up, dn } = lat;
  let s = s0;
  out[0] = 1; out[1] = out[2] = out[3] = 0;
  for (const d of steps) {
    if (d > 0) { qmulInto(tmp, 0, out, 0, U, 4 * (s * D + d - 1)); s = up[s * D + d - 1]; }
    else { s = dn[s * D - d - 1]; qmulInto(tmp, 0, out, 0, U, 4 * (s * D - d - 1), false, true); }
    out.set(tmp);
  }
}
const leafCache = new Map();
/** The four counter-clockwise n×n leaves of the clover in the (μ, ν) plane. */
function leaves(mu, nu, n) {
  const key = `${mu}${nu}${n}`;
  if (!leafCache.has(key)) {
    const m = mu + 1, v = nu + 1, rep = (d, k) => Array(k).fill(d);
    leafCache.set(key, [
      [...rep(m, n), ...rep(v, n), ...rep(-m, n), ...rep(-v, n)],
      [...rep(v, n), ...rep(-m, n), ...rep(-v, n), ...rep(m, n)],
      [...rep(-m, n), ...rep(-v, n), ...rep(m, n), ...rep(v, n)],
      [...rep(-v, n), ...rep(m, n), ...rep(v, n), ...rep(-m, n)],
    ]);
  }
  return leafCache.get(key);
}

/**
 * Gauge-invariant local densities from the clover field strength (4D only). The clover average of
 * n×n leaves gives F^a_μν = 2·vec(¼Σ leaves)/n²; improved: true combines 1×1 and 2×2 clovers as
 * (4F₁ − F₂)/3, cancelling the O(a²) error (de Forcrand, García Pérez & Stamatescu, NPB 499, 409 (1997)).
 *   s(x) = Σ_{μ<ν} |F_μν|²/(16π²)   action density in units of one instanton, 8π²/g² (∫s = 1 for one)
 *   q(x) = (1/8π²) Σ F·F̃ terms       topological charge density, Q = Σ q ≈ integer after smoothing
 * Sites [s0, s1) (default all). Returns { s, q, Q, S } (S = Σ s, so S ≥ |Q| with equality when self-dual).
 * Raw Monte Carlo configurations are dominated by noise: smooth first (sweep with cool: true).
 * Accuracy (tested on bpstInstanton): improved within 0.5 % for ρ ≥ 3.5a; plain clover ≈ 13 % low at ρ = 2.5a.
 */
function topology(lat, { improved = true, sites = [0, lat.V] } = {}) {
  if (lat.D !== 4) throw new Error('topology: the topological charge density needs d = 4');
  const planes = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
  const s = new Float64Array(lat.V), q = new Float64Array(lat.V);
  const F = planes.map(() => new Float64Array(3)), leaf = new Float64Array(4), tmp = new Float64Array(4);
  const PI2 = Math.PI * Math.PI;
  let Q = 0, S = 0;
  for (let x = sites[0]; x < sites[1]; x++) {
    planes.forEach(([mu, nu], p) => {
      let f1 = 0, f2 = 0, f3 = 0;
      for (const l of leaves(mu, nu, 1)) { walk(lat, x, l, leaf, tmp); f1 += leaf[1]; f2 += leaf[2]; f3 += leaf[3]; }
      F[p][0] = 0.5 * f1; F[p][1] = 0.5 * f2; F[p][2] = 0.5 * f3;
      if (improved) {
        let g1 = 0, g2 = 0, g3 = 0;
        for (const l of leaves(mu, nu, 2)) { walk(lat, x, l, leaf, tmp); g1 += leaf[1]; g2 += leaf[2]; g3 += leaf[3]; }
        F[p][0] = (4 * F[p][0] - g1 / 8) / 3; F[p][1] = (4 * F[p][1] - g2 / 8) / 3; F[p][2] = (4 * F[p][2] - g3 / 8) / 3;
      }
    });
    let ff = 0, fd = 0;
    for (const f of F) ff += f[0] * f[0] + f[1] * f[1] + f[2] * f[2];
    for (let a = 0; a < 3; a++) fd += F[0][a] * F[5][a] - F[1][a] * F[4][a] + F[2][a] * F[3][a];
    s[x] = ff / (16 * PI2); q[x] = fd / (8 * PI2);

}

/**
 * An exact BPST instanton of size rho (lattice units), centred between sites of a periodic L⁴
 * lattice, in singular gauge so the field decays as ρ²/|x|³ towards the edges (Belavin et al.,
 * PLB 59, 85 (1975)). Links are path-ordered exponentials of the continuum A_μ (substeps per link).

function bpstInstanton({ L = 16, rho = 3.5, anti = false, substeps = 8, beta = 2.4 } = {}) {
  const lat = createLattice({ L, d: 4, beta });

  // 't Hooft symbols η_aμν (a = 0..2 for σ1..3, μ = 0..3 with 3 the Euclidean time)
  const eta = (a, mu, nu) => {
    if (mu === nu) return 0;
    if (mu < 3 && nu < 3) { const e = [a, mu, nu]; return (e[0] - e[1]) * (e[1] - e[2]) * (e[2] - e[0]) / 2; }
    if (nu === 3) return a === mu ? 1 : 0;

    const den = x[0] ** 2 + x[1] ** 2 + x[2] ** 2 + x[3] ** 2 + rho * rho;
    for (let a = 0; a < 3; a++) { let v = 0; for (let nu = 0; nu < 4; nu++) v += eta(a, mu, nu) * x[nu]; out[a] = sign * 2 * v / den; }
  };

        wA.data('W', good.map(w => [w.R * w.T, w.mean]), { dots: true, errors: good.map(w => w.error), color: '--body-1', label: 'measured ⟨W(R,T)⟩ ± error', r: 3 });
        const s1 = good.find(w => w.R === o.R && w.T === o.T);
        if (s1) wA.marker('sel', s1.R * s1.T, s1.mean, { color: '--body-1', label: `${o.R}×${o.T} (drawn)` }); else wA.remove('sel');
        for (const p of [hP, hL, wA]) { p.invalidate(); p.draw(); }
      }
      eP.update(); eW.update(); eL.update();
    },
  };
}

// ------------------------------------------------------------------ presentation controls (no recomputation)
function extraSections(side, { section }) {
  const sec = section('4D view (presentation only)');
  sec.body.append(el('p', { class: 'psim-hint' }, 'These controls change only how the 4D lattice is projected and which loop is drawn. They do not touch the sampled configuration or any measured value.'));
  const projSel = select([{ value: 'perspective', label: 'Perspective from a 4D eye (Schlegel-like)' }, { value: 'orthographic', label: 'Orthographic (drop the 4th rotated axis)' }], V.mode, v => { V.mode = v; });
  sec.body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, '4D → 3D projection')), projSel));
  const spinT = toggle('Turn the x–t rotation slowly', V.spin, v => { V.spin = v; });
  const sx = slider({ label: 'Rotation in the x–t plane', min: 0, max: 360, value: V.xt, unit: '°', digits: 3, onInput: v => { V.xt = v; V.spin = false; spinT.querySelector('input').checked = false; } });
  const sy = slider({ label: 'Rotation in the y–t plane', min: -90, max: 90, value: V.yt, unit: '°', digits: 3, onInput: v => { V.yt = v; } });
  const sz = slider({ label: 'Rotation in the z–t plane', min: -90, max: 90, value: V.zt, unit: '°', digits: 3, onInput: v => { V.zt = v; } });
  sec.body.append(spinT, sx, sy, sz);
  const planeSel = select(PLANES.map(([value, label]) => ({ value, label: `plaquette in the ${label} plane` })), V.plane, v => { V.plane = v; });
  sec.body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, 'Highlighted plaquette')), planeSel));
  sec.body.append(
    slider({ label: 'Wilson loop extent R (space, x)', min: 1, max: 3, value: V.R, integer: true, onInput: v => { V.R = v; } }),
    slider({ label: 'Wilson loop extent T (Euclidean time)', min: 1, max: 3, value: V.T, integer: true, onInput: v => { V.T = v; } }),
    el('p', { class: 'psim-hint' }, 'Loops must fit without wrapping: R < L and T < N_t; larger values are shown at the largest size that fits.'));
  side.insertBefore(sec, side.children[1] ?? null);
}
