<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }

.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

// ---------------------------------------------------------------- 3D volumes

/**
 * A 3D scalar field (index i + nx·(j + ny·k)) rendered by ray marching through its box.
 * update(values, nx, ny, nz, { range, log }); draw(camera, { box: [[x0,y0,z0],[x1,y1,z1]],
 * colormap, opacity, steps, mode }) with mode 'emission' (glowing gas: colour ∝ density, adds up)
 * or 'absorption' (emission–absorption: nearer matter hides farther). Opacity is a display
 * transfer function, not a physical optical depth unless you derive it from one: say which.

 * Smooth volumes are ray-marched at reduced resolution (≤ ~1.5 M rays) and upscaled; pass

  const vao = gl.createVertexArray(), buf = gl.createBuffer(), tex = gl.createTexture();

  const loc = gl.getAttribLocation(p, 'aXY'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

in vec2 aXY; out vec2 vUV;
void main() { vUV = aXY; gl_Position = vec4(aXY * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */
function createSphereRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;

  vec3 c = (uView * vec4(aCenter, 1.0)).xyz;

  vec3 q = c + vec3(aCorner * s, 0.0);

  gl_Position = uProj * vec4(q, 1.0);
}`, `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;
out vec4 frag;

      spheres.forEach((sp, i) => {
        const c = rgb(sp.color ?? '#cfd8e3');

      });
      const { view, proj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight, { relative: true });
      gl.useProgram(p); gl.bindVertexArray(vao);

    },
  };
}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.
 * Dashed lines are for reference overlays (analytic curves), solid for computed paths.

in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;

  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);

            buf[o] = l[i] - t0; buf[o + 1] = l[i + 1] - t1; buf[o + 2] = l[i + 2] - t2;

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns

// geometry along the beam axis y (metres)
const GEOM = {
  oven: -0.17, slit1: -0.15, slit2: -0.05, slitHalf: 10e-6,
  L: 0.035, A: 2e-3,                                     // magnet length (Gerlach & Stern 1922: 3.5 cm), aperture half-size
  mags: { SG1: 0, SG2: 0.06, SG3: 0.12 }, stops: { S1: 0.05, S2: 0.11 },
  detector: 0.25, plateHalf: 12e-3,
};

const SETUPS = [
  { value: 'single', label: 'One magnet (z): Gerlach & Stern 1922' },
  { value: 'zxz', label: 'z → block − → x → block − → z' },
  { value: 'ztheta', label: 'z → block − → analyser at angle θ' },
];

const PARAMS = [
  { key: 'G', label: 'Field gradient ∂B/∂n', min: 50, max: 3000, value: 1000, log: true, unit: 'T/m',
    hint: 'Gerlach & Stern 1922: of order 10 T/cm = 1000 T/m. Deflection ∝ G.' },
  { key: 'T', label: 'Oven temperature', min: 900, max: 1800, value: 1273, unit: 'K',
    hint: 'Silver melts at 1235 K. Hotter atoms are faster and are deflected less.' },
  { key: 'setup', label: 'Apparatus', value: 'single', options: SETUPS },
  { key: 'theta', label: 'Analyser angle θ (last magnet, about the beam)', min: 0, max: 180, value: 60, unit: '°',
    hint: 'Used by the “analyser at angle θ” apparatus. Quantum prediction: P(+) = cos²(θ/2).' },
  { key: 'model', label: 'Magnetic moment', value: 'quantum', options: [
    { value: 'quantum', label: 'Quantum spin ½ (Born rule)' },
    { value: 'classical', label: 'Classical moment, random direction' }] },
  { key: 'atoms', label: 'Atoms in the run', min: 1000, max: 40000, value: 16000, log: true, integer: true },
  { key: 'seed', label: 'Random seed', min: 1, max: 999, value: 7, integer: true },
];

const RATE = 400;                                // simulated atoms per ms (a sample, not the real flux)
const DEG = Math.PI / 180;

// ------------------------------------------------------------------ apparatus layout
function layout(p) {
  const th = (p.theta ?? 0) * DEG, mag = (name, ang) => ({ name, y0: GEOM.mags[name], ang, n: [Math.sin(ang), 0, Math.cos(ang)], m: [Math.cos(ang), 0, -Math.sin(ang)] });
  const stop = (name, ang) => ({ name, y: GEOM.stops[name], ang, n: [Math.sin(ang), 0, Math.cos(ang)] });
  let lay;
  if (p.setup === 'zxz') lay = { mags: [mag('SG1', 0), mag('SG2', 90 * DEG), mag('SG3', 0)], stops: [stop('S1', 0), stop('S2', 90 * DEG)] };
  else if (p.setup === 'ztheta') lay = { mags: [mag('SG1', 0), mag('SG3', th)], stops: [stop('S1', 0)] };
  else lay = { mags: [mag('SG1', 0)], stops: [] };
  // Alignment, as an experimenter would do it: each later magnet is centred (in x, z) on the
  // selected (+) beam of the median speed at the magnet's middle. Depends on G and T.
  const vMed = Math.sqrt(2 * kB * (p.T ?? 1273) * U_MEDIAN / M_AG), a = MU * (p.G ?? 1000) / M_AG;
  lay.mags.forEach((m, k) => {
    m.c = [0, 0, 0];
    for (const up of lay.mags.slice(0, k)) {
      const d = m.y0 + GEOM.L / 2 - (up.y0 + GEOM.L);            // drift from the upstream exit to this magnet's middle
      const off = a * (GEOM.L * GEOM.L / 2 + GEOM.L * d) / (vMed * vMed);
      for (let j = 0; j < 3; j++) m.c[j] += up.n[j] * off;
    }
  });
  return lay;
}
/** Median of u = mv²/2kT for the effusive beam: (1 + u)e^{−u} = ½. */
const U_MEDIAN = (() => { let lo = 0.5, hi = 4; for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if ((1 + mid) * Math.exp(-mid) > 0.5) lo = mid; else hi = mid; } return (lo + hi) / 2; })();

// ------------------------------------------------------------------ spin-½ algebra (spinor [ar, ai, br, bi])
/** |+n̂⟩ (sign +1) or |−n̂⟩ (sign −1) for a unit vector n. */
function ket(n, sign = 1) {
  const [x, y, z] = n;
  if (sign > 0) {
    if (z < -1 + 1e-15) return [0, 0, 1, 0];
    const c = Math.sqrt((1 + z) / 2), k = 1 / Math.sqrt(2 * (1 + z));
    return [c, 0, x * k, y * k];
  }
  if (z > 1 - 1e-15) return [0, 0, 1, 0];
  // |−n⟩ = |+(−n)⟩ up to a global phase
  const c = Math.sqrt((1 - z) / 2), k = 1 / Math.sqrt(2 * (1 - z));
  return [c, 0, -x * k, -y * k];
}
/** |⟨φ|ψ⟩|² */
function overlap2(phi, psi) {
  const re = phi[0] * psi[0] + phi[1] * psi[1] + phi[2] * psi[2] + phi[3] * psi[3];
  const im = phi[0] * psi[1] - phi[1] * psi[0] + phi[2] * psi[3] - phi[3] * psi[2];
  return re * re + im * im;
}
/** Exact unitary exp(−i φ σ·n̂ / 2) applied to ψ (rotates the Bloch vector by +φ about n̂). */
function applyU(psi, n, phi) {
  const c = Math.cos(phi / 2), s = Math.sin(phi / 2), [nx, ny, nz] = n;
  const [ar, ai, br, bi] = psi;
  // (n·σ)ψ = [nz a + (nx − i ny) b, (nx + i ny) a − nz b]
  const sa_r = nz * ar + nx * br + ny * bi, sa_i = nz * ai + nx * bi - ny * br;
  const sb_r = nx * ar - ny * ai - nz * br, sb_i = nx * ai + ny * ar - nz * bi;
  // c ψ − i s (n·σ)ψ
  return [c * ar + s * sa_i, c * ai - s * sa_r, c * br + s * sb_i, c * bi - s * sb_r];
}
function bloch(psi) {
  const [ar, ai, br, bi] = psi;
  return [2 * (ar * br + ai * bi), 2 * (ar * bi - ai * br), ar * ar + ai * ai - br * br - bi * bi];
}
/** Rodrigues rotation of a vector s by angle φ about unit axis n (classical precession). */
function rotate(s, n, phi) {
  const c = Math.cos(phi), sn = Math.sin(phi), d = s[0] * n[0] + s[1] * n[1] + s[2] * n[2];
  const cx = n[1] * s[2] - n[2] * s[1], cy = n[2] * s[0] - n[0] * s[2], cz = n[0] * s[1] - n[1] * s[0];
  return [s[0] * c + cx * sn + n[0] * d * (1 - c), s[1] * c + cy * sn + n[1] * d * (1 - c), s[2] * c + cz * sn + n[2] * d * (1 - c)];
}

// ------------------------------------------------------------------ beam
/** Effusive-beam speed CDF: F(v) = 1 − (1 + u) e^{−u}, u = m v² / 2kT. */
const speedCdf = (v, T) => { const u = M_AG * v * v / (2 * kB * T); return 1 - (1 + u) * Math.exp(-u); };
const speedPdf = (v, T) => { const al = M_AG / (2 * kB * T); return 2 * al * al * v ** 3 * Math.exp(-al * v * v); };
const meanSpeed = T => 0.75 * Math.sqrt(2 * Math.PI * kB * T / M_AG);
function sampleSpeed(r, T) { const uu = -Math.log((1 - r()) * (1 - r())); return Math.sqrt(2 * kB * T * uu / M_AG); }

/** Deflection constant K (m³/s²): single-magnet spot displacement at the detector Δ = ±K / v². */
function deflectionK(G, L = GEOM.L, D = GEOM.detector - GEOM.mags.SG1 - GEOM.L) {
  return MU * G / M_AG * (L * L / 2 + L * D);
}
/** Analytic single-magnet detector profiles (ideal point beam), density in 1/m of the coordinate z. */
function profileQuantum(z, G, T) { const c = M_AG / (2 * kB * T) * deflectionK(G), a = Math.abs(z); if (!(a > 0)) return 0; const u = c / a; return 0.5 * u * u * Math.exp(-u) / a; }
function profileClassical(z, G, T) { const c = M_AG / (2 * kB * T) * deflectionK(G), a = Math.abs(z); return a > 0 ? gammaP(3, c / a) / c : 1 / c; }
/** Classical P(projection on the analyser > 0) after SG1(z) and blocking the lower beam (c uniform on (0,1], random precession phase). */
function classicalAnalyserP(theta) {
  const ct = Math.cos(theta), st = Math.abs(Math.sin(theta));
  const g = c => {
    const s = Math.sqrt(Math.max(0, 1 - c * c)), A = c * ct;
    if (st * s <= Math.abs(A)) return A > 0 ? 1 : A < 0 ? 0 : 0.5;
    return Math.acos(Math.max(-1, Math.min(1, -A / (st * s)))) / Math.PI;
  };
  return gaussLegendre(g, 0, 1, 64);
}
/** Quantum Born prediction for P(m = +½ along the last analyser), detected atoms. */
function bornP(p) {
  if (p.setup === 'ztheta') return Math.cos(p.theta * DEG / 2) ** 2;
  return 0.5;                                          // unpolarised beam (single), or |+x⟩ into a z analyser (zxz)
}

// ------------------------------------------------------------------ one atom
const FATE = { plate: 0, stop: 1, pole: 2, miss: 3 };

function hash(seed, i) { let h = Math.imul(seed ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(i + 1, 0xC2B2AE35); h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; return h >>> 0; }

/** Earliest t in (0, τ] where |w0 + vw t + ½ a t²| reaches A (Infinity if never). */
function exitTime(w0, vw, a, A, tau) {
  if (Math.abs(w0) > A) return 0;
  let best = Infinity;
  for (const b of [A, -A]) {
    // ½ a t² + vw t + (w0 − b) = 0
    const qa = 0.5 * a, qb = vw, qc = w0 - b;
    if (Math.abs(qa) < 1e-300) { if (qb !== 0) { const t = -qc / qb; if (t > 0 && t <= tau) best = Math.min(best, t); } continue; }
    const disc = qb * qb - 4 * qa * qc;
    if (disc < 0) continue;
    const sq = Math.sqrt(disc), q = -0.5 * (qb + Math.sign(qb || 1) * sq);
    for (const t of [q / qa, q !== 0 ? qc / q : Infinity]) if (t > 0 && t <= tau) best = Math.min(best, t);
  }
  return best;
}

/**
 * Trace one atom through the apparatus. Returns its path as breakpoints {t, r, v, acc, proj}
 * (proj = spin/moment projection on the axis of the magnet last passed; NaN before the first),
 * its fate, end point, per-magnet results and the field-free ("undeflected") end position.
 * opts.ideal: no apertures and an infinite plate (for distribution checks);
 * opts.init: override { v, r0, dir, spin } (deterministic checks).
 */
function traceAtom(p, lay, i, { ideal = false, init } = {}) {
  const r = rng(hash(p.seed, i));
  const classical = p.model === 'classical';
  // speed and direction through both slits
  const v = init?.v ?? sampleSpeed(r, p.T);
  const h = GEOM.slitHalf;
  const p1 = [(2 * r() - 1) * h, GEOM.slit1, (2 * r() - 1) * h], p2 = [(2 * r() - 1) * h, GEOM.slit2, (2 * r() - 1) * h];
  let dir = init?.dir ?? [p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]];
  const dl = Math.hypot(...dir); dir = dir.map(c => c / dl);
  const vel = dir.map(c => c * v);
  // start at the oven exit plane, on the straight line through both slits
  const back = (GEOM.oven - p1[1]) / dir[1];
  const pos = init?.r0 ? [...init.r0] : [p1[0] + dir[0] * back, GEOM.oven, p1[2] + dir[2] * back];
  // spin: uniform random pure state (unpolarised ensemble) or a classical random direction
  const cz = 2 * r() - 1, ph = 2 * Math.PI * r(), sz = Math.sqrt(1 - cz * cz);
  let s = init?.spin ?? [sz * Math.cos(ph), sz * Math.sin(ph), cz];
  let psi = ket(s, 1);
  const vy = vel[1];
  let t = 0, proj = NaN;
  const pts = [{ t, r: [...pos], v: [...vel], acc: [0, 0, 0], proj }];
  const results = [];
  const free = [...pos], freeV = [...vel];
  const drift = y => { const dt = (y - pos[1]) / vy; for (let k = 0; k < 3; k++) pos[k] += vel[k] * dt; t += dt; };
  const end = (fate, where) => ({ v, vy, pts, fate, where, end: [...pos], t, results, free: [0, 1, 2].map(k => free[k] + freeV[k] * (pos[1] - free[1]) / vy), spin: classical ? s : bloch(psi) });
  const events = [...lay.mags.map(m => ({ kind: 'mag', y: m.y0, m })), ...lay.stops.map(st => ({ kind: 'stop', y: st.y, st }))].sort((a, b) => a.y - b.y);
  const A = GEOM.A;
  for (const ev of events) {
    drift(ev.y);
    if (ev.kind === 'stop') {
      pts.push({ t, r: [...pos], v: [...vel], acc: [0, 0, 0], proj });
      if (!ideal && pos[0] * ev.st.n[0] + pos[2] * ev.st.n[2] < 0) return end(FATE.stop, ev.st.name);
      continue;
    }
    const m = ev.m, n = m.n;
    // measurement / moment projection at the entrance
    let c;
    if (classical) c = s[0] * n[0] + s[1] * n[1] + s[2] * n[2];
    else {
      const pUp = overlap2(ket(n, 1), psi);
      c = r() < pUp ? 1 : -1;
      psi = ket(n, c);
    }
    proj = c;
    const acc = MU * p.G / M_AG * c;
    const tau = GEOM.L / vy;
    const w0 = (pos[0] - m.c[0]) * n[0] + (pos[2] - m.c[2]) * n[2], vw = vel[0] * n[0] + vel[2] * n[2];
    const u0 = (pos[0] - m.c[0]) * m.m[0] + (pos[2] - m.c[2]) * m.m[2], vu = vel[0] * m.m[0] + vel[2] * m.m[2];
    let tIn = tau;
    if (!ideal) tIn = Math.min(tau, exitTime(w0, vw, acc, A, tau), exitTime(u0, vu, 0, A, tau));
    pts.push({ t, r: [...pos], v: [...vel], acc: n.map(q => q * acc), proj });
    // exact spin evolution over the time spent inside: φ = γ ∫ (B₀ − G w) dt
    const B0 = p.G * A + 1;                                          // T; keeps |B| ≥ 1 T over the aperture
    const phi = GAMMA * (B0 * tIn - p.G * (w0 * tIn + vw * tIn * tIn / 2 + acc * tIn ** 3 / 6));
    if (classical) s = rotate(s, n, phi); else psi = applyU(psi, n, phi);
    for (let k = 0; k < 3; k++) { pos[k] += vel[k] * tIn + 0.5 * n[k] * acc * tIn * tIn; vel[k] += n[k] * acc * tIn; }
    t += tIn;
    results.push({ name: m.name, proj: c, spinAfter: classical ? [...s] : bloch(psi) });
    pts.push({ t, r: [...pos], v: [...vel], acc: [0, 0, 0], proj });
    if (tIn < tau) return end(FATE.pole, m.name);
  }
  drift(GEOM.detector);
  pts.push({ t, r: [...pos], v: [...vel], acc: [0, 0, 0], proj });
  const onPlate = ideal || (Math.abs(pos[0]) <= GEOM.plateHalf && Math.abs(pos[2]) <= GEOM.plateHalf);
  return end(onPlate ? FATE.plate : FATE.miss, 'detector');
}

/** Position on a traced path at time t after emission (exact parabola inside a segment). */
function pathAt(tr, t, out = [0, 0, 0]) {
  const P = tr.pts;
  let k = 0;
  while (k + 1 < P.length && P[k + 1].t <= t) k++;
  const a = P[k], dt = Math.min(t, tr.t) - a.t;
  for (let j = 0; j < 3; j++) out[j] = a.r[j] + a.v[j] * dt + 0.5 * a.acc[j] * dt * dt;
  return { pos: out, proj: a.proj, seg: k };
}

// ------------------------------------------------------------------ run statistics (shared by sim and verify)
function runStats(p, lay, N, opts = {}) {
  const res = [];
  for (let i = 0; i < N; i++) res.push(traceAtom(p, lay, i, opts));
  return res;
}
function lastOutcome(tr) { const r = tr.results[tr.results.length - 1]; return r ? r.proj : NaN; }

// ------------------------------------------------------------------ the simulation
function createSim(params) {
  const p = { ...params };
  const lay = layout(p);
  const N = Math.max(1, Math.round(p.atoms));
  const born = bornP(p);
  // emission: Poisson process at RATE atoms per ms (seeded, independent stream)
  const er = rng(hash(p.seed, 0x7fffffff));
  const te = new Float64Array(N), tEnd = new Float64Array(N), fate = new Int8Array(N), outc = new Float32Array(N), speed = new Float64Array(N);
  const endPos = new Float64Array(3 * N), defl = new Float64Array(N), lastProj = new Float32Array(N);
  let tt = 0;
  const ln = lay.mags[lay.mags.length - 1].n;
  for (let i = 0; i < N; i++) {
    tt += -Math.log(1 - er()) / RATE;
    const tr = traceAtom(p, lay, i);
    te[i] = tt; tEnd[i] = tt + tr.t * 1e3; fate[i] = tr.fate; speed[i] = tr.v;
    outc[i] = tr.fate === FATE.plate ? lastOutcome(tr) : NaN;
    lastProj[i] = tr.results.length === lay.mags.length ? lastOutcome(tr) : NaN;
    endPos.set(tr.end, 3 * i);
    defl[i] = (tr.end[0] - tr.free[0]) * ln[0] + (tr.end[2] - tr.free[2]) * ln[2];
  }
  const order = Array.from({ length: N }, (_, i) => i).sort((a, b) => tEnd[a] - tEnd[b]);
  // hits in arrival order, in world coordinates (x, z in mm; y in cm)
  const hitWorld = new Float32Array(3 * N), hitProj = new Float32Array(N), hitFate = new Int8Array(N);
  order.forEach((i, k) => {
    hitWorld[3 * k] = endPos[3 * i] * 1e3; hitWorld[3 * k + 1] = endPos[3 * i + 1] * 1e2; hitWorld[3 * k + 2] = endPos[3 * i + 2] * 1e3;
    hitProj[k] = fate[i] === FATE.plate ? outc[i] : NaN; hitFate[k] = fate[i];
  });
  const flightMax = 6;                                   // ms: atoms slower than ~70 m/s are not drawn in flight (still counted)
  let t = 0, shown = 0, emitted = 0;
  const cnt = { plate: 0, up: 0, down: 0, aUp: 0, aDown: 0, sumAbs: 0, stop: 0, pole: 0, miss: 0, band: 0, plus: [] };
  const lastMag = lay.mags[lay.mags.length - 1];
  const traceCache = new Map();
  const dt = 0.005;

  function absorb(k) {
    const i = order[k];
    if (!Number.isNaN(lastProj[i])) { if (lastProj[i] > 0) cnt.aUp++; else cnt.aDown++; }
    if (fate[i] === FATE.plate) {
      cnt.plate++;
      cnt.sumAbs += Math.hypot(endPos[3 * i], endPos[3 * i + 2]);
      if (outc[i] > 0) cnt.up++; else cnt.down++;
      if (p.setup === 'single') {
        if (Math.abs(endPos[3 * i + 2]) < 0.1e-3) cnt.band++;
        if (outc[i] > 0 && p.model === 'quantum') cnt.plus.push(defl[i]);
      }
    } else if (fate[i] === FATE.stop) cnt.stop++;
    else if (fate[i] === FATE.pole) cnt.pole++;
    else cnt.miss++;
  }

  const sim = {
    params: p, layout: lay, N, born, hitWorld, hitProj, hitFate, order, te, tEnd, speed,
    get t() { return t; },
    get shown() { return shown; },
    get emitted() { return emitted; },
    get counts() { return cnt; },
    duration: tEnd[order[N - 1]],
    step() {
      t += dt;
      while (shown < N && tEnd[order[shown]] <= t) absorb(shown++);
      while (emitted < N && te[emitted] <= t) emitted++;
    },
    advanceTo(T) { while (t < T) sim.step(); },
    /** Atoms in flight at time t: [{ i, tr, pos, proj, seg }] (trajectories re-traced deterministically). */
    inFlight(tNow = t) {
      const out = [];
      let lo = 0, hi = N;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (te[mid] < tNow - flightMax) lo = mid + 1; else hi = mid; }
      for (let i = lo; i < N && te[i] <= tNow; i++) {
        if (tEnd[i] <= tNow) { traceCache.delete(i); continue; }
        let tr = traceCache.get(i);
        if (!tr) { tr = traceAtom(p, lay, i); traceCache.set(i, tr); }
        const at = pathAt(tr, (tNow - te[i]) * 1e-3);
        out.push({ i, tr, pos: at.pos, proj: at.proj, seg: at.seg });
      }
      if (traceCache.size > 4000) traceCache.clear();
      return out;
    },
    /** Recently finished atoms (for faint full trajectories). */
    recent(count, tNow = t) {
      const out = [];
      for (let k = shown - 1; k >= 0 && out.length < count; k--) {
        const i = order[k];
        let tr = traceCache.get(i);
        if (!tr) tr = traceAtom(p, lay, i);
        out.push({ i, tr, age: tNow - tEnd[i] });
      }
      return out;
    },
    /** Branch fraction at the last analyser (all atoms that entered it): the Born-rule statistic. */
    measuredP() {
      const n = cnt.aUp + cnt.aDown;
      if (n < 1) return null;
      const P = cnt.aUp / n;
      return { P, err: Math.sqrt(Math.max(P * (1 - P), 1 / n) / n), n };
    },
    medianPlus() {
      if (cnt.plus.length < 50) return null;
      const s = Float64Array.from(cnt.plus).sort();
      return s[s.length >> 1];
    },
    diagnostics() {
      const d = [
        { key: 'emitted', label: 'atoms emitted', value: emitted, text: `${emitted} of ${N}` },
        { key: 'plate', label: 'hits on the detector plate', value: cnt.plate, text: String(cnt.plate) },
        { key: 'lost', label: 'stopped: beam stops / pole faces / off plate', value: cnt.stop + cnt.pole + cnt.miss, text: `${cnt.stop} / ${cnt.pole} / ${cnt.miss}` },
      ];
      const m = sim.measuredP(), q = p.model === 'quantum', name = q ? `P(m = +½ along ${lastMag.name})` : `P(μ·n̂ > 0 in ${lastMag.name})`;
      if (!m || m.n < 30) d.push({ key: 'P', label: name, value: 0, pending: true });
      else {
        d.push({ key: 'P', label: `${name}, all atoms entering it`, value: m.P, text: `${m.P.toFixed(3)} ± ${m.err.toFixed(3)} (n = ${m.n})` });
        if (q) d.push({ key: 'pull', label: 'Born prediction · pull', value: (m.P - born) / m.err, text: `${born.toFixed(3)} · ${((m.P - born) / m.err).toFixed(2)} σ` });

  const gridCol = light ? [0.35, 0.42, 0.55] : [0.55, 0.65, 0.8];
  for (let k = -ph; k <= ph + 1e-9; k += 2) {
    lines.push({ points: [k, yd, -ph, k, yd, ph], color: gridCol, opacity: k === 0 ? 0.55 : 0.18 }, { points: [-ph, yd, k, ph, yd, k], color: gridCol, opacity: k === 0 ? 0.55 : 0.18 });
  }
  labels.push({ p: [0, yd, -ph - 1.6], text: 'detector plate (2 mm grid)' });
  // beam axis (reference, dashed) and stretched-scale bar near the oven
  const ref = [[0, -17, 0, 0, yd, 0]];
  const sc = [[0, -13, -7, 0, -11, -7], [0, -13, -7, 0, -13, -5]];
  labels.push({ p: [0, -12, -8.4], text: '2 cm', small: true }, { p: [0, -13, -4.3], text: '2 mm', small: true });
  return { items, lines, labels, ref, sc };
}

function uploadHits(sim, light) {
  const n = sim.N, col = new Float32Array(3 * n);
  for (let k = 0; k < n; k++) {
    const c = sim.hitFate[k] === FATE.plate ? spinColor(sim.hitProj[k], light) : light ? [0.35, 0.37, 0.42] : [0.55, 0.57, 0.62];
    col.set(c, 3 * k);
  }
  R.hits.update(sim.hitWorld, { colors: col });
}

/** Polyline pieces (one colour each) of an atom's path up to tRel seconds after emission. */
function pathPieces(tr, tRel, light, opacity) {
  const out = [], P = tr.pts;
  for (let k = 0; k + 1 < P.length && P[k].t < tRel; k++) {
    const a = P[k], t1 = Math.min(P[k + 1].t, tRel), curved = a.acc[0] || a.acc[2], ns = curved ? 8 : 1, pts = [];
    for (let j = 0; j <= ns; j++) {
      const dt = (t1 - a.t) * j / ns;
      pts.push(...W([0, 1, 2].map(q => a.r[q] + a.v[q] * dt + 0.5 * a.acc[q] * dt * dt)));
    }
    out.push({ points: pts, color: spinColor(a.proj, light), opacity });
  }
  return out;
}

let curSim = null;
function drawGL(gl, sim, view) {
  curSim = sim;
  if (!R) {
    R = { mesh: createMeshRenderer(gl), lines: createLineRenderer(gl), ref: createLineRenderer(gl), atoms: createPointRenderer(gl), hits: createPointRenderer(gl) };
    R.box = R.mesh.add(geometry.box(1, 1, 1));
    R.cyl = R.mesh.add(geometry.cylinder(1, 1, 40));
    R.groove = R.mesh.add(extrude(groove, Y(GEOM.L), [0, 5]));
    R.knife = R.mesh.add(extrude(knife, Y(GEOM.L), [0, -5]));
  }
  const light = document.documentElement.dataset.theme === 'light';
  if (!lastAspect || Math.abs(view.W / view.H - lastAspect) > 0.02) fitDefault(view);
  if (!scene || scene.sim !== sim || scene.light !== light) { scene = { sim, light, ...buildScene(sim, light) }; }
  if (hitsFor !== sim || hitsFor?.light !== light) { uploadHits(sim, light); hitsFor = sim; sim.light = light; }
  const aspect = view.W / view.H;
  R.mesh.draw(cam, scene.items, { aspect, light: { direction: [0.45, -0.55, 1] }, ambient: light ? 0.45 : 0.32 });
  // reference axis (dashed) and scale bar
  R.ref.update(scene.ref);
  R.ref.draw(cam, { aspect, width: 1, color: light ? '#7a8494' : '#5d6878', dash: [0.6, 0.6] });
  // trajectories: recently finished atoms (faint) and atoms in flight (path so far)
  const t = sim.t, lines = [...scene.lines, ...scene.sc.map(points => ({ points, color: light ? [0.2, 0.22, 0.27] : [0.85, 0.87, 0.92], opacity: 0.9 }))];
  if (viewOpts.recent) for (const r of sim.recent(36, t)) lines.push(...pathPieces(r.tr, r.tr.t, light, 0.14 * Math.exp(-r.age / 2)));
  const flying = sim.inFlight(t);
  if (viewOpts.trails) for (const f of flying) lines.push(...pathPieces(f.tr, (t - sim.te[f.i]) * 1e-3, light, 0.32));
  R.lines.update(lines);
  R.lines.draw(cam, { aspect, width: 1.3 });
  // accumulated hits (computed end points, in arrival order) and atoms in flight
  R.hits.draw(cam, { aspect, size: 2.6, blend: 'alpha', soft: true, opacity: light ? 0.85 : 0.75, count: sim.shown });
  if (flying.length) {
    const pos = new Float32Array(3 * flying.length), col = new Float32Array(3 * flying.length);
    flying.forEach((f, k) => { pos.set(W(f.pos), 3 * k); col.set(spinColor(f.proj, light), 3 * k); });
    R.atoms.update(pos, { colors: col });
    R.atoms.draw(cam, { aspect, size: light ? 5 : 7, blend: light ? 'alpha' : 'additive', soft: true });
  }
}

function draw(ctx, sim, view) {
  if (!scene) return;
  const C = view.color;
  ctx.textAlign = 'center';
  for (const l of scene.labels) {
    const q = cam.project(l.p, view.W, view.H);
    if (!q.visible || q.x < 8 || q.x > view.W - 8 || q.y < 8 || q.y > view.H - 8) continue;
    ctx.font = l.strong ? '600 12px system-ui, sans-serif' : l.small ? '11px ui-monospace, Menlo, monospace' : '11.5px system-ui, sans-serif';
    ctx.fillStyle = C(l.strong ? '--ink' : '--muted');
    ctx.fillText(l.text, q.x, q.y);
  }
  ctx.textAlign = 'start';
  // colour bar for the spin / moment projection
  const quantum = sim.params.model === 'quantum';
  const label = quantum ? '2·m_s along n̂' : 'μ·n̂ / μ', fmt = v => (v > 0 ? `+${v}` : String(v).replace('-', '−'));
  ctx.font = '10.5px system-ui, sans-serif';
  if (view.W < 640) {
    // phones: horizontal bar at the top right, clear of the HUD (top left) and the legend (bottom right)
    drawColorBar(ctx, { x: 18, y: view.H - 44, width: 96, height: 8, colormap: 'coolwarm', range: [-1, 1], ticks: 3, horizontal: true, label, format: fmt });
  } else {
    drawColorBar(ctx, { x: 18, y: view.H - 170, width: 10, height: 76, colormap: 'coolwarm', range: [-1, 1], ticks: 3, label, format: fmt });
    ctx.fillStyle = C('--muted');
    ctx.fillText(quantum ? 'grey: before SG1 (unpolarised)' : 'grey: before SG1', 18, view.H - 78);
  }
}

// ------------------------------------------------------------------ workbench: equations and figures
function bench({ eqs, figs, createPlot, createEquation, M }) {
  const face = createPlot({ title: 'Detector face, true scale (hits so far)', height: 300, legend: true,
    x: { label: 'x', unit: 'mm', min: -8, max: 8 }, y: { label: 'z', unit: 'mm', min: -8, max: 8 } });
  const prof = createPlot({ title: 'Profile along the last analyser axis n̂', height: 300,
    x: { label: 'r·n̂ on the plate', unit: 'mm', min: -8, max: 8 }, y: { label: 'hits per 0.1 mm', min: 0, max: 1 } });
  const born = createPlot({ title: 'Last analyser: P(m = +½ along n̂)', height: 280,
    x: { label: 'angle Θ between prepared spin and analyser', unit: '°', min: 0, max: 180 }, y: { label: 'P(+)', min: 0, max: 1 } });
  const speed = createPlot({ title: 'Speeds of emitted atoms (effusive beam)', height: 280,
    x: { label: 'speed v', unit: 'm/s', min: 0, max: 1600 }, y: { label: 'probability density', unit: 's/m' } });
  figs.append(face.el, prof.el, born.el, speed.el);
  const cap = (fig, text) => fig.el.append(Object.assign(document.createElement('p'), { className: 'psim-hint', textContent: text }));
  cap(face, 'Every computed end point on the plate: red = +½ (or μ·n̂ > 0), blue = −½ along the last magnet axis. Monte Carlo, exact trajectories.');
  cap(prof, 'Histogram of plate hits; solid/dashed: analytic profiles for one magnet (quantum two spots, classical smear), point-beam approximation.');
  cap(born, 'Solid: quantum cos²(Θ/2). Dashed: classical moments for z → block → analyser (computed average). Dot: this run, branch fraction of all atoms entering the analyser ± 1σ.');
  cap(speed, 'Histogram of emitted speeds vs the exact flux-weighted law (solid). Monte Carlo sample, exact sampler.');

  const cur = { G: 1000, T: 1273, v: 574, D: 0.215, Th: 90 };
  const deflect = createEquation({
    title: 'Deflection by one magnet (uniform gradient), values at the median speed',
    lhs: { mathml: `<mi>Δ</mi>`, label: 'displacement on the plate', unit: 'mm', digits: 4, value: () => 1e3 * MU * cur.G / M_AG * (GEOM.L ** 2 / 2 + GEOM.L * cur.D) / cur.v ** 2 },
    op: '= ±',
    terms: [
      { id: 'acc', mathml: M.frac(`${M.i('μ')}${M.i('G')}`, M.i('m')), label: 'acceleration μG/m', unit: 'm/s²', color: '--body-2', value: () => MU * cur.G / M_AG },
      { id: 'geo', sign: '×', mathml: M.paren(`${M.frac(M.sup(M.i('L'), M.n(2)), M.n(2))}<mo>+</mo>${M.i('L')}${M.i('D')}`), label: 'inside the magnet + drift to the plate', unit: 'm²', color: '--body-1', value: () => GEOM.L ** 2 / 2 + GEOM.L * cur.D },
      { id: 'v', sign: '×', mathml: M.frac(M.n(1), M.sup(M.i('v'), M.n(2))), label: 'slower atoms are deflected more', unit: 's²/m²', color: '--body-0', value: () => 1 / cur.v ** 2 },
    ],
    where: [
      { mathml: M.i('μ'), meaning: 'g_e μ_B / 2 (Ag 5s electron spin)', value: () => MU, unit: 'J/T' },
      { mathml: M.i('m'), meaning: 'Ag atom, 107.8682 u', value: () => M_AG, unit: 'kg' },
      { mathml: M.i('v'), meaning: 'median speed of the beam', value: () => cur.v, unit: 'm/s' },
    ],
  });
  const bornEq = createEquation({
    title: 'Born rule at an analyser rotated by Θ from the prepared spin',
    lhs: { mathml: `<mi>P</mi><mo>(</mo><mo>+</mo><mo>)</mo>`, label: 'probability of m = +½ along n̂', value: () => Math.cos(cur.Th * DEG / 2) ** 2, digits: 4 },
    terms: [{ id: 'born', mathml: `<msup><mrow><mo>|</mo><mo>⟨</mo><mo>+</mo><mi>n̂</mi><mo>|</mo><mi>ψ</mi><mo>⟩</mo><mo>|</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>cos</mi><mn>2</mn></msup><mfrac><mi>Θ</mi><mn>2</mn></mfrac>`, label: 'quantum prediction', color: '--body-2', digits: 4, value: () => Math.cos(cur.Th * DEG / 2) ** 2 }],
    note: 'z → x → z: after the x analyser the atoms are in |+x⟩, at Θ = 90° to the last z analyser, so it splits them ½ : ½ again: the x measurement erased the earlier z result.',
  });
  const flux = createEquation({
    title: 'Effusive beam from the oven (flux-weighted Maxwell–Boltzmann)',
    lhs: { mathml: `<mi>f</mi><mo>(</mo><mi>v</mi><mo>)</mo>`, label: 'density at the median speed', unit: 's/m', value: () => speedPdf(cur.v, cur.T) },
    terms: [{ id: 'f', mathml: `<mn>2</mn>${M.sup(M.i('α'), M.n(2))}${M.sup(M.i('v'), M.n(3))}${M.sup(M.i('e'), `<mo>−</mo><mi>α</mi>${M.sup(M.i('v'), M.n(2))}`)}`, label: 'α = m/2kT', color: '--body-3', value: () => speedPdf(cur.v, cur.T) }],
    where: [{ mathml: M.i('α'), meaning: 'm / 2kT', value: () => M_AG / (2 * kB * cur.T), unit: 's²/m²' }, { mathml: M.sub(M.i('μ'), M.i('B')), meaning: 'Bohr magneton eħ/2mₑ (CODATA 2018 constants)', value: () => muB, unit: 'J/T' }],
  });
  eqs.append(deflect.el, bornEq.el, flux.el);

  let hist = null, vh = null, seen = 0, lastSim = null, lastShown = -1;
  const xs = Array.from({ length: 49 }, (_, k) => k * 0.025 * 180 / 4.5);
  return {
    update(sim, t, { rebuilt }) {
      const p = sim.params, lay = sim.layout, last = lay.mags[lay.mags.length - 1];
      cur.G = p.G; cur.T = p.T; cur.v = Math.sqrt(2 * kB * p.T * U_MEDIAN / M_AG); cur.D = GEOM.detector - GEOM.L;
      cur.Th = p.setup === 'ztheta' ? p.theta : 90;
      deflect.update(); bornEq.update(); flux.update();
      if (rebuilt || sim !== lastSim) {
        lastSim = sim; seen = 0; lastShown = -1;
        hist = { up: createHistogram({ bins: 160, range: [-8, 8] }), down: createHistogram({ bins: 160, range: [-8, 8] }) };
        vh = createHistogram({ bins: 40, range: [0, 1600] });
        // analytic overlays (one magnet only)
        prof.remove('q').remove('c');
        born.remove('cl').remove('half');
        born.fn('qm', x => Math.cos(x * DEG / 2) ** 2, { color: '--body-2', label: 'quantum cos²(Θ/2)' });
        if (p.setup === 'ztheta') born.fn('cl', x => classicalAnalyserP(x * DEG), { color: '--muted', dash: true, label: 'classical moments' });
        if (p.setup === 'single') born.hline('half', 0.5, { label: 'unpolarised beam: ½ at any angle' });
        speed.fn('law', v => speedPdf(v, p.T), { color: '--body-3', label: `v³e^(−mv²/2kT), T = ${p.T} K` });
      }
      if (sim.shown !== lastShown) {
        lastShown = sim.shown;
        // plate hits: face and profile (re-read from the arrival-ordered arrays)
        const n = last.n, up = [], down = [];
        for (let k = hist.k ?? 0; k < sim.shown; k++) {
          if (sim.hitFate[k] !== FATE.plate) continue;
          const x = sim.hitWorld[3 * k], z = sim.hitWorld[3 * k + 2], s = x * n[0] + z * n[2];
          (sim.hitProj[k] > 0 ? hist.up : hist.down).add(s);
        }
        hist.k = sim.shown;
        for (let k = 0; k < sim.shown; k++) {
          if (sim.hitFate[k] !== FATE.plate) continue;
          (sim.hitProj[k] > 0 ? up : down).push([sim.hitWorld[3 * k], sim.hitWorld[3 * k + 2]]);
        }
        const rad = up.length + down.length > 8000 ? 0.9 : 1.4;
        face.data('up', up, { dots: true, r: rad, color: '--body-2', label: p.model === 'quantum' ? '+½' : 'μ·n̂ > 0', alpha: 0.75 });
        face.data('down', down, { dots: true, r: rad, color: '--body-1', label: p.model === 'quantum' ? '−½' : 'μ·n̂ < 0', alpha: 0.75 });
        const toPts = h => Array.from(h.counts, (c, i) => [h.centers[i], c]);
        prof.data('hu', toPts(hist.up), { color: '--body-2', label: p.model === 'quantum' ? '+½ hits' : 'μ·n̂ > 0' });
        prof.data('hd', toPts(hist.down), { color: '--body-1', label: p.model === 'quantum' ? '−½ hits' : 'μ·n̂ < 0' });
        const nPlate = hist.up.total + hist.down.total;
        let ymax = 5;
        for (const h of [hist.up, hist.down]) for (const c of h.counts) ymax = Math.max(ymax, c);
        if (p.setup === 'single' && nPlate > 0) {
          const scale = nPlate * 0.1e-3;
          prof.fn('q', x => scale * profileQuantum(x * 1e-3, p.G, p.T), { color: '--ink-2', label: 'quantum (analytic)', width: 1.2 });
          prof.fn('c', x => scale * profileClassical(x * 1e-3, p.G, p.T), { color: '--muted', dash: true, label: 'classical (analytic)', width: 1.2 });
          ymax = Math.max(ymax, scale * profileClassical(0, p.G, p.T), scale * profileQuantum(deflectionK(p.G) * M_AG / (2 * kB * p.T) / 2, p.G, p.T));
        }
        prof.setY({ min: 0, max: ymax * 1.1 });
      }
      // Born point
      const m = sim.measuredP();
      if (m && m.n >= 30) born.data('mc', [[cur.Th, m.P]], { dots: true, r: 4, errors: [m.err], color: '--body-0', label: `this run (n = ${m.n})` });
      else born.remove('mc');
      // speeds of atoms emitted so far
      for (; seen < sim.emitted; seen++) vh.add(sim.speed[seen]);
      if (vh.total > 0) { const d = vh.density(); speed.data('h', Array.from(d.values, (y, i) => [vh.centers[i], y]), { dots: true, r: 2.4, errors: d.errors, color: '--ink-2', label: `${vh.total} atoms` }); }
      face.draw(); prof.draw(); born.draw(); speed.draw();
    },
  };
}

      'Colour = spin projection on the axis of the last magnet passed (coolwarm map, colour bar on the view): red +½, blue −½ for quantum atoms; continuous μ·n̂/μ for classical moments; grey before the first magnet (unpolarised).',
      'Lines are computed trajectories (exact parabolas inside magnets, straight between); dots on the plate and beam stops are computed end points; the dashed line is the undeflected beam axis.',
      'Playback: physical time of the run in ms; atoms are emitted at random (Poisson) times. Atoms slower than ~70 m/s are not drawn in flight but are still counted when they arrive.',
    ],
    references: [
      'W. Gerlach & O. Stern, “Der experimentelle Nachweis der Richtungsquantelung im Magnetfeld”, Z. Phys. 9, 349 (1922).',
      'B. Friedrich & D. Herschbach, “Stern and Gerlach: how a bad cigar helped reorient atomic physics”, Physics Today 56(12), 53 (2003).',
      'R. P. Feynman, R. B. Leighton, M. Sands, The Feynman Lectures on Physics III, ch. 5–6 (filtered Stern–Gerlach beams).',
      'J. J. Sakurai & J. Napolitano, Modern Quantum Mechanics, §1.1 (sequential Stern–Gerlach experiments).',
      'N. F. Ramsey, Molecular Beams (Oxford, 1956): effusive beam speed distribution ∝ v³ exp(−mv²/2kT).',
      'E. Tiesinga et al., CODATA 2018 recommended values, Rev. Mod. Phys. 93, 025010 (2021).',
    ],
  },
});

// GPU self-test: computed hits are drawn where the camera projects them, and (one magnet,
// quantum) the plate is empty on the beam axis while the upper spot is populated.
window.psim.selfTest = async () => {
  window.psim.advanceTo(30);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const sim = curSim, gl = document.querySelector('canvas.psim-gl').getContext('webgl2');
  const Wd = gl.drawingBufferWidth, Hd = gl.drawingBufferHeight, dpr = devicePixelRatio || 1;
  const c = orbitCamera({ target: [0, Y(GEOM.detector), 0], yaw: -Math.PI / 2, pitch: 0, distance: 9.5 });
  gl.viewport(0, 0, Wd, Hd); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  R.hits.draw(c, { aspect: Wd / Hd, size: 3, blend: 'alpha', count: sim.shown });
  const px = p => { const q = c.project(p, Wd / dpr, Hd / dpr), b = new Uint8Array(4); gl.readPixels(Math.round(q.x * dpr), Math.round(Hd - 1 - q.y * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); return [...b]; };
  // a hit that landed on the plate: its own pixel must be drawn
  let k = 0; while (k < sim.shown && sim.hitFate[k] !== FATE.plate) k++;
  const hit = px([sim.hitWorld[3 * k], sim.hitWorld[3 * k + 1], sim.hitWorld[3 * k + 2]]);
  const axis = px([0, Y(GEOM.detector), 0]);
  const out = [{ label: 'GPU: a computed plate hit is drawn at camera.project()', hit, pass: hit[3] > 60 }];
  if (sim.params.setup === 'single' && sim.params.model === 'quantum') out.push({ label: 'GPU: no hits drawn on the beam axis (gap between the spots)', axis, shown: sim.shown, pass: axis[3] === 0 && sim.shown > 1000 });
  return out;
};
