/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.

:root {

  --panel: #0e1219;

  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);

  height: 100dvh;

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {

}

/* ---------- stage ---------- */

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;

}
.psim-sec { border-bottom: 1px solid var(--line); }

  list-style: none; cursor: pointer; user-select: none;

}

  transform: rotate(-45deg); transition: transform .15s;
}

.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }

.psim-field { display: grid; gap: 6px; }

.psim-field .top input[type=number], .psim-num {

}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }

select.psim-select {

}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}

  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }

.psim-toast {

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }

.psim-equation { display: grid; gap: 10px; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */

/* The animation view is a dark screen in BOTH page themes: scenes (glows, density maps, space) are

  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;

  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);

  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  color-scheme: dark;
}

/* ---------- the scene: plain intro, clean view, player bar, key ---------- */

.psim-scene { display: flex; flex-direction: column; min-height: 0; background: var(--stage); }
.psim-stage > .psim-scene { position: absolute; inset: 0; }
.psim-scene.psim-canvaswrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.psim-view { position: relative; flex: 1 1 auto; min-height: 0;

.psim-intro { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: 14px/1.55 var(--sans); color: var(--ink-2); }
.psim-side > .psim-intro { margin: 14px 16px 4px; }

.psim-intro p { margin: 0; color: var(--ink); max-width: 80ch; }

.psim-intro li::before { content: '→ '; color: var(--accent); }
.psim-intro.collapsed p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.psim-intro.collapsed ul { display: none; }
.psim-more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: 500 12.5px var(--sans); cursor: pointer; }

.psim-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, var(--stage)); }

.psim-action:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }

.psim-transport { display: flex; align-items: center; gap: 4px; padding: 6px 10px; flex-wrap: nowrap;

.psim-clock[hidden] { display: none; }
.psim-clock { display: grid; line-height: 1.15; padding: 0 8px; min-width: 0; max-width: 220px; }

.psim-timeline { flex: 1 1 200px; min-width: 120px; padding: 0 10px; font: 10.5px var(--mono); color: var(--muted); position: relative; }
.psim-timeline .ticks { position: relative; height: 17px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .bar::before { content: ''; position: absolute; inset: -8px 0; }   /* a taller hit area */
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }

.psim-hud .flag { color: var(--warn); }

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]

 */

/**

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)

    box(sx = 1, sy = 1, sz = 1) {

    cylinder(r = 0.5, h = 1, n = 32) {

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */
function alignZ(dir) {
  const l = Math.hypot(...dir);
  if (!(l > 0)) throw new Error('alignZ: direction must be non-zero');
  const [x, y, z] = dir.map(v => v / l);
  if (z < -1 + 1e-12) return [1, 0, 0, 0, -1, 0, 0, 0, -1];
  // Rodrigues rotation about ẑ × d by the angle between them
  const k = 1 / (1 + z);
  return [1 - x * x * k, -x * y * k, x, -x * y * k, 1 - y * y * k, y, -x, -y, z];
}

/**
 * Point lists for createLineRenderer.update(): each returns one polyline [x,y,z, …] or an array of them.
 *   circle(center, normal, r, n)        closed circle (great circles, cone rims, orbits)
 *   boxEdges([min, max])                the 12 edges of a box, as separate segments
 *   grid(dims, { spacing, origin })     all lattice lines of a 1–3D grid with dims points per axis
 *   arrow(from, to, { head, normal })   shaft and a two-stroke head in the plane containing normal
 */

  boxEdges([lo, hi]) {

    const out = [];

/**
 * A colour-bar legend on the 2D canvas for a colormap-mapped quantity, matching the GPU colours.
 * ctx in CSS pixels (the shell's draw ctx). Vertical by default (low at the bottom), or
 * horizontal. Ticks at nice values (decades when log). Returns the bar's rectangle.
 */
function drawColorBar(ctx, { x, y, width = 12, height = 120, colormap: map = 'viridis', range = [0, 1], log = false, label = '', ticks = 5, horizontal = false, color, format } = {}) {

  const css = name => (typeof getComputedStyle === 'function' ? getComputedStyle(ctx.canvas?.closest?.('.psim-view') ?? document.documentElement).getPropertyValue(name).trim() : '');
  const text = color ?? (css('--muted') || '#8a94a6');

  for (let i = 0; i < steps; i++) {

    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;

    for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9 * step; v += step) vals.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  }

    const f = (v - lo) / (hi - lo);

    else { const py = y + height - f * height; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillRect(x + width, py, 3, 1); ctx.fillText(fmt(v), x + width + 5, py); }
  }

    ctx.textAlign = horizontal ? 'center' : 'left'; ctx.textBaseline = 'bottom';

/**
 * Model matrix (column-major, float64 array of 16) from translate [x,y,z], rotate (radians about
 * x, then y, then z, or a row-major 3×3 rotation matrix of 9 numbers, e.g. alignZ(dir)) and scale (number or [sx,sy,sz]). compose(a, b) = a·b

/**

 * A geometry with `values` (one per vertex) is coloured by them when the item names a colormap

  // optional GPU layer under the 2D canvas (ui/gl.mjs): drawGL renders the scene, draw adds labels
  const glLayer = wantGL ? createGLLayer(canvas) : null;
  if (glLayer) $('.psim-app').classList.add('has-gl');      // HUD and legend get a backing over bright GPU scenes
  $('.psim-clock .dim').textContent = timeLabel;
  $('.psim-clock').title = timeLabel;
  const hud = { t: $('.psim-clock b'), a: $('.psim-hud .h1'), b: $('.psim-hud .h2'), flag: $('.psim-hud .flag') };
  // the legend beside the view; view.setLegend(items) replaces it when the representation changes
  const setLegend = items => $('.psim-legend').replaceChildren(...(items ?? []).map(t => el('span', {}, t)));
  setLegend(model.legend);

  // ------------------------------------------------------------ state
  const values = Object.fromEntries(params.map(p => [p.key, p.value]));
  let sim, tDisplay = 0, limited = false, defaultSpeedNow = speed0;
  const steadyLabels = new Map();
  const clock = createClock({ speed: speed0 });
  const view = {
    W: 0, H: 0, dpr: 1, color: sceneVar, opts: {}, pointer: null, gl: glLayer?.gl ?? null, glError: glLayer && !glLayer.ok ? glLayer.reason : '',
    /** Current playback speed (simulated time per second) and state, e.g. to disclose time compression. */
    get speed() { return clock.speed; }, get playing() { return clock.playing; },
    /** GL layer resolution as a fraction of the device pixel ratio (adaptive unless glResolution is a number). */
    get glScale() { return glLayer?.scale ?? 1; },
    /** The scene's theme: always 'dark' (the view is a dark screen in both page themes); use it for blending and mesh colours. */
    get theme() { return 'dark'; },
    /** The page theme around the view ('dark' or 'light'), for anything drawn outside it. */
    get pageTheme() { return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; },
    setLegend,
    /** The embedded build-time report (verify()'s return value, including any extra data fields), or null. */
    report,
    /**
     * Shell overlays drawn over the canvas, in canvas CSS pixels: `overlays` lists each visible one
     * ({ name: 'hud' | 'legend' | 'timeline' | 'transport', x, y, w, h }); `insets` gives how far the
     * bottom ones (timeline, playback bar, a phone legend) reach up from the bottom edge and the top
     * ones (HUD, legend) down from the top. Lay the scene out inside them. Cached for 200 ms.
     */
    get overlays() { return overlayInfo().list; },
    /**
     * A steady position for a label attached to something that moves or flickers (a wave's peak,
     * a cloud's centre): returns { x, y } that follows (x, y) smoothly and ignores sub-`deadband`
     * jitter, so the text does not jump from frame to frame. One state per id; reset on rebuild.
     */
    steady(id, x, y, { deadband = 6, ease = 0.15 } = {}) {
      const p = steadyLabels.get(id);
      if (!p || !Number.isFinite(p.x)) { const q = { x, y }; steadyLabels.set(id, q); return q; }
      const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy);
      if (d > 120) { p.x = x; p.y = y; }                       // a jump (new run, reframing): follow at once
      else if (d > deadband) { const k = ease * (1 - deadband / d); p.x += k * dx; p.y += k * dy; }
      return p;
    },
    get insets() { return overlayInfo().insets; },
  };
  let overlayCache = null;
  function overlayInfo() {
    const now = performance.now();
    if (overlayCache && now - overlayCache.at < 200) return overlayCache;
    const c = canvas.getBoundingClientRect(), list = [];
    const add = (name, node) => {
      if (!node || node.hidden || !node.getClientRects().length) return;
      const r = node.getBoundingClientRect();
      const x = Math.max(r.left, c.left), y = Math.max(r.top, c.top), x1 = Math.min(r.right, c.right), y1 = Math.min(r.bottom, c.bottom);
      if (x1 > x && y1 > y && (r.width > 0 && r.height > 0)) list.push({ name, x: x - c.left, y: y - c.top, w: x1 - x, h: y1 - y });
    };
    for (const node of viewEl.children) if (node.tagName !== 'CANVAS') add(node.className.split(' ')[0].replace('psim-', ''), node);
    const insets = { top: 0, bottom: 0 };
    for (const o of list) {
      if (o.y + o.h / 2 < c.height / 2) insets.top = Math.max(insets.top, o.y + o.h);
      else insets.bottom = Math.max(insets.bottom, c.height - o.y);
    }
    overlayCache = { at: now, list, insets };
    return overlayCache;
  }

  let benchApi = null;
  // ------------------------------------------------------------ timeline: the run's span and its key times
  // spec.timeline = { duration, markers: [{ t, label, kind: 'computed' | 'measured' | 'requested' }], note }
  // (each may also be a function of the sim). The run stops exactly at `duration`; markers are drawn
  // on a bar under the time readout; clicking the bar jumps to that time (recomputing if earlier).
  let tl = null;
  const tlEl = $('.psim-timeline');
  const secTimeline = timelineSpec ? section(texts.timeline ?? 'Timeline', { aside: 'key times' }) : null;
  const shortLabel = m => m.short ?? m.label.replace(/\s*\(.*$/, '').slice(0, 28);
  function resolveTimeline() {
    if (!timelineSpec) { tl = null; tlEl.hidden = true; return; }
    const val = v => (typeof v === 'function' ? v(sim, values) : v);
    // the run spans [start, duration] on the page's own clock: start = the sim's initial time (0 usually;
    // e.g. −1 for a log₁₀ clock); duration is the END time on that clock
    const start = Number.isFinite(+val(timelineSpec.start)) ? +val(timelineSpec.start) : (sim.t ?? 0);
    const duration = +val(timelineSpec.duration);
    if (!(duration > start)) throw new Error(`timeline.duration (the end time) must be later than the start ${start}`);
    const span = duration - start, tol = 1e-9 * Math.max(Math.abs(duration), span);
    const all = (val(timelineSpec.markers) ?? []).filter(m => Number.isFinite(m.t));
    // a key time outside the run (a measured event after the point where the model stops being valid,
    // e.g. the impacts after a computed break-up) is listed in the side panel as "beyond this run",
    // never stretched onto the bar: the run still ends where the model ends
    const markers = all.filter(m => m.t >= start - tol && m.t <= duration + tol);
    const beyond = all.filter(m => !markers.includes(m));
    tl = { start, duration, markers, beyond, note: val(timelineSpec.note) ?? '' };
    // a watchable run in every mode: `seconds` (or a function of sim and params) sets the default
    // speed so that the whole run plays in that many seconds, whatever its length in this mode
    const secs = +val(timelineSpec.seconds);
    // (only when the run's length changed, so a speed the viewer chose survives a restart)
    if (secs > 0 && (duration - start) / secs !== defaultSpeedNow) { clock.speed = (duration - start) / secs; tp?.setSpeed?.(clock.speed); defaultSpeedNow = clock.speed; }
    tlEl.hidden = false;
    const fmt = t => (formatTime ? formatTime(t) : `${+t.toPrecision(4)} ${timeUnit}`);
    // the bar: one tick per key time, short labels above (staggered when close), full text as a tooltip
    const bar = tlEl.querySelector('.bar'), ticks = tlEl.querySelector('.ticks');
    bar.querySelectorAll('.m').forEach(e => e.remove());
    ticks.replaceChildren(...markers.slice().sort((a, b) => a.t - b.t).map(m => {
      const x = 100 * (m.t - start) / span;
      bar.append(el('span', { class: `m ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%`, title: `${m.label}: ${fmt(m.t)}` }));
      const sl = shortLabel(m), withTime = /\d/.test(sl) ? sl : `${sl} · ${fmt(m.t)}`;   // no repeated time
      // near the ends, anchor the label at its tick instead of centring it (never clipped by the bar's edges)
      const anchor = x < 15 ? 'translateX(0)' : x > 85 ? 'translateX(-100%)' : 'translateX(-50%)';
      return el('span', { class: `lab ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%;transform:${anchor}`, title: `${m.label}: ${fmt(m.t)}` }, withTime);
    }));
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.textContent = fmt(start); b.textContent = `${fmt(duration)} (end)`;
    layoutTimelineLabels();
    // the side panel lists every key time in full, with its kind, and the note
    if (secTimeline) {
      const kinds = { computed: 'computed in this model', measured: 'measured (literature)', requested: 'named in the request' };
      secTimeline.body.replaceChildren(
        row('run', `${fmt(start)} – ${fmt(duration)}`),
        ...markers.map(m => el('div', { class: 'psim-tlrow' }, el('i', { class: m.kind ?? 'computed' }), el('span', {}, m.label), el('code', {}, fmt(m.t)), el('small', {}, kinds[m.kind ?? 'computed']))),
        ...beyond.map(m => el('div', { class: 'psim-tlrow' }, el('i', { class: m.kind ?? 'measured' }), el('span', {}, m.label), el('code', {}, fmt(m.t)), el('small', {}, `${kinds[m.kind ?? 'measured']}; ${m.t > duration ? 'after' : 'before'} this run, which ends where the model stops`))),
        tl.note ? el('p', { class: 'psim-hint' }, tl.note) : null);
    }
  }
  // Labels are placed by their measured widths: each goes in the lowest of three rows where it does
  // not touch another label; one that fits nowhere is hidden (its tick keeps the tooltip, and the
  // side panel lists every key time). Rerun when the bar changes size (phone, full screen).
  const TL_ROWS = 3, TL_ROW_H = 13, TL_GAP = 6;
  function layoutTimelineLabels() {
    if (!tl || tlEl.hidden) return;
    const labs = [...tlEl.querySelectorAll('.ticks .lab')];
    labs.forEach(l => { l.style.bottom = '2px'; l.style.visibility = ''; l.classList.remove('hid'); });
    const box = tlEl.querySelector('.ticks').getBoundingClientRect();
    if (!(box.width > 0)) return;
    const rows = Array.from({ length: TL_ROWS }, () => []);
    let used = labs.length ? 1 : 0;
    for (const l of labs) {
      const r = l.getBoundingClientRect(), lo = Math.max(r.left, box.left), hi = Math.min(r.right, box.right);
      const k = rows.findIndex(slots => slots.every(([a, b]) => hi + TL_GAP <= a || lo >= b + TL_GAP));
      if (k < 0) { l.style.visibility = 'hidden'; l.classList.add('hid'); continue; }
      rows[k].push([lo, hi]); used = Math.max(used, k + 1);
      l.style.bottom = `${2 + k * TL_ROW_H}px`;
    }
    tlEl.querySelector('.ticks').style.height = `${4 + used * TL_ROW_H}px`;
    // the two end labels: drop the start when they would touch
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.style.visibility = '';
    if (a.getBoundingClientRect().right + TL_GAP > b.getBoundingClientRect().left) a.style.visibility = 'hidden';
  }
  new ResizeObserver(() => layoutTimelineLabels()).observe(tlEl);

  tlEl.querySelector('.bar').addEventListener('click', e => {
    if (!tl) return;
    const r = e.currentTarget.getBoundingClientRect(), T = tl.start + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (tl.duration - tl.start);
    if (T < tDisplay) rebuild();
    window.psim.advanceTo(T);
  });

  function rebuild() {
    steadyLabels.clear();
    sim = create({ ...values });
    tDisplay = sim.t ?? 0;
    resolveTimeline();
    diagPlot.clear();
    renderDiag(true);
    benchApi?.update?.(sim, tDisplay, { rebuilt: true });
    status.set('params', values);
  }

  // ------------------------------------------------------------ full screen
  // The scene (canvas, HUD, legend) and the playback bar fill the screen. Falls back to filling the
  // window with CSS where the Fullscreen API is missing or refused (iPhone Safari, sandboxed frames).
  const scene = sceneEl;
  let pseudoFs = false, fsBtn = null;
  const fsElement = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
  const isFullscreen = () => pseudoFs || fsElement() === scene;
  function afterFullscreen() {
    const on = isFullscreen();
    scene.classList.toggle('psim-fs', on);
    tp?.setFullscreen(on);
    if (fsBtn) fsBtn.innerHTML = on ? ICONS.exitFullscreen : ICONS.fullscreen;
    requestAnimationFrame(() => spec.onFit?.(view));
  }
  function setPseudo(on) { pseudoFs = on; scene.classList.toggle('psim-pseudo-fs', on); afterFullscreen(); }
  function toggleFullscreen() {
    if (isFullscreen()) {
      if (pseudoFs) setPseudo(false);
      else (document.exitFullscreen ?? document.webkitExitFullscreen)?.call(document);
      return;
    }
    const request = scene.requestFullscreen ?? scene.webkitRequestFullscreen;
    if (!request) { setPseudo(true); return; }
    try { Promise.resolve(request.call(scene)).catch(() => setPseudo(true)); } catch { setPseudo(true); }
  }
  addEventListener('fullscreenchange', afterFullscreen);
  addEventListener('webkitfullscreenchange', afterFullscreen);

  // ------------------------------------------------------------ transport
  const timeDependent = spec.timeDependent !== false;
  let tp = null;
  if (timeDependent) {
    tp = transport({
      speed: speed0, speedLabel: s => `${sci(s, 2)} ${timeUnit}/s`, range: speedRange,
      onToggle: () => togglePlay(),
      onStep: () => { setPlaying(false); if (!isDone()) { sim.step(); tDisplay = sim.t; } },
      onRestart: () => rebuild(),
      onFit: () => spec.onFit?.(view),
      onFullscreen: () => toggleFullscreen(),
      onSpeed: s => { clock.speed = s; },
    });
    // the player bar sits directly under the view, like a video player: buttons, the clock and
    // the timeline with its key moments, speed, full screen
    const firstSep = tp.querySelector('.sep');
    const clockEl = $('.psim-clock');
    clockEl.hidden = false;
    tp.insertBefore(clockEl, firstSep);
    tp.insertBefore(tlEl, firstSep);
    viewEl.after(tp);
  } else {
    fsBtn = el('button', { class: 'psim-fsbtn', title: 'Full screen (F)', 'aria-label': 'Full screen', html: ICONS.fullscreen, onclick: () => toggleFullscreen() });
    viewEl.append(fsBtn);
  }
  // the page's main actions ("Heat it up", "Fire one electron"): large buttons directly under the
  // view, where the eye already is; settings stay in the side panel
  if ((spec.actions ?? []).length) {
    const api = () => ({ setParams, setParam, getSim: () => sim, values, play: () => setPlaying(true), pause: () => setPlaying(false), restart: () => rebuild(),
      // jump to time t of the run (from the start: restart first to go back), e.g. to just before the moment the action is about
      seek: t => window.psim.advanceTo(t) });
    const bar = el('div', { class: 'psim-actions' }, ...spec.actions.map(a => {
      const b = el('button', { type: 'button', class: 'psim-action', title: a.hint ?? '' }, a.label);
      b.addEventListener('click', () => a.onClick?.(api()));
      return b;
    }));
    viewEl.after(bar);
  }
  // at the end of a run: the final state stays on screen with a replay button over it
  const endcard = $('.psim-endcard');
  endcard.querySelector('button').addEventListener('click', () => { rebuild(); setPlaying(true); });
  function showEndcard() {
    const on = timeDependent && !clock.playing && isDone();
    if (endcard.hidden === !on) return;
    endcard.hidden = !on;
    if (on) endcard.querySelector('span').textContent = texts.finishedCard ?? `Finished at ${formatTime ? formatTime(endTime()) : `${fix(endTime(), timeDigits)} ${timeUnit}`}`;
  }
  function setPlaying(p) { clock.playing = p; tp?.setPlaying(p); showEndcard(); }
  // A model that ends (a merger, everything decayed, the last particle left) sets sim.done (or
  // sim.ended): the clock stops there instead of counting time in which nothing is computed,
  // and play starts the run again from the beginning.
  // the end shown on the clock: exactly the declared duration when the steps' float sum lands within round-off of it
  const endTime = () => (tl && Math.abs(sim.t - tl.duration) <= 1e-9 * Math.max(Math.abs(tl.duration), tl.duration - tl.start) ? tl.duration : tl ? Math.min(sim.t, tl.duration) : sim.t);
  const isDone = () => sim?.done === true || sim?.ended === true || (tl != null && (sim?.t ?? 0) >= tl.duration - 1e-12 * Math.max(Math.abs(tl.duration), tl.duration - tl.start));
  function togglePlay() {
    if (!clock.playing && isDone()) { rebuild(); setPlaying(true); return; }
    setPlaying(!clock.playing);
  }


  // ------------------------------------------------------------ side panel
  const secParams = section(texts.parameters ?? 'Parameters');
  const paramInputs = new Map();
  // set one or several parameters as if typed: every control shows the new value, one rebuild
  function setParams(next, { play } = {}) {
    for (const [k, v] of Object.entries(next)) { values[k] = v; paramInputs.get(k)?.setValue?.(v); }
    rebuild();
    if (play != null && timeDependent) setPlaying(play);
  }
  const setParam = (k, v) => setParams({ [k]: v });
  if (presets.length) {
    secParams.body.append(el('div', { class: 'psim-presets' },
      el('span', { class: 'psim-hint' }, texts.presets ?? 'Try this'),
      ...presets.map(pr => button(pr.label, () => setParams(pr.values ?? {}, { play: pr.play ?? true })))));
  }
  if (params.length) {
    const note = texts.paramsNote ?? 'Changing a parameter recomputes the model from its initial state.';
    if (note) secParams.body.append(el('p', { class: 'psim-hint' }, note));
    for (const p of params) {
      if (p.options) {
        const sel = select(p.options, p.value, v => { values[p.key] = isNaN(+v) ? v : +v; rebuild(); });
        sel.setValue = v => { sel.value = String(v); };
        paramInputs.set(p.key, sel);
        secParams.body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, p.label)), sel));
      } else {
        const sl = slider({
          label: p.label, min: p.min, max: p.max, value: p.value, log: p.log, unit: p.unit ?? '', digits: p.digits ?? 3,
          integer: p.integer, limits: p.limits,
          onInput: v => { values[p.key] = v; rebuild(); },
        });
        paramInputs.set(p.key, sl);
        secParams.body.append(sl);
      }
      if (p.hint) secParams.body.append(el('p', { class: 'psim-hint', style: 'margin-top:-4px;font-size:11.5px' }, p.hint));
    }
  }
  if (controls) controls(secParams.body, { values, rebuild, setParam, setParams, play: () => setPlaying(true), pause: () => setPlaying(false), getSim: () => sim });

  // presentation-only controls (projection, colour map, slice): never rebuild the model
  const secView = viewControls ? section(texts.view ?? 'View') : null;
  if (secView) secView.body.append(el('p', { class: 'psim-hint' }, texts.viewNote ?? 'These change only how the results are shown, not the calculation.'));

  const secDiag = section(texts.diagnostics ?? 'Diagnostics', { aside: 'live' });
  const diagPlot = logPlot({ caption: '', yMin: 1e-16, yMax: 1 });
  const diagSeries = diagPlot.addSeries('--accent');
  const diagRows = new Map();
  secDiag.body.append(diagPlot.el);
  let nextPlot = 0;
  function renderDiag(reset = false) {
    const d = sim.diagnostics();
    if (reset) {
      diagRows.forEach(r => r.remove());
      diagRows.clear();
      nextPlot = 0;
      const firstErr = d.find(x => x.kind === 'error');
      diagPlot.el.style.display = firstErr ? '' : 'none';
      diagPlot.el.querySelector('.cap').textContent = firstErr ? `${firstErr.label}   vs   ${timeLabel}` : '';   // the real progress axis (time, temperature, sweeps)
      if (spec.duration) diagPlot.setXMax(spec.duration);
    }
    for (const x of d) {
      let r = diagRows.get(x.key);
      if (!r) { r = row(x.label); diagRows.set(x.key, r); secDiag.body.append(r); }
      // pending: a quantity that is not measured yet (e.g. before enough Monte Carlo samples)
      const text = x.pending ? (x.text ?? texts.pending ?? 'measuring…') : x.text ?? (x.kind === 'error' ? sci(x.value) : `${sci(x.value, 4)}${x.unit ? ` ${x.unit}` : ''}`);
      r.set(text, !x.pending && x.kind === 'error' && x.good != null ? grade(x.value, x.good, x.warn ?? x.good * 1000) : '');
    }
    const firstErr = d.find(x => x.kind === 'error' && !x.pending);
    if (firstErr && timeDependent && sim.t >= nextPlot) {
      diagPlot.push(diagSeries, sim.t, Math.max(firstErr.value, 1e-17));
      nextPlot = sim.t + (spec.duration ?? 10) / 800;
    }
    diagPlot.draw();
    return d;
  }

  const secVerify = section('Verification', { aside: report ? 'report embedded' : 'no report' });
  if (report?.checks) {
    secVerify.body.append(el('p', { class: 'psim-hint' }, report.summary ?? `Measured when this page was built (${(report.generated ?? '').slice(0, 10)}):`));
    for (const c of report.checks) {
      secVerify.body.append(el('div', { class: 'psim-check' },
        el('i', { class: c.pass !== true ? 'bad' : c.state === 'warn' ? 'warn' : '' }),
        el('span', {}, c.label), el('code', {}, c.value)));
    }
    if (report.notes) for (const n of [].concat(report.notes)) secVerify.body.append(el('p', { class: 'psim-hint' }, n));
  } else {
    secVerify.body.append(el('p', { class: 'psim-hint' }, 'No build-time verification report is embedded in this page.'));
  }

  const secModel = section('Model, assumptions & limits', { open: false });
  secModel.body.append(
    el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, `${trustLabel}. `), tierReason ?? '')),
    ...(model.equations ?? []).flatMap(eq => [
      eq.caption ? el('p', { class: 'psim-hint' }, eq.caption) : null,
      el('div', { class: 'psim-math', html: eq.mathml }),
    ]),
    model.assumptions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Assumptions and limits')), el('ul', {}, model.assumptions.map(a => el('li', {}, a)))) : null,
    model.conventions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Visual conventions')), el('ul', {}, model.conventions.map(a => el('li', {}, a)))) : null,
    model.references ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'References')), el('ul', {}, model.references.map(a => el('li', {}, el('cite', {}, a))))) : null,
  );
  tierBtn.addEventListener('click', () => { secModel.open = true; secModel.scrollIntoView({ behavior: 'smooth' }); });

  const secExport = section('Export', { open: false });
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  secExport.body.append(el('div', { class: 'psim-btns' },
    button('State JSON', () => download(`${slug}-state.json`, JSON.stringify({
      generator: 'p-simtor', title, tier: tierBtn.dataset.tier, params: values, t: sim.t, state: sim.state(), diagnostics: sim.diagnostics(), verification: report,
    }, null, 2), 'application/json')),
    button('Data CSV', () => {
      const r = sim.record?.();
      if (!r) { toast(stage, 'This model records no tabular data'); return; }
      download(`${slug}-data.csv`, [`# p-simtor | ${title}`, r.header.join(','), ...r.rows.map(x => x.join(','))].join('\n'), 'text/csv');
    }),
    button('PNG image', () => {
      // composite the GPU layer (if any) under the 2D overlay
      const out = document.createElement('canvas');
      out.width = canvas.width; out.height = canvas.height;
      const c = out.getContext('2d');
      if (glLayer?.ok) c.drawImage(glLayer.canvas, 0, 0);
      c.drawImage(canvas, 0, 0);
      out.toBlob(b => el('a', { href: URL.createObjectURL(b), download: `${slug}.png` }).click());
    }),
  ));

  side.append(...[secParams, secView, secTimeline, secDiag, secVerify, secModel, secExport].filter(s => s && (s !== secParams || params.length || controls)));
  if (viewControls) viewControls(secView.body, { el, slider, select, toggle, button, view, getSim: () => sim });
  if (spec.extraSections) spec.extraSections(side, { section, el, row, slider, toggle, button, values, rebuild, view });

  // ------------------------------------------------------------ canvas & loop
  function resize() {
    view.dpr = devicePixelRatio || 1;
    view.W = canvas.clientWidth; view.H = canvas.clientHeight;
    canvas.width = Math.round(view.W * view.dpr); canvas.height = Math.round(view.H * view.dpr);
  }

  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);
}

// ---------------------------------------------------------------- linear algebra

/** Solve a tridiagonal system (Thomas algorithm). a: sub, b: diag, c: super, d: rhs. Works for complex via callers. */
function solveTridiagonal(a, b, c, d) {
  const n = b.length, cp = new Float64Array(n), dp = new Float64Array(n), x = new Float64Array(n);
  cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
  for (let i = 1; i < n; i++) {
    const m = b[i] - a[i] * cp[i - 1];
    cp[i] = c[i] / m;
    dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
  }
  x[n - 1] = dp[n - 1];
  for (let i = n - 2; i >= 0; i--) x[i] = dp[i] - cp[i] * x[i + 1];
  return x;
}

/**
 * All eigenvalues and eigenvectors of a real symmetric tridiagonal matrix (implicit QL with
 * Wilkinson shifts; Numerical Recipes "tqli"). diag: n diagonal entries; off: n−1 entries
 * coupling i and i+1. Returns { values, vectors } with vectors[i] the unit eigenvector of
 * values[i] (unsorted). Cost O(n³) with eigenvectors: fine to n ≈ 500 in a browser.
 * { vectors: false } returns eigenvalues only, in O(n²) (n = 10⁴ in ~3 s); for the lowest few use
 * lowestTridiagonal (bisection, O(n) per level).
 */
function eigenTridiagonal(diag, off, { vectors: wantVectors = true } = {}) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('eigenTridiagonal: off must have n − 1 entries');
  const d = Float64Array.from(diag), e = new Float64Array(n);
  e.set(off);
  const z = wantVectors ? new Float64Array(n * n) : null;
  if (z) for (let i = 0; i < n; i++) z[i * n + i] = 1;
  for (let l = 0; l < n; l++) {
    let iter = 0, m;
    do {
      for (m = l; m < n - 1; m++) {
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= Number.EPSILON * dd) break;
      }
      if (m !== l) {
        if (iter++ === 60) throw new Error('eigenTridiagonal: no convergence');
        let g = (d[l + 1] - d[l]) / (2 * e[l]);
        let r = Math.hypot(g, 1);
        g = d[m] - d[l] + e[l] / (g + (g >= 0 ? r : -r));
        let s = 1, c = 1, p = 0, i;
        for (i = m - 1; i >= l; i--) {
          let f = s * e[i];
          const b = c * e[i];
          r = Math.hypot(f, g);
          e[i + 1] = r;
          if (r === 0) { d[i + 1] -= p; e[m] = 0; break; }
          s = f / r; c = g / r;
          g = d[i + 1] - p;
          r = (d[i] - g) * s + 2 * c * b;
          p = s * r;
          d[i + 1] = g + p;
          g = c * r - b;
          if (z) {for (let k = 0; k < n; k++) {

/**
 * Exact (real) ray trace through coaxial spherical surfaces along +z. ray = { p: [x, y, z], d: [dx, dy, dz] }
 * (dz > 0; 3D, use x = dx = 0 for meridional 2D rays); surfaces = [{ z (vertex, m), R (centre at z + R,
 * Infinity flat), n (index after the surface), aperture? (clear semi-diameter) }] ordered by z; n0 =
 * index before the first surface. Returns { points (start and each hit), p, d (unit), n, status }:
 * status 'ok', 'missed' (no intersection with the sphere), 'clipped' (outside an aperture) or 'tir';
 * on failure p, d are the last valid ray. Non-'ok' rays must not be drawn as transmitted.

/**

// ---------------------------------------------------------------- dispersion and rainbows

/**
 * Sellmeier glass data: n²(λ) − 1 = Σ B_i λ²/(λ² − C_i), λ in µm, C_i in µm².
 * BK7: Schott N-BK7 datasheet (n_d = 1.5168, ν_d = 64.17). fusedSilica: Malitson, JOSA 55, 1205 (1965)
 * (n_d = 1.4585), valid 0.21–3.71 µm.
 */

  BK7: Object.freeze({ B: [1.03961212, 0.231792344, 1.01046945], C: [0.00600069867, 0.0200179144, 103.560653], range: [0.3e-6, 2.5e-6], source: 'Schott N-BK7 datasheet' }),
  fusedSilica: Object.freeze({ B: [0.6961663, 0.4079426, 0.8974794], C: [0.0684043 ** 2, 0.1162414 ** 2, 9.896161 ** 2], range: [0.21e-6, 3.71e-6], source: 'Malitson, JOSA 55, 1205 (1965)' }),

/**
 * Refractive index n(λ) from Sellmeier coefficients { B, C } (C in µm², see GLASS), λ the vacuum

/**
 * Descartes rainbow of order k (k internal reflections, k ≥ 1) for a sphere of relative index n > 1.
 * Deviation D(i) = 2(i − r) + k(π − 2r), sin i = n sin r; minimum at cos²i = (n² − 1)/(k(k + 2)).

// ---------------------------------------------------------------- multilayers (transfer matrix)

/**
 * Thin-film stack by the equivalent scattering recursion (Born & Wolf §1.6; Macleod,
 * Thin-Film Optical Filters ch. 2), using decaying propagation factors to avoid overflow in opaque

 * through layers [{ n, d }] (n real or complex { re, im } with im = κ ≥ 0 absorbing, d physical thickness

 * 'unpolarized'. Returns { r, t (complex, Hecht conventions as fresnelCoefficients; omitted for

    let Nc = csqrt(csub(cmul(N, N), cx(s0 * s0)));                 // N cosθ
    if (Math.abs(Nc.re) < 1e-15 * Math.hypot(Nc.re, Nc.im) && Nc.im > 0) Nc = cx(-Nc.re, -Nc.im);

// ---------------------------------------------------------------- polarisation

/**
 * Jones calculus. Vectors [Ex, Ey] and 2×2 matrices hold complex { re, im }. Angles in rad from x.
 * Convention: e^{i(kz − ωt)}; [1, i]/√2 rotates counter-clockwise for an observer facing the source,
 * S3 = 2 Im(Ex* Ey) = +1 ("left-circular" in Born & Wolf / Hecht, "right-hand" in IEEE usage).
 * Angles: polarizer θ = transmission axis; waveplate / halfWave / quarterWave θ = fast axis, the slow
 * axis (θ + 90°) is delayed by the retardance Γ (factor e^{+iΓ}); rotator φ rotates counter-clockwise.
 */

  linear: theta => [cx(Math.cos(theta)), cx(Math.sin(theta))],
  circular: (sign = 1) => { if (sign !== 1 && sign !== -1) throw new Error('jones.circular: sign must be ±1'); return [cx(Math.SQRT1_2), cx(0, sign * Math.SQRT1_2)]; },
  polarizer: theta => {

  },
  rotator: phi => [[cx(Math.cos(phi)), cx(-Math.sin(phi))], [cx(Math.sin(phi)), cx(Math.cos(phi))]],
  waveplate: (retardance, theta) => {
    const c = Math.cos(theta), s = Math.sin(theta), e = cexp(cx(0, retardance));   // fast axis phase 1, slow axis e^{iΓ}
    const one = cx(1);
    const a = cadd(cscale(one, c * c), cscale(e, s * s)), d = cadd(cscale(one, s * s), cscale(e, c * c));

  system: (...Ms) => Ms.reduce((acc, M) => [[cadd(cmul(M[0][0], acc[0][0]), cmul(M[0][1], acc[1][0])), cadd(cmul(M[0][0], acc[0][1]), cmul(M[0][1], acc[1][1]))],
    [cadd(cmul(M[1][0], acc[0][0]), cmul(M[1][1], acc[1][0])), cadd(cmul(M[1][0], acc[0][1]), cmul(M[1][1], acc[1][1]))]], [[cx(1), cx(0)], [cx(0), cx(1)]]),
  apply: (M, v) => [cadd(cmul(M[0][0], v[0]), cmul(M[0][1], v[1])), cadd(cmul(M[1][0], v[0]), cmul(M[1][1], v[1]))],
  intensity: v => cabs2(v[0]) + cabs2(v[1]),

  stokes: v => {

  },
});

// ---------------------------------------------------------------- FDTD

/**
 * Numerical dispersion of the 2D Yee scheme: ω with (n/(cΔt))² sin²(ωΔt/2) = sin²(kxΔx/2)/Δx² + sin²(kyΔy/2)/Δy²
 * (Taflove & Hagness, Computational Electrodynamics, eq. 4.17). Units SI (rad/m, m, s → rad/s).
 * Throws when no real ω exists (Courant limit exceeded).
 */
function yeeDispersion({ kx, ky = 0, dx, dy = dx, dt, n = 1 }) {
  pos(dx, 'dx', 'yeeDispersion'); pos(dy, 'dy', 'yeeDispersion'); pos(dt, 'dt', 'yeeDispersion'); pos(n, 'n', 'yeeDispersion');
  fin(kx, 'kx', 'yeeDispersion'); fin(ky, 'ky', 'yeeDispersion');
  const s = (C0 * dt / n) * Math.sqrt((Math.sin(kx * dx / 2) / dx) ** 2 + (Math.sin(ky * dy / 2) / dy) ** 2);

const WALLS = ['pec', 'periodic', 'mur'];

/**
 * 2D finite-difference time-domain solver (Yee 1966) on an nx × ny grid (index i + nx·j), spacing
 * dx, dy (m), SI fields. mode 'TM': Ez (V/m) at nodes (i, j), Hx at (i, j+½), Hy at (i+½, j).
 * mode 'TE': Hz (A/m) at (i+½, j+½), Ex at (i+½, j), Ey at (i, j+½). epsR: relative permittivity per

 * that this is negligible or say so. dt (s) defaults to courant × the stability limit

 * sources: [{ i, j, f: t => value, hard? }] add f(t) (V/m in TM to Ez, A/m in TE to Hz) at node
 * (i, j) after each update (hard: overwrite); i or j may be 'all' for a line source.
 * Returns { Ez, Hx, Hy | Hz, Ex, Ey (live Float64Arrays, writable for initial conditions), dt, dtMax,
 * t, steps, step(k = 1), advanceTo(t), energy() }. energy() is the discrete invariant

            if (j1 >= 0 && i0 >= 0 && i1 >= 0) Ey[k] -= ey[k] * (Hz[k] - Hz[i0 + nx * j]) / dx;   // Ey at (i, j+½): x-walls hold it
          }

    ctx.drawImage(off, xl, g.cy - g.half, xr - xl, 2 * g.half);
    ctx.restore();
    // 1/e² edges
    ctx.strokeStyle = `rgba(${r},${gg},${b},0.75)`; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    for (const sg of [1, -1]) {
      ctx.beginPath();
      for (let i = 0; i <= 120; i++) { const z = L * i / 120, y = g.Y(sg * Math.min(s.w(z), 1.2 * Y_TOP)); i ? ctx.lineTo(g.X(z), y) : ctx.moveTo(g.X(z), y); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // one light ray (ray optics), bounced with the same mirror matrices
  ctx.save();
  ctx.beginPath(); ctx.rect(xl - 2, g.cy - g.half - 30, xr - xl + 4, 2 * g.half + 60); ctx.clip();
  ctx.strokeStyle = C('--ink'); ctx.globalAlpha = s.mode ? 0.3 : 0.85; ctx.lineWidth = s.mode ? 0.8 : 1.6;
  ctx.beginPath();
  (s.mode ? s.ray.hits.slice(0, 2 * SHOWN_TRIPS + 1) : s.ray.hits).forEach(([z, y], i) => { const X = g.X(z), Y = g.Y(Math.max(-40 * Y_TOP, Math.min(40 * Y_TOP, y))); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
  ctx.stroke(); ctx.restore();

  // centres of the mirrors' curves (small crosses on the axis)
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1.2;
  const cross = x => { if (x < 4 || x > g.W - 4) return; ctx.beginPath(); ctx.moveTo(x - 5, g.cy - 5); ctx.lineTo(x + 5, g.cy + 5); ctx.moveTo(x + 5, g.cy - 5); ctx.lineTo(x - 5, g.cy + 5); ctx.stroke(); };
  if (Number.isFinite(sim.R1)) cross(g.X(sim.R1));
  cross(g.X(L - sim.R2));

  drawMirror(ctx, xl, g.cy, g.half, sim.R1, 1, C);
  drawMirror(ctx, xr, g.cy, g.half, sim.R2, -1, C);

  // labels (≤ 4): status, the two mirrors, scale
  ctx.font = `600 ${g.phone ? 13 : 15}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = s.mode ? C('--ink') : C('--warn');
  const status = s.mode
    ? (s.ray.escaped ? 'just stable: this ray still reaches the mirror rim' : 'stable: the light stays trapped in a beam')
    : s.ray.escaped ? `unstable: the ray leaves the mirrors after ${s.ray.escaped} round trip${s.ray.escaped > 1 ? 's' : ''}` : `unstable: the ray drifts outward on every round trip`;
  const p = view.steady('status', g.W / 2, 22);
  ctx.fillText(status, p.x, p.y);
  ctx.font = `${g.phone ? 11 : 12}px system-ui, sans-serif`; ctx.fillStyle = C('--muted');
  const lbY = g.H - 10;
  ctx.textAlign = 'left';
  ctx.fillText(g.phone ? 'left mirror fixed, right one moves' : `${Number.isFinite(sim.R1) ? 'left mirror' : 'flat left mirror'} stays put; the right mirror moves away`, 8, lbY);
  // scale bars (bottom right): 10 cm along, 0.5 mm across: the two directions use different scales
  const by = g.H - 26, bx = g.W - 10;
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx - 0.1 * g.sx, by); ctx.lineTo(bx, by); ctx.lineTo(bx, by - 0.5e-3 * g.sy); ctx.stroke();
  ctx.textAlign = 'right';
  ctx.fillText(g.phone ? `bars: 10 cm, 0.5 mm (×${Math.round(g.sy / g.sx)})` : `bars: 10 cm along, 0.5 mm across (across stretched ×${Math.round(g.sy / g.sx)})`, bx, lbY);
}

function bench({ eqs, figs, createPlot, createEquation, M }) {
  const sizes = createPlot({
    title: 'Beam radius at the mirrors and at the waist, across the scan', height: 250,
    x: { label: 'mirror spacing', unit: 'cm', min: 0, max: 1 }, y: { label: 'beam radius', unit: 'mm', min: 0, max: 2 },
  });
  const map = createPlot({
    title: 'Stability map: g₁ against g₂ (stable between the axes and the curves g₁g₂ = 1)', height: 250,
    x: { label: 'g₁ = 1 − L/R₁', min: -1.6, max: 1.6 }, y: { label: 'g₂ = 1 − L/R₂', min: -1.6, max: 1.6 },
  });
  const wrap = (p, text) => { const d = document.createElement('div'); const c = document.createElement('p'); c.className = 'psim-caption'; c.textContent = text; d.append(p.el, c); return d; };
  figs.append(
    wrap(sizes, 'Computed from the Gaussian mode at each spacing (closed form, Kogelnik–Li). Shaded: unstable spacings, where no trapped beam exists. Vertical line: now.'),
    wrap(map, 'Each spacing is a point (g₁, g₂); the scan draws the path. A trapped beam exists only where 0 < g₁g₂ < 1: in the top-right and bottom-left quarters, between the axes and the grey curves.'),
  );
  const cur = { s: null };
  let built = null, sim0 = null;
  const stableStr = (f, d = 3) => () => cur.s?.mode ? f(cur.s) : 'no beam';
  const gEq = createEquation({
    title: 'When does a trapped beam exist?',
    lhs: { mathml: `${M.sub(M.i('g'), M.n(1))}${M.sub(M.i('g'), M.n(2))}`, label: 'stable if between 0 and 1', value: () => cur.s ? (cur.s.g1 * cur.s.g2).toFixed(4) : '…' },
    terms: [
      { id: 'g1', mathml: M.paren(`${M.n(1)}<mo>−</mo>${M.frac(M.i('L'), M.sub(M.i('R'), M.n(1)))}`), label: 'left mirror: 1 − spacing / curve radius', color: '--body-0', value: () => cur.s ? cur.s.g1.toFixed(4) : '…' },
      { id: 'g2', sign: '×', mathml: M.paren(`${M.n(1)}<mo>−</mo>${M.frac(M.i('L'), M.sub(M.i('R'), M.n(2)))}`), label: 'right mirror: 1 − spacing / curve radius', color: '--body-1', value: () => cur.s ? cur.s.g2.toFixed(4) : '…' },
    ],
    link: map,
  });
  const wEq = createEquation({
    title: 'Spot radius on the right mirror (Kogelnik & Li 1966)',
    lhs: { mathml: M.sup(M.sub(M.i('w'), M.n(2)), M.n(2)), label: 'spot radius squared', unit: 'mm²', value: stableStr(s => (s.mode.w2 * 1e3) ** 2) },
    terms: [
      { id: 'w2', mathml: M.frac(`${M.i('λ')}${M.i('L')}`, M.i('π')), label: 'wavelength × spacing / π', color: '--body-1', unit: 'mm²', value: () => cur.s ? sim0.lambda * cur.s.L / Math.PI * 1e6 : '…' },
      { id: 'w2f', sign: '×', mathml: M.sqrt(M.frac(M.sub(M.i('g'), M.n(1)), `${M.sub(M.i('g'), M.n(2))}${M.paren(`${M.n(1)}<mo>−</mo>${M.sub(M.i('g'), M.n(1))}${M.sub(M.i('g'), M.n(2))}`)}`)), label: 'mirror factor: blows up at the stability edges', color: '--warn', value: stableStr(s => Math.sqrt(s.g1 / (s.g2 * (1 - s.g1 * s.g2)))) },
    ],
    where: [{ mathml: M.i('λ'), meaning: 'wavelength', value: () => sim0.lambda * 1e9, unit: 'nm' }],
    link: sizes,
  });
  eqs.append(gEq.el, wEq.el);
  return {
    update(sim, t) {
      sim0 = sim;
      if (built !== sim) {
        built = sim;
        for (const id of [...Array(8).keys()]) for (const k of ['w1', 'w2', 'w0', 'u']) sizes.remove?.(`${k}${id}`);
        sizes.setX({ min: sim.Lstart * 100, max: sim.Lend * 100 });
        // stable segments
        const segs = []; let seg = null;
        for (const p of sim.curve) { if (p.mode) { if (!seg) segs.push(seg = []); seg.push(p); } else seg = null; }
        segs.forEach((sg, k) => {
          const clip = v => Math.min(v * 1e3, 2);
          sizes.data(`w1${k}`, sg.map(p => [p.L * 100, clip(p.mode.w1)]), { color: '--body-0', width: 2, label: k ? undefined : 'on the left mirror' });
          sizes.data(`w2${k}`, sg.map(p => [p.L * 100, clip(p.mode.w2)]), { color: '--body-1', width: 2, dash: true, label: k ? undefined : 'on the right mirror' });
          sizes.data(`w0${k}`, sg.map(p => [p.L * 100, p.mode.w0 * 1e3]), { color: '--body-2', width: 2, label: k ? undefined : 'at the waist (narrowest)' });
        });
        sizes.setY({ min: 0, max: 2 });
        // unstable bands
        const edgesCm = [sim.Lstart * 100, ...sim.edges.map(e => e.L * 100), sim.Lend * 100];
        let labelled = false;
        for (let k = 0; k + 1 < edgesCm.length; k++) {
          if (sim.at((edgesCm[k] + edgesCm[k + 1]) / 2).mode) continue;
          sizes.band(`u${k}`, edgesCm[k], edgesCm[k + 1], { label: labelled ? undefined : 'unstable' }); labelled = true;
        }
        // stability map
        const hyp = s => { const pts = []; for (let i = 0; i <= 200; i++) { const x = s * (1 / 1.6 + (1.6 - 1 / 1.6) * i / 200); pts.push([x, 1 / x]); } return pts; };
        map.data('hp', hyp(1), { color: '--muted', label: 'g₁g₂ = 1 (edge)' });
        map.data('hn', hyp(-1), { color: '--muted' });
        map.hline('ax', 0, { color: '--muted' }); map.vline('ay', 0, { color: '--muted' });
        map.data('path', sim.curve.map(p => [Math.max(-5, p.g1), Math.max(-5, p.g2)]), { color: '--body-3', width: 1.6, label: 'path of this scan' });
      }
      const s = sim.at(t); cur.s = s;
      sizes.vline('now', s.L * 100, { color: '--ink', label: `${(s.L * 100).toFixed(1)} cm` });
      map.marker('now', s.g1, s.g2, { color: s.mode ? '--good' : '--warn', label: s.mode ? 'stable' : 'unstable' });
      gEq.update(); wEq.update();
      sizes.invalidate(); map.invalidate(); sizes.draw(); map.draw();
    },
  };
}

const edgeName = (sim, L) => {
  const near = (a, b) => Number.isFinite(b) && Math.abs(a - b) < 1e-6;
  if (near(L, sim.R1 + sim.R2)) return 'L = R₁ + R₂';
  if (near(L, sim.R1)) return 'L = R₁';
  if (near(L, sim.R2)) return 'L = R₂';
  return '';
};

createInstrument({
  title: 'Laser cavity: how the mirrors shape the beam',
  subtitle: 'Gaussian mode of a two-mirror resonator (paraxial wave optics) and one bouncing ray (ABCD matrices), scanned over the mirror spacing',
  tier: 'analytical',
  tierReason: 'The cavity mode is the closed-form Gaussian solution of paraxial wave optics (Kogelnik–Li), evaluated exactly at each spacing; the ray is iterated with exact ABCD matrices. Checked by round-trip self-consistency and closed-form limits (Verification). An ideal empty, lossless cavity, not a full laser.',
  layout: 'workbench',
  intro: {
    text: 'Inside a laser, light bounces back and forth between two mirrors, at least one of them curved. A curved mirror refocuses the light like a lens, so it stays in a narrow beam whose shape the mirrors decide. Here one mirror slowly moves away. Past a certain spacing the refocusing no longer works: the light is not trapped any more and walks off the mirrors after some bounces, so a laser built like that could not run.',
    watch: ['just before a limit, the beam swells on a mirror and squeezes thin elsewhere', 'at the limit the glow disappears and the ray zig-zags away', 'press "Pull the mirrors past the limit"'],
  },
  actions: [{
    label: 'Pull the mirrors past the limit', hint: 'jump to just before the edge and cross it', reveal: 8,
    onClick: ({ restart, seek, play, getSim }) => {
      const sim = getSim(), e = sim.edges.find(x => x.becomes === 'unstable');
      restart();
      if (e) seek(Math.max(sim.Lstart * 100, e.L * 100 - 0.07 * (sim.Lend - sim.Lstart) * 100));
      play();
    },
  }],
  params: PARAMS,
  create: createSim,
  draw, bench,
  hudError: false,
  timeUnit: 'cm', timeDigits: 1, timeLabel: 'mirror spacing (a scan, not time)',
  timeline: {
    start: sim => sim.Lstart * 100,
    duration: sim => sim.Lend * 100,
    markers: sim => sim.edges.map(e => ({
      t: e.L * 100, kind: 'computed',
      label: `${e.becomes === 'unstable' ? 'becomes unstable' : 'stable again'} at ${(e.L * 100).toFixed(1)} cm (computed by root finding; ${edgeName(sim, e.L)})`,
      short: e.becomes === 'unstable' ? 'unstable' : 'stable',
    })),
    seconds: 60,
    note: 'A scan of the mirror spacing, each frame the steady beam at that spacing. It runs a little past the last stability edge to show light escaping.',
  },
  hudLine: (sim, t) => { const s = sim.at(t); return s.mode ? `stable · beam radius ${(s.mode.w0 * 1e3).toFixed(2)} mm at the waist, ${(s.mode.w2 * 1e3).toFixed(2)} mm on the right mirror` : `unstable · ray grows × ${s.growth.toFixed(2)} per round trip`; },
  presets: [
    { label: 'Two equal mirrors (50 cm)', values: { R1: 50, R2: 50, mirror1: 'curved' } },
    { label: 'Unequal mirrors (30 and 60 cm)', values: { R1: 30, R2: 60, mirror1: 'curved' } },
    { label: 'One flat mirror', values: { R2: 50, mirror1: 'flat' } },
  ],
  model: {
    legend: [
      'coloured glow: the laser beam, computed light intensity across it (brightness ∝ √intensity; colour = wavelength, infrared shown as deep red)',
      'dashed lines: beam edge, where the intensity falls to 13.5 % (1/e² radius)',
      'thin white zig-zag: one light ray bouncing (ray optics, its first 12 round trips; when unstable, every round trip until it leaves the mirrors)',
      'small crosses: the centre of each mirror\'s curve',
      'across the beam is stretched (factor shown in the view, about 170× on a laptop) compared with along it; the mirror curves are drawn symbolically',
    ],
    equations: [],
    assumptions: [
      'Paraxial scalar wave optics: the beam is the fundamental Gaussian (TEM00) mode whose complex beam parameter repeats after one round trip (Kogelnik & Li 1966).',
      'Ideal, empty, lossless cavity of index 1: no gain medium, perfect spherical mirrors 25.4 mm across, perfect alignment.',
      'Unstable cavities have no trapped Gaussian beam. There only the geometric walk-off of a ray is computed; the diffraction-shaped modes that unstable-resonator lasers use are not modelled.',
      'The ray starts 0.45 mm off the axis, parallel to it, at the left mirror; it "escapes" when it lands more than 12.7 mm from the axis (off the mirror).',
    ],
    conventions: [
      'Progress axis: the mirror spacing L (a scan of steady states), not time. The left mirror stays put; the right mirror moves.',
      'Vertical scale fixed at ±1.5 mm across the beam; horizontal scale fits the whole scan. g_i = 1 − L/R_i with R > 0 for a concave mirror, R = ∞ flat.',
      'Spot radii: 1/e² intensity radius. Mirror spot sizes in the chart are clipped at 2 mm (they diverge at the stability edges).',
    ],
    references: [
      'H. Kogelnik & T. Li, "Laser beams and resonators", Appl. Opt. 5, 1550 (1966).',
      'A. E. Siegman, Lasers (University Science Books, 1986), ch. 19–22: resonator stability and unstable resonators.',
      'B. E. A. Saleh & M. C. Teich, Fundamentals of Photonics, 2nd ed. (Wiley, 2007), ch. 10: resonator stability 0 ≤ g₁g₂ ≤ 1.',
    ],
  },
});

</script>
