<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

/**
 * A 3D scalar field (index i + nx·(j + ny·k)) rendered by ray marching through its box.

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */

in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;

precision highp float;

// ---------------------------------------------------------------- lines

/**

// ---------------------------------------------------------------- solid objects (meshes)

/**

  4: { 0: 'z⁴', 1: 'xz³', '-1': 'yz³', 2: 'z²(x²−y²)', '-2': 'xyz²', 3: 'xz(x²−3y²)', '-3': 'yz(3x²−y²)', 4: 'x⁴−6x²y²+y⁴', '-4': 'xy(x²−y²)' },

// Cartesian forms ∝ r^l · Y_lm (real), used only by verify()
const CART = {
  '1,0': (x, y, z) => z, '1,1': x => x, '1,-1': (x, y) => y,
  '2,0': (x, y, z, r2) => 3 * z * z - r2, '2,1': (x, y, z) => x * z, '2,-1': (x, y, z) => y * z, '2,2': (x, y) => x * x - y * y, '2,-2': (x, y) => x * y,
  '3,0': (x, y, z, r2) => z * (5 * z * z - 3 * r2), '3,1': (x, y, z, r2) => x * (5 * z * z - r2), '3,-1': (x, y, z, r2) => y * (5 * z * z - r2),
  '3,2': (x, y, z) => z * (x * x - y * y), '3,-2': (x, y, z) => x * y * z, '3,3': (x, y) => x * (x * x - 3 * y * y), '3,-3': (x, y) => y * (3 * x * x - y * y),
  '4,0': (x, y, z, r2) => 35 * z ** 4 - 30 * z * z * r2 + 3 * r2 * r2, '4,1': (x, y, z, r2) => x * z * (7 * z * z - 3 * r2), '4,-1': (x, y, z, r2) => y * z * (7 * z * z - 3 * r2),
  '4,2': (x, y, z, r2) => (x * x - y * y) * (7 * z * z - r2), '4,-2': (x, y, z, r2) => x * y * (7 * z * z - r2),
  '4,3': (x, y, z) => x * z * (x * x - 3 * y * y), '4,-3': (x, y, z) => y * z * (3 * x * x - y * y),
  '4,4': (x, y) => x ** 4 - 6 * x * x * y * y + y ** 4, '4,-4': (x, y) => x * y * (x * x - y * y),

const sup = s => String(s).replace(/-/g, '−');
function orbitalName(n, l, m, basis = 'real') {
  if (basis === 'complex') return `${n}${LETTER[l]}, m = ${m > 0 ? '+' : ''}${sup(m)}`;
  const nm = REAL_NAMES[l][m];
  return nm ? `${n}${LETTER[l]} ${nm}` : `${n}${LETTER[l]}`;
}

const ORBITALS = [];
for (let n = 1; n <= NMAX; n++) {for (let l = 0; l < n; l++) {
  for (const m of l === 0 ? [0] : [0, ...Array.from({ length: l }, (_, k) => [k + 1, -(k + 1)]).flat()]) {
    ORBITALS.push({ value: `${n},${l},${m}`, label: l === 0 ? `${n}s` : `${n}${LETTER[l]}, m = ${m > 0 ? '+' : ''}${sup(m)}  (real: ${orbitalName(n, l, m)})` });
  }
}}

const PARAMS = [
  { key: 'orbital', label: 'State (n, l, m)', value: '4,2,0', options: ORBITALS },
  { key: 'basis', label: 'Angular basis', value: 'real', options: [
    { value: 'real', label: 'Real: cos mφ, sin mφ (sign of ψ)' },
    { value: 'complex', label: 'Complex: e^{imφ}, L_z = mħ (phase)' },
  ] },
  { key: 'N', label: 'Samples drawn from |ψ|²', min: 5000, max: 400000, value: 100000, log: true, integer: true, digits: 6,
    hint: 'Each dot is one independent simulated position measurement. More samples = smoother cloud, same physics.' },
  { key: 'Z', label: 'Nuclear charge Z', min: 1, max: 10, value: 1, integer: true, digits: 2,
    hint: 'Z = 1 is hydrogen; Z > 1 is a one-electron ion (He⁺, Li²⁺ …): the cloud shrinks as 1/Z, E grows as Z².' },
  { key: 'seed', label: 'Random seed', min: 1, max: 9999, value: 7, integer: true, digits: 4 },

// ------------------------------------------------------------------ exact functions

/** Radial function with precomputed normalisation (identical to core hydrogenRadial; verified). */
function radialFn(n, l, Z) {
  const k = 2 * Z / n;
  const lnNorm = 1.5 * Math.log(k) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  const norm = Math.exp(lnNorm);
  return r => { const rho = k * r; return norm * Math.exp(-rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho); };
}

/** Angular factor: real Y_lm, or complex Y_lm as {re, im}. */
function angularFn(l, m, basis) {
  if (basis === 'complex') return (th, ph) => complexYlm(l, m, th, ph);
  return (th, ph) => realYlm(l, m, th, ph);
}

function energyEV(n, Z) { return -Z * Z * Ry / (n * n); }
function meanRExact(n, l, Z) { return (3 * n * n - l * (l + 1)) / (2 * Z); }
function rMostProbableNodes(n, l, Z) {
  // radial nodes located numerically (Brent) between sign changes of R on a fine grid
  const R = radialFn(n, l, Z), rEnd = n * (2 * n + 25) / Z, nodes = [];
  const M = 6000;
  let prev = R(rEnd / M);
  for (let i = 2; i <= M; i++) {
    const r = rEnd * i / M, v = R(r);
    if (prev * v < 0) nodes.push(brent(R, rEnd * (i - 1) / M, r, 1e-13));
    prev = v;
  }
  return nodes;
}

// Radial probability table: exact cell integrals of P(r) = r² R² (8-point Gauss–Legendre each)
const CELLS = 2400;
function radialTable(n, l, Z) {
  const R = radialFn(n, l, Z), P = r => { const v = R(r); return r * r * v * v; };
  const rEnd = n * (2 * n + 25) / Z, dr = rEnd / CELLS;
  const cdf = new Float64Array(CELLS + 1), bound = new Float64Array(CELLS);
  for (let i = 0; i < CELLS; i++) {
    cdf[i + 1] = cdf[i] + gaussLegendre(P, i * dr, (i + 1) * dr, 8);
    let mx = 0;
    for (let k = 0; k <= 8; k++) mx = Math.max(mx, P((i + k / 8) * dr));
    bound[i] = 1.06 * mx + 1e-300;
  }
  return { R, P, rEnd, dr, cdf, bound, total: cdf[CELLS] };
}
/** Exact radial CDF (cell table + in-cell quadrature) for KS tests. */
function radialCDF(tab) {
  return r => {
    if (r <= 0) return 0;
    if (r >= tab.rEnd) return 1;
    const i = Math.floor(r / tab.dr);
    return (tab.cdf[i] + gaussLegendre(tab.P, i * tab.dr, r, 8)) / tab.total;
  };
}

// ------------------------------------------------------------------ the simulation

function parseOrbital(s) {
  const [n, l, m] = String(s).split(',').map(Number);
  if (!(Number.isInteger(n) && n >= 1 && n <= NMAX && Number.isInteger(l) && l >= 0 && l < n && Number.isInteger(m) && Math.abs(m) <= l)) throw new Error(`bad orbital ${s}`);
  return { n, l, m };
}

function createSim(params) {
  const { n, l, m } = parseOrbital(params.orbital);
  const basis = params.basis === 'complex' ? 'complex' : 'real';
  const Z = Math.round(params.Z), N = Math.round(params.N), seed = Math.round(params.seed);
  const tab = radialTable(n, l, Z), Rf = tab.R, Y = angularFn(l, m, basis);
  const absY2 = basis === 'complex' ? (th, ph) => { const y = Y(th, ph); return y.re * y.re + y.im * y.im; } : (th, ph) => { const y = Y(th, ph); return y * y; };
  const cdfR = radialCDF(tab);

  // Box for the volume: the cube of half-width L encloses the sphere holding 99.9 % of P.
  let iL = 0; while (iL < CELLS && tab.cdf[iL] / tab.total < 0.999) iL++;
  const L = Math.max(1.5 / Z, iL * tab.dr);

  // |ψ|² on the display grid (cell centres, axis 0 fastest, as ui/gl.mjs expects)
  const G = params.grid === false ? 0 : GRID, h = 2 * L / GRID, rho = new Float32Array(G * G * G);
  let rhoMax = 0, gridSum = 0;
  // Angular factor depends only on direction: evaluate the |Y|² through realYlm/complexYlm directly.
  for (let k = 0; k < G; k++) {
    const z = -L + (k + 0.5) * h;
    for (let j = 0; j < G; j++) {
      const y = -L + (j + 0.5) * h;
      for (let i = 0; i < G; i++) {
        const x = -L + (i + 0.5) * h, r = Math.hypot(x, y, z);
        const th = Math.acos(Math.max(-1, Math.min(1, z / r))), ph = Math.atan2(y, x);
        const R = Rf(r), v = R * R * absY2(th, ph);
        rho[i + G * (j + G * k)] = v; gridSum += v; if (v > rhoMax) rhoMax = v;
      }
    }
  }
  gridSum *= h * h * h;

  // Samples from |ψ|²: r and direction are independent because |ψ|² = R(r)² |Y(θ, φ)|².
  const rand = rng(seed);
  let y2max = 0;
  for (let a = 0; a <= 360; a++) {for (let b = 0; b <= 360; b++) y2max = Math.max(y2max, absY2(Math.PI * a / 360, 2 * Math.PI * b / 360));}
  y2max *= 1.05;
  const pos = new Float32Array(3 * N), val = new Float32Array(N), radii = new Float64Array(N), cosT = new Float64Array(N);
  let sumR = 0, sumR2 = 0, inside = 0, proposals = 0;
  for (let s = 0; s < N; s++) {
    // radius: choose the cell by its exact probability, then accept/reject against P(r)
    let r;
    for (;;) {
      const u = rand() * tab.total;
      let lo = 0, hi = CELLS;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (tab.cdf[mid] <= u) lo = mid; else hi = mid; }
      r = (lo + rand()) * tab.dr;
      proposals++;
      if (rand() * tab.bound[lo] <= tab.P(r)) break;
    }
    // direction: uniform on the sphere, accept with |Y|² / max|Y|²
    let th, ph;

    if (Math.abs(x) <= L && Math.abs(y) <= L && Math.abs(z) <= L) inside++;

    if (basis === 'complex') { const yc = Y(th, ph); return { re: R * yc.re, im: R * yc.im }; }

    t: 0, timeDependent: false,
    n, l, m, Z, N, basis, name, L, G, rho, rhoMax, gridSum, positions: pos, values: val, radii, cosT,
    P: tab.P, R: Rf, cdfR, meanR, seR, ks, nodes, meanRExact: mR, E, rMP, hist, psi,
    angularNodes: { cones: l - Math.abs(m), planes: basis === 'real' ? Math.abs(m) : 0 },
    acceptance: N / proposals,
    diagnostics() {
      return [
        { key: 'E', label: `Energy E${sub(n)} = −Z²Ry/n²`, kind: 'value', text: `${E.toPrecision(6).replace('-', '−')} eV` },
        { key: 'r', label: '⟨r⟩ exact', kind: 'value', text: `${mR.toPrecision(5)} a₀ = ${(mR * A0_PM).toPrecision(4)} pm` },
        { key: 'rs', label: '⟨r⟩ from the samples', kind: 'value', text: `${meanR.toFixed(3)} ± ${seR.toFixed(3)} a₀ (${((meanR - mR) / seR).toFixed(1).replace('-', '−')} σ)` },
        { key: 'rmp', label: 'most probable r', kind: 'value', text: `${rMP.toPrecision(4)} a₀` },
        { key: 'nodes', label: 'nodes: radial / angular', kind: 'value', text: `${nodes.length} / ${l}  (n−l−1 = ${n - l - 1}, l = ${l})` },
        { key: 'ks', label: 'KS test, samples vs P(r)', kind: 'value', text: `D = ${ks.D.toExponential(2)}, p = ${ks.p.toFixed(2)}` },
        { key: 'grid', label: 'Σ|ψ|²ΔV on display grid', kind: 'value', text: `${gridSum.toFixed(4)} (exact in box ≥ 0.999)` },
        { key: 'in', label: 'samples inside volume box', kind: 'value', text: `${(100 * inside / N).toFixed(2)} %` },
      ];
    },
    state() {
      return { orbital: params.orbital, basis, Z, N, seed, name, meanR, seR, ksD: ks.D, ksP: ks.p, firstSamples: Array.from(pos.slice(0, 12)) };
    },
    record() {
      const header = ['x_a0', 'y_a0', 'z_a0', basis === 'complex' ? 'phase_rad' : 'sign_psi'];
      const rows = [];
      for (let s = 0; s < N; s++) rows.push([pos[3 * s].toPrecision(6), pos[3 * s + 1].toPrecision(6), pos[3 * s + 2].toPrecision(6), basis === 'complex' ? val[s].toFixed(4) : val[s]]);

}
const sub = n => String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);

// ------------------------------------------------------------------ verification

function verify() {
  const checks = [];
  const states = ORBITALS.map(o => parseOrbital(o.value));

  // 1. normalisation of every offered state: radial ∫R²r²dr (Gauss–Legendre panels) × angular ∫|Y|²dΩ
  const angGrid = (() => {   // product rule: 48-pt GL in cos θ × 64-pt trapezoid in φ (exact for |m| ≤ 4 products)
    const pts = [], nth = 48, nph = 64, { x: xs, w: ws } = gaussLegendreNodes(nth);
    for (let i = 0; i < nth; i++) for (let j = 0; j < nph; j++) pts.push({ th: Math.acos(xs[i]), ph: 2 * Math.PI * j / nph, w: ws[i] * 2 * Math.PI / nph });
    return pts;
  })();
  const radialInt = (f, n, Z = 1) => { const rEnd = n * (2 * n + 25) / Z, P = 60; let s = 0; for (let p = 0; p < P; p++) s += gaussLegendre(f, rEnd * p / P, rEnd * (p + 1) / P, 24); return s; };
  let normErr = 0, normWorst = '';
  for (const { n, l, m } of states) {
    const R = radialFn(n, l, 1);
    const rad = radialInt(r => r * r * R(r) ** 2, n);
    let ang = 0; for (const q of angGrid) ang += q.w * realYlm(l, m, q.th, q.ph) ** 2;
    let angC = 0; for (const q of angGrid) { const y = complexYlm(l, m, q.th, q.ph); angC += q.w * (y.re * y.re + y.im * y.im); }
    const e = Math.max(Math.abs(rad * ang - 1), Math.abs(rad * angC - 1));
    if (e > normErr) { normErr = e; normWorst = orbitalName(n, l, m); }
  }
  checks.push({ label: `∫|ψ|² dV = 1 for all ${states.length} states (real and complex basis)`, value: `max |error| ${normErr.toExponential(1)} (${normWorst})`, pass: normErr < 1e-9 });

  // 2. orthogonality of every pair: ⟨ψ_a|ψ_b⟩ = (radial overlap if l, m equal) × angular overlap
  let ortho = 0;
  const angOv = new Map();
  const angKey = (a, b) => `${a.l},${a.m}|${b.l},${b.m}`;
  for (let i = 0; i < states.length; i++) {for (let j = i + 1; j < states.length; j++) {
    const a = states[i], b = states[j];
    let A = angOv.get(angKey(a, b));
    if (A == null) { A = 0; for (const q of angGrid) A += q.w * realYlm(a.l, a.m, q.th, q.ph) * realYlm(b.l, b.m, q.th, q.ph); angOv.set(angKey(a, b), A); }
    let ov = Math.abs(A);
    if (a.l === b.l && a.m === b.m) { const Ra = radialFn(a.n, a.l, 1), Rb = radialFn(b.n, b.l, 1); ov = Math.abs(radialInt(r => r * r * Ra(r) * Rb(r), Math.max(a.n, b.n))); }
    ortho = Math.max(ortho, ov);
  }}
  checks.push({ label: `Orthogonality, all ${states.length * (states.length - 1) / 2} pairs`, value: `max |⟨ψa|ψb⟩| ${ortho.toExponential(1)}`, pass: ortho < 1e-9 });

  // 3. radial Schrödinger equation residual (atomic units): −½(R'' + 2R'/r) + [l(l+1)/2r² − Z/r] R = E R
  let resid = 0;
  for (const Z of [1, 3]) {for (let n = 1; n <= NMAX; n++) {for (let l = 0; l < n; l++) {
    const R = radialFn(n, l, Z), E = -Z * Z / (2 * n * n), rEnd = n * (2 * n + 25) / Z;
    let scale = 0, worst = 0;
    for (let k = 1; k <= 400; k++) {
      const r = rEnd * k / 401 * 0.6, d = 1e-4 * r + 1e-5;
      const R0 = R(r), Rp = (R(r + d) - R(r - d)) / (2 * d), Rpp = (R(r + d) - 2 * R0 + R(r - d)) / (d * d);
      const lhs = -0.5 * (Rpp + 2 * Rp / r) + (l * (l + 1) / (2 * r * r) - Z / r) * R0;

  checks.push({ label: 'Radial equation Hψ = Eψ, E = −Z²/2n² Eh (finite-difference residual, Z = 1, 3)', value: `max rel. residual ${resid.toExponential(1)}`, pass: resid < 1e-5 });

  // 4. energy from the virial theorem: E = ⟨V⟩/2 = −Z⟨1/r⟩/2 Eh, compared with −Z²Ry/n² (CODATA Ry, Eh)
  let eErr = 0;
  for (let n = 1; n <= NMAX; n++) {for (let l = 0; l < n; l++) {
    const R = radialFn(n, l, 2), inv = radialInt(r => r * R(r) ** 2, n, 2);

  }}
  checks.push({ label: 'Energy: virial ⟨V⟩/2 by quadrature vs −Z²Ry/n² (Z = 2, all n, l)', value: `max rel. diff ${eErr.toExponential(1)} (Eh/2 vs Ry)`, pass: eErr < 1e-8 });

  // 5. ⟨r⟩ by quadrature vs (3n² − l(l+1))/2Z
  let rErr = 0;
  for (let n = 1; n <= NMAX; n++) {for (let l = 0; l < n; l++) {
    const R = radialFn(n, l, 1);
    rErr = Math.max(rErr, Math.abs(radialInt(r => r ** 3 * R(r) ** 2, n) / meanRExact(n, l, 1) - 1));
  }}
  checks.push({ label: '⟨r⟩ quadrature vs (a₀/2Z)[3n² − l(l+1)], all n ≤ 5', value: `max rel. error ${rErr.toExponential(1)}`, pass: rErr < 1e-9 });

  // 6. radial nodes: count n−l−1 for all, positions vs exact roots (2s: 2; 3s: (9 ± 3√3)/2; 3p: 6; 4d: 12)
  let countOK = true;
  for (let n = 1; n <= NMAX; n++) for (let l = 0; l < n; l++) if (rMostProbableNodes(n, l, 1).length !== n - l - 1) countOK = false;
  const exact = [[2, 0, [2]], [3, 0, [(9 - 3 * Math.sqrt(3)) / 2, (9 + 3 * Math.sqrt(3)) / 2]], [3, 1, [6]], [4, 2, [12]]];
  let nodeErr = 0;
  for (const [n, l, want] of exact) { const got = rMostProbableNodes(n, l, 1); want.forEach((w, i) => { nodeErr = Math.max(nodeErr, Math.abs(got[i] - w)); }); }
  checks.push({ label: 'Radial nodes: count n−l−1 (all states); positions vs exact 2s, 3s, 3p, 4d roots', value: `counts ${countOK ? 'all correct' : 'WRONG'}; max |Δr| ${nodeErr.toExponential(1)} a₀`, pass: countOK && nodeErr < 1e-9 });

  // 7. angular nodes: l − |m| nodal cones (zeros of P_l^|m| in θ) and |m| nodal planes (zeros of cos/sin mφ)
  let angOK = true;
  for (let l = 0; l <= 4; l++) {for (let am = 0; am <= l; am++) {
    let zc = 0, prev = normalizedLegendre(l, am, Math.cos(1e-6));
    for (let k = 1; k <= 4000; k++) { const v = normalizedLegendre(l, am, Math.cos(Math.PI * k / 4000 - 1e-6 * (k === 4000))); if (prev * v < 0) zc++; prev = v; }
    let zp = 0, pv = Math.cos(am * 1e-6);
    for (let k = 1; k <= 4000; k++) { const v = Math.cos(am * (Math.PI * k / 4000 + 1e-6)); if (pv * v < 0) zp++; pv = v; }
    if (zc !== l - am || zp !== am) angOK = false;
  }}
  checks.push({ label: 'Angular nodes: l−|m| cones + |m| planes = l (real basis, l ≤ 4)', value: angOK ? 'all 15 (l, |m|) correct' : 'mismatch', pass: angOK });

  // 8. real-orbital labels: realYlm = c × (Cartesian polynomial)/r^l with one constant c > 0
  const rr = rng(11);
  let labelDev = 0, labelSign = true;
  for (const key of Object.keys(CART)) {

    for (let v = -Math.floor(L / st) * st; v <= L + 1e-9; v += st) { ctx.fillText(String(+v.toPrecision(4)).replace('-', '−'), X(v), oy + S + 14); }
    ctx.fillText(`${pl[0]} (a₀)`, ox + S / 2, oy + S + 30);
    ctx.textAlign = 'right';
    for (let v = -Math.floor(L / st) * st; v <= L + 1e-9; v += st) ctx.fillText(String(+v.toPrecision(4)).replace('-', '−'), ox - 6, Yp(v) + 4);
    ctx.save(); ctx.translate(ox - 36, oy + S / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(`${pl[1]} (a₀)`, 0, 0); ctx.restore();
    ctx.textAlign = 'left';
    sliceHead.textContent = sim.basis === 'real'
      ? `Slice through the nucleus (${pl[0]}${pl[1]}-plane): ψ, red > 0, blue < 0 (signed √ scale); dashed: nodes ψ = 0`
      : `Slice through the nucleus (${pl[0]}${pl[1]}-plane): |ψ|² / max, log 3 decades (magma)`;
  }
  new ResizeObserver(() => drawSlice()).observe(slice);

  return {
    update(sim, t, { rebuilt }) {
      cur = sim; psiEq.update(); eEq.update(); rEq.update();
      if (!rebuilt) return;
      const xmax = sim.hist.edges ? sim.hist.edges[sim.hist.edges.length - 1] : sim.L * 1.25;
      let pmax = 0; for (let k = 0; k <= 400; k++) pmax = Math.max(pmax, sim.P(xmax * k / 400));
      radial.setX({ min: 0, max: xmax }).setY({ min: 0, max: pmax * 1.18 });
      for (const id of ['n0', 'n1', 'n2', 'n3', 'n4']) radial.remove(id);
      radial.fn('exact', r => sim.P(r), { color: '--body-2', label: 'exact r²R²', width: 2 });
      const centers = sim.hist.centers ?? [], dens = sim.hist.values ?? [], errs = sim.hist.errors ?? [];
      radial.data('hist', centers.map((c, i) => [c, dens[i]]), { color: '--ink-2', dots: true, r: 2, errors: errs, label: `histogram of ${sim.N.toLocaleString('en')} sampled r (±1σ)` });
      sim.nodes.forEach((r, i) => radial.vline(`n${i}`, r, { color: '--muted', label: i === 0 ? 'radial nodes' : '' }));
      radial.vline('mean', sim.meanRExact, { color: '--accent', label: `⟨r⟩ = ${+sim.meanRExact.toPrecision(4)} a₀` });
      radial.invalidate(); radial.draw();
      drawSlice();
    },
  };
}

// ------------------------------------------------------------------ GPU self-test: renderer output vs a CPU ray march of the same data
window.psim.selfTest = () => {
  const gl = document.querySelector('canvas.psim-gl').getContext('webgl2'), sim = app.sim;
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, L = sim.L, G = sim.G;
  const c = orbitCamera({ distance: 2.6 * L, yaw: 0.3, pitch: 0.25, fov: 0.7 }), opacity = 0.25, steps = 200;
  const T = TRANSFER.log3.f, d = new Float32Array(G * G * G);
  for (let i = 0; i < d.length; i++) d[i] = T(sim.rho[i] / sim.rhoMax);
  const v = createVolumeRenderer(gl); v.update(d, G, G, G, { range: [0, 1] });
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  v.draw(c, { aspect: W / H, box: [[-L, -L, -L], [L, L, L]], colormap: 'magma', opacity, steps, mode: 'emission' });
  const inv = invert(c.matrices(W / H).viewProj), mul = (x, y, z) => { const r = [0, 1, 2, 3].map(i => inv[i] * x + inv[4 + i] * y + inv[8 + i] * z + inv[12 + i]); return r.slice(0, 3).map(q => q / r[3]); };
  const at = (i, j, k) => d[Math.min(G - 1, Math.max(0, i)) + G * (Math.min(G - 1, Math.max(0, j)) + G * Math.min(G - 1, Math.max(0, k)))];
  const tri = p => { const f = p.map(q => (q + L) / (2 * L) * G - 0.5), i = f.map(Math.floor), w = f.map((q, a) => q - i[a]); let s = 0;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let e = 0; e < 2; e++) s += (a ? w[0] : 1 - w[0]) * (b ? w[1] : 1 - w[1]) * (e ? w[2] : 1 - w[2]) * at(i[0] + a, i[1] + b, i[2] + e); return s; };
  const cpuAlpha = (px, py) => {   // same ray set-up and sum as the emission shader
    const nx = (px + 0.5) / W * 2 - 1, ny = 1 - (py + 0.5) / H * 2, ro = mul(nx, ny, -1), b = mul(nx, ny, 1);
    let rd = b.map((q, i) => q - ro[i]); const len = Math.hypot(...rd); rd = rd.map(q => q / len);
    const t0 = rd.map((q, i) => (-L - ro[i]) / q), t1 = rd.map((q, i) => (L - ro[i]) / q);
    const near = Math.max(...t0.map((q, i) => Math.min(q, t1[i])), 0), far = Math.min(...t0.map((q, i) => Math.max(q, t1[i])));
    if (far <= near) return 0;
    const dt = (far - near) / steps; let a = 0;
    for (let s = 0.5; s <= steps; s += 1) { const p = ro.map((q, i) => q + rd[i] * (near + s * dt)); a += opacity * tri(p) * dt / (2 * L * Math.sqrt(3)) * 8; }
    return Math.min(1, a);
  };
  let worst = 0; const probes = [];
  for (const [fx, fy] of [[0.5, 0.5], [0.5, 0.35], [0.5, 0.65], [0.38, 0.5], [0.62, 0.42], [0.44, 0.58], [0.02, 0.02]]) {
    const px = Math.round(fx * W), py = Math.round(fy * H), b = new Uint8Array(4);
    gl.readPixels(px, H - 1 - py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const gpu = b[3] / 255, cpu = cpuAlpha(px, py);
    worst = Math.max(worst, Math.abs(gpu - cpu)); probes.push(`${gpu.toFixed(3)}/${cpu.toFixed(3)}`);
  }
  upKey = '';   // let the next frame restore the scene's own upload
  return { label: 'GPU volume opacity = CPU ray march of the same |ψ|² grid (7 pixels)', pass: worst < 0.03, maxAlphaDiff: +worst.toFixed(4), gpuOverCpu: probes.join(' ') };
};
