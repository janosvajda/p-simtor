/** Classical RK4 step for y' = f(t, y). y: array; returns new array. */
function rk4Step(f, t, y, h) {
  const k1 = f(t, y);
  const k2 = f(t + h / 2, y.map((v, i) => v + h / 2 * k1[i]));
  const k3 = f(t + h / 2, y.map((v, i) => v + h / 2 * k2[i]));
  const k4 = f(t + h, y.map((v, i) => v + h * k3[i]));
  return y.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}

// Dormand–Prince 5(4) coefficients (Dormand & Prince 1980; Hairer, Nørsett & Wanner, Table 5.2).
const DP = {
  c: [0, 1 / 5, 3 / 10, 4 / 5, 8 / 9, 1, 1],
  a: [[], [1 / 5], [3 / 40, 9 / 40], [44 / 45, -56 / 15, 32 / 9],
    [19372 / 6561, -25360 / 2187, 64448 / 6561, -212 / 729],
    [9017 / 3168, -355 / 33, 46732 / 5247, 49 / 176, -5103 / 18656],
    [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84]],
  b: [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84, 0],
  e: [71 / 57600, 0, -71 / 16695, 71 / 1920, -17253 / 339200, 22 / 525, -1 / 40],
};

/** The Dormand–Prince 5(4) tableau (for steppers built on top of dopri5). */
const DORMAND_PRINCE = DP;

/**
 * Adaptive Dormand–Prince 5(4) integration of y' = f(t, y) from t0 to t1.
 * Error control per component: |err_i| <= atol + rtol·max(|y_i|, |y_new_i|).
 * onStep(t, y) is called after every accepted step (return false to stop early).
 * Returns { t, y, steps, rejected, stopped }. Throws if tolerance cannot be met or
 * the step budget is exhausted; stopped is reserved for an intentional onStep stop.
 */
function dopri5(f, t0, y0, t1, { rtol = 1e-9, atol = 1e-12, h0, hmax = Infinity, maxSteps = 1e6, onStep } = {}) {
  if (!Number.isFinite(t0) || !Number.isFinite(t1) || !y0.length || !Array.from(y0).every(Number.isFinite)) throw new Error('dopri5: finite times and a non-empty finite state are required');
  if (!(Number.isFinite(rtol) && rtol > 0 && Number.isFinite(atol) && atol > 0)) throw new Error('dopri5: tolerances must be finite and positive');
  if (!(hmax > 0) || (hmax !== Infinity && !Number.isFinite(hmax)) || (h0 != null && !(Number.isFinite(h0) && h0 !== 0))) throw new Error('dopri5: step sizes must be non-zero and finite (hmax may be Infinity)');
  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);
}

// ---------------------------------------------------------------- linear algebra

/** Solve a tridiagonal system (Thomas algorithm). a: sub, b: diag, c: super, d: rhs. Works for complex via callers. */
function solveTridiagonal(a, b, c, d) {
  const n = b.length, cp = new Float64Array(n), dp = new Float64Array(n), x = new Float64Array(n);
  cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
  for (let i = 1; i < n; i++) {
    const m = b[i] - a[i] * cp[i - 1];
    cp[i] = c[i] / m;
    dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
  }
  x[n - 1] = dp[n - 1];
  for (let i = n - 2; i >= 0; i--) x[i] = dp[i] - cp[i] * x[i + 1];
  return x;
}

/**
 * All eigenvalues and eigenvectors of a real symmetric tridiagonal matrix (implicit QL with
 * Wilkinson shifts; Numerical Recipes "tqli"). diag: n diagonal entries; off: n−1 entries
 * coupling i and i+1. Returns { values, vectors } with vectors[i] the unit eigenvector of
 * values[i] (unsorted). Cost O(n³) with eigenvectors: fine to n ≈ 500 in a browser.
 */
function eigenTridiagonal(diag, off) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('eigenTridiagonal: off must have n − 1 entries');
  const d = Float64Array.from(diag), e = new Float64Array(n);
  e.set(off);
  const z = new Float64Array(n * n);
  for (let i = 0; i < n; i++) z[i * n + i] = 1;
  for (let l = 0; l < n; l++) {
    let iter = 0, m;
    do {
      for (m = l; m < n - 1; m++) {
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= Number.EPSILON * dd) break;
      }
      if (m !== l) {
        if (iter++ === 60) throw new Error('eigenTridiagonal: no convergence');
        let g = (d[l + 1] - d[l]) / (2 * e[l]);
        let r = Math.hypot(g, 1);
        g = d[m] - d[l] + e[l] / (g + (g >= 0 ? r : -r));
        let s = 1, c = 1, p = 0, i;
        for (i = m - 1; i >= l; i--) {
          let f = s * e[i];
          const b = c * e[i];
          r = Math.hypot(f, g);
          e[i + 1] = r;
          if (r === 0) { d[i + 1] -= p; e[m] = 0; break; }
          s = f / r; c = g / r;
          g = d[i + 1] - p;
          r = (d[i] - g) * s + 2 * c * b;
          p = s * r;

  ctx.fillStyle = C('--ink'); ctx.beginPath(); ctx.arc(o.x, o.y, 2.2, 0, 7); ctx.fill();
  // legend card, bottom-left: what each colour means
  const x0 = 16, w = Math.min(250, W - 32), y0 = H - (W < 600 ? 118 : 104) - (disp.cut ? 16 : 0);
  ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = C('--stage');
  ctx.beginPath(); ctx.roundRect(x0 - 8, y0 - 16, Math.min(420, W - 16), disp.cut ? 124 : 108, 8); ctx.fill(); ctx.restore();
  ctx.fillStyle = C('--muted'); ctx.font = '10.5px ui-sans-serif, system-ui';
  if (disp.view !== 'samples') {
    ctx.fillText(`glow: |ψ|² / max, ${TRANSFER[disp.transfer].label} (magma)`, x0, y0);
    for (let i = 0; i < w; i++) { const c = colormap('magma', i / w).map(v => Math.round(v * 255)); ctx.fillStyle = `rgb(${c})`; ctx.fillRect(x0 + i, y0 + 5, 1, 7); }
    ctx.fillStyle = C('--muted'); ctx.font = '10px ui-monospace, Menlo, monospace';
    const ends = disp.transfer === 'log3' ? ['10⁻³', '10⁻²', '10⁻¹', '1'] : ['0', '', '', '1'];
    ends.forEach((s, i) => { ctx.textAlign = i === 0 ? 'left' : i === 3 ? 'right' : 'center'; ctx.fillText(s, x0 + w * i / 3, y0 + 24); });
    ctx.textAlign = 'left';
  }
  const y1 = y0 + 44;
  if (disp.view !== 'volume') {
    ctx.font = '10.5px ui-sans-serif, system-ui';
    if (sim.basis === 'complex') {
      for (let i = 0; i < 64; i++) { const c = phaseRGB(2 * Math.PI * i / 64).map(v => Math.round(v * 255)); ctx.fillStyle = `rgb(${c})`; ctx.beginPath(); ctx.moveTo(x0 + 8, y1); ctx.arc(x0 + 8, y1, 8, -2 * Math.PI * i / 64, -2 * Math.PI * (i + 1.2) / 64, true); ctx.fill(); }
      ctx.fillStyle = C('--muted'); ctx.fillText('dot hue: phase arg ψ (0 → 2π, anticlockwise)', x0 + 24, y1 + 4);
    } else {
      ctx.fillStyle = C('--body-0'); ctx.beginPath(); ctx.arc(x0 + 4, y1, 4, 0, 7); ctx.fill();
      ctx.fillStyle = C('--muted'); ctx.fillText('ψ > 0', x0 + 13, y1 + 4);
      ctx.fillStyle = C('--body-1'); ctx.beginPath(); ctx.arc(x0 + 60, y1, 4, 0, 7); ctx.fill();
      ctx.fillStyle = C('--muted'); ctx.fillText('ψ < 0   (dots: samples of |ψ|²)', x0 + 69, y1 + 4);
    }
  }
  ctx.fillStyle = C('--muted'); ctx.font = '10.5px ui-sans-serif, system-ui';
  ctx.fillText(`axis ticks every ${step} a₀ = ${+(step * A0_PM / 1000).toPrecision(3)} nm · ● nucleus (not to scale)`, x0, y1 + 24);
  if (disp.cut) ctx.fillText('cutaway: half-space y > 0 removed (volume and dots)', x0, y1 + 40);
  // big state label, bottom-right
  ctx.textAlign = 'right'; ctx.fillStyle = C('--ink'); ctx.font = `600 ${W < 600 ? 20 : 30}px ui-sans-serif, system-ui`;
  ctx.fillText(sim.name, W - 18, H - (W < 600 ? 150 : 30));
  ctx.font = '11px ui-sans-serif, system-ui'; ctx.fillStyle = C('--muted');
  ctx.fillText(sim.basis === 'complex' ? 'complex basis: definite L_z = mħ' : 'real orbital', W - 18, H - (W < 600 ? 132 : 10));
  ctx.textAlign = 'left';
}

// ------------------------------------------------------------------ figures below the scene
function bench({ eqs, figs, createPlot, createEquation, M }) {
  const radial = createPlot({ title: 'Radial probability P(r) = r²R²(r): exact curve vs histogram of the samples', height: 300,
    x: { label: 'r', unit: 'a₀', min: 0, max: 30 }, y: { label: 'P(r)', unit: 'a₀⁻¹', min: 0, max: 0.1 } });
  const sliceCanvas = el('canvas'), sliceHead = el('span', { class: 't' }, '');
  const slice = el('figure', { class: 'psim-figure' }, el('div', { class: 'psim-plot-head' }, sliceHead, el('span', { class: 'l' }, '')), el('div', { class: 'ho-slice' }, sliceCanvas));
  figs.append(radial.el, slice);
  let cur = null;
  const n_ = M.i('n'), l_ = M.i('l'), Z_ = M.i('Z');
  const psiEq = createEquation({
    title: 'One stationary state, separated into radial and angular factors',
    lhs: { mathml: `${M.sub(M.i('ψ'), `${n_}${l_}${M.i('m')}`)}`, label: 'state shown', value: () => cur?.name ?? '' },
    op: '=',
    terms: [
      { id: 'rad', mathml: `${M.sub(M.i('R'), `${n_}${l_}`)}${M.paren(M.i('r'))}`, label: 'radial factor: e^(−Zr/na₀) × Laguerre polynomial', color: '--body-2', value: () => cur ? `${cur.nodes.length} radial node${cur.nodes.length === 1 ? '' : 's'}` : '' },
      { id: 'ang', sign: '×', mathml: `${M.sub(M.i('Y'), `${l_}${M.i('m')}`)}${M.paren(`${M.i('θ')}<mo>,</mo>${M.i('φ')}`)}`, label: 'angular factor: spherical harmonic', color: '--body-4', value: () => cur ? `${cur.l} angular node${cur.l === 1 ? '' : 's'}` : '' },
    ],
  });
  const eEq = createEquation({
    title: 'Energy depends only on n (all l, m of a shell are degenerate)',
    lhs: { mathml: M.sub(M.i('E'), n_), label: 'energy', unit: 'eV', digits: 6, value: () => cur?.E },
    terms: [{ id: 'E', mathml: `<mo>−</mo>${M.frac(`${M.sup(Z_, M.n(2))}${M.i('Ry')}`, M.sup(n_, M.n(2)))}`, label: 'Ry = 13.605693 eV (CODATA 2018)', color: '--warn', unit: 'eV', digits: 6, value: () => cur?.E }],
  });
  const rEq = createEquation({
    title: 'Mean distance from the nucleus',
    lhs: { mathml: `<mo>⟨</mo>${M.i('r')}<mo>⟩</mo>`, label: 'expectation value', unit: 'a₀', digits: 5, value: () => cur?.meanRExact },
    terms: [{ id: 'mean', mathml: `${M.frac(M.sub(M.i('a'), M.n(0)), `${M.n(2)}${Z_}`)}<mo>[</mo>${M.n(3)}${M.sup(n_, M.n(2))}<mo>−</mo>${l_}${M.paren(`${l_}<mo>+</mo>${M.n(1)}`)}<mo>]</mo>`, label: 'closed form; sample mean in Diagnostics', color: '--accent', unit: 'a₀', digits: 5, value: () => cur?.meanRExact }],
    where: [{ mathml: M.sub(M.i('a'), M.n(0)), meaning: 'Bohr radius (CODATA 2018)', value: () => A0_PM, unit: 'pm' }],
    link: radial,
  });
  eqs.append(psiEq.el, eEq.el, rEq.el);

  function drawSlice() {
    const sim = cur; if (!sim) return;
    const box = sliceCanvas.parentNode, dpr = devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
    sliceCanvas.width = W * dpr; sliceCanvas.height = H * dpr;
    const ctx = sliceCanvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const S = Math.min(W - 70, H - 46), ox = (W - S) / 2 + 14, oy = 10, n = 140, L = sim.L, hh = 2 * L / n;
    // plane with the most probability (xz, yz or xy through the nucleus)
    const planes = [['x', 'z', (u, v) => [u, 0, v]], ['y', 'z', (u, v) => [0, u, v]], ['x', 'y', (u, v) => [u, v, 0]]];
    let best = null;
    for (const pl of planes) { let s = 0; const vals = new Float64Array(n * n), re = new Float64Array(n * n);
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const p = sim.psi(...pl[2](-L + (i + 0.5) * hh, -L + (j + 0.5) * hh)); vals[i + n * j] = p.re * p.re + p.im * p.im; re[i + n * j] = p.re; s += vals[i + n * j]; }
      if (!best || s > best.s * 1.000001) best = { pl, s, vals, re }; }
    const { pl, vals, re } = best;
    let mx = 0; for (const v of vals) mx = Math.max(mx, v);
    let amax = 0; for (const v of re) amax = Math.max(amax, Math.abs(v));
    const img = ctx.createImageData(n, n);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const k = i + n * j, c = sim.basis === 'real' ? colormap('coolwarm', 0.5 + 0.5 * Math.sign(re[k]) * Math.sqrt(Math.abs(re[k]) / amax)) : colormap('magma', TRANSFER.log3.f(vals[k] / mx));
      const q = 4 * (i + n * (n - 1 - j)); img.data[q] = c[0] * 255; img.data[q + 1] = c[1] * 255; img.data[q + 2] = c[2] * 255; img.data[q + 3] = 255;
    }
    const off = document.createElement('canvas'); off.width = n; off.height = n; off.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(off, ox, oy, S, S);
    const X = u => ox + (u + L) / (2 * L) * S, Yp = v => oy + S - (v + L) / (2 * L) * S;
    if (sim.basis === 'real') {   // nodal lines ψ = 0 in this plane
      ctx.strokeStyle = view2.color('--ink'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      for (const c of contourLines(re, { shape: [n, n], spacing: hh, origin: [-L + hh / 2, -L + hh / 2] }, 0)) {
        ctx.beginPath(); c.points.forEach(([u, v], i) => (i ? ctx.lineTo(X(u), Yp(v)) : ctx.moveTo(X(u), Yp(v)))); if (c.closed) ctx.closePath(); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = view2.color('--line-strong'); ctx.strokeRect(ox, oy, S, S);
    ctx.fillStyle = view2.color('--muted'); ctx.font = '10.5px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
    const st = nice(L / 2.2);
    for (let v = -Math.floor(L / st) * st; v <= L + 1e-9; v += st) { ctx.fillText(String(+v.toPrecision(4)).replace('-', '−'), X(v), oy + S + 14); }
    ctx.fillText(`${pl[0]} (a₀)`, ox + S / 2, oy + S + 30);
    ctx.textAlign = 'right';
    for (let v = -Math.floor(L / st) * st; v <= L + 1e-9; v += st) ctx.fillText(String(+v.toPrecision(4)).replace('-', '−'), ox - 6, Yp(v) + 4);
    ctx.save(); ctx.translate(ox - 36, oy + S / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(`${pl[1]} (a₀)`, 0, 0); ctx.restore();
    ctx.textAlign = 'left';
    sliceHead.textContent = sim.basis === 'real'
      ? `Slice through the nucleus (${pl[0]}${pl[1]}-plane): ψ, red > 0, blue < 0 (signed √ scale); dashed: nodes ψ = 0`
      : `Slice through the nucleus (${pl[0]}${pl[1]}-plane): |ψ|² / max, log 3 decades (magma)`;
  }
  new ResizeObserver(() => drawSlice()).observe(slice);

  return {
    update(sim, t, { rebuilt }) {
      cur = sim; psiEq.update(); eEq.update(); rEq.update();
      if (!rebuilt) return;
      const xmax = sim.hist.edges ? sim.hist.edges[sim.hist.edges.length - 1] : sim.L * 1.25;
      let pmax = 0; for (let k = 0; k <= 400; k++) pmax = Math.max(pmax, sim.P(xmax * k / 400));
      radial.setX({ min: 0, max: xmax }).setY({ min: 0, max: pmax * 1.18 });
      for (const id of ['n0', 'n1', 'n2', 'n3', 'n4']) radial.remove(id);
      radial.fn('exact', r => sim.P(r), { color: '--body-2', label: 'exact r²R²', width: 2 });
      const centers = sim.hist.centers ?? [], dens = sim.hist.values ?? [], errs = sim.hist.errors ?? [];
      radial.data('hist', centers.map((c, i) => [c, dens[i]]), { color: '--ink-2', dots: true, r: 2, errors: errs, label: `histogram of ${sim.N.toLocaleString('en')} sampled r (±1σ)` });
      sim.nodes.forEach((r, i) => radial.vline(`n${i}`, r, { color: '--muted', label: i === 0 ? 'radial nodes' : '' }));
      radial.vline('mean', sim.meanRExact, { color: '--accent', label: `⟨r⟩ = ${+sim.meanRExact.toPrecision(4)} a₀` });
      radial.invalidate(); radial.draw();
      drawSlice();
    },
  };
}

const view2 = { color: n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() };
const app = createInstrument({
  title: 'Hydrogen orbitals in 3D',
  subtitle: 'Exact eigenstates ψnlm = R(r)·Y(θ,φ) of the Schrödinger equation: probability density |ψ|² as a ray-marched volume and as independent samples',
  tier: 'analytical',
  tierReason: 'Every value is the closed-form hydrogen-like eigenfunction (non-relativistic, point nucleus); normalisation, orthogonality, Hψ = Eψ, energies, ⟨r⟩, node positions and orbital labels are checked against independent identities, the samples against the exact distributions, and the displayed density grid against the exact |ψ|² (Verification).',
  layout: 'workbench', gl: true, drawGL, draw, bench,
  params: PARAMS, create: createSim, timeDependent: false,
  hudLine: sim => `E${sim.n} = ${sim.E.toPrecision(5).replace('-', '−')} eV · ⟨r⟩ = ${+sim.meanRExact.toPrecision(4)} a₀ · ${sim.N.toLocaleString('en')} samples · static state, drag to rotate`,
  onPointer(canvas) {
    cam.attach(canvas);
    canvas.classList.add('grab');
    canvas.addEventListener('pointerdown', () => { dragging = true; });
    addEventListener('pointerup', () => { dragging = false; });
  },
  model: {
    legend: ['glow: probability density |ψ|² (exact, on a 96³ grid)', 'dots: independent samples of |ψ|²; colour = sign (or phase) of ψ'],
    equations: [
      { caption: 'Time-independent Schrödinger equation of a one-electron atom (point nucleus of charge Ze, infinite mass):', mathml: '<math display="block"><mrow><mo>[</mo><mo>−</mo><mfrac><msup><mi>ħ</mi><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub></mrow></mfrac><msup><mo>∇</mo><mn>2</mn></msup><mo>−</mo><mfrac><mrow><mi>Z</mi><msup><mi>e</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mi>r</mi></mrow></mfrac><mo>]</mo><mi>ψ</mi><mo>=</mo><mi>E</mi><mi>ψ</mi></mrow></math>' },
      { caption: 'Its bound states, with ρ = 2Zr/(na₀) and generalised Laguerre polynomials L:', mathml: '<math display="block"><mrow><msub><mi>ψ</mi><mrow><mi>n</mi><mi>l</mi><mi>m</mi></mrow></msub><mo>=</mo><msub><mi>N</mi><mrow><mi>n</mi><mi>l</mi></mrow></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>ρ</mi><mo>/</mo><mn>2</mn></mrow></msup><msup><mi>ρ</mi><mi>l</mi></msup><msubsup><mi>L</mi><mrow><mi>n</mi><mo>−</mo><mi>l</mi><mo>−</mo><mn>1</mn></mrow><mrow><mo>(</mo><mn>2</mn><mi>l</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow></msubsup><mo>(</mo><mi>ρ</mi><mo>)</mo><mspace width="0.2em"/><msub><mi>Y</mi><mrow><mi>l</mi><mi>m</mi></mrow></msub><mo>(</mo><mi>θ</mi><mo>,</mo><mi>φ</mi><mo>)</mo><mo>,</mo><mspace width="0.6em"/><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><msup><mi>Z</mi><mn>2</mn></msup><mi>Ry</mi></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></math>' },
    ],
    assumptions: [
      'One electron, non-relativistic, point nucleus of infinite mass. Neglected: fine structure (relative size ~α² ≈ 5×10⁻⁵), Lamb shift, hyperfine structure and the reduced-mass correction (0.054 % in lengths and energies for hydrogen).',
      'Multi-electron atoms have no such closed-form orbitals; these shapes are exact only for H, He⁺, Li²⁺ … (Z = 1 … 10 offered).',
      'Stationary states: |ψ|² does not change in time, so there is no physical time axis. The electron does not orbit; the cloud is the probability of finding it at each position in a measurement.',
      'Real orbitals (p_x, d_xy …) are equal-weight superpositions of m = +|m| and −|m|; they are not eigenstates of L_z. The complex basis shows the states of definite L_z = mħ, whose density is symmetric about the z-axis.',
      'Overall sign (phase) of ψ is a convention; only the relative sign or phase between regions has meaning.',
    ],
    conventions: [
      'Geometry is physical space in Bohr radii (a₀ = 52.918 pm); the camera is a perspective view with z up. Dotted lines are the x, y, z axes through the nucleus, with ticks at the stated spacing.',
      'Glow (volume): |ψ|² sampled on a 96³ grid filling the cube that contains ≥ 99.9 % of the probability, ray-marched on the GPU with trilinear interpolation (measured error in Verification). Brightness and opacity are display transfer functions of |ψ|²/max (log over 3 decades by default; √ and linear selectable), not a physical optical depth. In the light theme the same density is drawn as absorbing ink.',
      'Dots: N independent positions drawn from |ψ|² (seeded). The density of dots is the physical probability density; dot brightness and size are display choices. Dot colour: sign of ψ (real basis) or phase arg ψ (complex basis, hue wheel).',
      'The nucleus marker is not to scale (the proton radius is 1.6×10⁻⁵ a₀). Cutaway removes the half-space y > 0 from both the volume and the dots.',
      'Camera rotation is a viewing aid; it is off when the system requests reduced motion.',
    ],
    references: [
      'L. D. Landau & E. M. Lifshitz, Quantum Mechanics (Non-relativistic Theory), 3rd ed., §36 (Coulomb field).',
      'H. A. Bethe & E. E. Salpeter, Quantum Mechanics of One- and Two-Electron Atoms (Springer, 1957), §1–3.',
      'D. J. Griffiths & D. F. Schroeter, Introduction to Quantum Mechanics, 3rd ed., §4.2 (hydrogen atom; ⟨r⟩, radial functions).',
      'E. Tiesinga et al., CODATA 2018, Rev. Mod. Phys. 93, 025010 (2021): a₀, Ry, Eh.',
    ],
  },
  extraSections(side, { section: sec }) {
    const d = sec('Display (does not change the model)');
    d.body.append(
      el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, 'View')), select(VIEWS, disp.view, v => { disp.view = v; })),
      el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, 'Glow transfer function')), select(Object.entries(TRANSFER).map(([value, t]) => ({ value, label: t.label })), disp.transfer, v => { disp.transfer = v; })),
      toggle('Cutaway: remove half-space y > 0', disp.cut, v => { disp.cut = v; }),
      toggle('Rotate camera slowly', disp.rotate, v => { disp.rotate = v; }),
      el('p', { class: 'psim-hint' }, 'Drag the scene to rotate, scroll to zoom. The cutaway reveals the nested shells (radial nodes) of s and higher-n states.'),
    );
    side.insertBefore(d, side.children[1]);
  },
});

// ------------------------------------------------------------------ GPU self-test: renderer output vs a CPU ray march of the same data
window.psim.selfTest = () => {
  const gl = document.querySelector('canvas.psim-gl').getContext('webgl2'), sim = app.sim;
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, L = sim.L, G = sim.G;
  const c = orbitCamera({ distance: 2.6 * L, yaw: 0.3, pitch: 0.25, fov: 0.7 }), opacity = 0.25, steps = 200;
  const T = TRANSFER.log3.f, d = new Float32Array(G * G * G);
  for (let i = 0; i < d.length; i++) d[i] = T(sim.rho[i] / sim.rhoMax);
  const v = createVolumeRenderer(gl); v.update(d, G, G, G, { range: [0, 1] });
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  v.draw(c, { aspect: W / H, box: [[-L, -L, -L], [L, L, L]], colormap: 'magma', opacity, steps, mode: 'emission' });
  const inv = invert(c.matrices(W / H).viewProj), mul = (x, y, z) => { const r = [0, 1, 2, 3].map(i => inv[i] * x + inv[4 + i] * y + inv[8 + i] * z + inv[12 + i]); return r.slice(0, 3).map(q => q / r[3]); };
  const at = (i, j, k) => d[Math.min(G - 1, Math.max(0, i)) + G * (Math.min(G - 1, Math.max(0, j)) + G * Math.min(G - 1, Math.max(0, k)))];
  const tri = p => { const f = p.map(q => (q + L) / (2 * L) * G - 0.5), i = f.map(Math.floor), w = f.map((q, a) => q - i[a]); let s = 0;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let e = 0; e < 2; e++) s += (a ? w[0] : 1 - w[0]) * (b ? w[1] : 1 - w[1]) * (e ? w[2] : 1 - w[2]) * at(i[0] + a, i[1] + b, i[2] + e); return s; };
  const cpuAlpha = (px, py) => {   // same ray set-up and sum as the emission shader
    const nx = (px + 0.5) / W * 2 - 1, ny = 1 - (py + 0.5) / H * 2, ro = mul(nx, ny, -1), b = mul(nx, ny, 1);
    let rd = b.map((q, i) => q - ro[i]); const len = Math.hypot(...rd); rd = rd.map(q => q / len);
    const t0 = rd.map((q, i) => (-L - ro[i]) / q), t1 = rd.map((q, i) => (L - ro[i]) / q);
    const near = Math.max(...t0.map((q, i) => Math.min(q, t1[i])), 0), far = Math.min(...t0.map((q, i) => Math.max(q, t1[i])));
    if (far <= near) return 0;
    const dt = (far - near) / steps; let a = 0;
    for (let s = 0.5; s <= steps; s += 1) { const p = ro.map((q, i) => q + rd[i] * (near + s * dt)); a += opacity * tri(p) * dt / (2 * L * Math.sqrt(3)) * 8; }
    return Math.min(1, a);
  };
  let worst = 0; const probes = [];
  for (const [fx, fy] of [[0.5, 0.5], [0.5, 0.35], [0.5, 0.65], [0.38, 0.5], [0.62, 0.42], [0.44, 0.58], [0.02, 0.02]]) {
    const px = Math.round(fx * W), py = Math.round(fy * H), b = new Uint8Array(4);
    gl.readPixels(px, H - 1 - py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    const gpu = b[3] / 255, cpu = cpuAlpha(px, py);
    worst = Math.max(worst, Math.abs(gpu - cpu)); probes.push(`${gpu.toFixed(3)}/${cpu.toFixed(3)}`);
  }
  upKey = '';   // let the next frame restore the scene's own upload
  return { label: 'GPU volume opacity = CPU ray march of the same |ψ|² grid (7 pixels)', pass: worst < 0.03, maxAlphaDiff: +worst.toFixed(4), gpuOverCpu: probes.join(' ') };
};
