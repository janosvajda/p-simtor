  { key: 'd2', label: 'Gap Δ₂ = E₂ − E₁', min: 0.01, max: 200, value: 25, log: true, unit: 'meV', digits: 3 },

/** Full equilibrium at temperature T (K) for gaps (meV) and degeneracies. */
function equilibrium(T, d1, d2, g) {
  const E = [0, d1, d1 + d2];

  const r = canonicalEnsemble(E, { kT, degeneracies: g });

/**
 * Temperature at which the middle level's population peaks (interior maximum).
 * P1 = 1 / [(g0/g1) e^{βΔ1} + 1 + (g2/g1) e^{−βΔ2}]; d/dβ of the bracket vanishes at
 * e^{β(Δ1+Δ2)} = g2Δ2/(g0Δ1). An interior maximum exists only if g2Δ2 > g0Δ1.

function middlePeak(d1, d2, g) {
  const ratio = g[2] * d2 / (g[0] * d1);
  if (!(ratio > 1)) return null;
  const kT = (d1 + d2) / Math.log(ratio);
  return { T: kT / KB_MEV, kT };

/** Temperature of the heat-capacity (Schottky) maximum, by golden-section search on log T. */
function schottkyPeak(d1, d2, g) {
  const f = lt => equilibrium(10 ** lt, d1, d2, g).C;
  // coarse scan, then refine around the best grid point
  let best = 0, bv = -1;
  const lo = Math.log10(T_RANGE[0]) - 2, hi = Math.log10(T_RANGE[1]) + 2, n = 400;
  for (let i = 0; i <= n; i++) { const lt = lo + (hi - lo) * i / n, v = f(lt); if (v > bv) { bv = v; best = lt; } }

  const gr = (Math.sqrt(5) - 1) / 2;
  for (let k = 0; k < 80; k++) {
    const c = b - gr * (b - a), d = a + gr * (b - a);
    if (f(c) > f(d)) b = d; else a = c;
  }
  const lt = (a + b) / 2;
  return { T: 10 ** lt, C: f(lt) };
}

function createSim(p) {

  const eq = equilibrium(p.T, p.d1, p.d2, g);

  const peak1 = middlePeak(p.d1, p.d2, g);
  const schottky = schottkyPeak(p.d1, p.d2, g);
  const curve = key => T => equilibrium(T, p.d1, p.d2, g)[key];
  // P_i(T) sampled once per rebuild for the stage (log-spaced over the figure range)
  const curves = { T: [], P: [[], [], []] };
  for (let k = 0; k <= 300; k++) {
    const T = T_RANGE[0] * (T_RANGE[1] / T_RANGE[0]) ** (k / 300), P = equilibrium(T, p.d1, p.d2, g).P;
    curves.T.push(T); for (let i = 0; i < 3; i++) curves.P[i].push(P[i]);

    t: 0, timeDependent: false, params: p, g, gsum, ...eq, peak1, schottky, curves,
    pop: i => T => equilibrium(T, p.d1, p.d2, g).P[i],
    heatCapacity: curve('C'), entropy: curve('S'),
    diagnostics() {
      const d = [
        { key: 'P0', label: 'Ground population P₀', value: eq.P[0], kind: 'value', text: eq.P[0].toFixed(4) },
        { key: 'P1', label: 'Middle population P₁', value: eq.P[1], kind: 'value', text: eq.P[1].toFixed(4) },
        { key: 'P2', label: 'Top population P₂', value: eq.P[2], kind: 'value', text: eq.P[2].toFixed(4) },
        { key: 'kT', label: 'Thermal energy k_BT', value: eq.kT, kind: 'value', unit: 'meV' },
        { key: 'U', label: 'Mean energy U (above E₀)', value: eq.U, kind: 'value', unit: 'meV' },
        { key: 'C', label: 'Heat capacity C/k_B', value: eq.C, kind: 'value', text: eq.C.toFixed(4) },
        { key: 'S', label: 'Entropy S/k_B (max ln Σg)', value: eq.S, kind: 'value', text: `${eq.S.toFixed(4)} of ${Math.log(gsum).toFixed(4)}` },
        { key: 'Tc', label: 'Schottky peak (max C)', value: schottky.T, kind: 'value', unit: 'K' },
      ];
      if (peak1) d.push({ key: 'T1', label: 'Middle-level peak T*', value: peak1.T, kind: 'value', unit: 'K' });
      return d;
    },
    state: () => ({ T: p.T, levels_meV: eq.E, degeneracies: g, populations: eq.P, U_meV: eq.U, C_over_kB: eq.C, S_over_kB: eq.S }),
    record() {
      const rows = [];
      for (let i = 0; i <= 200; i++) {
        const T = T_RANGE[0] * (T_RANGE[1] / T_RANGE[0]) ** (i / 200), e = equilibrium(T, p.d1, p.d2, g);

// ---------------------------------------------------------------------------- verification
function verify() {
  const checks = [];
  const logGrid = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a * (b / a) ** (i / n));
  const Ts = logGrid(0.5, 5000, 120);
  const cases = [
    { d1: 5, d2: 25, g: [1, 1, 1] }, { d1: 10, d2: 10, g: [1, 1, 1] },
    { d1: 10, d2: 10, g: [1, 1, 3] }, { d1: 0.3, d2: 120, g: [2, 5, 1] },
  ];

  // 1. Closed form for the equally spaced, non-degenerate system: P_i = e^{−ix}/(1+e^{−x}+e^{−2x})
  let e1 = 0;
  for (const T of Ts) {
    const x = 10 / (KB_MEV * T), z = 1 + Math.exp(-x) + Math.exp(-2 * x);
    const P = equilibrium(T, 10, 10, [1, 1, 1]).P;
    for (let i = 0; i < 3; i++) e1 = Math.max(e1, Math.abs(P[i] - Math.exp(-i * x) / z));
  }
  checks.push({ label: 'Equal spacing: populations vs closed form e^(−iΔ/kT)/Z (121 temperatures)', value: `max |ΔP| = ${e1.toExponential(1)}`, pass: e1 < 1e-14 });

  // 2. Normalisation and no population inversion (P_i/g_i decreases with energy) at every T
  let eNorm = 0, inversions = 0, monotone = 0;
  for (const c of cases) {
    let prev = null;
    for (const T of Ts) {
      const P = equilibrium(T, c.d1, c.d2, c.g).P;
      eNorm = Math.max(eNorm, Math.abs(P[0] + P[1] + P[2] - 1));
      if (P[1] / c.g[1] > P[0] / c.g[0] * (1 + 1e-12) || P[2] / c.g[2] > P[1] / c.g[1] * (1 + 1e-12)) inversions++;
      if (prev && (P[0] > prev[0] * (1 + 1e-12) || P[2] < prev[2] * (1 - 1e-12))) monotone++;
      prev = P;
    }
  }
  checks.push({ label: 'ΣP_i = 1 at all T (4 level schemes)', value: `max |ΣP − 1| = ${eNorm.toExponential(1)}`, pass: eNorm < 1e-14 });
  checks.push({ label: 'No inversion at T > 0: P_i/g_i falls with energy; P₀ only falls, P₂ only rises', value: `${inversions + monotone} violations in ${4 * Ts.length} states`, pass: inversions + monotone === 0 });

  // 3. Limits: T → 0 ground state; T → ∞ populations g_i/Σg and S → ln Σg
  const cold = equilibrium(0.5, 10, 10, [1, 1, 3]), hot = equilibrium(1e9, 10, 10, [1, 1, 3]);
  const eHot = Math.max(Math.abs(hot.P[0] - 0.2), Math.abs(hot.P[1] - 0.2), Math.abs(hot.P[2] - 0.6));
  checks.push({ label: 'Cold limit (0.5 K, Δ = 10 meV): P₀ → 1, S → ln g₀ = 0', value: `1 − P₀ = ${(1 - cold.P[0]).toExponential(1)}, S = ${cold.S.toExponential(1)}`, pass: 1 - cold.P[0] < 1e-90 && cold.S < 1e-90 });
  checks.push({ label: 'Hot limit (10⁹ K, g = 1,1,3): P → g/Σg = (0.2, 0.2, 0.6), S → ln 5', value: `max |ΔP| = ${eHot.toExponential(1)}, |S − ln 5| = ${Math.abs(hot.S - Math.log(5)).toExponential(1)}`, pass: eHot < 1e-6 && Math.abs(hot.S - Math.log(5)) < 1e-9 });

  // 4. Thermodynamic consistency: C = dU/dT and S = −dF/dT (central differences in T)
  let eC = 0, eS = 0;
  for (const c of cases) for (const T of logGrid(2, 2000, 30)) {
    const h = T * 1e-4, up = equilibrium(T + h, c.d1, c.d2, c.g), dn = equilibrium(T - h, c.d1, c.d2, c.g), mid = equilibrium(T, c.d1, c.d2, c.g);
    const Cfd = (up.U - dn.U) / (2 * h) / KB_MEV, Sfd = -(up.F - dn.F) / (2 * h) / KB_MEV;
    eC = Math.max(eC, Math.abs(Cfd - mid.C) / Math.max(mid.C, 1e-3));
    eS = Math.max(eS, Math.abs(Sfd - mid.S) / Math.max(mid.S, 1e-3));
  }
  checks.push({ label: 'C/k_B = Var(E)/(k_BT)² agrees with dU/dT (finite difference)', value: `max rel. diff ${eC.toExponential(1)}`, pass: eC < 1e-6 });
  checks.push({ label: 'S/k_B = ln Z + U/k_BT agrees with −dF/dT (finite difference)', value: `max rel. diff ${eS.toExponential(1)}`, pass: eS < 1e-6 });

  // 5. Degenerate entropy as a probability sum: S = −Σ P ln(P/g)
  let eSum = 0;
  for (const c of cases) for (const T of logGrid(2, 2000, 30)) {
    const r = equilibrium(T, c.d1, c.d2, c.g);
    const s = -r.P.reduce((a, p, i) => a + (p > 0 ? p * Math.log(p / c.g[i]) : 0), 0);
    eSum = Math.max(eSum, Math.abs(s - r.S));
  }
  checks.push({ label: 'S = −Σ P_i ln(P_i/g_i) agrees with the partition-function entropy', value: `max |ΔS| = ${eSum.toExponential(1)}`, pass: eSum < 1e-12 });

  // 6. Published benchmark: two-level Schottky anomaly peak C_max = 0.4392 k_B at k_BT = 0.4168 Δ
  //    (third level pushed out of reach with Δ₂ = 10⁶ meV)
  const sk = schottkyPeak(10, 1e6, [1, 1, 1]), kTp = KB_MEV * sk.T / 10;
  checks.push({ label: 'Two-level limit: Schottky peak vs published C_max = 0.4392 k_B at k_BT = 0.4168 Δ', value: `C_max = ${sk.C.toFixed(4)} k_B at k_BT = ${kTp.toFixed(4)} Δ`, pass: Math.abs(sk.C - 0.4392) < 1e-4 && Math.abs(kTp - 0.4168) < 1e-4 });

  // 7. Middle-level maximum: analytic T* = (Δ1+Δ2)/(k_B ln(g2Δ2/(g0Δ1))) vs a numerical search
  const pk = middlePeak(5, 25, [1, 1, 1]);
  let bestT = 0, bestP = -1;
  for (const T of logGrid(10, 2000, 20000)) { const P1 = equilibrium(T, 5, 25, [1, 1, 1]).P[1]; if (P1 > bestP) { bestP = P1; bestT = T; } }
  const ePk = Math.abs(bestT - pk.T) / pk.T;
  checks.push({ label: 'Middle-level peak (Δ = 5, 25 meV): analytic T* vs numerical search of P₁(T)', value: `T* = ${pk.T.toFixed(2)} K, search ${bestT.toFixed(2)} K (rel. ${ePk.toExponential(1)}); P₁max = ${bestP.toFixed(4)} > 1/3`, pass: ePk < 1e-3 && bestP > 1 / 3 });

  return {
    summary: 'Canonical populations checked against closed forms, thermodynamic identities, high/low-T limits and the published two-level Schottky peak:',
    checks,
    notes: [
      'Exact within the stated model: three fixed levels in equilibrium with a heat bath. Real systems have further levels and level shifts that this model omits.',
      'Benchmark source for the Schottky peak: x = Δ/k_BT ≈ 2.3994 solves x·tanh(x/2) = 2, giving C_max ≈ 0.4392 k_B (e.g. Kittel & Kroemer, Thermal Physics, 2nd ed., ch. 3).',
    ],
  };
}

return { KB_MEV, T_RANGE, PARAMS, PRESETS, equilibrium, middlePeak, schottkyPeak, createSim, verify };
})();

  const xc = TX(r, sim.params.T);
  ctx.strokeStyle = C('--ink'); ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.moveTo(xc, r.y0 - 4); ctx.lineTo(xc, r.y1); ctx.stroke(); ctx.setLineDash([]);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = C(COL[i]); ctx.beginPath(); ctx.arc(xc, Y(sim.P[i]), 4.5, 0, 7); ctx.fill();
    ctx.strokeStyle = C('--panel'); ctx.lineWidth = 1.5; ctx.stroke();
  }
  // direct labels at the right end
  ctx.font = SANS; ctx.textAlign = 'right';
  const ends = [0, 1, 2].map(i => ({ i, y: Y(sim.curves.P[i].at(-1)) })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < 3; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  for (const { i, y } of ends) { ctx.fillStyle = C(COL[i]); ctx.fillText(`P${'₀₁₂'[i]}`, r.x1 - 4, y - 5); }
  ctx.fillStyle = C('--muted'); ctx.textAlign = 'start'; ctx.font = SANS;
  ctx.fillText('dashed: hot limit gᵢ/Σg', r.x0 + 4, r.y0 - 6);
}

function draw(ctx, sim, view) {
  const L = layout(view);
  drawLadder(ctx, sim, view, L.lad);
  drawCurves(ctx, sim, view, L.cur);
}

function onPointer(canvas, view) {
  let drag = false;
  const set = e => {
    const r = canvas.getBoundingClientRect(), L = layout(view).cur;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (!drag && (x < L.x0 - 10 || x > L.x1 + 10 || y < L.y0 - 20 || y > L.y1 + 20)) return false;
    setParamFn?.('T', +TinvX(L, x).toPrecision(4));
    return true;
  };
  canvas.addEventListener('pointerdown', e => { if (set(e)) { drag = true; canvas.setPointerCapture(e.pointerId); } });
  canvas.addEventListener('pointermove', e => { if (drag) set(e); });
  canvas.addEventListener('pointerup', () => { drag = false; });
}

// ------------------------------------------------------------------ workbench: equations + figures
function bench({ eqs, figs, createPlot, createEquation, createDerivation, M, setParam }) {
  setParamFn = setParam;
  const setT = T => setParam('T', +T.toPrecision(4));
  const pops = createPlot({
    title: 'Populations on a log scale: the exponential Boltzmann tails when k_BT ≪ Δ', height: 280,
    x: { label: 'temperature T', unit: 'K', min: T_RANGE[0], max: T_RANGE[1], log: true },
    y: { label: 'population P_i', min: 1e-8, max: 1, log: true },
    onCursor: setT,
  });
  const thermo = createPlot({
    title: 'Heat capacity and entropy per system', height: 260,
    x: { label: 'temperature T', unit: 'K', min: T_RANGE[0], max: T_RANGE[1], log: true },
    y: { label: 'C/k_B, S/k_B', min: 0, max: 1.2 },
    onCursor: setT,
  });
  figs.append(pops.el, thermo.el);

  const cur = { sim: null };
  const S = () => cur.sim;
  const Ei = M.sub(M.i('E'), M.i('i')), gi = M.sub(M.i('g'), M.i('i')), kT = `${M.sub(M.i('k'), M.i('B'))}${M.i('T')}`;
  const level = i => createEquation({
    title: i === 0 ? 'Boltzmann population of each level, term by term (live at the current T)' : undefined,
    lhs: { mathml: M.sub(M.i('P'), M.n(i)), label: `population of ${NAME[i]}`, value: () => S().P[i], digits: 4 },
    terms: [
      { id: `p${i}`, mathml: M.sub(M.i('g'), M.n(i)), label: 'degeneracy (number of states)', color: COL[i], value: () => S().g[i], digits: 2 },
      { id: `p${i}`, sign: '×', mathml: M.sup(M.i('e'), M.row(`<mo>−</mo>${M.frac(M.sub(M.i('E'), M.n(i)), kT)}`)), label: 'Boltzmann factor', color: COL[i], value: () => Math.exp(-S().E[i] / S().kT), digits: 4 },
      { id: `p${i}`, sign: '÷', mathml: M.i('Z'), label: 'partition function (normalises)', color: COL[i], value: () => S().g.reduce((a, g, j) => a + g * Math.exp(-S().E[j] / S().kT), 0), digits: 4 },
    ],
    link: pops,
  });
  const levelEqs = [0, 1, 2].map(level);
  const zEq = createEquation({
    title: 'Partition function and thermodynamics',
    lhs: { mathml: M.i('Z'), label: 'sum over the three levels', value: () => S().g.reduce((a, g, j) => a + g * Math.exp(-S().E[j] / S().kT), 0), digits: 4 },
    terms: [{ id: 'z', mathml: `<munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mn>2</mn></munderover>${gi}${M.sup(M.i('e'), M.row(`<mo>−</mo>${M.frac(Ei, kT)}`))}`, label: 'Σ gᵢ e^(−Eᵢ/k_BT); E₀ = 0', color: '--ink-2', value: () => S().g.reduce((a, g, j) => a + g * Math.exp(-S().E[j] / S().kT), 0), digits: 4 }],
    where: [
      { mathml: M.sub(M.i('k'), M.i('B')), meaning: 'Boltzmann constant (exact SI)', value: () => KB_MEV, unit: 'meV/K' },
      { mathml: `${M.i('C')}<mo>/</mo>${M.sub(M.i('k'), M.i('B'))}`, meaning: 'heat capacity = (⟨E²⟩ − ⟨E⟩²)/(k_BT)²', value: () => S().C },
      { mathml: `${M.i('S')}<mo>/</mo>${M.sub(M.i('k'), M.i('B'))}`, meaning: 'entropy = ln Z + U/k_BT', value: () => S().S },
    ],
    link: thermo,
  });
  const steps = createDerivation([
    { mathml: `${M.sub(M.i('P'), M.n(1))}<mo>=</mo>${M.frac(M.n(1), `${M.frac(M.sub(M.i('g'), M.n(0)), M.sub(M.i('g'), M.n(1)))}${M.sup(M.i('e'), M.row(`<mi>β</mi>${M.sub(M.i('Δ'), M.n(1))}`))}<mo>+</mo><mn>1</mn><mo>+</mo>${M.frac(M.sub(M.i('g'), M.n(2)), M.sub(M.i('g'), M.n(1)))}${M.sup(M.i('e'), M.row(`<mo>−</mo><mi>β</mi>${M.sub(M.i('Δ'), M.n(2))}`))}`)}`, note: 'Divide numerator and denominator by g₁e^(−βE₁), β = 1/k_BT. Heating lowers the first term (the ground state empties) but raises the last (the top level fills).' },
    { mathml: `${M.sup(M.i('e'), M.row(`<mi>β</mi><mo>(</mo>${M.sub(M.i('Δ'), M.n(1))}<mo>+</mo>${M.sub(M.i('Δ'), M.n(2))}<mo>)</mo>`))}<mo>=</mo>${M.frac(`${M.sub(M.i('g'), M.n(2))}${M.sub(M.i('Δ'), M.n(2))}`, `${M.sub(M.i('g'), M.n(0))}${M.sub(M.i('Δ'), M.n(1))}`)}`, note: 'Setting the β-derivative of the denominator to zero gives one equation for the temperature where P₁ is largest.' },
    { mathml: `${M.sub(M.i('k'), M.i('B'))}${M.sup(M.i('T'), M.o('*'))}<mo>=</mo>${M.frac(`${M.sub(M.i('Δ'), M.n(1))}<mo>+</mo>${M.sub(M.i('Δ'), M.n(2))}`, `<mi>ln</mi><mo>⁡</mo><mo>(</mo>${M.sub(M.i('g'), M.n(2))}${M.sub(M.i('Δ'), M.n(2))}<mo>/</mo>${M.sub(M.i('g'), M.n(0))}${M.sub(M.i('Δ'), M.n(1))}<mo>)</mo>`)}`, note: 'A real maximum exists only if g₂Δ₂ > g₀Δ₁; otherwise P₁ rises all the way to its hot limit g₁/Σg. Checked against a numerical search (Verification).' },
  ], { title: 'When does the middle level overshoot?' });

  // presets + quasi-static heating scan
  const bar = document.createElement('div'); bar.className = 'psim-btns';
  for (const p of PRESETS) {
    const b = document.createElement('button'); b.className = 'psim-btn'; b.type = 'button'; b.textContent = p.label;
    b.onclick = () => { for (const [k, v] of Object.entries(p.values)) setParam(k, v); };
    bar.append(b);
  }
  const heat = document.createElement('button'); heat.className = 'psim-btn'; heat.type = 'button'; heat.textContent = 'Heat it up (scan 1 K → 3000 K)';
  let raf = 0;
  heat.onclick = () => {
    cancelAnimationFrame(raf);
    const t0 = performance.now(), dur = 7000;
    const tick = now => {
      const s = Math.min(1, (now - t0) / dur);
      setT(1 * 3000 ** s);
      if (s < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  bar.append(heat);
  const note = document.createElement('p'); note.className = 'psim-hint';
  note.textContent = 'The scan steps the bath temperature on a log scale; each frame is a separate equilibrium, so the scan speed is not physical time (the system is assumed to relax faster than it is heated).';
  eqs.append(bar, note, ...levelEqs.map(e => e.el), zEq.el, steps);

  let key = '';
  return {
    update(sim) {
      cur.sim = sim;
      levelEqs.forEach(e => e.update()); zEq.update();
      const k = [sim.params.d1, sim.params.d2, ...sim.g].join();
      if (k !== key) {
        key = k;
        for (let i = 0; i < 3; i++) {
          pops.fn(`p${i}`, sim.pop(i), { color: COL[i], label: `P${'₀₁₂'[i]} ${NAME[i]}`, width: 2.2 });
        }
                thermo.setY({ max: Math.max(1, Math.log(sim.gsum) * 1.12) });
        thermo.fn('C', sim.heatCapacity, { color: '--body-2', label: 'C/k_B (Schottky anomaly)', width: 2.2 });
        thermo.fn('S', sim.entropy, { color: '--body-3', label: 'S/k_B', width: 2.2 });
        thermo.hline('lnG', Math.log(sim.gsum), { color: '--body-3', label: `ln Σg = ${Math.log(sim.gsum).toFixed(3)}` });
        thermo.marker('sk', sim.schottky.T, sim.schottky.C, { color: '--body-2', r: 3.5, label: `peak ${fmtT(sim.schottky.T)}` });
      }
      for (let i = 0; i < 3; i++) pops.marker(`m${i}`, sim.params.T, sim.P[i], { color: COL[i], r: 4 });
      pops.cursor(sim.params.T); thermo.cursor(sim.params.T);
      thermo.marker('mc', sim.params.T, sim.C, { color: '--body-2', r: 4 });
      thermo.marker('ms', sim.params.T, sim.S, { color: '--body-3', r: 4 });
      pops.invalidate(); thermo.invalidate(); pops.draw(); thermo.draw();
    },
  };
}

createInstrument({
  title: 'Three-level system heating up',
  subtitle: 'Boltzmann populations of three discrete levels in equilibrium with a heat bath, scanned over temperature',
  tier: 'analytical',
  tierReason: 'Populations, heat capacity and entropy are the exact canonical-ensemble results for three fixed levels (evaluated with a stable log-sum-exp); checked against closed forms, thermodynamic identities, the high/low-T limits and the published two-level Schottky peak (Verification). The level energies are illustrative, not a specific atom or molecule.',
  layout: 'workbench',
  params: PARAMS,
  create: createSim,
  draw, bench, onPointer,
  timeDependent: false,
  hudLine: sim => `T = ${fmtT(sim.params.T)} · k_BT = ${+sim.kT.toPrecision(3)} meV`,
  model: {
    legend: ['colour = level (label only)', 'bars = Pᵢ now · curves = Pᵢ(T)', 'equilibrium at each T, not time'],
    equations: [
      { caption: 'Canonical (Boltzmann) populations, β = 1/k_BT:', mathml: '<math display="block"><msub><mi>P</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>g</mi><mi>i</mi></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>β</mi><msub><mi>E</mi><mi>i</mi></msub></mrow></msup></mrow><mi>Z</mi></mfrac><mo>,</mo><mspace width="0.6em"/><mi>Z</mi><mo>=</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mn>2</mn></munderover><msub><mi>g</mi><mi>i</mi></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>β</mi><msub><mi>E</mi><mi>i</mi></msub></mrow></msup></math>' },
    ],
    assumptions: [
      'A system with exactly three discrete energy levels E₀ = 0, E₁ = Δ₁, E₂ = Δ₁ + Δ₂ and degeneracies g₀, g₁, g₂; any further levels are assumed far above k_BT and are ignored.',
      'The system is weakly coupled to a heat bath at temperature T and has equilibrated: heating is quasi-static. How fast it relaxes (transition rates, spontaneous emission) is not modelled.',
      'Level energies do not change with temperature; no interactions between many such systems (independent systems, e.g. a dilute paramagnet or impurity ensemble).',
      'At any positive temperature the populations per state never invert (Pᵢ/gᵢ always falls with energy); with g all 1 they approach 1/3 each as T → ∞. Population inversion needs a non-equilibrium drive (as in a laser), not heating.',
      'Default gaps (5 meV and 25 meV, i.e. 58 K and 290 K) are illustrative values chosen to show the middle-level overshoot.',
    ],
    conventions: [
      'Stage, left: vertical axis is energy above E₀ (meV, linear, to scale unless flagged); each level is drawn as gᵢ short segments; the orange bar is k_BT on the same axis.',
      'Stage, right: the computed Pᵢ(T) curves on a log temperature axis; dots mark the current T, dashed lines the hot limits gᵢ/Σg, and T* the middle-level maximum when it exists.',
      'Bar length is the level population Pᵢ (probability of finding the system anywhere in that level) on a fixed 0–1 scale; the dashed tick marks its infinite-temperature value gᵢ/Σg.',
      'Level colours (blue, violet, orange) only identify levels; they are not optical colours.',
      'Temperature axes in the figures are logarithmic. The "Heat it up" button is a quasi-static parameter scan, not elapsed time.',
    ],
    references: [
      'C. Kittel and H. Kroemer, Thermal Physics, 2nd ed. (Freeman, 1980), ch. 3: Boltzmann factor, partition function, two-level heat capacity.',
      'MIT OCW 5.62 Physical Chemistry II (2008), lecture 3: canonical partition function with degeneracy.',
      'E. S. R. Gopal, Specific Heats at Low Temperatures (Plenum, 1966): the Schottky anomaly.',
      'E. Tiesinga et al., CODATA 2018, Rev. Mod. Phys. 93, 025010 (2021): exact k_B and e.',
    ],
  },
});

</script>
