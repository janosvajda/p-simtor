<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-view canvas.grab { cursor: grab; }
.psim-view canvas.grabbing { cursor: grabbing; }
.psim-view canvas.move { cursor: move; }

.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px; min-height: 100%; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) {
  .psim-bench { padding: 12px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */

/* ---------- full screen (scene + HUD + legend + playback bar) ---------- */
.psim-fs { background: var(--stage, var(--bg)); border-radius: 0 !important; border: 0 !important; }
.psim-pseudo-fs { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; max-height: none !important; z-index: 1000; margin: 0 !important; }
.psim-fsbtn { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; }
.psim-fsbtn:hover { background: var(--raise); color: var(--ink); }
.psim-fsbtn svg { width: 15px; height: 15px; }



/* The animation view is a dark screen in BOTH page themes: scenes (glows, density maps, space) are
   designed for it, and every page looks the same. Panels, text and figures follow the page theme. */
.psim-view, :root[data-theme="light"] .psim-view {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  color-scheme: dark;
}

/* ---------- the scene: plain intro, clean view, player bar, key ---------- */
/* Everything about the animation lives in one card: what it shows (in plain words), the view with
   nothing written over it, a video-player bar right under it, and the key to its colours below. */
.psim-scene { display: flex; flex-direction: column; min-height: 0; background: var(--stage); }
.psim-stage > .psim-scene { position: absolute; inset: 0; }
.psim-scene.psim-canvaswrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.psim-view { position: relative; flex: 1 1 auto; min-height: 0;
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-canvaswrap > .psim-view { flex: none; height: clamp(320px, 58vh, 660px); }

.psim-intro { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: 14px/1.55 var(--sans); color: var(--ink-2); }

.psim-intro b { display: block; font: 600 11px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.psim-intro p { margin: 0; color: var(--ink); max-width: 80ch; }
.psim-intro ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.psim-intro li::before { content: '→ '; color: var(--accent); }
.psim-intro.collapsed p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.psim-more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: 500 12.5px var(--sans); cursor: pointer; }

.psim-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, var(--stage)); }
.psim-action { padding: 9px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 16%, transparent);

.psim-action:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }

.psim-transport { display: flex; align-items: center; gap: 4px; padding: 6px 10px; flex-wrap: nowrap;

.psim-clock[hidden] { display: none; }
.psim-clock { display: grid; line-height: 1.15; padding: 0 8px; min-width: 0; max-width: 220px; }

.psim-timeline { flex: 1 1 200px; min-width: 120px; padding: 0 10px; font: 10.5px var(--mono); color: var(--muted); position: relative; }
.psim-timeline .ticks { position: relative; height: 17px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .bar::before { content: ''; position: absolute; inset: -8px 0; }   /* a taller hit area */
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }
.psim-timeline .m.measured, .psim-tlrow i.measured { background: var(--good, #4cc38a); }

.psim-timeline .m.requested, .psim-tlrow i.requested { background: var(--warn, #e0a030); }

.psim-tlrow i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.psim-tlrow code { font: 12px var(--mono); color: var(--ink); }
.psim-tlrow small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }

.psim-hud span:empty { display: none; }
.psim-hud .flag { color: var(--warn); }

const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };

  if (x == null || Number.isNaN(x)) return '—';
  if (x === 0) return '0';
  if (!Number.isFinite(x)) return x > 0 ? '∞' : '−∞';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -2 && e < 4) return fix(x, Math.max(0, digits - 1 - e));
  const m = x / Math.pow(10, e);
  return `${m.toFixed(digits - 1)}×10${String(e).split('').map(c => SUP[c]).join('')}`;

function fix(x, d = 3) {
  if (x == null || Number.isNaN(x)) return '—';

/** Classify a relative error against thresholds -> 'good' | 'warn' | 'bad'. */
function grade(x, good, warn) {

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */

in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;

  vec3 q = c + vec3(aCorner * s, 0.0);

precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen

  const hud = { t: $('.psim-clock b'), a: $('.psim-hud .h1'), b: $('.psim-hud .h2'), flag: $('.psim-hud .flag') };
  // the legend beside the view; view.setLegend(items) replaces it when the representation changes
  const setLegend = items => $('.psim-legend').replaceChildren(...(items ?? []).map(t => el('span', {}, t)));
  setLegend(model.legend);

  // ------------------------------------------------------------ state
  const values = Object.fromEntries(params.map(p => [p.key, p.value]));
  let sim, tDisplay = 0, limited = false, defaultSpeedNow = speed0;
  const steadyLabels = new Map();
  const clock = createClock({ speed: speed0 });
  const view = {
    W: 0, H: 0, dpr: 1, color: sceneVar, opts: {}, pointer: null, gl: glLayer?.gl ?? null, glError: glLayer && !glLayer.ok ? glLayer.reason : '',
    /** Current playback speed (simulated time per second) and state, e.g. to disclose time compression. */
    get speed() { return clock.speed; }, get playing() { return clock.playing; },
    /** GL layer resolution as a fraction of the device pixel ratio (adaptive unless glResolution is a number). */
    get glScale() { return glLayer?.scale ?? 1; },
    /** The scene's theme: always 'dark' (the view is a dark screen in both page themes); use it for blending and mesh colours. */
    get theme() { return 'dark'; },
    /** The page theme around the view ('dark' or 'light'), for anything drawn outside it. */
    get pageTheme() { return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; },
    setLegend,
    /** The embedded build-time report (verify()'s return value, including any extra data fields), or null. */
    report,
    /**
     * Shell overlays drawn over the canvas, in canvas CSS pixels: `overlays` lists each visible one
     * ({ name: 'hud' | 'legend' | 'timeline' | 'transport', x, y, w, h }); `insets` gives how far the
     * bottom ones (timeline, playback bar, a phone legend) reach up from the bottom edge and the top
     * ones (HUD, legend) down from the top. Lay the scene out inside them. Cached for 200 ms.
     */
    get overlays() { return overlayInfo().list; },
    /**
     * A steady position for a label attached to something that moves or flickers (a wave's peak,
     * a cloud's centre): returns { x, y } that follows (x, y) smoothly and ignores sub-`deadband`
     * jitter, so the text does not jump from frame to frame. One state per id; reset on rebuild.
     */
    steady(id, x, y, { deadband = 6, ease = 0.15 } = {}) {
      const p = steadyLabels.get(id);
      if (!p || !Number.isFinite(p.x)) { const q = { x, y }; steadyLabels.set(id, q); return q; }
      const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy);
      if (d > 120) { p.x = x; p.y = y; }                       // a jump (new run, reframing): follow at once
      else if (d > deadband) { const k = ease * (1 - deadband / d); p.x += k * dx; p.y += k * dy; }
      return p;
    },
    get insets() { return overlayInfo().insets; },
  };
  let overlayCache = null;
  function overlayInfo() {
    const now = performance.now();
    if (overlayCache && now - overlayCache.at < 200) return overlayCache;
    const c = canvas.getBoundingClientRect(), list = [];
    const add = (name, node) => {
      if (!node || node.hidden || !node.getClientRects().length) return;
      const r = node.getBoundingClientRect();
      const x = Math.max(r.left, c.left), y = Math.max(r.top, c.top), x1 = Math.min(r.right, c.right), y1 = Math.min(r.bottom, c.bottom);
      if (x1 > x && y1 > y && (r.width > 0 && r.height > 0)) list.push({ name, x: x - c.left, y: y - c.top, w: x1 - x, h: y1 - y });
    };
    for (const node of viewEl.children) if (node.tagName !== 'CANVAS') add(node.className.split(' ')[0].replace('psim-', ''), node);
    const insets = { top: 0, bottom: 0 };
    for (const o of list) {
      if (o.y + o.h / 2 < c.height / 2) insets.top = Math.max(insets.top, o.y + o.h);
      else insets.bottom = Math.max(insets.bottom, c.height - o.y);
    }
    overlayCache = { at: now, list, insets };
    return overlayCache;
  }

  let benchApi = null;
  // ------------------------------------------------------------ timeline: the run's span and its key times
  // spec.timeline = { duration, markers: [{ t, label, kind: 'computed' | 'measured' | 'requested' }], note }
  // (each may also be a function of the sim). The run stops exactly at `duration`; markers are drawn
  // on a bar under the time readout; clicking the bar jumps to that time (recomputing if earlier).
  let tl = null;
  const tlEl = $('.psim-timeline');
  const secTimeline = timelineSpec ? section(texts.timeline ?? 'Timeline', { aside: 'key times' }) : null;
  const shortLabel = m => m.short ?? m.label.replace(/\s*\(.*$/, '').slice(0, 28);
  function resolveTimeline() {
    if (!timelineSpec) { tl = null; tlEl.hidden = true; return; }
    const val = v => (typeof v === 'function' ? v(sim, values) : v);
    // the run spans [start, duration] on the page's own clock: start = the sim's initial time (0 usually;
    // e.g. −1 for a log₁₀ clock); duration is the END time on that clock
    const start = Number.isFinite(+val(timelineSpec.start)) ? +val(timelineSpec.start) : (sim.t ?? 0);
    const duration = +val(timelineSpec.duration);
    if (!(duration > start)) throw new Error(`timeline.duration (the end time) must be later than the start ${start}`);
    const span = duration - start, tol = 1e-9 * Math.max(Math.abs(duration), span);
    const markers = (val(timelineSpec.markers) ?? []).filter(m => Number.isFinite(m.t));
    for (const m of markers) if (m.t < start - tol || m.t > duration + tol) throw new Error(`timeline marker "${m.label}" at ${m.t} lies outside the run ${start}…${duration}`);
    tl = { start, duration, markers, note: val(timelineSpec.note) ?? '' };
    // a watchable run in every mode: `seconds` (or a function of sim and params) sets the default
    // speed so that the whole run plays in that many seconds, whatever its length in this mode
    const secs = +val(timelineSpec.seconds);
    // (only when the run's length changed, so a speed the viewer chose survives a restart)
    if (secs > 0 && (duration - start) / secs !== defaultSpeedNow) { clock.speed = (duration - start) / secs; tp?.setSpeed?.(clock.speed); defaultSpeedNow = clock.speed; }
    tlEl.hidden = false;
    const fmt = t => (formatTime ? formatTime(t) : `${+t.toPrecision(4)} ${timeUnit}`);
    // the bar: one tick per key time, short labels above (staggered when close), full text as a tooltip
    const bar = tlEl.querySelector('.bar'), ticks = tlEl.querySelector('.ticks');
    bar.querySelectorAll('.m').forEach(e => e.remove());
    ticks.replaceChildren(...markers.slice().sort((a, b) => a.t - b.t).map(m => {
      const x = 100 * (m.t - start) / span;
      bar.append(el('span', { class: `m ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%`, title: `${m.label}: ${fmt(m.t)}` }));
      const sl = shortLabel(m), withTime = /\d/.test(sl) ? sl : `${sl} · ${fmt(m.t)}`;   // no repeated time
      // near the ends, anchor the label at its tick instead of centring it (never clipped by the bar's edges)
      const anchor = x < 15 ? 'translateX(0)' : x > 85 ? 'translateX(-100%)' : 'translateX(-50%)';
      return el('span', { class: `lab ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%;transform:${anchor}`, title: `${m.label}: ${fmt(m.t)}` }, withTime);
    }));
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.textContent = fmt(start); b.textContent = `${fmt(duration)} (end)`;
    layoutTimelineLabels();
    // the side panel lists every key time in full, with its kind, and the note
    if (secTimeline) {
      const kinds = { computed: 'computed in this model', measured: 'measured (literature)', requested: 'named in the request' };
      secTimeline.body.replaceChildren(
        row('run', `${fmt(start)} – ${fmt(duration)}`),
        ...markers.map(m => el('div', { class: 'psim-tlrow' }, el('i', { class: m.kind ?? 'computed' }), el('span', {}, m.label), el('code', {}, fmt(m.t)), el('small', {}, kinds[m.kind ?? 'computed']))),
        tl.note ? el('p', { class: 'psim-hint' }, tl.note) : null);
    }
  }
  // Labels are placed by their measured widths: each goes in the lowest of three rows where it does
  // not touch another label; one that fits nowhere is hidden (its tick keeps the tooltip, and the
  // side panel lists every key time). Rerun when the bar changes size (phone, full screen).
  const TL_ROWS = 3, TL_ROW_H = 13, TL_GAP = 6;
  function layoutTimelineLabels() {
    if (!tl || tlEl.hidden) return;
    const labs = [...tlEl.querySelectorAll('.ticks .lab')];
    labs.forEach(l => { l.style.bottom = '2px'; l.style.visibility = ''; l.classList.remove('hid'); });
    const box = tlEl.querySelector('.ticks').getBoundingClientRect();
    if (!(box.width > 0)) return;
    const rows = Array.from({ length: TL_ROWS }, () => []);
    let used = labs.length ? 1 : 0;
    for (const l of labs) {
      const r = l.getBoundingClientRect(), lo = Math.max(r.left, box.left), hi = Math.min(r.right, box.right);
      const k = rows.findIndex(slots => slots.every(([a, b]) => hi + TL_GAP <= a || lo >= b + TL_GAP));
      if (k < 0) { l.style.visibility = 'hidden'; l.classList.add('hid'); continue; }
      rows[k].push([lo, hi]); used = Math.max(used, k + 1);
      l.style.bottom = `${2 + k * TL_ROW_H}px`;
    }
    tlEl.querySelector('.ticks').style.height = `${4 + used * TL_ROW_H}px`;
    // the two end labels: drop the start when they would touch
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.style.visibility = '';
    if (a.getBoundingClientRect().right + TL_GAP > b.getBoundingClientRect().left) a.style.visibility = 'hidden';
  }
  new ResizeObserver(() => layoutTimelineLabels()).observe(tlEl);

  tlEl.querySelector('.bar').addEventListener('click', e => {
    if (!tl) return;
    const r = e.currentTarget.getBoundingClientRect(), T = tl.start + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (tl.duration - tl.start);
    if (T < tDisplay) rebuild();
    window.psim.advanceTo(T);
  });

  function rebuild() {
    steadyLabels.clear();
    sim = create({ ...values });
    tDisplay = sim.t ?? 0;
    resolveTimeline();
    diagPlot.clear();
    renderDiag(true);
    benchApi?.update?.(sim, tDisplay, { rebuilt: true });
    status.set('params', values);
  }

  // ------------------------------------------------------------ full screen
  // The scene (canvas, HUD, legend) and the playback bar fill the screen. Falls back to filling the
  // window with CSS where the Fullscreen API is missing or refused (iPhone Safari, sandboxed frames).
  const scene = sceneEl;
  let pseudoFs = false, fsBtn = null;
  const fsElement = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
  const isFullscreen = () => pseudoFs || fsElement() === scene;
  function afterFullscreen() {
    const on = isFullscreen();
    scene.classList.toggle('psim-fs', on);
    tp?.setFullscreen(on);
    if (fsBtn) fsBtn.innerHTML = on ? ICONS.exitFullscreen : ICONS.fullscreen;
    requestAnimationFrame(() => spec.onFit?.(view));
  }
  function setPseudo(on) { pseudoFs = on; scene.classList.toggle('psim-pseudo-fs', on); afterFullscreen(); }
  function toggleFullscreen() {
    if (isFullscreen()) {
      if (pseudoFs) setPseudo(false);
      else (document.exitFullscreen ?? document.webkitExitFullscreen)?.call(document);
      return;
    }
    const request = scene.requestFullscreen ?? scene.webkitRequestFullscreen;
    if (!request) { setPseudo(true); return; }
    try { Promise.resolve(request.call(scene)).catch(() => setPseudo(true)); } catch { setPseudo(true); }
  }
  addEventListener('fullscreenchange', afterFullscreen);
  addEventListener('webkitfullscreenchange', afterFullscreen);

  // ------------------------------------------------------------ transport
  const timeDependent = spec.timeDependent !== false;
  let tp = null;
  if (timeDependent) {
    tp = transport({
      speed: speed0, speedLabel: s => `${sci(s, 2)} ${timeUnit}/s`, range: speedRange,
      onToggle: () => togglePlay(),
      onStep: () => { setPlaying(false); if (!isDone()) { sim.step(); tDisplay = sim.t; } },
      onRestart: () => rebuild(),
      onFit: () => spec.onFit?.(view),
      onFullscreen: () => toggleFullscreen(),
      onSpeed: s => { clock.speed = s; },
    });
    // the player bar sits directly under the view, like a video player: buttons, the clock and
    // the timeline with its key moments, speed, full screen
    const firstSep = tp.querySelector('.sep');
    const clockEl = $('.psim-clock');
    clockEl.hidden = false;
    tp.insertBefore(clockEl, firstSep);
    tp.insertBefore(tlEl, firstSep);
    viewEl.after(tp);
  } else {
    fsBtn = el('button', { class: 'psim-fsbtn', title: 'Full screen (F)', 'aria-label': 'Full screen', html: ICONS.fullscreen, onclick: () => toggleFullscreen() });
    viewEl.append(fsBtn);
  }
  // the page's main actions ("Heat it up", "Fire one electron"): large buttons directly under the
  // view, where the eye already is; settings stay in the side panel
  if ((spec.actions ?? []).length) {
    const api = () => ({ setParams, setParam, getSim: () => sim, values, play: () => setPlaying(true), pause: () => setPlaying(false), restart: () => rebuild() });
    const bar = el('div', { class: 'psim-actions' }, ...spec.actions.map(a => {
      const b = el('button', { type: 'button', class: 'psim-action', title: a.hint ?? '' }, a.label);
      b.addEventListener('click', () => a.onClick?.(api()));
      return b;
    }));
    viewEl.after(bar);
  }
  // at the end of a run: the final state stays on screen with a replay button over it
  const endcard = $('.psim-endcard');
  endcard.querySelector('button').addEventListener('click', () => { rebuild(); setPlaying(true); });
  function showEndcard() {
    const on = timeDependent && !clock.playing && isDone();
    if (endcard.hidden === !on) return;
    endcard.hidden = !on;
    if (on) endcard.querySelector('span').textContent = texts.finishedCard ?? `Finished at ${formatTime ? formatTime(endTime()) : `${fix(endTime(), timeDigits)} ${timeUnit}`}`;
  }
  function setPlaying(p) { clock.playing = p; tp?.setPlaying(p); showEndcard(); }
  // A model that ends (a merger, everything decayed, the last particle left) sets sim.done (or
  // sim.ended): the clock stops there instead of counting time in which nothing is computed,
  // and play starts the run again from the beginning.
  // the end shown on the clock: exactly the declared duration when the steps' float sum lands within round-off of it
  const endTime = () => (tl && Math.abs(sim.t - tl.duration) <= 1e-9 * Math.max(Math.abs(tl.duration), tl.duration - tl.start) ? tl.duration : tl ? Math.min(sim.t, tl.duration) : sim.t);

  // ------------------------------------------------------------ side panel

  }
  const setParam = (k, v) => setParams({ [k]: v });
  if (presets.length) {
    secParams.body.append(el('div', { class: 'psim-presets' },
      el('span', { class: 'psim-hint' }, texts.presets ?? 'Try this'),
      ...presets.map(pr => button(pr.label, () => setParams(pr.values ?? {}, { play: pr.play ?? true })))));
  }
  if (params.length) {
    const note = texts.paramsNote ?? 'Changing a parameter recomputes the model from its initial state.';
    if (note) secParams.body.append(el('p', { class: 'psim-hint' }, note));
    for (const p of params) {
      if (p.options) {
        const sel = select(p.options, p.value, v => { values[p.key] = isNaN(+v) ? v : +v; rebuild(); });
        sel.setValue = v => { sel.value = String(v); };
        paramInputs.set(p.key, sel);
        secParams.body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, p.label)), sel));
      } else {
        const sl = slider({
          label: p.label, min: p.min, max: p.max, value: p.value, log: p.log, unit: p.unit ?? '', digits: p.digits ?? 3,
          integer: p.integer, limits: p.limits,
          onInput: v => { values[p.key] = v; rebuild(); },
        });
        paramInputs.set(p.key, sl);
        secParams.body.append(sl);
      }
      if (p.hint) secParams.body.append(el('p', { class: 'psim-hint', style: 'margin-top:-4px;font-size:11.5px' }, p.hint));
    }
  }
  if (controls) controls(secParams.body, { values, rebuild, setParam, setParams, play: () => setPlaying(true), pause: () => setPlaying(false), getSim: () => sim });

  // presentation-only controls (projection, colour map, slice): never rebuild the model
  const secView = viewControls ? section(texts.view ?? 'View') : null;
  if (secView) secView.body.append(el('p', { class: 'psim-hint' }, texts.viewNote ?? 'These change only how the results are shown, not the calculation.'));

  const secDiag = section(texts.diagnostics ?? 'Diagnostics', { aside: 'live' });
  const diagPlot = logPlot({ caption: '', yMin: 1e-16, yMax: 1 });
  const diagSeries = diagPlot.addSeries('--accent');
  const diagRows = new Map();
  secDiag.body.append(diagPlot.el);
  let nextPlot = 0;
  function renderDiag(reset = false) {
    const d = sim.diagnostics();
    if (reset) {

      nextPlot = 0;
      const firstErr = d.find(x => x.kind === 'error');
      diagPlot.el.style.display = firstErr ? '' : 'none';
      diagPlot.el.querySelector('.cap').textContent = firstErr ? `${firstErr.label}   vs   t` : '';
      if (spec.duration) diagPlot.setXMax(spec.duration);
    }
    for (const x of d) {
      let r = diagRows.get(x.key);
      if (!r) { r = row(x.label); diagRows.set(x.key, r); secDiag.body.append(r); }

      const text = x.pending ? (x.text ?? texts.pending ?? 'measuring…') : x.text ?? (x.kind === 'error' ? sci(x.value) : `${sci(x.value, 4)}${x.unit ? ` ${x.unit}` : ''}`);
      r.set(text, !x.pending && x.kind === 'error' && x.good != null ? grade(x.value, x.good, x.warn ?? x.good * 1000) : '');
    }
    const firstErr = d.find(x => x.kind === 'error' && !x.pending);
    if (firstErr && timeDependent && sim.t >= nextPlot) {
      diagPlot.push(diagSeries, sim.t, Math.max(firstErr.value, 1e-17));
      nextPlot = sim.t + (spec.duration ?? 10) / 800;
    }
    diagPlot.draw();
    return d;
  }

  const secVerify = section('Verification', { aside: report ? 'report embedded' : 'no report' });
  if (report?.checks) {
    secVerify.body.append(el('p', { class: 'psim-hint' }, report.summary ?? `Measured when this page was built (${(report.generated ?? '').slice(0, 10)}):`));
    for (const c of report.checks) {
      secVerify.body.append(el('div', { class: 'psim-check' },
        el('i', { class: c.pass !== true ? 'bad' : c.state === 'warn' ? 'warn' : '' }),
        el('span', {}, c.label), el('code', {}, c.value)));
    }
    if (report.notes) for (const n of report.notes) secVerify.body.append(el('p', { class: 'psim-hint' }, n));
  } else {
    secVerify.body.append(el('p', { class: 'psim-hint' }, 'No build-time verification report is embedded in this page.'));
  }

  const secModel = section('Model, assumptions & limits', { open: false });
  secModel.body.append(
    el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, `${trustLabel}. `), tierReason ?? '')),
    ...(model.equations ?? []).flatMap(eq => [
      eq.caption ? el('p', { class: 'psim-hint' }, eq.caption) : null,
      el('div', { class: 'psim-math', html: eq.mathml }),
    ]),
    model.assumptions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Assumptions and limits')), el('ul', {}, model.assumptions.map(a => el('li', {}, a)))) : null,
    model.conventions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Visual conventions')), el('ul', {}, model.conventions.map(a => el('li', {}, a)))) : null,
    model.references ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'References')), el('ul', {}, model.references.map(a => el('li', {}, el('cite', {}, a))))) : null,
  );
  tierBtn.addEventListener('click', () => { secModel.open = true; secModel.scrollIntoView({ behavior: 'smooth' }); });

  const secExport = section('Export', { open: false });
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  secExport.body.append(el('div', { class: 'psim-btns' },
    button('State JSON', () => download(`${slug}-state.json`, JSON.stringify({
      generator: 'p-simtor', title, tier: tierBtn.dataset.tier, params: values, t: sim.t, state: sim.state(), diagnostics: sim.diagnostics(), verification: report,
    }, null, 2), 'application/json')),
    button('Data CSV', () => {
      const r = sim.record?.();
      if (!r) { toast(stage, 'This model records no tabular data'); return; }
      download(`${slug}-data.csv`, [`# p-simtor | ${title}`, r.header.join(','), ...r.rows.map(x => x.join(','))].join('\n'), 'text/csv');
    }),
    button('PNG image', () => {
      // composite the GPU layer (if any) under the 2D overlay
      const out = document.createElement('canvas');
      out.width = canvas.width; out.height = canvas.height;
      const c = out.getContext('2d');
      if (glLayer?.ok) c.drawImage(glLayer.canvas, 0, 0);
      c.drawImage(canvas, 0, 0);
      out.toBlob(b => el('a', { href: URL.createObjectURL(b), download: `${slug}.png` }).click());
    }),
  ));

  side.append(...[secParams, secView, secTimeline, secDiag, secVerify, secModel, secExport].filter(s => s && (s !== secParams || params.length || controls)));
  if (viewControls) viewControls(secView.body, { el, slider, select, toggle, button, view, getSim: () => sim });
  if (spec.extraSections) spec.extraSections(side, { section, el, row, slider, toggle, button, values, rebuild, view });

  // ------------------------------------------------------------ canvas & loop
  function resize() {
    view.dpr = devicePixelRatio || 1;
    view.W = canvas.clientWidth; view.H = canvas.clientHeight;
    canvas.width = Math.round(view.W * view.dpr); canvas.height = Math.round(view.H * view.dpr);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();
  if (onPointer) onPointer(canvas, view, () => sim);

  // Adaptive GL resolution: when frames take longer than the display refresh while the JavaScript
  // part is small, the GPU is the bottleneck (large or fullscreen windows, ray marching): render the
  // GL layer at a lower pixel ratio, and raise it again when there is headroom. Display only.
  if (glLayer && typeof glResolution === 'number') glLayer.scale = Math.min(1, Math.max(0.25, glResolution));
  const perf = { last: null, interval: null, js: 0, refresh: Infinity, lastAdjust: 0, calm: 0 };
  function adaptResolution(now, jsMs) {
    if (!glLayer?.ok || glResolution !== 'auto') return;
    if (perf.last != null) {
      const dt = now - perf.last;
      if (dt > 0 && dt < 250) {
        perf.refresh = Math.min(perf.refresh * 1.0005, Math.max(dt, 4));
        perf.interval = perf.interval == null ? dt : 0.9 * perf.interval + 0.1 * dt;

    checks.push({ label: 'Agrees with the Gibbs density matrix e^(−H/k_BT)/Z (core/quantum thermalState)', value: maxDiff, pass: maxDiff < 1e-12 });
  }

  // 3. Limits: cold → all in the lowest level; hot → shares g_i/Σg
  {
    const cold = equilibrium(E, [1, 1, 1], 5).P;   // T = gap1/20: P1 = e^(−20)/(1 + e^(−20) + e^(−60))
    const coldErr = Math.abs(cold[1] / (Math.exp(-20) / (1 + Math.exp(-20) + Math.exp(-60))) - 1);
    const hot = equilibrium(E, [1, 2, 3], 3e8).P, hotErr = Math.max(...hot.map((p, i) => Math.abs(p - [1, 2, 3][i] / 6)));
    checks.push({ label: 'Cold side: middle share at T = gap/20 equals e^(−20)/Z', value: coldErr, pass: coldErr < 1e-12 });
    checks.push({ label: 'Hot limit: shares → g_i/Σg (T = 10⁶ × top energy)', value: hotErr, pass: hotErr < 1e-5 });
  }

  // 4. Per state, a higher level is never more likely than a lower one at any positive T (no inversion)
  {
    let worst = -Infinity;
    for (const gg of [[1, 1, 1], [1, 5, 5], [5, 1, 5]]) for (let k = 1; k <= 400; k++) {
      const { P } = equilibrium(E, gg, 1200 * k / 400);
      worst = Math.max(worst, P[1] / gg[1] - P[0] / gg[0], P[2] / gg[2] - P[1] / gg[1]);
    }
    checks.push({ label: 'No population inversion per state (max of P_upper/g − P_lower/g ≤ round-off)', value: worst, pass: worst <= 1e-15 });
  }

  // 5. Thermodynamic consistency: C = dU/dT by central differences (error O(h²))
  {
    let cErr = 0;
    for (const T of [40, 120, 400]) {
      const hT = 1e-3 * T, U = t => equilibrium(E, [1, 1, 1], t).U;
      const dUdT = (U(T + hT) - U(T - hT)) / (2 * hT);
      cErr = Math.max(cErr, Math.abs(dUdT / equilibrium(E, [1, 1, 1], T).C - 1));
    }
    checks.push({ label: 'Heat capacity = dU/dT (central difference, h = 10⁻³ T)', value: cErr, pass: cErr < 1e-5 });
  }

  // 6. Key temperatures (the timeline markers)
  const sim = createSim({ gap1: 100, gap2: 200, g0: 1, g1: 1, g2: 1 });
  const { mid10, top10 } = sim.keys;
  {
    const r1 = Math.abs(equilibrium(sim.E, sim.g, mid10).P[1] - 0.1), r2 = Math.abs(equilibrium(sim.E, sim.g, top10).P[2] - 0.1);
    checks.push({ label: `Marker temperatures solve P = 10 % (middle ${mid10.toFixed(2)} K, top ${top10.toFixed(2)} K)`, value: Math.max(r1, r2), pass: Math.max(r1, r2) < 1e-12 });
    // two-level limit: top level far away; P1 = 0.1 ⇔ e^(−Δ/T) = 1/9 ⇔ T = Δ / ln 9
    const two = keyTemperatures([0, 100, 1e5], [1, 1, 1], 1200).mid10, exact = 100 / Math.log(9);
    const e2 = Math.abs(two / exact - 1);
    checks.push({ label: `Two-level limit: middle reaches 10 % at Δ/ln 9 = ${exact.toFixed(3)} K`, value: e2, pass: e2 < 1e-9 });
    // Schottky peak of a two-level system at T = Δ/x, x·tanh(x/2) = 2 (x = 2.3994)
    const xs = brent(x => x * Math.tanh(x / 2) - 2, 1, 4), peak2 = keyTemperatures([0, 100, 1e6], [1, 1, 1], 400).cPeak;
    const e3 = Math.abs(peak2 / (100 / xs) - 1);
    checks.push({ label: `Two-level heat-capacity peak at Δ/${xs.toFixed(4)} (grid step 0.2 K)`, value: e3, pass: e3 < 0.005 });
  }

  return {
    summary: 'Boltzmann populations of three levels checked against closed-form ratios, the Gibbs density matrix, cold/hot limits, no inversion, C = dU/dT and two-level benchmarks',
    checks,
    notes: [
      'Exact equilibrium (canonical ensemble); no dynamics or heating rate is modelled.',
      'Energies are temperature-independent; only three levels are included.',
    ],
    keyTemperatures: { mid10, top10 },
  };
}

return { PARAMS, LEVEL_NAMES, equilibrium, keyTemperatures, createSim, verify };
})();

// ---- page

// ONE IDEA
//   Learn:   heating spreads the system over its levels; the higher ones fill gradually and,
//            per state, never overtake the lower ones.
//   Picture: an energy ladder with a "chance" bar on each level, beside the chance-vs-temperature curves.
//   Action:  "Heat it up" (restart from absolute zero and warm the surroundings).
const { createInstrument } = __psim["ui/instrument-app.mjs"];
const { PARAMS, createSim, LEVEL_NAMES } = __psim["local:physics.mjs"];
const COLORS = ['--body-1', '--body-0', '--body-2'];   // lowest, middle, top

function niceStep(span, target) {
  const raw = span / target, p = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
  return 10 * p;
}

function draw(ctx, sim, view) {
  const { W, H } = view, C = view.color;
  const T = sim.t;   // the scan point the model has reached (same value as the readout below)
  const eq = sim.eq;
  const narrow = W < 560;
  // regions: the ladder (left or top) and the curves (right or bottom)
  const lad = narrow ? { x: 34, y: 12, w: W - 48, h: H * 0.5 - 18 } : { x: 40, y: 24, w: W * 0.44 - 52, h: H - 48 };
  const plt = narrow ? { x: 52, y: H * 0.5 + 18, w: W - 70, h: H * 0.5 - 52 } : { x: W * 0.44 + 52, y: 30, w: W * 0.56 - 80, h: H - 78 };

  // ---- ladder: level heights to scale of energy (nudged apart if closer than a label)
  const Etop = sim.E[2] || 1, minGap = narrow ? 34 : 46;
  const ys = sim.E.map(e => lad.y + lad.h - 10 - (lad.h - 46) * e / Etop);
  if (ys[0] - ys[1] < minGap) ys[1] = ys[0] - minGap;
  if (ys[1] - ys[2] < minGap) ys[2] = ys[1] - minGap;
  const lineW = narrow ? 44 : 64, barX = lad.x + lineW + 14, barW = lad.x + lad.w - barX;
  ctx.font = `600 ${narrow ? 13 : 15}px system-ui, sans-serif`;
  for (let i = 0; i < 3; i++) {
    const y = ys[i], col = C(COLORS[i]);
    // the level: one line per quantum state (degeneracy)
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    for (let k = 0; k < sim.g[i]; k++) { const yy = y - k * 5; ctx.beginPath(); ctx.moveTo(lad.x, yy); ctx.lineTo(lad.x + lineW, yy); ctx.stroke(); }
    // the chance bar: track = 100 %, fill = population
    const bh = narrow ? 12 : 16;
    ctx.fillStyle = C('--grid-strong'); ctx.fillRect(barX, y - bh / 2, barW, bh);
    ctx.fillStyle = col; ctx.globalAlpha = 0.9; ctx.fillRect(barX, y - bh / 2, barW * eq.P[i], bh); ctx.globalAlpha = 1;
    // label (fixed position, above the bar)
    ctx.fillStyle = C('--ink'); ctx.textAlign = 'left';
    const states = sim.g[i] > 1 ? ` (${sim.g[i]} states)` : '';
    ctx.fillText(`${LEVEL_NAMES[i]} level${states}: ${(100 * eq.P[i]).toFixed(1)} %`, barX, y - bh / 2 - 7);
  }
  // energy axis hint: a thin arrow on the far left
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(lad.x - 10, ys[0] + 6); ctx.lineTo(lad.x - 10, ys[2] - 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lad.x - 14, ys[2] - 8); ctx.lineTo(lad.x - 10, ys[2] - 16); ctx.lineTo(lad.x - 6, ys[2] - 8); ctx.stroke();
  ctx.save(); ctx.translate(lad.x - 18, (ys[0] + ys[2]) / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = C('--muted'); ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('energy', 0, 0); ctx.restore();

  // ---- curves: chance in each level against temperature, traced up to now
  const X = s => plt.x + plt.w * s / sim.Tmax, Y = p => plt.y + plt.h * (1 - p);
  ctx.strokeStyle = C('--grid-strong'); ctx.lineWidth = 1;
  ctx.font = '11px ui-monospace, monospace'; ctx.fillStyle = C('--muted');
  const step = niceStep(sim.Tmax, narrow ? 4 : 6);
  for (let s = 0; s <= sim.Tmax + 1e-9; s += step) {
    ctx.beginPath(); ctx.moveTo(X(s), plt.y); ctx.lineTo(X(s), plt.y + plt.h); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillText(`${+s.toPrecision(4)}`, X(s), plt.y + plt.h + 15);
  }
  for (const p of [0, 0.25, 0.5, 0.75, 1]) {
    ctx.beginPath(); ctx.moveTo(plt.x, Y(p)); ctx.lineTo(plt.x + plt.w, Y(p)); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(`${p * 100}%`, plt.x - 6, Y(p) + 4);
  }
  ctx.textAlign = 'center'; ctx.fillText('temperature of the surroundings (K)', plt.x + plt.w / 2, plt.y + plt.h + (narrow ? 30 : 32));
  ctx.save(); ctx.translate(plt.x - (narrow ? 38 : 42), plt.y + plt.h / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('chance in each level', 0, 0); ctx.restore();
  // computed curves: scan points up to the shown temperature, then the exact value at it
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = C(COLORS[i]); ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    let first = true;
    for (const r of sim.trace) { if (r[0] > T) break; const x = X(r[0]), y = Y(r[1 + i]); first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false; }
    ctx.lineTo(X(T), Y(eq.P[i])); ctx.stroke();
  }
  // "now": a vertical line at the current temperature, with a dot on each curve
  ctx.strokeStyle = C('--ink'); ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(T), plt.y); ctx.lineTo(X(T), plt.y + plt.h); ctx.stroke(); ctx.globalAlpha = 1;
  for (let i = 0; i < 3; i++) { ctx.fillStyle = C(COLORS[i]); ctx.beginPath(); ctx.arc(X(T), Y(eq.P[i]), 5, 0, 2 * Math.PI); ctx.fill(); }
}

function bench({ eqs, figs, createPlot, createEquation, M }) {
  const thermo = createPlot({
    title: 'Heat soaked up and spread: heat capacity and entropy', height: 260,
    x: { label: 'temperature of the surroundings', unit: 'K', min: 0, max: 1200 },
    y: { label: 'C/k_B, S/k_B', min: 0, max: 1.2 },
  });
  const wrap = document.createElement('div');
  const cap = document.createElement('p'); cap.className = 'psim-hint';
  cap.textContent = 'Analytical. Heat capacity peaks where the populations change fastest (the Schottky bump); entropy rises from ln g₀ towards ln(g₀+g₁+g₂).';
  wrap.append(thermo.el, cap); figs.append(wrap);

  const cur = { sim: null };
  const P = i => () => cur.sim ? cur.sim.at(cur.sim.t).P[i] : 0;
  const boltz = createEquation({
    title: 'Boltzmann distribution, for the middle level (live values at the current temperature)',
    lhs: { mathml: M.sub(M.i('P'), M.n(1)), label: 'chance in the middle level', value: P(1), digits: 4 },
    terms: [
      { id: 'g', mathml: M.sub(M.i('g'), M.n(1)), label: 'number of states in the level', color: '--body-0', value: () => cur.sim ? cur.sim.g[1] : 1, digits: 1 },
      { id: 'boltz', sign: '×', mathml: M.sup(M.i('e'), `<mo>−</mo>${M.frac(M.sub(M.i('E'), M.n(1)), `${M.i('k')}${M.i('T')}`)}`), label: 'Boltzmann factor: cost of the step at this temperature', color: '--body-0', digits: 4,
        value: () => { const s = cur.sim; if (!s) return 0; return s.t > 0 ? Math.exp(-s.E[1] / s.t) : 0; } },
      { id: 'z', sign: '÷', mathml: M.i('Z'), label: 'sum of g·e^(−E/kT) over all three levels', color: '--muted', digits: 4,
        value: () => { const s = cur.sim; if (!s) return 1; if (!(s.t > 0)) return s.g[0]; return s.E.reduce((a, e, i) => a + s.g[i] * Math.exp(-e / s.t), 0); } },
    ],
    where: [
      { mathml: `${M.sub(M.i('E'), M.n(1))}<mo>/</mo>${M.i('k')}`, meaning: 'middle level energy, as a temperature', value: () => cur.sim ? cur.sim.E[1] : 0, unit: 'K' },
      { mathml: M.i('T'), meaning: 'temperature of the surroundings', value: () => cur.sim ? cur.sim.t : 0, unit: 'K' },
    ],
    note: 'At T = 0 the Boltzmann factor is 0 for every raised level and Z = g₀: everything is in the lowest level.',
  });
  eqs.append(boltz.el);

  let lastKey = '';
  return {
    update(sim) {
      cur.sim = sim; boltz.update();
      const key = JSON.stringify(sim.params);
      if (key !== lastKey) {
        lastKey = key;
        thermo.setX({ min: 0, max: sim.Tmax });
        const n = 300, Cs = [], Ss = [];
        for (let k = 0; k <= n; k++) { const T = sim.Tmax * k / n, e = sim.at(T); Cs.push([T, e.C]); Ss.push([T, e.S]); }
        const ymax = Math.max(1.2, ...Ss.map(r => r[1]), ...Cs.map(r => r[1])) * 1.05;
        thermo.setY({ min: 0, max: ymax });
        thermo.data('C', Cs, { color: '--body-3', label: 'heat capacity C/k_B' });
        thermo.data('S', Ss, { color: '--body-4', label: 'entropy S/k_B' });
      }
      thermo.cursor(sim.t);
      thermo.draw();
    },
  };
}

const ALL = { gap1: 100, gap2: 200, g0: 1, g1: 1, g2: 1 };

createInstrument({
  title: 'Three energy levels warming up',
  subtitle: 'Boltzmann populations of a three-level quantum system in equilibrium, scanned in temperature (canonical ensemble, exact)',
  tier: 'analytical',
  tierReason: 'Exact Boltzmann distribution of the stated three-level model; checked against closed-form ratios, the Gibbs density matrix, limits and two-level benchmarks (Verification). A model, not a specific atom.',
  layout: 'workbench',
  intro: {
    text: 'A tiny quantum object, such as an atom or a molecule, can hold only certain amounts of energy: here three. Its warm surroundings keep knocking it up and down between them. When it is cold it almost always sits in the lowest level; as the surroundings heat up, the higher levels fill gradually, until all three are shared nearly equally (a level with more room, more states, ends up with a bigger share).',
    watch: ['the middle level starts filling well before the top one', 'with one state each, the top level never gets ahead of the lower ones', 'try "Top level has 3 states": now it wins in total, but each of its states still holds less'],
  },
  actions: [{ label: 'Heat it up', hint: 'start again from absolute zero and warm the surroundings', onClick: ({ restart, play }) => { restart(); play(); } }],
  params: PARAMS,
  create: createSim,
  draw, bench,
  timeUnit: 'K', timeLabel: 'temperature of the surroundings', timeDigits: 1,
  timeline: {
    duration: sim => sim.Tmax,
    start: 0,
    markers: sim => [
      sim.keys.mid10 != null && { t: sim.keys.mid10, label: `middle level reaches 10 % (computed, ${sim.keys.mid10.toFixed(0)} K)`, short: 'middle 10%', kind: 'computed' },
      sim.keys.top10 != null && { t: sim.keys.top10, label: `top level reaches 10 % (computed, ${sim.keys.top10.toFixed(0)} K)`, short: 'top 10%', kind: 'computed' },
    ].filter(Boolean),
    seconds: 60,
    note: 'A temperature scan, not a heating time: each moment is a fully settled state. The scan ends at 4 × the top level’s energy, where the shares are close to their hot limit.',
  },
  hudError: false,
  hudLine: sim => { const P = sim.P; return `lowest ${(100 * P[0]).toFixed(1)} % · middle ${(100 * P[1]).toFixed(1)} % · top ${(100 * P[2]).toFixed(1)} %`; },
  presets: [
    { label: 'Evenly spaced levels', values: { ...ALL, gap1: 150, gap2: 150 }, play: true },
    { label: 'Top level has 3 states', values: { ...ALL, g2: 3 }, play: true },
    { label: 'Big first step', values: { ...ALL, gap1: 300, gap2: 30 }, play: true },
  ],
  texts: { parameters: 'The levels', paramsNote: 'Energies are written as temperatures (E/k_B): 100 K is about 8.6 meV.' },
  model: {
    legend: [
      'bar on each level: chance of finding the system there (computed)',
      'level heights: energy, to scale; extra lines = extra states',
      'curves: the same chances against temperature; thin line = now',
      'the clock is the temperature of the surroundings, not time',
    ],
    equations: [{ caption: 'Boltzmann distribution over the three levels', mathml: '<math><msub><mi>P</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>g</mi><mi>i</mi></msub><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>E</mi><mi>i</mi></msub><mo>/</mo><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow></msup></mrow><mi>Z</mi></mfrac><mo>,</mo><mspace width="0.6em"/><mi>Z</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>g</mi><mi>i</mi></msub><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>E</mi><mi>i</mi></msub><mo>/</mo><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow></msup></math>' }],
    assumptions: [
      'Three levels only, with fixed energies E₀ = 0, E₁, E₂ and integer numbers of states g₀, g₁, g₂ (a generic model, not a particular atom).',
      'The system is weakly coupled to large surroundings at temperature T and has fully settled at every temperature (canonical ensemble).',
      'No heating rate or relaxation time is modelled: the progress axis is a scan through equilibrium states.',
      'The chances describe one system observed many times, or the fractions of a large collection of identical, independent systems.',
    ],
    conventions: [
      'Energies are given as temperatures E/k_B in kelvin (1 K ≙ 86.17 µeV ≙ 0.695 cm⁻¹).',
      'Level heights are to scale of energy, nudged apart only when two levels are closer than a label’s height.',
      'Curves are drawn through the computed scan points (2400 per run).',
      'T = 0 K is the ground-state limit (everything in the lowest level).',
    ],
    references: [
      'C. Kittel & H. Kroemer, Thermal Physics, 2nd ed. (Freeman, 1980), ch. 3: Boltzmann factor and partition function.',
      'S. J. Blundell & K. M. Blundell, Concepts in Thermal Physics, 2nd ed. (OUP, 2010): two-level systems and the Schottky anomaly.',
    ],
  },
});
