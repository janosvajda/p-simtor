/** Exact Boltzmann averages for a 4×4 periodic lattice by enumerating all 2¹⁶ states. */
function exact4x4(T) {
  const L = 4, N = 16, sp = new Int8Array(N);
  let Z = 0, Es = 0, Ms = 0;
  const w = new Map();
  for (let c = 0; c < 1 << N; c++) {
    for (let i = 0; i < N; i++) sp[i] = (c >> i) & 1 ? 1 : -1;
    let H = 0, M = 0;
    for (let y = 0; y < L; y++) for (let x = 0; x < L; x++) {
      const v = sp[y * L + x];
      M += v;
      H -= v * (sp[y * L + (x + 1) % L] + sp[((y + 1) % L) * L + x]);
    }
    const key = H;
    if (!w.has(key)) w.set(key, Math.exp(-H / T));
    const b = w.get(key);
    Z += b; Es += b * H; Ms += b * Math.abs(M);
  }
  return { e: Es / Z / N, absm: Ms / Z / N };
}

function measure(p, warm, n) {
  const sim = createSim({ ...p, protocol: 'hold' });

  for (let i = 0; i < n; i++) { sim.step(); am.push(Math.abs(sim.m)); es.push(sim.e); }
  return { m: meanWithError(am), e: meanWithError(es) };
}

  }

    checks.push({
      label: `4×4 Metropolis vs exact enumeration (2¹⁶ states), kT/J = ${T}`,
      value: `e ${mc.e.mean.toFixed(4)}±${mc.e.error.toFixed(4)} (exact ${ex.e.toFixed(4)}, ${zE.toFixed(1)}σ); |m| ${mc.m.mean.toFixed(4)}±${mc.m.error.toFixed(4)} (exact ${ex.absm.toFixed(4)}, ${zM.toFixed(1)}σ)`,
      pass: zE < 4 && zM < 4,
    });
  }

  // 4. Bulk benchmark: L = 64 against Onsager's thermodynamic-limit results.
  {
    const T = 2.0, r = measure({ ...base, L: 64, T0: T, seed: 3 }, 1000, 8000);
    const m0 = onsagerM(T), u0 = onsagerU(T);
    const zM = Math.abs(r.m.mean - m0) / r.m.error, zE = Math.abs(r.e.mean - u0) / r.e.error;

      label: 'L = 64 below T_c (kT/J = 2.0) vs Onsager–Yang m₀ and u',
      value: `|m| ${r.m.mean.toFixed(4)}±${r.m.error.toFixed(4)} vs ${m0.toFixed(4)} (${zM.toFixed(1)}σ); e ${r.e.mean.toFixed(4)}±${r.e.error.toFixed(4)} vs ${u0.toFixed(4)} (${zE.toFixed(1)}σ)`,
      pass: zM < 4 && zE < 4,
    });
  }
  {
    const T = 3.0, r = measure({ ...base, L: 64, T0: T, seed: 5 }, 1000, 8000);
    const u0 = onsagerU(T);
    const zE = Math.abs(r.e.mean - u0) / r.e.error;
    checks.push({
      label: 'L = 64 above T_c (kT/J = 3.0): magnetism gone, energy vs Onsager',
      value: `|m| = ${r.m.mean.toFixed(4)} < 4/L = ${(4 / 64).toFixed(4)} (Onsager 0; finite size ~1/L), e ${r.e.mean.toFixed(4)}±${r.e.error.toFixed(4)} vs ${u0.toFixed(4)} (${zE.toFixed(1)}σ)`,
      pass: zE < 4 && r.m.mean < 4 / 64,

  }

    for (let i = 0; i < 150; i++) { a.step(); b.step(); }
    let diff = 0; for (let i = 0; i < a.N; i++) diff += a.spins[i] !== b.spins[i];
    checks.push({ label: 'Determinism: same seed, 150 sweeps', value: `${diff} differing spins`, pass: diff === 0 });
  }

  // 6. Bookkeeping: incrementally updated M and E equal a full recount.
  {
    const a = createSim({ ...base, L: 48, protocol: 'heat', ramp: 300, T0: 1.5, T1: 3.5 });
    for (let i = 0; i < 300; i++) a.step();
    let M = 0, H = 0; const L = a.L, sp = a.spins;

    const ok = Math.abs(M / a.N - a.m) < 1e-12 && Math.abs(H / a.N - a.e) < 1e-12;
    checks.push({ label: 'Running m, e equal a full recount after 300 sweeps', value: `Δm = ${Math.abs(M / a.N - a.m).toExponential(0)}, Δe = ${Math.abs(H / a.N - a.e).toExponential(0)}`, pass: ok });
  }

  notes.push('Monte Carlo sweeps are a sampling coordinate, not seconds; the ramp shows quasi-static heating, and lag behind the exact curve near T_c is critical slowing down plus finite size.');
  notes.push('Ising spins are a minimal model (uniaxial, two states, 2D). Real magnets are 3D, have domains, anisotropy and demagnetising fields; their m(T) shape and exponent differ (2D Ising β = 1/8; 3D magnets β ≈ 0.33–0.37).');
  return {
    summary: 'Metropolis sampler checked against exact 4×4 enumeration and Onsager’s exact 2D results; Onsager formulas checked against independent quadrature.',
    checks, notes,
  };
}
