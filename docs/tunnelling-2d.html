function analytic(p, grid = GRID) {
  const th = p.theta * Math.PI / 180, k0 = Math.sqrt(p.E / H2M);
  const kx = k0 * Math.cos(th), ky = k0 * Math.sin(th), sk = 1 / (2 * p.sigma);
  const vx = HBAR * kx / MASS, vy = HBAR * ky / MASS, sv = HBAR * sk / MASS;   // nm/fs
  const Lx = grid.nx * grid.dx, xb = 6 * p.a / FWHM_PER_W, x0 = -(xb + 4.5 * p.sigma + 2);
  const sig = t => Math.hypot(p.sigma, sv * t);                // free width σ(t)
  const solve = f => { let lo = 0, hi = 1; while (f(hi) < 0) hi *= 2; for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; } return hi; };
  const tSep = solve(t => x0 + vx * t - 4 * sig(t) - xb);        // free trailing edge past barrier tail
  const tWrap = solve(t => x0 + vx * t + 4 * sig(t) - Lx / 2);   // free leading edge at box edge
  const y0 = -vy * tSep / 2;
  return { k0, kx, ky, sk, vx, vy, sv, x0, y0, xb, sig, tSep, tWrap, Tbar: packetT(kx, sk, p.V0, p.a), Ex: H2M * kx * kx };
}

function initialState(p, an, grid) {
  const { nx, ny, dx } = grid, Lx = nx * dx, Ly = ny * dx, n = nx * ny;
  const re = new Float64Array(n), im = new Float64Array(n), V = new Float64Array(n);
  const s2 = 4 * p.sigma * p.sigma;
  for (let j = 0; j < ny; j++) {
    let y = -Ly / 2 + j * dx - an.y0;
    y -= Ly * Math.round(y / Ly);                               // nearest periodic image
    for (let i = 0; i < nx; i++) {
      const x = -Lx / 2 + i * dx, k = i + nx * j;
      const amp = Math.exp(-((x - an.x0) ** 2 + (ny > 2 ? y * y : 0)) / s2);
      const ph = an.kx * x + an.ky * (ny > 2 ? y : 0);
      re[k] = amp * Math.cos(ph); im[k] = amp * Math.sin(ph);
      V[k] = barrierV(x, p.V0, p.a);
    }
  }
  let norm = 0;
  for (let k = 0; k < n; k++) norm += re[k] * re[k] + im[k] * im[k];
  const c = 1 / Math.sqrt(norm * dx * dx);
  for (let k = 0; k < n; k++) { re[k] *= c; im[k] *= c; }
  return { re, im, V };
}

// ------------------------------------------------------------------ simulation

          text: an.tSep < an.tWrap ? `${an.tSep.toFixed(0)}–${an.tWrap.toFixed(0)} fs` : 'none: packet too slow/broad for this box' },

    state() { return { t: solver.t, ...cur, Tbar: an.Tbar, measured, tSep: an.tSep, tWrap: an.tWrap }; },
    record() { return { header: ['t_fs', 'P_T', 'P_R'], rows: hist.map(r => r.map(v => +v.toPrecision(10))) }; },
  };

}

/** Run to the measurement time and return P_T there (verification helper). */
function measureT(p, grid = GRID) {

}

// ------------------------------------------------------------------ verification
/** Independent T(E): integrate ψ'' = (2m/ħ²)(V − E)ψ through the barrier with RK4 from a pure

    ['Over-barrier reflection (E₀ = 250, V₀ = 150 meV, a = 1 nm)', { E: 250, V0: 150, a: 1, theta: 0, sigma: 6 }],
    ['Thick barrier (E₀ = 120, V₀ = 160 meV, a = 4 nm)', { E: 120, V0: 160, a: 4, theta: 0, sigma: 8 }],
    ['Narrowest, fastest (E₀ = 300, V₀ = 400 meV, a = 1 nm, σ₀ = 5 nm)', { E: 300, V0: 400, a: 1, theta: 0, sigma: 5 }],

    const q = { ...D, theta: 0 };
    const ts = [GRID.dt * 2, GRID.dt, GRID.dt / 2, GRID.dt / 4].map(dt => measureT(q, strip(GRID.nx, GRID.dx, dt)).T);

    notes.push(`Time-step errors at the production dt = ${GRID.dt} fs: ${e2.toExponential(1)} in T; dt/2 vs dt/4: ${e3.toExponential(1)}.`);

  notes.push('A sharp-edged rectangular barrier was tried first: on this spectral grid it converged only to first order in dx (6–26 % off at dx = 0.5 nm), so the smooth sech² barrier with an exact T(E) is used instead.');
  notes.push('Model scope: one free electron in vacuum-like conditions (free-electron mass), static ideal rectangular barrier; no spin, image-charge, many-body or phonon effects.');

  ctx.fillStyle = C('--muted'); ctx.fillText(narrow ? `E₀ ${sim.params.E.toFixed(0)} meV` : `E₀ = ${sim.params.E.toFixed(0)} meV (total)`, left + 4, Y(sim.params.E) - 4);
  ctx.textAlign = 'right'; ctx.fillStyle = C('--body-1');
  ctx.fillText(narrow ? `E_x ${sim.an.Ex.toFixed(1)} meV` : `E_x = E₀cos²θ = ${sim.an.Ex.toFixed(1)} meV (normal)`, left + mapW - 4, Y(sim.an.Ex) + 13);
  ctx.textAlign = 'left'; ctx.fillStyle = C('--body-0'); ctx.fillText(`V₀ = ${sim.params.V0.toFixed(0)} meV`, crest + 8, Math.max(p0 - 8, Y(sim.params.V0)) + 4);
  ctx.textAlign = 'center'; ctx.fillStyle = C('--muted');
  for (let x = -Math.floor(xr / 32) * 32; x <= xr; x += 32) ctx.fillText(`${x}`, X(x), p1 + 14);
  ctx.fillText(narrow ? 'x (nm), central 128 nm of the 256 nm box' : 'x (nm) · upper map: plane (x, y), y spans 64 nm, periodic', left + mapW / 2, p1 + 30);
  ctx.textAlign = 'start';
}

// ------------------------------------------------------------------ workbench
function bench({ eqs, figs, createPlot, createEquation, M }) {
  const prob = createPlot({ title: 'Probability each side of the barrier crest', height: 260,
    x: { label: 'time t', unit: 'fs', min: 0, max: 600 }, y: { label: 'probability', min: 0, max: 1 } });
  const spec = createPlot({ title: 'Exact transmission vs normal energy', height: 260,
    x: { label: 'normal energy E_x', unit: 'meV', min: 0, max: 450 }, y: { label: 'T(E_x)', log: true, min: 1e-6, max: 1.5 } });
  figs.append(prob.el, spec.el);

  let S = null;
  const kx = M.sub(M.i('k'), M.i('x')), hb = M.i('ħ');
  const tdse = createEquation({
    title: 'Time-dependent Schrödinger equation, term by term (expectation values now)',
    lhs: { mathml: `${M.i('i')}${hb}<mfrac><mrow><mo>∂</mo><mi>ψ</mi></mrow><mrow><mo>∂</mo><mi>t</mi></mrow></mfrac>`, label: '⟨H⟩ total energy', unit: 'meV', value: () => S?.energy().H },
    terms: [
      { id: 'kin', mathml: `<mo>−</mo>${M.frac(M.sup(hb, M.n(2)), `<mn>2</mn>${M.sub(M.i('m'), M.i('e'))}`)}<msup><mo>∇</mo><mn>2</mn></msup><mi>ψ</mi>`, label: 'kinetic ⟨K⟩: spreading and motion', color: '--body-1', unit: 'meV', value: () => S?.energy().K },
      { id: 'pot', mathml: `${M.i('V')}${M.paren(M.i('x'))}<mi>ψ</mi>`, label: 'barrier ⟨V⟩: rises only during the collision', color: '--body-0', unit: 'meV', value: () => S?.energy().U },
    ],
    where: [
      { mathml: `${M.i('V')}${M.paren(M.i('x'))}`, meaning: 'V₀ sech²(x/w), uniform along y; w = a/1.763', value: () => S && S.params.a / FWHM_PER_W, unit: 'nm (w)' },
      { mathml: `${M.sup(hb, M.n(2))}<mo>/</mo><mn>2</mn>${M.sub(M.i('m'), M.i('e'))}`, meaning: 'free-electron value (CODATA 2018)', value: () => H2M, unit: 'meV nm²' },
    ],
  });
  const trans = createEquation({
    title: 'Transmitted fraction: exact prediction vs the simulation',
    lhs: { mathml: '<mover><mi>T</mi><mo>¯</mo></mover>', label: 'exact, averaged over the packet’s momenta', value: () => S?.an.Tbar, digits: 5 },
    terms: [{ id: 'T', mathml: `<mo>∫</mo>${M.sup(M.row(`<mo>|</mo><mi>φ</mi>${M.paren(kx)}<mo>|</mo>`), M.n(2))}<mi>T</mi>${M.paren(M.frac(`${M.sup(hb, M.n(2))}${M.sup(kx, M.n(2))}`, `<mn>2</mn>${M.i('m')}`))}<mi>d</mi>${kx}`, label: 'only k_x (normal momentum) enters', color: '--body-1', value: () => S?.an.Tbar, digits: 5 }],
    where: [
      { mathml: `<mi>T</mi>${M.paren(M.sub(M.i('E'), M.i('x')))}`, meaning: 'sech² barrier, closed form (Landau–Lifshitz §25)', value: () => S && barrierT(S.an.Ex, S.params.V0, S.params.a), digits: 4 },
      { mathml: M.sub(M.i('P'), M.i('T')), meaning: 'simulated probability at x > 0 at t_sep', value: () => S?.measured ? S.measured.PT : 'waiting', digits: 5 },
      { mathml: M.sub(M.i('t'), M.i('sep')), meaning: 'packet clear of the barrier', value: () => S?.an.tSep, unit: 'fs' },
    ],
    link: spec,
  });
  eqs.append(tdse.el, trans.el);

  let n = 0;
  return {
    update(sim, t, { rebuilt }) {
      S = sim;
      if (rebuilt) {
        const an = sim.an, tMax = Math.ceil(Math.min(an.tWrap, an.tSep * 1.5) / 50) * 50;
        prob.setX({ min: 0, max: tMax });
        prob.hline('Tbar', an.Tbar, { color: '--body-1', dash: true, label: `exact T̄ = ${an.Tbar.toFixed(4)}` });
        prob.hline('Rbar', 1 - an.Tbar, { color: '--body-2', dash: true, label: `1 − T̄ = ${(1 - an.Tbar).toFixed(4)}` });
        prob.vline('tsep', an.tSep, { color: '--muted', label: 'T measured here' });
        prob.remove('PT').remove('PR');
        const V0 = sim.params.V0, a = sim.params.a, xm = Math.max(450, V0 * 1.6, sim.params.E * 1.3);
        const E = k => H2M * k * k, lo = Math.max(0, an.kx - 2 * an.sk);
        spec.setX({ min: 0, max: xm });
        spec.band('pk', E(lo), E(an.kx + 2 * an.sk), { color: '--grid-strong', alpha: 0.6, label: 'packet ±2σ' });
        spec.fn('T', e => Math.max(1e-7, barrierT(Math.max(e, 1e-6), V0, a)), { color: '--body-1', label: `T(E_x), V₀ = ${V0.toFixed(0)} meV, a = ${a.toFixed(2)} nm` });
        spec.vline('V0', V0, { color: '--body-0', label: 'V₀' });
        spec.hline('Tbar', Math.max(1e-6, an.Tbar), { color: '--muted', dash: true, label: 'T̄ (packet average)' });
        spec.remove('meas');
        n = 0;
      }
      const h = sim.hist;
      if (h.length !== n) {
        n = h.length;
        const stride = Math.max(1, Math.floor(n / 400)), pt = [], pr = [];
        for (let i = 0; i < n; i += stride) { pt.push([h[i][0], h[i][1]]); pr.push([h[i][0], h[i][2]]); }
        if (n) { pt.push([h[n - 1][0], h[n - 1][1]]); pr.push([h[n - 1][0], h[n - 1][2]]); }
        prob.data('PT', pt, { color: '--body-1', label: 'P_T (x > 0)', width: 2 });
        prob.data('PR', pr, { color: '--body-2', label: 'P_R (x < 0)', width: 2 });
        if (sim.measured) spec.marker('meas', sim.an.Ex, Math.max(1e-6, sim.measured.PT), { color: '--body-1', label: `simulated ${sim.measured.PT.toPrecision(4)}` });
      }
      tdse.update(); trans.update();
      prob.invalidate(); spec.invalidate(); prob.draw(); spec.draw();
    },
  };
}

createInstrument({
  title: 'Quantum tunnelling in 2D',
  subtitle: 'An electron wave packet meets a smooth barrier: 2D Schrödinger equation, split-operator FFT, with exact transmission',
  tier: 'validated',
  tierReason: 'The 2D time-dependent Schrödinger equation is solved with a unitary split-operator FFT method. The transmitted probability matches the exact sech²-barrier transmission averaged over the packet’s momenta to 0.1–0.3 % in five regimes; norm, free-packet motion and dt/dx refinement are checked (Verification). Scope: one electron, static ideal barrier.',
  layout: 'workbench',
  params: PARAMS, create: createSim, draw, bench,
  timeUnit: 'fs', timeLabel: 'time since release', speed: 40, duration: 600,
  controls(body) {
    body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, 'Colour scale (display only)')),
      select([
        { value: 'sqrt', label: '|ψ|², square-root scale' },
        { value: 'log', label: '|ψ|², log scale (5 decades)' },
        { value: 'phase', label: 'phase of ψ as hue, brightness √|ψ|²' },
      ], display.mode, v => { display.mode = v; })));
  },
  hudLine: sim => sim.measured
    ? `T = ${sim.measured.PT.toPrecision(4)} simulated · ${sim.an.Tbar.toPrecision(4)} exact`
    : sim.t > sim.an.tWrap ? 'past wrap-around: periodic images' : `exact T̄ = ${sim.an.Tbar.toPrecision(4)} · measuring at ${sim.an.tSep.toFixed(0)} fs`,
  model: {
    legend: ['brightness: probability density |ψ|² vs initial peak (scale: see Parameters)', 'orange: barrier V(x); dashed line: crest x = 0'],
    equations: [{ caption: 'Model', mathml: '<math display="block"><mi>i</mi><mi>ħ</mi><mfrac><mrow><mo>∂</mo><mi>ψ</mi></mrow><mrow><mo>∂</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><msup><mi>ħ</mi><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub></mrow></mfrac><msup><mo>∇</mo><mn>2</mn></msup><mi>ψ</mi><mo>+</mo><msub><mi>V</mi><mn>0</mn></msub><msup><mi>sech</mi><mn>2</mn></msup><mo>(</mo><mi>x</mi><mo>/</mo><mi>w</mi><mo>)</mo><mi>ψ</mi></math>' }],
    assumptions: [
      'One electron with the free-electron mass in a plane; a static, ideal barrier V₀ sech²(x/w) that is uniform along y (a ridge). No spin, image charges, many-body screening, phonons or decoherence.',
      'The barrier is smooth (sech², full width at half height a = 1.763 w), not rectangular: a sharp-edged rectangle on this spectral grid converged only to first order (6–26 % errors in T), while sech² has an exact transmission formula and converges spectrally.',
      'Initial state: isotropic Gaussian packet, width σ₀, central wavevector k₀ at angle θ to the barrier normal; it starts clear of the barrier.',
      `Grid: ${GRID.nx} × ${GRID.ny} cells, ${GRID.dx} nm spacing (256 nm × 64 nm), periodic; time step ${GRID.dt} fs, Strang splitting (second order). No absorbing layer: the transmitted fraction is read at t_sep, before the packet front can wrap around in x.`,
      'Because V depends only on x the problem separates: the x-probabilities are those of a 1D packet with k_x = k₀cosθ, which is why the exact benchmark is a 1D integral. Wrapping across the y edges does not change them.',
      'T is a probability for each electron (the fraction of many identical runs that end up on the far side), not a fraction of a split particle.',
    ],
    conventions: [
      'Map: physical plane (x right, y up). Brightness = |ψ|² divided by the initial peak density, then square-root (default) or log scale; colour scale is a display choice and does not affect the computation.',
      'Phase view: hue = arg ψ (domain colouring); the stripes are wavefronts, spaced by the de Broglie wavelength 2π/k₀.',
      'Profile strip: V(x) to scale in meV, with E₀ (total kinetic energy) and E_x = E₀cos²θ (energy of motion normal to the barrier).',
      'On phones the map shows the central 128 nm of the 256 nm box. Playback is compressed: 40 fs of physical time per second by default.',
    ],
    references: [
      'L. D. Landau & E. M. Lifshitz, Quantum Mechanics (3rd ed.), §25 Problem 4: transmission through U₀/cosh²(αx).',
      'C. Eckart, Phys. Rev. 35, 1303 (1930).',
      'M. D. Feit, J. A. Fleck & A. Steiger, J. Comput. Phys. 47, 412 (1982): split-operator FFT method.',
      'E. Tiesinga et al., CODATA 2018, Rev. Mod. Phys. 93, 025010 (2021): ħ, mₑ, e.',
    ],
  },
});
