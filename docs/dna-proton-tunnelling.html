:root {

  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {

  --panel: #fbfaf7;

  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;

  --grid: rgba(30, 40, 70, 0.055);

  --glow: 0;
  --body-0: #d4731c;

* { box-sizing: border-box; }

.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }

// ---------------------------------------------------------------- 2D fields

// ---------------------------------------------------------------- 3D volumes

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */

  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;

  vec3 q = c + vec3(aCorner * s, 0.0);

  gl_Position = uProj * vec4(q, 1.0);

precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen

in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;

// ---------------------------------------------------------------- random numbers

/** Seeded PRNG (mulberry32), uniform in [0, 1). Deterministic for a given seed. */
function rng(seed = 1) {
  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let spare = null;
  next.normal = () => {               // standard normal (Box–Muller, cached pair)
    if (spare != null) { const s = spare; spare = null; return s; }
    let u = 0; while (u === 0) u = next();
    const v = next(), r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
  return next;
}

/**
 * An independent seeded stream for item i (atom, particle, event): rngFor(seed, i) always gives
 * the same numbers for that item, whatever else was drawn, so one item can be re-traced alone.
 * The seed and index are mixed by a 32-bit hash (splitmix-style finaliser) before mulberry32.
 */
function rngFor(seed, i) {
  let h = (Math.imul((seed >>> 0) ^ 0x9E3779B9, 0x85EBCA6B) + Math.imul(i >>> 0, 0xC2B2AE35)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B) >>> 0;
  return rng((h ^ (h >>> 16)) >>> 0);

  if (!t) {
    const cos = new Float64Array(n >> 1), sin = new Float64Array(n >> 1), rev = new Uint32Array(n);
    for (let k = 0; k < n >> 1; k++) { cos[k] = Math.cos(2 * Math.PI * k / n); sin[k] = Math.sin(2 * Math.PI * k / n); }
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit; rev[i] = j;
    }
    t = { cos, sin, rev };
    if (fftTables.size > 32) fftTables.clear();
    fftTables.set(n, t);
  }
  return t;
}

/** In-place radix-2 complex FFT. re/im: Float64Array, length a power of two.
 *  Forward: X_k = Σ x_n e^{−2πikn/N}. Inverse (inverse = true) includes the 1/N factor. */
function fft(re, im, inverse = false) {
  const n = re.length;
  if (n & (n - 1)) throw new Error('fft: length must be a power of two');
  if (n < 2) return;
  const { cos, sin, rev } = fftTable(n);
  for (let i = 1; i < n; i++) {
    const j = rev[i];
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  const sign = inverse ? 1 : -1;
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1, step = n / len;
    for (let i = 0; i < n; i += len) {
      for (let k = 0; k < half; k++) {
        const cr = cos[k * step], ci = sign * sin[k * step];
        const a = i + k, b = a + half;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi;
        re[a] += xr; im[a] += xi;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

/** Angular wavenumbers k for an FFT grid of n points with spacing dx (FFT ordering). */
function fftFreq(n, dx) {
  const k = new Float64Array(n);
  for (let i = 0; i < n; i++) k[i] = 2 * Math.PI * (i < n / 2 ? i : i - n) / (n * dx);
  return k;
}

// ---------------------------------------------------------------- ODEs

/** Classical RK4 step for y' = f(t, y). y: array; returns new array. */
function rk4Step(f, t, y, h) {
  const k1 = f(t, y);
  const k2 = f(t + h / 2, y.map((v, i) => v + h / 2 * k1[i]));
  const k3 = f(t + h / 2, y.map((v, i) => v + h / 2 * k2[i]));
  const k4 = f(t + h, y.map((v, i) => v + h * k3[i]));
  return y.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}

// Dormand–Prince 5(4) coefficients (Dormand & Prince 1980; Hairer, Nørsett & Wanner, Table 5.2).
const DP = {
  c: [0, 1 / 5, 3 / 10, 4 / 5, 8 / 9, 1, 1],
  a: [[], [1 / 5], [3 / 40, 9 / 40], [44 / 45, -56 / 15, 32 / 9],
    [19372 / 6561, -25360 / 2187, 64448 / 6561, -212 / 729],
    [9017 / 3168, -355 / 33, 46732 / 5247, 49 / 176, -5103 / 18656],
    [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84]],
  b: [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84, 0],
  e: [71 / 57600, 0, -71 / 16695, 71 / 1920, -17253 / 339200, 22 / 525, -1 / 40],
};

/** The Dormand–Prince 5(4) tableau (for steppers built on top of dopri5). */
const DORMAND_PRINCE = DP;

/**
 * Adaptive Dormand–Prince 5(4) integration of y' = f(t, y) from t0 to t1.
 * Error control per component: |err_i| <= atol + rtol·max(|y_i|, |y_new_i|).
 * onStep(t, y) is called after every accepted step (return false to stop early).
 * Returns { t, y, steps, rejected, stopped }. Throws if tolerance cannot be met or
 * the step budget is exhausted; stopped is reserved for an intentional onStep stop.
 */
function dopri5(f, t0, y0, t1, { rtol = 1e-9, atol = 1e-12, h0, hmax = Infinity, maxSteps = 1e6, onStep } = {}) {
  if (!Number.isFinite(t0) || !Number.isFinite(t1) || !y0.length || !Array.from(y0).every(Number.isFinite)) throw new Error('dopri5: finite times and a non-empty finite state are required');
  if (!(Number.isFinite(rtol) && rtol > 0 && Number.isFinite(atol) && atol > 0)) throw new Error('dopri5: tolerances must be finite and positive');
  if (!(hmax > 0) || (hmax !== Infinity && !Number.isFinite(hmax)) || (h0 != null && !(Number.isFinite(h0) && h0 !== 0))) throw new Error('dopri5: step sizes must be non-zero and finite (hmax may be Infinity)');
  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

  { key: 'T', label: 'Temperature T', min: 100, max: 500, value: 298.15, unit: 'K', hint: 'Bath temperature; 298.15 K as in Slocombe et al. (2022)' },
  { key: 'Vb', label: 'Forward barrier V_b', min: 0.3, max: 1.2, value: 0.705, unit: 'eV', hint: 'Canonical → tautomer barrier; 0.705 eV from Slocombe et al. (2022)' },
  { key: 'dE', label: 'Asymmetry ΔE (tautomer above canonical)', min: 0.05, max: 0.6, value: 0.435, unit: 'eV', hint: '0.435 eV from Slocombe et al. (2022); must stay below V_b' },
  { key: 'd', label: 'Well separation d', min: 0.5, max: 1.2, value: 0.8, unit: 'Å', hint: 'Distance between the two proton minima (illustrative; sets the well widths and tunnelling length)' },
  { key: 'mass', label: 'Transferring mass', value: 'H', options: Object.entries(MASSES).map(([k, v]) => ({ value: k, label: v.label })) },
  { key: 'gamma', label: 'Bath friction γ (= 1/T₁ of the first vibrational level)', min: 0.05, max: 50, value: 2, log: true, unit: 'ps⁻¹', hint: 'Illustrative: sub-picosecond N–H stretch relaxation' },
  { key: 'gphi', label: 'Extra pure dephasing γ_φ', min: 0.01, max: 100, value: 1, log: true, unit: 'ps⁻¹', hint: 'Illustrative; affects coherences only' },
  { key: 'init', label: 'Initial state', value: 'eigen', options: [
    { value: 'eigen', label: 'canonical ground state' },
    { value: 'packet', label: 'Gaussian at canonical minimum' },
    { value: 'hot', label: 'hot packet (energy ≈ V_b)' },
  ] },
  { key: 'env', label: 'Shown in 3D', value: 'open', options: [
    { value: 'open', label: 'with environment (Lindblad)' },
    { value: 'closed', label: 'isolated proton' },
  ] },
];

/** Everything that does not depend on time: eigenstates, matrices, rates, equilibrium. */
function solveModel(params, { N = 150, nb = NBASIS, margin = 0.95 } = {}) {
  const dE = params.dE, Vb = Math.max(params.Vb, dE + 0.05), barrierRaised = Vb !== params.Vb;
  const m = MASSES[params.mass]?.m ?? MASSES.H.m;
  const pot = doubleWell({ Vb, dE, d: params.d });
  const lo = -pot.a - margin, hi = pot.a + margin;
  const dvr = dvrStates({ V: pot.V, lo, hi, N, m, count: nb });
  const { xs, dx, energies, coeffs } = dvr;
  const kT = KB * params.T;
  // fine grid for densities (also used by the renderer) and the projection grid beyond x‡
  const M = 3 * (N - 1) + 1, hf = (hi - lo) / (M - 1);
  const fx = Float64Array.from({ length: M }, (_, i) => lo + i * hf);
  const psi = coeffs.map(c => Float64Array.from(fx, x => sincEval(c, xs, dx, x)));
  const MP = 600, hp = (hi - pot.xb) / MP;
  const px = Float64Array.from({ length: MP + 1 }, (_, i) => pot.xb + i * hp);
  const psiP = coeffs.map(c => Float64Array.from(px, x => sincEval(c, xs, dx, x)));
  const XT = Array.from({ length: nb }, (_, i) => Float64Array.from({ length: nb }, (_, j) => simpson(Float64Array.from(px, (_, g) => psiP[i][g] * psiP[j][g]), hp)));
  const w = Float64Array.from({ length: nb }, (_, k) => XT[k][k]);
  // position matrix, built exactly symmetric (x_ij for far-apart levels is a cancellation-dominated
  // tiny number; evaluating it twice would break detailed balance at the rounding level)
  const xmat = Array.from({ length: nb }, () => new Float64Array(nb));
  for (let i = 0; i < nb; i++) for (let j = i; j < nb; j++) { let s = 0; for (let g = 0; g < N; g++) s += xs[g] * coeffs[i][g] * coeffs[j][g]; xmat[i][j] = xmat[j][i] = s; }
  const tautSet = new Set(), canonSet = new Set();
  for (let k = 0; k < nb; k++) (w[k] > 0.5 ? tautSet : canonSet).add(k);
  const c0 = [...canonSet][0], t0 = [...tautSet][0];
  const eq = canonicalEnsemble(energies, { kT }).probabilities;
  let PxEq = 0, PsEq = 0;
  for (let k = 0; k < nb; k++) { PxEq += eq[k] * w[k]; if (tautSet.has(k)) PsEq += eq[k]; }
  // classical Boltzmann over the same coordinate (no zero-point energy, no tunnelling)
  const boltz = x => Math.exp(-pot.V(x) / kT);
  const pieces = (A, Bx) => { let s = 0; const n = 24; for (let i = 0; i < n; i++) s += gaussLegendre(boltz, A + (Bx - A) * i / n, A + (Bx - A) * (i + 1) / n, 32); return s; };
  const Zl = pieces(lo, pot.xb), Zr = pieces(pot.xb, hi), PclEq = Zr / (Zl + Zr);
  const wC = Math.sqrt(pot.kCanon / m), wT = Math.sqrt(Math.max(pot.kTaut, 1e-12) / m);
  const kfTST = wC / (2 * Math.PI) * Math.exp(-Vb / kT), krTST = wT / (2 * Math.PI) * Math.exp(-(Vb - dE) / kT);
  // open-system rates, transfer times
  const gamma = params.gamma * 1e-3, gphi = params.gphi * 1e-3;      // ps⁻¹ → fs⁻¹
  const { G, out } = rateMatrix(energies, xmat, { m, gamma, kT });
  const prop = populationPropagator(G, out);
  const tauF = t0 === undefined ? Infinity : meanFirstPassage(G, out, tautSet)[c0];
  const tauT = t0 === undefined ? 0 : meanFirstPassage(G, out, canonSet)[t0];
  // secular approximation: smallest Bohr frequency vs the largest coherence decay rate
  let minGap = Infinity;
  for (let i = 0; i < nb; i++) for (let j = i + 1; j < nb; j++) minGap = Math.min(minGap, Math.abs(energies[j] - energies[i]) / HBAR);
  const maxDecay = Math.max(...out) + gphi;
  return {
    params, Vb, dE, barrierRaised, m, pot, lo, hi, dvr, energies, coeffs, kT, fx, hf, psi, px, XT, w, xmat,
    tautSet, canonSet, c0, t0, eq, PxEq, PsEq, PclEq, kfTST, krTST, wC, wT, G, out, prop, tauF, tauT, gamma, gphi,
    secular: minGap / maxDecay, nb,
    harmonicPclEq: Math.exp(-dE / kT) * Math.sqrt(pot.kCanon / Math.max(pot.kTaut, 1e-12)) / (1 + Math.exp(-dE / kT) * Math.sqrt(pot.kCanon / Math.max(pot.kTaut, 1e-12))),
  };
}

/** Initial amplitudes in the eigenbasis (and the captured norm). */
function initialAmplitudes(model, kind) {
  const { coeffs, dvr, pot, m, nb } = model;
  if (kind === 'eigen') { const c = new Float64Array(nb); c[model.c0] = 1; return { c, captured: 1 }; }
  const sigma = Math.sqrt(HBAR / (2 * m * Math.sqrt(pot.kCanon / m)));   // harmonic ground-state width (|ψ|² σ)
  let x0 = -pot.a;
  if (kind === 'hot') x0 = brent(x => pot.V(x) - model.Vb, model.lo + 0.05, -pot.a);
  const phi = Float64Array.from(dvr.xs, x => Math.exp(-((x - x0) ** 2) / (4 * sigma * sigma)));
  let nrm = 0; for (const v of phi) nrm += v * v; nrm = Math.sqrt(nrm);
  const c = Float64Array.from(coeffs, ck => { let s = 0; for (let g = 0; g < phi.length; g++) s += ck[g] * phi[g] / nrm; return s; });
  let captured = 0; for (const v of c) captured += v * v;
  return { c: c.map(v => v / Math.sqrt(captured)), captured, x0, sigma };
}

/**
 * Density matrix at time t (fs) in the eigenbasis: populations by the uniformised propagator,
 * coherences ρ_ij(0) e^{−iω_ij t − [(out_i + out_j)/2 + γ_φ] t} (exact for the secular Lindblad
 * equation). `open: false` gives the isolated (unitary) evolution.
 */
function densityMatrix(model, c, t, open = true) {
  const { energies, out, gphi, nb, prop } = model;
  const p0 = Float64Array.from(c, v => v * v);
  const p = open ? prop.at(p0, t) : p0;
  const re = Array.from({ length: nb }, () => new Float64Array(nb)), im = Array.from({ length: nb }, () => new Float64Array(nb));
  for (let i = 0; i < nb; i++) {
    re[i][i] = p[i];
    for (let j = i + 1; j < nb; j++) {
      const a = c[i] * c[j]; if (!a) continue;
      const ph = -(energies[i] - energies[j]) / HBAR * t;
      const damp = open ? Math.exp(-((out[i] + out[j]) / 2 + gphi) * t) : 1;
      re[i][j] = re[j][i] = a * damp * Math.cos(ph);
      im[i][j] = a * damp * Math.sin(ph); im[j][i] = -im[i][j];
    }
  }
  return { re, im, p };
}

function observe(model, rho) {
  const { XT, nb, tautSet, energies } = model;
  let Px = 0, Ps = 0, E = 0, tr = 0;
  for (let i = 0; i < nb; i++) {
    Px += rho.re[i][i] * XT[i][i]; E += rho.re[i][i] * energies[i]; tr += rho.re[i][i];
    if (tautSet.has(i)) Ps += rho.re[i][i];
    for (let j = i + 1; j < nb; j++) Px += 2 * rho.re[i][j] * XT[i][j];
  }
  return { Px: Math.max(Px, 0), Ps, E, trace: tr };
}

/** Position density n(x) on the model's fine grid. */
function density(model, rho, out = new Float64Array(model.fx.length)) {
  const { psi, nb } = model; out.fill(0);
  for (let i = 0; i < nb; i++) {
    const pi = psi[i], r = rho.re[i][i];
    if (r) for (let g = 0; g < out.length; g++) out[g] += r * pi[g] * pi[g];
    for (let j = i + 1; j < nb; j++) {
      const c = 2 * rho.re[i][j]; if (!c) continue;
      const pj = psi[j];
      for (let g = 0; g < out.length; g++) out[g] += c * pi[g] * pj[g];
    }
  }
  return out;
}

// progress coordinate: τ = log₁₀(t / fs) (a logarithmic clock, disclosed on the page)
const TAU0 = -1, DTAU = 0.01;
function timeOf(tau) { return 10 ** tau; }

function createSim(params) {
  const model = solveModel(params);
  const init = initialAmplitudes(model, params.init);
  const open = params.env !== 'closed';
  // end of the run: equilibrium reached (populations within 1 % of the thermal state) or the
  // propagator's range; isolated runs end at the same time for comparison
  const relax = Math.max(model.tauF, model.tauT);
  const tEnd = Math.min(model.prop.maxTime, Math.max(1e4, 20 / (1 / model.tauF + 1 / model.tauT), 5 * Math.min(relax, 1e30)));
  const tauEnd = Math.min(Math.log10(tEnd), 17);
  // curves on a log grid (computed once): open and closed P_x, open P_state
  const curve = { tau: [], Px: [], Ps: [], PxClosedMin: [], PxClosedMax: [] };
  for (let tau = TAU0; tau <= tauEnd + 1e-9; tau += 0.05) {
    const t = timeOf(tau), o = observe(model, densityMatrix(model, init.c, t, true));
    curve.tau.push(tau); curve.Px.push(o.Px); curve.Ps.push(o.Ps);
    let lo = Infinity, hi = -Infinity;     // closed system: envelope over the log bin
    for (let k = 0; k < 16; k++) {
      const tk = timeOf(tau - 0.05 + 0.05 * (k + 0.5) / 16), oc = observe(model, densityMatrix(model, init.c, tk, false));
      lo = Math.min(lo, oc.Px); hi = Math.max(hi, oc.Px);
    }
    curve.PxClosedMin.push(lo); curve.PxClosedMax.push(hi);
  }
  let tau = TAU0, cache = null;
  const now = () => {
    if (cache?.tau === tau) return cache;
    const t = timeOf(tau), rho = densityMatrix(model, init.c, t, open), o = observe(model, rho);
    const rhoOther = densityMatrix(model, init.c, t, !open), oo = observe(model, rhoOther);
    cache = { tau, t, rho, ...o, other: oo, n: density(model, rho, cache?.n) };
    return cache;
  };
  const sim = {
    params, model, init, curve, tauEnd, open,
    get t() { return tau; },
    get done() { return tau >= tauEnd - 1e-9; },
    step() { tau = Math.min(tauEnd, tau + DTAU); },
    get now() { return now(); },
    diagnostics() {
      const s = now();
      return [
        { key: 'trace', label: 'Trace of ρ − 1', value: Math.abs(s.trace - 1) + 1e-17, kind: 'error', good: 1e-12, warn: 1e-9 },
        { key: 'Px', label: 'Proton beyond the barrier top P_x(t)', value: s.Px, kind: 'value', text: sciTxt(s.Px) },
        { key: 'Ps', label: 'Tautomer-state population P_T(t)', value: s.Ps, kind: 'value', text: sciTxt(s.Ps) },
        { key: 'PsEq', label: 'Thermal P_T (quantum, Lindblad steady state)', value: model.PsEq, kind: 'value', text: sciTxt(model.PsEq) },
        { key: 'PxEq', label: 'Thermal P_x (position beyond x‡)', value: model.PxEq, kind: 'value', text: sciTxt(model.PxEq) },
        { key: 'Pcl', label: 'Classical Boltzmann P (no ZPE, no tunnelling)', value: model.PclEq, kind: 'value', text: sciTxt(model.PclEq) },
        { key: 'tauT', label: 'Tautomer lifetime τ_T (back-transfer)', value: model.tauT, kind: 'value', unit: 'fs', text: fmtTime(model.tauT) },
        { key: 'tauF', label: 'Formation time τ_F (canonical → tautomer)', value: Math.min(model.tauF, 1e300), kind: 'value', text: fmtTime(model.tauF) },
        { key: 'captured', label: 'Initial state captured by 30 eigenstates', value: init.captured, kind: 'value', text: init.captured.toFixed(6) },
        { key: 'secular', label: 'Secular validity: min Bohr frequency / max decay rate', value: model.secular, kind: 'value', text: model.secular.toPrecision(3), warn: model.secular < 3 },
        ...(model.barrierRaised ? [{ key: 'raised', label: 'Barrier raised to ΔE + 0.05 eV', value: model.Vb, kind: 'value', unit: 'eV' }] : []),
      ];
    },
    state() {
      const s = now();
      return { tau, t_fs: s.t, Px: s.Px, Ps: s.Ps, PsEq: model.PsEq, PxEq: model.PxEq, PclEq: model.PclEq, tauT_fs: model.tauT, tauF_fs: Math.min(model.tauF, 1e300), energies: model.energies.slice(0, 8), open };
    },
    record() {
      return { header: ['log10_t_fs', 'Px_open', 'Pstate_open', 'Px_closed_min', 'Px_closed_max'], rows: curve.tau.map((tt, i) => [tt, curve.Px[i], curve.Ps[i], curve.PxClosedMin[i], curve.PxClosedMax[i]]) };
    },
  };
  return sim;
}

const sup = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function sciTxt(x, d = 3) {
  if (x === 0) return '0';
  if (!Number.isFinite(x)) return 'beyond range';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -2 && e <= 3) return (+x.toPrecision(d)).toString();
  const mant = x / 10 ** e;
  return `${mant.toFixed(d - 1)}×10${String(e).split('').map(ch => sup[ch]).join('')}`;
}
function fmtTime(fs) {
  if (!Number.isFinite(fs) || fs > 3.15e22) return '> 1 year';
  const units = [[3.15e22, 'yr'], [8.64e19, 'days'], [3.6e18, 'h'], [1e15, 's'], [1e12, 'ms'], [1e9, 'µs'], [1e6, 'ns'], [1e3, 'ps'], [1, 'fs'], [1e-3, 'as']];
  for (const [f, u] of units) if (fs >= f) return `${+(fs / f).toPrecision(3)} ${u}`;
  return `${+(fs * 1e3).toPrecision(3)} as`;
}

/** Biological question: survival until strand separation and an upper bound on mismatches. */
function mutationBudget(model, tSepFs) {
  const survive = Math.exp(-tSepFs / Math.max(model.tauT, 1e-300));
  const formedState = model.PsEq, formedPosition = model.PxEq;
  return {
    survive,
    atSeparationState: formedState * survive,        // adiabatic picture: a real tautomer that has not reverted
    atSeparationSudden: formedPosition,              // sudden picture: position measured when the bond breaks
    afterRepairState: formedState * survive * ERROR_RATES.proofreading * ERROR_RATES.mmr,
    afterRepairSudden: formedPosition * ERROR_RATES.proofreading * ERROR_RATES.mmr,
  };
}

// ================================================================== verification
function verify({ log } = {}) {
  const checks = [], notes = [];
  const add = (label, value, pass, extra = {}) => checks.push({ label, value, pass, ...extra });
  const mH = MASSES.H.m;
  const defaults = Object.fromEntries(PARAMS.map(p => [p.key, p.value]));

  // 1. Harmonic limit: DVR levels of ½kx² vs (n + ½)ħω
  log?.('harmonic oscillator levels');
  {
    const k = 20, w = Math.sqrt(k / mH);
    const r = dvrStates({ V: x => 0.5 * k * x * x, lo: -1, hi: 1, N: 120, m: mH, count: 8 });
    let err = 0; r.energies.forEach((E, n) => { err = Math.max(err, Math.abs(E / (HBAR * w * (n + 0.5)) - 1)); });
    add('Harmonic well: DVR levels n = 0…7 vs (n + ½)ħω', `max rel. error ${err.toExponential(1)}`, err < 1e-9);
  }

  // 2. Anharmonic canonical well: lowest two levels vs 2nd-order perturbation theory
  log?.('anharmonic perturbation theory');
  const model = solveModel(defaults);
  {
    const { pot, energies, m } = model, w = Math.sqrt(pot.kCanon / m), L2 = HBAR / (m * w);
    const al = pot.d3V(-pot.a) / 6, be = pot.d4V() / 24;
    const pt = n => HBAR * w * (n + 0.5) + be * L2 * L2 * (6 * n * n + 6 * n + 3) / 4 - al * al / (HBAR * w) * L2 ** 3 * (30 * n * n + 30 * n + 11) / 8;
    const e0 = Math.abs(energies[0] - pt(0)) / (energies[0]), e1 = Math.abs(energies[1] - pt(1)) / (energies[1]);
    const harm = Math.abs(energies[0] / (HBAR * w * 0.5) - 1);
    add('Canonical well: E₀, E₁ vs harmonic + 2nd-order anharmonic perturbation theory', `ΔE₀/E₀ = ${e0.toExponential(1)}, ΔE₁/E₁ = ${e1.toExponential(1)} (pure harmonic off by ${(100 * harm).toFixed(1)} %)`, e0 < 0.01 && e1 < 0.03 && e0 < harm);
  }

  // 3. Spectral DVR vs finite differences (stationaryStates1D), Richardson extrapolated; FD order
  log?.('finite differences vs spectral DVR');
  {
    const { pot, m, lo, hi, energies } = model;
    const fd = n => { const dx = (hi - lo) / (n + 1); const V = Float64Array.from({ length: n }, (_, i) => pot.V(lo + (i + 1) * dx)); return stationaryStates1D({ V, dx, count: 6, mass: m, hbar: HBAR }).energies; };
    const e1 = fd(300), e2 = fd(600), e4 = fd(1200);
    const order = Math.log2(Math.abs(e1[0] - e2[0]) / Math.abs(e2[0] - e4[0]));
    let dev = 0; for (let k = 0; k < 6; k++) { const rich = (4 * e4[k] - e2[k]) / 3; dev = Math.max(dev, Math.abs(rich - energies[k])); }
    add('Lowest 6 levels: spectral DVR (150 pts) vs Richardson-extrapolated finite differences (600/1200 pts)', `max |ΔE| = ${dev.toExponential(1)} eV`, dev < 2e-6);
    add('Finite-difference levels: measured convergence order (h, h/2, h/4)', order.toFixed(2), Math.abs(order - 2) < 0.3);
  }

  // 4. DVR resolution and domain refinement
  log?.('grid refinement');
  {
    const fine = solveModel(defaults, { N: 220, margin: 1.15 });
    let dev = 0; for (let k = 0; k < 20; k++) dev = Math.max(dev, Math.abs(fine.energies[k] - model.energies[k]));
    const dP = Math.abs(fine.PsEq / model.PsEq - 1), dPx = Math.abs(fine.PxEq / model.PxEq - 1);
    add('DVR refinement (150 → 220 points, domain +0.2 Å): lowest 20 levels', `max |ΔE| = ${dev.toExponential(1)} eV`, dev < 1e-7);
    add('DVR refinement: thermal P_T and P_x', `rel. change ${dP.toExponential(1)}, ${dPx.toExponential(1)}`, dP < 1e-4 && dPx < 1e-3);
    const small = solveModel(defaults, { nb: 22 });
    const dB = Math.abs(small.PsEq / model.PsEq - 1);
    add('Basis truncation (22 vs 30 eigenstates): thermal P_T', `rel. change ${dB.toExponential(1)}`, dB < 1e-6);
    // boundary: highest used state negligible at the domain edges
    const last = model.psi[model.nb - 1], edge = Math.max(last[0] ** 2, last[last.length - 1] ** 2);
    add('Highest basis state vanishes at the domain edges', `|ψ₂₉|² = ${edge.toExponential(1)} Å⁻¹`, edge < 1e-8);
  }

  // 5. Tunnelling splitting of the symmetric well vs the instanton (deep-barrier WKB) formula
  log?.('symmetric splitting vs instanton');
  {
    // V = V_b(u² − 1)² maps exactly onto ½q²(1 − √g q)² in units ħ = m = ω = 1 with
    // ħω = √(8V_b/(m a²))·ħ and g = ħω/(32 V_b). Zinn-Justin & Jentschura (Ann. Phys. 313, 197 (2004)):
    //   ΔE = (2/√(πg)) e^{−1/(6g)} (1 − 71g/12 + O(g²)) ħω.
    const rows = [];
    for (const [label, m, Vb] of [['H, V_b = 0.705 eV', mH, 0.705], ['D, V_b = 0.705 eV', MASSES.D.m, 0.705], ['D, V_b = 1.0 eV', MASSES.D.m, 1.0]]) {
      const pot = doubleWell({ Vb, dE: 0, d: 0.8 });
      const r = dvrStates({ V: pot.V, lo: -pot.a - 0.7, hi: pot.a + 0.7, N: 160, m, count: 2 });
      const split = r.energies[1] - r.energies[0];
      const hw = HBAR * Math.sqrt(8 * Vb / (m * pot.a * pot.a)), g = hw / (32 * Vb);
      const inst = hw * 2 / Math.sqrt(Math.PI * g) * Math.exp(-1 / (6 * g)) * (1 - 71 * g / 12);
      rows.push({ label, split, inst, g, ratio: split / inst });
    }
    const devs = rows.map(r => Math.abs(r.ratio - 1));
    // the remaining deviation must be the next order of the expansion: |ratio − 1|/g² roughly constant
    const c2 = devs.map((dv, i) => dv / rows[i].g ** 2), spread = Math.max(...c2) / Math.min(...c2);
    add('Symmetric well splitting (DVR) vs instanton formula with first correction', rows.map(r => `${r.label}: g = ${r.g.toFixed(4)}, Δ = ${r.split.toExponential(3)} eV, ratio ${r.ratio.toFixed(4)}`).join('; ') + `; residual/g² = ${c2.map(v => v.toFixed(1)).join(', ')} (O(g²) as expected)`,
      devs[0] > devs[1] && devs[1] > devs[2] && devs[2] < 0.005 && spread < 1.5);
    notes.push(`Symmetric-well tunnelling splitting for one proton (V_b = 0.705 eV, d = 0.8 Å): ${rows[0].split.toExponential(3)} eV, i.e. a coherent transfer time πħ/Δ = ${fmtTime(Math.PI * HBAR / rows[0].split)}.`);
    // FD vs DVR on the splitting
    const pot = doubleWell({ Vb: 0.705, dE: 0, d: 0.8 }), lo = -pot.a - 0.7, hi = pot.a + 0.7;

  drawColorBar(ctx, { x: narrow ? (view.W - cbw) / 2 : view.W - cbw - 24, y: narrow ? view.H * 0.33 : view.H - 124, width: cbw, height: 9, horizontal: true, colormap: 'inferno', range: [1e-14, 10], log: true, format: e => (e % 4 === 0 ? (e === 0 ? '1' : `10${String(e).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`) : ''), label: 'beads: n(x) along the H-bond (Å⁻¹)' });
}

// ------------------------------------------------------------------ mutation-budget bar chart (2D canvas)
function barChart(canvas, items, { title }) {
  const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W) return;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const narrow = W < 520, lo = -24, hi = 0, padL = 22, padR = 14, top = 26, rowH = (H - top - 34) / items.length;
  const X = v => padL + (Math.log10(Math.max(v, 10 ** lo)) - lo) / (hi - lo) * (W - padL - padR);
  ctx.font = '600 12px ui-sans-serif, system-ui'; ctx.fillStyle = cssVar('--ink'); ctx.fillText(title, padL, 14);
  ctx.strokeStyle = cssVar('--grid'); ctx.fillStyle = cssVar('--muted'); ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
  for (let e = lo; e <= hi; e += narrow ? 6 : 3) {
    const x = X(10 ** e); ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, H - 30); ctx.stroke();
    ctx.fillText(e === 0 ? '1' : `10${String(e).split('').map(c => ({ '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' })[c]).join('')}`, x, H - 18);
  }
  ctx.fillText('probability per G–C pair (log scale)', W / 2, H - 4);
  ctx.textAlign = 'start';
  items.forEach((it, i) => {
    const y = top + i * rowH, x = X(it.value), bh = Math.min(12, rowH * 0.32);
    ctx.fillStyle = cssVar(it.color); ctx.globalAlpha = it.kind === 'measured' ? 0.45 : 0.85;
    ctx.fillRect(padL, y + rowH - bh - 3, Math.max(1, x - padL), bh); ctx.globalAlpha = 1;
    if (it.kind === 'measured') { ctx.strokeStyle = cssVar(it.color); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + rowH - 2); ctx.stroke(); }
    ctx.fillStyle = cssVar('--ink-2'); ctx.font = `${narrow ? 10 : 11}px ui-sans-serif, system-ui`;
    ctx.fillText(`${it.label}: ${it.value < 10 ** lo ? '< 10⁻²⁴' : sciTxt(it.value, 2)}`, padL, y + rowH - bh - 6);
  });
}

// ------------------------------------------------------------------ workbench
function bench({ eqs, figs, createPlot, createEquation, M, getSim }) {
  let tSepFs = 100e3;
  // Figure 1: double well, levels, eigenfunctions, current density
  const well = createPlot({ title: 'Double well along the transfer coordinate: levels, eigenstates and n(x, t)', height: 330, x: { label: 'proton displacement x from the H-bond midpoint', unit: 'Å' }, y: { label: 'energy', unit: 'eV' } });
  const pops = createPlot({ title: 'Probability on the tautomer side vs time (log–log)', height: 330, x: { label: 'time t', unit: 'fs', log: true }, y: { label: 'probability', log: true } });
  const temp = createPlot({ title: 'Thermal equilibrium vs temperature', height: 300, x: { label: 'temperature', unit: 'K', min: 150, max: 500 }, y: { label: 'probability', log: true } });
  const wrap = (plot, caption) => el('div', { class: 'dna-fig' }, plot.el, el('p', { class: 'psim-hint' }, caption));
  const bars = el('canvas', { class: 'dna-bars' }), barWrap = el('div', { class: 'dna-barwrap' }, bars);
  const sepLabel = el('span', { class: 'psim-hint' });
  const sep = slider({ label: 'Strand-separation time t_sep', min: 0.1, max: 1e6, value: 100, log: true, unit: 'ps', digits: 3, onInput: v => { tSepFs = v * 1e3; redrawBars(); } });
  const sepBtns = el('div', { class: 'dna-row' }, ...SEPARATION_TIMES.map(st => button(st.label, () => { tSepFs = st.t * 1e15; sep.setValue?.(st.t * 1e12); redrawBars(); })));
  const barCaption = el('p', { class: 'psim-hint' });
  figs.append(
    wrap(well, 'Computed: V(x) (quartic, ΔE and V_b from Slocombe et al. 2022, width illustrative), eigenenergies (horizontal bars between classical turning points, coloured by where the state lives as in the legend), eigenfunctions ψₙ drawn at their energy (scaled 0.025 eV·Å^½), and the current density n(x, t) drawn at ⟨E⟩(t) (scaled ×0.04 eV·Å). Dotted line: barrier top x‡, the dividing surface for P_x.'),
    wrap(pops, 'Computed (exact solution of the model at every time): P_x = ∫_{x>x‡} n dx and P_T = population of the tautomer-localised eigenstates, with the Lindblad environment (solid) and for the isolated proton (dashed: min–max envelope over each time bin, the oscillations are faster than the plotted sampling). Horizontal lines: thermal values and the classical Boltzmann estimate; Slocombe et al. quote 1.73×10⁻⁴ for their model.'),
    wrap(temp, 'Computed: equilibrium populations of the same model from the Boltzmann-weighted eigenstates, and the classical configurational Boltzmann integral (no zero-point energy, no tunnelling). Quantum mechanics raises the tautomer population mainly through zero-point energy; P_x is dominated by the tunnelling tail of the canonical ground state at low T.'),
    el('div', { class: 'dna-fig', style: 'grid-column: 1 / -1' }, barWrap, sep, sepBtns, sepLabel, barCaption),
  );

  // equations
  const cur = { sim: null };
  const lind = createEquation({
    title: 'Open-system dynamics: Lindblad master equation (Born–Markov, secular, ohmic bath coupled through x)',
    lhs: { mathml: `${M.frac(`<mi>d</mi>${M.i('ρ')}`, `<mi>d</mi>${M.i('t')}`)}`, label: 'density matrix of the proton' },
    terms: [
      { id: 'coh', mathml: `<mo>−</mo>${M.frac(M.i('i'), M.i('ħ'))}<mo>[</mo>${M.i('H')}<mo>,</mo>${M.i('ρ')}<mo>]</mo>`, label: 'coherent motion and tunnelling in the double well', color: '--body-0', value: () => cur.sim ? (cur.sim.model.energies[1] - cur.sim.model.energies[0]) : NaN, unit: 'eV (E₁ − E₀)' },
      { id: 'rel', mathml: `<munder><mo>∑</mo><mrow>${M.i('i')}<mo>≠</mo>${M.i('j')}</mrow></munder>${M.sub(M.i('Γ'), `${M.i('i')}<mo>←</mo>${M.i('j')}`)}<mi>𝒟</mi><mo>[</mo><mo>|</mo>${M.i('i')}<mo>⟩⟨</mo>${M.i('j')}<mo>|</mo><mo>]</mo>${M.i('ρ')}`, label: 'relaxation and thermal activation (detailed balance)', color: '--body-2', value: () => cur.sim ? cur.sim.model.gamma : NaN, unit: 'fs⁻¹ (γ)' },
      { id: 'deph', mathml: `${M.sub(M.i('γ'), M.i('φ'))}<munder><mo>∑</mo>${M.i('k')}</munder><mi>𝒟</mi><mo>[</mo><mo>|</mo>${M.i('k')}<mo>⟩⟨</mo>${M.i('k')}<mo>|</mo><mo>]</mo>${M.i('ρ')}`, label: 'pure dephasing', color: '--muted', value: () => cur.sim ? cur.sim.model.gphi : NaN, unit: 'fs⁻¹' },
    ],
    where: [
      { mathml: `<mi>𝒟</mi><mo>[</mo>${M.i('L')}<mo>]</mo>${M.i('ρ')}`, meaning: 'L ρ L† − ½{L†L, ρ}: Lindblad dissipator (trace- and positivity-preserving)' },
    ],
    link: pops,
  });
  const rate = createEquation({
    title: 'Transition rates between eigenstates (Caldeira–Leggett coupling, weak-coupling limit)',
    lhs: { mathml: M.sub(M.i('Γ'), `${M.i('i')}<mo>←</mo>${M.i('j')}`), label: 'downhill rate, E_j > E_i' },
    terms: [{ id: 'g', mathml: `${M.frac(`<mn>2</mn>${M.i('m')}${M.i('γ')}`, M.i('ħ'))}<mo>|</mo>${M.sub(M.i('x'), `${M.i('i')}${M.i('j')}`)}${M.sup('<mo>|</mo>', '<mn>2</mn>')}${M.sub(M.i('ω'), `${M.i('j')}${M.i('i')}`)}<mo>[</mo>${M.i('n̄')}<mo>(</mo>${M.sub(M.i('ω'), `${M.i('j')}${M.i('i')}`)}<mo>)</mo><mo>+</mo><mn>1</mn><mo>]</mo>`, label: 'tautomer ground → canonical ground; uphill: n̄ instead of n̄ + 1, so Γ↑/Γ↓ = e^(−ΔE/kT)', color: '--body-2', value: () => cur.sim ? cur.sim.model.G[cur.sim.model.c0][cur.sim.model.t0] : NaN, unit: 'fs⁻¹ (G*C* → GC)' }],
    where: [
      { mathml: M.i('n̄'), meaning: 'Bose occupation 1/(e^{ħω/kT} − 1) of the bath mode' },
      { mathml: M.sub(M.i('x'), `${M.i('i')}${M.i('j')}`), meaning: 'position matrix element: the environment pushes on x, so only overlapping states exchange population' },
    ],
  });
  const obs = createEquation({
    title: 'Observables: two ways to count “tautomer”',
    lhs: { mathml: M.sub(M.i('P'), M.i('x')), label: 'proton beyond the barrier top (as Slocombe et al. Eq. 4)', value: () => cur.sim?.now.Px, color: '--body-2' },
    op: '=',
    terms: [{ id: 'px', mathml: `<msubsup><mo>∫</mo>${M.sup(M.i('x'), '<mo>‡</mo>')}<mi>∞</mi></msubsup>${M.i('n')}<mo>(</mo>${M.i('x')}<mo>,</mo>${M.i('t')}<mo>)</mo><mi>d</mi>${M.i('x')}`, label: 'includes the tunnelling tail of the canonical ground state', color: '--body-2', value: () => cur.sim?.now.Px }],
    note: 'P_T = Σ_{k∈tautomer} ρ_kk counts only eigenstates localised in the tautomer well (> 50 % beyond x‡): a chemically stable G*–C* that could mispair.',
  });
  const surv = createEquation({
    title: 'Does the tautomer survive until the strands separate?',
    lhs: { mathml: M.i('S'), label: 'survival probability', value: () => cur.sim ? mutationBudget(cur.sim.model, tSepFs).survive : NaN },
    terms: [{ id: 's', mathml: M.sup(M.i('e'), `<mo>−</mo>${M.sub(M.i('t'), M.i('sep'))}<mo>/</mo>${M.sub(M.i('τ'), M.i('T'))}`), label: 'τ_T: mean first-passage time back to the canonical side', color: '--warn', value: () => cur.sim ? cur.sim.model.tauT : NaN, unit: 'fs (τ_T)' }],
    note: 'Assumes the potential stays as it is while the strands start to separate. Slocombe et al. (Commun. Chem. 2022) find it changes during separation and can trap the tautomer: not modelled here.',
  });
  eqs.append(lind.el, rate.el, obs.el, surv.el);

  function redrawBars() {
    const sim = cur.sim; if (!sim) return;
    const m = sim.model, mb = mutationBudget(m, tSepFs), rep = ERROR_RATES.proofreading * ERROR_RATES.mmr;
    sepLabel.textContent = `t_sep = ${fmtTime(tSepFs)} · τ_T = ${fmtTime(m.tauT)} · survival S = ${sciTxt(mb.survive)}`;
    barChart(bars, [
      { label: 'thermal tautomer population P_T (this model)', value: m.PsEq, color: '--body-2', kind: 'model' },
      { label: 'classical Boltzmann, no tunnelling/ZPE (this model)', value: m.PclEq, color: '--muted', kind: 'model' },
      { label: 'Slocombe et al. 2022, their model (quoted)', value: SLOCOMBE.tautomerOccupation, color: '--warn', kind: 'model' },
      { label: 'tautomers surviving to t_sep: P_T·S', value: mb.atSeparationState, color: '--body-0', kind: 'model' },
      { label: 'sudden-separation bound: P_x (this model)', value: mb.atSeparationSudden, color: '--body-1', kind: 'model' },
      { label: 'measured: polymerase base-selection error (~10⁻⁵)', value: ERROR_RATES.selection.value, color: '--ink-2', kind: 'measured' },
      { label: 'upper bound after proofreading × repair: P_T·S·10⁻⁵', value: mb.atSeparationState * rep, color: '--body-0', kind: 'model' },
      { label: 'measured: E. coli spontaneous rate per bp per generation', value: ERROR_RATES.ecoli.value, color: '--ink-2', kind: 'measured' },
    ], { title: 'Could it matter? Estimates per G–C pair per replication vs measured error rates' });
    barCaption.textContent = `Model bars are computed from this page's model; "upper bound" assumes every surviving tautomer is copied wrongly (misinsertion probability 1) and then escapes proofreading (×10⁻²) and mismatch repair (×10⁻³) at the average rates. Measured: ${ERROR_RATES.ecoli.source}; ${ERROR_RATES.selection.source}. Separation times: ${SEPARATION_TIMES.map(s => `${s.label}: ${s.source}`).join('; ')}.`;
  }

  let built = null;
  return {
    update(sim) {
      cur.sim = sim;
      const m = sim.model, s = sim.now;
      if (built !== sim) {
        built = sim;
        // --- double well
        const xs = m.fx, top = m.Vb + 0.45;
        well.setX({ min: m.lo, max: m.hi }).setY({ min: -0.08, max: top, auto: false });
        for (const id of [...Array(40).keys()]) { well.remove(`lv${id}`); well.remove(`psi${id}`); }
        well.fn('V', x => m.pot.V(x), { color: '--ink', label: 'V(x)', width: 2 });
        well.vline('xb', m.pot.xb, { color: '--warn', label: 'x‡' });
        let shownC = false, shownT = false, shownD = false, k = 0;
        for (let i = 0; i < m.nb && m.energies[i] < top; i++) {
          const E = m.energies[i], inside = []; for (let g = 0; g < xs.length; g++) if (m.pot.V(xs[g]) <= E) inside.push(xs[g]);
          const loc = m.w[i] > 0.9 ? 'T' : m.w[i] < 0.1 ? 'C' : 'D';
          const col = loc === 'T' ? '--body-2' : loc === 'C' ? '--body-0' : '--muted';
          let label;
          if (loc === 'C' && !shownC) { label = 'canonical-well levels'; shownC = true; }
          if (loc === 'T' && !shownT) { label = 'tautomer-well levels'; shownT = true; }
          if (loc === 'D' && !shownD) { label = 'delocalised levels'; shownD = true; }
          // levels: one segment per classically allowed interval
          const segs = []; let run = [];
          for (let g = 0; g < xs.length; g++) { if (m.pot.V(xs[g]) <= E) run.push(xs[g]); else if (run.length) { segs.push(run); run = []; } }
          if (run.length) segs.push(run);
          const pts = []; for (const sg of segs) { pts.push([sg[0], E], [sg[sg.length - 1], E], [NaN, NaN]); }
          well.data(`lv${i}`, pts, { color: col, label, width: 1.4 });
          if (k < 7 && E < m.Vb + 0.1) { well.data(`psi${i}`, Array.from(xs, (x, g) => [x, E + 0.025 * m.psi[i][g]]), { color: col, width: 1, dash: true }); k++; }
        }
        // --- populations vs time
        const c = sim.curve, ts = c.tau.map(timeOf);
        const pos = (arr) => ts.map((t, i) => [t, arr[i]]).filter(p => p[1] > 0);
        const all = [...c.Px, ...c.Ps, ...c.PxClosedMin, m.PsEq, m.PclEq, m.PxEq].filter(v => v > 0);
        const ymin = Math.max(1e-40, 10 ** Math.floor(Math.log10(Math.min(...all)) - 0.5));
        pops.setX({ min: timeOf(c.tau[0]), max: timeOf(runEnd(sim) + TAU0) }).setY({ min: ymin, max: 1, auto: false });
        pops.data('px', pos(c.Px), { color: '--body-2', label: 'P_x with environment', width: 2 });
        pops.data('ps', pos(c.Ps), { color: '--body-0', label: 'P_T (tautomer states) with environment', width: 2 });
        pops.data('cmax', pos(c.PxClosedMax), { color: '--muted', label: 'P_x isolated proton (envelope)', dash: true, width: 1.2 });
        pops.data('cmin', pos(c.PxClosedMin), { color: '--muted', dash: true, width: 1.2 });
        pops.hline('eqs', m.PsEq, { color: '--body-0', label: `thermal P_T ${sciTxt(m.PsEq)}` });
        pops.hline('eqx', m.PxEq, { color: '--body-2', label: `thermal P_x ${sciTxt(m.PxEq)}` });
        pops.hline('cl', m.PclEq, { color: '--muted', label: `classical ${sciTxt(m.PclEq)}` });
        pops.hline('slo', SLOCOMBE.tautomerOccupation, { color: '--warn', label: 'Slocombe et al. 1.73×10⁻⁴' });
        if (Number.isFinite(m.tauT) && m.tauT > 0) pops.vline('tt', m.tauT, { color: '--body-0', label: `τ_T ${fmtTime(m.tauT)}` });
        if (Number.isFinite(m.tauF)) pops.vline('tf', m.tauF, { color: '--body-2', label: `τ_F ${fmtTime(m.tauF)}` }); else pops.remove('tf');
        // --- temperature scan of the same spectrum
        const Ts = Array.from({ length: 71 }, (_, i) => 150 + 5 * i);
        const eqAt = T => {
          const kT = KB * T, E0 = m.energies[0]; let Z = 0, ps = 0, px = 0;
          for (let i = 0; i < m.nb; i++) { const b = Math.exp(-(m.energies[i] - E0) / kT); Z += b; px += b * m.w[i]; if (m.tautSet.has(i)) ps += b; }
          return { ps: ps / Z, px: px / Z };
        };
        const clAt = T => {
          const kT = KB * T, f = x => Math.exp(-m.pot.V(x) / kT); let l = 0, r = 0; const n = 600, h = (m.hi - m.lo) / n;
          for (let i = 0; i < n; i++) { const x = m.lo + (i + 0.5) * h, v = f(x) * h; if (x > m.pot.xb) r += v; else l += v; }
          return r / (l + r);
        };
        const sc = Ts.map(T => [T, eqAt(T), clAt(T)]);
        temp.setY({ min: Math.max(1e-40, 10 ** Math.floor(Math.log10(Math.min(sc[0][1].ps, sc[0][2]) || 1e-40))), max: 1, auto: false });
        temp.data('ps', sc.map(([T, q]) => [T, q.ps]), { color: '--body-0', label: 'quantum P_T (tautomer states)', width: 2 });
        temp.data('px', sc.map(([T, q]) => [T, q.px]), { color: '--body-2', label: 'quantum P_x (beyond x‡)', width: 2 });
        temp.data('cl', sc.map(([T, , q]) => [T, q]), { color: '--muted', label: 'classical Boltzmann', dash: true });
        temp.vline('now', m.params.T, { color: '--warn', label: `${m.params.T} K` });
        temp.vline('body', 310, { color: '--grid-strong', label: '310 K' });
        redrawBars();
      }
      // live parts
      const n = s.n;
      well.data('n', Array.from(m.fx, (x, g) => [x, s.E + 0.04 * n[g]]), { color: '#ffd27a', label: 'n(x, t) drawn at ⟨E⟩(t)', width: 1.8 });
      pops.cursor(s.t);
      lind.update(); rate.update(); obs.update(); surv.update();
      well.draw(); pops.draw(); temp.draw();
    },
  };
}

createInstrument({
  title: 'Proton tunnelling in a G–C base pair',
  subtitle: '1D asymmetric double well (Löwdin double proton transfer), exact eigenstate dynamics and a Lindblad environment: a quantitative estimate, not a proof that tunnelling causes mutations',
  tier: 'approximate',
  tierReason: 'Reduced model: one effective proton-transfer coordinate with a quartic potential whose barrier and asymmetry are taken from Slocombe et al. (2022) and whose width and bath coupling are illustrative; weak-coupling Markovian environment. The numerics are verified (instanton splitting, perturbation theory, finite differences, split-operator TDSE, RK4 Lindblad, detailed balance), the biological conclusion is model-dependent.',
  layout: 'workbench',
  params: PARAMS, create: p => shiftClock(createSim(p)),
  gl: true, drawGL, draw, bench,
  timeline: {
    duration: sim => runEnd(sim),
    markers: sim => {
      const m = sim.model, ueq = equilibrated(sim), ms = [];
      if (m.tauT > 0 && Number.isFinite(m.tauT)) ms.push({ t: U(m.tauT), label: 'tautomer lifetime τ_T (mean first-passage time back to the canonical side)', short: `τ_T ${fmtTime(m.tauT)}`, kind: 'computed' });
      if (Number.isFinite(ueq)) ms.push({ t: ueq, label: 'equilibrium: P_T and P_x within 1 % of their thermal values (from the computed curve)', short: `eq. ${fmtTime(timeOf(ueq + TAU0))}`, kind: 'computed' });
      const hel = SEPARATION_TIMES[2];
      ms.push({ t: U(hel.t * 1e15), label: `strand separation by helicase, t ≫ ${hel.label} (Slocombe et al., Commun. Phys. 2022)`, short: `≫${hel.label}`, kind: 'measured' });
      if (Number.isFinite(m.tauF)) ms.push({ t: U(m.tauF), label: 'tautomer formation time τ_F (mean first-passage time canonical → tautomer)', short: `τ_F ${fmtTime(m.tauF)}`, kind: 'computed' });
      return ms.filter(q => q.t >= 0 && q.t <= runEnd(sim) + 1e-12);

        + (runEnd(sim) < sim.tauEnd - TAU0 - 1e-9 ? '' : ' Here the run is limited by the model’s computed range.');

  onFit(view) { cam.fit(FIT_BOX, view.W / view.H, 1.05); },
  presets: [
    { label: 'Slocombe et al. energies, 298 K', values: { T: 298.15, Vb: 0.705, dE: 0.435, mass: 'H', init: 'eigen', env: 'open' }, play: true },
    { label: 'Hot proton, isolated', values: { init: 'hot', env: 'closed' }, play: true },
    { label: 'Hot proton in the cell', values: { init: 'hot', env: 'open' }, play: true },
    { label: 'Deuterium', values: { mass: 'D' }, play: true },
  ],
  model: {
    legend: [
      'clouds: quantiles of computed n(x, t); cyan canonical side, magenta beyond x‡',
      'beads: n(x, t) on a log scale; gold ring: barrier top x‡',
      'atoms: symbolic CPK colours · clock: logarithmic',
    ],
    assumptions: [
      'One effective coordinate x carries both transferring protons (G N1–H···N3 C and C N4–H···O6 G) concertedly; the 2D concerted-vs-stepwise surface is not computed.',

// GPU self-test: the cloud's fraction beyond the barrier matches the computed P_x, and a cloud point renders where the camera projects it
window.psim.selfTest = () => {
  const sim = window.psim.getSim();
  window.psim.advanceTo(1.5 - TAU0);                     // τ = 1.5 (t ≈ 32 fs); the clock runs in u = τ − TAU0
  const s = sim.now, m = sim.model;
  // fraction of quantile points beyond x‡ vs P_x: exact up to 1/NP
  const n = s.n; let cum = 0, tot = 0; for (let g = 1; g < n.length; g++) { const v = 0.5 * (n[g] + n[g - 1]) * m.hf; tot += v; if (m.fx[g] > m.pot.xb) cum += v; }
  const frac = cum / tot;
  return [{ label: 'Point-cloud mass beyond x‡ equals the computed P_x (quadrature of n)', Px: s.Px, cloudFraction: frac, pass: Math.abs(frac - s.Px) < 2e-3 + 1 / NP }];
};
