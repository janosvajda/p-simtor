<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

/**
 * A 3D scalar field (index i + nx·(j + ny·k)) rendered by ray marching through its box.

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */

in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;

precision highp float;

// ---------------------------------------------------------------- lines

/**

// ---------------------------------------------------------------- solid objects (meshes)

/**

// ---------------------------------------------------------------- the spin system
const systemCache = new Map();
/** Operators for electron 1 ⊗ electron 2 ⊗ nucleus (spin I). Cached per I. */

/** H in rad µs⁻¹: Zeeman ω₀ n·(S₁+S₂) (both radicals g = g_e) + S₁·A·I (A diagonal, principal values in rad µs⁻¹). */

/**
 * Eigen-decomposition of a complex Hermitian matrix with the real symmetric solver of core/linalg:
 * the real embedding [[Re H, −Im H], [Im H, Re H]] has every eigenvalue twice, with vectors [x; y] and
 * [−y; x] for the complex eigenvector x + iy. Degenerate groups are reduced to an orthonormal complex
 * basis by pivoted complex Gram–Schmidt. Returns { values, vecRe, vecIm } (vector k in column k).

function eigHermitian(H) {
  const n = H.n, N = 2 * n, R = [];

  }

    let g1 = g0 + 1;

    const need = (g1 - g0) / 2;
    if (!Number.isInteger(need)) throw new Error('eigHermitian: odd degenerate group (embedding pairing failed)');
    const cand = [];
    for (let k = g0; k < g1; k++) { const v = vectors[k]; cand.push({ re: Float64Array.from(v.subarray ? v.subarray(0, n) : v.slice(0, n)), im: Float64Array.from(v.subarray ? v.subarray(n) : v.slice(n)) }); }
    const lam = values.slice(g0, g1).reduce((s, x) => s + x, 0) / (g1 - g0);
    const accepted = [];
    for (let c = 0; c < need; c++) {

      let best = null, bestNorm = -1;
      for (const v of cand) {
        const r = { re: Float64Array.from(v.re), im: Float64Array.from(v.im) };
        for (const u of accepted) {
          let pr = 0, pi = 0;                        // ⟨u|r⟩
          for (let i = 0; i < n; i++) { pr += u.re[i] * r.re[i] + u.im[i] * r.im[i]; pi += u.re[i] * r.im[i] - u.im[i] * r.re[i]; }
          for (let i = 0; i < n; i++) { r.re[i] -= pr * u.re[i] - pi * u.im[i]; r.im[i] -= pr * u.im[i] + pi * u.re[i]; }
        }
        let nn = 0; for (let i = 0; i < n; i++) nn += r.re[i] ** 2 + r.im[i] ** 2;
        if (nn > bestNorm) { bestNorm = nn; best = r; }
      }
      const s = 1 / Math.sqrt(bestNorm);
      for (let i = 0; i < n; i++) { best.re[i] *= s; best.im[i] *= s; }
      accepted.push(best);
    }
    for (const u of accepted) { outVal.push(lam); outRe.push(u.re); outIm.push(u.im); }
    g0 = g1;
  }

}

/** Singlet amplitudes ⟨S, j|m⟩ for every eigenvector m and nuclear state j. */
function singletOverlaps(sys, eig) {

      r[j] = (vr[idx(0, 1, j, M)] - vr[idx(1, 0, j, M)]) / Math.SQRT2;
      i[j] = (vi[idx(0, 1, j, M)] - vi[idx(1, 0, j, M)]) / Math.SQRT2;

/** |⟨m|P_S|n⟩|²/M and ω_mn for all pairs: the spectrum of the singlet probability. */

    let pr = 0, pi = 0;                              // ⟨a|P_S|b⟩ = Σ_j conj(⟨S j|a⟩) ⟨S j|b⟩
    for (let j = 0; j < M; j++) { pr += ovRe[a][j] * ovRe[b][j] + ovIm[a][j] * ovIm[b][j]; pi += ovRe[a][j] * ovIm[b][j] - ovIm[a][j] * ovRe[b][j]; }

const yieldExact = (spec, k) => { let s = 0; for (let i = 0; i < spec.w.length; i++) s += spec.w[i] * k * k / (k * k + spec.om[i] ** 2); return s; };

function setup(p) {
  const model = MODELS[p.model] ?? MODELS.n5, sys = spinSystem(model.I);
  const A = model.tensor(p.a).map(v => v * PER_MT), omega0 = GAMMA_E * p.B;

}
/** Φ_S for one field direction n (unit vector) of the static problem. */

// ---------------------------------------------------------------- the compass surface Φ_S(𝐧)
// For a hyperfine tensor diagonal in the molecular frame, Φ_S is unchanged by n → −n (time reversal)
// and by π rotations about x, y, z, hence by each sign flip of n_x, n_y, n_z: one octant is computed
// exactly and mirrored. verify() checks both symmetries by direct computation.
const SURF = { nTheta: 48, nPhi: 96 };        // full-sphere grid intervals (octant: 24 × 24)

  const key = `${p.model}|${p.B}|${p.k}|${p.model === 'n5' ? '' : p.a}`;
  if (surfaceCache.has(key)) return surfaceCache.get(key);

  for (let i = 0; i <= hT; i++) {
    const row = new Float64Array(hP + 1);

      const th = Math.PI * i / SURF.nTheta, ph = 2 * Math.PI * j / SURF.nPhi;
      row[j] = yieldAt(p, [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)], ctx);
      if (i === 0) { row.fill(row[0]); break; }      // the pole is one direction
    }

    const io = i <= hT ? i : SURF.nTheta - i;
    let jo = j % (SURF.nPhi / 2); if (jo > hP) jo = SURF.nPhi / 2 - jo;

  const dirOf = q => { const i = Math.floor(q / (SURF.nPhi + 1)), j = q % (SURF.nPhi + 1); return { theta: 180 * i / SURF.nTheta, phi: 360 * j / SURF.nPhi }; };

  const out = { values, min: lo, max: hi, mean: mean / wsum, argMin: dirOf(iMin), argMax: dirOf(iMax), solves: (hT) * (hP + 1) + 1 };
  if (surfaceCache.size > 24) surfaceCache.clear();

}

/** Φ_S along the meridian at azimuth φ (θ = 0…180°), exact, for the compass-curve figure. */
function meridian(p, phiDeg, count = 61) {
  const ctx = setup(p), pts = [];
  for (let i = 0; i < count; i++) { const th = 180 * i / (count - 1); pts.push([th, yieldAt(p, direction(th, phiDeg), ctx)]); }
  return pts;
}

// ---------------------------------------------------------------- time evolution (with optional RF)
// 2×2 matrix exp(−iφ σ·m/2) built from core/spin's rotate() acting on |↑⟩ and |↓⟩ (columns)
function rotation2(m, phi) {

  return [a[0], a[1], b[0], b[1], a[2], a[3], b[2], b[3]];   // [u11r,u11i,u12r,u12i,u21r,u21i,u22r,u22i]

function applySpin(re, im, U, which, M) {          // apply U to electron `which` (0 or 1) of one state

    const ar = re[i0], ai = im[i0], br = re[i1], bi = im[i1];

/**
 * Propagator for the M pure states |S⟩|j⟩. dt in µs. Returns { t, step(), PS() , norms() }.
 * H₀ half steps use the exact e^{−iH₀δ/2} = V e^{−iEδ/2} V†; the RF half is exact for its frozen value.
 */
function createPropagator({ sys, eig, omega0, n, omega1, nu, dt }) {
  const N = sys.n, M = sys.M;
  const Ur = new Float64Array(N * N), Ui = new Float64Array(N * N);   // e^{−iH₀ dt/2}
  for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) {
    let sr = 0, si = 0;
    for (let m = 0; m < N; m++) {
      const c = Math.cos(eig.values[m] * dt / 2), s = -Math.sin(eig.values[m] * dt / 2);
      const vr = eig.vecRe[m][a], vi = eig.vecIm[m][a], wr = eig.vecRe[m][b], wi = -eig.vecIm[m][b];   // V_am e conj(V_bm)
      const xr = vr * c - vi * s, xi = vr * s + vi * c;
      sr += xr * wr - xi * wi; si += xr * wi + xi * wr;

    const r = new Float64Array(N), i = new Float64Array(N);
    r[idx(0, 1, j, M)] = Math.SQRT1_2; r[idx(1, 0, j, M)] = -Math.SQRT1_2;

  let m = [-n[0] * n[2], -n[1] * n[2], 1 - n[2] * n[2]];

    for (let a = 0; a < N; a++) { let sr = 0, si = 0; for (let b = 0; b < N; b++) { const ur = Ur[a * N + b], ui = Ui[a * N + b]; sr += ur * re[b] - ui * im[b]; si += ur * im[b] + ui * re[b]; } tr[a] = sr; ti[a] = si; }
    re.set(tr); im.set(ti);
  };
  const P = {
    t: 0, rfDir: m,
    step() {
      const tm = P.t + dt / 2, ang = omega1 ? omega1 * Math.cos(2 * Math.PI * nu * tm) * dt : 0;
      const U = ang ? rotation2(m, ang) : null;
      for (let j = 0; j < M; j++) {
        halfH0(psiRe[j], psiIm[j]);
        if (U) { applySpin(psiRe[j], psiIm[j], U, 0, M); applySpin(psiRe[j], psiIm[j], U, 1, M); }
        halfH0(psiRe[j], psiIm[j]);
      }
      P.t += dt;
    },
    PS() {
      let s = 0;
      for (let j = 0; j < M; j++) for (let q = 0; q < M; q++) {
        const r = (psiRe[j][idx(0, 1, q, M)] - psiRe[j][idx(1, 0, q, M)]) / Math.SQRT2, i = (psiIm[j][idx(0, 1, q, M)] - psiIm[j][idx(1, 0, q, M)]) / Math.SQRT2;
        s += r * r + i * i;
      }
      return s / M;
    },
    normDrift() { let d = 0; for (let j = 0; j < M; j++) { let s = 0; for (let a = 0; a < N; a++) s += psiRe[j][a] ** 2 + psiIm[j][a] ** 2; d = Math.max(d, Math.abs(s - 1)); } return d; },
  };

}

/** Step size: resolve the fastest singlet–triplet oscillation and the RF period. */
function chooseDt(spec, omega1, nu) {
  let wmax = 1e-6; for (const w of spec.om) wmax = Math.max(wmax, Math.abs(w));
  let dt = 0.3 / wmax;
  if (omega1) dt = Math.min(dt, 1 / (40 * nu));

// ---------------------------------------------------------------- the simulation
const END_SURVIVAL = 1e-4;
function createSim(params) {
  const p = { ...params };
  const { model, sys, A, omega0 } = setup(p), n = direction(p.theta, p.phi);
  const eig = eigHermitian(hamiltonian(sys, omega0, n, A)), spec = singletSpectrum(sys, eig);
  const PhiExact = yieldExact(spec, p.k);
  const omega1 = GAMMA_E * p.Brf * 1e-3, rf = omega1 > 0;
  let dt = chooseDt(spec, omega1, p.nu);
  const tEnd = Math.log(1 / END_SURVIVAL) / p.k;
  let nSteps = Math.ceil(tEnd / dt); if (nSteps % 2) nSteps++;   // even, for Simpson's rule
  dt = tEnd / nSteps;
  const prop = createPropagator({ sys, eig, omega0, n, omega1, nu: p.nu, dt });
  const surface = compassSurface(p);
  const series = new Float32Array(nSteps + 1);       // P_S at every step (for plots)
  series[0] = 1;
  let i = 0, simpson = 0, fPrev = p.k, fPrev2 = p.k, maxNorm = 0, maxDev = 0;
  // Simpson over completed pairs; the running display adds a trapezoid for an odd last interval
  let partial = 0;
  const sim = {
    params: p, model, sys, eig, spec, n, A, omega0, omega1, rf, dt, tEnd, nSteps, surface, PhiExact, series,
    rfDir: prop.rfDir,
    get t() { return prop.t; },
    get steps() { return i; },
    get done() { return i >= nSteps; },
    step() {
      if (i >= nSteps) return;
      prop.step(); i++;
      const ps = prop.PS(), f = p.k * ps * Math.exp(-p.k * i * dt);
      series[i] = ps;
      if (i % 2 === 0) { simpson += dt / 3 * (fPrev2 + 4 * fPrev + f); partial = 0; fPrev2 = f; } else { partial = dt / 2 * (fPrev + f); }
      fPrev = f;
      if (i % 64 === 0 || i === nSteps) {
        maxNorm = Math.max(maxNorm, prop.normDrift());
        if (!rf) maxDev = Math.max(maxDev, Math.abs(ps - singletProb(spec, i * dt)));
      }
    },
    PS: () => series[i],
    PSexact: t => singletProb(spec, t),
    yieldSoFar: () => simpson + partial,
    yieldExactUntil: t => yieldUntil(spec, p.k, t),
    survival: () => Math.exp(-p.k * prop.t),
    rfField: t => (rf ? p.Brf * Math.cos(2 * Math.PI * p.nu * t) : 0),
    diagnostics() {
      const yS = sim.yieldSoFar(), yE = yieldUntil(spec, p.k, prop.t);
      const d = [
        { key: 'norm', label: 'Unitarity: max |‖ψ‖² − 1|', value: Math.max(maxNorm, 1e-17), kind: 'error', good: 1e-8, warn: 1e-6 },
      ];
      if (!rf) d.push({ key: 'dev', label: 'Propagated P_S(t) vs exact eigen solution', value: Math.max(maxDev, 1e-17), kind: 'error', good: 1e-9, warn: 1e-6 });
      d.push(
        { key: 'phiE', label: 'Φ_S, static field, this direction (exact)', value: PhiExact, kind: 'value', text: PhiExact.toFixed(6) },
        { key: 'phiT', label: rf ? 'Φ_S so far, with RF (propagated)' : 'Φ_S so far (propagated)', value: yS, kind: 'value', text: yS.toFixed(6) },
        { key: 'dPhi', label: rf ? 'RF effect on Φ_S so far' : 'RF effect on Φ_S (RF off)', value: rf ? yS - yE : 0, kind: 'value', text: rf ? `${(yS - yE) >= 0 ? '+' : '−'}${Math.abs(yS - yE).toExponential(2)}` : '0 (RF off)' },
        { key: 'aniso', label: 'Compass contrast Φ_max − Φ_min (all directions)', value: surface.max - surface.min, kind: 'value', text: (surface.max - surface.min).toExponential(3) },
        { key: 'rel', label: 'Contrast relative to mean Φ_S', value: (surface.max - surface.min) / surface.mean, kind: 'value', text: `${(100 * (surface.max - surface.min) / surface.mean).toFixed(3)} %` },
        { key: 'zee', label: 'Electron Larmor frequency ω₀/2π', value: omega0 / (2 * Math.PI), kind: 'value', unit: 'MHz', text: `${(omega0 / (2 * Math.PI)).toFixed(3)} MHz` },
        { key: 'surv', label: 'Pairs not yet recombined e^{−kt}', value: sim.survival(), kind: 'value', text: sim.survival().toExponential(2) },
        { key: 'dt', label: 'Time step δ (steps to the end)', value: dt, kind: 'value', text: `${(dt * 1e3).toFixed(3)} ns (${nSteps})` },
      );
      return d;
    },
    state() {
      return { t: prop.t, PS: series[i], yieldSoFar: sim.yieldSoFar(), PhiExact, contrast: surface.max - surface.min, normDrift: maxNorm, steps: i };
    },
    record() {
      const rows = [], every = Math.max(1, Math.floor(i / 4000));
      for (let q = 0; q <= i; q += every) rows.push([+(q * dt).toFixed(6), series[q], singletProb(spec, q * dt)]);
      return { header: ['t_us', 'P_S_propagated', 'P_S_exact_static'], rows };
    },
  };
  return sim;
}

// ---------------------------------------------------------------- verification
// Independent density-matrix propagation (core/linalg expm on the real embedding of −iHδ).
function densityMatrixRun(sys, H, k, dt, nSteps) {
  const N = sys.n, E = [];

    { points: [0, -L, 0, 0, L, 0], color: '#5fbf6a', opacity: 0.9 },
    { points: [0, 0, -L, 0, 0, L], color: '#5b8def', opacity: 0.9 },
    { points: [...n.map(v => -1.35 * v), 0, 0, 0], color: ink, opacity: 0.55 },   // −B₀: same yield (reversal symmetry)
  ];
  if (showRing) for (const r of ringLines) lines.push({ points: r, color: dark ? '#d9c38a' : '#8a6d1f', opacity: 0.85 });
  // meridian through the current φ where the compass curve below is evaluated
  const ph = sim.params.phi * Math.PI / 180, mer = [];
  for (let i = 0; i <= 90; i++) { const th = Math.PI * i / 90, nn = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)]; mer.push(...nn.map(v => v * 1.02)); }
  lines.push({ points: mer, color: ink, opacity: 0.35 });
  gpu.surf.draw(cam, { aspect, opacity: translucent ? 0.55 : 1, ambient: dark ? 0.3 : 0.45 });
  gpu.lines.update(lines);
  gpu.lines.draw(cam, { aspect, width: 1.6 });
  // B₀ arrow, from the origin through the surface; RF field arrow (instantaneous, symbolic length)
  const items = [{ mesh: gpu.arrow, matrix: transform({ rotate: alignZ(n), scale: [1, 1, 1.6] }), color: dark ? '#ffb347' : '#c25e00' }];
  if (sim.rf) {
    const b = Math.cos(2 * Math.PI * sim.params.nu * sim.t);
    if (Math.abs(b) > 0.02) items.push({ mesh: gpu.arrow, matrix: transform({ rotate: alignZ(sim.rfDir.map(v => v * Math.sign(b))), scale: [0.8, 0.8, 0.9 * Math.abs(b)] }), color: dark ? '#ff6fb5' : '#b0306f' });
  }
  gpu.mesh.draw(cam, items, { aspect, light: { direction: [0.5, -0.4, 1] }, ambient: 0.45 });
  const r = radiusOf(sim.PhiExact, s);
  gpu.dots.draw(cam, [{ center: n.map(v => v * r), radius: 0.045, color: dark ? '#ffffff' : '#111111', emissive: dark }], { light: { direction: [0.5, -0.4, 1] }, ambient: 0.6 });
}

// ------------------------------------------------------------------ 2D overlay: labels, colour bar, live P_S trace
function draw(ctx, sim, view) {
  const { W, H } = view, C = view.color, s = sim.surface, n = sim.n;
  const lab = (p, text, color, dx = 6, dy = 0) => { const q = cam.project(p, W, H); if (!q.visible) return; ctx.fillStyle = color; ctx.fillText(text, q.x + dx, q.y + dy); };
  ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
  lab([1.6, 0, 0], 'x', '#e0605a'); lab([0, 1.6, 0], 'y', '#5fbf6a'); lab([0, 0, -1.6], '−z (ring normal)', '#5b8def');
  if (showRing) { ctx.font = '11px ui-sans-serif, system-ui'; lab([0, 0, 0], 'N5', C('--ink-2'), 6, 12); lab([0, -2 * HEX, 0], 'N10', C('--muted'), 6, 12); }
  ctx.font = '600 12px ui-sans-serif, system-ui';
  lab(n.map(v => 1.68 * v), `B₀ = ${sim.params.B} µT`, view.theme === 'dark' ? '#ffb347' : '#c25e00');
  ctx.font = '11px ui-sans-serif, system-ui';
  lab(n.map(v => -1.4 * v), '−B₀ (same Φ_S)', C('--muted'));
  if (sim.rf) lab(sim.rfDir.map(v => 0.95 * v), `B₁ (RF, ${sim.params.Brf} nT, length not to scale)`, view.theme === 'dark' ? '#ff6fb5' : '#b0306f');
  const span = s.max - s.min, flat = !(span > 1e-9 * s.max);
  // colour bar
  const narrow = W < 560, bx = W - (narrow ? 62 : 78), by = narrow ? H * 0.36 : 170, bh = Math.min(140, H * 0.28);
  drawColorBar(ctx, { x: bx, y: by, width: 11, height: bh, colormap: 'viridis', range: flat ? [s.min - 1e-4, s.max + 1e-4] : [s.min, s.max], label: 'Φ_S', ticks: 4, format: v => v.toFixed(flat ? 4 : 3) });
  if (narrow) return;                                 // phones: legend and figures below carry the captions
  // live singlet probability: last 0.25 µs of the computed P_S(t)
  const gw = Math.min(W * (narrow ? 0.55 : 0.3), 300), gh = narrow ? 52 : 64, gx = W - gw - 14, gy = H - gh - (narrow ? 64 : 70);
  ctx.strokeStyle = C('--line'); ctx.lineWidth = 1; ctx.strokeRect(gx + 0.5, gy + 0.5, gw, gh);
  const win = 0.25, i1 = sim.steps, i0 = Math.max(0, i1 - Math.round(win / sim.dt));
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) { const x = gx + gw * (1 - (i1 - i) * sim.dt / win), y = gy + gh * (1 - sim.series[i]); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.strokeStyle = C('--body-0'); ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = C('--muted'); ctx.font = '10.5px ui-monospace, Menlo, monospace';
  ctx.fillText(`P_S(t), last ${win * 1000} ns · now ${sim.series[i1].toFixed(3)}`, gx, gy - 5);
  ctx.fillText('1', gx - 10, gy + 8); ctx.fillText('0', gx - 10, gy + gh);
  // caption
  ctx.fillStyle = C('--muted'); ctx.font = '11px ui-sans-serif, system-ui';
  const cap = flat ? `Φ_S = ${s.mean.toFixed(5)} in every direction: no compass (isotropic or zero field)` : radiusMode === 'true' ? `surface radius ∝ Φ_S (range ${s.min.toFixed(3)}–${s.max.toFixed(3)})` : `surface radius: ${R0} + ${(1 - R0).toFixed(2)}·(Φ_S − Φ_min)/(Φ_max − Φ_min) (contrast stretched)`;
  ctx.fillText(cap, 14, H - (narrow ? 70 : 56));
  ctx.fillText(`white dot: Φ_S = ${sim.PhiExact.toFixed(5)} for this field direction${fieldDrag ? ' · Shift-drag on the surface moves B₀' : ''}`, 14, H - (narrow ? 54 : 40));
}

// ------------------------------------------------------------------ field direction by dragging on the surface
function pickDirection(e, canvas, view) {
  const rect = canvas.getBoundingClientRect(), x = (e.clientX - rect.left) / rect.width * 2 - 1, y = 1 - (e.clientY - rect.top) / rect.height * 2;
  const inv = invert(cam.matrices(view.W / view.H).viewProj);
  const un = (a, b, c, d) => { const w = inv[3] * a + inv[7] * b + inv[11] * c + inv[15] * d; return [0, 1, 2].map(k => (inv[k] * a + inv[k + 4] * b + inv[k + 8] * c + inv[k + 12] * d) / w); };
  const p0 = un(x, y, -1, 1), p1 = un(x, y, 1, 1), d = p1.map((v, k) => v - p0[k]), dl = Math.hypot(...d), u = d.map(v => v / dl);
  // intersect the unit sphere (direction only matters); fall back to the closest point of the ray
  const b = p0[0] * u[0] + p0[1] * u[1] + p0[2] * u[2], c = p0[0] ** 2 + p0[1] ** 2 + p0[2] ** 2 - 1, disc = b * b - c;
  const tHit = disc >= 0 ? -b - Math.sqrt(disc) : -b, q = p0.map((v, k) => v + tHit * u[k]), ql = Math.hypot(...q);
  const nn = q.map(v => v / ql);
  return { theta: Math.round(Math.acos(Math.max(-1, Math.min(1, nn[2]))) * 180 / Math.PI), phi: Math.round(((Math.atan2(nn[1], nn[0]) * 180 / Math.PI) + 360) % 360) };
}

// ------------------------------------------------------------------ workbench: equations and figures
function bench({ eqs, figs, createPlot, createEquation, createDerivation, M, setParam, setParams, getSim }) {
  const fig = (plot, caption) => { const w = document.createElement('div'); const c = document.createElement('p'); c.className = 'psim-caption'; c.textContent = caption; c.style.cssText = 'margin:6px 2px 0;font-size:12px;color:var(--muted)'; w.append(plot.el, c); figs.append(w); return c; };
  const ps = createPlot({ title: 'Singlet probability P_S(t) of the surviving pairs', height: 230, x: { label: 'time since pair formation t', unit: 'µs', min: 0, max: 10 }, y: { label: 'P_S', min: 0, max: 1 } });
  const capPS = fig(ps, '');
  const yp = createPlot({ title: 'Singlet yield accumulated: k∫₀ᵗ P_S e^{−kt′} dt′', height: 230, x: { label: 't', unit: 'µs', min: 0, max: 10 }, y: { label: 'Φ_S(t)', min: 0, max: 1 } });
  const capY = fig(yp, 'Solid: propagated (with RF if B₁ > 0). Dashed: exact static-field yield from the eigen-decomposition. Horizontal line: Φ_S(∞).');
  const cp = createPlot({ title: 'Compass curve: Φ_S along the meridian at the current φ', height: 230, x: { label: 'field angle θ from the ring normal', unit: '°', min: 0, max: 180 }, y: { label: 'Φ_S' }, onCursor: th => setParam('theta', Math.round(Math.max(0, Math.min(180, th)))) });
  fig(cp, 'Static field, exact (61 eigen-decompositions). Drag the cursor to move B₀. The curve is symmetric about 90° because Φ_S(𝐁) = Φ_S(−𝐁).');
  const bp = createPlot({ title: 'Field strength: Φ_S vs |B₀| for B₀ along z and in the ring plane', height: 230, x: { label: '|B₀|', unit: 'µT', min: 0, max: 500 }, y: { label: 'Φ_S' }, onCursor: B => setParam('B', Math.round(Math.max(0, Math.min(500, B)))) });
  fig(bp, 'Static field, exact. The compass needs only the difference between the two curves at the Earth’s field (25–65 µT band); at 0 µT both meet the zero-field value.');

  const cur = { sim: null };
  const S = M.i('Ŝ'), I = M.i('Î');
  const ham = createEquation({
    title: 'Spin Hamiltonian (angular frequency, in the molecular frame)',
    lhs: { mathml: M.i('Ĥ'), label: 'radical pair', unit: '' },
    terms: [
      { id: 'zee', mathml: `${M.sub(M.i('ω'), M.n(0))}<mi>𝐧</mi><mo>·</mo>${M.paren(`${M.sub(S, M.n(1))}<mo>+</mo>${M.sub(S, M.n(2))}`)}`, label: 'Zeeman, both electrons (ω₀/2π)', color: '--warn', unit: 'MHz', value: () => cur.sim.omega0 / (2 * Math.PI) },
      { id: 'hf', mathml: `${M.sub(S, M.n(1))}<mo>·</mo><mi>𝐀</mi><mo>·</mo>${I}`, label: 'hyperfine, A_zz/2π (its anisotropy makes the compass)', color: '--body-0', unit: 'MHz', value: () => cur.sim.A[2] / (2 * Math.PI) },
      { id: 'rf', mathml: `${M.sub(M.i('ω'), M.n(1))}<mi>cos</mi><mo>(</mo><mn>2</mn><mi>π</mi><mi>ν</mi><mi>t</mi><mo>)</mo><mi>𝐦</mi><mo>·</mo>${M.paren(`${M.sub(S, M.n(1))}<mo>+</mo>${M.sub(S, M.n(2))}`)}`, label: 'RF field, ω₁/2π (𝐦 ⟂ 𝐧)', color: '--body-2', unit: 'kHz', value: () => cur.sim.omega1 / (2 * Math.PI) * 1e3 },
    ],
    where: [
      { mathml: `${M.sub(M.i('ω'), M.n(0))}<mo>=</mo>${M.sub(M.i('g'), M.i('e'))}${M.sub(M.i('μ'), M.i('B'))}${M.sub(M.i('B'), M.n(0))}<mo>/</mo><mi>ħ</mi>`, meaning: 'electron Larmor frequency per µT (CODATA 2018), /2π', value: () => GAMMA_E / (2 * Math.PI) * 1e3, unit: 'kHz/µT' },
      { mathml: '<mi>𝐀</mi>', meaning: 'principal values (x, y, z) of the selected model: FAD N5 = DFT, Hiscock et al. 2016; toy = illustrative', value: () => cur.sim.A.map(v => +(v / (GAMMA_E * 1e3)).toFixed(4)).join(', '), unit: 'mT' },
    ],
    link: [ps],
  });
  const yld = createEquation({
    title: 'Singlet yield (exponential model, k_S = k_T = k): exact from the eigenstates |m⟩ of Ĥ',
    lhs: { mathml: M.sub(M.i('Φ'), M.i('S')), label: 'this direction', value: () => cur.sim.PhiExact, digits: 6 },
    terms: [{ id: 'y', mathml: `${M.frac(M.n(1), M.i('M'))}<munder><mo>∑</mo><mrow><mi>m</mi><mi>n</mi></mrow></munder><msup><mrow><mo>|</mo><mo>⟨</mo><mi>m</mi><mo>|</mo>${M.sub(M.i('P̂'), M.i('S'))}<mo>|</mo><mi>n</mi><mo>⟩</mo><mo>|</mo></mrow><mn>2</mn></msup>${M.frac(M.sup(M.i('k'), M.n(2)), `${M.sup(M.i('k'), M.n(2))}<mo>+</mo>${M.sup(M.sub(M.i('ω'), M.i('mn')), M.n(2))}`)}`, label: 'M = 2I+1 nuclear states; ω_mn = E_m − E_n', color: '--body-0', value: () => cur.sim.PhiExact, digits: 6 }],
    where: [{ mathml: M.i('k'), meaning: 'recombination rate = 1/lifetime', value: () => cur.sim.params.k, unit: 'µs⁻¹' }],
    link: [yp],
  });
  const der = createDerivation([
    { mathml: `${M.sub(M.i('P'), M.i('S'))}<mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo>${M.frac(M.n(1), M.n(4))}<mo>+</mo>${M.frac(M.n(1), `<mn>2</mn>${M.i('M')}`)}<munder><mo>∑</mo><mi>a</mi></munder><mi>Tr</mi><mo>[</mo>${M.sub(M.i('Ŝ'), M.i('1a'))}${M.sub(M.i('Ŝ'), M.i('1a'))}<mo>(</mo><mi>t</mi><mo>)</mo><mo>]</mo>`, note: 'Only radical 1 has a nucleus. With P̂_S = ¼ − Ŝ₁·Ŝ₂ and Ŝ₂|S⟩ = −Ŝ₁|S⟩, the singlet probability reduces to an autocorrelation of electron 1 alone.' },
    { mathml: `<mi>Ĥ</mi><mo>=</mo><mi>a</mi>${M.sub(M.i('Ŝ'), M.n(1))}<mo>·</mo><mi>Î</mi><mo>,</mo><mspace width="0.5em"/><mi>I</mi><mo>=</mo><mn>½</mn><mo>:</mo><mspace width="0.5em"/><mi>F</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>0</mn><mtext>&#160;split by&#160;</mtext><mi>a</mi>`, note: 'At zero field the coupled electron–nucleus states have total spin F = 1 or 0. Half of Σ_a Tr[Ŝ₁ₐ²] = 3 lies inside F = 1 (static), half connects F = 1 ↔ 0 (oscillates at a).' },
    { mathml: `${M.sub(M.i('P'), M.i('S'))}<mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo>${M.frac(M.n(5), M.n(8))}<mo>+</mo>${M.frac(M.n(3), M.n(8))}<mi>cos</mi><mo>(</mo><mi>a</mi><mi>t</mi><mo>)</mo><mo>,</mo><mspace width="0.6em"/>${M.sub(M.i('Φ'), M.i('S'))}<mo>=</mo>${M.frac(M.n(5), M.n(8))}<mo>+</mo>${M.frac(M.n(3), M.n(8))}${M.frac(M.sup(M.i('k'), M.n(2)), `${M.sup(M.i('k'), M.n(2))}<mo>+</mo>${M.sup(M.i('a'), M.n(2))}`)}`, note: 'The zero-field benchmark (Timmel et al. 1998): reproduced to 2×10⁻¹⁶ (Verification). Try the preset "Zero-field benchmark".' },
  ], { title: 'Closed form used as a benchmark: zero field, one isotropic I = ½ nucleus' });
  eqs.append(ham.el, yld.el, der);

  let key = null, bins = null, lastStep = -1;
  const NB = 700;
  return {
    update(sim, t, { rebuilt } = {}) {
      cur.sim = sim;
      ham.update(); yld.update();
      if (rebuilt || sim !== key) {
        key = sim; bins = { lo: new Float64Array(NB).fill(Infinity), hi: new Float64Array(NB).fill(-Infinity) }; lastStep = -1;
        const T = sim.tEnd, sp = sim.spec;
        ps.setX({ min: 0, max: T }); yp.setX({ min: 0, max: T });
        ps.fn('surv', x => Math.exp(-sim.params.k * x), { color: '--muted', dot: true, label: 'e^{−kt}: pairs surviving' });
        if (sim.rf) ps.fn('exact', x => sim.PSexact(x), { color: '--muted', dash: true, label: 'static field, exact', width: 1 }); else ps.remove('exact');
        yp.fn('exact', x => sim.yieldExactUntil(x), { color: '--muted', dash: true, label: 'static field, exact' });
        yp.hline('inf', sim.PhiExact, { label: `Φ_S(∞) = ${sim.PhiExact.toFixed(5)}` });
        yp.setY({ min: 0, max: 1 });
        capPS.textContent = `Computed P_S(t) (min–max band per pixel: it oscillates at up to ${(Math.max(...sp.om.map(Math.abs)) / (2 * Math.PI)).toFixed(0)} MHz). ${sim.rf ? 'With RF (solid) vs static field (dashed).' : 'RF off: the propagation reproduces the exact eigen solution.'} Run ends at e^{−kt} = 10⁻⁴.`;
        // compass curve and field-strength curve: exact, recomputed on rebuild
        const p = sim.params, mer = meridian(p, p.phi);
        cp.data('mer', mer, { color: '--body-0', label: `Φ_S(θ), φ = ${p.phi}°` });
        const lo = Math.min(...mer.map(q => q[1])), hi = Math.max(...mer.map(q => q[1])), pad = Math.max(1e-4, 0.08 * (hi - lo));
        cp.setY({ auto: false, min: lo - pad, max: hi + pad });
        cp.hline('mean', sim.surface.mean, { label: 'mean over all directions', color: '--muted' });
        cp.hline('max', sim.surface.max, { color: '--faint' }); cp.hline('min', sim.surface.min, { color: '--faint' });
        cp.marker('now', p.theta, sim.PhiExact, { color: '--warn' });
        cp.cursor(p.theta);
        const Bs = [], z = [], x = [];
        for (let i = 0; i <= 60; i++) Bs.push(500 * (i / 60) ** 1.6);
        for (const B of Bs) { z.push([B, yieldAt({ ...p, B }, [0, 0, 1])]); x.push([B, yieldAt({ ...p, B }, [1, 0, 0])]); }
        bp.data('z', z, { color: '--body-1', label: 'B₀ ∥ z (ring normal)' });
        bp.data('x', x, { color: '--body-3', label: 'B₀ ∥ x (in plane)' });
        const all = [...z, ...x].map(q => q[1]), l2 = Math.min(...all), h2 = Math.max(...all), p2 = Math.max(1e-4, 0.08 * (h2 - l2));
        bp.setY({ auto: false, min: l2 - p2, max: h2 + p2 });
        bp.band('earth', 25, 65, { label: 'Earth' });
        bp.cursor(p.B);
      }
      // fold new samples into per-pixel min/max bins
      const i1 = sim.steps;
      for (let i = lastStep + 1; i <= i1; i++) { const b = Math.min(NB - 1, Math.floor(i * sim.dt / sim.tEnd * NB)); const v = sim.series[i]; if (v < bins.lo[b]) bins.lo[b] = v; if (v > bins.hi[b]) bins.hi[b] = v; }
      lastStep = i1;
      const band = [];
      for (let b = 0; b < NB; b++) { if (bins.lo[b] === Infinity) break; const x0 = (b + 0.5) / NB * sim.tEnd; band.push([x0, bins.lo[b]], [x0, bins.hi[b]]); }
      ps.data('ps', band, { color: '--body-0', label: sim.rf ? 'computed, with RF' : 'computed', width: 1 });
      // accumulated yield curve: sampled from the propagated series by trapezoid (display) up to now
      const yc = [[0, 0]], every = Math.max(1, Math.floor(i1 / 400)); let acc = 0, prev = sim.params.k;
      for (let i = 1; i <= i1; i++) { const f = sim.params.k * sim.series[i] * Math.exp(-sim.params.k * i * sim.dt); acc += sim.dt / 2 * (prev + f); prev = f; if (i % every === 0 || i === i1) yc.push([i * sim.dt, acc]); }
      yp.data('y', yc, { color: '--body-0', label: sim.rf ? 'propagated, with RF' : 'propagated', width: 2 });
      ps.invalidate(); yp.invalidate(); cp.invalidate(); bp.invalidate();
      ps.draw(); yp.draw(); cp.draw(); bp.draw();
    },
  };
}

// ------------------------------------------------------------------ GPU self-test: the surface colour at the current direction
window.psim.selfTest = async () => {
  await new Promise(r => setTimeout(r, 400));
  const sim = window.psim.getSim(), gl = document.querySelector('canvas.psim-gl').getContext('webgl2');
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, dpr = W / gl.canvas.clientWidth;
  const test = orbitCamera({ distance: 4, yaw: 0, pitch: 0 }), mesh = createColorMesh(gl), g = surfaceGeometry(sim.surface);
  mesh.update(g.pos, g.nrm, g.col, g.idx);
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  mesh.draw(test, { aspect: W / H, ambient: 1 });
  // camera on +x: the screen centre sees the surface point along +x (θ = 90°, φ = 0)
  const b = new Uint8Array(4); gl.readPixels(Math.round(W / 2), Math.round(H / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
  const s = sim.surface, v = yieldAt(sim.params, [1, 0, 0]), want = colormap('viridis', s.max - s.min > 1e-9 ? (v - s.min) / (s.max - s.min) : 0.5).map(c => Math.round(255 * c));
  const dev = Math.max(...[0, 1, 2].map(i => Math.abs(b[i] - want[i])));
  return [{ label: 'GPU surface pixel along +x has the colour of the exact Φ_S(+x)', got: [...b].slice(0, 3), want, dev, pass: dev <= 4 && b[3] === 255 }];
};
