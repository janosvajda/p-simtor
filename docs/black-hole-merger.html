<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

// ---------------------------------------------------------------- spheres

// ---------------------------------------------------------------- solid objects (meshes)

/**

    box(sx = 1, sy = 1, sz = 1) {

// ------------------------------------------------------------------ remnant (NR fits, imported)
function remnantFit(nu) {

  const Erad = (1 - Eisco) * nu + 4 * nu * nu * (4 * p0 + Eisco - 1);
  return { chi, Erad, Mf: 1 - Erad };

// ------------------------------------------------------------------ ringdown: Kerr QNM (Leaver)
// Minimal complex arithmetic on [re, im] pairs (no complex type in core/).
const cx = (re, im = 0) => [re, im];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const div = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const sc = (s, a) => [s * a[0], s * a[1]];
const I = [0, 1];
const cabs = a => Math.hypot(a[0], a[1]);

/** β₀ − α₀γ₁/(β₁ − α₁γ₂/(β₂ − …)) evaluated bottom-up from depth N. */
function continuedFraction(alpha, beta, gamma, N) {
  let tail = beta(N);
  for (let n = N - 1; n >= 0; n--) tail = sub(beta(n), div(mul(alpha(n), gamma(n + 1)), tail));
  return tail;
}

/** Complex secant iteration for f(z) = 0. */
function secant(f, z0, z1, tol = 1e-13, maxIter = 80) {
  let f0 = f(z0), f1 = f(z1);
  for (let i = 0; i < maxIter; i++) {
    const dz = sub(z1, z0), df = sub(f1, f0);
    if (cabs(df) === 0) break;
    const z2 = sub(z1, mul(f1, div(dz, df)));
    z0 = z1; f0 = f1; z1 = z2; f1 = f(z1);
    if (cabs(sub(z1, z0)) < tol * Math.max(1, cabs(z1))) return { z: z1, iter: i + 1, residual: cabs(f1) };
  }
  throw new Error('QNM secant iteration did not converge');
}

// Leaver (1985) in units 2M = 1, spin weight s = −2 (outgoing radiation), time dependence e^{−iωt}.
function angularResidual(a, w, A, l, m, s, N) {
  const k1 = Math.abs(m - s) / 2, k2 = Math.abs(m + s) / 2;
  const aw = sc(a, w);
  const alpha = n => cx(-2 * (n + 1) * (n + 2 * k1 + 1));
  const beta = n => {
    const t1 = add(cx(n * (n - 1)), sc(2 * n, sub(cx(k1 + k2 + 1), sc(2, aw))));
    const t2 = sub(sc(2 * k1 + s + 1, sc(2, aw)), cx((k1 + k2) * (k1 + k2 + 1)));
    const t3 = add(add(mul(aw, aw), cx(s * (s + 1))), A);
    return sub(sub(t1, t2), t3);
  };
  const gamma = n => sc(2 * (n + k1 + k2 + s), aw);
  return continuedFraction(alpha, beta, gamma, N);
}

function radialResidual(a, w, A, m, s, N) {
  const b = Math.sqrt(1 - 4 * a * a);
  const q = sub(sc(0.5, w), cx(a * m));            // ω/2 − a m
  const iw = mul(I, w), w2 = mul(w, w);
  const c0 = sub(sub(cx(1 - s), iw), mul(sc(2 / b, I), q));
  const c1 = add(add(cx(-4), sc(2 * (2 + b), iw)), mul(sc(4 / b, I), q));
  const c2 = sub(sub(cx(s + 3), sc(3, iw)), mul(sc(2 / b, I), q));
  const fw = sc(1 / b, add(sc(4, w), cx(0, 2)));   // (4ω + 2i)/b
  const c3 = add(sub(add(sub(sub(sc(4 + 2 * b - a * a, w2), sc(2 * a * m, w)), cx(s + 1)), sc(2 + b, iw)), A), mul(fw, q));
  const c4 = sub(sub(sub(cx(s + 1), sc(2, w2)), sc(2 * s + 3, iw)), mul(fw, q));
  const alpha = n => add(add(cx(n * n), sc(n, add(c0, cx(1)))), c0);
  const beta = n => add(add(cx(-2 * n * n), sc(n, add(c1, cx(2)))), c3);
  const gamma = n => add(add(cx(n * n), sc(n, sub(c2, cx(3)))), add(sub(c4, c2), cx(2)));
  return continuedFraction(alpha, beta, gamma, N);
}

/** Berti, Cardoso & Will, PRD 73, 064030 (2006), Table VIII fit for l = m = 2, n = 0 (used as a start value and cross-check). */
function qnmFit(chi) {
  const Mw = 1.5251 - 1.1568 * (1 - chi) ** 0.1292;
  const Q = 0.7 + 1.4187 * (1 - chi) ** -0.4990;
  return [Mw, -Mw / (2 * Q)];
}

/** l = m = 2, n = 0 gravitational QNM of a Kerr hole with spin χ: returns Mω (complex, e^{−iωt}). */
function kerrQNM(chi, { l = 2, m = 2, N = 400 } = {}) {
  const s = -2, a = chi / 2;                       // 2M = 1 units: a = χ M = χ/2
  const g = qnmFit(chi), w0 = sc(2, g);           // ω in 2M = 1 units = 2 Mω
  let Aguess = cx(l * (l + 1) - s * (s + 1));
  const solveA = w => {
    const r = secant(A => angularResidual(a, w, A, l, m, s, N), Aguess, add(Aguess, cx(0.01, 0.01)));
    Aguess = r.z;
    return r.z;
  };
  const res = secant(w => radialResidual(a, w, solveA(w), m, s, N), w0, add(w0, cx(1e-3, -1e-3)));
  return { Mw: sc(0.5, res.z), A: Aguess, residual: res.residual };

    params: p, S, hist,
    get t() { return y[1] * S.Ms + tPost; },
    get ended() { return ended; },
    get tEnd() { return ended ? y[1] * S.Ms : null; },
    get x() { return y[0]; },

    sep: x => 1 / x,
    pnTerms: x => t4Terms(x, S.nu, S.order),
    diagnostics() {
      const x = y[0];
      return [
        { key: 'err', label: 'step-halving |Δx|/x', value: Math.max(errEst, 1e-17), kind: 'error', good: 1e-8, warn: 1e-5 },
        { key: 'f', label: 'GW frequency', value: fGW(x), unit: 'Hz' },
        { key: 'r', label: 'separation (r = M/x)', value: 1 / x * S.M * LSUN / 1e3, unit: 'km' },
        { key: 'v', label: 'orbital speed v/c ≈ √x', value: Math.sqrt(x) },

  // 5. Kerr QNM vs the independent Berti–Cardoso–Will fit (accurate to a few %) and continued-fraction depth.

  const qa = kerrQNM(0.6865, { N: 60 }).Mw, qb = kerrQNM(0.6865, { N: 600 }).Mw;

    let y = cy + 6 * scale * Math.max(q1, q2) + 34;
    ctx.textAlign = 'center';
    ctx.font = `${narrow ? 12 : 13}px ui-sans-serif, system-ui`; ctx.fillStyle = C('--warn');
    for (const l of lines) { ctx.fillText(l, cx, y); y += 17; }
    ctx.fillStyle = C('--muted'); ctx.font = '11px ui-monospace, Menlo, monospace';
    for (const l of note) { ctx.fillText(l, cx, y); y += 15; }
    ctx.textAlign = 'start';
  }

  // scale bar (km)
  const bar = nice(rView * kmPerM * 0.35);
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1; ctx.fillStyle = C('--muted'); ctx.font = '11px ui-monospace, Menlo, monospace';
  const bx = 16, by = H - 28, bw = bar / kmPerM * scale;
  ctx.beginPath(); ctx.moveTo(bx, by - 6); ctx.lineTo(bx, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by - 6); ctx.stroke();
  ctx.fillText(fmtKm(bar), bx, by + 15);
}

// ------------------------------------------------------------------ workbench: phases, equations, figures
function card(title, status, color, body) {
  const d = document.createElement('div');
  d.style.cssText = `flex:1 1 180px;min-width:0;border:1px solid var(--line);border-left:3px solid var(${color});border-radius:8px;padding:8px 10px;background:var(--panel)`;
  d.innerHTML = `<div style="font-size:12.5px;font-weight:600;color:var(--ink)">${title}</div><div style="font-size:11px;color:var(${color});margin:2px 0 4px">${status}</div><div class="v" style="font:11.5px/1.45 var(--mono);color:var(--ink-2)"></div>`;
  d.querySelector('.v').textContent = body;
  return d;
}

function bench({ eqs, figs, createPlot, createEquation, M }) {
  const phases = document.createElement('div');
  phases.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px';
  eqs.append(phases);

  const fplot = createPlot({ title: 'GW frequency vs time', height: 240, x: { label: 'time', unit: 's', min: 0, max: 1 }, y: { label: 'f_GW', unit: 'Hz', log: true, min: 10, max: 1000 } });
  const hplot = createPlot({ title: 'Strain at the detector (computed inspiral, latest cycles)', height: 240, x: { label: 'time', unit: 's', min: 0, max: 1 }, y: { label: 'strain (10⁻²¹)', min: -1, max: 1 } });
  const rplot = createPlot({ title: 'Ringdown of the remnant: l = m = 2 mode shape', height: 240, x: { label: 'time since ringdown onset (onset not computed)', unit: 'ms', min: 0, max: 1 }, y: { label: 'h / h₀ (amplitude not computed)', min: -1.1, max: 1.1 } });
  const bplot = createPlot({ title: 'PN terms of the flux factor B(x)', height: 240, x: { label: 'x = (Mω)^{2/3} ≈ v²/c²', min: 0, max: X_END }, y: { label: 'term value' } });
  figs.append(fplot.el, hplot.el, rplot.el, bplot.el);

  const cur = { sim: null, x: 0.1 };
  const terms = () => cur.sim.pnTerms(cur.x);
  const xi = M.i('x');
  const pnTerm = (k, sup) => ({
    id: PN_IDS[k], sign: '+', color: PN_COL[PN_IDS[k]], label: PN_NAME[PN_IDS[k]], digits: 3, value: () => terms()[k],
    mathml: `${M.sub(M.i('b'), M.n(k))}${sup ? M.sup(xi, M.n(sup)) : xi}`,
  });
  const flux = createEquation({
    title: 'Inspiral (computed): energy balance dx/dt = (64/5) ν x⁵/M · B(x), terms at the current x',
    lhs: { mathml: `${M.i('B')}${M.paren(xi)}`, label: 'flux factor', digits: 5, value: () => terms().reduce((a, b) => a + b, 0) },
    terms: [
      { id: 'n0', mathml: M.n(1), label: PN_NAME.n0, color: PN_COL.n0, value: () => terms()[0] },
      pnTerm(2), pnTerm(3, '3/2'), pnTerm(4, '2'), pnTerm(5, '5/2'), pnTerm(6, '3'), pnTerm(7, '7/2'),
    ],
    where: [
      { mathml: xi, meaning: 'PN parameter (Mω_orb)^{2/3}, ≈ (v/c)²', value: () => cur.x, digits: 4 },
      { mathml: M.i('ν'), meaning: 'symmetric mass ratio m₁m₂/M²', value: () => cur.sim.S.nu, digits: 4 },
      { mathml: `${M.i('d')}${xi}<mo>/</mo>${M.i('d')}${M.i('t')}`, meaning: 'rate of inspiral', value: () => 64 / 5 * cur.sim.S.nu * cur.x ** 5 * terms().reduce((a, b) => a + b, 0) / cur.sim.S.Ms, unit: 's⁻¹', digits: 4 },
    ],
    note: 'Coefficients b_k for non-spinning holes (Blanchet 2014; Buonanno et al. 2009). Terms above the selected PN order are zero. Tail terms come from waves scattering off the curved spacetime they leave.',
    link: bplot,
  });
  const ring = createEquation({
    title: 'Ringdown (frequency computed, amplitude not): quasinormal mode of the remnant Kerr hole',
    lhs: { mathml: M.sub(M.i('f'), M.i('ring')), label: 'ringdown frequency', unit: 'Hz', digits: 4, value: () => cur.sim.S.fRing },
    terms: [{ id: 'qnm', mathml: M.frac(`<mi>Re</mi><mo>(</mo>${M.i('M')}${M.i('ω')}<mo>)</mo>`, `<mn>2</mn><mi>π</mi>${M.sub(M.i('M'), M.i('f'))}`), label: 'Leaver continued fraction (computed)', color: '--accent', unit: 'Hz', digits: 4, value: () => cur.sim.S.fRing }],
    where: [
      { mathml: `${M.i('M')}${M.i('ω')}`, meaning: 'l = m = 2, n = 0 QNM (computed, Teukolsky eq.)', value: () => `${cur.sim.S.qnm.Mw[0].toFixed(5)} − ${(-cur.sim.S.qnm.Mw[1]).toFixed(5)}i` },
      { mathml: M.i('τ'), meaning: 'damping time M_f/|Im Mω| (computed)', value: () => cur.sim.S.tauRing * 1e3, unit: 'ms', digits: 4 },
      { mathml: M.sub(M.i('M'), M.i('f')), meaning: 'remnant mass (NR fit, imported)', value: () => cur.sim.S.Mf, unit: 'M☉', digits: 4 },
      { mathml: M.sub(M.i('χ'), M.i('f')), meaning: 'remnant spin (NR fit, imported)', value: () => cur.sim.S.rem.chi, digits: 4 },
      { mathml: M.sub(M.i('E'), M.i('rad')), meaning: 'radiated energy, whole coalescence (NR fit, imported)', value: () => cur.sim.S.Erad, unit: 'M☉c²', digits: 3 },
    ],
    link: rplot,
  });
  eqs.append(flux.el, ring.el);

  let key = null;
  return {
    update(sim, t) {
      cur.sim = sim;
      const S = sim.S, st = sim.at(t);
      cur.x = st.x;
      const end = sim.ended && t >= sim.tEnd, tEnd = S.tEnd;
      flux.update(); ring.update();

      const k = JSON.stringify(sim.params);
      if (k !== key) {
        key = k;
        phases.replaceChildren(
          card('1 · Inspiral', `computed: ${S.order === 0 ? 'Newtonian quadrupole' : `${S.order}PN`} TaylorT4, RK4`, '--good', `${S.fStart.toFixed(1)} Hz → ${S.fIsco.toFixed(0)} Hz in ${tEnd.toPrecision(3)} s`),
          card('2 · Merger', 'NOT computed: needs numerical relativity', '--bad', 'plunge, common horizon and peak emission are not modelled'),
          card('3 · Remnant', 'imported: fits to NR simulations', '--warn', `M_f = ${S.Mf.toFixed(1)} M☉, χ_f = ${S.rem.chi.toFixed(3)}, E_rad = ${S.Erad.toFixed(2)} M☉c²`),
          card('4 · Ringdown', 'frequency & damping computed (Leaver)', '--accent', `f = ${S.fRing.toFixed(1)} Hz, τ = ${(S.tauRing * 1e3).toFixed(2)} ms; amplitude not computed`),
        );
        const fMax = Math.max(S.fRing, S.fIsco) * 1.6;
        fplot.setX({ min: 0, max: tEnd * 1.3 }).setY({ min: S.fStart * 0.7, max: fMax });
        const x0 = S.x0, nu = S.nu, Ms = S.Ms;
        fplot.fn('ref', tt => { const u = x0 ** -4 - 256 * nu * (tt / Ms) / 5; return u > 0 && tt <= tEnd ? (u ** -0.25) ** 1.5 / (Math.PI * Ms) : NaN; },
          { color: '--muted', dash: true, width: 1.3, label: '0PN closed form (reference)' });
        fplot.band('merger', tEnd, tEnd * 1.3, { color: '--grid-strong', alpha: 0.6, label: 'not computed' });
        fplot.fn('isco', () => S.fIsco, { color: '--muted', dot: true, width: 1.2, label: 'f at x = 1/6 (inspiral end)' });
        fplot.fn('ring', () => S.fRing, { color: '--accent', dash: true, width: 1.2, label: 'ringdown f (computed QNM)' });
        const tau = S.tauRing * 1e3, f = S.fRing / 1e3;
        rplot.setX({ min: 0, max: 8 * tau });
        rplot.fn('env', s => Math.exp(-s / tau), { color: '--muted', dash: true, width: 1.2, label: `envelope e^(−t/τ), τ = ${tau.toFixed(2)} ms` });
        rplot.fn('qnm', s => Math.exp(-s / tau) * Math.cos(2 * Math.PI * f * s), { color: '--accent', label: `cos(2π f t), f = ${S.fRing.toFixed(0)} Hz`, oversample: 2 });
        bplot.setX({ min: Math.max(0, x0 * 0.9), max: X_END });
        for (let kk = 0; kk < 8; kk++) {
          const id = PN_IDS[kk];
          if (!id) continue;
          if (kk > 0 && kk > 2 * S.order) { bplot.remove(id); continue; }
          bplot.fn(id, xx => sim.pnTerms(xx)[kk], { color: PN_COL[id], label: PN_NAME[id], width: kk === 0 ? 1.2 : 1.8 });
        }
        bplot.fn('sum', xx => sim.pnTerms(xx).reduce((a, b) => a + b, 0), { color: '--ink', label: 'B(x)', width: 2.4 });
        const amp = S.ampScale * X_END * 2.1e21;
        hplot.setY({ min: -amp, max: amp });
        for (const p of [fplot, rplot, bplot]) p.invalidate();
      }

      // frequency: computed states up to the displayed time
      const h = sim.hist; let n = h.length - 1;
      while (n > 0 && h[n][0] > t) n--;
      const stride = Math.max(1, Math.ceil(n / 1500)), pts = [];
      for (let i = 0; i <= n; i += stride) pts.push([h[i][0], sim.fGW(h[i][1])]);
      if (!end) pts.push([st.t, sim.fGW(st.x)]);
      fplot.data('pn', pts, { color: '--body-0', label: `computed ${S.order}PN`, width: 2 });
      fplot.marker('now', Math.min(st.t, tEnd), sim.fGW(st.x), { color: '--body-0' });
      fplot.invalidate(); fplot.draw();

      // strain: last ~6 GW cycles, every integrator state (32 per GW cycle)
      const tR = end ? tEnd : st.t, win = 6 / sim.fGW(st.x);
      const hp = [], hx = [];
      for (let i = n; i >= 0 && h[i][0] >= tR - win; i--) { const s = sim.strain(h[i][1], h[i][2]); hp.push([h[i][0], s[0] * 1e21]); hx.push([h[i][0], s[1] * 1e21]); }
      hp.reverse(); hx.reverse();
      hplot.setX({ min: Math.max(0, tR - win), max: tR + (end ? 0.35 * win : 0.02 * win) });
      if (end) hplot.band('merger', tEnd, tR + 0.35 * win, { color: '--grid-strong', alpha: 0.6, label: 'not computed' }); else hplot.remove('merger');
      hplot.data('hp', hp, { color: '--body-0', label: 'h₊' });
      if (Math.abs(Math.cos(sim.params.iota * Math.PI / 180)) > 1e-9) hplot.data('hx', hx, { color: '--body-1', label: 'h×', width: 1.2 }); else hplot.remove('hx');
      hplot.invalidate(); hplot.draw();

      bplot.cursor(st.x); bplot.invalidate(); bplot.draw();
      rplot.draw();
    },
  };
}

  tier: 'approximate',
  tierReason: 'Mixed page. Inspiral: 3.5PN TaylorT4 energy balance for non-spinning holes, a truncated approximation to general relativity, integrated with RK4 (checked against the exact 0PN solution, convergence order and published PN cycle counts). Merger: not computed. Remnant mass and spin: imported fits to numerical-relativity simulations. Ringdown frequency and damping: computed exactly in linear perturbation theory (Leaver continued fraction), checked against published values; its amplitude and start time are not computed.',

      { caption: 'Restricted strain at distance D, inclination ι (μ = νM)', mathml: '<math display="block"><msub><mi>h</mi><mo>+</mo></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>μ</mi><mi>x</mi></mrow><mi>D</mi></mfrac><mo>(</mo><mn>1</mn><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>ι</mi><mo>)</mo><mi>cos</mi><mn>2</mn><mi>φ</mi><mo>,</mo><mspace width="1em"/><msub><mi>h</mi><mo>×</mo></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>2</mn><mi>μ</mi><mi>x</mi></mrow><mi>D</mi></mfrac><mn>2</mn><mi>cos</mi><mi>ι</mi><mi>sin</mi><mn>2</mn><mi>φ</mi></math>' },
      { caption: 'Remnant (imported NR fits, non-spinning progenitors) and ringdown (computed)', mathml: '<math display="block"><msub><mi>χ</mi><mi>f</mi></msub><mo>=</mo><mi>ν</mi><mo>(</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mo>−</mo><mn>3.5171</mn><mi>ν</mi><mo>+</mo><mn>2.5763</mn><msup><mi>ν</mi><mn>2</mn></msup><mo>)</mo><mo>,</mo><mspace width="0.8em"/><mi>h</mi><mo>∝</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mo>/</mo><mi>τ</mi></mrow></msup><mi>cos</mi><mo>(</mo><mn>2</mn><mi>π</mi><msub><mi>f</mi><mi>ring</mi></msub><mi>t</mi><mo>)</mo></math>' },
    ],
    assumptions: [
      'Computed: quasi-circular inspiral of two non-spinning black holes in the post-Newtonian approximation (TaylorT4, up to 3.5PN). The PN series is truncated; different PN approximants disagree by several cycles near the end, most for unequal masses.',

      'Strain: restricted waveform (leading-order amplitude, PN phase; tail phase modulation and higher harmonics neglected). Detector response, noise and cosmological redshift are not modelled; masses are detector-frame.',
      'Separation and positions use the Newtonian relation r = M/x; beyond leading order the separation is coordinate-dependent, so the drawing is indicative.',
