      { id: 'deph', mathml: `${M.i('γ')}<munder><mo>∑</mo>${M.i('m')}</munder>${M.paren(`${M.sub(M.i('P'), M.i('m'))}${rho}${M.sub(M.i('P'), M.i('m'))}<mo>−</mo>${M.frac(M.n(1), M.n(2))}<mo>{</mo>${M.sub(M.i('P'), M.i('m'))}<mo>,</mo>${rho}<mo>}</mo>`)}`, label: 'pure dephasing (environment noise)', color: '--body-1', unit: 'ps⁻¹', value: () => cur.norms.dephasing, digits: 3 },
      { id: 'trap', mathml: `${M.i('κ')}${M.paren(`<mo>|</mo>${M.i('s')}<mo>⟩⟨</mo>${M.n(3)}<mo>|</mo>${rho}<mo>|</mo>${M.n(3)}<mo>⟩⟨</mo>${M.i('s')}<mo>|</mo><mo>−</mo>${M.frac(M.n(1), M.n(2))}<mo>{</mo>${M.sub(M.i('P'), M.n(3))}<mo>,</mo>${rho}<mo>}</mo>`)}`, label: 'trapping BChl 3 → reaction centre', color: '--body-2', unit: 'ps⁻¹', value: () => cur.norms.trapping, digits: 3 },
      { id: 'loss', mathml: `${M.i('Γ')}<munder><mo>∑</mo>${M.i('m')}</munder>${M.paren(`<mo>|</mo>${M.i('g')}<mo>⟩⟨</mo>${M.i('m')}<mo>|</mo>${rho}<mo>|</mo>${M.i('m')}<mo>⟩⟨</mo>${M.i('g')}<mo>|</mo><mo>−</mo>${M.frac(M.n(1), M.n(2))}<mo>{</mo>${M.sub(M.i('P'), M.i('m'))}<mo>,</mo>${rho}<mo>}</mo>`)}`, label: 'recombination (loss)', color: '--body-3', unit: 'ps⁻¹', value: () => cur.norms.loss, digits: 3 },
    ],
    where: [
      { mathml: M.sub(M.i('P'), M.i('m')), meaning: 'projector |m⟩⟨m| on BChl m (site basis); ħ = 1, energies in rad/ps' },
      { mathml: M.i('γ'), meaning: 'pure-dephasing rate: every site coherence ρₘₙ decays at γ', value: () => cur.r.gamma, unit: 'ps⁻¹' },
      { mathml: M.i('κ'), meaning: 'trapping rate from BChl 3', value: () => cur.r.kappa, unit: 'ps⁻¹' },
      { mathml: M.i('Γ'), meaning: 'recombination rate on every site', value: () => cur.r.loss, unit: 'ps⁻¹' },
    ],
  });
  const eff = createEquation({
    title: 'Transfer efficiency',
    lhs: { mathml: M.i('η'), label: 'probability that the excitation reaches the RC', value: () => cur.eta, digits: 5 },
    terms: [{ id: 'eta', mathml: `${M.i('κ')}<msubsup><mo>∫</mo><mn>0</mn><mi>∞</mi></msubsup>${M.sub(rho, M.n(33))}${M.paren(M.i('t'))}<mi>d</mi>${M.i('t')}`, label: 'trapped probability (exact solve)', color: '--accent', value: () => cur.eta, digits: 5 }],
    link: effPlot,
  });
  const hop = createEquation({
    title: 'High-dephasing limit: classical (Förster-like) hopping rate between sites',
    lhs: { mathml: M.sub(M.i('k'), `${M.n(4)}<mo>→</mo>${M.n(3)}`), label: 'hopping rate BChl 4 → 3 now', unit: 'ps⁻¹', value: () => cur.k43, digits: 3 },
    terms: [{ id: 'hop', mathml: M.frac(`${M.n(2)}${M.sup(M.sub(M.i('V'), M.n(43)), M.n(2))}${M.sub(M.i('Γ'), M.n(43))}`, `${M.sup(M.sub(M.i('Γ'), M.n(43)), M.n(2))}<mo>+</mo>${M.sup(M.sub(M.i('Δ'), M.n(43)), M.n(2))}`), label: 'Lorentzian overlap of two dephased sites', color: '--muted', unit: 'ps⁻¹', value: () => cur.k43, digits: 3 }],
    where: [
      { mathml: M.sub(M.i('V'), M.n(43)), meaning: 'coupling BChl 4–3', value: () => H_CM[3][2], unit: 'cm⁻¹' },
      { mathml: M.sub(M.i('Δ'), M.n(43)), meaning: 'site-energy gap', value: () => H_CM[3][3] - H_CM[2][2], unit: 'cm⁻¹' },
      { mathml: M.sub(M.i('Γ'), M.n(43)), meaning: 'total decay rate of ρ₄₃ (γ + κ/2 + Γ)', value: () => cur.r.gamma + cur.r.kappa / 2 + cur.r.loss, unit: 'ps⁻¹' },
    ],
    link: effPlot,
  });
  const deriv = createDerivation([
    { mathml: `${M.frac(`<mi>d</mi>${M.sub(rho, M.i('mn'))}`, `<mi>d</mi>${M.i('t')}`)}<mo>=</mo><mo>−</mo>${M.i('i')}${M.sub(M.i('V'), M.i('mn'))}${M.paren(`${M.sub(rho, M.i('nn'))}<mo>−</mo>${M.sub(rho, M.i('mm'))}`)}<mo>−</mo>${M.paren(`${M.sub(M.i('Γ'), M.i('mn'))}<mo>+</mo>${M.i('i')}${M.sub(M.i('Δ'), M.i('mn'))}`)}${M.sub(rho, M.i('mn'))}<mo>+</mo><mo>…</mo>`, note: 'Equation for one coherence, keeping only the populations it connects.' },
    { mathml: `${M.sub(rho, M.i('mn'))}<mo>≈</mo>${M.frac(`<mo>−</mo>${M.i('i')}${M.sub(M.i('V'), M.i('mn'))}${M.paren(`${M.sub(rho, M.i('nn'))}<mo>−</mo>${M.sub(rho, M.i('mm'))}`)}`, `${M.sub(M.i('Γ'), M.i('mn'))}<mo>+</mo>${M.i('i')}${M.sub(M.i('Δ'), M.i('mn'))}`)}`, note: 'When γ is much faster than the coupling, the coherence follows the populations adiabatically.' },
    { mathml: `${M.frac(`<mi>d</mi>${M.sub(rho, M.i('mm'))}`, `<mi>d</mi>${M.i('t')}`)}<mo>=</mo><munder><mo>∑</mo>${M.i('n')}</munder>${M.sub(M.i('k'), M.i('mn'))}${M.paren(`${M.sub(rho, M.i('nn'))}<mo>−</mo>${M.sub(rho, M.i('mm'))}`)}<mo>−</mo><mo>…</mo>`, note: 'Substituting gives classical rate equations with the Lorentzian rate above (Haken–Strobl). Verified: η agrees to 10⁻⁶ at γ = 10³ ps⁻¹.' },
  ], { title: 'From coherent transport to classical hopping' });
  // Hamiltonian table (input data with provenance)
  const tbl = el('table', { class: 'fmo-ham' });
  tbl.append(el('tr', {}, el('th', {}, ''), ...H_CM.map((_, j) => el('th', {}, `${j + 1}`))));
  H_CM.forEach((row, i) => tbl.append(el('tr', {}, el('th', {}, `${i + 1}`), ...row.map((v, j) => el('td', { class: i === j ? 'd' : 'o' }, v.toFixed(1))))));
  const ham = el('div', { class: 'psim-eq fmo-card' },
    el('p', {}, el('strong', {}, 'Exciton Hamiltonian H (cm⁻¹), C. tepidum FMO. '), `Diagonal: site energies relative to BChl 3 (absolute = value + ${E_OFFSET_CM} cm⁻¹, Adolphs & Renger 2006, Table 4, trimer); off-diagonal: couplings (Table 1, column 4), as reproduced in Sarovar et al. 2010, SI Eq. 12.`),
    tbl,
    el('p', {}, 'The geometry check in Verification recomputes every coupling from the crystal structure in the point-dipole approximation: all signs agree, r = 0.999.'));
  eqs.append(lind.el, eff.el, hop.el, ham, deriv);

  // --- updates
  let scanKey = null, scan = [], hopKey = null, hopCurve = [];
  const site = i => ({ color: SITE_COL[i], label: `BChl ${i + 1}`, width: i === SINK ? 2.2 : 1.6 });
  const nice = v => [1, 2, 5, 10, 20, 50, 100, 200, 300].find(s => s >= v) ?? 300;
  return {
    update(sim, t, { rebuilt } = {}) {
      const p = sim.params;
      cur.r = rates(p); cur.eta = sim.exact.eta; cur.norms = termNorms(sim.y, p);
      const Hm = hamiltonian(), G = cur.r.gamma + cur.r.kappa / 2 + cur.r.loss, d = Hm[3][3] - Hm[2][2];
      cur.k43 = 2 * Hm[3][2] ** 2 * G / (G * G + d * d);
      lind.update(); eff.update(); hop.update();
      const key = `${p.init}|${p.kappa}|${p.tauLoss}`;
      if (key !== scanKey) {
        scanKey = key; scan = efficiencyScan(p);
        effPlot.data('eta', scan.map(r => [r[0], r[1]]), { color: '--accent', label: 'quantum (Lindblad)', width: 2.4 });
        effPlot.data('hop', scan.map(r => [r[0], r[2]]), { color: '--muted', label: 'classical hopping, same γ', dash: true, width: 1.6 });
        const best = scan.reduce((a, b) => (b[1] > a[1] ? b : a));
        effPlot.vline('opt', best[0], { color: '--good', label: 'optimum' });
        optSpan.textContent = `${(100 * best[1]).toFixed(1)} % at γ ≈ ${best[0].toPrecision(2)} ps⁻¹ (ħγ ≈ ${Math.round(best[0] * RATE_TO_CM)} cm⁻¹)`;
        effPlot.band('lo', 1e-3, 0.01, { label: 'scan only' });
        effPlot.band('hi', 1000, 1e5, { label: 'scan only' });
      }
      effPlot.marker('now', p.gamma, sim.exact.eta, { color: '--ink' });
      nowSpan.textContent = `γ = ${p.gamma.toPrecision(3)} ps⁻¹ (ħγ = ${(p.gamma * RATE_TO_CM).toPrecision(3)} cm⁻¹): η = ${fmtPct(sim.exact.eta)}, classical hopping ${fmtPct(sim.hop.eta)}`;
      effPlot.cursor(p.gamma);
      const hk = `${key}|${p.gamma}|${p.tMax}`;
      if (hk !== hopKey) { hopKey = hk; hopCurve = hoppingCurve(p, Math.min(0.05, p.tMax / 600), p.tMax); }
      const xm = Math.min(p.tMax, nice(Math.max(1, 1.15 * sim.t)));
      popPlot.setX({ min: 0, max: xm }); cohPlot.setX({ min: 0, max: xm });
      const H = sim.hist;
      for (let i = 0; i < N; i++) popPlot.data(`p${i + 1}`, H.map(r => [r[0], r[1 + i]]), site(i));
      popPlot.data('rc', H.map(r => [r[0], r[8]]), { color: '#38d9a9', label: 'reaction centre', width: 3 });
      popPlot.data('rcHop', hopCurve.filter(r => r[0] <= xm), { color: '#38d9a9', label: 'RC, classical hopping', dash: true, width: 1.6 });
      const cmax = Math.max(0.2, ...H.map(r => r[10]));
      cohPlot.setY({ min: 0, max: Math.min(6, Math.ceil(cmax * 5) / 5) });
      cohPlot.data('l1', H.map(r => [r[0], r[10]]), { color: '--body-4', label: 'Σ|ρₘₙ|', width: 2, fill: true });
      popCap.querySelector('span').textContent = `${(sim.h * 1000).toPrecision(2)} fs`;
      if (rebuilt) { effPlot.invalidate(); popPlot.invalidate(); cohPlot.invalidate(); }
      effPlot.draw(); popPlot.draw(); cohPlot.draw();
    },
  };
}

const app = createInstrument({
  title: 'Energy transfer in the FMO complex',
  subtitle: '7-site exciton model of C. tepidum FMO with Lindblad dephasing, trapping and loss: does quantum coherence help?',
  tier: 'approximate',
  tierReason: 'A reduced, Markovian model (Haken–Strobl pure dephasing, no temperature, no vibrations). Its numerical solution is verified against exact unitary evolution, exp(𝓛t), an exact efficiency solve and the classical hopping limit; it is not validated against measured spectra.',
  layout: 'workbench',
  gl: true,
  params: PARAMS, create: createSim,
  drawGL, draw, bench,
  onPointer(canvas) { cam.attach(canvas); },
  onFit(view) { fit(view); },
  // Run span: three mean trapping times (exact ⟨t⟩), by which ≈ 95 % of the excitation has left the complex,
  // capped by the Run length parameter (the model's own end; it also ends once 99.5 % has left, always later than 3⟨t⟩).
  timeline: {
    duration: sim => Math.min(sim.params.tMax, 3 * sim.exact.meanTime),
    markers: sim => [
      { t: 0.06, label: 'electronic coherence gone in FMO at room temperature, ≈ 60 fs (measured, Duan et al. 2017)', short: '60 fs', kind: 'measured' },
      { t: 1 / sim.params.gamma, label: 'dephasing time 1/γ: site coherences decay as e^{−γt}', short: '1/γ', kind: 'computed' },
      { t: sim.exact.meanTime, label: 'mean time to reach the reaction centre ⟨t⟩ (exact solve)', short: `⟨t⟩ ${sim.exact.meanTime.toPrecision(2)} ps`, kind: 'computed' },
    ].filter(m => m.t <= Math.min(sim.params.tMax, 3 * sim.exact.meanTime)),
    note: sim => (3 * sim.exact.meanTime <= sim.params.tMax
      ? `The run spans 3 ⟨t⟩ = ${(3 * sim.exact.meanTime).toFixed(1)} ps: by then about 95 % of the excitation has reached the reaction centre or been lost; η is the exact long-time value.`
      : `The mean transfer time ⟨t⟩ = ${sim.exact.meanTime.toFixed(0)} ps is longer than the ${sim.params.tMax} ps run: raise “Run length” (up to 300 ps) to follow the transfer. η is the exact long-time value.`),
  },
  timeUnit: 'ps', timeLabel: 'time since excitation', speed: 0.5, speedRange: [0.02, 30], duration: 60,
  hudLine: sim => `RC ${(100 * sim.y[98]).toFixed(1)} % · on BChls ${(100 * sim.remaining()).toFixed(1)} % · Σ|ρₘₙ| ${sim.l1().toFixed(2)} · η(∞) ${(100 * sim.exact.eta).toFixed(1)} %`,
  presets: [
    { label: 'Almost coherent (γ = 0.01 ps⁻¹)', values: { gamma: 0.01, init: '1' }, play: true },
    { label: 'Optimal noise (γ = 25 ps⁻¹)', values: { gamma: 25, init: '1' }, play: true },
    { label: 'Strong noise (γ = 1000 ps⁻¹)', values: { gamma: 1000, init: '1' }, play: true },
    { label: 'Rebentrost start ½(1 + 6), γ = 3', values: { gamma: 3, init: 'mix' }, play: true },
  ],
  viewControls(body, { toggle }) {
    body.append(toggle('Slow rotation', rotate, v => { rotate = v; }));
    body.append(toggle('Show Qy axes (NB→ND)', showAxes, v => { showAxes = v; }));
  },
  model: {
    legend: [
      'spheres: BChl Mg sites (PDB 3ENI)',
      'glow area ∝ population ρₘₘ',
      'lines: coherence |ρₘₙ| (bar)',
      'green: RC trap (symbolic)',
    ],
    equations: [],
    assumptions: [
      'One exciton on 7 BChls of one FMO monomer (the weakly bound 8th BChl and the trimer partners are not included).',
      'Hamiltonian: Adolphs & Renger (2006), C. tepidum: site energies Table 4 (trimer), couplings Table 1 column 4, as reproduced in Sarovar et al. (2010) SI Eq. 12; the original tables were not re-read in this session.',
      'Environment: Markovian pure dephasing at one rate γ for every site (Haken–Strobl). No temperature, no detailed balance (the model drives populations towards equal sharing, not a Boltzmann distribution), no vibrational modes, no non-Markovian memory.',
      'Trap: irreversible transfer from BChl 3 at κ (default 1 ps⁻¹) and recombination on all sites at Γ = 1/τ (default 1 ns), following Rebentrost et al. (2009).',
      'The model can show that, for this Hamiltonian, intermediate noise maximises η and that coherence at a given γ adds little once γ ≳ 1 ps⁻¹. It cannot decide how long electronic coherence lives in real FMO, or whether the 2D-spectroscopy beats are electronic or vibrational: that needs a microscopic bath (spectral density, HEOM) and the experiments.',
    ],
    conventions: [
      'Positions are the Mg atoms of BCL A 371–377 in PDB 3ENI (BChl 1–7), centred on their mean; spheres (1.9 Å) and glow sizes are display choices.',
      'Glow: halo diameter 18 Å × √ρₘₘ, so its area is proportional to the population; sphere colour also warms with √ρₘₘ.',
      'Coherence lines: colour = |ρₘₙ| on viridis from 0 to ½; opacity grows with |ρₘₙ| ((|ρₘₙ|/0.04)^0.6, capped at 1); lines below 0.002 are hidden. Coherences are site-basis quantities (basis dependent).',
      'Faint sticks: the NB→ND axis of each BChl, the approximate direction of its Qy transition dipole.',
      'The reaction centre is not in the crystal structure: it is drawn 10 Å beyond BChl 3 along the line from the complex centre, as a symbol for the trap.',
      'Time: physical time since excitation in ps; default playback 0.5 ps per second of wall time.',
    ],
    references: [
      'J. Adolphs, T. Renger, Biophys. J. 91, 2778 (2006): FMO site energies and couplings.',
      'M. Sarovar, A. Ishizaki, G. R. Fleming, K. B. Whaley, Nature Phys. 6, 462 (2010), arXiv:0905.3787, SI Eq. 12: the Adolphs–Renger Hamiltonian as used here.',
      'D. E. Tronrud, J. Wen, L. Gay, R. E. Blankenship, Photosynth. Res. 100, 79 (2009): PDB 3ENI, C. tepidum FMO at 2.2 Å.',
      'P. Rebentrost, M. Mohseni, I. Kassal, S. Lloyd, A. Aspuru-Guzik, New J. Phys. 11, 033003 (2009): environment-assisted quantum transport (they used the Cho et al. 2005 Hamiltonian).',
      'M. B. Plenio, S. F. Huelga, New J. Phys. 10, 113019 (2008): dephasing-assisted transport.',
      'G. S. Engel et al., Nature 446, 782 (2007): quantum beats in 2D spectra of FMO at 77 K.',
      'H.-G. Duan et al., PNAS 114, 8493 (2017): electronic coherence in FMO at room temperature decays within ~60 fs; long-lived beats attributed to vibrations.',
      'H. Haken, G. Strobl, Z. Phys. 262, 135 (1973): exciton transport with stochastic dephasing.',
    ],
  },
});

window.psim.fit = () => fit(app.view);

// GPU self-test: at t = 0 the excitation sits on BChl 1, so its glow must be bright and BChl 3's dark.
window.psim.selfTest = async () => {
  const sim = window.psim.getSim(), canvas = document.querySelector('canvas.psim-gl'), gl = canvas.getContext('webgl2');
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, dpr = W / canvas.clientWidth;
  const view = { W: canvas.clientWidth, H: canvas.clientHeight, theme: document.documentElement.dataset.theme === 'light' ? 'light' : 'dark' };
  const keep = showAxes; showAxes = false;
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawScene(gl, sim, view, { glowOnly: true });
  const px = q => { const b = new Uint8Array(4); gl.readPixels(Math.round(q.x * dpr), Math.round(H - 1 - q.y * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); return [...b]; };
  const p1 = sim.pops()[0];
  // sample just outside the sphere silhouette, inside the halo
  const a = px(cam.project(P[0], view.W, view.H)), b = px(cam.project(P[SINK], view.W, view.H));
  showAxes = keep;
  return { label: 'GPU glow follows population: BChl 1 halo lit, BChl 3 halo dark at t = 0', p1, glow1: a, glow3: b, pass: p1 > 0.99 && a[3] > 100 && b[3] === 0 };
};
