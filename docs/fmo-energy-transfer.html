<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);
}

/* ---------- full screen (scene + HUD + legend + playback bar) ---------- */
.psim-fs { background: var(--stage, var(--bg)); border-radius: 0 !important; border: 0 !important; }
.psim-app .psim-fs .psim-transport { position: absolute; left: 50%; right: auto; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; }
.psim-pseudo-fs { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; max-height: none !important; z-index: 1000; margin: 0 !important; }
.psim-fsbtn { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; }
.psim-fsbtn:hover { background: var(--raise); color: var(--ink); }
.psim-fsbtn svg { width: 15px; height: 15px; }

/* ---------- timeline: the run's span and its key times (spec.timeline) ---------- */
.psim-timeline { position: absolute; left: 50%; transform: translateX(-50%); bottom: 78px; width: min(560px, 62%); z-index: 3;
  font: 10.5px var(--mono); color: var(--muted); pointer-events: auto; }
.psim-canvaswrap > .psim-timeline { bottom: 14px; }
.psim-app .psim-fs > .psim-timeline { bottom: 86px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .ticks { position: relative; height: 30px; }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .lab.r1 { bottom: 16px; }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }
.psim-timeline .m.measured, .psim-tlrow i.measured { background: var(--good, #4cc38a); }
.psim-timeline .lab.measured { color: var(--good, #4cc38a); }
.psim-timeline .m.requested, .psim-tlrow i.requested { background: var(--warn, #e0a030); }
.psim-timeline .lab.requested { color: var(--warn, #e0a030); }
.psim-timeline { background: color-mix(in srgb, var(--stage) 78%, transparent); padding: 4px 12px 6px; border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.psim-tlrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: baseline; margin: 6px 0; font-size: 12px; }
.psim-tlrow i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.psim-tlrow code { font: 12px var(--mono); color: var(--ink); }
.psim-tlrow small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
@media (max-width: 860px) {
  .psim-timeline { left: 10px; transform: none; width: calc(50% - 16px); bottom: 70px; }
  .psim-app .psim-legend { max-width: calc(50% - 16px); }
  .psim-canvaswrap > .psim-timeline { bottom: 12px; }
  .psim-timeline .lab { font-size: 9.5px; }
}
</style>

  .fmo-ham { font: 11.5px var(--mono); border-collapse: collapse; margin: 6px 0 2px; }
  .fmo-ham td, .fmo-ham th { padding: 2px 6px; text-align: right; border-bottom: 1px solid var(--grid); }
  .fmo-ham th { color: var(--muted); font-weight: 500; }
  .fmo-ham td.d { color: var(--ink); font-weight: 600; }
  .fmo-ham td.o { color: var(--ink-2); }
  .fmo-card { overflow-x: auto; max-width: 100%; }
  .fmo-card p { margin: 4px 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
  .fmo-cap { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 6px 2px 0; }

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */
function createSphereRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;

  vec3 c = (uView * vec4(aCenter, 1.0)).xyz;

  float s = r * d / sqrt(max(d * d - r * r, 1e-12)) * 1.05;
  vec3 q = c + vec3(aCorner * s, 0.0);

precision highp float;

      const lv = point

    },
  };
}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.
 * Dashed lines are for reference overlays (analytic curves), solid for computed paths.
 */
function createLineRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;
uniform mat4 uVP; uniform vec2 uViewport; uniform float uWidth;

precision highp float;

  const vao = gl.createVertexArray(), corner = gl.createBuffer(), inst = gl.createBuffer();

    update(data) { lines = Array.isArray(data) && data.length && typeof data[0] !== 'number' ? data : [data]; },
    draw(camera, { aspect, width = 2, color = '#9fb3c8', opacity = 1, dash = null, depthTest = true } = {}) {

            buf[o + 6] = s; buf[o + 7] = s + len; buf[o + 8] = c[0]; buf[o + 9] = c[1]; buf[o + 10] = c[2]; buf[o + 11] = op;

      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.uniformMatrix4fv(u.uVP, false, viewProj);
      gl.uniform2f(u.uViewport, gl.drawingBufferWidth / 2, gl.drawingBufferHeight / 2);

}

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */
const geometry = (() => {
  const make = (pos, nrm, idx) => ({ positions: Float32Array.from(pos), normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) });
  const quad = (P, N, I, a, b, c, d, n) => { const o = P.length / 3; P.push(...a, ...b, ...c, ...d); for (let k = 0; k < 4; k++) N.push(...n); I.push(o, o + 1, o + 2, o, o + 2, o + 3); };

    box(sx = 1, sy = 1, sz = 1) {
      const x = sx / 2, y = sy / 2, z = sz / 2, P = [], N = [], I = [];
      quad(P, N, I, [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1]);
      quad(P, N, I, [-x, y, -z], [x, y, -z], [x, -y, -z], [-x, -y, -z], [0, 0, -1]);
      quad(P, N, I, [x, -y, -z], [x, y, -z], [x, y, z], [x, -y, z], [1, 0, 0]);
      quad(P, N, I, [-x, y, -z], [-x, -y, -z], [-x, -y, z], [-x, y, z], [-1, 0, 0]);
      quad(P, N, I, [x, y, -z], [-x, y, -z], [-x, y, z], [x, y, z], [0, 1, 0]);
      quad(P, N, I, [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [0, -1, 0]);

    },
    cylinder(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [];

        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);

        I.push(o, o + 1, o + 2, o, o + 2, o + 3);
        for (const [zz, nz] of [[h, 1], [0, -1]]) { const q = P.length / 3; P.push(0, 0, zz, r * c0, r * s0, zz, r * c1, r * s1, zz); N.push(0, 0, nz, 0, 0, nz, 0, 0, nz); I.push(...(nz > 0 ? [q, q + 1, q + 2] : [q, q + 2, q + 1])); }
      }
      return make(P, N, I);
    },
    cone(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [], k = r / h;
      for (let i = 0; i < n; i++) {
        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, am = (a0 + a1) / 2, o = P.length / 3;
        const nn = a => { const l = Math.hypot(1, k); return [Math.cos(a) / l, Math.sin(a) / l, k / l]; };
        P.push(r * Math.cos(a0), r * Math.sin(a0), 0, r * Math.cos(a1), r * Math.sin(a1), 0, 0, 0, h); N.push(...nn(a0), ...nn(a1), ...nn(am));
        I.push(o, o + 1, o + 2);
        const q = P.length / 3; P.push(0, 0, 0, r * Math.cos(a1), r * Math.sin(a1), 0, r * Math.cos(a0), r * Math.sin(a0), 0); N.push(0, 0, -1, 0, 0, -1, 0, 0, -1); I.push(q, q + 1, q + 2);
      }
      return make(P, N, I);
    },
    sphere(r = 0.5, n = 24) {
      const P = [], N = [], I = [];
      for (let j = 0; j <= n; j++) {for (let i = 0; i <= 2 * n; i++) {
        const th = Math.PI * j / n, ph = Math.PI * i / n, v = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
        P.push(r * v[0], r * v[1], r * v[2]); N.push(...v);

      for (let j = 0; j < n; j++) for (let i = 0; i < 2 * n; i++) { const a = j * w + i; I.push(a, a + w, a + 1, a + 1, a + w, a + w + 1); }

    },
    disc(r = 0.5, n = 48) {

    plane(sx = 1, sy = 1) { const P = [], N = [], I = []; quad(P, N, I, [-sx / 2, -sy / 2, 0], [sx / 2, -sy / 2, 0], [sx / 2, sy / 2, 0], [-sx / 2, sy / 2, 0], [0, 0, 1]); return make(P, N, I); },
    /**
     * Parametric surface: point(u, v) → [x, y, z] over u ∈ [u0, u1], v ∈ [v0, v1] on an nu × nv grid;
     * optional value(u, v) per vertex (for colormapped meshes). Normals from central differences.

      const hl = Math.min(headLength, length), a = this.cylinder(shaft, length - hl, n), b = this.cone(head, hl, n);

        positions: Float32Array.from([...a.positions, ...Array.from(b.positions, (v, i) => (i % 3 === 2 ? v + length - hl : v))]),
        normals: Float32Array.from([...a.normals, ...b.normals]),
        indices: Uint32Array.from([...a.indices, ...Array.from(b.indices, i => i + off)]),
      };
    },
  };
})();

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */
function alignZ(dir) {
  const l = Math.hypot(...dir);
  if (!(l > 0)) throw new Error('alignZ: direction must be non-zero');
  const [x, y, z] = dir.map(v => v / l);
  if (z < -1 + 1e-12) return [1, 0, 0, 0, -1, 0, 0, 0, -1];
  // Rodrigues rotation about ẑ × d by the angle between them
  const k = 1 / (1 + z);
  return [1 - x * x * k, -x * y * k, x, -x * y * k, 1 - y * y * k, y, -x, -y, z];
}

/**
 * Point lists for createLineRenderer.update(): each returns one polyline [x,y,z, …] or an array of them.
 *   circle(center, normal, r, n)        closed circle (great circles, cone rims, orbits)
 *   boxEdges([min, max])                the 12 edges of a box, as separate segments
 *   grid(dims, { spacing, origin })     all lattice lines of a 1–3D grid with dims points per axis
 *   arrow(from, to, { head, normal })   shaft and a two-stroke head in the plane containing normal
 */
const polylines = {
  circle(center = [0, 0, 0], normal = [0, 0, 1], r = 1, n = 96) {
    const R = alignZ(normal), out = [];
    for (let i = 0; i <= n; i++) {
      const a = 2 * Math.PI * i / n, p = [r * Math.cos(a), r * Math.sin(a), 0];
      for (let k = 0; k < 3; k++) out.push(center[k] + R[3 * k] * p[0] + R[3 * k + 1] * p[1] + R[3 * k + 2] * p[2]);
    }
    return out;
  },
  boxEdges([lo, hi]) {
    const c = i => [i & 1 ? hi[0] : lo[0], i & 2 ? hi[1] : lo[1], i & 4 ? hi[2] : lo[2]];
    const out = [];
    for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b)) out.push([...c(i), ...c(i | b)]);
    return out;
  },
  grid(dims, { spacing = 1, origin = [0, 0, 0] } = {}) {

    for (let ax = 0; ax < dims.length; ax++) {
      const [b, c] = [0, 1, 2].filter(k => k !== ax);
      for (let i = 0; i < d[b]; i++) {for (let j = 0; j < d[c]; j++) {
        const p = [0, 0, 0], q = [0, 0, 0];
        p[b] = q[b] = i; p[c] = q[c] = j; p[ax] = 0; q[ax] = d[ax] - 1;
        out.push([0, 1, 2].map(k => origin[k] + p[k] * sp[k]).concat([0, 1, 2].map(k => origin[k] + q[k] * sp[k])));
      }}
    }

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);
}

// ---------------------------------------------------------------- linear algebra

/** Solve a tridiagonal system (Thomas algorithm). a: sub, b: diag, c: super, d: rhs. Works for complex via callers. */
function solveTridiagonal(a, b, c, d) {
  const n = b.length, cp = new Float64Array(n), dp = new Float64Array(n), x = new Float64Array(n);
  cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
  for (let i = 1; i < n; i++) {
    const m = b[i] - a[i] * cp[i - 1];
    cp[i] = c[i] / m;
    dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
  }
  x[n - 1] = dp[n - 1];
  for (let i = n - 2; i >= 0; i--) x[i] = dp[i] - cp[i] * x[i + 1];
  return x;
}

/**
 * All eigenvalues and eigenvectors of a real symmetric tridiagonal matrix (implicit QL with
 * Wilkinson shifts; Numerical Recipes "tqli"). diag: n diagonal entries; off: n−1 entries
 * coupling i and i+1. Returns { values, vectors } with vectors[i] the unit eigenvector of
 * values[i] (unsorted). Cost O(n³) with eigenvectors: fine to n ≈ 500 in a browser.
 * { vectors: false } returns eigenvalues only, in O(n²) (n = 10⁴ in ~3 s); for the lowest few use
 * lowestTridiagonal (bisection, O(n) per level).
 */
function eigenTridiagonal(diag, off, { vectors: wantVectors = true } = {}) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('eigenTridiagonal: off must have n − 1 entries');
  const d = Float64Array.from(diag), e = new Float64Array(n);
  e.set(off);
  const z = wantVectors ? new Float64Array(n * n) : null;
  if (z) for (let i = 0; i < n; i++) z[i * n + i] = 1;
  for (let l = 0; l < n; l++) {
    let iter = 0, m;
    do {
      for (m = l; m < n - 1; m++) {
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= Number.EPSILON * dd) break;
      }
      if (m !== l) {
        if (iter++ === 60) throw new Error('eigenTridiagonal: no convergence');
        let g = (d[l + 1] - d[l]) / (2 * e[l]);
        let r = Math.hypot(g, 1);
        g = d[m] - d[l] + e[l] / (g + (g >= 0 ? r : -r));
        let s = 1, c = 1, p = 0, i;
        for (i = m - 1; i >= l; i--) {
          let f = s * e[i];
          const b = c * e[i];
          r = Math.hypot(f, g);
          e[i + 1] = r;
          if (r === 0) { d[i + 1] -= p; e[m] = 0; break; }
          s = f / r; c = g / r;
          g = d[i + 1] - p;
          r = (d[i] - g) * s + 2 * c * b;
          p = s * r;
          d[i + 1] = g + p;
          g = c * r - b;
          if (z) {for (let k = 0; k < n; k++) {
            f = z[k * n + i + 1];
            z[k * n + i + 1] = s * z[k * n + i] + c * f;
            z[k * n + i] = c * z[k * n + i] - s * f;
          }}
        }
        if (r === 0 && i >= l) continue;
        d[l] -= p; e[l] = g; e[m] = 0;
      }
    } while (m !== l);
  }
  if (!z) return { values: Array.from(d) };
  const vectors = Array.from({ length: n }, (_v, i) => Float64Array.from({ length: n }, (_w, k) => z[k * n + i]));
  return { values: Array.from(d), vectors };
}

/**
 * The k lowest eigenvalues of a symmetric tridiagonal matrix by Sturm-sequence bisection:
 * O(n · 64) per eigenvalue, accurate to round-off, exact ordering (no missed or merged levels,
 * also for near-degenerate tunnelling doublets). Returns ascending values.
 */
function lowestTridiagonal(diag, off, k) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('lowestTridiagonal: off must have n − 1 entries');
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {                                 // Gershgorin bounds
    const r = (i > 0 ? Math.abs(off[i - 1]) : 0) + (i < n - 1 ? Math.abs(off[i]) : 0);
    lo = Math.min(lo, diag[i] - r); hi = Math.max(hi, diag[i] + r);
  }
  const e2 = Float64Array.from(off, v => v * v), tiny = Number.MIN_VALUE * 1e10 + 1e-300;
  const below = x => {                                           // number of eigenvalues < x
    let c = 0, q = diag[0] - x;
    if (q < 0) c++;
    for (let i = 1; i < n; i++) {
      q = diag[i] - x - e2[i - 1] / (q !== 0 ? q : tiny);
      if (q < 0) c++;
    }
    return c;
  };
  const out = [];
  for (let j = 0; j < Math.min(k, n); j++) {
    let a = j ? out[j - 1] : lo, b = hi;
    for (let it = 0; it < 200 && b - a > 2 * Number.EPSILON * Math.max(Math.abs(a), Math.abs(b), 1e-300); it++) {
      const m = 0.5 * (a + b);
      if (m === a || m === b) break;
      if (below(m) > j) b = m; else a = m;
    }
    out.push(0.5 * (a + b));
  }
  return out;
}

/** Least-squares fit y ≈ a + b x. Returns { a, b, r2 }. */
function linearFit(xs, ys) {
  // two-pass (centred) sums: no cancellation when x has a large offset (e.g. timestamps)
  const n = xs.length;
  let mx = 0, my = 0;
  for (let i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; }
  mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;

const E_OFFSET_CM = 12210;
const SINK = 2;   // index of BChl 3

// PDB 3ENI chain A, BCL 371…377 = BChl 1…7 (Å). Mg position and the NB, ND nitrogens (Qy axis ≈ NB→ND).
const MG = [[26.510, 2.597, -11.349], [15.607, -1.517, -17.246], [3.389, -13.614, -13.851], [6.678, -20.848, -6.036], [19.378, -18.571, -1.076], [21.834, -7.175, 0.634], [10.274, -8.207, -5.544]];
const NB = [[27.763, 3.925, -10.354], [17.270, -2.597, -16.664], [3.802, -15.642, -13.828], [8.483, -19.846, -5.821], [20.862, -19.812, -1.822], [22.019, -5.543, -0.614], [11.572, -6.787, -4.819]];
const ND = [[24.744, 1.641, -11.860], [13.828, -0.574, -17.095], [3.005, -11.771, -14.681], [5.270, -21.991, -6.933], [17.893, -17.170, -1.161], [21.472, -9.105, 1.237], [9.589, -9.624, -6.834]];

const PARAMS = [
  { key: 'gamma', label: 'Dephasing rate γ', min: 0.01, max: 1000, value: 3, log: true, unit: 'ps⁻¹',
    hint: 'Pure-dephasing rate of every site coherence (environmental noise). ħγ in cm⁻¹ = 5.31 × γ[ps⁻¹]. Small: coherent quantum walk; large: incoherent hopping.' },
  { key: 'init', label: 'Excitation starts on', value: '1', options: [
    { value: '1', label: 'BChl 1 (chlorosome side)' },
    { value: '6', label: 'BChl 6 (chlorosome side)' },
    { value: 'mix', label: 'mixture ½(|1⟩⟨1| + |6⟩⟨6|)' },
  ] },
  { key: 'kappa', label: 'Trapping rate κ (BChl 3 → RC)', min: 0.1, max: 10, value: 1, log: true, unit: 'ps⁻¹', hint: 'Irreversible transfer from BChl 3 to the reaction centre (Rebentrost et al. 2009: 1 ps⁻¹).' },
  { key: 'tauLoss', label: 'Exciton lifetime 1/Γ', min: 0.1, max: 10, value: 1, log: true, unit: 'ns', hint: 'Recombination on every site (1 ns in Rebentrost et al. 2009).' },

// ------------------------------------------------------------------ the model
function hamiltonian() { return H_CM.map(r => r.map(v => v * CM_TO_RADPS)); }   // rad/ps

function rates(params) {
  return { gamma: params.gamma, kappa: params.kappa, loss: 1 / (params.tauLoss * 1000) };   // ps⁻¹
}

/** initial 7×7 density matrix as y-vector (real storage) */
function initialState(init) {
  const y = new Float64Array(2 * N * N + 2);
  if (init === 'mix') { y[0] = 0.5; y[5 * N + 5] = 0.5; }
  else { const k = (+init) - 1; y[k * N + k] = 1; }
  return y;
}

/** decay rate of ρ_mn from dephasing, trapping and loss (the dissipative part, element form) */
function decayMatrix({ gamma, kappa, loss }) {
  const D = new Float64Array(N * N);
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++)
    D[m * N + n] = (m === n ? 0 : gamma) + 0.5 * kappa * ((m === SINK) + (n === SINK)) + loss;
  return D;
}

/** the Lindblad generator in element form, dy/dt = f(y) */
function makeRhs(params) {
  const H = hamiltonian().flat(), D = decayMatrix(rates(params)), { kappa, loss } = rates(params);
  const out = new Float64Array(2 * N * N + 2), NN = N * N;
  return (t, y) => {
    let trace = 0;
    for (let m = 0; m < N; m++) {
      for (let n = 0; n < N; n++) {
        // [H, ρ]_mn = Σ_k H_mk ρ_kn − ρ_mk H_kn ;  ρ = A + iB ;  −i[H, ρ] = [H, B] − i[H, A]
        let ca = 0, cb = 0;
        for (let k = 0; k < N; k++) {
          const hmk = H[m * N + k], hkn = H[k * N + n];
          ca += hmk * y[k * N + n] - y[m * N + k] * hkn;
          cb += hmk * y[NN + k * N + n] - y[NN + m * N + k] * hkn;
        }
        const i = m * N + n;
        out[i] = cb - D[i] * y[i];
        out[NN + i] = -ca - D[i] * y[NN + i];
      }
      trace += y[m * N + m];
    }
    out[2 * NN] = kappa * y[SINK * N + SINK];
    out[2 * NN + 1] = loss * trace;
    return out;
  };
}

function stepSize(params) {
  const { gamma, kappa } = rates(params);
  return Math.min(1e-3, 0.5 / (gamma + kappa));   // ≤ 1 fs; ≤ 0.5/γ keeps RK4 accurate on fast decays
}

// ------------------------------------------------------------------ observables
const pops = y => Array.from({ length: N }, (_, m) => y[m * N + m]);
const absCoh = (y, m, n) => Math.hypot(y[m * N + n], y[N * N + m * N + n]);
function l1Coherence(y) {
  let s = 0;
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) if (m !== n) s += absCoh(y, m, n);
  return s;
}
/** eigenvalues of the Hermitian 7×7 ρ via its real 14×14 embedding [[A, −B], [B, A]] (each value twice) */
function rhoEigen(y) {
  const NN = N * N, M = Array.from({ length: 2 * N }, () => new Float64Array(2 * N));
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) {
    const a = 0.5 * (y[m * N + n] + y[n * N + m]), b = 0.5 * (y[NN + m * N + n] - y[NN + n * N + m]);
    M[m][n] = a; M[m + N][n + N] = a; M[m][n + N] = -b; M[m + N][n] = b;
  }
  return Array.from(eigenSymmetric(M, { rtol: 1e-13 }).values);
}
function hermiticityError(y) {
  const NN = N * N; let e = 0;
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++)
    e = Math.max(e, Math.abs(y[m * N + n] - y[n * N + m]), Math.abs(y[NN + m * N + n] + y[NN + n * N + m]));
  return e;
}
const totalProbability = y => pops(y).reduce((a, b) => a + b, 0) + y[2 * N * N] + y[2 * N * N + 1];

/** generator restricted to the 98 site-block reals (sink/ground are outputs only), as a dense matrix */
function siteGenerator(params) {
  const f = makeRhs(params), n = 2 * N * N, cols = [];
  const e = new Float64Array(n + 2);
  for (let j = 0; j < n; j++) { e.fill(0); e[j] = 1; cols.push(Float64Array.from(f(0, e).subarray(0, n))); }
  return Array.from({ length: n }, (_, i) => Float64Array.from(cols, col => col[i]));
}

/**
 * Exact transfer efficiency η = κ∫₀^∞ρ₃₃dt and mean trapping time, from ∫ρ dt = −𝓛⁻¹ρ(0) and
 * ∫tρ dt = 𝓛⁻²ρ(0) (𝓛 is invertible because Γ > 0 empties every site).
 */
function efficiency(params) {
  const L = siteGenerator(params), y0 = initialState(params.init).subarray(0, 2 * N * N);
  const X = solveLinear(L, Array.from(y0, v => -v));          // ∫ρ dt
  const T = solveLinear(L, Array.from(X, v => -v));           // ∫tρ dt
  const { kappa, loss } = rates(params), s = SINK * N + SINK;
  let trInt = 0; for (let m = 0; m < N; m++) trInt += X[m * N + m];
  return { eta: kappa * X[s], lost: loss * trInt, meanTime: T[s] / X[s] };
}

/**
 * High-dephasing (Haken–Strobl, "Förster-like") limit: adiabatic elimination of the coherences gives
 * classical hopping k_mn = 2V_mn²Γ_mn / (Γ_mn² + Δ_mn²) with Γ_mn the total decay rate of ρ_mn and
 * Δ_mn the site-energy gap (all rad/ps). Returns the 7×7 rate generator K (dp/dt = K p).
 */
function hoppingGenerator(params) {
  const H = hamiltonian(), D = decayMatrix(rates(params)), { kappa, loss } = rates(params);
  const K = Array.from({ length: N }, () => new Float64Array(N));
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) if (m !== n) {
    const G = D[m * N + n], d = H[m][m] - H[n][n], k = 2 * H[m][n] ** 2 * G / (G * G + d * d);
    K[m][n] += k; K[n][n] -= k;
  }
  for (let m = 0; m < N; m++) K[m][m] -= loss + (m === SINK ? kappa : 0);
  return K;
}
function hoppingEfficiency(params) {
  const K = hoppingGenerator(params), p0 = pops(initialState(params.init));
  const X = solveLinear(K, p0.map(v => -v));
  return { eta: rates(params).kappa * X[SINK] };
}

// ------------------------------------------------------------------ the simulation
function createSim(params) {
  const p = { ...params };
  const h = stepSize(p);
  const ode = odeStepper({ f: makeRhs(p), y0: initialState(p.init), method: 'rk4', h });
  const exact = efficiency(p), hop = hoppingEfficiency(p);
  const recDt = 0.01, hist = [];   // history every 10 fs: [t, p1..p7, sink, loss, C_l1]
  const record = () => { const y = ode.y; hist.push([ode.t, ...pops(y), y[98], y[99], l1Coherence(y)]); };
  record();
  let traceErr = 0, minEig = 0, nextRec = recDt;
  const remaining = () => pops(ode.y).reduce((a, b) => a + b, 0);
  const sim = {
    params: p, h, exact, hop, hist, ode,
    get t() { return ode.t; },
    get y() { return ode.y; },
    get done() { return ode.t >= p.tMax - 1e-12 || remaining() < 0.005; },
    step() {
      if (sim.done) return;
      ode.step(p.tMax - ode.t);
      traceErr = Math.max(traceErr, Math.abs(totalProbability(ode.y) - 1));
      while (ode.t >= nextRec - 1e-9) { record(); nextRec += recDt; }
    },
    remaining,
    pops: () => pops(ode.y),
    coherence: (m, n) => absCoh(ode.y, m, n),
    l1: () => l1Coherence(ode.y),
    diagnostics() {
      const y = ode.y, eig = rhoEigen(y);
      minEig = Math.min(minEig, eig[0]);
      const sinkNow = y[98];
      return [
        { key: 'trace', label: 'Probability conservation |tr ρ + p_RC + p_lost − 1| (max)', value: Math.max(traceErr, 1e-17), kind: 'error', good: 1e-12, warn: 1e-9 },
        { key: 'eta', label: 'Efficiency η = p_RC(∞) (exact solve)', value: exact.eta, kind: 'value', text: `${(100 * exact.eta).toFixed(2)} %` },
        { key: 'sink', label: 'Delivered to reaction centre so far', value: sinkNow, kind: 'value', text: `${(100 * sinkNow).toFixed(2)} %` },
        { key: 'left', label: 'Still on the 7 BChls', value: remaining(), kind: 'value', text: `${(100 * remaining()).toFixed(2)} %` },
        { key: 'tmean', label: 'Mean trapping time ⟨t⟩', value: exact.meanTime, kind: 'value', unit: 'ps', text: `${exact.meanTime.toFixed(2)} ps` },
        { key: 'hop', label: 'η of classical hopping (same γ)', value: hop.eta, kind: 'value', text: `${(100 * hop.eta).toFixed(2)} %` },
        { key: 'coh', label: 'Site coherence Σ|ρ_mn| (m ≠ n)', value: l1Coherence(y), kind: 'value', text: l1Coherence(y).toFixed(3) },
        { key: 'pos', label: 'Smallest eigenvalue of ρ (≥ 0: positive)', value: eig[0], kind: 'value', text: eig[0].toExponential(1) },
      ];
    },
    state() {
      const y = ode.y;
      return { t: ode.t, populations: pops(y), sink: y[98], lost: y[99], coherenceL1: l1Coherence(y), etaExact: exact.eta };
    },
    record() {
      return { header: ['t_ps', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p_RC', 'p_lost', 'C_l1'], rows: hist.map(r => r.map(v => +v.toPrecision(8))) };
    },
  };
  return sim;
}

/**
 * Size of each term of the master equation at state y: Frobenius norms (ps⁻¹) of −i[H, ρ] and of the
 * dephasing, trapping and loss contributions to dρ/dt (site block).
 */
function termNorms(y, params) {
  const H = hamiltonian(), { gamma, kappa, loss } = rates(params), NN = N * N;
  let coh = 0, deph = 0, trap = 0, lossN = 0;
  for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) {
    let ca = 0, cb = 0;
    for (let k = 0; k < N; k++) { ca += H[m][k] * y[k * N + n] - y[m * N + k] * H[k][n]; cb += H[m][k] * y[NN + k * N + n] - y[NN + m * N + k] * H[k][n]; }
    coh += ca * ca + cb * cb;
    const r2 = y[m * N + n] ** 2 + y[NN + m * N + n] ** 2;
    if (m !== n) deph += gamma * gamma * r2;
    const ks = 0.5 * kappa * ((m === SINK) + (n === SINK));
    trap += ks * ks * r2; lossN += loss * loss * r2;
  }
  return { coherent: Math.sqrt(coh), dephasing: Math.sqrt(deph), trapping: Math.sqrt(trap), loss: Math.sqrt(lossN) };
}

/** classical hopping time course p_RC(t) on a grid, via expm of the augmented rate matrix */
function hoppingCurve(params, dt, tEnd) {
  const K = hoppingGenerator(params), { kappa, loss } = rates(params), A = Array.from({ length: N + 2 }, () => new Float64Array(N + 2));
  for (let i = 0; i < N; i++) { for (let j = 0; j < N; j++) A[i][j] = K[i][j] * dt; A[N][i] = (i === SINK ? kappa : 0) * dt; A[N + 1][i] = loss * dt; }
  const E = expm(A);
  let p = Float64Array.from([...pops(initialState(params.init)), 0, 0]);
  const out = [[0, p[N]]];
  for (let k = 1; k * dt <= tEnd + 1e-12; k++) {
    p = Float64Array.from(E, row => row.reduce((s, v, j) => s + v * p[j], 0));
    out.push([k * dt, p[N]]);
  }
  return out;
}

/** η(γ) curves for the efficiency figure (Lindblad and classical hopping), log-spaced γ */
function efficiencyScan(params, { from = 1e-3, to = 1e5, n = 81 } = {}) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const gamma = from * (to / from) ** (i / (n - 1));
    out.push([gamma, efficiency({ ...params, gamma }).eta, hoppingEfficiency({ ...params, gamma }).eta]);
  }
  return out;
}

// ------------------------------------------------------------------ independent references for verify()
/** complex matrix helpers (arrays of {re, im} flattened as [re, im] pairs) for the generic Lindblad form */
function cmat(n) { return { n, re: new Float64Array(n * n), im: new Float64Array(n * n) }; }
function cmul(A, B) {
  const n = A.n, C = cmat(n);
  for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) {
    const ar = A.re[i * n + k], ai = A.im[i * n + k]; if (!ar && !ai) continue;
    for (let j = 0; j < n; j++) { const br = B.re[k * n + j], bi = B.im[k * n + j]; C.re[i * n + j] += ar * br - ai * bi; C.im[i * n + j] += ar * bi + ai * br; }
  }
  return C;
}
function cdag(A) { const n = A.n, C = cmat(n); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { C.re[i * n + j] = A.re[j * n + i]; C.im[i * n + j] = -A.im[j * n + i]; } return C; }
function cadd(A, B, s = 1) { const C = cmat(A.n); for (let i = 0; i < A.re.length; i++) { C.re[i] = A.re[i] + s * B.re[i]; C.im[i] = A.im[i] + s * B.im[i]; } return C; }
function cscale(A, s) { const C = cmat(A.n); for (let i = 0; i < A.re.length; i++) { C.re[i] = s * A.re[i]; C.im[i] = s * A.im[i]; } return C; }
const ctimesI = A => { const C = cmat(A.n); C.re.set(A.im.map(v => -v)); C.im.set(A.re); return C; };

/**
 * Liouvillian on the full 9-level space (7 sites, sink s = 7, ground g = 8) built from the textbook
 * operator form D[L]ρ = LρL† − ½{L†L, ρ} with jump operators √γ P_m, √κ |s⟩⟨3|, √Γ |g⟩⟨m| —
 * a different code path from the element-form generator used by the simulation.
 */
function genericLiouvillian(params) {
  const n = 9, H = cmat(n), Hs = hamiltonian(), { gamma, kappa, loss } = rates(params);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) H.re[i * n + j] = Hs[i][j];
  const jumps = [];
  const op = (i, j, a) => { const L = cmat(n); L.re[i * n + j] = a; return L; };
  for (let m = 0; m < N; m++) jumps.push(op(m, m, Math.sqrt(gamma)), op(8, m, Math.sqrt(loss)));
  jumps.push(op(7, SINK, Math.sqrt(kappa)));
  const LdL = jumps.map(L => [L, cdag(L), cmul(cdag(L), L)]);
  const G = rho => {
    let out = ctimesI(cadd(cmul(H, rho), cmul(rho, H), -1));     // i[H, ρ]
    out = cscale(out, -1);                                        // −i[H, ρ]
    for (const [L, Ld, LdLm] of LdL) {
      out = cadd(out, cmul(cmul(L, rho), Ld));
      out = cadd(out, cadd(cmul(LdLm, rho), cmul(rho, LdLm)), -0.5);
    }
    return out;
  };
  const dim = 2 * n * n, cols = [];
  for (let j = 0; j < dim; j++) {
    const rho = cmat(n); if (j < n * n) rho.re[j] = 1; else rho.im[j - n * n] = 1;
    const d = G(rho); cols.push(Float64Array.from([...d.re, ...d.im]));
  }
  return Array.from({ length: dim }, (_, i) => Float64Array.from(cols, col => col[i]));
}
/** y-vector (7×7 + sink + ground) → 9×9 real-stacked vector, and back */
function toFull(y) {
  const n = 9, v = new Float64Array(2 * n * n);
  for (let m = 0; m < N; m++) for (let k = 0; k < N; k++) { v[m * n + k] = y[m * N + k]; v[n * n + m * n + k] = y[N * N + m * N + k]; }
  v[7 * n + 7] = y[98]; v[8 * n + 8] = y[99];
  return v;
}

function runRK4(params, tEnd, h) {
  const s = odeStepper({ f: makeRhs(params), y0: initialState(params.init), method: 'rk4', h });
  s.advanceTo(tEnd, Infinity, { exact: true });
  return s;
}
const maxDiff = (a, b) => a.reduce((m, v, i) => Math.max(m, Math.abs(v - b[i])), 0);

function verify({ log } = {}) {
  const checks = [], notes = [];
  const base = { gamma: 3, init: '1', kappa: 1, tauLoss: 1, tMax: 60 };
  const fmt = (x, d = 1) => x.toExponential(d);

  // 1. γ = 0, κ = Γ = 0: RK4 against the exact unitary evolution ρ(t) = Uρ₀U†, U = e^{−iHt} via expm
  log?.('unitary limit vs expm');
  {
    const p = { ...base, gamma: 0, kappa: 0, tauLoss: Infinity };
    const H = hamiltonian(), t = 1.0, M = Array.from({ length: 2 * N }, () => new Float64Array(2 * N));
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { M[i][j + N] = H[i][j] * t; M[i + N][j] = -H[i][j] * t; }
    const E = expm(M);   // [x; y] ↦ e^{Mt}[x; y] for ψ = x + iy,  dψ/dt = −iHψ
    const x = Array.from({ length: N }, (_, i) => E[i][0]), yv = Array.from({ length: N }, (_, i) => E[i + N][0]);
    const ref = new Float64Array(2 * N * N + 2);
    for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) {   // ρ = ψψ†
      ref[m * N + n] = x[m] * x[n] + yv[m] * yv[n];
      ref[N * N + m * N + n] = yv[m] * x[n] - x[m] * yv[n];
    }
    // Tolerance from the claim: populations are shown to 10⁻⁴ (0.01 %), so 10⁻⁶ leaves a factor 100.
    const run = runRK4(p, t, 1e-3), half = runRK4(p, t, 5e-4);
    const err = maxDiff(run.y.subarray(0, 98), ref.subarray(0, 98)), errH = maxDiff(half.y.subarray(0, 98), ref.subarray(0, 98));
    checks.push({ label: 'γ = κ = Γ = 0: RK4 (h = 1 fs) vs exact unitary e^{−iHt}ρ₀e^{iHt} (expm), t = 1 ps', value: `max |Δρ_mn| = ${fmt(err)} (display resolution 10⁻⁴)`, pass: err < 1e-6 });
    const ord = Math.log2(err / errH);
    checks.push({ label: 'Error against the exact solution, h = 1 fs → 0.5 fs: measured order', value: `p = ${ord.toFixed(2)} (${fmt(err)} → ${fmt(errH)})`, pass: Math.abs(ord - 4) < 0.3 });
    // purity stays 1 in the coherent limit
    let pur = 0; for (let i = 0; i < 98; i++) pur += run.y[i] ** 2;   // tr ρ² = Σ|ρ_mn|²
    checks.push({ label: 'Coherent limit keeps the state pure: tr ρ² at 1 ps', value: `|1 − tr ρ²| = ${fmt(Math.abs(1 - pur))}`, pass: Math.abs(1 - pur) < 1e-6 });
  }

  // 2. full open system: RK4 vs expm of a Liouvillian built independently from the operator form
  log?.('Lindblad vs expm(𝓛t)');
  for (const g of [0, 3, 300]) {
    const p = { ...base, gamma: g }, t = 2.0, h = stepSize(p);
    const Lfull = genericLiouvillian(p).map(r => r.map(v => v * t));
    const E = expm(Lfull), v0 = toFull(initialState(p.init));
    const ref = E.map(row => row.reduce((s, v, j) => s + v * v0[j], 0));
    const got = toFull(runRK4(p, t, h).y);
    const err = maxDiff(got, ref);
    checks.push({ label: `Lindblad, γ = ${g} ps⁻¹: RK4 vs exp(𝓛t)ρ₀ with 𝓛 from the operator form LρL† − ½{L†L, ρ}, t = 2 ps`, value: `max |Δ| = ${fmt(err)} (h = ${(h * 1e3).toPrecision(2)} fs)`, pass: err < 1e-6 });
