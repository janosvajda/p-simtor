.psim-intro { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: 14px/1.55 var(--sans); color: var(--ink-2); }
.psim-side > .psim-intro { margin: 14px 16px 4px; }
.psim-intro b { display: block; font: 600 11px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

.psim-intro li::before { content: '→ '; color: var(--accent); }

.psim-intro.collapsed ul { display: none; }
.psim-more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: 500 12.5px var(--sans); cursor: pointer; }

.psim-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, var(--stage)); }
.psim-action { padding: 9px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 16%, transparent);

.psim-clock[hidden] { display: none; }
.psim-clock { display: grid; line-height: 1.15; padding: 0 8px; min-width: 0; max-width: 220px; }
.psim-clock .dim { font: 10.5px var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-clock b { font: 500 15px var(--mono); color: var(--ink); white-space: nowrap; }

.psim-timeline { flex: 1 1 200px; min-width: 120px; padding: 0 10px; font: 10.5px var(--mono); color: var(--muted); position: relative; }
.psim-timeline .ticks { position: relative; height: 17px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .bar::before { content: ''; position: absolute; inset: -8px 0; }   /* a taller hit area */
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }
.psim-timeline .m.measured, .psim-tlrow i.measured { background: var(--good, #4cc38a); }
.psim-timeline .lab.measured { color: var(--good, #4cc38a); }
.psim-timeline .m.requested, .psim-tlrow i.requested { background: var(--warn, #e0a030); }
.psim-timeline .lab.requested { color: var(--warn, #e0a030); }
.psim-tlrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: baseline; margin: 6px 0; font-size: 12px; }
.psim-tlrow i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.psim-tlrow code { font: 12px var(--mono); color: var(--ink); }
.psim-tlrow small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }

  .psim-scene:has(.psim-actions) > .psim-view { height: max(260px, calc(100svh - 64px - 132px - 26px - 62px)); }   /* the action row fits too */
  .psim-intro { padding: 12px 14px; font-size: 13.5px; }

  .psim-transport { flex-wrap: wrap; row-gap: 2px; padding: 6px 8px; }

}

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */
function createSphereRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;
void main() {
  vec3 c = (uView * vec4(aCenter, 1.0)).xyz;
  float d = length(c), r = aRadius;
  float s = r * d / sqrt(max(d * d - r * r, 1e-12)) * 1.05;
  vec3 q = c + vec3(aCorner * s, 0.0);
  vPos = q; vCenter = c; vRadius = r; vColor = aColor; vEmit = aEmit;
  gl_Position = uProj * vec4(q, 1.0);
}`, `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;
out vec4 frag;

  vec3 dir = normalize(vPos);

  float k = vEmit > 0.5 ? 1.0 : uAmbient + (1.0 - uAmbient) * max(dot(n, l), 0.0);
  vec4 clip = uProj * vec4(h, 1.0);
  gl_FragDepth = clip.z / clip.w * 0.5 + 0.5;
  frag = vec4(vColor * k, 1.0);
}`);
  const vao = gl.createVertexArray(), corner = gl.createBuffer(), inst = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);
  const stride = 8 * 4;
  for (const [name, size, off] of [['aCenter', 3, 0], ['aRadius', 1, 3], ['aColor', 3, 4], ['aEmit', 1, 7]]) {
    const loc = gl.getAttribLocation(p, name);

    draw(camera, spheres, { aspect, light = { direction: [1, 0, 0] }, ambient = 0.08 } = {}) {
      if (!spheres.length) return;
      const t = camera.target, data = new Float32Array(8 * spheres.length);
      spheres.forEach((sp, i) => {
        const c = rgb(sp.color ?? '#cfd8e3');
        data.set([sp.center[0] - t[0], sp.center[1] - t[1], sp.center[2] - t[2], sp.radius, c[0], c[1], c[2], sp.emissive ? 1 : 0], 8 * i);
      });
      const { view, proj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight, { relative: true });
      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, inst); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
      gl.uniformMatrix4fv(u.uView, false, view); gl.uniformMatrix4fv(u.uProj, false, proj);
      const point = Array.isArray(light);
      const L = point ? light.map((v, k) => v - t[k]) : light.direction;
      // light position (point) or direction (parallel) into view space
      const lv = point
        ? [0, 1, 2].map(r => view[r] * L[0] + view[4 + r] * L[1] + view[8 + r] * L[2] + view[12 + r])
        : [0, 1, 2].map(r => view[r] * L[0] + view[4 + r] * L[1] + view[8 + r] * L[2]);
      gl.uniform3f(u.uLight, ...lv); gl.uniform1f(u.uPoint, point ? 1 : 0); gl.uniform1f(u.uAmbient, ambient);
      gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, spheres.length);
      gl.bindVertexArray(null);
    },
  };
}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.
 * Dashed lines are for reference overlays (analytic curves), solid for computed paths.
 */
function createLineRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;
uniform mat4 uVP; uniform vec2 uViewport; uniform float uWidth;
out float vS; out vec4 vC;
void main() {
  vec4 a = uVP * vec4(aA, 1.0), b = uVP * vec4(aB, 1.0);
  vec4 me = aCorner.x < 0.5 ? a : b;
  vec2 sa = a.xy / max(a.w, 1e-6) * uViewport, sb = b.xy / max(b.w, 1e-6) * uViewport;
  vec2 d = sb - sa; float len = length(d);
  vec2 nrm = len > 1e-6 ? vec2(-d.y, d.x) / len : vec2(0.0, 1.0);
  vec2 off = nrm * aCorner.y * uWidth / uViewport;
  gl_Position = vec4(me.xy + off * me.w, me.z, me.w);
  vS = aCorner.x < 0.5 ? aS.x : aS.y; vC = aC;
}`, `#version 300 es
precision highp float;
in float vS; in vec4 vC; uniform float uOpacity; uniform vec2 uDash;
out vec4 frag;
void main() {
  if (uDash.x > 0.0 && mod(vS, uDash.x + uDash.y) > uDash.x) discard;
  float a = vC.a * uOpacity;
  frag = vec4(vC.rgb * a, a);
}`);
  const vao = gl.createVertexArray(), corner = gl.createBuffer(), inst = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 0, 1, 1, -1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);
  for (const [name, size, off] of [['aA', 3, 0], ['aB', 3, 3], ['aS', 2, 6], ['aC', 4, 8]]) {
    const loc = gl.getAttribLocation(p, name);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 48, off * 4); gl.vertexAttribDivisor(loc, 1);
  }
  gl.bindVertexArray(null);
  let lines = [];   // rebuilt each draw: the camera target (the float64 origin) may move
  let scratch = new Float32Array(0);
  return {
    update(data) { lines = Array.isArray(data) && data.length && typeof data[0] !== 'number' ? data : [data]; },
    draw(camera, { aspect, width = 2, color = '#9fb3c8', opacity = 1, dash = null, depthTest = true } = {}) {
      const t = camera.target;
      // segments relative to the camera target (float64 subtraction), with cumulative length for dashes
      const pts = l => (Array.isArray(l) || ArrayBuffer.isView(l) ? l : l.points);
      let n = 0;
      for (const l of lines) n += Math.max(0, Math.floor(pts(l).length / 3) - 1);
      if (!n) return;
      {
        if (scratch.length < 12 * n) scratch = new Float32Array(Math.max(12 * n, 2 * scratch.length));
        const buf = scratch, base = rgb(color), t0 = t[0], t1 = t[1], t2 = t[2];
        let o = 0;
        for (const line of lines) {
          const l = pts(line), c = line.color ? rgb(line.color) : base, op = line.opacity ?? 1;
          let s = 0;
          for (let i = 0; i + 5 < l.length; i += 3) {
            const len = Math.hypot(l[i + 3] - l[i], l[i + 4] - l[i + 1], l[i + 5] - l[i + 2]);
            buf[o] = l[i] - t0; buf[o + 1] = l[i + 1] - t1; buf[o + 2] = l[i + 2] - t2;
            buf[o + 3] = l[i + 3] - t0; buf[o + 4] = l[i + 4] - t1; buf[o + 5] = l[i + 5] - t2;
            buf[o + 6] = s; buf[o + 7] = s + len; buf[o + 8] = c[0]; buf[o + 9] = c[1]; buf[o + 10] = c[2]; buf[o + 11] = op;
            o += 12; s += len;
          }
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, inst); gl.bufferData(gl.ARRAY_BUFFER, buf.subarray(0, 12 * n), gl.DYNAMIC_DRAW);
      }
      const dpr = pixelRatio(gl);
      const { viewProj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight, { relative: true });
      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.uniformMatrix4fv(u.uVP, false, viewProj);
      gl.uniform2f(u.uViewport, gl.drawingBufferWidth / 2, gl.drawingBufferHeight / 2);
      gl.uniform1f(u.uWidth, width * dpr / 2);
      gl.uniform1f(u.uOpacity, opacity);
      gl.uniform2f(u.uDash, dash?.[0] ?? 0, dash?.[1] ?? 0);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      if (depthTest) { gl.enable(gl.DEPTH_TEST); gl.depthMask(false); } else gl.disable(gl.DEPTH_TEST);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
      gl.depthMask(true);
      gl.bindVertexArray(null);
    },
  };
}

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */
const geometry = (() => {
  const make = (pos, nrm, idx) => ({ positions: Float32Array.from(pos), normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) });
  const quad = (P, N, I, a, b, c, d, n) => { const o = P.length / 3; P.push(...a, ...b, ...c, ...d); for (let k = 0; k < 4; k++) N.push(...n); I.push(o, o + 1, o + 2, o, o + 2, o + 3); };
  return {
    box(sx = 1, sy = 1, sz = 1) {
      const x = sx / 2, y = sy / 2, z = sz / 2, P = [], N = [], I = [];
      quad(P, N, I, [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1]);
      quad(P, N, I, [-x, y, -z], [x, y, -z], [x, -y, -z], [-x, -y, -z], [0, 0, -1]);
      quad(P, N, I, [x, -y, -z], [x, y, -z], [x, y, z], [x, -y, z], [1, 0, 0]);
      quad(P, N, I, [-x, y, -z], [-x, -y, -z], [-x, -y, z], [-x, y, z], [-1, 0, 0]);
      quad(P, N, I, [x, y, -z], [-x, y, -z], [-x, y, z], [x, y, z], [0, 1, 0]);
      quad(P, N, I, [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [0, -1, 0]);
      return make(P, N, I);
    },
    cylinder(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [];
      for (let i = 0; i < n; i++) {
        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        const o = P.length / 3;
        P.push(r * c0, r * s0, 0, r * c1, r * s1, 0, r * c1, r * s1, h, r * c0, r * s0, h); N.push(c0, s0, 0, c1, s1, 0, c1, s1, 0, c0, s0, 0);
        I.push(o, o + 1, o + 2, o, o + 2, o + 3);
        for (const [zz, nz] of [[h, 1], [0, -1]]) { const q = P.length / 3; P.push(0, 0, zz, r * c0, r * s0, zz, r * c1, r * s1, zz); N.push(0, 0, nz, 0, 0, nz, 0, 0, nz); I.push(...(nz > 0 ? [q, q + 1, q + 2] : [q, q + 2, q + 1])); }
      }
      return make(P, N, I);
    },
    cone(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [], k = r / h;
      for (let i = 0; i < n; i++) {
        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, am = (a0 + a1) / 2, o = P.length / 3;
        const nn = a => { const l = Math.hypot(1, k); return [Math.cos(a) / l, Math.sin(a) / l, k / l]; };
        P.push(r * Math.cos(a0), r * Math.sin(a0), 0, r * Math.cos(a1), r * Math.sin(a1), 0, 0, 0, h); N.push(...nn(a0), ...nn(a1), ...nn(am));
        I.push(o, o + 1, o + 2);
        const q = P.length / 3; P.push(0, 0, 0, r * Math.cos(a1), r * Math.sin(a1), 0, r * Math.cos(a0), r * Math.sin(a0), 0); N.push(0, 0, -1, 0, 0, -1, 0, 0, -1); I.push(q, q + 1, q + 2);
      }
      return make(P, N, I);
    },
    sphere(r = 0.5, n = 24) {
      const P = [], N = [], I = [];
      for (let j = 0; j <= n; j++) {for (let i = 0; i <= 2 * n; i++) {
        const th = Math.PI * j / n, ph = Math.PI * i / n, v = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
        P.push(r * v[0], r * v[1], r * v[2]); N.push(...v);
      }}
      const w = 2 * n + 1;
      for (let j = 0; j < n; j++) for (let i = 0; i < 2 * n; i++) { const a = j * w + i; I.push(a, a + w, a + 1, a + 1, a + w, a + w + 1); }
      return make(P, N, I);
    },
    disc(r = 0.5, n = 48) {
      const P = [0, 0, 0], N = [0, 0, 1], I = [];
      for (let i = 0; i <= n; i++) { const a = 2 * Math.PI * i / n; P.push(r * Math.cos(a), r * Math.sin(a), 0); N.push(0, 0, 1); if (i) I.push(0, i, i + 1); }
      return make(P, N, I);
    },
    plane(sx = 1, sy = 1) { const P = [], N = [], I = []; quad(P, N, I, [-sx / 2, -sy / 2, 0], [sx / 2, -sy / 2, 0], [sx / 2, sy / 2, 0], [-sx / 2, sy / 2, 0], [0, 0, 1]); return make(P, N, I); },
    /**
     * Parametric surface: point(u, v) → [x, y, z] over u ∈ [u0, u1], v ∈ [v0, v1] on an nu × nv grid;
     * optional value(u, v) per vertex (for colormapped meshes). Normals from central differences.
     * A polar plot r(θ, φ): point = (θ, φ) => [r·sinθ·cosφ, r·sinθ·sinφ, r·cosθ] over [0, π] × [0, 2π].
     */
    surface(point, { u: [u0, u1] = [0, 1], v: [v0, v1] = [0, 1], nu = 64, nv = 64, value } = {}) {
      const P = [], N = [], I = [], V = [];
      const du = (u1 - u0) / nu, dv = (v1 - v0) / nv, eps = 1e-4;
      for (let j = 0; j <= nv; j++) {for (let i = 0; i <= nu; i++) {
        const uu = u0 + i * du, vv = v0 + j * dv, p0 = point(uu, vv);
        const a = point(Math.min(u1, uu + eps * du), vv), b = point(Math.max(u0, uu - eps * du), vv);
        const c = point(uu, Math.min(v1, vv + eps * dv)), d = point(uu, Math.max(v0, vv - eps * dv));
        const tu = [a[0] - b[0], a[1] - b[1], a[2] - b[2]], tv = [c[0] - d[0], c[1] - d[1], c[2] - d[2]];
        let n = [tu[1] * tv[2] - tu[2] * tv[1], tu[2] * tv[0] - tu[0] * tv[2], tu[0] * tv[1] - tu[1] * tv[0]];
        let l = Math.hypot(...n);
        if (!(l > 1e-300)) { n = [p0[0], p0[1], p0[2]]; l = Math.hypot(...n) || 1; }   // poles of a sphere: radial
        P.push(...p0); N.push(n[0] / l, n[1] / l, n[2] / l);
        if (value) V.push(value(uu, vv));
      }}
      for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = j * (nu + 1) + i; I.push(a, a + 1, a + nu + 2, a, a + nu + 2, a + nu + 1); }
      const g = make(P, N, I);
      if (value) g.values = Float32Array.from(V);
      return g;
    },
    arrow(length = 1, { shaft = 0.03 * length, head = 0.08 * length, headLength = 0.22 * length, n = 24 } = {}) {
      const hl = Math.min(headLength, length), a = this.cylinder(shaft, length - hl, n), b = this.cone(head, hl, n);
      const off = a.positions.length / 3;
      return {
        positions: Float32Array.from([...a.positions, ...Array.from(b.positions, (v, i) => (i % 3 === 2 ? v + length - hl : v))]),
        normals: Float32Array.from([...a.normals, ...b.normals]),
        indices: Uint32Array.from([...a.indices, ...Array.from(b.indices, i => i + off)]),
      };
    },
  };
})();

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */
function alignZ(dir) {
  const l = Math.hypot(...dir);
  if (!(l > 0)) throw new Error('alignZ: direction must be non-zero');
  const [x, y, z] = dir.map(v => v / l);
  if (z < -1 + 1e-12) return [1, 0, 0, 0, -1, 0, 0, 0, -1];
  // Rodrigues rotation about ẑ × d by the angle between them
  const k = 1 / (1 + z);
  return [1 - x * x * k, -x * y * k, x, -x * y * k, 1 - y * y * k, y, -x, -y, z];
}

/**
 * Point lists for createLineRenderer.update(): each returns one polyline [x,y,z, …] or an array of them.
 *   circle(center, normal, r, n)        closed circle (great circles, cone rims, orbits)
 *   boxEdges([min, max])                the 12 edges of a box, as separate segments
 *   grid(dims, { spacing, origin })     all lattice lines of a 1–3D grid with dims points per axis
 *   arrow(from, to, { head, normal })   shaft and a two-stroke head in the plane containing normal
 */
const polylines = {
  circle(center = [0, 0, 0], normal = [0, 0, 1], r = 1, n = 96) {
    const R = alignZ(normal), out = [];
    for (let i = 0; i <= n; i++) {
      const a = 2 * Math.PI * i / n, p = [r * Math.cos(a), r * Math.sin(a), 0];
      for (let k = 0; k < 3; k++) out.push(center[k] + R[3 * k] * p[0] + R[3 * k + 1] * p[1] + R[3 * k + 2] * p[2]);
    }
    return out;
  },
  boxEdges([lo, hi]) {
    const c = i => [i & 1 ? hi[0] : lo[0], i & 2 ? hi[1] : lo[1], i & 4 ? hi[2] : lo[2]];
    const out = [];
    for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b)) out.push([...c(i), ...c(i | b)]);
    return out;
  },
  grid(dims, { spacing = 1, origin = [0, 0, 0] } = {}) {
    const d = [...dims, 1, 1].slice(0, 3), sp = typeof spacing === 'number' ? [spacing, spacing, spacing] : spacing, out = [];
    for (let ax = 0; ax < dims.length; ax++) {
      const [b, c] = [0, 1, 2].filter(k => k !== ax);
      for (let i = 0; i < d[b]; i++) {for (let j = 0; j < d[c]; j++) {
        const p = [0, 0, 0], q = [0, 0, 0];
        p[b] = q[b] = i; p[c] = q[c] = j; p[ax] = 0; q[ax] = d[ax] - 1;
        out.push([0, 1, 2].map(k => origin[k] + p[k] * sp[k]).concat([0, 1, 2].map(k => origin[k] + q[k] * sp[k])));
      }}
    }
    return out;
  },
  arrow(from, to, { head = 0.2, normal = [0, 0, 1] } = {}) {
    const d = [0, 1, 2].map(k => to[k] - from[k]), L = Math.hypot(...d);
    if (!(L > 0)) return [[...from, ...to]];
    let side = [d[1] * normal[2] - d[2] * normal[1], d[2] * normal[0] - d[0] * normal[2], d[0] * normal[1] - d[1] * normal[0]];
    if (Math.hypot(...side) < 1e-9 * L) side = Math.abs(d[0]) < 0.9 * L ? [0, d[2], -d[1]] : [-d[2], 0, d[0]];
    const sl = Math.hypot(...side), h = head * L;
    const wing = sgn => [0, 1, 2].map(k => to[k] - d[k] / L * h + sgn * side[k] / sl * h * 0.5);
    return [[...from, ...to], [...wing(1), ...to, ...wing(-1)]];
  },
};

/**

    for (let it = 0; it < 100; it++) {

      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);
}

// ---------------------------------------------------------------- linear algebra

/** Solve a tridiagonal system (Thomas algorithm). a: sub, b: diag, c: super, d: rhs. Works for complex via callers. */
function solveTridiagonal(a, b, c, d) {
  const n = b.length, cp = new Float64Array(n), dp = new Float64Array(n), x = new Float64Array(n);
  cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
  for (let i = 1; i < n; i++) {
    const m = b[i] - a[i] * cp[i - 1];
    cp[i] = c[i] / m;
    dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
  }
  x[n - 1] = dp[n - 1];
  for (let i = n - 2; i >= 0; i--) x[i] = dp[i] - cp[i] * x[i + 1];
  return x;
}

/**
 * All eigenvalues and eigenvectors of a real symmetric tridiagonal matrix (implicit QL with
 * Wilkinson shifts; Numerical Recipes "tqli"). diag: n diagonal entries; off: n−1 entries
 * coupling i and i+1. Returns { values, vectors } with vectors[i] the unit eigenvector of
 * values[i] (unsorted). Cost O(n³) with eigenvectors: fine to n ≈ 500 in a browser.
 * { vectors: false } returns eigenvalues only, in O(n²) (n = 10⁴ in ~3 s); for the lowest few use
 * lowestTridiagonal (bisection, O(n) per level).
 */
function eigenTridiagonal(diag, off, { vectors: wantVectors = true } = {}) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('eigenTridiagonal: off must have n − 1 entries');
  const d = Float64Array.from(diag), e = new Float64Array(n);
  e.set(off);
  const z = wantVectors ? new Float64Array(n * n) : null;
  if (z) for (let i = 0; i < n; i++) z[i * n + i] = 1;
  for (let l = 0; l < n; l++) {
    let iter = 0, m;
    do {
      for (m = l; m < n - 1; m++) {
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= Number.EPSILON * dd) break;
      }
      if (m !== l) {
        if (iter++ === 60) throw new Error('eigenTridiagonal: no convergence');
        let g = (d[l + 1] - d[l]) / (2 * e[l]);
        let r = Math.hypot(g, 1);
        g = d[m] - d[l] + e[l] / (g + (g >= 0 ? r : -r));
        let s = 1, c = 1, p = 0, i;
        for (i = m - 1; i >= l; i--) {
          let f = s * e[i];
          const b = c * e[i];
          r = Math.hypot(f, g);
          e[i + 1] = r;
          if (r === 0) { d[i + 1] -= p; e[m] = 0; break; }
          s = f / r; c = g / r;
          g = d[i + 1] - p;
          r = (d[i] - g) * s + 2 * c * b;
          p = s * r;
          d[i + 1] = g + p;
          g = c * r - b;
          if (z) {for (let k = 0; k < n; k++) {
            f = z[k * n + i + 1];
            z[k * n + i + 1] = s * z[k * n + i] + c * f;
            z[k * n + i] = c * z[k * n + i] - s * f;
          }}
        }
        if (r === 0 && i >= l) continue;
        d[l] -= p; e[l] = g; e[m] = 0;
      }
    } while (m !== l);
  }
  if (!z) return { values: Array.from(d) };
  const vectors = Array.from({ length: n }, (_v, i) => Float64Array.from({ length: n }, (_w, k) => z[k * n + i]));
  return { values: Array.from(d), vectors };
}

/**
 * The k lowest eigenvalues of a symmetric tridiagonal matrix by Sturm-sequence bisection:
 * O(n · 64) per eigenvalue, accurate to round-off, exact ordering (no missed or merged levels,
 * also for near-degenerate tunnelling doublets). Returns ascending values.
 */
function lowestTridiagonal(diag, off, k) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('lowestTridiagonal: off must have n − 1 entries');
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {                                 // Gershgorin bounds
    const r = (i > 0 ? Math.abs(off[i - 1]) : 0) + (i < n - 1 ? Math.abs(off[i]) : 0);
    lo = Math.min(lo, diag[i] - r); hi = Math.max(hi, diag[i] + r);
  }
  const e2 = Float64Array.from(off, v => v * v), tiny = Number.MIN_VALUE * 1e10 + 1e-300;
  const below = x => {                                           // number of eigenvalues < x
    let c = 0, q = diag[0] - x;
    if (q < 0) c++;
    for (let i = 1; i < n; i++) {
      q = diag[i] - x - e2[i - 1] / (q !== 0 ? q : tiny);
      if (q < 0) c++;
    }
    return c;
  };
  const out = [];
  for (let j = 0; j < Math.min(k, n); j++) {
    let a = j ? out[j - 1] : lo, b = hi;
    for (let it = 0; it < 200 && b - a > 2 * Number.EPSILON * Math.max(Math.abs(a), Math.abs(b), 1e-300); it++) {
      const m = 0.5 * (a + b);
      if (m === a || m === b) break;
      if (below(m) > j) b = m; else a = m;
    }
    out.push(0.5 * (a + b));
  }
  return out;
}

/** Least-squares fit y ≈ a + b x. Returns { a, b, r2 }. */
function linearFit(xs, ys) {
  // two-pass (centred) sums: no cancellation when x has a large offset (e.g. timestamps)
  const n = xs.length;
  let mx = 0, my = 0;
  for (let i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; }
  mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  const b = sxy / sxx, a = my - b * mx;
  const r2 = syy === 0 ? 1 : (sxy * sxy) / (sxx * syy);
  return { a, b, r2 };
}

/**
 * Mean and standard error of a correlated series by binning (blocking) analysis. Returns the
 * largest error over block sizes with ≥ minBins blocks: conservative (≈ 10 % high for
 * uncorrelated data). Series too short for blocking fall back to the naive standard error.
 */
function meanWithError(xs, minBins = 16) {

// ================================================================= Hermite

/**
 * Physicists' Hermite polynomial H_n(x) (H₀ = 1, H₁ = 2x, H_{k+1} = 2xH_k − 2kH_{k−1}).

 * ψ(x) = (mω/ħ)^{1/4} ψ_n(ξ). Normalised three-term recurrence with a running exponent, so it

// ================================================================= hypergeometric functions

const CANCEL = 1e4;     // accept a sum only if its largest term is ≤ 1e4 × |sum| (≤ 4 digits lost)

/**
 * Jacobi elliptic functions sn(u|m), cn(u|m), dn(u|m) and the amplitude am(u|m) (sn = sin am,
 * cn = cos am), parameter m = k² (A&S ch. 16 convention), any real u and m.
 * 0 < m < 1: descending Landen transformation (A&S 16.4); m = 0, 1: circular / hyperbolic limits;
 * m > 1 and m < 0: reciprocal- and negative-parameter transformations (A&S 16.11, 16.10).
 * am is continuous and increasing for m < 1 (am(u + 2K) = am(u) + π); for m > 1 it is asin(sn).
 * Accuracy ~1e-15 absolute for sn, cn, dn with |u| ≲ 1e3·K (phase error grows ∝ |u|·eps).
 * Returns { sn, cn, dn, am }.
 */

  finite('jacobiElliptic', { u, m });

}

// ================================================================= Γ-related

/**
 * Digamma ψ(x) = Γ′(x)/Γ(x), real x ≠ 0, −1, −2, … (throws at the poles). Reflection
 * ψ(1−x) − ψ(x) = π cot πx for x < 0, upward recurrence to x ≥ 12, then the asymptotic series
 * (DLMF 5.11.2). Accuracy ~1e-15 absolute·(1 + |ln x|); relative near the positive root 1.4616…
 * is limited to the absolute error.
 */
function digamma(x) {
  finite('digamma', { x });
  need(!isNonPosInt(x), `digamma: pole at x = ${x}`);
  if (x < 0) return digamma(1 - x) - Math.PI * cotpi(x);
  let shift = 0, y = x;
  while (y < 12) { shift -= 1 / y; y += 1; }
  const r = 1 / (y * y);
  const series = r * (1 / 12 - r * (1 / 120 - r * (1 / 252 - r * (1 / 240 - r * (1 / 132 - r * (691 / 32760 - r / 12))))));
  return shift + Math.log(y) - 0.5 / y - series;

const STIRLING = [1 / 12, -1 / 360, 1 / 1260, -1 / 1680, 1 / 1188, -691 / 360360, 1 / 156];
/** ln Γ(a + b) − ln Γ(a) for a ≥ 15, b > 0, without cancelling two large ln Γ values (Stirling). */

  for (const c of STIRLING) { corr += c * (pab - pa); pa *= ra; pab *= rab; }
  return (a - 0.5) * Math.log1p(b / a) + b * Math.log(ab) - b + corr;
}

/**
 * ln B(a, b) = ln Γ(a) + ln Γ(b) − ln Γ(a + b), a, b > 0. When max(a, b) ≥ 15 the difference
 * ln Γ(a+b) − ln Γ(max) is formed directly from Stirling's series (no cancellation), so a ≫ b
 * (e.g. Student t with ν ~ 1e9) stays accurate. Absolute accuracy ~eps·(1 + |ln Γ(min(a, b))|).
 */

  finite('logBeta', { a, b });
  need(a > 0 && b > 0, `logBeta: need a, b > 0 (got ${a}, ${b})`);
  const hi = Math.max(a, b), lo = Math.min(a, b);

/**
 * Beta function B(a, b) = Γ(a)Γ(b)/Γ(a+b), a, b > 0. Direct Γ ratio when a + b < 170 (~1e-14
 * relative), otherwise exp(logBeta) (relative error ~eps·|ln B|: ~1e-13 for |ln B| ~ 1e3).
 */

  finite('beta', { a, b });

  if (a + b < 170) return (gamma(a) / gamma(a + b)) * gamma(b);

function betaCF(a, b, x, xc) {
  const tiny = 1e-300, qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = x > 0.5 ? (1 - b + qab * xc) / qap : 1 - qab * x / qap;   // 1 − (a+b)x/(a+1) without cancellation
  if (Math.abs(d) < tiny) d = tiny;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= 100000; m++) {

    c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny;
    c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) return h;

/** I_x(a, b) with the complement xc = 1 − x supplied exactly. */
function incBeta(x, xc, a, b) {

  const front = Math.exp(-logBeta(a, b) + a * lx + b * lxc);

 * Lentz continued fraction with the symmetry I_x(a,b) = 1 − I_{1−x}(b,a) (Numerical Recipes §6.4).
 * Accuracy ~1e-14 for a, b ≲ 100; when both a and b are large (≳ 1e4) the prefactor x^a(1−x)^b/B
 * cancels and the error grows ~eps·min(a, b) (≈1e-12 at 1e4). a ≫ b (large-ν Student t) stays accurate.

/** Two-sided tail I_{ν/(ν+t²)}(ν/2, ½) = P(|T| ≥ |t|). */

    const a = nu / 2, logX = -logRatio;

/**

 * P(T ≤ t). Accuracy ~1e-14 absolute (the small tail itself is accurate relatively: use studentTPValue).

function studentTCdf(t, nu) {

/**
 * p-value of a Student-t statistic with ν > 0 degrees of freedom. tails = 2: P(|T| ≥ |t|);
 * tails = 1: upper tail P(T ≥ t). Small p-values keep full relative accuracy (~1e-13) for ν ≲ 1e6;

// ================================================================= ζ and polylogarithms

const BORWEIN = (() => {                                           // Borwein (2000), algorithm 2, n = 30
  const n = 30, d = [1];

  if (Math.abs(s) < 1e-7) return -0.5 - 0.5 * Math.log(2 * Math.PI) * s - 1.0031782279542925 * s * s;

function polylogLog(s, mu) {

    // Reject this expansion before parameter-rounding error contaminates the result.

/**
 * Polylogarithm Li_s(z) = Σ_{k≥1} z^k/k^s for real order s and real z ≤ 1 (Li_s(1) = ζ(s), s > 1).

 * duplication Li_s(z) + Li_s(−z) = 2^{1−s} Li_s(z²) for −1 < z < −½ with s > 1, the alternating series
 * there for s ≤ 1; Li_s(−1) = −η(s); inversion formulae for z < −1 with integer s (DLMF 25.12.4-type).
 * Li₁(z) = −ln(1 − z). Bose–Einstein integrals: g_s(z) = Li_s(z); Fermi–Dirac: f_s(z) = −Li_s(−z).
 * Accuracy ~1e-14 typically (each path checks its cancellation); orders within ~1e-4 of an integer
 * in the μ-expansion lose digits and throw. Throws for z > 1 (complex), z = 1 with s ≤ 1, and z < −1
 * with non-integer s (unsupported).

  if (z === -1) return -eta(s);

    if (s === 0) return z / (1 - z);

// ================================================================= exponential integrals

/**
 * Generalised exponential integral E_n(x) = ∫₁^∞ e^{−xt} t^{−n} dt, integer n ≥ 0, x ≥ 0
 * (x = 0 needs n ≥ 2: E_n(0) = 1/(n−1)). Series (x ≤ 1) or Lentz continued fraction (x > 1),
 * Numerical Recipes §6.3. Accuracy ~1e-15 relative; underflows to 0 for x ≳ 700.

  if (n === 0) return x === 0 ? Infinity : Math.exp(-x) / x;
  if (x === 0) { need(n >= 2, 'expintEn: E_1(0) diverges'); return 1 / (n - 1); }

    for (let i = 1; i < 10000; i++) {

 * Exponential integral Ei(x) = −PV∫_{−x}^∞ e^{−t}/t dt, real x ≠ 0 (Ei(0) = −Infinity; Ei(x) = −E₁(−x)
 * for x < 0). Positive x: power series γ + ln x + Σ x^k/(k·k!) for x ≤ 40, asymptotic e^x/x Σ k!/x^k
 * beyond. Accuracy ~1e-15 relative (absolute ~1e-16 near the root x₀ = 0.37250741…); overflows to
 * Infinity for x ≳ 710.

  finite('expintEi', { x });

  if (x < 0) return -expintE1(-x);

    let term = 1, sum = 0;

// ================================================================= Dawson's integral

const DAWSON_H = 0.2, DAWSON_C = Array.from({ length: 18 }, (_, i) => Math.exp(-(((2 * i + 1) * DAWSON_H) ** 2)));

 * Dawson's integral F(x) = e^{−x²} ∫₀ˣ e^{t²} dt (= (√π/2) e^{−x²} erfi x), any real x (odd).
 * Power series for |x| < 1, Rybicki's exponentially convergent sampling formula (h = 0.2,
 * truncation error ~e^{−(π/2h)²} ≈ 1e-27) for 1 ≤ |x| ≤ 50, asymptotic series 1/(2x) Σ (2k−1)!!/(2x²)^k
 * beyond. Accuracy ~1e-15 relative. Maximum F = 0.5410442246… at x = 0.9241388730….
 * Appears in plasma dispersion (Re Z), Voigt profiles and ion-acoustic responses.

      sum += term;

    const r = 1 / (2 * ax * ax);
    let term = 1, sum = 1;
    for (let k = 1; k < 40; k++) { term *= (2 * k - 1) * r; sum += term; if (term < 1e-17 * sum) break; }

  need(Number.isFinite(sigmaR) && sigmaR >= 0, 'toomreQ: sigmaR must be finite and ≥ 0');
  need(Number.isFinite(kappa) && kappa >= 0, 'toomreQ: kappa must be finite and ≥ 0');
  positiveFinite(Sigma, 'Sigma', 'toomreQ');
  return sigmaR * kappa / (TOOMRE * G * Sigma);
}

/**
 * Arm number most amplified by swing amplification, m = κ² R / (2π G Σ X) with X = λ_azimuthal/λ_crit
 * ≈ 1–3, peak near X ≈ 2 for a flat rotation curve and Q ≈ 1.5 (Toomre 1981; BT08 §6.3).
 * A rough guide (±1 arm): lighter disks (relative to the halo) make more, thinner arms.
 */
function swingArmNumber(R, kappa, Sigma, X = 2) {
  positiveFinite(R, 'R', 'swingArmNumber'); positiveFinite(kappa, 'kappa', 'swingArmNumber');
  positiveFinite(Sigma, 'Sigma', 'swingArmNumber'); positiveFinite(X, 'X', 'swingArmNumber');
  return kappa * kappa * R / (2 * Math.PI * G * Sigma * X);
}

// ---------------------------------------------------------------- particle-mesh solver

/**
 * Isolated (non-periodic) 2D particle-mesh gravity solver with Plummer softening.
 * Options: grid N (power of two, 8–2048; the FFT mesh is 2N×2N), box (side length, kpc, centred on
 * the origin), softening ε > 0 (kpc; choose ε ≳ h = box/N), Gconst (default galaxy.mjs G).
 * Methods (all allocation-free after construction):
 *   accelerations(x, y, m, n, ax, ay)  deposit + solve + interpolate; overwrites ax, ay ((km/s)²/kpc)
 *   potentials(x, y, m, n, out)        softened potential Φ_self at the particles ((km/s)²; includes the
 *                                      particle's own smoothed cloud, a near-constant offset)
 *   deposit(x, y, m, n) / loadMesh(massGrid), then solveForces() / solvePotential(), then
 *   fieldAt(px, py, out) → out[0..2] = [a_x, a_y, Φ]; Φ only after solvePotential().
 * Accuracy: a few % beyond ~2 cells from a point mass, exact antisymmetry (Newton's third law)
 * to round-off. Mesh node positions: x_i = −box/2 + (i + ½)h.
 */
function createPMSolver({ grid = 128, box, softening, Gconst = G } = {}) {
  const who = 'createPMSolver';
  need(Number.isInteger(grid) && grid >= 8 && grid <= 2048 && (grid & (grid - 1)) === 0, `${who}: grid must be a power of two in [8, 2048]`);
  positiveFinite(box, 'box', who); positiveFinite(softening, 'softening', who); positiveFinite(Gconst, 'Gconst', who);
  const N = grid, M = 2 * N, MM = M * M, h = box / N, invh = 1 / h, x0 = -box / 2 + h / 2, eps2 = softening * softening;
  // Green's functions on the padded mesh: displacement index wraps (k < N → k, k > N → k − M);
  // the never-used displacement ±N is set to zero so the kernels stay exactly odd/even.
  const kRe = new Float64Array(MM), kIm = new Float64Array(MM), pRe = new Float64Array(MM), pIm = new Float64Array(MM);
  for (let j = 0; j < M; j++) {
    const dy = (j < N ? j : j - M) * h;
    for (let i = 0; i < M; i++) {
      if (i === N || j === N) continue;
      const dx = (i < N ? i : i - M) * h, s = 1 / Math.sqrt(dx * dx + dy * dy + eps2), k = i + M * j;
      kRe[k] = -Gconst * dx * s * s * s; kIm[k] = -Gconst * dy * s * s * s; pRe[k] = -Gconst * s;
    }
  }
  fftND(kRe, kIm, [M, M]);                                   // FFT(g_x) + i FFT(g_y): one inverse FFT gives a_x + i a_y
  fftND(pRe, pIm, [M, M]);                                   // even kernel → real transform (imaginary part is round-off)
  const re = new Float64Array(MM), im = new Float64Array(MM), rowRe = new Float64Array(M), rowIm = new Float64Array(M);
  const viewsRe = Array.from({ length: M }, (_, j) => re.subarray(j * M, (j + 1) * M));
  const viewsIm = Array.from({ length: M }, (_, j) => im.subarray(j * M, (j + 1) * M));
  const fx = new Float64Array(N * N), fy = new Float64Array(N * N), phi = new Float64Array(N * N);
  const tmp = new Float64Array(3);
  const columns = (count, inverse) => {
    for (let i = 0; i < count; i++) {
      for (let j = 0, k = i; j < M; j++, k += M) { rowRe[j] = re[k]; rowIm[j] = im[k]; }
      fft(rowRe, rowIm, inverse);
      for (let j = 0, k = i; j < M; j++, k += M) { re[k] = rowRe[j]; im[k] = rowIm[j]; }
    }
  };
  // pruned 2D FFTs: only the first N rows hold mass; only the first N×N outputs are needed
  const forward = () => { for (let j = 0; j < N; j++) fft(viewsRe[j], viewsIm[j], false); columns(M, false); };
  const inverse = () => { for (let j = 0; j < M; j++) fft(viewsRe[j], viewsIm[j], true); columns(N, true); };
  const pm = {
    N, M, h, box, softening, Gconst, x0,
    meshMass: 0, comX: 0, comY: 0, outside: 0, potentialReady: false,
    /** CIC mass assignment of n particles; returns the mass on the mesh. */
    deposit(x, y, m, n) {
      re.fill(0); im.fill(0);
      let mass = 0, sx = 0, sy = 0, out = 0;
      for (let p = 0; p < n; p++) {
        const fxp = (x[p] - x0) * invh, fyp = (y[p] - x0) * invh;
        if (!(fxp >= 0 && fxp < N - 1 && fyp >= 0 && fyp < N - 1)) { out++; continue; }
        const i = fxp | 0, j = fyp | 0, tx = fxp - i, ty = fyp - j, mp = m[p], k = i + M * j;
        re[k] += mp * (1 - tx) * (1 - ty); re[k + 1] += mp * tx * (1 - ty);
        re[k + M] += mp * (1 - tx) * ty; re[k + M + 1] += mp * tx * ty;
        mass += mp; sx += mp * x[p]; sy += mp * y[p];
      }
      pm.meshMass = mass; pm.comX = mass > 0 ? sx / mass : 0; pm.comY = mass > 0 ? sy / mass : 0; pm.outside = out;
      pm.potentialReady = false;
      return mass;
    },
    /** Put node masses (N×N, index i + N·j, M☉) on the mesh directly, e.g. an analytic surface density × h². */
    loadMesh(massGrid) {
      need(massGrid && massGrid.length === N * N, `${who}: loadMesh needs N×N node masses`);
      re.fill(0); im.fill(0);
      let mass = 0, sx = 0, sy = 0;
      for (let j = 0; j < N; j++) {for (let i = 0; i < N; i++) {
        const mp = massGrid[i + N * j];
        need(Number.isFinite(mp), `${who}: loadMesh masses must be finite`);
        re[i + M * j] = mp; mass += mp; sx += mp * (x0 + i * h); sy += mp * (x0 + j * h);
      }}
      pm.meshMass = mass; pm.comX = mass ? sx / mass : 0; pm.comY = mass ? sy / mass : 0; pm.outside = 0;
      pm.potentialReady = false;
      return mass;
    },
    /** Mesh accelerations from the deposited mass (one forward and one inverse pruned FFT). */
    solveForces() {
      forward();
      for (let k = 0; k < MM; k++) {
        const a = re[k], b = im[k], c = kRe[k], d = kIm[k];
        re[k] = a * c - b * d; im[k] = a * d + b * c;
      }
      inverse();
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { fx[i + N * j] = re[i + M * j]; fy[i + N * j] = im[i + M * j]; }
    },
    /** Mesh potential from the deposited mass. Call deposit/loadMesh again before solveForces. */
    solvePotential() {
      forward();
      for (let k = 0; k < MM; k++) { re[k] *= pRe[k]; im[k] *= pRe[k]; }
      inverse();
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) phi[i + N * j] = re[i + M * j];
      pm.potentialReady = true;
    },
    /** CIC-interpolated [a_x, a_y, Φ] at a point; outside the mesh the monopole of the mesh mass. */
    fieldAt(px, py, out = tmp) {
      const fxp = (px - x0) * invh, fyp = (py - x0) * invh;
      if (fxp >= 0 && fxp < N - 1 && fyp >= 0 && fyp < N - 1) {
        const i = fxp | 0, j = fyp | 0, tx = fxp - i, ty = fyp - j, k = i + N * j;
        const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
        out[0] = w00 * fx[k] + w10 * fx[k + 1] + w01 * fx[k + N] + w11 * fx[k + N + 1];
        out[1] = w00 * fy[k] + w10 * fy[k + 1] + w01 * fy[k + N] + w11 * fy[k + N + 1];
        out[2] = w00 * phi[k] + w10 * phi[k + 1] + w01 * phi[k + N] + w11 * phi[k + N + 1];
      } else {
        const dx = px - pm.comX, dy = py - pm.comY, s = 1 / Math.sqrt(dx * dx + dy * dy + eps2), f = -Gconst * pm.meshMass * s * s * s;
        out[0] = f * dx; out[1] = f * dy; out[2] = -Gconst * pm.meshMass * s;
      }
      return out;
    },
    accelerations(x, y, m, n, ax, ay) {
      pm.deposit(x, y, m, n); pm.solveForces();
      for (let p = 0; p < n; p++) { pm.fieldAt(x[p], y[p], tmp); ax[p] = tmp[0]; ay[p] = tmp[1]; }
    },
    potentials(x, y, m, n, out) {
      pm.deposit(x, y, m, n); pm.solvePotential();
      for (let p = 0; p < n; p++) out[p] = pm.fieldAt(x[p], y[p], tmp)[2];
    },
  };
  return pm;
}

// ---------------------------------------------------------------- the self-gravitating disk

/**
 * A razor-thin exponential stellar disk with self-gravity (PM) in a rigid halo/bulge from galaxy.mjs.
 *
 * Options (units kpc, km/s, M☉):
 *   n (30000) particles of equal mass diskMass/n; Rd (2.6) scale length; Rmax (5 Rd) truncation radius;
 *   diskMass (3e10); Q (1.5) target Toomre Q, constant with radius; halo (true) / bulge (false):
 *   rigid NFW halo / Hernquist bulge of galaxy.mjs with normalisation P (default MW; the galaxy.mjs
 *   Miyamoto–Nagai disk is replaced by the live disk); grid (128), box (2.6 Rmax), softening
 *   (max(h, 0.1 Rd)); selfGravity (true; false = test particles in the rigid potential only); seed.
 *
 * Initial conditions (BT08 §4.8.2): positions from Σ ∝ e^{−R/Rd}; the circular speed v_c(R) is the
 * mesh force of the smooth analytic disk (same softening and mesh as the run) plus the external
 * component; κ(R) from v_c; σ_R = Q·3.36GΣ/κ (Toomre 1964), σ_φ = σ_R κ/(2Ω) (epicyclic ratio), mean
 * streaming from the asymmetric-drift (Jeans) equation v̄_φ² = v_c² + σ_R²(1 − κ²/4Ω² − R/R_d +
 * ∂lnσ_R²/∂lnR), clamped at 0. Gaussian velocities. The centre of mass and the mean velocity are
 * set to zero. The epicyclic approximation is poor where σ_R ≳ v_c/3 (near the centre of a hot disk):
 * the disk relaxes a little at the start; measure Q(R) with toomreQProfile instead of assuming it.
 *
 * Returns a state { n, x, y, vx, vy, ax, ay, m, t, steps, pm, table, ... } with
 *   step(dt)  one kick-drift-kick leapfrog step (dt in kpc/(km/s)); advance(dt, k) = k steps;
 *   energy() { kinetic, self, external, total } in M☉ (km/s)²; momentum() [p_x, p_y];
 *   angularMomentum() L_z; centreOfMass() [x, y]; suggestedDt; outside (particles off the mesh).
 * Every step is the same arithmetic whatever the frame schedule; throws if a position becomes
 * non-finite. table = { R, vc, kappa, Sigma, sigmaR, vphi } is the initial-condition model.
 */
function createSelfGravDisk({
  n = 30000, Rd = 2.6, Rmax, diskMass = 3e10, Q = 1.5, halo = true, bulge = false, P = MW,
  grid = 128, box, softening, selfGravity = true, seed = 1,
} = {}) {
  const who = 'createSelfGravDisk';
  need(Number.isInteger(n) && n >= 1, `${who}: n must be a positive integer`);
  positiveFinite(Rd, 'Rd', who);
  const rMax = Rmax ?? 5 * Rd;
  positiveFinite(rMax, 'Rmax', who); positiveFinite(diskMass, 'diskMass', who); positiveFinite(Q, 'Q', who);
  const side = box ?? 2.6 * rMax;
  positiveFinite(side, 'box', who);
  need(side > 2.05 * rMax, `${who}: box must exceed 2·Rmax so the whole disk lies on the mesh`);
  const eps = softening ?? Math.max(side / grid, 0.1 * Rd);
  const comps = { bulge: !!bulge, disk: false, halo: !!halo };
  const pm = createPMSolver({ grid, box: side, softening: eps });
  const { N, h, x0 } = pm;

  // analytic truncated exponential disk
  const xm = rMax / Rd, Sigma0 = diskMass / (2 * Math.PI * Rd * Rd * (1 - Math.exp(-xm) * (1 + xm)));
  const SigmaOf = R => (R <= rMax ? Sigma0 * Math.exp(-R / Rd) : 0);

  // v_c(R) of the smooth disk on this mesh: ring averages of the mesh force
  const dR = h / 2, K = Math.ceil(rMax / dR) + 4;
  const T = { R: new Float64Array(K), vc: new Float64Array(K), kappa: new Float64Array(K), Sigma: new Float64Array(K), sigmaR: new Float64Array(K), sigmaPhi: new Float64Array(K), vphi: new Float64Array(K) };
  const vc2 = new Float64Array(K);
  if (selfGravity) {
    const mesh = new Float64Array(N * N);
    let total = 0;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const v = SigmaOf(Math.hypot(x0 + i * h, x0 + j * h)) * h * h; mesh[i + N * j] = v; total += v; }
    for (let k = 0; k < N * N; k++) mesh[k] *= diskMass / total;
    pm.loadMesh(mesh); pm.solveForces();
  }
  const out = new Float64Array(3), nA = 64;
  for (let k = 0; k < K; k++) {
    const R = (k + 0.5) * dR;
    let aR = 0;
    if (selfGravity) {
      for (let q = 0; q < nA; q++) {
        const c = Math.cos(2 * Math.PI * (q + 0.5) / nA), s = Math.sin(2 * Math.PI * (q + 0.5) / nA);
        pm.fieldAt(R * c, R * s, out); aR += out[0] * c + out[1] * s;
      }
      aR /= nA;
    }
    T.R[k] = R;
    vc2[k] = Math.max(0, -R * aR + circularSpeed(R, comps, P).total ** 2);
  }
  for (let k = 0; k < K; k++) {
    const R = T.R[k], a = Math.max(0, k - 2), b = Math.min(K - 1, k + 2);
    const dv2 = (vc2[b] - vc2[a]) / (T.R[b] - T.R[a]);
    T.kappa[k] = Math.sqrt(Math.max(dv2 / R + 2 * vc2[k] / (R * R), 1e-12));
    T.vc[k] = Math.sqrt(vc2[k]);
    T.Sigma[k] = SigmaOf(R);
    T.sigmaR[k] = T.Sigma[k] > 0 ? Q * TOOMRE * G * T.Sigma[k] / T.kappa[k] : 0;
  }
  for (let k = 0; k < K; k++) {
    const R = T.R[k], Omega2 = vc2[k] / (R * R), a = Math.max(0, k - 2), b = Math.min(K - 1, k + 2);
    const s2a = T.sigmaR[a] ** 2, s2b = T.sigmaR[b] ** 2;
    const dlns2 = s2a > 0 && s2b > 0 ? Math.log(s2b / s2a) / Math.log(T.R[b] / T.R[a]) : 0;
    const ratio = Omega2 > 0 ? T.kappa[k] ** 2 / (4 * Omega2) : 1;
    T.sigmaPhi[k] = T.sigmaR[k] * Math.sqrt(ratio);
    T.vphi[k] = Math.sqrt(Math.max(0, vc2[k] + T.sigmaR[k] ** 2 * (1 - ratio - R / Rd + dlns2)));
  }
  const lookup = (arr, R) => {
    const f = Math.min(Math.max(R / dR - 0.5, 0), K - 1.000001), k = Math.floor(f), t = f - k;
    return arr[k] * (1 - t) + arr[k + 1] * t;
  };

  // particles (structure of arrays)
  const rand = rng(seed);
  const x = new Float64Array(n), y = new Float64Array(n), vx = new Float64Array(n), vy = new Float64Array(n);
  const ax = new Float64Array(n), ay = new Float64Array(n), m = new Float64Array(n).fill(diskMass / n);
  for (let p = 0; p < n; p++) {
    let R;
    do { R = -Rd * Math.log((1 - rand()) * (1 - rand())); } while (R > rMax);   // Gamma(2, Rd) ∝ R e^{−R/Rd}
    const ph = 2 * Math.PI * rand(), c = Math.cos(ph), s = Math.sin(ph);
    const vR = lookup(T.sigmaR, R) * rand.normal(), vP = lookup(T.vphi, R) + lookup(T.sigmaPhi, R) * rand.normal();
    x[p] = R * c; y[p] = R * s; vx[p] = vR * c - vP * s; vy[p] = vR * s + vP * c;
  }
  let cx = 0, cy = 0, cvx = 0, cvy = 0;
  for (let p = 0; p < n; p++) { cx += x[p]; cy += y[p]; cvx += vx[p]; cvy += vy[p]; }
  cx /= n; cy /= n; cvx /= n; cvy /= n;
  for (let p = 0; p < n; p++) { x[p] -= cx; y[p] -= cy; vx[p] -= cvx; vy[p] -= cvy; }

  const acc = new Float64Array(3), phiSelf = new Float64Array(n);
  const computeAcc = () => {
    if (selfGravity) pm.accelerations(x, y, m, n, ax, ay);
    else { ax.fill(0); ay.fill(0); }
    if (comps.halo || comps.bulge) {
      for (let p = 0; p < n; p++) { galaxyAcceleration(x[p], y[p], 0, comps, P, acc); ax[p] += acc[0]; ay[p] += acc[1]; }
    }
    s.outside = selfGravity ? pm.outside : 0;
  };
  // orbital period at R = max(Rd/4, 2ε), divided by 50 (energy error ≲ 1e-4 per outer rotation without a bulge)
  const Rin = Math.max(Rd / 4, 2 * eps), vin = Math.max(lookup(T.vc, Rin), 1e-6);
  const s = {
    n, x, y, vx, vy, ax, ay, m, t: 0, steps: 0, pm, table: T, comps, P, Rd, Rmax: rMax, diskMass, Q,
    softening: eps, box: side, grid, selfGravity, outside: 0,
    suggestedDt: 2 * Math.PI * Rin / vin / 50,
    step(dt) {
      need(Number.isFinite(dt) && dt > 0, `${who}: step needs a positive finite dt`);
      const hdt = 0.5 * dt;
      let check = 0;
      for (let p = 0; p < n; p++) {
        vx[p] += hdt * ax[p]; vy[p] += hdt * ay[p];
        x[p] += dt * vx[p]; y[p] += dt * vy[p]; check += x[p] + y[p];
      }
      need(Number.isFinite(check), `${who}: a particle position became non-finite at t = ${s.t}`);
      computeAcc();
      for (let p = 0; p < n; p++) { vx[p] += hdt * ax[p]; vy[p] += hdt * ay[p]; }
      s.t += dt; s.steps++;
      return s;
    },
    advance(dt, count = 1) {
      need(Number.isInteger(count) && count >= 0, `${who}: advance needs a non-negative integer step count`);
      for (let k = 0; k < count; k++) s.step(dt);
      return s;
    },
    /** Energies in M☉ (km/s)²; self = ½ Σ m Φ_self (CIC-interpolated mesh potential). */
    energy() {
      let kin = 0, self = 0, ext = 0;
      for (let p = 0; p < n; p++) kin += 0.5 * m[p] * (vx[p] * vx[p] + vy[p] * vy[p]);
      if (selfGravity) { pm.potentials(x, y, m, n, phiSelf); for (let p = 0; p < n; p++) self += 0.5 * m[p] * phiSelf[p]; }
      if (comps.halo || comps.bulge) for (let p = 0; p < n; p++) ext += m[p] * galaxyPotential(Math.hypot(x[p], y[p]), 0, comps, P);
      return { kinetic: kin, self, external: ext, total: kin + self + ext };
    },
    momentum() { let px = 0, py = 0; for (let p = 0; p < n; p++) { px += m[p] * vx[p]; py += m[p] * vy[p]; } return [px, py]; },
    angularMomentum() { let L = 0; for (let p = 0; p < n; p++) L += m[p] * (x[p] * vy[p] - y[p] * vx[p]); return L; },
    centreOfMass() { let mx = 0, my = 0, mt = 0; for (let p = 0; p < n; p++) { mx += m[p] * x[p]; my += m[p] * y[p]; mt += m[p]; } return [mx / mt, my / mt]; },
  };
  computeAcc();
  return s;
}

// ---------------------------------------------------------------- measurements

const checkSet = (s, who) => need(s && Number.isInteger(s.n) && s.x?.length >= s.n && s.y?.length >= s.n && s.m?.length >= s.n, `${who}: expected a particle set { n, x, y, m, ... }`);
const radialBins = (nR, Rmax, who) => {
  need(Number.isInteger(nR) && nR >= 1, `${who}: nR must be a positive integer`);
  positiveFinite(Rmax, 'Rmax', who);
  return Float64Array.from({ length: nR }, (_, k) => (k + 0.5) * Rmax / nR);
};

/**
 * Surface density Σ (M☉/kpc²) on a polar grid: nR rings of equal width out to Rmax, nPhi sectors
 * from φ = 0 counter-clockwise. Returns { Sigma (index iR + nR·iPhi), R, nR, nPhi, Rmax }.
 */
function surfaceDensityPolar(s, { nR = 32, nPhi = 64, Rmax = s?.Rmax } = {}) {
  const who = 'surfaceDensityPolar';
  checkSet(s, who); const R = radialBins(nR, Rmax, who);
  need(Number.isInteger(nPhi) && nPhi >= 1, `${who}: nPhi must be a positive integer`);
  const Sigma = new Float64Array(nR * nPhi), dR = Rmax / nR, dphi = 2 * Math.PI / nPhi;
  for (let p = 0; p < s.n; p++) {
    const r = Math.hypot(s.x[p], s.y[p]);
    if (!(r < Rmax)) continue;
    let ph = Math.atan2(s.y[p], s.x[p]); if (ph < 0) ph += 2 * Math.PI;
    Sigma[Math.floor(r / dR) + nR * Math.min(nPhi - 1, Math.floor(ph / dphi))] += s.m[p];
  }
  for (let i = 0; i < nR; i++) { const area = R[i] * dR * dphi; for (let j = 0; j < nPhi; j++) Sigma[i + nR * j] /= area; }
  return { Sigma, R, nR, nPhi, Rmax };
}

/**
 * Fourier amplitudes of the azimuthal mass distribution in each of nR rings out to Rmax,
 * A_m(R) = |Σ_j m_j e^{−imφ_j}| / Σ_j m_j (0 for an axisymmetric disk; shot noise ≈ 1/√N_ring), and
 * phase_m(R) = arg Σ_j m_j e^{−imφ_j} (a spiral cos(mφ + p ln R) gives phase = p ln R + const).
 * annulus[m] = √(mass-weighted mean of A_m² over the rings centred in [Rin, Rout)): a ring-by-ring
 * amplitude, so a wound spiral does not cancel itself as a phase-coherent annulus sum would.
 * noise = the same average for pure shot noise, √(Σ_k w_k/N_k) for equal masses.
 * Returns { R, A (index iR·(mMax+1) + m), phase, annulus, dominant (m ≥ 1 with the largest annulus
 * amplitude), noise, mMax }.
 */
function fourierModes(s, { mMax = 6, nR = 16, Rmax = s?.Rmax, Rin = 0, Rout = Rmax } = {}) {

    text: 'This is the disk of a galaxy seen from above: 30 000 stars, each standing for about a million real ones, going round the centre. At first they are spread out evenly. Every star pulls a little on the others, and the inner stars go round faster than the outer ones, so tiny random clumps get stretched and strengthened into spiral lanes where stars crowd together. Those lanes are the spiral arms. Stars drift in and out of them, like cars through a traffic jam.',
    watch: [
      'bright spiral lanes growing out of the smooth disk, unless the stars are too stirred up or do not pull on each other',
      'the white stars: they go round the centre and, when lanes form, slip through them instead of staying in one',
      'press “Switch off the stars’ pull”: at the same moment the disk stays smooth',
    ],
  },
  actions: [
    { label: 'Switch off the stars’ pull', hint: 'the same disk at the same moment, but the stars feel only the dark-matter halo, not each other', reveal: 6,
      onClick: ({ setParams, seek, play }) => { setParams({ pull: 'off' }); seek(T_SHOW); play(); } },
    { label: 'Switch the pull back on', hint: 'the same disk with the stars’ gravity on each other: the arms are back', reveal: 6,
      onClick: ({ setParams, seek, play }) => { setParams({ pull: 'on' }); seek(T_SHOW); play(); } },
  ],
  params: PARAMS,
  create: createSim,
  draw, drawGL, bench,
  onFit: view => fitDisk(view),
  timeUnit: 'Myr', timeLabel: 'time since the start', timeDigits: 0,
  timeline: {
    duration: RUN_MYR,
    seconds: 60,
    markers: (sim, values) => {
      const out = [{ t: sim.turn, label: `one turn of the disk at 5.2 kpc: ${sim.turn.toFixed(0)} Myr (computed)`, short: '1 turn', kind: 'computed' }];
      const run = runFor(values);
      if (run?.visibleT != null) out.push({ t: run.visibleT, label: 'first arms stand out: 4× the random clumping (computed at build time for these settings)', short: 'arms appear', kind: 'computed' });
      if (run && run.peakRatio > 4) out.push({ t: run.peakT, label: `arms at their strongest: ${run.peakM} arms, ${run.peakRatio.toFixed(1)}× the random clumping (computed at build time)`, short: 'strongest', kind: 'computed' });
      return out;
    },
    note: 'About 3 turns of the disk: the first arms grow, fade and new ones appear. Longer runs only stir the stars up further, because this model has no gas to calm the disk again.',
  },
  hudLine: sim => {
    const p = sim.pattern();
    if (p.ratio > 4) return `${p.m} arms, ${p.ratio.toFixed(1)}× the random clumping (measured)`;
    if (p.ratio > 2.5) return `faint arms: strongest pattern ${p.m} arms, ${p.ratio.toFixed(1)}× the random clumping (measured)`;
    return `no clear arms: strongest pattern ${p.ratio.toFixed(1)}× the random clumping (measured)`;
  },
  hudError: false,
  presets: [
    { label: 'Stirred-up stars: no arms', values: { Q: 2.5, diskMass: 3e10, pull: 'on', n: 30000, seed: 1 } },
    { label: 'Heavier disk: 2 arms and a bar', values: { Q: 1, diskMass: 5e10, pull: 'on', n: 30000, seed: 1 } },
    { label: 'Lighter disk: 4 thin arms', values: { Q: 1, diskMass: 1.5e10, pull: 'on', n: 30000, seed: 1 } },
  ],
  texts: { parameters: 'Change the galaxy', paramsNote: 'Each change restarts the galaxy from a smooth disk.', diagnostics: 'Measured now' },
  model: {
    legend: [
      'dots: 30 000 computed stars, seen from above; colour = how crowded the stars are compared with the average at the same distance from the centre (dark: emptier, yellow: crowded)',
      'white dots and blue lines: four stars we follow, with their paths over the last ≈ 110 million years',
      'heavier disk: its own pull also bends the centre into a bar (an oval of stars), a known instability of heavy disks; the arm count is measured at 3.9–9.1 kpc, outside it',
      'colours are a measure of crowding, not the real colours of stars (in real galaxies the arms look blue because young stars form there from gas, which this model leaves out)',
    ],
    equations: [],
    assumptions: [
      'Flat (2D) disk of equal-mass stars, exponential profile (scale length 2.6 kpc, cut at 13 kpc); its thickness is represented by softening gravity over 0.26 kpc.',
      'The stars’ gravity on each other: particle-mesh solver (128 × 128 mesh, isolated boundaries, FFT). The dark-matter halo (NFW, Milky-Way-like) is a fixed, unchanging pull.',
      'No gas, no star formation, no bulge, no bar-forming live halo, no companion galaxy: the arms here form only from the stars’ own gravity (swing amplification of random clumping).',
      'Time step: leapfrog (kick-drift-kick), 1/50 of the inner orbital period (≈ 1.2 Myr); halving it changes the peak arm strength by < 1 % (Verification).',
      'Key times on the timeline come from runs computed when the page was built; the page’s own run is statistically the same but not bit-identical (different Math libraries, chaotic N-body).',
    ],
    conventions: [
      'View: face-on, counter-clockwise rotation; 1 kpc = 3 262 light-years. Time: 1 s of playback ≈ 10 million years at the default speed.',
      'Colour: local surface density (64 × 64 grid of 0.41 kpc cells, each star’s own contribution removed) ÷ mean density of the 0.5 kpc ring at that radius, log scale 0.35–3 (inferno).',
      'Arm strength: Fourier amplitude A_m, ring by ring between 3.9 and 9.1 kpc, in units of the shot-noise level of the same rings.',
      'The "spiral arm" label points to the crest of the strongest measured pattern at 6.5 kpc and appears only when that pattern is > 5× the random level.',
    ],
    references: [
      'A. Toomre, ApJ 139, 1217 (1964): local stability, Q.',
      'P. Goldreich & D. Lynden-Bell, MNRAS 130, 125 (1965); W. H. Julian & A. Toomre, ApJ 146, 810 (1966): swing amplification.',
      'A. Toomre, in The Structure and Evolution of Normal Galaxies, eds. Fall & Lynden-Bell (Cambridge 1981), p. 111: arm number from swing amplification.',
      'J. A. Sellwood & R. G. Carlberg, ApJ 282, 61 (1984); ApJ 785, 137 (2014): transient, recurrent spirals in N-body disks.',
      'C. C. Lin & F. H. Shu, ApJ 140, 646 (1964): quasi-stationary density-wave theory (not modelled here).',
      'J. Binney & S. Tremaine, Galactic Dynamics, 2nd ed. (Princeton 2008), §6.',
      'R. W. Hockney & J. W. Eastwood, Computer Simulation Using Particles (1988): particle-mesh gravity.',
    ],
  },
});

// browser self-test: the page's own run (this browser's arithmetic) grows arms at the build-time peak
window.psim.selfTest = async () => {
  const run = DEFAULT_RUN;
  if (!run) return { label: 'no build report to compare with', pass: false };
  window.psim.setParams({ ...BASE });
  window.psim.advanceTo(run.peakT);
  const sim = window.psim.getSim(), p = sim.pattern();
  return { label: `Browser run at ${run.peakT.toFixed(0)} Myr: ${p.m} arms, ${p.ratio.toFixed(1)}× random (Node build: ${run.peakM} arms, ${run.peakRatio.toFixed(1)}×)`, pass: p.ratio > 6 && Math.abs(p.m - run.peakM) <= 1 };
};

</script>
</body>
</html>
