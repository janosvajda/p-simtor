<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);

// ---------------------------------------------------------------- spheres

/**

// ---------------------------------------------------------------- lines

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */

  const make = (pos, nrm, idx) => ({ positions: Float32Array.from(pos), normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) });

    box(sx = 1, sy = 1, sz = 1) {
      const x = sx / 2, y = sy / 2, z = sz / 2, P = [], N = [], I = [];

    cone(r = 0.5, h = 1, n = 32) {

  for (let v = -10; v <= 10; v += 5) {
    ctx.textAlign = 'center'; ctx.fillText(`${v}`.replace('-', '−'), X(v), L.y + S + 14);
    ctx.beginPath(); ctx.moveTo(X(v), L.y + S); ctx.lineTo(X(v), L.y + S + 4); ctx.moveTo(L.x, Y(v)); ctx.lineTo(L.x - 4, Y(v)); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(`${v}`.replace('-', '−'), L.x - 7, Y(v) + 3.5);
  }
  ctx.textAlign = 'right'; ctx.fillText('x  (nm)', L.x + S, L.y + S + 28);
  ctx.save(); ctx.translate(L.x - (L.wide ? 26 : 30), L.y + S - 4); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'left'; ctx.fillText('y  (nm)', 0, 0); ctx.restore();

  // barrier: V₀ for |x| < a/2, uniform in y
  if (g.V0 > 0) {
    const x0 = X(-g.a / 2), x1 = X(g.a / 2);
    ctx.fillStyle = 'rgba(160,200,255,0.16)'; ctx.fillRect(x0, L.y, x1 - x0, S);
    ctx.strokeStyle = 'rgba(190,220,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, L.y); ctx.lineTo(x0, L.y + S); ctx.moveTo(x1, L.y); ctx.lineTo(x1, L.y + S); ctx.stroke();
    const t = L.wide ? `barrier V₀ = ${g.V0.toFixed(2)} eV, a = ${g.a.toFixed(3)} nm` : `V₀ ${g.V0.toFixed(2)} eV, a ${g.a.toFixed(3)} nm`;
    ctx.font = sans(11.5, 500);
    const fits = x1 + 6 + ctx.measureText(t).width + 12 < L.x + S;
    pill(ctx, t, fits ? x1 + 6 : x0 - 6, L.y + 16, C, fits ? 'left' : 'right');
  } else pill(ctx, 'no barrier (V₀ = 0): free packet', X(0) + 6, L.y + 16, C);

  // initial mean wavevector (a parameter of ψ at t = 0, not a path)
  const ux = Math.cos(g.th), uy = Math.sin(g.th), len = 2.2;
  if (sim.t < 8) {
  ctx.globalAlpha = 1 - sim.t / 10;
  ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 1.5;
  const ax0 = X(g.x0 - ux * 1.1), ay0 = Y(g.y0 - uy * 1.1), ax1 = X(g.x0 - ux * 1.1 + ux * len), ay1 = Y(g.y0 - uy * 1.1 + uy * len);
  ctx.beginPath(); ctx.moveTo(ax0, ay0); ctx.lineTo(ax1, ay1); ctx.stroke();
  const ang = Math.atan2(ay1 - ay0, ax1 - ax0);
  ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax1 - 8 * Math.cos(ang - 0.4), ay1 - 8 * Math.sin(ang - 0.4)); ctx.lineTo(ax1 - 8 * Math.cos(ang + 0.4), ay1 - 8 * Math.sin(ang + 0.4)); ctx.fill();
  ctx.font = sans(11, 500); ctx.textAlign = 'left'; ctx.fillText('k₀ at t = 0', ax1 + 6, ay1 + (uy > 0.3 ? 12 : -6));
  ctx.globalAlpha = 1;
  }

  // centroids ⟨r⟩ of the probability on each side, with the probabilities they carry
  const cs = sim.centroid(), split = b.Pr + b.Ar > 2e-3, settled = sim.settled;
  const mark = (c, text, right) => {
    if (!c || c.w < 0.01 || Math.abs(c.x) > VIEW - 0.5 || Math.abs(c.y) > VIEW - 0.5) return;
    const cx = X(c.x), cy = Y(c.y);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.beginPath();
    ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
    const ty = Math.min(L.y + S - 14, Math.max(L.y + 40, cy + (right ? 28 : -24)));
    ctx.font = sans(11.5, 500); const tw = ctx.measureText(text).width + 16;
    pill(ctx, text, right ? Math.min(cx + 8, L.x + S - tw) : Math.max(cx - 8, L.x + tw), ty, C, right ? 'left' : 'right');
  };
  mark(cs[0], !split ? `incident packet · ${pct(b.Pl + b.Al)}` : settled ? `reflected R = ${pct(b.Pl + b.Al)}` : `incident + reflected · ${pct(b.Pl + b.Al)}`, false);
  if (split) mark(cs[1], `${settled ? 'transmitted T' : 'transmitted so far'} = ${pct(b.T)}`, true);

  if (L.wide) drawPanel(ctx, sim, view, L, C);
  else {
    // phone: colour scale top right, budget line under the view
    const cw = Math.min(150, W * 0.4), cx = W - cw - 14;
    ctx.fillStyle = C('--muted'); ctx.font = sans(10.5); ctx.textAlign = 'right';
    ctx.fillText(`|ψ|² ${MODES[disp.mode].log ? '(log)' : '(linear)'}, ρ₀ = initial peak`, W - 14, 22);
    colourBar(ctx, cx, 30, cw, sim, C);
    ctx.fillStyle = C('--ink-2'); ctx.font = mono(11); ctx.textAlign = 'center';
    ctx.fillText(`T(t) ${pct(b.T)} · exact ⟨T⟩ ${pct(g.Texact)}`, W / 2, L.y + S + 32);
    ctx.textAlign = 'left';
  }
}

function drawPanel(ctx, sim, view, L, C) {
  const { x, y, w } = L.panel, g = sim.g, b = sim.budget;
  let yy = y;
  const head = t => { ctx.fillStyle = C('--muted'); ctx.font = sans(10.5, 600); ctx.textAlign = 'left'; ctx.fillText(t.toUpperCase(), x, yy); yy += 14; };
  // colour scale
  head(`|ψ|² ${MODES[disp.mode].log ? 'log scale' : 'linear scale'}`);
  const note = colourBar(ctx, x, yy, w, sim, C); yy += 36;
  ctx.fillStyle = C('--muted'); ctx.font = sans(11);
  yy = wrap(ctx, `Probability density of one electron; ${note}. Absorbing layers (3 nm) lie beyond the frame.`, x, yy, w, 14) + 14;

  // where the probability is
  head('Where the electron would be found');
  const rows = [
    ['reflected side (x < −a/2)', b.Pl + b.Al, C('--body-1')],
    ['inside the barrier', b.Pb, C('--body-0')],
    ['transmitted side (x > a/2)', b.T, C('--body-3')],
  ];
  for (const [label, v, col] of rows) {
    ctx.fillStyle = C('--ink-2'); ctx.font = sans(11.5); ctx.fillText(label, x, yy + 9);
    ctx.font = mono(11.5); ctx.textAlign = 'right'; ctx.fillText(v < 1e-3 && v > 0 ? `${(100 * v).toExponential(1)} %` : pct(v), x + w, yy + 9); ctx.textAlign = 'left';
    ctx.fillStyle = C('--grid'); ctx.fillRect(x, yy + 14, w, 5);
    ctx.fillStyle = col; ctx.fillRect(x, yy + 14, w * Math.min(1, v), 5);
    yy += 30;
  }
  const tx = x + w * g.Texact;
  ctx.strokeStyle = C('--ink'); ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(tx, yy - 20); ctx.lineTo(tx, yy - 6); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C('--muted'); ctx.font = sans(10.5); ctx.textAlign = tx > x + w - 70 ? 'right' : 'left';
  ctx.fillText(`exact ⟨T⟩ = ${pct(g.Texact)}`, tx + (ctx.textAlign === 'left' ? 4 : -4), yy + 4); ctx.textAlign = 'left';
  yy += 22;

  const rest = L.panel.y + L.panel.h - yy, chartH = Math.min(150, (rest - 70) / 2);
  if (chartH < 70) return;
  // T(t) chart
  head('Probability vs time');
  const ch = { x: x + 30, y: yy, w: w - 30, h: chartH - 20 }, tMax = settleTime(g) * 1.15;
  const cx = t => ch.x + ch.w * Math.min(1, t / tMax), cy = v => ch.y + ch.h * (1 - v);
  ctx.strokeStyle = C('--grid'); ctx.fillStyle = C('--muted'); ctx.font = mono(10); ctx.textAlign = 'right';
  for (const v of [0, 0.5, 1]) { ctx.beginPath(); ctx.moveTo(ch.x, cy(v)); ctx.lineTo(ch.x + ch.w, cy(v)); ctx.stroke(); ctx.fillText(v.toFixed(1), ch.x - 5, cy(v) + 3.5); }
  ctx.textAlign = 'center';
  const step = tMax > 60 ? 20 : 10;
  for (let t = 0; t <= tMax; t += step) ctx.fillText(`${t}`, cx(t), ch.y + ch.h + 13);
  ctx.textAlign = 'right'; ctx.fillText('t (fs)', ch.x + ch.w, ch.y + ch.h + 26); ctx.textAlign = 'left';
  ctx.strokeStyle = C('--muted'); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(ch.x, cy(g.Texact)); ctx.lineTo(ch.x + ch.w, cy(g.Texact)); ctx.stroke(); ctx.setLineDash([]);
  const line = (f, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.beginPath();
    sim.hist.forEach((r, i) => { if (r[0] > tMax) return; i ? ctx.lineTo(cx(r[0]), cy(f(r))) : ctx.moveTo(cx(r[0]), cy(f(r))); });
    ctx.stroke(); ctx.lineWidth = 1;
  };
  line(r => r[1] + r[4], C('--body-1'));
  line(r => r[3] + r[5], C('--body-3'));
  ctx.fillStyle = C('--muted'); ctx.font = sans(10.5);
  ctx.fillText('dashed: exact ⟨T⟩ (Griffiths §2.6, packet average)', x, ch.y + ch.h + 40);
  ctx.fillStyle = C('--body-1'); ctx.fillText('— reflected side', x + w - 190, ch.y + 10); ctx.fillStyle = C('--body-3'); ctx.fillText('— transmitted side', x + w - 100, ch.y + 10);
  yy += chartH + 52;

  // energy diagram along the barrier normal
  head('Energy along the barrier normal');
  const eh = Math.min(150, L.panel.y + L.panel.h - yy - 8);
  if (eh < 60) return;
  const ed = { x: x + 30, y: yy + 4, w: w - 30, h: eh - 22 };
  const k1 = Math.max(0, g.kx0 - g.sk), k2 = g.kx0 + g.sk, E1 = k1 * k1 / C2, E2 = k2 * k2 / C2;
  const Emax = Math.max(g.V0, E2) * 1.25 || 1, ex = xx => ed.x + ed.w * (xx + 3) / 6, ey = E => ed.y + ed.h * (1 - E / Emax);
  ctx.fillStyle = 'rgba(160,200,255,0.16)'; ctx.fillRect(ex(-g.a / 2), ey(g.V0), ex(g.a / 2) - ex(-g.a / 2), ey(0) - ey(g.V0));
  ctx.strokeStyle = C('--ink-2'); ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(ex(-3), ey(0)); ctx.lineTo(ex(-g.a / 2), ey(0)); ctx.lineTo(ex(-g.a / 2), ey(g.V0)); ctx.lineTo(ex(g.a / 2), ey(g.V0)); ctx.lineTo(ex(g.a / 2), ey(0)); ctx.lineTo(ex(3), ey(0)); ctx.stroke();
  ctx.fillStyle = C('--accent'); ctx.globalAlpha = 0.18; ctx.fillRect(ed.x, ey(E2), ed.w, ey(E1) - ey(E2)); ctx.globalAlpha = 1;
  ctx.strokeStyle = C('--accent'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ed.x, ey(g.Ex)); ctx.lineTo(ed.x + ed.w, ey(g.Ex)); ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = C('--muted'); ctx.font = mono(10); ctx.textAlign = 'right';
  for (const E of [0, Emax / 2]) ctx.fillText(E.toFixed(1), ed.x - 5, ey(E) + 3.5);
  ctx.fillText('eV', ed.x - 5, ed.y + 8);
  ctx.textAlign = 'center'; for (const xx of [-3, 0, 3]) ctx.fillText(`${xx}`.replace('-', '−'), ex(xx), ed.y + ed.h + 13);
  ctx.textAlign = 'left'; ctx.font = sans(10.5);
  ctx.fillStyle = C('--accent'); ctx.textAlign = 'right'; ctx.fillText(`E₀cos²θ = ${g.Ex.toFixed(3)} eV`, ed.x + ed.w, ey(E2) - 5); ctx.textAlign = 'left';
  ctx.fillStyle = C('--ink-2'); if (g.V0 > 0) ctx.fillText(`V₀ = ${g.V0.toFixed(2)} eV`, ex(g.a / 2) + 6, ey(g.V0) + (Math.abs(ey(g.V0) - ey(g.Ex)) < 14 ? 14 : -4));
  ctx.fillStyle = C('--muted'); ctx.textAlign = 'right'; ctx.fillText('x (nm)', ed.x + ed.w, ed.y + ed.h + 26); ctx.textAlign = 'left';
}

// ------------------------------------------------------------ the instrument
const M = s => `<math display="block">${s}</math>`;
const app = createInstrument({
  title: 'Electron wave packet tunnelling in 2D',
  subtitle: 'Time-dependent Schrödinger equation on a 256 × 256 grid (split-operator FFT): one electron meeting a thin potential barrier',
  tier: 'validated',
  tierReason: 'The 2D Schrödinger equation is solved by the Strang split-operator FFT method (second order, unitary). The final transmitted probability matches the exact square-barrier transmission averaged over the packet within 2 % (1.5 % default, 1.9 % worst tested; grid-limited, converging at second order); unitarity, the free-packet solution and the probability balance with the absorbing edges hold to round-off (Verification).',
  params: PARAMS, create: createSim, draw, gl: true, drawGL,
  timeUnit: 'fs', timeLabel: 'time since release', speed: 3, duration: 80,
  hudLine: sim => `E₀cos²θ ${sim.g.Ex.toFixed(3)} eV · ${sim.g.kappa > 0 ? `1/κ ${(1 / sim.g.kappa).toFixed(2)} nm` : 'above barrier'}`,
  model: {
    equations: [
      { caption: 'Time-dependent Schrödinger equation solved on the grid (free-electron mass, V = V₀ for |x| < a/2):', mathml: M('<mi>i</mi><mi>ħ</mi><mfrac><mrow><mo>∂</mo><mi>ψ</mi></mrow><mrow><mo>∂</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mrow><mo>[</mo><mo>−</mo><mfrac><msup><mi>ħ</mi><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub></mrow></mfrac><msup><mo>∇</mo><mn>2</mn></msup><mo>+</mo><mi>V</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>−</mo><mi>i</mi><mi>W</mi><mo>(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>)</mo><mo>]</mo></mrow><mi>ψ</mi>') },
      { caption: 'Exact plane-wave transmission for normal energy E < V₀, with κ = √(2mₑ(V₀ − E))/ħ (above the barrier sinh → sin):', mathml: M('<mi>T</mi><mo>(</mo><mi>E</mi><mo>)</mo><mo>=</mo><msup><mrow><mo>[</mo><mn>1</mn><mo>+</mo><mfrac><mrow><msubsup><mi>V</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>sinh</mi><mn>2</mn></msup><mo>(</mo><mi>κ</mi><mi>a</mi><mo>)</mo></mrow><mrow><mn>4</mn><mi>E</mi><mo>(</mo><msub><mi>V</mi><mn>0</mn></msub><mo>−</mo><mi>E</mi><mo>)</mo></mrow></mfrac><mo>]</mo></mrow><mrow><mo>−</mo><mn>1</mn></mrow></msup>') },
      { caption: 'For a straight barrier y-motion is free, so only the normal energy E_x = ħ²k_x²/2mₑ tunnels; the packet’s transmission is the average over its momentum distribution (σ_k = 1/2σ):', mathml: M('<mo>⟨</mo><mi>T</mi><mo>⟩</mo><mo>=</mo><mo>∫</mo><msup><mrow><mo>|</mo><mi>φ</mi><mo>(</mo><msub><mi>k</mi><mi>x</mi></msub><mo>)</mo><mo>|</mo></mrow><mn>2</mn></msup><mspace width="0.2em"/><mi>T</mi><mo>(</mo><msup><mi>ħ</mi><mn>2</mn></msup><msubsup><mi>k</mi><mi>x</mi><mn>2</mn></msubsup><mo>/</mo><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub><mo>)</mo><mspace width="0.2em"/><mi>d</mi><msub><mi>k</mi><mi>x</mi></msub>') },
    ],
    assumptions: [
      'One spinless electron, non-relativistic (E ≪ mₑc² = 511 keV), free-electron mass mₑ. In a solid the effective mass and band structure would change the numbers.',
      'Ideal rectangular barrier, static and uniform along y; no image-charge rounding, no phonons or other electrons.',
      'Grid 256 × 256 with dx = 0.125 nm (32 nm box); the barrier width is rounded to whole cells. At this grid the transmitted probability is low by 0.7–1.9 % in the tested cases (1.5 % default), converging at second order.',
      'Absorbing layers (complex potential −iW, quadratic ramp to 2 eV over 3 nm) at all four edges remove outgoing waves instead of letting them wrap around the periodic FFT box. Probability removed there is booked exactly per side, so T(t) = P(x > a/2) + absorbed on that side.',
      'The colour shows where the electron would be found if measured; a single measurement finds it on one side only, with probabilities T and R. The packet does not split into two partial electrons.',
    ],
    conventions: [
      'Colour: |ψ(x, y)|² in nm⁻², inferno colour map, relative to the initial peak density ρ₀; log scale by default (2 decades below ρ₀; 4, 6 decades or linear selectable). Energy diagram: the shaded band spans the normal energies of k_x ± σ_k. Bilinear interpolation between grid cells unless “show grid cells” is on.',
      'Pale blue band: the barrier region |x| < a/2. Crosses: ⟨r⟩ of the probability on each side of the barrier, labelled with that side’s probability (absorbed parts included).',
      'White arrow: the packet’s mean wavevector k₀ at t = 0 (an initial-state parameter, not a trajectory).',
      'The view shows the 26 × 26 nm interior; the 3 nm absorbing layers are outside the frame.',
      'Playback: physical time in femtoseconds, about 3 fs per second of wall time by default (compressed ~10¹⁵×).',
    ],
    references: [
      'D. J. Griffiths, D. F. Schroeter, Introduction to Quantum Mechanics, 3rd ed., Cambridge (2018), §2.6 and Problem 2.33 (square-barrier transmission).',
      'M. D. Feit, J. A. Fleck, A. Steiger, J. Comput. Phys. 47, 412 (1982): split-operator FFT method.',
      'J. G. Muga et al., Phys. Rep. 395, 357 (2004): complex absorbing potentials.',
      'E. Tiesinga et al., CODATA 2018, Rev. Mod. Phys. 93, 025010 (2021): ħ, mₑ, e.',
    ],
  },
  extraSections(side, { section, el, toggle: tg }) {
    const sec = section('View (display only)');
    sec.body.append(
      el('p', { class: 'psim-hint' }, 'These change how the computed density is drawn, not the calculation.'),
      el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, 'Colour scale')),
        select(Object.entries(MODES).map(([value, m]) => ({ value, label: m.label })), disp.mode, v => { disp.mode = v; })),
      tg('Show grid cells (no interpolation)', !disp.smooth, v => { disp.smooth = !v; }),
    );
    side.insertBefore(sec, side.children[1]);
  },
});

// Representation self-test: the GPU colour at the densest cell equals the colour map at its computed value.
window.psim.selfTest = () => {
  const gl = document.querySelector('canvas.psim-gl').getContext('webgl2'), sim = app.sim, view = app.view;
  const L = layout(view.W, view.H), px = L.S / (2 * VIEW), dpr = view.dpr;
  let kMax = 0;
  const { re, im } = sim;
  for (let k = 1; k < re.length; k++) if (re[k] ** 2 + im[k] ** 2 > re[kMax] ** 2 + im[kMax] ** 2) kMax = k;
  const xc = i => (i + 0.5 - N / 2) * DX, xi = xc(kMax % N), yi = xc((kMax / N) | 0);
  const sx = (L.x + (xi + VIEW) * px) * dpr, sy = (L.y + (VIEW - yi) * px) * dpr;
  const b = new Uint8Array(4); gl.readPixels(Math.round(sx), Math.round(gl.drawingBufferHeight - 1 - sy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
  const m = MODES[disp.mode], r0 = 1 / (2 * Math.PI * sim.g.sigma ** 2), v = re[kMax] ** 2 + im[kMax] ** 2;
  const tt = m.log ? (Math.log10(v) - Math.log10(r0 * m.lo)) / -Math.log10(m.lo) : v / r0;
  const want = colormap(MAP, tt).map(c => Math.round(255 * c)), dev = Math.max(...[0, 1, 2].map(i => Math.abs(b[i] - want[i])));
  return { label: 'GPU density colour at the peak cell matches the colour map of its computed |ψ|²', got: [...b].slice(0, 3), want, maxDeviation: dev, pass: dev <= 6 };
};
