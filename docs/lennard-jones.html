//   V(r) = V_LJ(r) − V_LJ(r_c) − (r − r_c) V_LJ'(r_c)  for r < r_c = 2.5σ, 0 beyond.
//   Both V and the force vanish continuously at r_c. (A plain energy-shifted cutoff leaves a
//   force jump at r_c; measured here it broke the 2nd-order energy convergence of Verlet.)
//   m ẍᵢ = −∇ᵢ Σ_{j≠i} V(|xᵢ − xⱼ|)  in a square periodic box (minimum image), 2 dimensions.
// Reduced units: σ = ε = m = k_B = 1; time τ = σ√(m/ε). For argon's LJ parameters
// (σ = 3.405 Å, ε/k_B = 119.8 K, m = 39.948 u) τ ≈ 2.15 ps, but this is a 2D model, so the
// argon mapping is a unit scale only, not a prediction for real argon.
//
// State: positions xᵢ ∈ [0, L)², velocities vᵢ (flat Float64Arrays, 2 per particle).
// Methods: velocity Verlet (NVE, symplectic, 2nd order) or BAOAB Langevin (NVT, Leimkuhler &
// Matthews 2013) with the heat exchanged with the bath integrated so the energy balance can be
// checked. Cell lists make the force evaluation O(N).
// Initial state: square lattice + Gaussian velocities from a seeded RNG, zero total momentum.
// NVE mode first equilibrates for t_eq = 10 τ with velocity rescaling to T₀ (not physical
// dynamics, labelled on the page); production NVE dynamics follow, with no rescaling.
//
// Observables (computed from the state, never from the renderer):
//   kinetic temperature  T = 2K / n_dof  (n_dof = 2N − 2 in NVE: total momentum is fixed; 2N in NVT)
//   virial pressure       P = (N T + ½ Σ_{i<j} 𝐫ᵢⱼ·𝐅ᵢⱼ) / L²      (d = 2)
//   g(r)                  pair histogram / (ideal-gas pair count in the annulus)
//   speed histogram       compared with the 2D Maxwell–Boltzmann f(v) = (v/T) e^{−v²/2T}
// Progress axis: physical time in τ.
//
// Toolkit note: core/particles.mjs is all-pairs with open boundaries and
// core/stochastic.mjs's langevinBAOAB does not report the heat exchanged, so the periodic
// cell-list force, velocity Verlet and the heat-tracked BAOAB are implemented here.
const { rng, brent, gaussLegendre, meanWithError } = __psim["core/numerics.mjs"];
const { ksTest } = __psim["core/data.mjs"];
const RC = 2.5;
const RC2 = RC * RC;
const V_RC = 4 * (RC ** -12 - RC ** -6);           // V(r_c) of the full potential (−0.016316)
const F_RC = 24 * (2 * RC ** -13 - RC ** -7);      // −V'(r_c) of the full potential (−0.038927)
const T_EQ = 10;                            // equilibration / warm-up length, τ

/** Shifted-force LJ potential and the scalar force −dV/dr (reduced units): both vanish at r_c. */
function ljV(r) { return r >= RC ? 0 : 4 * (r ** -12 - r ** -6) - V_RC + (r - RC) * F_RC; }
function ljF(r) { return r >= RC ? 0 : 24 * (2 * r ** -13 - r ** -7) - F_RC; }
const ljShift = r => (r >= RC ? 0 : -V_RC + (r - RC) * F_RC);
const ljRepulsive = r => (r >= RC ? 0 : 4 * r ** -12);
const ljAttractive = r => (r >= RC ? 0 : -4 * r ** -6);

const PARAMS = [
  { key: 'N', label: 'Particles N', min: 36, max: 1024, value: 400, integer: true, log: true,
    hint: 'Cost grows linearly with N (cell lists).' },
  { key: 'rho', label: 'Number density ρ*', min: 0.05, max: 1.0, value: 0.35, unit: 'σ⁻²', digits: 3,
    hint: 'Box side L = √(N/ρ). Hexagonal close packing in 2D is ρ* ≈ 1.15.' },
  { key: 'T0', label: 'Temperature T*', min: 0.05, max: 5, value: 0.4, log: true, unit: 'ε/k_B', digits: 3,
    hint: 'NVE: target of the equilibration rescaling; afterwards T is measured, not imposed. NVT: bath temperature.' },
  { key: 'ensemble', label: 'Dynamics', value: 'nve', options: [
    { value: 'nve', label: 'NVE (velocity Verlet) after 10 τ rescaling' },
    { value: 'nvt', label: 'NVT Langevin thermostat (BAOAB)' },
  ] },
  { key: 'gamma', label: 'Langevin friction γ (NVT only)', min: 0.05, max: 10, value: 1, log: true, unit: 'τ⁻¹', digits: 3 },
  { key: 'dt', label: 'Time step Δt', min: 0.0005, max: 0.01, value: 0.002, log: true, unit: 'τ', digits: 3,
    hint: 'Energy fluctuation of velocity Verlet scales as Δt²; 0.002 keeps it ≈ 3×10⁻⁵ in a dense liquid.' },
  { key: 'seed', label: 'Random seed', min: 1, max: 9999, value: 7, integer: true },
];

const PRESETS = [
  { label: 'Dilute hot gas', N: 400, rho: 0.05, T0: 2.0 },
  { label: 'Cool, condensing', N: 400, rho: 0.35, T0: 0.4 },
  { label: 'Dense liquid', N: 400, rho: 0.75, T0: 1.0 },
  { label: 'Dense and cold', N: 400, rho: 0.9, T0: 0.2 },
];

// ------------------------------------------------------------------ core integrator

/**
 * A periodic 2D LJ system. x, v: flat arrays (2 per particle), L: box side.
 * Returns { x, v, F, L, n, U, W (Σ r·F), K(), force(), verlet(dt), baoab(dt, γ, T, rand), heat }.
 */
function createSystem({ x, v, L, allPairs = false }) {
  const n = x.length / 2;
  if (!(L >= 2 * RC)) throw new Error('box must satisfy L ≥ 2 r_c for the minimum image');
  const F = new Float64Array(2 * n);
  const nc = Math.max(1, Math.floor(L / RC)), cs = L / nc;
  const useCells = nc >= 3 && !allPairs;
  const head = new Int32Array(nc * nc), next = new Int32Array(n);
  const half = L / 2;
  const sys = { x, v, F, L, n, U: 0, W: 0, Urep: 0, Uatt: 0, Ushift: 0, heat: 0, pairs: 0 };

  function pair(i, j) {
    let dx = x[2 * i] - x[2 * j], dy = x[2 * i + 1] - x[2 * j + 1];
    if (dx > half) dx -= L; else if (dx < -half) dx += L;
    if (dy > half) dy -= L; else if (dy < -half) dy += L;
    const r2 = dx * dx + dy * dy;
    if (r2 >= RC2) return;
    const i2 = 1 / r2, s6 = i2 * i2 * i2, s12 = s6 * s6;
    const r = Math.sqrt(r2);
    const fr = 24 * (2 * s12 - s6) * i2 - F_RC / r;  // F/r, shifted force
    F[2 * i] += fr * dx; F[2 * i + 1] += fr * dy;
    F[2 * j] -= fr * dx; F[2 * j + 1] -= fr * dy;
    sys.Urep += 4 * s12; sys.Uatt -= 4 * s6; sys.Ushift += (r - RC) * F_RC - V_RC;
    sys.W += fr * r2;
    inRange++;
  }
  let inRange = 0;

  sys.force = () => {
    F.fill(0); sys.W = 0; sys.Urep = 0; sys.Uatt = 0; sys.Ushift = 0; inRange = 0;
    if (!useCells) {
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pair(i, j);
    } else {
      head.fill(-1);
      for (let i = 0; i < n; i++) {
        const cx = Math.min(nc - 1, Math.floor(x[2 * i] / cs)), cy = Math.min(nc - 1, Math.floor(x[2 * i + 1] / cs));
        const c = cx + nc * cy;
        next[i] = head[c]; head[c] = i;
      }
      // Each cell with itself and 4 forward neighbours: every pair visited once.
      const OFF = [[1, 0], [-1, 1], [0, 1], [1, 1]];
      for (let cy = 0; cy < nc; cy++) {
        for (let cx = 0; cx < nc; cx++) {
          const c = cx + nc * cy;
          for (let i = head[c]; i >= 0; i = next[i]) for (let j = next[i]; j >= 0; j = next[j]) pair(i, j);
          for (const [ox, oy] of OFF) {
            const c2 = ((cx + ox + nc) % nc) + nc * ((cy + oy + nc) % nc);
            for (let i = head[c]; i >= 0; i = next[i]) for (let j = head[c2]; j >= 0; j = next[j]) pair(i, j);
          }
        }
      }
    }
    sys.pairs = inRange;
    sys.U = sys.Urep + sys.Uatt + sys.Ushift;
  };

  const wrap = () => {
    for (let k = 0; k < 2 * n; k++) { const q = x[k]; if (q >= L) x[k] = q - L * Math.floor(q / L); else if (q < 0) x[k] = q - L * Math.floor(q / L); }
  };
  sys.K = () => { let s = 0; for (let k = 0; k < 2 * n; k++) s += v[k] * v[k]; return 0.5 * s; };

  sys.verlet = dt => {
    const h = 0.5 * dt;
    for (let k = 0; k < 2 * n; k++) { v[k] += h * F[k]; x[k] += dt * v[k]; }
    wrap(); sys.force();
    for (let k = 0; k < 2 * n; k++) v[k] += h * F[k];
  };
  sys.baoab = (dt, gamma, T, rand) => {
    const h = 0.5 * dt, c1 = Math.exp(-gamma * dt), c2 = Math.sqrt((1 - c1 * c1) * T);
    for (let k = 0; k < 2 * n; k++) { v[k] += h * F[k]; x[k] += h * v[k]; }      // B, A
    const K0 = sys.K();
    for (let k = 0; k < 2 * n; k++) v[k] = c1 * v[k] + c2 * rand.normal();     // O (exact OU)
    sys.heat += sys.K() - K0;                                                  // energy from the bath
    for (let k = 0; k < 2 * n; k++) x[k] += h * v[k];                          // A
    wrap(); sys.force();
    for (let k = 0; k < 2 * n; k++) v[k] += h * F[k];                          // B
  };
  sys.force();
  return sys;
}

/** Square-lattice start with seeded Gaussian velocities at temperature T0, zero momentum. */
function initialState({ N, rho, T0, seed }) {
  const L = Math.sqrt(N / rho), cols = Math.ceil(Math.sqrt(N)), a = L / cols;
  const x = new Float64Array(2 * N), v = new Float64Array(2 * N);
  for (let i = 0; i < N; i++) { x[2 * i] = (i % cols + 0.5) * a; x[2 * i + 1] = (Math.floor(i / cols) + 0.5) * a; }
  const rand = rng(seed);
  for (let k = 0; k < 2 * N; k++) v[k] = rand.normal();
  removeMomentum(v);
  rescale(v, T0, 2 * N - 2);
  return { x, v, L, rand };
}
function removeMomentum(v) {
  const n = v.length / 2; let px = 0, py = 0;
  for (let i = 0; i < n; i++) { px += v[2 * i]; py += v[2 * i + 1]; }
  for (let i = 0; i < n; i++) { v[2 * i] -= px / n; v[2 * i + 1] -= py / n; }
}
function rescale(v, T, dof) {
  let s = 0; for (const q of v) s += q * q;
  const f = Math.sqrt(T * dof / s);
  for (let k = 0; k < v.length; k++) v[k] *= f;
}

/** 2D Maxwell–Boltzmann speed density and CDF at temperature T (m = k_B = 1). */
const mb2d = (s, T) => (s / T) * Math.exp(-s * s / (2 * T));
const mb2dCdf = (s, T) => 1 - Math.exp(-s * s / (2 * T));

// ------------------------------------------------------------------ the simulation

function createSim(p) {
  const N = Math.round(p.N), nvt = p.ensemble === 'nvt';
  const dt = p.dt, T0 = p.T0, gamma = p.gamma;
  const { x, v, L, rand } = initialState({ N, rho: p.rho, T0, seed: Math.round(p.seed) });
  const sys = createSystem({ x, v, L });
  const dof = nvt ? 2 * N : 2 * N - 2;
  let steps = 0, t = 0;
  let E0 = null, scale0 = 1, maxErr = 0, sumErr2 = 0, nErr = 0;
  const rmax = Math.min(L / 2, 5), gBins = 100, gdr = rmax / gBins, gHist = new Float64Array(gBins);
  let gSamples = 0;
  const vMax = 4 * Math.sqrt(Math.max(T0, 0.05)) + 0.5, vBins = 40, vHist = new Float64Array(vBins);
  let vCount = 0;
  const Ts = [], Ps = [], series = [], rows = [];
  const gEvery = Math.max(5, Math.round(N * N / 20000));
  const statEvery = 5;

  const temp = () => 2 * sys.K() / dof;
  const pressure = () => (N * temp() + 0.5 * sys.W) / (L * L);

  function sampleG() {
    const half = L / 2, r2max = rmax * rmax;
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        let dx = x[2 * i] - x[2 * j], dy = x[2 * i + 1] - x[2 * j + 1];
        if (dx > half) dx -= L; else if (dx < -half) dx += L;
        if (dy > half) dy -= L; else if (dy < -half) dy += L;
        const r2 = dx * dx + dy * dy;
        if (r2 < r2max) gHist[Math.min(gBins - 1, Math.floor(Math.sqrt(r2) / gdr))] += 2;
      }
    }
    gSamples++;
  }

  function step() {
    if (nvt) sys.baoab(dt, gamma, T0, rand);
    else {
      sys.verlet(dt);
      if (t + dt < T_EQ - 1e-9 && (steps + 1) % 10 === 0) rescale(v, T0, dof);
    }
    steps++; t = steps * dt;
    const prod = t >= T_EQ - 1e-9;
    const E = sys.K() + sys.U;
    if (prod && E0 === null) { E0 = E - sys.heat; scale0 = sys.K() + Math.abs(sys.U); }
    if (prod) {
      const err = Math.abs(E - sys.heat - E0) / scale0;
      if (err > maxErr) maxErr = err;
      sumErr2 += err * err; nErr++;
      if (steps % statEvery === 0) {
        const T = temp(), P = pressure();
        Ts.push(T); Ps.push(P);
        for (let i = 0; i < N; i++) {
          const s = Math.hypot(v[2 * i], v[2 * i + 1]);
          if (s < vMax) vHist[Math.floor(s / vMax * vBins)]++;
          vCount++;
        }
        if (rows.length < 50000) rows.push([+t.toFixed(6), sys.K() / N, sys.U / N, E / N, T, P]);
      }
      if (steps % gEvery === 0) sampleG();
    }
    if (steps % 10 === 0) {
      series.push([t, sys.K() / N, sys.U / N, (sys.K() + sys.U - sys.heat) / N]);
      if (series.length > 4000) series.splice(0, series.length - 4000);
    }
  }

  return {
    get t() { return t; },
    params: p, N, L, x, v, dt, sys, nvt, vMax,
    get production() { return t >= T_EQ - 1e-9; },
    step,
    temperature: temp, pressure,
    energyError: () => (E0 === null ? null : Math.abs(sys.K() + sys.U - sys.heat - E0) / scale0),
    maxEnergyError: () => maxErr,
    rmsEnergyError: () => Math.sqrt(sumErr2 / Math.max(1, nErr)),
    series,
    speedHistogram() {
      const w = vMax / vBins;
      return Array.from(vHist, (c, k) => [(k + 0.5) * w, vCount ? c / (vCount * w) : 0]);
    },
    gOfR() {
      if (!gSamples) return [];
      const out = [];
      for (let k = 0; k < gBins; k++) {
        const r0 = k * gdr, r1 = r0 + gdr, ideal = N * (N - 1) / (L * L) * Math.PI * (r1 * r1 - r0 * r0);
        out.push([r0 + gdr / 2, gHist[k] / (gSamples * ideal)]);
      }
      return out;
    },
    stats() {
      if (Ts.length < 32) return null;
      return { T: meanWithError(Ts), P: meanWithError(Ps), n: Ts.length };
    },
    diagnostics() {
      const st = this.stats(), err = this.energyError();
      const d = [{
        key: 'dE', label: nvt ? '|ΔE − Q_bath| / (K + |U|)' : '|ΔE| / (K + |U|) (NVE)', value: err ?? 0, kind: 'error',
        good: 1e-4, warn: 1e-3, text: err === null ? (nvt ? 'warming up' : 'equilibrating (rescaling)') : undefined,
      }];
      d.push(
        { key: 'T', label: 'Kinetic temperature T* (now)', value: temp(), kind: 'value' },
        { key: 'Tm', label: 'Mean T* (production)', value: st?.T.mean ?? 0, kind: 'value', text: st ? `${st.T.mean.toFixed(4)} ± ${st.T.error.toFixed(4)}` : 'collecting after equilibration' },
        { key: 'Pm', label: 'Mean pressure P* (virial)', value: st?.P.mean ?? 0, kind: 'value', text: st ? `${st.P.mean.toFixed(4)} ± ${st.P.error.toFixed(4)}` : 'collecting after equilibration' },
        { key: 'u', label: 'Potential energy per particle U/N', value: sys.U / N, kind: 'value', unit: 'ε' },
        { key: 'L', label: 'Box side L', value: L, kind: 'value', unit: 'σ' },
        { key: 'steps', label: 'Steps', value: steps, kind: 'value', text: steps.toLocaleString() },
      );
      return d;
    },
    state: () => ({ N, L, steps, K: sys.K(), U: sys.U, heat: sys.heat, x: Array.from(x, q => +q.toFixed(9)), v: Array.from(v, q => +q.toFixed(9)) }),
    record: () => ({ header: ['t_tau', 'K_per_N', 'U_per_N', 'E_per_N', 'T_kin', 'P_virial'], rows }),
  };
}

// ------------------------------------------------------------------ verification

/** Exact radial period of an LJ dimer (μ = 1/2) released at rest from r1 < r_min. */
function dimerPeriod(r1) {
  const E = ljV(r1), rmin = 2 ** (1 / 6);
  const r2 = brent(r => ljV(r) - E, rmin, RC - 1e-12);
  const c = (r1 + r2) / 2, h = (r2 - r1) / 2, mu = 0.5;
  // r = c + h sin θ removes the 1/√ endpoint singularities.
  const f = th => { const r = c + h * Math.sin(th); return h * Math.cos(th) / Math.sqrt(2 * Math.max(E - ljV(r), 1e-300) / mu); };
  let I = 0; const K = 16;
  for (let k = 0; k < K; k++) I += gaussLegendre(f, -Math.PI / 2 + Math.PI * k / K, -Math.PI / 2 + Math.PI * (k + 1) / K, 32);
  return { T: 2 * I, r2, E };
}

function runDimer(r1, dt, periods, Tex) {
  const L = 20, x = Float64Array.from([5, 5, 5 + r1, 5]), v = new Float64Array(4);
  const sys = createSystem({ x, v, L });
  const vr = () => v[2] - v[0];
  let t = 0, prev = vr();
  const crossings = [];
  const nSteps = Math.ceil(periods * Tex / dt);
  for (let s = 0; s < nSteps; s++) {
    sys.verlet(dt); t += dt;
    const cur = vr();
    if (prev < 0 && cur >= 0) crossings.push(t - dt + dt * (-prev) / (cur - prev));   // inner turning point
    prev = cur;
  }
  const T = (crossings.at(-1) - crossings[0]) / (crossings.length - 1);
  return T;
}

function nveRun({ N, rho, T0, dt, tProd, seed = 3 }) {
  const sim = createSim({ N, rho, T0, dt, seed, ensemble: 'nve', gamma: 1 });
  const nEq = Math.round(T_EQ / dt), nProd = Math.round(tProd / dt);
  for (let i = 0; i < nEq; i++) sim.step();
  for (let i = 0; i < nProd; i++) sim.step();
  return sim;
}

function verify() {
  const checks = [], notes = [];

  // 1. Force is the exact derivative of the potential; potential continuous at r_c.
  let fdErr = 0;
  for (const r of [0.95, 1.0, 1.1, 1.3, 1.8, 2.3]) {
    const h = 1e-4, fd = -(8 * (ljV(r + h) - ljV(r - h)) - (ljV(r + 2 * h) - ljV(r - 2 * h))) / (12 * h);
    fdErr = Math.max(fdErr, Math.abs(fd - ljF(r)) / Math.max(1, Math.abs(ljF(r))));
  }
  checks.push({ label: 'Force = −dV/dr (4th-order difference, 6 radii)', value: `max rel. diff ${fdErr.toExponential(2)}`, pass: fdErr < 1e-8 });
  const minimum = Math.abs(ljF(2 ** (1 / 6)));
  checks.push({ label: 'Shifted force: F(r_min) = −F_LJ(r_c); V and F → 0 at r_c⁻', value: `ΔF = ${Math.abs(minimum - Math.abs(F_RC)).toExponential(1)}, V = ${ljV(RC - 1e-12).toExponential(1)}, F = ${ljF(RC - 1e-12).toExponential(1)}`, pass: Math.abs(minimum - Math.abs(F_RC)) < 1e-12 && Math.abs(ljV(RC - 1e-12)) < 1e-10 && Math.abs(ljF(RC - 1e-12)) < 1e-10 });

  // 1b. Cell lists find exactly the same interactions as the all-pairs minimum-image sum.
  {
    const st = initialState({ N: 300, rho: 0.6, T0: 1, seed: 9 });
    const r = rng(4);
    for (let k = 0; k < st.x.length; k++) st.x[k] = (st.x[k] + 0.3 * (r() - 0.5) + st.L) % st.L;
    const a = createSystem({ x: Float64Array.from(st.x), v: st.v, L: st.L });
    const b = createSystem({ x: Float64Array.from(st.x), v: st.v, L: st.L, allPairs: true });
    let dF = 0, Fs = 0;
    for (let k = 0; k < a.F.length; k++) { dF = Math.max(dF, Math.abs(a.F[k] - b.F[k])); Fs = Math.max(Fs, Math.abs(b.F[k])); }
    const dU = Math.abs(a.U - b.U) / Math.abs(b.U);
    checks.push({ label: 'Cell-list forces = all-pairs minimum image (N = 300)', value: `max |ΔF|/max|F| = ${(dF / Fs).toExponential(1)}, |ΔU/U| = ${dU.toExponential(1)}, pairs ${a.pairs} = ${b.pairs}`, pass: dF / Fs < 1e-12 && dU < 1e-12 && a.pairs === b.pairs });
  }

  // 2. Exact benchmark: radial oscillation period of a bound dimer (quadrature) vs MD.
  const ex = dimerPeriod(1.05);
  const Tmd = runDimer(1.05, 0.001, 10, ex.T);
  const dimErr = Math.abs(Tmd - ex.T) / ex.T;
  checks.push({ label: 'Dimer oscillation period vs exact quadrature (Δt = 0.001)', value: `T_MD = ${Tmd.toFixed(6)}, T_exact = ${ex.T.toFixed(6)} τ, rel. err ${dimErr.toExponential(2)}`, pass: dimErr < 1e-4 });
  const Tmd2 = runDimer(1.05, 0.004, 10, ex.T), Tmd3 = runDimer(1.05, 0.002, 10, ex.T);
  const pDim = Math.log2(Math.abs(Tmd2 - ex.T) / Math.abs(Tmd3 - ex.T));
  checks.push({ label: 'Dimer period error order (Δt = 0.004 → 0.002)', value: `p = ${pDim.toFixed(2)} (velocity Verlet: 2)`, pass: Math.abs(pDim - 2) < 0.3 });

  // 3. Many-body NVE: energy conservation without drift, momentum, convergence order.
  const liq = nveRun({ N: 256, rho: 0.7, T0: 1.0, dt: 0.002, tProd: 40 });
  const eMax = liq.maxEnergyError();
  checks.push({ label: 'NVE energy, N = 256, ρ* = 0.7, T* ≈ 1, Δt = 0.002 (default), 40 τ (2×10⁴ steps)', value: `max |ΔE|/(K+|U|) = ${eMax.toExponential(2)}`, pass: eMax < 1e-4 });
  // drift: linear fit of E over the production series
  const ser = liq.series.filter(r => r[0] >= T_EQ);
