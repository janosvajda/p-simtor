<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {

// ---------------------------------------------------------------- 3D volumes

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */

  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;

  vec3 q = c + vec3(aCorner * s, 0.0);

precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;

  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen

// ---------------------------------------------------------------- random numbers

/** Seeded PRNG (mulberry32), uniform in [0, 1). Deterministic for a given seed. */
function rng(seed = 1) {
  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let spare = null;
  next.normal = () => {               // standard normal (Box–Muller, cached pair)
    if (spare != null) { const s = spare; spare = null; return s; }
    let u = 0; while (u === 0) u = next();
    const v = next(), r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
  return next;
}

/**
 * An independent seeded stream for item i (atom, particle, event): rngFor(seed, i) always gives
 * the same numbers for that item, whatever else was drawn, so one item can be re-traced alone.
 * The seed and index are mixed by a 32-bit hash (splitmix-style finaliser) before mulberry32.
 */
function rngFor(seed, i) {
  let h = (Math.imul((seed >>> 0) ^ 0x9E3779B9, 0x85EBCA6B) + Math.imul(i >>> 0, 0xC2B2AE35)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B) >>> 0;
  return rng((h ^ (h >>> 16)) >>> 0);

const fftTables = new Map();
/** Twiddle factors e^{−2πik/n} (k < n/2) and the bit-reversal permutation, cached per length. */

    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit; rev[i] = j;
    }
    t = { cos, sin, rev };
    if (fftTables.size > 32) fftTables.clear();
    fftTables.set(n, t);

}

/** In-place radix-2 complex FFT. re/im: Float64Array, length a power of two.
 *  Forward: X_k = Σ x_n e^{−2πikn/N}. Inverse (inverse = true) includes the 1/N factor. */
function fft(re, im, inverse = false) {
  const n = re.length;
  if (n & (n - 1)) throw new Error('fft: length must be a power of two');
  if (n < 2) return;
  const { cos, sin, rev } = fftTable(n);
  for (let i = 1; i < n; i++) {
    const j = rev[i];
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  const sign = inverse ? 1 : -1;
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1, step = n / len;
    for (let i = 0; i < n; i += len) {
      for (let k = 0; k < half; k++) {
        const cr = cos[k * step], ci = sign * sin[k * step];
        const a = i + k, b = a + half;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi;
        re[a] += xr; im[a] += xi;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

/** Angular wavenumbers k for an FFT grid of n points with spacing dx (FFT ordering). */
function fftFreq(n, dx) {
  const k = new Float64Array(n);
  for (let i = 0; i < n; i++) k[i] = 2 * Math.PI * (i < n / 2 ? i : i - n) / (n * dx);
  return k;
}

// ---------------------------------------------------------------- ODEs

/** Classical RK4 step for y' = f(t, y). y: array; returns new array. */
function rk4Step(f, t, y, h) {
  const k1 = f(t, y);
  const k2 = f(t + h / 2, y.map((v, i) => v + h / 2 * k1[i]));
  const k3 = f(t + h / 2, y.map((v, i) => v + h / 2 * k2[i]));
  const k4 = f(t + h, y.map((v, i) => v + h * k3[i]));
  return y.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}

// Dormand–Prince 5(4) coefficients (Dormand & Prince 1980; Hairer, Nørsett & Wanner, Table 5.2).
const DP = {
  c: [0, 1 / 5, 3 / 10, 4 / 5, 8 / 9, 1, 1],
  a: [[], [1 / 5], [3 / 40, 9 / 40], [44 / 45, -56 / 15, 32 / 9],
    [19372 / 6561, -25360 / 2187, 64448 / 6561, -212 / 729],
    [9017 / 3168, -355 / 33, 46732 / 5247, 49 / 176, -5103 / 18656],
    [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84]],
  b: [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84, 0],
  e: [71 / 57600, 0, -71 / 16695, 71 / 1920, -17253 / 339200, 22 / 525, -1 / 40],
};

/** The Dormand–Prince 5(4) tableau (for steppers built on top of dopri5). */
const DORMAND_PRINCE = DP;

/**
 * Adaptive Dormand–Prince 5(4) integration of y' = f(t, y) from t0 to t1.
 * Error control per component: |err_i| <= atol + rtol·max(|y_i|, |y_new_i|).
 * onStep(t, y) is called after every accepted step (return false to stop early).
 * Returns { t, y, steps, rejected, stopped }. Throws if tolerance cannot be met or
 * the step budget is exhausted; stopped is reserved for an intentional onStep stop.
 */
function dopri5(f, t0, y0, t1, { rtol = 1e-9, atol = 1e-12, h0, hmax = Infinity, maxSteps = 1e6, onStep } = {}) {
  if (!Number.isFinite(t0) || !Number.isFinite(t1) || !y0.length || !Array.from(y0).every(Number.isFinite)) throw new Error('dopri5: finite times and a non-empty finite state are required');
  if (!(Number.isFinite(rtol) && rtol > 0 && Number.isFinite(atol) && atol > 0)) throw new Error('dopri5: tolerances must be finite and positive');
  if (!(hmax > 0) || (hmax !== Infinity && !Number.isFinite(hmax)) || (h0 != null && !(Number.isFinite(h0) && h0 !== 0))) throw new Error('dopri5: step sizes must be non-zero and finite (hmax may be Infinity)');
  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

//   1. Monte Carlo: hot start, then nTherm sweeps of heat bath (Creutz; Kennedy–Pendleton
//      sampler) + 2 over-relaxation passes. Samples e^{−S_W}.
//   2. Smoothing: nCool sweeps of Wilson-action cooling, each link set to the value that
//      minimises its local action (U → V†, V = staple/|staple|). This deliberately changes the
//      configuration: it removes ultraviolet noise and lowers the action; it also lets
//      instanton–anti-instanton pairs annihilate and, with the Wilson action, slowly shrinks
//      instantons (S_W(ρ) = 8π²/g² [1 − (a/ρ)²/5 + …]) until small ones fall through the lattice.
//   Work is split into chunks of one time slice so a browser frame never waits on a full sweep.
//
// OBSERVATION (all gauge-invariant)
//   Clover field strength  F^a_μν(x) = 2 · vec( ¼ Σ_{4 leaves} U_leaf ),
//   action density  s(x) = (1/16π²) Σ_{a, μ<ν} (F^a_μν)²    [units of the one-instanton action 8π²/g²]
//   charge density  q(x) = (1/8π²) Σ_a (F^a_12 F^a_34 − F^a_13 F^a_24 + F^a_14 F^a_23)
//   so that s ≥ |q| pointwise, with equality where the field is (anti-)self-dual.
//   Q = Σ_x q(x); Wilson action in instanton units S_W/(8π²/g²) = Σ_P (1 − ½TrU_P)/(2π²).
//
// REPRESENTATION (decided here, drawn by page.html)
//   Each view is a 3D SLICE (x, y, z at fixed τ) of the 4D lattice. τ (the 4th, Euclidean-time
//   direction) is a slider; between lattice slices the page interpolates linearly (display only).
//   Slice sums S(τ), Q(τ) are a PROJECTION (sum over x, y, z). Link variables are
//   gauge-dependent and are never drawn.
const { createLattice, staple, plaquette, gaugeTransform } = __psim["core/lattice-gauge.mjs"];
const { besselI, meanWithError } = __psim["core/numerics.mjs"];
const PI2 = Math.PI * Math.PI;
/** Smallest instanton size at which the charge measurement is verified (BPST check, ρ = 2.5a): below it Q need not be near an integer. */
const RHO_MIN = 2.5;
const TWO_PI2 = 2 * PI2;

const PARAMS = [
  { key: 'L', label: 'Lattice size', value: '8', options: [
    { value: '8', label: '8⁴ sites (fast)' }, { value: '10', label: '10⁴ sites' }, { value: '12', label: '12⁴ sites (slow)' },
  ], hint: 'Periodic L⁴ lattice; larger L means a larger box at the same β, so more topological objects, but more work.' },
  { key: 'beta', label: 'Coupling β = 4/g²', min: 2.2, max: 2.7, value: 2.4, digits: 3, hint: 'Larger β = finer lattice spacing (smaller box in physical units).' },
  { key: 'nTherm', label: 'Monte Carlo sweeps', min: 10, max: 200, value: 40, integer: true, hint: 'Heat bath + 2 over-relaxation per sweep, from a random (hot) start.' },
  { key: 'nCool', label: 'Cooling sweeps (smoothing)', min: 0, max: 200, value: 30, integer: true, hint: 'Each sweep lowers the action; 0 shows the raw, unsmoothed sample.' },
  { key: 'seed', label: 'Random seed', min: 1, max: 9999, value: 6, integer: true, hint: 'A different sample of the same ensemble.' },
];

// ---------------------------------------------------------------- portable elementary functions
// Math.exp/log/cos/sin/hypot may differ in the last bit between JavaScript engines (Node vs the
// browser). Monte Carlo is chaotic, so one ulp grows into a different configuration within a few
// sweeps. These versions use only + − × ÷ and √ (exactly rounded in every engine), so a seed gives
// the same configuration in Node (where verify() ran) and in any browser. Accuracy ~1e−16.
const LN2_HI = 0.6931471803691238, LN2_LO = 1.9082149292705877e-10;
function pexp(x) {
  if (x < -700) return 0;
  const k = Math.round(x / 0.6931471805599453), r = x - k * LN2_HI - k * LN2_LO;
  let term = 1, sum = 1;
  for (let n = 1; n < 30 && (term > 1e-18 || term < -1e-18); n++) { term = term * r / n; sum += term; }
  let scale = 1;
  for (let i = 0; i < Math.abs(k); i++) scale = k > 0 ? scale * 2 : scale * 0.5;
  return sum * scale;
}
function plog(x) {
  if (!(x > 0)) return x === 0 ? -Infinity : NaN;
  let e = 0, m = x;
  while (m < 0.7071067811865476) { m *= 2; e--; }
  while (m > 1.4142135623730951) { m *= 0.5; e++; }
  const z = (m - 1) / (m + 1), z2 = z * z;
  let term = z, sum = 0;
  for (let n = 1; n < 60; n += 2) { sum += term / n; term *= z2; if (term < 1e-19 && term > -1e-19) break; }
  return 2 * sum + e * LN2_HI + e * LN2_LO;
}
/** cos and sin of 2π·u, by Taylor series after exact reduction of u to [−¼, ¼] turns. */
function pcossin2pi(u) {
  u -= Math.floor(u); if (u > 0.5) u -= 1;                    // u ∈ (−½, ½]
  let flip = 1;
  if (u > 0.25) { u = 0.5 - u; flip = -1; } else if (u < -0.25) { u = -0.5 - u; flip = -1; }
  const t = 6.283185307179586 * u, t2 = t * t;
  let c = 1, sn = t, tc = 1, ts = t;
  for (let n = 1; n < 20; n++) { tc *= -t2 / ((2 * n - 1) * (2 * n)); ts *= -t2 / ((2 * n) * (2 * n + 1)); c += tc; sn += ts; if (tc < 1e-19 && tc > -1e-19) break; }
  return [flip * c, sn];                                       // cos flips sign, sin does not
}
const norm4 = (a, b, c, d) => Math.sqrt(a * a + b * b + c * c + d * d);

// ---------------------------------------------------------------- SU(2) helpers (unit quaternions)
// q = a0 + i a·σ, same convention as core/lattice-gauge.mjs.
function mulTo(a0, a1, a2, a3, b0, b1, b2, b3, out) {
  out[0] = a0 * b0 - a1 * b1 - a2 * b2 - a3 * b3;
  out[1] = a0 * b1 + a1 * b0 - a2 * b3 + a3 * b2;
  out[2] = a0 * b2 + a2 * b0 - a3 * b1 + a1 * b3;
  out[3] = a0 * b3 + a3 * b0 - a1 * b2 + a2 * b1;
}

function randomSU2(rand, out) {
  let n;
  do { for (let i = 0; i < 4; i++) out[i] = rand() * 2 - 1; n = norm4(out[0], out[1], out[2], out[3]); } while (n > 1 || n === 0);
  for (let i = 0; i < 4; i++) out[i] /= n;
}

// Kennedy–Pendleton sample of a0 with density ∝ √(1−a0²) e^{k a0} (same algorithm as core, which keeps it private).
const tmpQ = new Float64Array(4);
function sampleA0(k, rand) {
  if (k < 1) { for (;;) { randomSU2(rand, tmpQ); if (rand() < pexp(k * (tmpQ[0] - 1))) return tmpQ[0]; } }
  for (;;) {
    const r1 = 1 - rand(), r2 = 1 - rand(), r3 = 1 - rand();
    const c = pcossin2pi(r2)[0], l2 = -(plog(r1) + c * c * plog(r3)) / (2 * k);
    const r4 = rand();
    if (r4 * r4 <= 1 - l2) return 1 - 2 * l2;
  }
}

// ---------------------------------------------------------------- chunked link updates on a site range
const A = new Float64Array(4), X = new Float64Array(4), T = new Float64Array(4);

/** kind: 'hb' heat bath, 'or' over-relaxation, 'cool' local action minimisation. Sites [s0, s1). */
function updateRange(lat, s0, s1, kind) {
  const { D, U, beta, rand } = lat;
  for (let s = s0; s < s1; s++) {
    for (let mu = 0; mu < D; mu++) {
      const o = 4 * (s * D + mu);
      staple(lat, s, mu, A);
      const k = norm4(A[0], A[1], A[2], A[3]);
      if (k < 1e-12) { if (kind === 'hb') { randomSU2(rand, X); U.set(X, o); } continue; }
      const v0 = A[0] / k, v1 = A[1] / k, v2 = A[2] / k, v3 = A[3] / k;   // V = A/|A| ∈ SU(2)
      if (kind === 'cool') {                                               // U = V† maximises ½Tr(U A)
        U[o] = v0; U[o + 1] = -v1; U[o + 2] = -v2; U[o + 3] = -v3;
      } else if (kind === 'hb') {                                          // U = X V†, X ~ √(1−x0²) e^{βk x0}
        const a0 = sampleA0(beta * k, rand), r = Math.sqrt(Math.max(0, 1 - a0 * a0));
        const ct = 2 * rand() - 1, st = Math.sqrt(1 - ct * ct), [cp, sp] = pcossin2pi(rand());
        mulTo(a0, r * st * cp, r * st * sp, r * ct, v0, -v1, -v2, -v3, T);
        U.set(T, o);
      } else {                                                             // U → V† U† V† (action unchanged)
        mulTo(v0, -v1, -v2, -v3, U[o], -U[o + 1], -U[o + 2], -U[o + 3], T);
        mulTo(T[0], T[1], T[2], T[3], v0, -v1, -v2, -v3, X);
        U.set(X, o);
      }
      const n = norm4(U[o], U[o + 1], U[o + 2], U[o + 3]);            // re-unitarise
      for (let i = 0; i < 4; i++) U[o + i] /= n;
    }
  }
}

// ---------------------------------------------------------------- gauge-invariant densities (clover)
const P1 = new Float64Array(4), P2 = new Float64Array(4);
// product of four links, each optionally daggered: returns into out
function loop4(U, o1, d1, o2, d2, o3, d3, o4, d4, out) {
  const c1 = d1 ? -1 : 1, c2 = d2 ? -1 : 1, c3 = d3 ? -1 : 1, c4 = d4 ? -1 : 1;
  mulTo(U[o1], c1 * U[o1 + 1], c1 * U[o1 + 2], c1 * U[o1 + 3], U[o2], c2 * U[o2 + 1], c2 * U[o2 + 2], c2 * U[o2 + 3], P1);
  mulTo(P1[0], P1[1], P1[2], P1[3], U[o3], c3 * U[o3 + 1], c3 * U[o3 + 2], c3 * U[o3 + 3], P2);
  mulTo(P2[0], P2[1], P2[2], P2[3], U[o4], c4 * U[o4 + 1], c4 * U[o4 + 2], c4 * U[o4 + 3], out);
}

const PLANES = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
const F = Array.from({ length: 6 }, () => new Float64Array(3));
const LEAF = new Float64Array(4), W = new Float64Array(4), W2 = new Float64Array(4);

/** Ordered product of links along a closed path from site s; dirs: +μ+1 forward, −(μ+1) backward. */
function walk(lat, s, dirs, out) {
  const { D, U, up, dn } = lat;
  out[0] = 1; out[1] = out[2] = out[3] = 0;
  for (const d of dirs) {
    let o, c;
    if (d > 0) { o = 4 * (s * D + d - 1); c = 1; s = up[s * D + d - 1]; }
    else { s = dn[s * D - d - 1]; o = 4 * (s * D - d - 1); c = -1; }
    mulTo(out[0], out[1], out[2], out[3], U[o], c * U[o + 1], c * U[o + 2], c * U[o + 3], W2);
    out.set(W2);
  }
}
// the four counter-clockwise n×n leaves of the clover in the (μ, ν) plane
const LEAVES = {};
function leaves(mu, nu, n) {
  const key = `${mu}${nu}${n}`;
  if (LEAVES[key]) return LEAVES[key];
  const m = mu + 1, v = nu + 1, rep = (d, k) => Array(k).fill(d);
  return (LEAVES[key] = [
    [...rep(m, n), ...rep(v, n), ...rep(-m, n), ...rep(-v, n)],
    [...rep(v, n), ...rep(-m, n), ...rep(-v, n), ...rep(m, n)],
    [...rep(-m, n), ...rep(-v, n), ...rep(m, n), ...rep(v, n)],
    [...rep(-v, n), ...rep(m, n), ...rep(v, n), ...rep(-m, n)],
  ]);
}

/**
 * Field strength from clovers, F^a_μν = 2·vec(¼ Σ leaves)/n² for n×n leaves. `improved` combines
 * 1×1 and 2×2 clovers as (4F₁ − F₂)/3, cancelling the O(a²) error of the plain clover
 * (Richardson extrapolation in the loop size; cf. de Forcrand, García Pérez & Stamatescu 1997,
 * Bilson-Thompson, Leinweber & Williams 2003). Writes s(x), q(x) for sites [s0, s1); returns the
 * sum of ½TrU_P over the standard plaquettes of those sites.
 */
function measureRange(lat, s0, s1, sOut, qOut, { improved = true } = {}) {
  if (lat.D !== 4) throw new Error('measureRange: topological charge density needs d = 4');
  let plaq = 0;
  for (let s = s0; s < s1; s++) {
    for (let p = 0; p < 6; p++) {
      const [mu, nu] = PLANES[p];
      let f1 = 0, f2 = 0, f3 = 0;
      const l1 = leaves(mu, nu, 1);
      for (let k = 0; k < 4; k++) { walk(lat, s, l1[k], LEAF); if (k === 0) plaq += LEAF[0]; f1 += LEAF[1]; f2 += LEAF[2]; f3 += LEAF[3]; }
      F[p][0] = 0.5 * f1; F[p][1] = 0.5 * f2; F[p][2] = 0.5 * f3;
      if (improved) {
        let g1 = 0, g2 = 0, g3 = 0;
        const l2 = leaves(mu, nu, 2);
        for (let k = 0; k < 4; k++) { walk(lat, s, l2[k], LEAF); g1 += LEAF[1]; g2 += LEAF[2]; g3 += LEAF[3]; }
        // F₂ = 2·(¼Σ)/4 = Σ/8;  F_imp = (4F₁ − F₂)/3
        F[p][0] = (4 * F[p][0] - g1 / 8) / 3; F[p][1] = (4 * F[p][1] - g2 / 8) / 3; F[p][2] = (4 * F[p][2] - g3 / 8) / 3;
      }
    }
    let ff = 0, fd = 0;
    for (let p = 0; p < 6; p++) ff += F[p][0] * F[p][0] + F[p][1] * F[p][1] + F[p][2] * F[p][2];
    for (let a = 0; a < 3; a++) fd += F[0][a] * F[5][a] - F[1][a] * F[4][a] + F[2][a] * F[3][a];
    sOut[s] = ff / (16 * PI2);
    qOut[s] = fd / (8 * PI2);
  }
  return { plaq, n: (s1 - s0) * 6 };
}

/** Whole-lattice measurement (used by verify and by the start state). */
function measureAll(lat, opts) {
  const s = new Float64Array(lat.V), q = new Float64Array(lat.V);
  const { plaq, n } = measureRange(lat, 0, lat.V, s, q, opts);
  return summarise(s, q, plaq / n, lat.V);
}

function summarise(s, q, plaq, V) {
  let S = 0, Q = 0, Qp = 0, Qm = 0;
  for (let i = 0; i < s.length; i++) { S += s[i]; Q += q[i]; if (q[i] > 0) Qp += q[i]; else Qm += q[i]; }
  const nP = V * 6;
  return { s, q, plaq, S, Q, Qp, Qm, SW: nP * (1 - plaq) / TWO_PI2 };
}

// ---------------------------------------------------------------- lumps: local maxima of s(x) in 4D
/**
 * Local maxima of the action density over the 80 periodic neighbours, above `frac` of the
 * global maximum. For each: position, peak s and q, self-duality q/s at the peak, and the size
 * ρ a BPST instanton with the same peak density would have, s(0) = 6/(π²ρ⁴) (an estimator).
 */
function findLumps(s, q, L, { frac = 0.2, max = 12 } = {}) {
  let gmax = 0;
  for (const v of s) gmax = Math.max(gmax, v);
  const thr = frac * gmax, out = [];
  const idx = (x, y, z, t) => ((x + L) % L) + L * (((y + L) % L) + L * (((z + L) % L) + L * ((t + L) % L)));
  for (let t = 0; t < L; t++) for (let z = 0; z < L; z++) for (let y = 0; y < L; y++) for (let x = 0; x < L; x++) {
    const i = idx(x, y, z, t), v = s[i];
    if (!(v >= thr) || v <= 0) continue;
    let isMax = true;
    for (let dt = -1; dt <= 1 && isMax; dt++) for (let dz = -1; dz <= 1 && isMax; dz++) for (let dy = -1; dy <= 1 && isMax; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy && !dz && !dt) continue;
      const w = s[idx(x + dx, y + dy, z + dz, t + dt)];
      if (w > v || (w === v && idx(x + dx, y + dy, z + dz, t + dt) < i)) { isMax = false; break; }
    }
    if (isMax) out.push({ x, y, z, t, s: v, q: q[i], duality: q[i] / v, rho: Math.sqrt(Math.sqrt(6 / (PI2 * v))) });
  }
  out.sort((a, b) => b.s - a.s);
  return out.slice(0, max);
}

// ---------------------------------------------------------------- the simulation
function createSim(params) {
  const L = Math.round(Number(params.L) || 8);
  const beta = params.beta, nTherm = Math.round(params.nTherm), nCool = Math.round(params.nCool);
  const lat = createLattice({ L, d: 4, beta, seed: Math.round(params.seed), start: 'cold' });
  for (let i = 0; i < lat.V * 4; i++) { randomSU2(lat.rand, X); lat.U.set(X, 4 * i); }   // hot start, portable arithmetic
  const V = lat.V, V3 = L * L * L;
  const start = measureAll(lat);
  let shown = { ...start, sweep: 0, phase: 'start', version: 0 };
  let lumpCache = null;
  const pendS = new Float64Array(V), pendQ = new Float64Array(V);
  let pendPlaq = 0;
  const history = [{ sweep: 0, phase: 'start', plaq: start.plaq, SW: start.SW, S: start.S, Q: start.Q, Qp: start.Qp, Qm: start.Qm }];
  let sweepsDone = 0, unit = 0, idle = 0, endOfMC = null, units = 0;
  const total = nTherm + nCool;
  const phaseOf = n => (n < nTherm ? 'mc' : n < total ? 'cool' : 'done');
  const plan = ph => (ph === 'mc' ? ['hb', 'or', 'or', 'm'] : ['cool', 'm']);

  function finishSweep() {
    sweepsDone++;
    const ph = sweepsDone <= nTherm ? 'mc' : 'cool';
    const sum = summarise(pendS, pendQ, pendPlaq / (V * 6), V);
    shown = { ...sum, s: Float64Array.from(pendS), q: Float64Array.from(pendQ), sweep: sweepsDone, phase: ph, version: shown.version + 1 };
    lumpCache = null;
    history.push({ sweep: sweepsDone, phase: ph, plaq: sum.plaq, SW: sum.SW, S: sum.S, Q: sum.Q, Qp: sum.Qp, Qm: sum.Qm });
    if (sweepsDone === nTherm) endOfMC = history[history.length - 1];
    pendPlaq = 0;
  }

  const sim = {
    params: { ...params, L }, L, V, V3, beta, nTherm, nCool, lat,
    get t() {
      const ph = phaseOf(sweepsDone);
      if (ph === 'done') return total + idle;
      return sweepsDone + unit / (plan(ph).length * L);
    },
    get phase() { return phaseOf(sweepsDone); },
    get done() { return sweepsDone >= total; },
    get shown() { return shown; },
    get units() { return units; },
    history,
    get endOfMC() { return endOfMC; },
    /** One chunk of work: one time slice of one pass. Nothing changes after the plan ends. */
    step() {
      const ph = phaseOf(sweepsDone);
      if (ph === 'done') { idle += 1 / (2 * L); return; }
      const p = plan(ph), pass = p[Math.floor(unit / L)], tau = unit % L;
      const s0 = tau * V3, s1 = s0 + V3;
      if (pass === 'm') pendPlaq += measureRange(lat, s0, s1, pendS, pendQ).plaq;
      else updateRange(lat, s0, s1, pass);
      units++;
      if (++unit === p.length * L) { unit = 0; finishSweep(); }
    },
    lumps() { return (lumpCache ??= findLumps(shown.s, shown.q, L)); },
    /** Projection: sums over x, y, z of s and q in each time slice of the shown configuration. */
    profile() {
      const S = new Float64Array(L), Q = new Float64Array(L);
      for (let t = 0; t < L; t++) for (let i = 0; i < V3; i++) { S[t] += shown.s[t * V3 + i]; Q[t] += shown.q[t * V3 + i]; }
      return { S, Q };
    },
    diagnostics() {
      const sh = shown, Q = sh.Q, n = Math.round(Q), lumps = sim.lumps();
      const nPlus = lumps.filter(l => l.duality > 0.5).length, nMinus = lumps.filter(l => l.duality < -0.5).length;
      const sized = lumps.filter(l => Math.abs(l.duality) > 0.5), rmin = Math.min(Infinity, ...sized.map(l => l.rho));
      const d = [
        { key: 'res', label: 'Smallest (anti-)self-dual lump', value: Number.isFinite(rmin) ? rmin : 0, kind: 'value',
          text: !Number.isFinite(rmin) ? 'none' : rmin >= RHO_MIN ? `ρ ≈ ${rmin.toFixed(1)}a (resolved)` : `ρ ≈ ${rmin.toFixed(1)}a < ${RHO_MIN}a: too small, Q unreliable` },
        { key: 'dq', label: '|Q − nearest integer|', value: Math.abs(Q - n), kind: 'error', good: 0.05, warn: 0.2 },
        { key: 'Q', label: 'Topological charge Q (clover)', value: Q, kind: 'value', text: `${Q >= 0 ? '+' : '−'}${Math.abs(Q).toFixed(3)} (nearest ${n})` },
        { key: 'SW', label: 'Wilson action S / (8π²/g²)', value: sh.SW, kind: 'value', text: sh.SW.toPrecision(4) },
        { key: 'ratio', label: 'S / (8π²|Q|/g²)  (BPS bound ≥ 1)', value: Math.abs(Q) >= 0.5 ? sh.SW / Math.abs(Q) : 0, kind: 'value',
          text: Math.abs(Q) >= 0.5 ? (sh.SW / Math.abs(Q)).toFixed(3) : 'n/a (Q ≈ 0)' },
        { key: 'plaq', label: 'Plaquette ⟨½ Tr U_P⟩', value: sh.plaq, kind: 'value', text: sh.plaq.toFixed(5) },
        { key: 'lumps', label: 'Lumps (q>0 / q<0 / mixed)', value: lumps.length, kind: 'value', text: `${nPlus} / ${nMinus} / ${lumps.length - nPlus - nMinus}` },
        { key: 'removed', label: 'Action removed by cooling', value: endOfMC ? 1 - sh.SW / endOfMC.SW : 0, kind: 'value',
          text: endOfMC && sh.phase === 'cool' ? `${(100 * (1 - sh.SW / endOfMC.SW)).toFixed(1)} %` : 'not yet cooled' },
      ];
      return d;
    },
    state() {
      const sh = shown;
      return { phase: phaseOf(sweepsDone), sweep: sh.sweep, units, plaq: sh.plaq, Q: sh.Q, SW: sh.SW, S: sh.S, lumps: sim.lumps().length,
        history: history.map(h => [h.sweep, +h.plaq.toFixed(6), +h.Q.toFixed(5), +h.SW.toFixed(4)]) };
    },
    record() {
      return { header: ['sweep', 'phase', 'plaquette', 'S_W/(8pi^2/g^2)', 'S_clover/(8pi^2/g^2)', 'Q', 'Q_plus', 'Q_minus'],
        rows: history.map(h => [h.sweep, h.phase, h.plaq, h.SW, h.S, h.Q, h.Qp, h.Qm]) };
    },
  };
  return sim;
}

/** Run the whole plan synchronously (verify / tests). */
function runPipeline(params) {
  const sim = createSim(params);
  while (!sim.done) sim.step();
  return sim;
}

// ---------------------------------------------------------------- benchmark: a discretised BPST instanton
// Continuum instanton (Belavin et al. 1975), regular gauge: A^a_μ = 2 η_aμν x_ν /(x² + ρ²), A = A^a σ^a/2,

 */
function sliceAt(sim, tau, which) {
  const L = sim.L, V3 = L * L * L, arr = which === 'charge' ? sim.shown.q : sim.shown.s;
  const t0 = Math.floor(tau) % L, t1 = (t0 + 1) % L, f = tau - Math.floor(tau);
  const [dx, dy, dz] = shiftFor(sim);
  const out = new Float32Array(V3);
  for (let z = 0; z < L; z++) for (let y = 0; y < L; y++) for (let x = 0; x < L; x++) {
    const X = (x + dx + L) % L, Y = (y + dy + L) % L, Z = (z + dz + L) % L, i = X + L * (Y + L * Z);
    out[x + L * (y + L * z)] = (1 - f) * arr[t0 * V3 + i] + f * arr[t1 * V3 + i];
  }
  return out;
}

// colour scale: fixed over the whole 4D configuration so lumps visibly grow and fade with τ
function scaleOf(sim, which) {
  let m = 0;
  for (const v of (which === 'charge' ? sim.shown.q : sim.shown.s)) m = Math.max(m, Math.abs(v));
  return m || 1;
}

const aspectKey = view => 10 * view.W / view.H;
function fitCam(L, view) {
  cam.fit([[0, 0, 0], [L, L, L]], view.W / view.H, 1.3);
  cam.target[2] = L * 0.36;                                    // lift the box above the τ strip
  cam._L = L; cam._aspect = Math.round(aspectKey(view));
}
function drawGL(gl, sim, view) {
  if (!volS) { volS = createVolumeRenderer(gl); volQ = createSignedVolumeRenderer(gl); }
  const now = performance.now(), dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  const L = sim.L;
  if (viewState.animate) { viewState.tau = (viewState.tau + viewState.tauSpeed * dt) % L; tauControls.slider?.setValue(+viewState.tau.toFixed(2)); }
  if (viewState.tau >= L) viewState.tau = 0;
  const key = `${sim.shown.version}|${sim.L}|${viewState.tau.toFixed(3)}|${viewState.quantity}|${viewState.centre}|${sim.lat.U.length}|${sim.params.seed}|${sim.beta}`;
  if (key !== uploadedKey) {
    const data = sliceAt(sim, viewState.tau, viewState.quantity), sc = scaleOf(sim, viewState.quantity);
    if (viewState.quantity === 'charge') volQ.update(data, L, L, L, { scale: sc });
    else volS.update(data, L, L, L, { range: [0, sc] });
    sliceCache = { data, scale: sc };
    uploadedKey = key;
  }
  const dark = view.color('--glow') === '1';
  const box = [[0, 0, 0], [L, L, L]];
  if (cam._L !== L || cam._aspect !== Math.round(aspectKey(view))) { fitCam(L, view); }
  const aspect = view.W / view.H;
  if (viewState.quantity === 'charge') {
    volQ.draw(cam, { aspect, box, positive: view.color('--body-0'), negative: view.color('--body-1'), opacity: viewState.opacity * 1.3, mode: dark ? 'emission' : 'absorption' });
  } else {
    volS.draw(cam, { aspect, box, colormap: 'inferno', opacity: viewState.opacity, mode: dark ? 'emission' : 'absorption' });
  }
}

// ------------------------------------------------------------------ 2D overlay: box, axes, τ strip, captions
const STRIP_H = 46;
// HUD and legend boxes (shell DOM) in canvas coordinates, so the overlay avoids them
function overlayBoxes() {
  const cv = document.querySelector('.psim-stage canvas:not(.psim-gl)');
  if (!cv) return [];
  const c = cv.getBoundingClientRect();
  return ['.psim-hud', '.psim-legend', '.psim-timeline:not([hidden])'].map(sel => document.querySelector(sel)?.getBoundingClientRect())
    .filter(r => r && r.height > 0).map(r => ({ x0: r.left - c.left, x1: r.right - c.left, y0: r.top - c.top, y1: r.bottom - c.top }));
}
function stripRect(view) {
  const w = Math.min(view.W - 32, 520), x = (view.W - w) / 2;
  let bottom = view.H - 40;                                   // room for the shift note
  for (const b of overlayBoxes()) if (b.y0 > view.H * 0.5 && b.x1 > x && b.x0 < x + w) bottom = Math.min(bottom, b.y0 - 8);
  return { x, y: bottom - STRIP_H - 22, w, h: STRIP_H };
}

function draw(ctx, sim, view) {
  const C = view.color, L = sim.L;
  if (sim.done && pausedAtEnd !== sim) { pausedAtEnd = sim; window.psim?.pause(); }
  // lattice box (the slice volume) with axis labels
  const P = p => cam.project(p, view.W, view.H);
  const corners = [];
  for (let k = 0; k < 8; k++) corners.push([k & 1 ? L : 0, k & 2 ? L : 0, k & 4 ? L : 0]);
  ctx.strokeStyle = C('--line-strong'); ctx.lineWidth = 1;
  for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) {
    const d = a ^ b; if (d !== 1 && d !== 2 && d !== 4) continue;
    const A = P(corners[a]), B = P(corners[b]);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  }
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.fillStyle = C('--muted');
  for (const [lab, p] of [['x', [L + 0.9, 0, 0]], ['y', [0, L + 0.9, 0]], ['z', [0, 0, L + 0.9]]]) { const q = P(p); ctx.fillText(lab, q.x - 3, q.y + 4); }
  const e0 = P([0, 0, 0]), e1 = P([L, 0, 0]);
  ctx.fillText(`${L}a`, (e0.x + e1.x) / 2 - 8, (e0.y + e1.y) / 2 + 16);

  // which view: a 3D slice of 4D, at which τ
  const r = stripRect(view);
  const t0 = Math.floor(viewState.tau), f = viewState.tau - t0;
  ctx.font = '600 11px ui-sans-serif, system-ui'; ctx.fillStyle = C('--ink');
  ctx.fillText(`3D SLICE of the 4D lattice at Euclidean time τ = ${viewState.tau.toFixed(2)} a`, r.x, r.y - 26);
  ctx.font = '11px ui-sans-serif, system-ui'; ctx.fillStyle = C('--muted');
  ctx.fillText(f < 0.01 ? `lattice slice ${t0} · x, y, z = space directions` : `between lattice slices ${t0} and ${(t0 + 1) % L}: linear interpolation (display only)`, r.x, r.y - 10);

  // τ strip: projection (sums over x, y, z) of the shown configuration; drag to move through τ
  const prof = sim.profile();
  let m = 1e-9;
  for (let t = 0; t < L; t++) m = Math.max(m, prof.S[t], Math.abs(prof.Q[t]));
  ctx.fillStyle = C('--panel'); ctx.globalAlpha = 0.72; ctx.fillRect(r.x - 6, r.y - 4, r.w + 12, r.h + 22); ctx.globalAlpha = 1;
  const bw = r.w / L, mid = r.y + r.h / 2;
  for (let t = 0; t < L; t++) {
    const x = r.x + t * bw;
    const hs = (prof.S[t] / m) * (r.h / 2 - 2);
    ctx.fillStyle = C('--muted'); ctx.globalAlpha = 0.35; ctx.fillRect(x + 2, mid - hs, bw - 4, 2 * hs); ctx.globalAlpha = 1;
    const hq = (prof.Q[t] / m) * (r.h / 2 - 2);
    ctx.fillStyle = prof.Q[t] >= 0 ? C('--body-0') : C('--body-1');
    ctx.fillRect(x + bw * 0.3, hq >= 0 ? mid - hq : mid, bw * 0.4, Math.abs(hq));
  }
  ctx.strokeStyle = C('--line-strong'); ctx.beginPath(); ctx.moveTo(r.x, mid); ctx.lineTo(r.x + r.w, mid); ctx.stroke();
  const cx = r.x + (viewState.tau + 0.5) / L * r.w;
  ctx.strokeStyle = C('--ink'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, r.y - 2); ctx.lineTo(cx, r.y + r.h + 2); ctx.stroke(); ctx.lineWidth = 1;
  ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.fillStyle = C('--muted');
  ctx.fillText(view.W < 600 ? 'τ → (drag) · sums over x,y,z: grey S, colour Q' : 'τ →  (drag)  bars: per-slice sums over x,y,z — grey S(τ), colour Q(τ)', r.x, r.y + r.h + 13);

  // colour key beside the view
  const kx = view.W - 34;
  let ky = 40;
  for (const b of overlayBoxes()) if (b.y0 < view.H * 0.5 && b.x1 > kx - 60) ky = Math.max(ky, b.y1 + 26);
  const kh = Math.max(60, Math.min(170, r.y - 70 - ky));
  const sc = sliceCache?.scale ?? 1;
  if (viewState.quantity === 'charge') {
    for (let i = 0; i < kh; i++) { const v = 1 - 2 * i / kh; ctx.fillStyle = v >= 0 ? C('--body-0') : C('--body-1'); ctx.globalAlpha = Math.abs(v); ctx.fillRect(kx, ky + i, 12, 1); }
    ctx.globalAlpha = 1; ctx.fillStyle = C('--muted'); ctx.textAlign = 'right';
    ctx.fillText(`+${sci(sc, 2)}`, kx - 4, ky + 8); ctx.fillText('0', kx - 4, ky + kh / 2 + 4); ctx.fillText(`−${sci(sc, 2)}`, kx - 4, ky + kh);
    ctx.fillText('q(x)', kx + 12, ky - 8);
  } else {
    for (let i = 0; i < kh; i++) { const c = colormap('inferno', 1 - i / kh).map(v => Math.round(v * 255)); ctx.fillStyle = `rgb(${c})`; ctx.fillRect(kx, ky + i, 12, 1); }
    ctx.fillStyle = C('--muted'); ctx.textAlign = 'right';
    ctx.fillText(sci(sc, 2), kx - 4, ky + 8); ctx.fillText('0', kx - 4, ky + kh);
    ctx.fillText('s(x)', kx + 12, ky - 8);
  }
  ctx.fillText('per site, units 8π²/g²', kx + 12, ky + kh + 16);
  ctx.textAlign = 'start';
  if (viewState.centre) {
    const [dx, dy, dz] = shiftFor(sim);
    if (dx || dy || dz) { ctx.fillStyle = C('--faint'); ctx.fillText(view.W < 600 ? `view shifted by (${dx}, ${dy}, ${dz}) a (periodic)` : `view shifted periodically by (${dx}, ${dy}, ${dz}) a to centre the strongest lump`, r.x, r.y + r.h + 28); }
  }
}

function onPointer(canvas, view, getSim) {
  // τ strip drag (registered first so it can stop the camera drag)
  let dragging = false;
  const setFromX = (e) => {
    const sim = getSim(), r = stripRect(view), rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    viewState.tau = Math.max(0, Math.min(sim.L - 0.001, ((x - r.x) / r.w) * sim.L - 0.5 + 0.5));
    viewState.animate = false; animToggle?.input && (animToggle.input.checked = false);
    tauControls.slider?.setValue(+viewState.tau.toFixed(2));
  };
  canvas.addEventListener('pointerdown', e => {
    const r = stripRect(view), rect = canvas.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 6 && y <= r.y + r.h + 18) {
      dragging = true; canvas.setPointerCapture(e.pointerId); setFromX(e); e.stopImmediatePropagation(); e.preventDefault();
    }
  });
  canvas.addEventListener('pointermove', e => { if (dragging) { setFromX(e); e.stopImmediatePropagation(); } });
  canvas.addEventListener('pointerup', e => { if (dragging) { dragging = false; e.stopImmediatePropagation(); } });
  cam.attach(canvas);
}

// ------------------------------------------------------------------ side panel: view controls and lumps

function extraSections(side, { values }) {

    select([{ value: 'action', label: 'Action density s(x) (gauge-invariant)' }, { value: 'charge', label: 'Topological charge density q(x) (gauge-invariant)' }], viewState.quantity, v => { viewState.quantity = v; }));
  const op = slider({ label: 'Volume opacity (display)', min: 0.3, max: 6, value: viewState.opacity, digits: 2, onInput: v => { viewState.opacity = v; } });
  const ctr = toggle('Centre strongest lump (periodic shift)', viewState.centre, v => { viewState.centre = v; });

    tauControls.host, animToggle, speed, qty, op, ctr);

  lumpSec.body.append(lumpsBody, el('p', { class: 'qv-note' }, 'Local maxima of s(x) in 4D above 20 % of the maximum. q/s = +1: self-dual (instanton-like); −1: anti-self-dual (anti-instanton-like). ρ is the size a BPST instanton with the same peak density would have (an upper estimate; see Verification). Click a row to jump to its τ.'));
  sec.after(lumpSec);
