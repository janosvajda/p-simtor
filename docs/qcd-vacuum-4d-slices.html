function syncTauSlider(sim) {
  if (tauControls.L === sim.L || !tauControls.host) return;
  tauControls.L = sim.L;
  viewState.tau = Math.min(viewState.tau, sim.L - 0.01);
  tauControls.slider = slider({ label: 'Euclidean time τ (slice)', min: 0, max: sim.L - 0.01, value: +viewState.tau.toFixed(2), unit: 'a', digits: 3,
    onInput: v => { viewState.tau = v; viewState.animate = false; if (animToggle) animToggle.input.checked = false; } });
  tauControls.host.replaceChildren(tauControls.slider);
}

function renderLumps(sim) {
  if (!lumpsBody || (lumpsVersion === sim.shown.version && lumpsSim === sim)) return;
  lumpsVersion = sim.shown.version; lumpsSim = sim;
  const lumps = sim.lumps().slice(0, 8);
  if (!lumps.length) { lumpsBody.replaceChildren(el('p', { class: 'qv-note' }, 'No lumps above threshold.')); return; }
  const rows = lumps.map(l => {
    const col = l.duality > 0.5 ? 'var(--body-0)' : l.duality < -0.5 ? 'var(--body-1)' : 'var(--muted)';
    const kind = l.duality > 0.5 ? 'instanton-like' : l.duality < -0.5 ? 'anti-inst.-like' : 'mixed';
    const tr = el('tr', { 'data-t': l.t, onclick: () => { viewState.tau = l.t; viewState.animate = false; if (animToggle) animToggle.input.checked = false; tauControls.slider?.setValue(l.t); } },
      el('td', {}, el('span', { class: 'qv-sw', style: `background:${col}` }), kind),
      el('td', {}, `(${l.x},${l.y},${l.z})`), el('td', {}, String(l.t)), el('td', {}, l.duality.toFixed(2)), el('td', {}, `${l.rho.toFixed(1)}a`));
    return tr;
  });
  lumpsBody.replaceChildren(el('table', { class: 'qv-lumps' },
    el('tr', {}, el('th', {}, 'type (sign of q)'), el('th', {}, 'x, y, z'), el('th', {}, 'τ'), el('th', {}, 'q/s'), el('th', {}, 'ρ est.')), ...rows));
}

// ------------------------------------------------------------------ workbench: equations and figures
function bench({ eqs, figs, createPlot, createEquation, createDerivation, M, getSim }) {
  const hist = createPlot({ title: 'Topological charge Q during sampling and smoothing (algorithm sweeps, not time)', height: 220,
    x: { label: 'sweep', min: 0, max: 80 }, y: { label: 'Q', min: -3, max: 3 } });
  const act = createPlot({ title: 'Wilson action S/(8π²/g²): smoothing removes the ultraviolet noise', height: 220,
    x: { label: 'sweep', min: 0, max: 80 }, y: { label: 'S / (8π²/g²)', log: true, min: 0.5, max: 2000 } });
  const prof = createPlot({ title: 'Projection onto τ: per-slice sums over x, y, z of the shown configuration', height: 220,
    x: { label: 'Euclidean time τ', unit: 'a', min: 0, max: 8 }, y: { label: 'per slice, units 8π²/g²', min: -1, max: 1 },
    onCursor: t => { const sim = getSim(); viewState.tau = Math.max(0, Math.min(sim.L - 0.01, t)); viewState.animate = false; if (animToggle) animToggle.input.checked = false; tauControls.slider?.setValue(+viewState.tau.toFixed(2)); } });
  figs.append(hist.el, act.el, prof.el);

  const cur = { sim: null };
  const sh = () => cur.sim.shown;
  const q = M.i('q'), s = M.i('s'), x = M.i('x');
  const ident = createEquation({
    title: 'Where the action sits: self-dual (instanton-like), anti-self-dual, and the rest (sums over all sites, units 8π²/g²)',
    lhs: { mathml: `${M.i('Σ')}${s}${M.paren(x)}`, label: 'total action (improved clover)', value: () => sh().S, digits: 4 },
    terms: [
      { id: 'qp', mathml: M.sub(M.i('Q'), M.o('+')), label: 'Σ q over q > 0 sites', color: '--body-0', value: () => sh().Qp, digits: 4 },
      { id: 'qm', mathml: `<mo>|</mo>${M.sub(M.i('Q'), M.o('−'))}<mo>|</mo>`, label: 'Σ |q| over q < 0 sites', color: '--body-1', value: () => -sh().Qm, digits: 4 },
      { id: 'rest', mathml: `${M.i('Σ')}<mo>(</mo>${s}<mo>−</mo><mo>|</mo>${q}<mo>|</mo><mo>)</mo>`, label: 'not (anti-)self-dual: ≥ 0', color: '--muted', value: () => sh().S - sh().Qp + sh().Qm, digits: 4 },
    ],
    note: 'Exact identity, because s(x) ≥ |q(x)| at every site (the BPS inequality). Q = Q₊ − |Q₋|. An isolated instanton has S ≈ Q₊ ≈ 1.',
  });
  const wil = createEquation({
    title: 'One instanton’s action in lattice units',
    lhs: { mathml: `${M.frac(`<mn>8</mn>${M.sup(M.i('π'), M.n(2))}`, M.sup(M.i('g'), M.n(2)))}`, label: 'continuum instanton action, with β = 4/g²', value: () => 2 * Math.PI ** 2 * cur.sim.beta, digits: 4 },
    terms: [{ id: 'b', mathml: `<mn>2</mn>${M.sup(M.i('π'), M.n(2))}${M.i('β')}`, label: 'Wilson-action units; the lattice instanton is lower by (a/ρ)²/5', color: '--body-2', value: () => 2 * Math.PI ** 2 * cur.sim.beta, digits: 4 }],
    where: [
      { mathml: M.i('β'), meaning: 'lattice coupling 4/g²', value: () => cur.sim.beta },
      { mathml: `${M.sub(M.i('S'), M.i('W'))}<mo>/</mo>${M.i('β')}`, meaning: 'sum over plaquettes of (1 − ½TrU_P), shown configuration', value: () => sh().SW * 2 * Math.PI ** 2 },
    ],
  });
  const steps = createDerivation([
    { mathml: `${M.sub(M.i('S'), M.i('W'))}<mo>=</mo>${M.i('β')}<munder><mo>∑</mo><mi>P</mi></munder><mo>(</mo><mn>1</mn><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>Tr</mtext>${M.sub(M.i('U'), M.i('P'))}<mo>)</mo>`, note: 'Wilson action; the Monte Carlo samples configurations with weight exp(−S_W).' },
    { mathml: `${M.sup(M.i('F'), M.i('a'))}${M.sub('', `<mi>μ</mi><mi>ν</mi>`)}<mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac>${M.sub(M.i('F'), M.n('1×1'))}<mo>−</mo><mfrac><mn>1</mn><mn>3</mn></mfrac>${M.sub(M.i('F'), M.n('2×2'))}`, note: 'Field strength from the vector part of clover-averaged 1×1 and 2×2 loops; the combination cancels the O(a²) error (checked on an exact instanton).' },
    { mathml: `${q}<mo>=</mo><mfrac><mn>1</mn><mrow><mn>32</mn>${M.sup(M.i('π'), M.n(2))}</mrow></mfrac>${M.sup(M.i('ε'), `<mi>μ</mi><mi>ν</mi><mi>ρ</mi><mi>σ</mi>`)}${M.sup(M.i('F'), M.i('a'))}${M.sub('', `<mi>μ</mi><mi>ν</mi>`)}${M.sup(M.i('F'), M.i('a'))}${M.sub('', `<mi>ρ</mi><mi>σ</mi>`)}<mo>/</mo><mn>2</mn><mo>,</mo><mspace width="0.6em"/>${s}<mo>=</mo><mfrac><mn>1</mn><mrow><mn>32</mn>${M.sup(M.i('π'), M.n(2))}</mrow></mfrac>${M.sup(M.i('F'), M.i('a'))}${M.sup(M.i('F'), M.i('a'))}`, note: 'Charge and action densities, both in units of the one-instanton action 8π²/g²; Q = Σ q is an integer in the continuum.' },
    { mathml: `${q}${M.paren(x)}<mo>=</mo><mfrac><mrow><mn>6</mn>${M.sup(M.i('ρ'), M.n(4))}</mrow><mrow>${M.sup(M.i('π'), M.n(2))}${M.sup(M.paren(`${M.sup(x, M.n(2))}<mo>+</mo>${M.sup(M.i('ρ'), M.n(2))}`), M.n(4))}</mrow></mfrac>`, note: 'BPST instanton of size ρ (self-dual: s = q). Used to verify the measurement and to estimate lump sizes from peak heights.' },
  ], { title: 'From links to topological charge' });
  eqs.append(ident.el, wil.el, steps);

  let lastV = -1, lastSim = null;
  return {
    update(sim) {
      cur.sim = sim;
      syncTauSlider(sim);
      renderLumps(sim);
      ident.update(); wil.update();
      const total = sim.nTherm + sim.nCool;
      if (sim !== lastSim || sim.shown.version !== lastV) {
        lastSim = sim; lastV = sim.shown.version;
        const H = sim.history;
        hist.setX({ min: 0, max: Math.max(total, 1) });
        const qs = H.map(h => h.Q), qmax = Math.max(2.5, ...qs.map(Math.abs)) * 1.1;
        hist.setY({ min: -qmax, max: qmax });
        for (let n = -3; n <= 3; n++) hist.hline(`int${n}`, n, { color: '--grid-strong' });
        hist.vline('cool', sim.nTherm, { color: '--warn', label: 'smoothing starts' });
        hist.data('Q', H.map(h => [h.sweep, h.Q]), { color: '--body-2', label: 'Q (improved clover)', width: 2 });
        act.setX({ min: 0, max: Math.max(total, 1) });
        act.vline('cool', sim.nTherm, { color: '--warn', label: 'smoothing starts' });
        act.data('SW', H.map(h => [h.sweep, Math.max(h.SW, 1e-3)]), { color: '--body-4', label: 'S_W / (8π²/g²)', width: 2 });
        const nQ = Math.abs(Math.round(sim.shown.Q));
        act.setY({ min: Math.max(1e-2, Math.min(0.5, ...H.map(h => h.SW)) * 0.7), max: Math.max(...H.map(h => h.SW)) * 1.5, log: true });
        if (nQ > 0) act.hline('bps', nQ, { color: '--good', label: `BPS bound |Q| = ${nQ}` }); else act.remove('bps');
        const p = sim.profile(), L = sim.L;
        const pm = Math.max(0.2, ...p.S, ...p.Q.map(Math.abs)) * 1.1;
        prof.setX({ min: 0, max: L - 1 }).setY({ min: -pm, max: pm });
        prof.data('S', Array.from(p.S, (v, t) => [t, v]), { color: '--muted', label: 'S(τ) = Σ_xyz s', width: 1.6 });
        prof.data('Q', Array.from(p.Q, (v, t) => [t, v]), { color: '--body-0', label: 'Q(τ) = Σ_xyz q', width: 2 });
        prof.hline('zero', 0, { color: '--grid-strong' });
        hist.invalidate(); act.invalidate(); prof.invalidate();
      }
      prof.cursor(viewState.tau); prof.invalidate();
      hist.draw(); act.draw(); prof.draw();
    },
  };
}

// ------------------------------------------------------------------ compute pacing: at most ~7 ms of physics per frame
let bypass = false, burstUsed = 0, lastEnd = 0;
let currentSim = null;                                    // the shell formats times (timeline) before `app` exists
function create(params) {
  const sim = createSim(params);
  currentSim = sim;
  const step = sim.step.bind(sim);
  sim.step = () => {
    if (!bypass) {
      const now = performance.now();
      if (now - lastEnd > 4) burstUsed = 0;              // a new frame
      if (burstUsed > 7) return;                          // budget spent: leave the rest for the next frame
      step();
      lastEnd = performance.now(); burstUsed += lastEnd - now;
    } else step();
  };
  return sim;
}

const phaseText = (sim, t) => {
  if (!sim) return `${fix(t, 1)} sweeps`;
  if (innerWidth < 600) {                                   // phone: compact, so the timeline ends fit under the scene
    if (t < sim.nTherm) return `MC ${Math.floor(t)}/${sim.nTherm}`;
    if (t < sim.nTherm + sim.nCool) return `cool ${Math.floor(t - sim.nTherm)}/${sim.nCool}`;
    return `done ${sim.nTherm}+${sim.nCool}`;
  }
  if (t < sim.nTherm) return `Monte Carlo sweep ${Math.floor(t)} / ${sim.nTherm}`;
  if (t < sim.nTherm + sim.nCool) return `cooling sweep ${Math.floor(t - sim.nTherm)} / ${sim.nCool}`;
  return `finished: ${sim.nTherm} MC + ${sim.nCool} cooling sweeps`;
};

  presets: [

// Scripted stepping (window.psim.steps / advanceTo) must do every requested step: bypass the frame budget.
for (const k of ['steps', 'advanceTo']) {
  const f = window.psim[k];
  window.psim[k] = (...a) => { bypass = true; try { return f(...a); } finally { bypass = false; } };
}

// Page self-test: slice extraction matches the model data; the GPU volume is drawn inside the box only.
window.psim.selfTest = () => {
  const sim = app.sim, L = sim.L, V3 = L * L * L, out = [];
  const keep = { ...viewState };
  viewState.centre = false;
  const sl = sliceAt(sim, 2, 'action');
  let dev = 0;
  for (let i = 0; i < V3; i++) dev = Math.max(dev, Math.abs(sl[i] - sim.shown.s[2 * V3 + i]));
  out.push({ label: 'Volume slice τ = 2 equals the computed s(x) on lattice slice 2', maxDeviation: dev, pass: dev < 1e-6 });
  const mid = sliceAt(sim, 2.5, 'charge');
  let dev2 = 0;
  for (let i = 0; i < V3; i++) dev2 = Math.max(dev2, Math.abs(mid[i] - 0.5 * (sim.shown.q[2 * V3 + i] + sim.shown.q[3 * V3 + i])));
  out.push({ label: 'τ = 2.5 shows the average of slices 2 and 3 (declared linear interpolation)', maxDeviation: dev2, pass: dev2 < 1e-6 });
  const gl = document.querySelector('canvas.psim-gl').getContext('webgl2');
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, dpr = devicePixelRatio || 1;
  const px = (x, y) => { const b = new Uint8Array(4); gl.readPixels(Math.round(x), Math.round(H - 1 - y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); return [...b]; };
  Object.assign(viewState, { quantity: 'action', animate: false, opacity: 6 });
  const top = sim.lumps()[0];
  viewState.tau = top.t; uploadedKey = '';
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  drawGL(gl, sim, app.view);
  const p = cam.project([top.x + 0.5, top.y + 0.5, top.z + 0.5], W / dpr, H / dpr);
  const at = px(p.x * dpr, p.y * dpr), corner = px(3, 3);
  out.push({ label: 'GPU volume: the strongest lump’s site is lit; nothing outside the box', atLump: at, corner, pass: at[3] > 20 && corner[3] === 0 });
  Object.assign(viewState, keep); uploadedKey = '';
  // Reproducibility: the same seed in this browser vs the Node run behind the Verification report
  const ref = [0.38847564831115955, 0.49846587440365103];        // ⟨P⟩ after sweeps 1, 2 (Node, default parameters)
  const twin = createSim(Object.fromEntries(PARAMS.map(q => [q.key, q.value])));
  while (twin.history.length < 3) twin.step();
  const devs = ref.map((v, k) => Math.abs(twin.history[k + 1].plaq - v));
  out.push({ label: 'Browser reproduces the Node run behind the Verification report (default seed, first sweeps)', deviations: devs, pass: devs.every(d => d < 1e-12) });
  return out;
};
