<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);

  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;

.psim-title { min-width: 0; flex: 0 1 auto; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);

  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }

.psim-iconbtn {

  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;

}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.psim-hud {

.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);

  padding: 5px; border-radius: 12px;

  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;

}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }

.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;

@media (max-width: 860px) {

  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }

@media (prefers-reduced-motion: reduce) {

/* ---------- figures (ui/plot.mjs) ---------- */

.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;

  transition: opacity .15s, border-color .15s; outline: none;

.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }

.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }

.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }

@media (max-width: 860px) {

}

@media (max-width: 860px) {

  .psim-app.workbench { grid-template-rows: auto auto auto; }

  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }

}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }

.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {

// ---------------------------------------------------------------- spheres

/**

// ---------------------------------------------------------------- lines

// ---------------------------------------------------------------- solid objects (meshes)

/**

 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)

    box(sx = 1, sy = 1, sz = 1) {

//   curve), radius enclosing 90 % of disk stars R₉₀(t), unbound fraction (specific energy ≥ 0).
// Representation: GPU points at the computed 3D positions (physical space, kpc); colour encodes a
//   computed quantity (v_φ, starting radius, or bound/unbound); dark-matter density is drawn as a
//   ray-marched volume of the analytic NFW profile (dark matter emits no light: a disclosed convention).
const { energies, angularMomenta, circularSpeed, potential, acceleration, haloMass, haloDensity, eilers2019, MW, G, R0, V0, TIME_UNIT_MYR, NFW_SCALE } = __psim["core/galaxy.mjs"];
const { rng, gaussLegendre, integrateToInfinity } = __psim["core/numerics.mjs"];
const DT_MYR = 0.5;
const DT = DT_MYR / TIME_UNIT_MYR;            // time units (kpc/(km/s))
const BULGE_A = 0.6;                          // Hernquist scale used by core/galaxy.mjs (checked in verify)
const DISK_RD = 2.6, DISK_H = 0.25, DISK_RMIN = 0.5, DISK_RMAX = 25, DISK_SIGMA = 10;
const BULGE_FRACTION = MW.Mb / (MW.Mb + MW.Md);
const SPOKES = 4, SPOKE_HALF_WIDTH = 0.035;   // dye tracers: disk stars that start within ±2° of 4 spokes
const FULL = { bulge: true, disk: true, halo: true };

const PARAMS = [
  { key: 'halo', label: 'Dark-matter halo', value: 'on', options: [
    { value: 'on', label: 'On: bulge + disk + dark-matter halo' },
    { value: 'off', label: 'Off: visible matter only (bulge + disk)' },
  ] },
  { key: 'velocities', label: 'Starting star speeds', value: 'observed', options: [
    { value: 'observed', label: 'Measured-like: circular speeds of the full model' },
    { value: 'equilibrium', label: 'Balanced for the chosen potential' },
  ], hint: 'Measured-like speeds with the halo off asks: could visible matter alone hold stars moving as fast as observed? Balanced speeds show the slower galaxy that visible matter could hold.' },
  { key: 'n', label: 'Number of stars', min: 5000, max: 150000, value: 100000, log: true, digits: 3, integer: true },
  { key: 'seed', label: 'Random seed', min: 1, max: 99, value: 7, digits: 2, integer: true },
];

// ---------------------------------------------------------------- initial conditions

/**
 * Isotropic Jeans dispersion of a Hernquist tracer, ρ ∝ 1/(r (r + a)³), in the spherical
 * approximation of the potential, g(r) = v_c²(r)/r (midplane circular speed):
 *   σ_r²(r) = (1/ρ(r)) ∫_r^∞ ρ(r′) g(r′) dr′.
 */
function jeansSigma(r, comps, a = BULGE_A) {
  const rho = s => 1 / (s * (s + a) ** 3);
  const I = integrateToInfinity(x => { const s = r + x; return rho(s) * meanRadialPull(s, comps); }, { panels: 24, n: 24 });
  return Math.sqrt(I / rho(r));
}

/** Monopole of the potential: radial pull −∂Φ/∂r averaged over the sphere of radius r (exact for spherical parts). */
function meanRadialPull(r, comps) {
  const acc = new Float64Array(3);
  return gaussLegendre(mu => {
    const R = r * Math.sqrt(1 - mu * mu), z = r * mu;
    acceleration(R, 0, z, comps, MW, acc);
    return -(acc[0] * R + acc[2] * z) / r;
  }, 0, 1, 24);
}

/**
 * Vertical velocity dispersion for a Gaussian layer of scale h at radius R, from the vertical
 * virial theorem: σ_z² = ⟨z ∂Φ/∂z⟩ over ρ(z) ∝ exp(−z²/2h²) (exact for a harmonic potential, σ_z = νh).
 */
function verticalSigma(R, comps, h = DISK_H) {
  const acc = new Float64Array(3), w = z => Math.exp(-z * z / (2 * h * h));
  const num = gaussLegendre(z => { acceleration(R, 0, z, comps, MW, acc); return -w(z) * z * acc[2]; }, 0, 6 * h, 32);
  return Math.sqrt(num / gaussLegendre(w, 0, 6 * h, 32));
}

/** Hernquist (1990, ApJ 356, 359, eq. 10): exact isotropic σ_r for a pure Hernquist sphere. */
function hernquistSigma(r, M = MW.Mb, a = BULGE_A) {
  const s = r / a;
  const v = G * M / (12 * a) * (12 * s * (1 + s) ** 3 * Math.log((1 + s) / s) - s / (1 + s) * (25 + 52 * s + 42 * s * s + 12 * s ** 3));
  return Math.sqrt(v);
}

function sigmaTable(comps) {
  const lo = Math.log(0.05), hi = Math.log(12), K = 72, tab = new Float64Array(K);
  for (let k = 0; k < K; k++) tab[k] = jeansSigma(Math.exp(lo + (hi - lo) * k / (K - 1)), comps);
  return r => {
    const f = Math.min(K - 1.001, Math.max(0, (Math.log(r) - lo) / (hi - lo) * (K - 1))), k = Math.floor(f);
    return tab[k] + (f - k) * (tab[k + 1] - tab[k]);
  };
}

/**
 * Builds the star ensemble in the object layout of core/galaxy.mjs (so stepDisk, energies and
 * angularMomenta apply): { n, x, v, a, comps, t, steps } plus per-star metadata.
 */
function createGalaxy({ n = 100000, comps = FULL, velocityModel = 'observed', seed = 7 }) {
  const rand = rng(seed);
  const velComps = velocityModel === 'observed' ? FULL : comps;
  const x = new Float64Array(3 * n), v = new Float64Array(3 * n), a = new Float64Array(3 * n);
  const R0s = new Float32Array(n), kind = new Uint8Array(n);   // kind: 0 disk, 1 bulge, 2 disk dye tracer
  const nBulge = Math.round(n * BULGE_FRACTION), nDisk = n - nBulge;
  const sig = sigmaTable(velComps);
  const RG = Array.from({ length: 50 }, (_, k) => DISK_RMIN * (DISK_RMAX / DISK_RMIN) ** (k / 49));
  const SZ = RG.map(R => verticalSigma(R, velComps));
  const sigz = R => { const f = Math.min(48.999, Math.max(0, Math.log(R / DISK_RMIN) / Math.log(DISK_RMAX / DISK_RMIN) * 49)), k = Math.floor(f); return SZ[k] + (f - k) * (SZ[k + 1] - SZ[k]); };
  const vesc = r => Math.sqrt(-2 * potential(r, 0, velComps));
  for (let i = 0; i < nDisk; i++) {
    let R;
    do { R = -DISK_RD * Math.log(rand() * rand()); } while (R < DISK_RMIN || R > DISK_RMAX);
    const ph = 2 * Math.PI * rand();
    const vc = circularSpeed(R, velComps).total;
    const z = DISK_H * rand.normal();
    const vR = DISK_SIGMA * rand.normal(), vp = vc + DISK_SIGMA * rand.normal(), vz = sigz(R) * rand.normal();
    const c = Math.cos(ph), s = Math.sin(ph);
    x[3 * i] = R * c; x[3 * i + 1] = R * s; x[3 * i + 2] = z;
    v[3 * i] = vR * c - vp * s; v[3 * i + 1] = vR * s + vp * c; v[3 * i + 2] = vz;
    R0s[i] = R;
    const frac = (ph * SPOKES / (2 * Math.PI)) % 1;                       // position between two spokes
    const dphi = Math.min(frac, 1 - frac) * 2 * Math.PI / SPOKES;         // angle to the nearest spoke
    kind[i] = dphi < SPOKE_HALF_WIDTH && R > 1.5 ? 2 : 0;
  }
  // bulge stars: Hernquist M(<r)/M = r²/(r + a)² → r = a√u/(1 − √u); kept within 0.2–6 kpc
  for (let i = nDisk; i < n; i++) {
    let r;
    do { const q = Math.sqrt(rand()); r = BULGE_A * q / (1 - q); } while (r < 0.2 || r > 6);
    const cz = 2 * rand() - 1, ph = 2 * Math.PI * rand(), sz = Math.sqrt(1 - cz * cz);
    x[3 * i] = r * sz * Math.cos(ph); x[3 * i + 1] = r * sz * Math.sin(ph); x[3 * i + 2] = r * cz;
    const s = sig(r), cap = 0.95 * vesc(r);
    let vx, vy, vz;
    do { vx = s * rand.normal(); vy = s * rand.normal(); vz = s * rand.normal(); } while (vx * vx + vy * vy + vz * vz > cap * cap);
    v[3 * i] = vx; v[3 * i + 1] = vy; v[3 * i + 2] = vz;
    R0s[i] = r; kind[i] = 1;
  }
  const tmp = new Float64Array(3);
  for (let i = 0; i < n; i++) {
    acceleration(x[3 * i], x[3 * i + 1], x[3 * i + 2], comps, MW, tmp);
    a[3 * i] = tmp[0]; a[3 * i + 1] = tmp[1]; a[3 * i + 2] = tmp[2];
  }
  const g = { n, nDisk, nBulge, x, v, a, R0s, kind, comps, t: 0, steps: 0 };
  g.E0 = energies(g);
  g.L0 = angularMomenta(g);
  return g;
}

/**
 * One kick-drift-kick leapfrog step of size dt for every star (core/galaxy.mjs stepDisk has one
 * step for all stars). Stars are independent test particles, so each population can use its own
 * fixed step and stay exactly symplectic: bulge stars take BULGE_SUBSTEPS substeps, because their
 * low-angular-momentum orbits pass through the central density cusp.
 */
const BULGE_SUBSTEPS = 8;
function stepGalaxy(g, dt) {
  const { x, v, a, comps } = g, acc = new Float64Array(3);
  for (let i = 0; i < g.n; i++) {
    const reps = i < g.nDisk ? 1 : BULGE_SUBSTEPS, h = dt / reps, j = 3 * i;
    for (let r = 0; r < reps; r++) {
      v[j] += 0.5 * h * a[j]; v[j + 1] += 0.5 * h * a[j + 1]; v[j + 2] += 0.5 * h * a[j + 2];
      x[j] += h * v[j]; x[j + 1] += h * v[j + 1]; x[j + 2] += h * v[j + 2];
      acceleration(x[j], x[j + 1], x[j + 2], comps, MW, acc);
      a[j] = acc[0]; a[j + 1] = acc[1]; a[j + 2] = acc[2];
      v[j] += 0.5 * h * a[j]; v[j + 1] += 0.5 * h * a[j + 1]; v[j + 2] += 0.5 * h * a[j + 2];
    }
  }
  g.t += dt; g.steps++;
}

/** Radius enclosing fraction q of the disk stars (histogram, 0.05 kpc bins to 200 kpc). */
function diskRadiusQuantile(g, q = 0.9) {
  const B = 4000, w = 0.05, h = new Uint32Array(B + 1);
  for (let i = 0; i < g.nDisk; i++) {
    const r = Math.hypot(g.x[3 * i], g.x[3 * i + 1], g.x[3 * i + 2]);
    h[Math.min(B, Math.floor(r / w))]++;
  }
  let c = 0;
  for (let k = 0; k <= B; k++) { c += h[k]; if (c >= q * g.nDisk) return (k + 1) * w; }
  return B * w;
}

/** Energy error per star, normalised by max(|E₀|, ½V₀²) so nearly unbound stars don't inflate it. */
function energyErrors(g) {
  const E = energies(g), err = new Float64Array(g.n);
  for (let i = 0; i < g.n; i++) err[i] = Math.abs(E[i] - g.E0[i]) / Math.max(Math.abs(g.E0[i]), 0.5 * V0 * V0);
  return { E, err };
}

function quantile(arr, q) {
  const s = Float64Array.from(arr).sort();
  return s[Math.min(s.length - 1, Math.floor(q * s.length))];
}

// ---------------------------------------------------------------- simulation contract

const compsOf = p => ({ bulge: true, disk: true, halo: p.halo === 'on' });

function createSim(p) {
  const n = Math.round(p.n), c = compsOf(p);
  const g = createGalaxy({ n, comps: c, velocityModel: p.velocities, seed: Math.round(p.seed) });
  const history = [[0, diskRadiusQuantile(g)]];
  let cache = null;
  const sim = {
    params: p, galaxy: g, comps: c, history,
    get t() { return g.t * TIME_UNIT_MYR; },
    step() {
      stepGalaxy(g, DT);
      if (g.steps % 20 === 0) history.push([sim.t, diskRadiusQuantile(g)]);
    },
    /** Tangential speed v_φ (km/s) of star i: the quantity a rotation curve measures. */
    vphi(i) {
      const X = g.x[3 * i], Y = g.x[3 * i + 1], R = Math.hypot(X, Y) || 1e-9;
      return (X * g.v[3 * i + 1] - Y * g.v[3 * i]) / R;
    },
    /** Mean v_φ of disk stars (|z| < 2 kpc) in radial bins: the simulated rotation curve. */
    measuredCurve(bins = 24, Rmax = 24) {
      const sum = new Float64Array(bins), cnt = new Float64Array(bins);
      for (let i = 0; i < g.nDisk; i++) {
        const R = Math.hypot(g.x[3 * i], g.x[3 * i + 1]), k = Math.floor(R / Rmax * bins);
        if (k < 0 || k >= bins || Math.abs(g.x[3 * i + 2]) > 2) continue;
        sum[k] += sim.vphi(i); cnt[k]++;
      }
      const pts = [];
      for (let k = 1; k < bins; k++) if (cnt[k] >= 20) pts.push([(k + 0.5) * Rmax / bins, sum[k] / cnt[k]]);
      return pts;
    },
    /** Diagnostics scan all N stars, so they are refreshed every 20 steps (10 Myr), when R₉₀ is sampled. */
    diagnostics() {
      if (cache && cache.steps === g.steps - (g.steps % 20)) return cache.d;
      const d = sim.measure();
      cache = { steps: g.steps - (g.steps % 20), d };
      return d;
    },
    measure() {
      const { E, err } = energyErrors(g), L = angularMomenta(g);
      let dE = 0, dL = 0, unbound = 0, far = 0;
      for (let i = 0; i < g.n; i++) {
        dE = Math.max(dE, err[i]);
        if (g.kind[i] !== 1) dL = Math.max(dL, Math.abs(L[i] - g.L0[i]) / Math.abs(g.L0[i]));
        if (E[i] >= 0) unbound++;
        if (Math.hypot(g.x[3 * i], g.x[3 * i + 1], g.x[3 * i + 2]) > 40) far++;
      }
      const r90 = history[history.length - 1][1];
      return [
        { key: 'dE', label: 'Worst star |ΔE| / max(|E₀|, ½V₀²)', value: dE, kind: 'error', good: 5e-3, warn: 3e-2 },
        { key: 'dL', label: 'Worst disk star |ΔL_z/L_z|', value: dL, kind: 'error', good: 1e-10, warn: 1e-6 },
        { key: 'r90', label: 'Radius holding 90 % of disk stars', value: r90, kind: 'value', text: `${r90.toFixed(1)} kpc (start ${history[0][1].toFixed(1)})` },
        { key: 'unbound', label: 'Unbound stars (E ≥ 0)', value: 0, kind: 'value', text: `${(100 * unbound / g.n).toFixed(2)} %` },
        { key: 'far', label: 'Stars beyond 40 kpc', value: 0, kind: 'value', text: `${(100 * far / g.n).toFixed(2)} %` },
        { key: 'vc', label: 'Potential’s v_c at R₀ = 8 kpc', value: circularSpeed(R0, c).total, kind: 'value', unit: 'km/s' },
        { key: 'orb', label: 'Orbital period at R₀', value: 2 * Math.PI * R0 / circularSpeed(R0, c).total * TIME_UNIT_MYR, kind: 'value', unit: 'Myr' },
      ];
    },
    state() {
      let r2 = 0;
      for (let i = 0; i < g.n; i++) r2 += g.x[3 * i] ** 2 + g.x[3 * i + 1] ** 2 + g.x[3 * i + 2] ** 2;
      return { t: g.t, n: g.n, nBulge: g.nBulge, rmsRadius: Math.sqrt(r2 / g.n), r90: history[history.length - 1][1], first: Array.from(g.x.subarray(0, 12)) };
    },
    record() {
      const rows = [];
      for (let R = 0.5; R <= 30; R += 0.5) {
        const vv = circularSpeed(R), nd = circularSpeed(R, { bulge: true, disk: true, halo: false });
        rows.push([R, vv.total, vv.bulge, vv.disk, vv.halo, nd.total, R >= 5 && R <= 25 ? eilers2019(R) : '']);
      }
      return { header: ['R_kpc', 'vc_total', 'vc_bulge', 'vc_disk', 'vc_halo', 'vc_no_dark_matter', 'vc_measured_Eilers2019'], rows };
    },
  };
  return sim;
}

// ---------------------------------------------------------------- verification

function evolve(p, tMyr) {
  const s = createSim(p), steps = Math.round(tMyr / DT_MYR);
  for (let k = 0; k < steps; k++) s.step();
  return s;
}
const rmsOf = (from, to, f) => { let s = 0; for (let i = from; i < to; i++) s += f(i) ** 2; return Math.sqrt(s / (to - from)); };

function verify() {
  const checks = [];
  const v8 = circularSpeed(R0);
  checks.push({ label: 'Normalisation: v_c(8 kpc) = 220 km/s, force fractions 5/60/35 % (MWPotential2014)', value: `${v8.total.toFixed(6)} km/s`, pass: Math.abs(v8.total - V0) < 1e-9 });
  checks.push({ label: 'Disk mass vs Bovy (2015) 6.8×10¹⁰ M☉', value: `${(MW.Md / 1e10).toFixed(2)}×10¹⁰ M☉`, pass: Math.abs(MW.Md / 6.8e10 - 1) < 0.02 });
  const a = new Float64Array(3), h = 1e-5;
  let worst = 0;
  for (const [x, y, z] of [[5, 3, 0.4], [0.7, -1.2, 0.1], [15, 2, -2]]) {
    acceleration(x, y, z, FULL, MW, a);
    const P = (X, Y, Z) => potential(Math.hypot(X, Y), Z, FULL);
    const gr = [-(P(x + h, y, z) - P(x - h, y, z)) / (2 * h), -(P(x, y + h, z) - P(x, y - h, z)) / (2 * h), -(P(x, y, z + h) - P(x, y, z - h)) / (2 * h)];
    for (let k = 0; k < 3; k++) worst = Math.max(worst, Math.abs(a[k] - gr[k]) / Math.hypot(...gr));
  }
  checks.push({ label: 'Analytic forces = −∇Φ (Hernquist + Miyamoto–Nagai + NFW)', value: `max rel. diff ${worst.toExponential(1)}`, pass: worst < 1e-7 });
  const Mnum = gaussLegendre(s => 4 * Math.PI * s * s * haloDensity(s), 1e-9, 30, 64);
  checks.push({ label: 'NFW M(<30 kpc): formula vs ∫4πr²ρ dr', value: `rel. diff ${Math.abs(Mnum / haloMass(30) - 1).toExponential(1)}`, pass: Math.abs(Mnum / haloMass(30) - 1) < 1e-6 });
  let dev = 0;
  for (let R = 5; R <= 25; R += 1) dev = Math.max(dev, Math.abs(circularSpeed(R).total / eilers2019(R) - 1));
  checks.push({ label: 'Model vs measured rotation curve 5–25 kpc (Eilers et al. 2019)', value: `max deviation ${(100 * dev).toFixed(1)} %`, pass: dev < 0.1, state: dev > 0.05 ? 'warn' : undefined });
  const noDM = circularSpeed(20, { bulge: true, disk: true, halo: false }).total;
  checks.push({ label: 'Visible matter alone: v_c(20 kpc) far below the measurement', value: `${noDM.toFixed(0)} vs ${eilers2019(20).toFixed(0)} km/s measured`, pass: noDM < 0.7 * eilers2019(20) });

  // initial conditions
  const bOnly = { bulge: true, disk: false, halo: false };
  const phiB = potential(1.3, 0, bOnly), phiExact = -G * MW.Mb / (1.3 + BULGE_A);
  checks.push({ label: 'Bulge sampler uses the potential’s Hernquist scale a = 0.6 kpc', value: `ΔΦ/Φ ${Math.abs(phiB / phiExact - 1).toExponential(1)}`, pass: Math.abs(phiB / phiExact - 1) < 1e-12 });
  let jw = 0;
  for (const r of [0.2, 0.6, 1.5, 4]) jw = Math.max(jw, Math.abs(jeansSigma(r, bOnly) / hernquistSigma(r) - 1));
  checks.push({ label: 'Jeans σ_r(r) solver vs Hernquist (1990) exact formula, 0.2–4 kpc', value: `max rel. diff ${jw.toExponential(1)}`, pass: jw < 1e-5 });

  // integrator
  const errAt = dt => {
    const g = createGalaxy({ n: 60, comps: FULL, seed: 3 });
    const steps = Math.round(0.25 / dt);
    for (let i = 0; i < steps; i++) stepGalaxy(g, dt);
    return { m: Math.max(...energyErrors(g).err.subarray(0, g.nDisk)), g };   // disk stars: smooth forces along their orbits
  };
  const e1 = errAt(1e-3), e2 = errAt(5e-4), order = Math.log2(e1.m / e2.m);
  checks.push({ label: 'Leapfrog energy error order, disk stars (expected 2)', value: order.toFixed(2), pass: Math.abs(order - 2) < 0.3 });
  const L = angularMomenta(e2.g); let dl = 0;
  for (let i = 0; i < e2.g.nDisk; i++) dl = Math.max(dl, Math.abs(L[i] - e2.g.L0[i]) / Math.abs(e2.g.L0[i]));
  checks.push({ label: 'Disk stars’ L_z conserved (axisymmetric potential, 245 Myr)', value: dl.toExponential(1), pass: dl < 1e-12 });

  // production step, 1 Gyr, full model
  const on = evolve({ halo: 'on', velocities: 'observed', n: 4000, seed: 5 }, 1000);
  const err = energyErrors(on.galaxy).err, med = quantile(err, 0.5), p99 = quantile(err, 0.99), mx = Math.max(...err);
  checks.push({ label: `Energy error at Δt = ${DT_MYR} Myr after 1 Gyr (4000 stars): median / 99th pct / worst`, value: `${med.toExponential(1)} / ${p99.toExponential(1)} / ${mx.toExponential(1)}`, pass: p99 < 1e-3 && mx < 3e-2 });

  // the initial conditions should be close to equilibrium in the full model
  const eq = evolve({ halo: 'on', velocities: 'observed', n: 30000, seed: 11 }, 500);
  const g0 = createGalaxy({ n: 30000, comps: FULL, seed: 11 }), g1 = eq.galaxy;
  const rb = g => quantile(Array.from({ length: g.nBulge }, (_, k) => { const i = 3 * (g.nDisk + k); return Math.hypot(g.x[i], g.x[i + 1], g.x[i + 2]); }), 0.5);
  const zd = g => rmsOf(0, g.nDisk, i => g.x[3 * i + 2]);
  const r90a = diskRadiusQuantile(g0), r90b = diskRadiusQuantile(g1);
  const drb = rb(g1) / rb(g0) - 1, dzd = zd(g1) / zd(g0) - 1, dr90 = r90b / r90a - 1;
  checks.push({ label: 'Near-equilibrium start with halo (30 000 stars, 500 Myr): change of bulge median r / disk rms z / disk R₉₀', value: `${(100 * drb).toFixed(1)} % / ${(100 * dzd).toFixed(1)} % / ${(100 * dr90).toFixed(1)} %`, pass: Math.abs(drb) < 0.05 && Math.abs(dzd) < 0.1 && Math.abs(dr90) < 0.03 });

  // the claim: visible matter cannot hold stars moving at the measured speeds
  const off = evolve({ halo: 'off', velocities: 'observed', n: 4000, seed: 5 }, 1000);
  const r90off = diskRadiusQuantile(off.galaxy);
  let unb = 0;
  for (const E of energies(off.galaxy)) if (E >= 0) unb++;
  checks.push({ label: 'Halo removed, measured-like speeds, 1 Gyr: disk R₉₀ grows; some stars unbound', value: `R₉₀ ${r90a.toFixed(1)} → ${r90off.toFixed(1)} kpc; ${(100 * unb / 4000).toFixed(1)} % unbound`, pass: r90off > 1.3 * r90a && unb > 0 });

  const d1 = createGalaxy({ n: 500, seed: 9 }), d2 = createGalaxy({ n: 500, seed: 9 });
  const same = d1.x.every((q, i) => q === d2.x[i]) && d1.v.every((q, i) => q === d2.v[i]);
  checks.push({ label: 'Deterministic initial conditions (seeded)', value: same ? 'identical' : 'differ', pass: same });

  return {
    summary: 'Mass model, initial conditions, integrator and the dark-matter claim checked against exact formulas, Bovy (2015), Hernquist (1990) and the measured Milky Way:',
    checks,
    notes: [
      'The model is normalised to 220 km/s at 8 kpc (MWPotential2014); modern measurements give ≈229 km/s, so it runs 4–8 % low.',
      'Stars are test particles: they feel the fixed potential but do not create it, so spiral arms and bars cannot form.',
    ],
  };
}

// ---- page
const { createInstrument } = __psim["ui/instrument-app.mjs"];
const { orbitCamera, createPointRenderer, createVolumeRenderer, colormap, normalize } = __psim["ui/gl.mjs"];
const { select, el } = __psim["ui/instrument.mjs"];
const { PARAMS, createSim, circularSpeed, eilers2019, haloDensity, R0, NFW_SCALE, DT_MYR, BULGE_SUBSTEPS } = __psim["local:physics.mjs"];
// ------------------------------------------------------------------ presentation state (never touches physics)
const ui = { colour: 'speed', dye: true, haze: true };
const COLOUR = {
  speed: { map: 'inferno', range: [-40, 320], ticks: [0, 100, 200, 300], unit: 'km/s', title: 'star speed |𝐯|' },
  origin: { map: 'viridis', range: [0, 25], ticks: [0, 5, 10, 15, 20, 25], unit: 'kpc', title: 'starting radius' },
};
const FOV = 0.72, CAM0 = { distance: 47, yaw: -2.1, pitch: 0.5 };
const cam = orbitCamera({ ...CAM0, fov: FOV });
const HALO_BOX = 36, HALO_N = 56;

// ------------------------------------------------------------------ GPU scene
let pts = null, dye = null, vol = null, up = { sim: null, steps: -1, colour: '' };
let pos32 = new Float32Array(0), val32 = new Float32Array(0), col32 = new Float32Array(0), dyePos = new Float32Array(0);

function nfwGrid() {
  const N = HALO_N, out = new Float32Array(N * N * N), h = 2 * HALO_BOX / (N - 1);
  for (let k = 0; k < N; k++) for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(-HALO_BOX + i * h, -HALO_BOX + j * h, -HALO_BOX + k * h);
    out[i + N * (j + N * k)] = r > HALO_BOX ? 0 : haloDensity(Math.max(r, 0.4));     // spherical cut at 36 kpc
  }
  return out;
}

function upload(sim) {
  const g = sim.galaxy, n = g.n;
  if (pos32.length !== 3 * n) { pos32 = new Float32Array(3 * n); val32 = new Float32Array(n); col32 = new Float32Array(3 * n); }
  for (let k = 0; k < 3 * n; k++) pos32[k] = g.x[k];
  if (ui.colour === 'speed') for (let i = 0; i < n; i++) val32[i] = Math.hypot(g.v[3 * i], g.v[3 * i + 1], g.v[3 * i + 2]);
  else if (ui.colour === 'origin') val32.set(g.R0s);
  else for (let i = 0; i < n; i++) col32.set(g.E0[i] < 0 ? [1, 0.78, 0.45] : [0.3, 0.85, 1], 3 * i);   // E is conserved per star
  pts.update(pos32, ui.colour === 'bound' ? { colors: col32 } : { values: val32 });

  for (let i = 0; i < n; i++) if (g.kind[i] === 2) m++;
  if (dyePos.length !== 3 * m) dyePos = new Float32Array(3 * m);
  for (let i = 0, q = 0; i < n; i++) if (g.kind[i] === 2) { dyePos[q++] = g.x[3 * i]; dyePos[q++] = g.x[3 * i + 1]; dyePos[q++] = g.x[3 * i + 2]; }

}

function drawGL(gl, sim, view) {

    vol.update(nfwGrid(), HALO_N, HALO_N, HALO_N, { range: [haloDensity(HALO_BOX), haloDensity(0.4) * 3e3], log: true });
  }

  const c = COLOUR[ui.colour] ?? {};

}

// ------------------------------------------------------------------ 2D overlay: measuring rings, labels, colour bar
function projector(view) {
  const m = cam.matrices(view.W / view.H).viewProj;
  return (x, y, z) => {
    const X = m[0] * x + m[4] * y + m[8] * z + m[12], Y = m[1] * x + m[5] * y + m[9] * z + m[13], w = m[3] * x + m[7] * y + m[11] * z + m[15];
    return [(X / w * 0.5 + 0.5) * view.W, (1 - (Y / w * 0.5 + 0.5)) * view.H, w];
  };
}

function draw(ctx, sim, view) {
  const { W, H } = view, C = view.color, P = projector(view);
  ctx.font = '10.5px ui-monospace, Menlo, monospace';
  ctx.lineWidth = 1;
  const ring = (r, style, dash) => {
    ctx.strokeStyle = style; ctx.setLineDash(dash ?? []); ctx.beginPath();
    for (let k = 0; k <= 96; k++) { const a = 2 * Math.PI * k / 96, [x, y] = P(r * Math.cos(a), r * Math.sin(a), 0); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  ctx.globalAlpha = 0.55;
  for (const r of [10, 20, 30]) ring(r, C('--grid-strong'));
  ctx.globalAlpha = 0.9;
  ring(R0, C('--warn'), [3, 4]);
  ctx.globalAlpha = 1;
  // labels on the near side of each ring (facing the camera)
  const ang = cam.yaw;
  ctx.fillStyle = C('--muted');
  for (const r of [10, 20, 30]) { const [x, y, w] = P(r * Math.cos(ang), r * Math.sin(ang), 0); if (w > 0 && x > 8 && x < W - 60 && y < H - 60) ctx.fillText(`${r} kpc`, x + 4, y + 13); }
  { const a = ang - 0.75, [x, y, w] = P(R0 * Math.cos(a), R0 * Math.sin(a), 0); if (w > 0) { ctx.fillStyle = C('--warn'); ctx.textAlign = 'right'; ctx.fillText('Sun’s orbit, 8 kpc', x - 6, y + 14); ctx.textAlign = 'start'; } }

  // colour key (bottom-left)
  const x0 = 18, y0 = W < 600 ? 150 : H - 44, bw = Math.min(170, W * 0.38);
  ctx.fillStyle = C('--muted');
  if (ui.colour === 'bound') {
    const items = [['bound star (E < 0)', '#ffc773'], ['unbound (E ≥ 0)', '#4dd9ff']];
    items.forEach(([t, col], k) => { ctx.fillStyle = col; ctx.fillRect(x0, y0 + 14 * k - 6, 8, 8); ctx.fillStyle = C('--muted'); ctx.fillText(t, x0 + 14, y0 + 14 * k + 2); });
  } else {
    const c = COLOUR[ui.colour], lo = c.ticks[0], hi = c.ticks[c.ticks.length - 1];
    ctx.fillText(`${c.title} (${c.unit})`, x0, y0 - 6);
    for (let k = 0; k < bw; k++) {
      const v = lo + (hi - lo) * k / (bw - 1), [r, g, b] = colormap(c.map, normalize(v, c.range));
      ctx.fillStyle = `rgb(${255 * r | 0},${255 * g | 0},${255 * b | 0})`; ctx.fillRect(x0 + k, y0, 1, 8);
    }
    ctx.fillStyle = C('--muted'); ctx.textAlign = 'center';
    for (const t of c.ticks) ctx.fillText(String(t), x0 + (t - lo) / (hi - lo) * (bw - 1), y0 + 21);
    ctx.textAlign = 'start';
  }
  if (sim.comps.halo && ui.haze) { ctx.fillStyle = C('--muted'); ctx.fillText('violet haze: dark-matter density (log scale)', x0, y0 - 22); }
}

function onPointer(canvas) {
  canvas.style.cursor = 'grab';
  cam.attach(canvas);
  canvas.addEventListener('dblclick', () => Object.assign(cam, CAM0));
}

// ------------------------------------------------------------------ figures and equations below the stage
function bench({ eqs, figs, createPlot, createEquation, M }) {
  eqs.append(el('p', { class: 'dm-note' },
    el('b', {}, 'How to read it. '),
    'Each point is one computed star. Stars at 5–25 kpc are measured to orbit at a nearly constant 200–230 km/s. The visible bulge and disk can only hold such fast stars near the centre: set “Dark-matter halo” to Off and watch the outer disk swell and some stars escape. The white streaks (navy in the light theme) are dye markers: stars that started on four straight spokes, sheared by differential rotation (they are not spiral arms).'));
  const cur = { R: R0 };
  const curve = createPlot({
    title: 'Rotation curve v_c(R): what holds the stars in orbit', height: 320,
    x: { label: 'radius R', unit: 'kpc', min: 0, max: 28 },
    y: { label: 'circular speed', unit: 'km/s', min: 0, max: 280 },
    onCursor: R => { cur.R = Math.max(0.3, R); },
  });
  const spread = createPlot({
    title: 'Size of the stellar disk over time', height: 320,
    x: { label: 'time', unit: 'Myr', min: 0, max: 1000 },
    y: { label: 'radius holding 90 % of disk stars R₉₀', unit: 'kpc', min: 0, max: 30 },
  });

  curve.fn('bulge', R => circularSpeed(R).bulge, { color: '--body-0', label: 'bulge', width: 1.3 });
  curve.fn('disk', R => circularSpeed(R).disk, { color: '--body-1', label: 'stellar disk', width: 1.3 });
  curve.fn('halo', R => circularSpeed(R).halo, { color: '--body-4', label: 'dark-matter halo', width: 1.3 });
  curve.fn('visible', R => circularSpeed(R, visible).total, { color: '--muted', dash: true, label: 'visible matter only' });
  curve.fn('total', R => circularSpeed(R, all).total, { color: '--ink', label: 'model total', width: 2.2 });
  curve.fn('eilers', R => (R >= 5 && R <= 25 ? eilers2019(R) : NaN), { color: '--warn', dot: true, label: 'measured (Eilers+ 2019)', width: 2 });
  curve.cursor(cur.R);

  const vsq = (s, sub) => M.sup(M.sub(M.i(s), M.i(sub)), M.n(2));
  const eq = createEquation({
    title: 'Where the orbital speed comes from (values at the cursor radius)',
    lhs: { mathml: `${M.sup(M.sub(M.i('v'), M.i('c')), M.n(2))}${M.paren(M.i('R'))}`, label: 'circular speed², total', value: () => circularSpeed(cur.R).total ** 2, unit: 'km²/s²', digits: 5 },
    terms: [
      { id: 'bulge', mathml: vsq('v', 'bulge'), label: 'bulge (Hernquist)', color: '--body-0', value: () => circularSpeed(cur.R).bulge ** 2, unit: 'km²/s²', digits: 4 },
      { id: 'disk', mathml: vsq('v', 'disk'), label: 'stars and gas (Miyamoto–Nagai)', color: '--body-1', value: () => circularSpeed(cur.R).disk ** 2, unit: 'km²/s²', digits: 4 },
      { id: 'halo', mathml: vsq('v', 'halo'), label: 'dark matter (NFW)', color: '--body-4', value: () => circularSpeed(cur.R).halo ** 2, unit: 'km²/s²', digits: 4 },
    ],
    where: [
      { mathml: M.sup(M.sub(M.i('v'), M.i('i')), M.n(2)), meaning: 'R × radial pull of component i (gravity balances the centripetal acceleration)' },
      { mathml: M.sub(M.i('M'), M.i('halo')) + M.paren(`<mo>&lt;</mo>${M.i('r')}`), meaning: 'NFW: 4πρ₀r_s³ [ln(1 + r/r_s) − (r/r_s)/(1 + r/r_s)], r_s', value: () => NFW_SCALE, unit: 'kpc' },
      { mathml: M.i('R'), meaning: 'cursor radius (drag on the plot)', value: () => cur.R, unit: 'kpc', digits: 3 },
      { mathml: `${M.sub(M.i('v'), M.i('c'))}`, meaning: 'circular speed at the cursor', value: () => circularSpeed(cur.R).total, unit: 'km/s', digits: 4 },
    ],
    note: 'Without the halo term, v_c falls roughly as 1/√R beyond the disk (Kepler). Measured speeds stay nearly flat: that missing pull is the evidence for dark matter.',
    link: curve,
  });
  eqs.append(eq.el);

  let lastSteps = -1, lastSim = null;
  return {
    update(sim, t, { rebuilt }) {
      const g = sim.galaxy;
      if (rebuilt || sim !== lastSim || g.steps - lastSteps >= 10) {

        const h = sim.history, tEnd = h[h.length - 1][0];
        spread.setX({ max: Math.max(1000, Math.ceil(tEnd / 500) * 500) });
        spread.setY({ max: Math.max(30, Math.ceil(Math.max(...h.map(p => p[1])) / 10) * 10) });

}

// GPU self-test (psim check): the uploaded points are the simulation's stars, and they render.
window.psim.selfTest = () => {
  const sim = app.sim, g = sim.galaxy;
  if (pts) upload(sim);
  let dev = 0;
  for (let k = 0; k < 3 * g.n; k += 997) dev = Math.max(dev, Math.abs(pos32[k] - g.x[k]));
  const glc = document.querySelector('canvas.psim-gl'), gl = glc?.getContext('webgl2');

    lit = b[3];
  }
  return [
    { label: 'GPU buffer holds every computed star at its position', count: pts?.count, n: g.n, maxDeviationKpc: dev, pass: pts?.count === g.n && dev < 1e-3 },
    { label: 'Galaxy centre renders (alpha at projected origin)', alpha: lit, pass: lit > 0 },

};
