  const loopRow = el('div', { class: 'psim-btns', style: 'align-items:center;gap:10px;flex-wrap:wrap' }, el('span', { class: 'psim-hint', style: 'margin:0' }, 'Loop drawn in the 3D view (display only):'), loopSel);
  eqs.append(loopRow, ctlRow, aSlider, eqRun.el, eqChi.el);
  recompute();

  let lastCount = -1, lastSim = null;
  return {
    update(sim) {
      const e = sim.estimates();
      cur = e;
      eqChi.update();
      // plaquette history: every sweep (warm-up shaded)
      const h = sim.plaqHist;
      if (sim !== lastSim || h.length % 4 === 0) {
        fPl.setX({ min: 0, max: Math.max(100, h.length) });
        fPl.band('warm', 0, sim.warmup, { color: '--grid-strong', alpha: 0.5, label: 'warm-up (discarded)' });
        fPl.data('p', h.map((v, i) => [i, v]), { color: '--body-1', width: 1.2, label: sim.params.start === 'cold' ? 'cold start' : 'hot start' });
        fPl.invalidate(); fPl.draw();
      }
      if (sim === lastSim && e?.count === lastCount) return;
      lastSim = sim; lastCount = e?.count ?? -1;
      const n = sim.n, u = strongU(sim.beta);
      fArea.setX({ min: 0, max: n * n + 0.5 });
      fPot.setX({ min: 0.5, max: n + 0.5 });
      fChi.setX({ min: 1.5, max: n + 0.5 });
      // leading strong-coupling reference: −ln W = −RT ln u (exact in 2D; leading order in 4D)
      fArea.fn('sc', A => -A * Math.log(u), { color: '--muted', dash: true, width: 1.2, label: 'leading strong coupling −RT·ln u(β)', ignoreScale: true });
      fChi.hline('sc', -Math.log(u), { label: `strong coupling −ln u(β) = ${(-Math.log(u)).toFixed(3)}` });
      for (const id of ['w1', 'w2', 'w3', 'w4', 'v', 'v1', 'chi']) { fArea.remove(id); fPot.remove(id); fChi.remove(id); }
      if (e) {
        const cols = ['--body-0', '--body-1', '--body-2', '--body-3'];
        for (let R = 1; R <= n; R++) {
          const pts = [], err = [];
          for (let T = 1; T <= n; T++) {
            const i = (R - 1) * n + T - 1, W = e.W.value[i], dW = e.W.error[i];
            if (W > 0) { pts.push([R * T, -Math.log(W)]); err.push(dW / W); }
          }
          fArea.data(`w${R}`, pts, { dots: true, errors: err, color: cols[R - 1], r: 3, label: `R = ${R}, T = 1…${n}` });
        }
        const ok = (arr, err) => arr.map((v, i) => [i, v, err[i]]).filter(([, v, d]) => Number.isFinite(v) && Number.isFinite(d));
        const V = ok(e.V.value, e.V.error), V1 = e.V1 ? ok(e.V1.value, e.V1.error) : [];
        fPot.data('v', V.map(([i, v]) => [i + 1, v]), { dots: true, errors: V.map(x => x[2]), color: '--body-0', r: 3.2, label: `T = ${e.T}` });
        if (V1.length) fPot.data('v1', V1.map(([i, v]) => [i + 1.06, v]), { dots: true, errors: V1.map(x => x[2]), color: '--body-1', r: 2.6, label: `T = ${e.T - 1} (T-dependence check)` });
        const X = ok(e.chi.value, e.chi.error);
        fChi.data('chi', X.map(([i, v]) => [i + 2, v]), { dots: true, errors: X.map(x => x[2]), color: '--body-0', r: 3.2, label: `measured, ${e.count} configurations` });
      }
      const ymaxA = e ? Math.max(1, ...e.W.value.filter(w => w > 0).map(w => -Math.log(w))) * 1.15 : 4;
      fArea.setY({ min: 0, max: ymaxA });
      const vv = e ? [...e.V.value, ...(e.V1?.value ?? [])].filter(Number.isFinite) : [];
      fPot.setY({ min: 0, max: vv.length ? Math.max(...vv) * 1.25 : 2 });
      const cc = e ? e.chi.value.filter(Number.isFinite) : [];
      fChi.setY({ min: 0, max: Math.max(0.2, ...cc, Math.min(2, -Math.log(u))) * 1.3 });
      for (const f of [fArea, fPot, fChi]) { f.invalidate(); f.draw(); }
    },
  };
}
