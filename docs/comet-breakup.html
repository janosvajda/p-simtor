<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;

.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);

  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }

.psim-iconbtn {

  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-view canvas.grab { cursor: grab; }
.psim-view canvas.grabbing { cursor: grabbing; }
.psim-view canvas.move { cursor: move; }

.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }

.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px; min-height: 100%; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) {
  .psim-bench { padding: 12px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */

  .psim-app.workbench .psim-stage { overflow: visible; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */

.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */

/* ---------- full screen (scene + HUD + legend + playback bar) ---------- */
.psim-fs { background: var(--stage, var(--bg)); border-radius: 0 !important; border: 0 !important; }
.psim-pseudo-fs { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; max-height: none !important; z-index: 1000; margin: 0 !important; }
.psim-fsbtn { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; }
.psim-fsbtn:hover { background: var(--raise); color: var(--ink); }
.psim-fsbtn svg { width: 15px; height: 15px; }



/* The animation view is a dark screen in BOTH page themes: scenes (glows, density maps, space) are
   designed for it, and every page looks the same. Panels, text and figures follow the page theme. */
.psim-view, :root[data-theme="light"] .psim-view {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  color-scheme: dark;
}

/* ---------- the scene: plain intro, clean view, player bar, key ---------- */
/* Everything about the animation lives in one card: what it shows (in plain words), the view with
   nothing written over it, a video-player bar right under it, and the key to its colours below. */
.psim-scene { display: flex; flex-direction: column; min-height: 0; background: var(--stage); }
.psim-stage > .psim-scene { position: absolute; inset: 0; }
.psim-scene.psim-canvaswrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.psim-view { position: relative; flex: 1 1 auto; min-height: 0;
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }

.psim-intro { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: 14px/1.55 var(--sans); color: var(--ink-2); }

.psim-intro p { margin: 0; color: var(--ink); max-width: 80ch; }
.psim-intro ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.psim-intro li::before { content: '→ '; color: var(--accent); }

.psim-intro.collapsed ul { display: none; }
.psim-more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: 500 12.5px var(--sans); cursor: pointer; }

.psim-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, var(--stage)); }

.psim-action:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }

.psim-clock[hidden] { display: none; }

.psim-clock .dim { font: 10.5px var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-clock b { font: 500 15px var(--mono); color: var(--ink); white-space: nowrap; }

.psim-timeline { flex: 1 1 200px; min-width: 120px; padding: 0 10px; font: 10.5px var(--mono); color: var(--muted); position: relative; }
.psim-timeline .ticks { position: relative; height: 17px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .bar::before { content: ''; position: absolute; inset: -8px 0; }   /* a taller hit area */
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }
.psim-timeline .m.measured, .psim-tlrow i.measured { background: var(--good, #4cc38a); }
.psim-timeline .lab.measured { color: var(--good, #4cc38a); }
.psim-timeline .m.requested, .psim-tlrow i.requested { background: var(--warn, #e0a030); }
.psim-timeline .lab.requested { color: var(--warn, #e0a030); }
.psim-tlrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: baseline; margin: 6px 0; font-size: 12px; }
.psim-tlrow i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.psim-tlrow code { font: 12px var(--mono); color: var(--ink); }
.psim-tlrow small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }

.psim-legend span { min-width: 0; }
.psim-hud { display: flex; flex-wrap: wrap; gap: 2px 14px; font: 11.5px/1.45 var(--mono); color: var(--muted); }
.psim-hud span:empty { display: none; }
.psim-hud .flag { color: var(--warn); }

.psim-endcard { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 90%, transparent);

  .psim-scene:has(.psim-actions) > .psim-view { height: max(260px, calc(100svh - 64px - 132px - 26px - 62px)); }   /* the action row fits too */
  .psim-intro { padding: 12px 14px; font-size: 13.5px; }
  .psim-side > .psim-intro { margin: 12px 12px 4px; }
  .psim-transport { flex-wrap: wrap; row-gap: 2px; padding: 6px 8px; }
  .psim-transport .psim-timeline { order: -1; flex: 1 1 100%; padding: 0 4px 4px; }
  .psim-transport .psim-clock { flex: 1 1 auto; }
  .psim-transport label.speed { padding: 0 4px; }
  .psim-transport label.speed { font-size: 0; }
  .psim-transport input[type=range] { width: 80px; }
  .psim-transport output { min-width: 0; font-size: 11px; }
  .psim-transport .sep { display: none; }
  .psim-timeline .lab { font-size: 9.5px; }
  .psim-key { padding: 8px 12px; font-size: 11.5px; }

}

  const e = Math.floor(Math.log10(Math.abs(x)));

}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.

  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;
uniform mat4 uVP; uniform vec2 uViewport; uniform float uWidth;

precision highp float;

    update(data) { lines = Array.isArray(data) && data.length && typeof data[0] !== 'number' ? data : [data]; },
    draw(camera, { aspect, width = 2, color = '#9fb3c8', opacity = 1, dash = null, depthTest = true } = {}) {

}

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */
const geometry = (() => {
  const make = (pos, nrm, idx) => ({ positions: Float32Array.from(pos), normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) });
  const quad = (P, N, I, a, b, c, d, n) => { const o = P.length / 3; P.push(...a, ...b, ...c, ...d); for (let k = 0; k < 4; k++) N.push(...n); I.push(o, o + 1, o + 2, o, o + 2, o + 3); };

    box(sx = 1, sy = 1, sz = 1) {
      const x = sx / 2, y = sy / 2, z = sz / 2, P = [], N = [], I = [];
      quad(P, N, I, [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1]);
      quad(P, N, I, [-x, y, -z], [x, y, -z], [x, -y, -z], [-x, -y, -z], [0, 0, -1]);
      quad(P, N, I, [x, -y, -z], [x, y, -z], [x, y, z], [x, -y, z], [1, 0, 0]);
      quad(P, N, I, [-x, y, -z], [-x, -y, -z], [-x, -y, z], [-x, y, z], [-1, 0, 0]);
      quad(P, N, I, [x, y, -z], [-x, y, -z], [-x, y, z], [x, y, z], [0, 1, 0]);
      quad(P, N, I, [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [0, -1, 0]);

    },
    cylinder(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [];

        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        const o = P.length / 3;
        P.push(r * c0, r * s0, 0, r * c1, r * s1, 0, r * c1, r * s1, h, r * c0, r * s0, h); N.push(c0, s0, 0, c1, s1, 0, c1, s1, 0, c0, s0, 0);
        I.push(o, o + 1, o + 2, o, o + 2, o + 3);
        for (const [zz, nz] of [[h, 1], [0, -1]]) { const q = P.length / 3; P.push(0, 0, zz, r * c0, r * s0, zz, r * c1, r * s1, zz); N.push(0, 0, nz, 0, 0, nz, 0, 0, nz); I.push(...(nz > 0 ? [q, q + 1, q + 2] : [q, q + 2, q + 1])); }
      }

    },
    cone(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [], k = r / h;

        const nn = a => { const l = Math.hypot(1, k); return [Math.cos(a) / l, Math.sin(a) / l, k / l]; };

        I.push(o, o + 1, o + 2);
        const q = P.length / 3; P.push(0, 0, 0, r * Math.cos(a1), r * Math.sin(a1), 0, r * Math.cos(a0), r * Math.sin(a0), 0); N.push(0, 0, -1, 0, 0, -1, 0, 0, -1); I.push(q, q + 1, q + 2);

    },
    sphere(r = 0.5, n = 24) {

        const th = Math.PI * j / n, ph = Math.PI * i / n, v = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];

    },
    disc(r = 0.5, n = 48) {

    },
    plane(sx = 1, sy = 1) { const P = [], N = [], I = []; quad(P, N, I, [-sx / 2, -sy / 2, 0], [sx / 2, -sy / 2, 0], [sx / 2, sy / 2, 0], [-sx / 2, sy / 2, 0], [0, 0, 1]); return make(P, N, I); },
    /**
     * Parametric surface: point(u, v) → [x, y, z] over u ∈ [u0, u1], v ∈ [v0, v1] on an nu × nv grid;
     * optional value(u, v) per vertex (for colormapped meshes). Normals from central differences.

    arrow(length = 1, { shaft = 0.03 * length, head = 0.08 * length, headLength = 0.22 * length, n = 24 } = {}) {
      const hl = Math.min(headLength, length), a = this.cylinder(shaft, length - hl, n), b = this.cone(head, hl, n);

        positions: Float32Array.from([...a.positions, ...Array.from(b.positions, (v, i) => (i % 3 === 2 ? v + length - hl : v))]),

    },
  };
})();

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */
function alignZ(dir) {
  const l = Math.hypot(...dir);
  if (!(l > 0)) throw new Error('alignZ: direction must be non-zero');
  const [x, y, z] = dir.map(v => v / l);
  if (z < -1 + 1e-12) return [1, 0, 0, 0, -1, 0, 0, 0, -1];
  // Rodrigues rotation about ẑ × d by the angle between them
  const k = 1 / (1 + z);
  return [1 - x * x * k, -x * y * k, x, -x * y * k, 1 - y * y * k, y, -x, -y, z];
}

/**
 * Point lists for createLineRenderer.update(): each returns one polyline [x,y,z, …] or an array of them.
 *   circle(center, normal, r, n)        closed circle (great circles, cone rims, orbits)
 *   boxEdges([min, max])                the 12 edges of a box, as separate segments
 *   grid(dims, { spacing, origin })     all lattice lines of a 1–3D grid with dims points per axis
 *   arrow(from, to, { head, normal })   shaft and a two-stroke head in the plane containing normal
 */
const polylines = {
  circle(center = [0, 0, 0], normal = [0, 0, 1], r = 1, n = 96) {
    const R = alignZ(normal), out = [];
    for (let i = 0; i <= n; i++) {
      const a = 2 * Math.PI * i / n, p = [r * Math.cos(a), r * Math.sin(a), 0];
      for (let k = 0; k < 3; k++) out.push(center[k] + R[3 * k] * p[0] + R[3 * k + 1] * p[1] + R[3 * k + 2] * p[2]);
    }
    return out;
  },
  boxEdges([lo, hi]) {
    const c = i => [i & 1 ? hi[0] : lo[0], i & 2 ? hi[1] : lo[1], i & 4 ? hi[2] : lo[2]];
    const out = [];
    for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b)) out.push([...c(i), ...c(i | b)]);
    return out;
  },
  grid(dims, { spacing = 1, origin = [0, 0, 0] } = {}) {
    const d = [...dims, 1, 1].slice(0, 3), sp = typeof spacing === 'number' ? [spacing, spacing, spacing] : spacing, out = [];
    for (let ax = 0; ax < dims.length; ax++) {
      const [b, c] = [0, 1, 2].filter(k => k !== ax);
      for (let i = 0; i < d[b]; i++) {for (let j = 0; j < d[c]; j++) {
        const p = [0, 0, 0], q = [0, 0, 0];
        p[b] = q[b] = i; p[c] = q[c] = j; p[ax] = 0; q[ax] = d[ax] - 1;
        out.push([0, 1, 2].map(k => origin[k] + p[k] * sp[k]).concat([0, 1, 2].map(k => origin[k] + q[k] * sp[k])));
      }}
    }

  },

    if (Math.hypot(...side) < 1e-9 * L) side = Math.abs(d[0]) < 0.9 * L ? [0, d[2], -d[1]] : [-d[2], 0, d[0]];
    const sl = Math.hypot(...side), h = head * L;
    const wing = sgn => [0, 1, 2].map(k => to[k] - d[k] / L * h + sgn * side[k] / sl * h * 0.5);
    return [[...from, ...to], [...wing(1), ...to, ...wing(-1)]];
  },
};

/**
 * A colour-bar legend on the 2D canvas for a colormap-mapped quantity, matching the GPU colours.
 * ctx in CSS pixels (the shell's draw ctx). Vertical by default (low at the bottom), or
 * horizontal. Ticks at nice values (decades when log). Returns the bar's rectangle.
 */
function drawColorBar(ctx, { x, y, width = 12, height = 120, colormap: map = 'viridis', range = [0, 1], log = false, label = '', ticks = 5, horizontal = false, color, format } = {}) {
  // tokens of the element the bar is drawn in (the view is dark in both page themes)
  const css = name => (typeof getComputedStyle === 'function' ? getComputedStyle(ctx.canvas?.closest?.('.psim-view') ?? document.documentElement).getPropertyValue(name).trim() : '');
  const text = color ?? (css('--muted') || '#8a94a6');
  const [lo, hi] = log ? range.map(Math.log10) : range;
  const steps = Math.max(2, Math.round(horizontal ? width : height));
  ctx.save();   // leaves the caller's fill, stroke, font and text alignment unchanged
  for (let i = 0; i < steps; i++) {
    const c = colormap(map, (i + 0.5) / steps).map(v => Math.round(255 * v));
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    if (horizontal) ctx.fillRect(x + i * width / steps, y, width / steps + 0.5, height);
    else ctx.fillRect(x, y + height - (i + 1) * height / steps, width, height / steps + 0.5);
  }
  ctx.strokeStyle = text; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, width - 1, height - 1);
  const vals = [];
  if (log) { for (let e = Math.ceil(lo - 1e-9); e <= hi + 1e-9; e++) vals.push(e); }
  else {
    const raw = (hi - lo) / Math.max(1, ticks - 1), mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw * 0.999) ?? raw;
    for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9 * step; v += step) vals.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  }
  const fmt = format ?? (v => (log ? `10${String(v).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}` : Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-2 && v !== 0) ? v.toExponential(1) : String(+v.toPrecision(4))));
  ctx.fillStyle = text; ctx.font = '11px system-ui, sans-serif';
  for (const v of vals) {
    const f = (v - lo) / (hi - lo);
    if (horizontal) { const px = x + f * width; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillRect(px, y + height, 1, 3); ctx.fillText(fmt(v), px, y + height + 4); }
    else { const py = y + height - f * height; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillRect(x + width, py, 3, 1); ctx.fillText(fmt(v), x + width + 5, py); }
  }
  if (label) {
    ctx.textAlign = horizontal ? 'center' : 'left'; ctx.textBaseline = 'bottom';
    // vertical: clear of the top tick's label, which is centred on the bar's top edge
    ctx.fillText(label, horizontal ? x + width / 2 : x, y - (horizontal ? 4 : 10));
  }
  ctx.restore();
  return { x, y, width, height };
}

/**
 * Model matrix (column-major, float64 array of 16) from translate [x,y,z], rotate (radians about
 * x, then y, then z, or a row-major 3×3 rotation matrix of 9 numbers, e.g. alignZ(dir)) and scale (number or [sx,sy,sz]). compose(a, b) = a·b
 * builds hierarchies (e.g. a seat hanging from a rotating rope).
 */
function transform({ translate = [0, 0, 0], rotate = [0, 0, 0], scale = 1 } = {}) {
  const s = typeof scale === 'number' ? [scale, scale, scale] : scale;

    R = [rotate[0], rotate[3], rotate[6], rotate[1], rotate[4], rotate[7], rotate[2], rotate[5], rotate[8]];

  // spec.timeline = { duration, markers: [{ t, label, kind: 'computed' | 'measured' | 'requested' }], note }

    const start = Number.isFinite(+val(timelineSpec.start)) ? +val(timelineSpec.start) : (sim.t ?? 0);

    if (!(duration > start)) throw new Error(`timeline.duration (the end time) must be later than the start ${start}`);
    const span = duration - start, tol = 1e-9 * Math.max(Math.abs(duration), span);
    const all = (val(timelineSpec.markers) ?? []).filter(m => Number.isFinite(m.t));

    // e.g. the impacts after a computed break-up) is listed in the side panel as "beyond this run",
    // never stretched onto the bar: the run still ends where the model ends

    const beyond = all.filter(m => !markers.includes(m));

    // a watchable run in every mode: `seconds` (or a function of sim and params) sets the default
    // speed so that the whole run plays in that many seconds, whatever its length in this mode
    const secs = +val(timelineSpec.seconds);
    // (only when the run's length changed, so a speed the viewer chose survives a restart)

    tlEl.hidden = false;
    const fmt = t => (formatTime ? formatTime(t) : `${+t.toPrecision(4)} ${timeUnit}`);
    // the bar: one tick per key time, short labels above (staggered when close), full text as a tooltip
    const bar = tlEl.querySelector('.bar'), ticks = tlEl.querySelector('.ticks');
    bar.querySelectorAll('.m').forEach(e => e.remove());

      const x = 100 * (m.t - start) / span;

      const anchor = x < 15 ? 'translateX(0)' : x > 85 ? 'translateX(-100%)' : 'translateX(-50%)';

        row('run', `${fmt(start)} – ${fmt(duration)}`),
        ...markers.map(m => el('div', { class: 'psim-tlrow' }, el('i', { class: m.kind ?? 'computed' }), el('span', {}, m.label), el('code', {}, fmt(m.t)), el('small', {}, kinds[m.kind ?? 'computed']))),

        el('i', { class: c.pass !== true ? 'bad' : c.state === 'warn' ? 'warn' : '' }),
        el('span', {}, c.label), el('code', {}, c.value)));

    secVerify.body.append(el('p', { class: 'psim-hint' }, 'No build-time verification report is embedded in this page.'));
  }

  const secModel = section('Model, assumptions & limits', { open: false });
  secModel.body.append(
    el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, `${trustLabel}. `), tierReason ?? '')),
    ...(model.equations ?? []).flatMap(eq => [
      eq.caption ? el('p', { class: 'psim-hint' }, eq.caption) : null,
      el('div', { class: 'psim-math', html: eq.mathml }),

    model.assumptions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Assumptions and limits')), el('ul', {}, model.assumptions.map(a => el('li', {}, a)))) : null,

  const e = 1 - q / a, n = Math.sqrt(GMJ / a ** 3), b = a * Math.sqrt(1 - e * e);
  const solveE = M => {
    let E = Math.sign(M) * Math.min(Math.abs(M) / (1 - e), Math.cbrt(6 * Math.abs(M) / e));
    for (let k = 0; k < 60; k++) {
      const s2 = Math.sin(E / 2) ** 2;
      const f = (1 - e) * E + e * EminusSinE(E) - M, fp = (1 - e) + 2 * e * s2;
      const dE = f / fp; E -= dE;
      if (Math.abs(dE) < 1e-15 * Math.max(1, Math.abs(E))) break;
    }
    return E;
  };
  return {
    e, n, q, a,
    at(t) {
      const E = solveE(n * t), s2 = Math.sin(E / 2) ** 2, sE = Math.sin(E), cE = Math.cos(E);
      const Ed = n / (q / a + 2 * e * s2);
      return { x: q - 2 * a * s2, y: b * sE, vx: -a * sE * Ed, vy: b * cE * Ed };

  };
}

/** Exact tidal acceleration of Jupiter at offset (x,y,z) from the reference point R (no cancellation loss). */
function tidalAccel(R, x, y, z, out) {
  const Rx = R.x, Ry = R.y, Rn2 = Rx * Rx + Ry * Ry, Rn = Math.sqrt(Rn2);
  const sx = Rx + x, sy = Ry + y, sn2 = sx * sx + sy * sy + z * z, sn = Math.sqrt(sn2);
  const dR = -(2 * (Rx * x + Ry * y) + x * x + y * y + z * z) / (Rn + sn);   // |R| − |s|
  const diff = dR * (Rn2 + Rn * sn + sn2) / (sn2 * sn * Rn2 * Rn);            // 1/|s|³ − 1/|R|³
  const is3 = 1 / (sn2 * sn);
  out[0] = -GMJ * (x * is3 + Rx * diff);
  out[1] = -GMJ * (y * is3 + Ry * diff);
  out[2] = -GMJ * (z * is3);
  return out;
}

/** Jupiter's potential per unit mass relative to the reference point, −GM(1/|R+x| − 1/|R|), without cancellation. */
function tidalPotentialMinusRef(R, x, y, z) {
  const Rn = Math.hypot(R.x, R.y), sn = Math.hypot(R.x + x, R.y + y, z);
  const dR = -(2 * (R.x * x + R.y * y) + x * x + y * y + z * z) / (Rn + sn);   // |R| − |s|
  return -GMJ * dR / (Rn * sn);
}

// ---------- seeded generator (mulberry32) ----------
function rng(seed0) { let seed = seed0 | 0; return () => { seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ---------- the N-grain soft-sphere system (positions relative to the reference point; leapfrog) ----------
function makeSystem({ N, a, rho, positions, restitution, tide, t0 = 0, dtFactor = 1 }) {
  const m = 4 / 3 * Math.PI * a ** 3 * rho / PACK;          // grain mass (grains are denser than the bulk)
  const omegaG = Math.sqrt(4 / 3 * Math.PI * G * rho), omega = OMEGA_FACTOR * omegaG;
  const mu = m / 2, k = mu * omega * omega;
  const lnE = Math.log(restitution), zeta = -lnE / Math.sqrt(Math.PI ** 2 + lnE ** 2), c = 2 * zeta * mu * omega;
  const dt = 2 * Math.PI / omega / 25 / dtFactor;
  const x = new Float64Array(3 * N), u = new Float64Array(3 * N), acc = new Float64Array(3 * N);
  positions.forEach((p, i) => { x[3 * i] = p[0] * a; x[3 * i + 1] = p[1] * a; x[3 * i + 2] = p[2] * a; });
  const s = 2 * a, s2 = s * s, s3 = s ** 3, Gm = G * m, km = k / m, cm = c / m;
  let t = t0;
  const tmp = [0, 0, 0];
  function forces() {
    acc.fill(0);
    for (let i = 0; i < N; i++) {
      const xi = x[3 * i], yi = x[3 * i + 1], zi = x[3 * i + 2];
      const ui = u[3 * i], vi = u[3 * i + 1], wi = u[3 * i + 2];
      let ax = 0, ay = 0, az = 0;
      for (let j = i + 1; j < N; j++) {
        const dx = x[3 * j] - xi, dy = x[3 * j + 1] - yi, dz = x[3 * j + 2] - zi;
        const d2 = dx * dx + dy * dy + dz * dz;
        let f;   // acceleration of i along (dx,dy,dz) per unit separation
        if (d2 >= s2) { const d = Math.sqrt(d2); f = Gm / (d2 * d); }
        else {
          const d = Math.sqrt(d2);
          const vn = ((u[3 * j] - ui) * dx + (u[3 * j + 1] - vi) * dy + (u[3 * j + 2] - wi) * dz) / d;   // < 0 approaching
          f = Gm / s3 - (km * (s - d) - cm * vn) / d;
        }
        ax += f * dx; ay += f * dy; az += f * dz;
        acc[3 * j] -= f * dx; acc[3 * j + 1] -= f * dy; acc[3 * j + 2] -= f * dz;
      }
      acc[3 * i] += ax; acc[3 * i + 1] += ay; acc[3 * i + 2] += az;
    }
    if (tide) for (let i = 0; i < N; i++) {
      tide(t, x[3 * i], x[3 * i + 1], x[3 * i + 2], tmp);
      acc[3 * i] += tmp[0]; acc[3 * i + 1] += tmp[1]; acc[3 * i + 2] += tmp[2];
    }
  }
  forces();
  return {
    x, u, m, a, dt, k, c, N, get t() { return t; },
    step() {
      const h = 0.5 * dt;
      for (let i = 0; i < 3 * N; i++) { u[i] += h * acc[i]; x[i] += dt * u[i]; }
      t += dt;
      forces();
      for (let i = 0; i < 3 * N; i++) u[i] += h * acc[i];
    },
    centroid() { const cc = [0, 0, 0]; for (let i = 0; i < N; i++) for (let d = 0; d < 3; d++) cc[d] += x[3 * i + d] / N; return cc; },
    /** Pair potential energy (self-gravity + springs), J. */
    pairEnergy() {
      let E = 0;
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        const d = Math.hypot(x[3 * j] - x[3 * i], x[3 * j + 1] - x[3 * i + 1], x[3 * j + 2] - x[3 * i + 2]);
        if (d >= s) E -= Gm * m / d;
        else E += -Gm * m * (3 * s2 - d * d) / (2 * s3) + 0.5 * k * (s - d) ** 2;
      }
      return E;
    },
  };
}

// ---------- the initial rubble ball: FCC grains in a sphere, settled once under its own gravity ----------
const ballCache = new Map();
/** Grain centres in units of the grain radius. Density-independent (every force scales with Gρ). */
function settledBall(N) {
  if (ballCache.has(N)) return ballCache.get(N);
  const pts = [], L = Math.ceil(Math.cbrt(N)) + 3, r = rng(7), sc = Math.SQRT2;   // FCC: even-sum integer points × √2 → spacing 2
  for (let i = -L; i <= L; i++) for (let j = -L; j <= L; j++) for (let k = -L; k <= L; k++) {
    if (((i + j + k) % 2 + 2) % 2 !== 0) continue;
    pts.push([i * sc + 0.02 * (r() - 0.5), j * sc + 0.02 * (r() - 0.5), k * sc + 0.02 * (r() - 0.5)]);
  }
  pts.sort((p, q) => (p[0] ** 2 + p[1] ** 2 + p[2] ** 2) - (q[0] ** 2 + q[1] ** 2 + q[2] ** 2));
  const rhoRef = 600, aRef = 1;   // shape is independent of these
  const sys = makeSystem({ N, a: aRef, rho: rhoRef, positions: pts.slice(0, N), restitution: 0.1, tide: null });
  for (let s = 0; s < 1500; s++) sys.step();   // 60 contact periods with strong damping
  const cx = sys.centroid(), out = [];
  for (let i = 0; i < N; i++) out.push([sys.x[3 * i] - cx[0], sys.x[3 * i + 1] - cx[1], sys.x[3 * i + 2] - cx[2]]);
  ballCache.set(N, out);
  return out;
}

/** Friends-of-friends groups of touching grains. sizes: descending; label: group rank per grain (0 = largest). */
function findPieces(x, N, link) {
  const parent = Int32Array.from({ length: N }, (_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const l2 = link * link;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const dx = x[3 * j] - x[3 * i], dy = x[3 * j + 1] - x[3 * i + 1], dz = x[3 * j + 2] - x[3 * i + 2];
    if (dx * dx + dy * dy + dz * dz < l2) { const p = find(i), q = find(j); if (p !== q) parent[p] = q; }
  }
  const count = new Map(), label = new Int32Array(N);
  for (let i = 0; i < N; i++) { const r = find(i); label[i] = r; count.set(r, (count.get(r) || 0) + 1); }
  const groups = [...count.entries()].sort((p, q) => q[1] - p[1] || p[0] - q[0]);
  const rank = new Map(groups.map(([r], i) => [r, i]));
  for (let i = 0; i < N; i++) label[i] = rank.get(label[i]);
  return { sizes: groups.map(g => g[1]), label };
}

const MIN_PIECE = 5;   // grains (1 % of the mass)

function createSim({ q = 1.33, rho = 0.6, N = N_GRAINS, dtFactor = 1, restitution = RESTITUTION, tEnd = T_END } = {}) {
  const qm = q * RJ, rhoSI = rho * 1000;
  const orbit = keplerOrbit(qm);
  const tau = Math.sqrt(2 * qm ** 3 / GMJ);
  const t0 = -tau * (2 + 8 / 3);               // parabolic time from r = 5q to closest approach
  const a = DIAMETER / 2 * Math.cbrt(PACK / N);
  let R = orbit.at(t0), Rt = t0;
  const tide = (tt, x, y, z, out) => { if (tt !== Rt) { R = orbit.at(tt); Rt = tt; } return tidalAccel(R, x, y, z, out); };
  const sys = makeSystem({ N, a, rho: rhoSI, positions: settledBall(N), restitution, tide, t0, dtFactor });
  const link = 2.2 * a;
  let pieces = null, piecesAt = -Infinity, done = false;
  const history = [];   // [t (h), pieces, largest fraction, length (m)]
  const extent = () => {
    const c = sys.centroid(); let r2 = 0;
    for (let i = 0; i < N; i++) r2 = Math.max(r2, (sys.x[3 * i] - c[0]) ** 2 + (sys.x[3 * i + 1] - c[1]) ** 2 + (sys.x[3 * i + 2] - c[2]) ** 2);
    return 2 * Math.sqrt(r2);
  };
  const count = () => pieces.sizes.filter(s => s >= MIN_PIECE).length;
  let brokeAt = null;   // first time (h) the largest piece holds less than half of the comet
  const recount = () => {
    pieces = findPieces(sys.x, N, link); piecesAt = sys.t;
    if (brokeAt === null && pieces.sizes[0] < N / 2) brokeAt = sys.t / 3600;
    history.push([sys.t / 3600, count(), pieces.sizes[0] / N, extent()]);
  };
  recount();
  const dist = () => { const r = orbit.at(sys.t); return Math.hypot(r.x, r.y) / RJ; };
  return {
    q, rho, N, a, orbit, t0, tEnd, roche: rocheLimit(rho), sys, link, history, extent, dist,
    get t() { return sys.t / 3600; },   // hours from closest approach
    get done() { return done; },
    get brokeAt() { return brokeAt; },
    get pieces() { return pieces; },
    get pieceCount() { return count(); },
    get largest() { return pieces.sizes[0] / N; },
    reference: () => orbit.at(sys.t),
    step() {
      if (done) return;
      sys.step();
      if (sys.t - piecesAt >= 600) recount();   // pieces recounted every 10 simulated minutes
      if (sys.t >= tEnd - 1e-6) { recount(); done = true; }
    },
    diagnostics: () => [
      { key: 'pieces', label: 'Separate pieces (each ≥ 1 % of the comet)', value: count(), kind: 'value', text: String(count()) },
      { key: 'largest', label: 'Largest piece', value: pieces.sizes[0] / N, kind: 'value', text: `${(100 * pieces.sizes[0] / N).toFixed(0)} % of the comet` },
      { key: 'length', label: 'Length of the comet (or of the line of pieces)', value: extent() / 1000, kind: 'value', unit: 'km', text: `${(extent() / 1000).toFixed(1)} km` },
      { key: 'dist', label: 'Distance from Jupiter\'s centre', value: dist(), kind: 'value', text: `${dist().toFixed(2)} Jupiter radii` },
    ],
    state: () => ({ t: sys.t, pieces: count(), largest: pieces.sizes[0] / N, extent: extent(), x0: sys.x[0], y0: sys.x[1], z0: sys.x[2] }),
    record: () => ({ header: ['t (h from closest approach)', 'pieces', 'largest fraction', 'length (m)'], rows: history.map(r => r.slice()) }),
  };
}


// ---------- observables used by the checks and the page ----------
/** Time (h) when the reference orbit first comes within r (in R_J) of Jupiter's centre, or null. */
function timeAtDistance(q, rRJ) {
  if (rRJ <= q) return null;
  const orb = keplerOrbit(q * RJ), r = t => { const p = orb.at(t); return Math.hypot(p.x, p.y) / RJ; };
  let lo = -1e7, hi = 0;
  for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if (r(mid) > rRJ) lo = mid; else hi = mid; }
  return hi / 3600;
}

/**
 * Orbital period around Jupiter of each piece (≥ MIN_PIECE grains), from its centre-of-mass position and
 * velocity: E = E_ref + V·u + ½u² − GM(1/|R+x| − 1/|R|), a = −GM/2E, P = 2π√(a³/GM). Point-mass Jupiter only.
 */
function piecePeriods(sim) {
  const { sys, N } = sim, R = sim.reference(), groups = new Map();
  sim.pieces.label.forEach((g, i) => { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(i); });
  const Eref = -GMJ / (2 * A_ORBIT), out = [];
  for (const idx of groups.values()) {
    if (idx.length < MIN_PIECE) continue;
    const c = [0, 0, 0, 0, 0, 0];
    for (const i of idx) for (let d = 0; d < 3; d++) { c[d] += sys.x[3 * i + d] / idx.length; c[3 + d] += sys.u[3 * i + d] / idx.length; }
    const dE = R.vx * c[3] + R.vy * c[4] + 0.5 * (c[3] ** 2 + c[4] ** 2 + c[5] ** 2) + tidalPotentialMinusRef(R, c[0], c[1], c[2]);
    const a = -GMJ / (2 * (Eref + dE));
    out.push({ grains: idx.length, period: 2 * Math.PI * Math.sqrt(a ** 3 / GMJ) });
  }
  return out;
}

/** Energy that the exact dynamics conserves (reference on an exact Kepler orbit): Σ m(V·u + ½u² + Φ_rel) + pair energy. */
function conservedEnergy(sim) {
  const { sys, N } = sim, R = sim.reference();
  let E = sys.pairEnergy(), kin = 0;
  for (let i = 0; i < N; i++) {
    const x = sys.x[3 * i], y = sys.x[3 * i + 1], z = sys.x[3 * i + 2], ux = sys.u[3 * i], uy = sys.u[3 * i + 1], uz = sys.u[3 * i + 2];
    const k = 0.5 * (ux * ux + uy * uy + uz * uz);
    kin += sys.m * k;
    E += sys.m * (R.vx * ux + R.vy * uy + k + tidalPotentialMinusRef(R, x, y, z));
  }
  return { E, kin };
}

const DEFAULTS = { q: 1.33, rho: 0.6 };

function verify({ log } = {}) {
  const checks = [], notes = [], add = (label, value, pass, extra = {}) => checks.push({ label, value, pass, ...extra });
  const run = (opts, what) => { log?.(what); const s = createSim(opts); while (!s.done) s.step(); return s; };
  const days = s => s / 86400;

  // 1. Reference orbit: the closed form solves r̈ = −GM r/r³ (central-difference residual, refined).
  const orb = keplerOrbit(DEFAULTS.q * RJ);
  const fdAcc = (t, h) => { const p = orb.at(t), pm = orb.at(t - h), pp = orb.at(t + h); return [(pp.x - 2 * p.x + pm.x) / h ** 2, (pp.y - 2 * p.y + pm.y) / h ** 2]; };
  const resid = (h, richardson) => {
    let worst = 0;
    for (const t of [-15000, -3000, -500, 0, 700, 4000, 20000, 100000]) {
      const p = orb.at(t), r3 = Math.hypot(p.x, p.y) ** 3, gx = -GMJ * p.x / r3, gy = -GMJ * p.y / r3;
      let [ax, ay] = fdAcc(t, h);
      if (richardson) { const [bx, by] = fdAcc(t, h / 2); ax = (4 * bx - ax) / 3; ay = (4 * by - ay) / 3; }
      worst = Math.max(worst, Math.hypot(ax - gx, ay - gy) / Math.hypot(gx, gy));
    }
    return worst;
  };
  const r1 = resid(40), r2 = resid(20), pOrb = Math.log2(r1 / r2), rR = resid(40, true);
  add('Reference orbit (closed-form Kepler) satisfies r̈ = −GM_J r/r³: relative residual of the Richardson-extrapolated second difference (h = 40, 20 s; round-off limited at the far points)', rR, rR < 1e-6);
  add('Plain central-difference residual falls as h² (40 → 20 s; expected order 2, i.e. it is the difference error, not the orbit)', pOrb, Math.abs(pOrb - 2) < 0.3);
  const p0 = orb.at(0), vq = Math.hypot(p0.vx, p0.vy), vv = Math.sqrt(GMJ * (2 / (DEFAULTS.q * RJ) - 1 / A_ORBIT));
  add('Speed at closest approach vs vis-viva √(GM_J(2/q − 1/a))', `${(vq / 1000).toFixed(4)} vs ${(vv / 1000).toFixed(4)} km/s`, Math.abs(vq / vv - 1) < 1e-12);

  // 2. Tidal acceleration: small-offset limit (tidal tensor) and exact large-offset difference.
  const R = { x: DEFAULTS.q * RJ, y: 0 }, out = [0, 0, 0], g = GMJ / R.x ** 3;
  tidalAccel(R, 100, 50, 30, out);
  const lin = [2 * g * 100, -g * 50, -g * 30];
  const eLin = Math.hypot(out[0] - lin[0], out[1] - lin[1], out[2] - lin[2]) / Math.hypot(...lin);
  add('Tidal pull at 100 m from the centre vs the stretch-and-squeeze limit (2, −1, −1)·GM_J/r³ (expected ≈ offset/r ≈ 10⁻⁶)', eLin, eLin < 1e-5);
  tidalAccel(R, 2e7, 1e7, 5e6, out);
  const sv = [R.x + 2e7, 1e7, 5e6], sn = Math.hypot(...sv);
  const direct = [-GMJ * (sv[0] / sn ** 3 - 1 / R.x ** 2), -GMJ * sv[1] / sn ** 3, -GMJ * sv[2] / sn ** 3];
  const eDir = Math.hypot(out[0] - direct[0], out[1] - direct[1], out[2] - direct[2]) / Math.hypot(...direct);
  add('Tidal pull 23 000 km from the centre vs the direct difference of Jupiter\'s pull', eDir, eDir < 1e-12);

  // 3. Integrator: energy of elastic grains through closest approach, and its step-halving order.
  const energyRun = dtFactor => {
    const sim = createSim({ restitution: 1, dtFactor, N: 200, tEnd: 2 * 3600 });
    const E0 = conservedEnergy(sim).E;
    let worst = 0, scale = 0, n = 0;
    while (!sim.done) {
      sim.step();
      if (++n % (20 * dtFactor) === 0) { const { E, kin } = conservedEnergy(sim); worst = Math.max(worst, Math.abs(E - E0)); scale = Math.max(scale, kin); }
    }
    return { worst, scale };
  };
  log?.('energy test (elastic grains)');
  const en1 = energyRun(1), en2 = energyRun(2), enRel = en1.worst / en1.scale, enOrd = Math.log2(en1.worst / en2.worst);
  add('Energy kept with elastic grains through closest approach (200 grains): max |ΔE| / largest kinetic energy the tide gives them', enRel, enRel < 1e-2);
  add('That energy error falls under step halving (leapfrog, expected order 2)', enOrd, enOrd > 1.7);

  // 4. The real pass: break-up, and the robustness of what the page shows.
  const base = run({ ...DEFAULTS }, 'default pass (500 grains)');
  const baseLen = base.extent();
  add('July 1992 pass (1.33 R_J, 0.6 g/cm³): the comet is torn apart (largest piece < 50 %)', `largest ${(100 * base.largest).toFixed(0)} %, ${base.pieceCount} pieces ≥ 1 %`, base.largest < 0.5);
  const fine = run({ ...DEFAULTS, dtFactor: 2 }, 'half time step');
  const dLenDt = Math.abs(fine.extent() / baseLen - 1);
  add('Length of the line of pieces 30 h after closest approach: half time step changes it by', dLenDt, dLenDt < 0.1);
  const n250 = run({ ...DEFAULTS, N: 250 }, '250 grains'), n1000 = run({ ...DEFAULTS, N: 1000 }, '1000 grains');
  const lens = [n250, base, n1000].map(s => s.extent() / 1000), dLenN = Math.max(...lens) / Math.min(...lens) - 1;
  add('Same length with 250 / 500 / 1000 grains (km); largest spread', `${lens.map(l => l.toFixed(0)).join(' / ')} km, spread ${(100 * dLenN).toFixed(1)} %`, dLenN < 0.15);
  const counts = [n250, base, n1000, fine].map(s => s.pieceCount);
  add('Number of pieces (≥ 1 % of the mass) with 250 / 500 / 1000 grains / half step: depends on resolution (observed comet: 21 pieces)', counts.join(' / '), counts.every(c => c >= 3), { state: 'warn' });
  notes.push(`The length of the line of pieces is robust (${lens.map(l => l.toFixed(0)).join(', ')} km for 250, 500, 1000 grains). The exact number of lumps is not: clumping of a thin strand is sensitive to small differences, and a 500-grain comet cannot make 21 pieces of the sizes observed. The page shows one run with 500 grains.`);

  // 5. The break-up distance of this model, by bisection (it scales exactly as ρ^(−1/3): every force ∝ Gρ).
  const far = run({ ...DEFAULTS, q: 2 }, 'pass at 2 R_J');
  add('Pass at 2.0 R_J (preset "farther"): stays in one piece', `largest ${(100 * far.largest).toFixed(0)} %, length ${(far.extent() / 1000).toFixed(2)} km`, far.largest > 0.9);
  let lo = DEFAULTS.q, hi = 2;   // lo breaks, hi survives
  for (let k = 0; k < 3; k++) {
    const mid = (lo + hi) / 2, s = run({ ...DEFAULTS, q: mid }, `bisection q = ${mid.toFixed(3)}`);
    if (s.largest < 0.5) lo = mid; else hi = mid;
  }
  const qCrit = (lo + hi) / 2, roche = rocheLimit(DEFAULTS.rho);
  add('Closest distance below which this comet (0.6 g/cm³) is torn apart, by bisection (R_J)', `${lo.toFixed(2)}–${hi.toFixed(2)}`, lo < hi && hi < roche);
  notes.push(`Classical fluid Roche limit for a 0.6 g/cm³ body on a circular orbit: ${roche.toFixed(2)} R_J. A comet that only flies past (non-rotating, frictionless rubble, as here) must come closer, to ${lo.toFixed(2)}–${hi.toFixed(2)} R_J, because it spends only a few hours near Jupiter. SL9's 1.33 R_J was inside both.`);

  // 6. A fluffier comet (preset): breaks earlier and into more pieces.
  const fluffy = run({ ...DEFAULTS, rho: 0.3 }, 'density 0.3');
  add('Fluffier comet (0.3 g/cm³): torn apart, largest piece smaller than at 0.6 g/cm³', `largest ${(100 * fluffy.largest).toFixed(0)} % vs ${(100 * base.largest).toFixed(0)} %`, fluffy.largest < base.largest);

  // 7. Determinism: two identical runs give identical states.
