<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);

  --ink: #e6e9ef;

  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;

.psim-title { min-width: 0; flex: 0 1 auto; }

.psim-tier {

  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;

.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

.psim-iconbtn {

}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;

.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.psim-hud {

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);

  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;

}

.psim-transport svg { width: 15px; height: 15px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}

  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }

.psim-field { display: grid; gap: 6px; }

.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);

}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;

@media (max-width: 860px) {

  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }

  .psim-title p { display: none; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }

.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;

.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }

.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */

  const g = { ...GATING_DEFAULT };
  const gateBox = el('div', { class: 'psim-hint' });
  const sR = slider({ label: 'Equilibrium transfer distance r₀', min: 0.3, max: 0.9, value: g.r0, unit: 'Å', onInput: v => { g.r0 = v; refresh(true); } });
  const sO = slider({ label: 'Gating frequency Ω', min: 50, max: 600, value: g.Omega, log: true, unit: 'cm⁻¹', onInput: v => { g.Omega = v; refresh(true); } });
  const gateSl = el('div', {},
    el('h3', {}, 'Gated (Marcus-like) tunnelling: bench controls, illustrative'),
    sR, sO,
    el('div', { class: 'psim-btns' },
      button('Stiff, well-tuned site', () => { g.r0 = 0.58; g.Omega = 400; syncSliders(); refresh(true); }),
      button('Floppy site (mutant-like)', () => { g.r0 = 0.75; g.Omega = 80; syncSliders(); refresh(true); })),
    gateBox);
  const syncSliders = () => { sR.setValue(g.r0); sO.setValue(g.Omega); };
  figs.append(gateSl);

  const cur = { sim: null };
  const lnK = (sim, T) => ratesAt(sim.params, T, sim.barriers);
  const Ee = createEquation({
    title: 'Bell rate: transition-state theory × tunnelling factor (H, at the set temperature)',
    lhs: { mathml: M.sub(M.i('k'), M.i('H')), label: 'rate per reacting configuration', unit: 's⁻¹', value: () => cur.sim.rates[0].k },
    terms: [
      { id: 'pre', mathml: M.frac(`${M.sub(M.i('k'), M.i('B'))}${M.i('T')}`, M.i('h')), label: 'attempt frequency', unit: 's⁻¹', color: '--muted', value: () => KB * cur.sim.params.T / HPL },
      { id: 'boltz', sign: '×', mathml: M.sup(M.i('e'), `<mo>−</mo>${M.frac(M.sub(M.i('V'), M.i('eff')), `${M.sub(M.i('k'), M.i('B'))}${M.i('T')}`)}`), label: 'classical Boltzmann factor', color: '--body-1', value: () => Math.exp(-cur.sim.barriers[0].V / cur.sim.kT) },
      { id: 'kap', sign: '×', mathml: `${M.i('κ')}<mo>=</mo>${M.frac(M.n(1), `${M.sub(M.i('k'), M.i('B'))}${M.i('T')}`)}<mo>∫</mo>${M.i('T')}<mo>(</mo>${M.i('E')}<mo>)</mo>${M.sup(M.i('e'), `<mo>−</mo><mo>(</mo>${M.i('E')}<mo>−</mo>${M.i('V')}<mo>)</mo><mo>/</mo>${M.i('k')}${M.i('T')}`)}<mi>d</mi>${M.i('E')}`, label: 'tunnelling factor (exact T(E), chosen barrier)', color: '--body-2', digits: 4, value: () => cur.sim.rates[0].kappa },
    ],
    where: [
      { mathml: M.sub(M.i('V'), M.i('eff')), meaning: 'V‡ minus the C–H stretch zero-point energy ½hν', value: () => cur.sim.barriers[0].V, unit: 'kcal/mol' },
      { mathml: `${M.i('ħ')}${M.sub(M.i('ω'), M.i('‡'))}`, meaning: 'barrier frequency √(2V/ma²) for H (imaginary mode)', value: () => cur.sim.barriers[0].hw / CM, unit: 'cm⁻¹' },
    ],
    link: pA,
  });
  const Ek = createEquation({
    title: 'Kinetic isotope effect = zero-point-energy part × tunnelling part',
    lhs: { mathml: M.frac(M.sub(M.i('k'), M.i('H')), M.sub(M.i('k'), M.i('D'))), label: 'KIE (Bell, exact κ)', value: () => cur.sim.kie.HD },
    terms: [
      { id: 'zpe', mathml: M.sup(M.i('e'), M.frac(`<mo>Δ</mo>${M.i('ZPE')}`, `${M.i('k')}${M.i('T')}`)), label: 'semiclassical (TST with ZPE)', color: '--muted', value: () => cur.sim.kie.HDclassical },
      { id: 'kr', sign: '×', mathml: M.frac(M.sub(M.i('κ'), M.i('H')), M.sub(M.i('κ'), M.i('D'))), label: 'tunnelling ratio', color: '--body-2', value: () => cur.sim.rates[0].kappa / cur.sim.rates[1].kappa },
    ],
    link: pK,
  });
  const Ew = createEquation({
    title: 'Wigner’s small-tunnelling correction (fails in deep tunnelling)',
    lhs: { mathml: M.sub(M.i('κ'), M.i('W')), label: 'Wigner κ for H', value: () => cur.sim.rates[0].kappaW },
    terms: [{ id: 'w', mathml: `${M.n(1)}<mo>+</mo>${M.frac(M.n(1), M.n(24))}${M.sup(M.paren(M.frac(`${M.i('ħ')}${M.sub(M.i('ω'), M.i('‡'))}`, `${M.i('k')}${M.i('T')}`)), M.n(2))}`, label: 'vs exact κ_H shown above', color: '--body-1', value: () => cur.sim.rates[0].kappa }],
    link: pK,
  });
  const Eg = createEquation({
    title: 'Marcus-like gated tunnelling (Kuznetsov–Ulstrup form used by Klinman and co-workers)',
    lhs: { mathml: M.sub(M.i('k'), M.i('i')), label: 'rate for isotope i (relative)' },
    op: '∝',
    terms: [
      { id: 'marcus', mathml: M.sup(M.i('e'), `<mo>−</mo>${M.frac(M.sup(M.paren(`<mo>Δ</mo>${M.sup(M.i('G'), '<mo>∘</mo>')}<mo>+</mo>${M.i('λ')}`), M.n(2)), `${M.n(4)}${M.i('λ')}${M.i('k')}${M.i('T')}`)}`), label: 'heavy-atom reorganisation (isotope-free)', color: '--muted' },
      { id: 'fc', sign: '×', mathml: `<mo>⟨</mo>${M.sup(M.i('e'), `<mo>−</mo>${M.sub(M.i('α'), M.i('i'))}${M.sup(M.i('r'), M.n(2))}`)}${M.sub('<mo>⟩</mo>', M.i('r'))}`, label: 'H overlap averaged over distance sampling; α_i = m_iω_i/2ħ', color: GATE, value: () => { const s2 = gatingSigma2(g.Omega, g.Mg, cur.sim.params.T), a = gatingAlpha(g.nu, ISOTOPES[0].m); return Math.exp(-a * g.r0 ** 2 / (1 + 2 * a * s2)) / Math.sqrt(1 + 2 * a * s2); } },
    ],
    where: [
      { mathml: M.sub(M.i('α'), M.i('H')), meaning: 'from the 2900 cm⁻¹ H vibration', value: () => gatingAlpha(g.nu, ISOTOPES[0].m), unit: 'Å⁻²' },
      { mathml: M.sup(M.i('σ'), M.n(2)), meaning: '(ħ/2MΩ) coth(ħΩ/2kT), gating mass M = 30 u', value: () => gatingSigma2(g.Omega, g.Mg, cur.sim.params.T), unit: 'Å²' },
    ],
    link: pG,
  });
  eqs.append(Ee.el, Ek.el, Ew.el, Eg.el);

  function refresh(gateOnly = false) {
    const sim = cur.sim; if (!sim) return;
    const p = sim.params, kT = sim.kT, Ts = [];
    for (let T = 250; T <= 350; T += 5) Ts.push(T);
    if (!gateOnly) {
      const Emax = Math.max(16, p.Vb + 2);
      pT.setX({ min: 0, max: Emax }); pF.setX({ min: 0, max: Emax });
      sim.barriers.forEach((b, k) => {
        pT.fn(`T${b.key}`, E => Math.max(b.T(E), 1e-300), { color: ISO_COLOR[k], label: `${b.key} exact`, width: 2 });
        let peak = 0; for (let E = 0.01; E < Emax; E += 0.01) peak = Math.max(peak, b.T(E) * Math.exp(-(E - b.V) / kT));
        pF.fn(`F${b.key}`, E => b.T(E) * Math.exp(-(E - b.V) / kT) / peak, { color: ISO_COLOR[k], label: b.key, width: 2 });
        pF.vline(`V${b.key}`, b.V, { color: ISO_COLOR[k], label: `V_eff,${b.key}` });
        pT.data(`pk${b.key}`, [[p.E, Math.max(sim.runs[k].exact, 1e-300)]], { color: ISO_COLOR[k], dots: true, r: 4 });
      });
      const H = sim.barriers[0];
      if (p.shape !== 'rect') pT.fn('par', E => transParabolic(E, H.V, H.hw), { color: '--body-1', dash: true, label: 'H parabolic (Bell)' }); else pT.remove('par');
      pT.data('cl', [[0, 1e-14], [H.V, 1e-14], [H.V, 1], [Emax, 1]], { color: '--muted', label: 'H classical', dash: true });
      pT.vline('E', p.E, { color: '--muted', label: `packet E = ${p.E}` });
      const rs = Ts.map(T => lnK(sim, T));
      for (const k of [0, 1]) {
        pA.data(`q${k}`, Ts.map((T, i) => [1000 / T, rs[i][k].k]), { color: ISO_COLOR[k], label: `${ISOTOPES[k].key} quantum (Bell)` });
        pA.data(`c${k}`, Ts.map((T, i) => [1000 / T, rs[i][k].kTST]), { color: ISO_COLOR[k], dash: true, label: `${ISOTOPES[k].key} classical TST` });
      }
      pA.band('phys', 1000 / 318.15, 1000 / 278.15, { label: '5–45 °C' });
      pA.vline('T', 1000 / p.T, { color: '--muted', label: `${p.T} K` });
      pK.data('kq', Ts.map((T, i) => [T, rs[i][0].k / rs[i][1].k]), { color: '--body-2', label: 'Bell, exact κ' });
      if (p.shape !== 'rect') {
        pK.data('kw', Ts.map((T, i) => [T, rs[i][0].kW / rs[i][1].kW]), { color: '--body-1', dash: true, label: 'Wigner' });
        pK.data('kb', Ts.map((T, i) => [T, rs[i][0].kB / rs[i][1].kB]), { color: '--body-0', dash: true, label: 'Bell parabolic' });
      } else { pK.remove('kw'); pK.remove('kb'); }
      pK.data('kc', Ts.map((T, i) => [T, rs[i][0].kTST / rs[i][1].kTST]), { color: '--muted', label: 'ZPE only (no tunnelling)' });
      pK.data('slo', [[298.15, 81]], { color: '--ink', dots: true, r: 4, errors: [5], label: 'SLO-1 measured' });
      pK.vline('T', p.T, { color: '--muted' });
    }
    const gr = Ts.map(T => gatedRates(g, T));
    pK.data('kg', Ts.map((T, i) => [T, gr[i][0].k / gr[i][1].k]), { color: GATE, label: 'gated tunnelling (Marcus-like)', width: 2.2 });
    const aH = gatingAlpha(g.nu, ISOTOPES[0].m), aD = gatingAlpha(g.nu, ISOTOPES[1].m), s2 = gatingSigma2(g.Omega, g.Mg, p.T);
    pG.fn('fH', r => Math.exp(-aH * r * r), { color: '--body-1', label: 'overlap H' });
    pG.fn('fD', r => Math.exp(-aD * r * r), { color: '--body-0', label: 'overlap D' });
    pG.fn('P', r => Math.exp(-((r - g.r0) ** 2) / (2 * s2)), { color: GATE, label: `P(r), σ = ${Math.sqrt(s2).toFixed(3)} Å` });
    const bH = arrheniusFit(T => ratesAt(p, T, sim.barriers)[0].k), bD = arrheniusFit(T => ratesAt(p, T, sim.barriers)[1].k);
    const gH = arrheniusFit(T => gatedRates(g, T)[0].k), gD = arrheniusFit(T => gatedRates(g, T)[1].k);
    const g298 = gatedRates(g, 298.15);
    gateBox.innerHTML = `Arrhenius fits over 5–45 °C (computed):<br>`
      + `Bell model: KIE(298 K) = ${(lnK(sim, 298.15)[0].k / lnK(sim, 298.15)[1].k).toFixed(1)}, ΔE<sub>a</sub> = ${(bD.Ea - bH.Ea).toFixed(2)} kcal/mol, A<sub>H</sub>/A<sub>D</sub> = ${Math.exp(bH.lnA - bD.lnA).toFixed(2)}<br>`
      + `Gated model: KIE(298 K) = ${(g298[0].k / g298[1].k).toFixed(1)}, ΔE<sub>a</sub> = ${(gD.Ea - gH.Ea).toFixed(2)} kcal/mol, A<sub>H</sub>/A<sub>D</sub> = ${Math.exp(gH.lnA - gD.lnA).toFixed(1)}<br>`
      + `Measured, SLO-1 wild type: KIE 81 ± 5 at 25 °C, ΔE<sub>a</sub> ≈ 0.9 kcal/mol (nearly temperature-independent KIE).`;
    for (const q of [pT, pF, pA, pK, pG]) { q.invalidate?.(); q.draw(); }
    Eg.update();
  }
  return {
    update(sim, t, { rebuilt } = {}) {
      if (rebuilt || cur.sim !== sim) { cur.sim = sim; refresh(); }
      Ee.update(); Ek.update(); Ew.update(); Eg.update();
    },
  };
}

createInstrument({
  title: 'Hydrogen tunnelling in enzymes',
  subtitle: 'H, D and T wave packets meeting the same transfer barrier (time-dependent Schrödinger equation), and the kinetic isotope effect from Bell and gated-tunnelling models',
  tier: 'approximate',
  tierReason: 'A one-coordinate (Bell/Eckart) model with illustrative parameters, solved exactly and verified numerically (exact T(E) vs ODE and transfer matrix, wave packets vs exact packet transmission to 3×10⁻⁵, unitarity 3×10⁻¹³). Real enzymes are multidimensional; the gated (Marcus-like) model is a further reduced, illustrative calculation. Measured SLO-1 values are shown for comparison, not fitted.',
  layout: 'workbench', gl: true, drawGL, draw, bench,
  params: PARAMS, create: createSim,
  // Run span = the model's own end (sim.tEnd): the slowest packet (T) has split into transmitted and reflected
  // parts well clear of the barrier, so P(x>0) is final. Markers: each packet centre reaches the barrier top
  // (x = 0) at |x₀|/v, with v = ħk₀/m the group velocity at the chosen energy.
  timeline: {
    duration: sim => sim.tEnd,
    markers: sim => sim.runs.map((r, k) => {
      const iso = ISOTOPES[k].key, t = Math.abs(GRID.x0) / r.v;
      return { t, label: `${iso} packet centre reaches the barrier top (|x₀|/v, v = ħk₀/m)`, short: `${iso}${t.toFixed(0)}`, kind: 'computed' };
    }),
    note: sim => `The run ends at ${sim.tEnd.toFixed(0)} fs, when the slowest packet (T) has separated into transmitted and reflected parts clear of the barrier (centre at ${(Math.abs(GRID.x0) + 3 * sim.params.a + 7 * GRID.sigma).toFixed(1)} Å travelled), so the transmitted fractions are final. Arrival times scale as √m.`,
  },
  timeUnit: 'fs', timeLabel: 'time since packet launch', speed: 24, speedRange: [2, 120], timeDigits: 1,
  hudLine: sim => { const P = sim.pTrans(); return `transmitted P(x>0): H ${sci(P[0], 2)} · D ${sci(P[1], 2)} · T ${sci(P[2], 2)} · KIE(Bell, ${sim.params.T} K) ${sim.kie.HD.toFixed(1)}`; },
  presets: [
    { label: 'Default: deep tunnelling', values: { Vb: 14, a: 0.3, E: 7, shape: 'eckart', T: 298.15 }, play: true },
    { label: 'Narrow barrier', values: { a: 0.22, E: 6 }, play: true },
    { label: 'Wide barrier (nearly classical)', values: { a: 0.55, E: 9 }, play: true },
    { label: 'Above the barrier', values: { E: 13 }, play: true },
    { label: 'Rectangular barrier', values: { shape: 'rect' }, play: true },
  ],
  onPointer(canvas) { cam.attach(canvas); },
  onFit(view) { fitScene(view.W / view.H); },
  viewControls(body, { select, toggle, el: mk }) {
    body.append(mk('label', {}, 'Height of the wave packets ', select([{ value: 'log10', label: 'log₁₀ |ψ|² (shows tunnelled part)' }, { value: 'linear', label: '|ψ|² linear' }], 'log10', v => { heightMode = v; })));
    body.append(toggle('Show earlier times (space–time surface)', true, v => { showHistory = v; }));
  },
  model: {
    legend: [
      'Each lane: one isotope, x across, time front → back, line height ∝ log₁₀|ψ(x,t)|² above its energy E',
      'Grey surface: barrier V_eff(x) on the same energy axis; coloured line: barrier profile',
    ],
    equations: [],
    assumptions: [
      'One reaction coordinate: the transferring hydrogen nucleus (mass of ¹H, ²H, ³H; AME2020). H⁺, H• and H⁻ transfers move the same nucleus; in this model they differ only through the barrier.',
      'Barrier: symmetric Eckart V‡ sech²(x/a) (or a rectangular barrier of equal area), the same potential-energy surface for all isotopes (Born–Oppenheimer). Values are illustrative, typical of enzymatic C–H activation; not fitted to an enzyme.',
      'Each isotope’s barrier is measured from its reactant zero-point level: V_eff = V‡ − ½hν, with ν the C–H (C–D, C–T) stretch lost at the transition state (C–X reduced mass). Other modes, corner-cutting and heavy-atom motion are omitted.',
      'Thermal rate (Bell): k = (1/h)∫T(E)e^(−E/kT)dE = (kT/h)·κ·e^(−V_eff/kT), a one-dimensional transition-state rate per reacting configuration, not an enzyme turnover number.',
      'Gated model: Franck–Condon overlap of donor and acceptor H ground states (harmonic, 2900 cm⁻¹), averaged over a harmonic gating mode (M = 30 u) at thermal equilibrium; only the ground vibrational channel; λ = 19, ΔG° = −5 kcal/mol (illustrative; isotope-independent).',
      'Wave packets: Gaussian, σ = 1.2 Å, launched at x = −9 Å with mean energy E, evolved by the split-operator FFT method on a 4096-point periodic grid (dx = 0.03 Å, dt = 0.05 fs); the run ends when transmitted and reflected parts have left the barrier.',
    ],
    conventions: [
      'Vertical axis of the 3D view: energy (kcal/mol, 25 kcal/mol = full height) for the barrier and the dashed energy line; the wave packet is drawn on its energy line with height ∝ log₁₀|ψ|² (default, 10 decades) or |ψ|² (linear). This is the textbook “packet on the potential” convention, not a second energy.',
      'Isotope colours are categorical labels (H blue, D orange, T pink).',
      'Playback compresses femtoseconds into seconds; earlier time slices stay drawn behind the current one to form the space–time surface |ψ(x,t)|².',
      'Energies in kcal/mol per molecule × N_A (1 kcal/mol = 0.04336 eV).',
    ],
    references: [
      'C. Eckart, Phys. Rev. 35, 1303 (1930); L. D. Landau & E. M. Lifshitz, Quantum Mechanics §25 (Eckart transmission).',
      'R. P. Bell, The Tunnel Effect in Chemistry (Chapman & Hall, 1980); Trans. Faraday Soc. 55, 1 (1959).',
      'E. Wigner, Z. Phys. Chem. B 19, 203 (1932).',
      'J. P. Klinman & A. Kohen, Annu. Rev. Biochem. 82, 471 (2013): hydrogen tunnelling and protein dynamics.',
      'M. J. Knapp, K. Rickert & J. P. Klinman, J. Am. Chem. Soc. 124, 3865 (2002): temperature-dependent KIEs in soybean lipoxygenase-1.',
      'M. P. Meyer & J. P. Klinman (2005): SLO-1 D-KIE on k_cat 81 ± 5 at 25 °C; Klinman group (2014): ΔEa ≈ 0.9 kcal/mol for wild type.',
      'A. M. Kuznetsov & J. Ulstrup, Can. J. Chem. 77, 1085 (1999): vibrationally assisted (gated) proton tunnelling.',
      'Debate on dynamics “promoting” catalysis: e.g. S. C. L. Kamerlin & A. Warshel, Proteins 78, 1339 (2010); D. R. Glowacki, J. N. Harvey & A. J. Mulholland, Nat. Chem. 4, 169 (2012).',
      'M. Wang et al. (AME2020), Chin. Phys. C 45, 030003 (2021): nuclide masses.',
    ],
  },
});

window.psim.fit = () => { lastAspect = 0; };
window.psim.selfTest = () => {
  const sim = window.psim.getSim();
  window.psim.advanceTo(sim.tEnd + 1);
  const s = window.psim.getSim(), P = s.pTrans(), dev = Math.abs(P[0] / s.runs[0].exact - 1);
  return [
    { label: 'Browser run ends (done) after the packets separate', t: s.t, tEnd: s.tEnd, pass: s.done === true },
    // the rectangular barrier's sharp walls carry a verified first-order grid error (1.75 % → 0.41 % at dx/2): judge that mode by it
    { label: 'Browser wave packet (H) matches the exact packet transmission', P: P[0], exact: s.runs[0].exact, dev, tolerance: window.psim.params().shape === 'rect' ? 0.025 : 1e-3, pass: dev < (window.psim.params().shape === 'rect' ? 0.025 : 1e-3) },
    { label: 'Space–time surface holds every recorded slice', slices: s.slices[0].length, pass: s.slices.every(sl => sl.length >= s.nSlices) },
  ];
};

</script>
