// Reusable instrument UI: DOM helpers, controls, log-scale plots, the simulation
// clock, number formatting, theme handling and data export.
// Domain-agnostic: orbit, field and density views all build on these pieces.

function el(tag, attrs = {}, ...children) {
  const node = document.createElementNS(
    tag === 'svg' || attrs.xmlns === 'svg' ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
  for (const [k, v] of Object.entries(attrs)) {

    if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;

    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c.nodeType ? c : document.createTextNode(String(c)));

}

  play: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>',
  step: '<svg viewBox="0 0 16 16"><path d="M3 2.5v11l7-5.5zM11 2.5h2v11h-2z" fill="currentColor"/></svg>',
  restart: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5v3h3"/></svg>',

// ---------- formatting ----------

const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };

/** 2.44e-11 -> "2.4×10⁻¹¹". */
function sci(x, digits = 2) {
  if (x == null || Number.isNaN(x)) return '—';
  if (x === 0) return '0';
  if (!Number.isFinite(x)) return x > 0 ? '∞' : '−∞';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -2 && e < 4) return fix(x, Math.max(0, digits - 1 - e));
  const m = x / Math.pow(10, e);
  return `${m.toFixed(digits - 1)}×10${String(e).split('').map(c => SUP[c]).join('')}`;
}

function fix(x, d = 3) {
  if (x == null || Number.isNaN(x)) return '—';
  return x.toFixed(d).replace('-', '−');
}

/** Classify a relative error against thresholds -> 'good' | 'warn' | 'bad'. */
function grade(x, good, warn) {
  if (!(x <= warn)) return 'bad';
  return x <= good ? 'good' : 'warn';
}

// ---------- theme ----------

function initTheme(toggleButton) {
  const root = document.documentElement;
  let stored = null;
  try { stored = localStorage.getItem('psim-theme'); } catch { /* storage unavailable */ }
  const query = new URLSearchParams(location.search).get('theme');
  const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  const apply = t => {
    root.dataset.theme = t;
    if (toggleButton) toggleButton.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    if (toggleButton) toggleButton.title = t === 'dark' ? 'Light theme' : 'Dark theme';
    root.dispatchEvent(new CustomEvent('psim-theme', { detail: t }));
  };
  apply(query || stored || root.dataset.theme || sys);
  toggleButton?.addEventListener('click', () => {
    const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('psim-theme', t); } catch { /* ignore */ }
    apply(t);
  });

/** A theme token ('--accent') → its value; any other colour ('#ff8800', 'rgb(…)', 'tomato') passes through. */
function cssVar(name) {
  if (typeof name !== 'string' || !name.startsWith('--')) return name;
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- layout pieces ----------

function section(title, { open = true, aside } = {}) {
  const body = el('div', { class: 'psim-body' });
  const asideEl = aside != null ? el('span', { class: 'aside' }, aside) : null;
  const sec = el('details', { class: 'psim-sec', open }, el('summary', {}, title, asideEl), body);
  sec.body = body;
  sec.aside = asideEl;
  return sec;
}

  r.set = (text, c) => { v.textContent = text; v.className = `v ${c ?? ''}`; };
  return r;
}

/** Value for a numeric input: short, exact enough, scientific notation for small or huge numbers. */
const inputValue = v => {

/**
 * Slider + exact numeric entry, linear or logarithmic. onInput receives the number.
 * Typed values are clamped to `limits` (default: the slider's [min, max]) and rounded when
 * `integer` is set, so a typo like 100000000 can never freeze the page. Pass wider `limits`
 * when a quantity may legitimately exceed the slider's range.
 */

    const c = Math.min(hi, Math.max(lo, v));

    el('div', { class: 'top' }, el('span', {}, label), el('div', { style: 'display:flex;align-items:baseline;gap:4px' }, num, unitEl)),
    range, note);
  range.addEventListener('input', () => {
    const v = tidy(+(+fromS(+range.value)).toPrecision(digits + 1));
    num.value = inputValue(v);
    note.textContent = '';

    const raw = +num.value;
    if (!Number.isFinite(raw)) { num.value = inputValue(tidy(fromS(+range.value))); return; }
    const v = tidy(raw);
    note.textContent = v !== raw ? `limited to ${inputValue(v)} (allowed ${inputValue(lo)}–${inputValue(hi)})` : '';
    num.value = inputValue(v);
    range.value = toS(v);
    onInput?.(v);

/**
 * Simulation clock. Converts wall-clock frames into a target *physical* time.
 * The integrator then advances to that target with its own step sequence, so
 * the physics never depends on frame rate. Long frames (background tabs) are capped.
 */
function createClock({ speed = 1 } = {}) {
  return {
    speed, playing: false, last: null,
    tick(now, t) {
      if (this.last == null || !this.playing) { this.last = now; return t; }
      const dt = Math.min(0.1, (now - this.last) / 1000);
      this.last = now;
      return t + dt * this.speed;
    },
  };
}

// ---------- plots ----------

/**
 * Lightweight log-y line plot for diagnostics (energy error, separations).
 * series: [{ color: cssVarName, data: [[x, y], ...] }]

function logPlot({ caption, yMin = 1e-16, yMax = 1, height = 112 }) {
  const canvas = el('canvas');
  const box = el('div', { class: 'psim-plot', style: `height:${height}px` }, canvas, el('span', { class: 'cap' }, caption));

    el: box,
    addSeries(color, opts = {}) { const s = { color, data: [], ...opts }; series.push(s); return s; },
    push(s, x, y) { s.data.push([x, y]); if (s.data.length > 4000) decimate(s); xMax = Math.max(xMax, x); dirty = true; },
    clear() { for (const s of series) s.data.length = 0; xMax = 1; dirty = true; },
    setXMax(x) { xMax = x; dirty = true; },
    setRefLines(lines) { refLines = lines; dirty = true; },
    invalidate() { dirty = true; },

function decimate(s) {
  // Keep the envelope: max of each pair (errors are what matter, so keep the worse one).
  const out = [];
  for (let i = 0; i < s.data.length; i += 2) {
    const a = s.data[i], b = s.data[i + 1];
    out.push(!b || a[1] >= b[1] ? a : b);
  }
  s.data = out;
}

// ---------- export ----------

function download(filename, text, mime = 'text/plain') {

/**

 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */
function alignZ(dir) {

/**
 * Point lists for createLineRenderer.update(): each returns one polyline [x,y,z, …] or an array of them.
 *   circle(center, normal, r, n)        closed circle (great circles, cone rims, orbits)
 *   boxEdges([min, max])                the 12 edges of a box, as separate segments
 *   grid(dims, { spacing, origin })     all lattice lines of a 1–3D grid with dims points per axis

/**

        re[b] = re[a] - xr; im[b] = im[a] - xi;
        re[a] += xr; im[a] += xi;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

/** Angular wavenumbers k for an FFT grid of n points with spacing dx (FFT ordering). */
function fftFreq(n, dx) {
  const k = new Float64Array(n);
  for (let i = 0; i < n; i++) k[i] = 2 * Math.PI * (i < n / 2 ? i : i - n) / (n * dx);
  return k;
}

// ---------------------------------------------------------------- ODEs

/** Classical RK4 step for y' = f(t, y). y: array; returns new array. */
function rk4Step(f, t, y, h) {
  const k1 = f(t, y);
  const k2 = f(t + h / 2, y.map((v, i) => v + h / 2 * k1[i]));
  const k3 = f(t + h / 2, y.map((v, i) => v + h / 2 * k2[i]));
  const k4 = f(t + h, y.map((v, i) => v + h * k3[i]));
  return y.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}

// Dormand–Prince 5(4) coefficients (Dormand & Prince 1980; Hairer, Nørsett & Wanner, Table 5.2).
const DP = {
  c: [0, 1 / 5, 3 / 10, 4 / 5, 8 / 9, 1, 1],
  a: [[], [1 / 5], [3 / 40, 9 / 40], [44 / 45, -56 / 15, 32 / 9],
    [19372 / 6561, -25360 / 2187, 64448 / 6561, -212 / 729],
    [9017 / 3168, -355 / 33, 46732 / 5247, 49 / 176, -5103 / 18656],
    [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84]],
  b: [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84, 0],
  e: [71 / 57600, 0, -71 / 16695, 71 / 1920, -17253 / 339200, 22 / 525, -1 / 40],
};

/** The Dormand–Prince 5(4) tableau (for steppers built on top of dopri5). */
const DORMAND_PRINCE = DP;

/**
 * Adaptive Dormand–Prince 5(4) integration of y' = f(t, y) from t0 to t1.
 * Error control per component: |err_i| <= atol + rtol·max(|y_i|, |y_new_i|).
 * onStep(t, y) is called after every accepted step (return false to stop early).
 * Returns { t, y, steps, rejected, stopped }. Throws if tolerance cannot be met or
 * the step budget is exhausted; stopped is reserved for an intentional onStep stop.
 */
function dopri5(f, t0, y0, t1, { rtol = 1e-9, atol = 1e-12, h0, hmax = Infinity, maxSteps = 1e6, onStep } = {}) {
  if (!Number.isFinite(t0) || !Number.isFinite(t1) || !y0.length || !Array.from(y0).every(Number.isFinite)) throw new Error('dopri5: finite times and a non-empty finite state are required');
  if (!(Number.isFinite(rtol) && rtol > 0 && Number.isFinite(atol) && atol > 0)) throw new Error('dopri5: tolerances must be finite and positive');
  if (!(hmax > 0) || (hmax !== Infinity && !Number.isFinite(hmax)) || (h0 != null && !(Number.isFinite(h0) && h0 !== 0))) throw new Error('dopri5: step sizes must be non-zero and finite (hmax may be Infinity)');
  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);

    if (k > 0) term *= (mu - (2 * k - 1) ** 2) / (k * 8 * x);
    if (Math.abs(term) > last) break;
    const sign = Math.floor(k / 2) % 2 ? -1 : 1;
    if (k % 2 === 0) P += sign * term; else Q += sign * term;
    if (Math.abs(term) <= 1e-17 * Math.abs(P)) break;
    last = Math.abs(term);
  }
  return { P, Q };
}

/** [Y₀(x), Y₁(x)] for x > 0. */
function besselY01(x) {
  if (x < 1e-8) {
    const L = Math.log(x / 2) + EULER;
    return [2 / Math.PI * L, -2 / (Math.PI * x)];
  }
  if (x >= 25) {
    const c = Math.cos(x), s = Math.sin(x), amp = Math.sqrt(2 / (Math.PI * x));
    const out = [];
    for (const nu of [0, 1]) {
      const phi = (nu / 2 + 0.25) * Math.PI, cp = Math.cos(phi), sp = Math.sin(phi);
      const cosChi = c * cp + s * sp, sinChi = s * cp - c * sp;          // χ = x − φ

/**
 * Bessel function of the second kind Y_n(x), integer n (Y_{−n} = (−1)ⁿY_n), x > 0 (x = 0: −Infinity).
 * Y₀, Y₁ from Neumann series over Miller-normalised J_k (x < 25) or Hankel's asymptotic expansion
 * (x ≥ 25, error ~e^{−2x}), then upward recurrence (stable). Accuracy ~1e-15 absolute relative to the

/** [K₀(x), K₁(x)] for x > 0. */

      if (t <= 1e-17 * I0) break;

/**
 * Modified Bessel function of the second kind K_n(x), integer n (K_{−n} = K_n), x > 0 (x = 0: Infinity).
 * K₀, K₁ by their logarithmic series (x ≤ 2) or Steed's continued fraction (x > 2), then upward

 * even when K₀ and K₁ themselves underflow. Accuracy ~n·eps relative away from under/overflow.

  if (logScale === 0) return v;
  const half = Math.exp(logScale / 2);
  if (half > 0 && Number.isFinite(half)) return (v * half) * half;
  return Math.exp(Math.log(v) + logScale);
}

// ================================================================= Hermite

/**
 * Physicists' Hermite polynomial H_n(x) (H₀ = 1, H₁ = 2x, H_{k+1} = 2xH_k − 2kH_{k−1}).
 * Exact for integer x and small n; relative accuracy ~n·eps otherwise. Large n·|x| overflows
 * (H_n ~ (2x)ⁿ): use oscillatorWavefunction for normalised quantities.
 */
function hermiteH(n, x) {
  intArg('hermiteH', 'n', n); finite('hermiteH', { x });
  if (n === 0) return 1;
  let a = 1, b = 2 * x;
  for (let k = 1; k < n; k++) [a, b] = [b, 2 * x * b - 2 * k * a];
  return b;
}

/**
 * Normalised harmonic-oscillator eigenfunction ψ_n(ξ) = (2ⁿ n! √π)^{−½} H_n(ξ) e^{−ξ²/2}
 * (∫ψ_m ψ_n dξ = δ_mn) in the dimensionless coordinate ξ = x √(mω/ħ); in physical units
 * ψ(x) = (mω/ħ)^{1/4} ψ_n(ξ). Normalised three-term recurrence with a running exponent, so it
 * neither overflows nor underflows prematurely for any n (tested to n = 2000) and |ξ| up to ~35 + √(2n).
 * Accuracy ~√n·eps relative to max|ψ_n| (absolute near nodes).
 */
function oscillatorWavefunction(n, xi) {
  intArg('oscillatorWavefunction', 'n', n); finite('oscillatorWavefunction', { xi });
  let logScale = -xi * xi / 2, a = 0, b = Math.pow(Math.PI, -0.25);
  for (let k = 0; k < n; k++) {
    const c = Math.sqrt(2 / (k + 1)) * xi * b - Math.sqrt(k / (k + 1)) * a;
    a = b; b = c;
    const m = Math.abs(b);
    if (m > 1e150) { a /= m; b /= m; logScale += Math.log(m); }
  }
  if (b === 0) return b;
  // exp(logScale) may underflow before multiplication by the still-large recurrence value.
  // Split the exponential when possible, preserving subnormal as well as normal results.
  const half = Math.exp(logScale / 2);
  if (half > 0 && Number.isFinite(half)) return (b * half) * half;
  return Math.sign(b) * Math.exp(Math.log(Math.abs(b)) + logScale);
}

// ================================================================= hypergeometric functions

const CANCEL = 1e4;     // accept a sum only if its largest term is ≤ 1e4 × |sum| (≤ 4 digits lost)

// A terminating hypergeometric series can cancel by hundreds of digits, even at degree 50.
// Sum its rational terms exactly for the supplied binary64 parameters, then round only once.
function binaryFraction(x) {
  if (x === 0) return [0n, 1n];
  const buf = new DataView(new ArrayBuffer(8));
  buf.setFloat64(0, x);
  const bits = buf.getBigUint64(0), exp = Number((bits >> 52n) & 2047n);
  let num = (bits & ((1n << 52n) - 1n)) | (exp ? 1n << 52n : 0n);
  if (x < 0) num = -num;
  const power = exp ? exp - 1075 : -1074;
  return power >= 0 ? [num << BigInt(power), 1n] : [num, 1n << BigInt(-power)];
}
function hyperPolynomial(numerators, denominator, x, degree) {
  need(Number.isSafeInteger(degree) && degree <= 2048, 'hypergeometric polynomial: degree exceeds the exact-summation budget (2048)');
  const pars = numerators.map(binaryFraction), [cn, cd] = binaryFraction(denominator), [xn, xd] = binaryFraction(x);
  let tn = 1n, td = 1n, sn = 1n, sd = 1n;
  for (let k = 0; k < degree; k++) {
    const kk = BigInt(k);
    for (const [pn, pd] of pars) { tn *= pn + kk * pd; td *= pd; }
    tn *= cd * xn; td *= (cn + kk * cd) * BigInt(k + 1) * xd;
    if (tn === 0n) break;
    if (td < 0n) { tn = -tn; td = -td; }
    let g = gcdBig(tn, td); tn /= g; td /= g;
    g = gcdBig(sd, td);
    sn = sn * (td / g) + tn * (sd / g); sd *= td / g;
    g = gcdBig(sn, sd); sn /= g; sd /= g;
  }
  return (sn < 0n ? -1 : 1) * ratioToNumber(absBig(sn), sd);
}

/** Σ t_k with t_{k+1} = t_k·ratio(k); returns { sum, big } or null if not converged. */
function hyperSeries(ratio, x, maxTerms = 200000) {
  let term = 1, sum = 1, big = 1, small = 0;
  const tail = Math.abs(x) < 1 ? 1 / (1 - Math.abs(x)) : 1;
  for (let k = 0; k < maxTerms; k++) {
    term *= ratio(k);
    if (term === 0) return { sum, big };
    sum += term;
    big = Math.max(big, Math.abs(term));
    if (!Number.isFinite(sum)) return null;
    small = Math.abs(term) * tail <= 1e-17 * Math.abs(sum) ? small + 1 : 0;
    if (small >= 2) return { sum, big };
  }
  return null;
}

function f21Series(a, b, c, x) {
  return hyperSeries(k => (a + k) * (b + k) / ((c + k) * (k + 1)) * x, x);
}

/** 2F1 for 0 ≤ x < 1 (non-terminating a, b). */
function f21Unit(a, b, c, x, who) {
  if (isNonPosInt(a) || isNonPosInt(b)) return hyp2f1(a, b, c, x);
  if (x <= 0.5) {
    const r = f21Series(a, b, c, x);
    need(r && r.big <= CANCEL * Math.abs(r.sum), `${who}: series cancellation too large; unsupported parameters`);
    return r.sum;
  }
  const d = c - a - b;
  if (!Number.isInteger(d)) {                                   // DLMF 15.8.4 (1 − x transformation)
    need(Math.max(Math.abs(a), Math.abs(b), Math.abs(c), Math.abs(d)) < 160, `${who}: parameters too large for the 1 − x transformation`);
    const y = 1 - x;
    const r1 = f21Series(a, b, 1 - d, y), r2 = f21Series(c - a, c - b, d + 1, y);
    if (r1 && r2) {
      const t1 = gamma(c) * gamma(d) * rgamma(c - a) * rgamma(c - b) * r1.sum;
      const t2 = Math.pow(y, d) * gamma(c) * gamma(-d) * rgamma(a) * rgamma(b) * r2.sum;
      const value = t1 + t2, big = Math.max(Math.abs(t1), Math.abs(t2), Math.abs(t1) * r1.big / Math.abs(r1.sum), Math.abs(t2) * r2.big / Math.abs(r2.sum));
      if (Number.isFinite(value) && big <= CANCEL * Math.abs(value)) return value;
    }
  }
  const r = f21Series(a, b, c, x);                                // slow but valid for x < 1
  need(r && r.big <= CANCEL * Math.abs(r.sum), `${who}: x = ${x} too close to 1 for these parameters (c − a − b integer); unsupported`);
  return r.sum;
}

/**
 * Gauss hypergeometric function ₂F₁(a, b; c; x) for real parameters and real x ≤ 1.
 * Supported: terminating cases (a or b a non-positive integer: polynomial, any real x);
 * |x| ≤ ½ by the series; ½ < x < 1 by the 1 − x connection formula (DLMF 15.8.4) when c − a − b is
 * not an integer, otherwise the (slowly converging) series; x < −½ by Pfaff's transformation
 * (DLMF 15.8.1) onto (⅓, 1); x = 1 by Gauss's sum when c − a − b > 0.
 * Accuracy ~1e-14 relative typically, ~1e-12 for parameters of size ~50; every path checks the
 * cancellation it incurs and throws instead of returning fewer than ~12 correct digits.
 * Throws for x > 1 (branch cut, complex), c a non-positive integer (pole), divergence at x = 1,
 * or regions it cannot evaluate accurately. Terminating polynomials of degree ≤ 2048 use exact
 * rational arithmetic for the input doubles (one final rounding); larger degrees throw.
 */
function hyp2f1(a, b, c, x) {
  const who = 'hyp2f1';
  finite(who, { a, b, c, x });
  const poly = isNonPosInt(a) || isNonPosInt(b);
  const degree = poly ? Math.max(isNonPosInt(a) ? a : -Infinity, isNonPosInt(b) ? b : -Infinity) : 0;
  need(!isNonPosInt(c) || (poly && degree > c), `${who}: c = ${c} is a non-positive integer (pole)`);
  if (x === 0) return 1;
  if (poly) {
    return hyperPolynomial([a, b], c, x, -degree);
  }
  need(x <= 1, `${who}: x = ${x} > 1 lies on the branch cut (complex result)`);
  if (x === 1) {
    need(c - a - b > 0, `${who}: diverges at x = 1 unless c − a − b > 0`);
    return gammaRatio([c, c - a - b], [c - a, c - b]);
  }
  if (x >= -0.5) {
    if (x >= 0) return f21Unit(a, b, c, x, who);
    const r = f21Series(a, b, c, x);
    need(r && r.big <= CANCEL * Math.abs(r.sum), `${who}: series cancellation too large; unsupported parameters`);
    return r.sum;

  const z = x / (x - 1);                                          // Pfaff: z ∈ (1/3, 1)
  if (isNonPosInt(c - a) && !isNonPosInt(c - b)) return Math.pow(1 - x, -b) * f21Unit(c - a, b, c, z, who);

}

/** Asymptotic Σ (p)_k (q)_k / (k! w^k) stopped at the smallest term: { sum, exact } or null if not converged. */
function asymptoticPQ(p, q, w) {
  let term = 1, sum = 1;
  for (let k = 0; k < 500; k++) {
    const next = term * (p + k) * (q + k) / ((k + 1) * w);
    if (next === 0) return { sum, exact: true };
    if (Math.abs(next) > Math.abs(term)) return null;
    term = next; sum += term;
    if (Math.abs(term) <= 1e-17 * Math.abs(sum)) return { sum, exact: false };
  }
  return null;
}

/**
 * Large-|x| asymptotics of M(a, b, x) (DLMF 13.7.2 with Kummer's transformation), including the
 * exponentially recessive term with the Stokes-line average cos(πa) on the real axis. Accepted only
 * when that term is negligible (< 1e-16 relative) or the dominant series terminates (exact); else null.
 */
function m1f1Asymptotic(a, b, x) {
  const y = Math.abs(x), ly = Math.log(y);
  const [sb, lb] = signLogGamma(b), [sa, la] = signLogGamma(a), [sba, lba] = signLogGamma(b - a);
  // x > 0: dominant e^y y^{a−b}/Γ(a) Σ(1−a)_k(b−a)_k/(k!y^k), recessive cos(πa) y^{−a}/Γ(b−a) Σ(a)_k(a−b+1)_k/(k!(−y)^k)
  // x < 0: the same with a → b − a (Kummer), the e^{−y} factor moving to the recessive part
  const [p1, q1, p2, q2, sd, ld, sr, lr, cosr, ed, er] = x > 0
    ? [1 - a, b - a, a, a - b + 1, sa, la, sba, lba, sinpi(a + 0.5), y + (a - b) * ly, -a * ly]
    : [a, a - b + 1, b - a, 1 - a, sba, lba, sa, la, sinpi(b - a + 0.5), -a * ly, -y + (a - b) * ly];
  if (sd === 0) return null;
  const S1 = asymptoticPQ(p1, q1, y);
  if (S1 === null) return null;
  const dom = sb * sd * Math.exp(lb - ld + ed) * S1.sum;
  if (sr === 0 || cosr === 0) return dom;
  const relRec = Math.exp(ld - lr + er - ed);                      // |recessive/dominant| prefactor ratio
  if (relRec < 1e-17) return dom;
  if (!S1.exact) return null;
  const S2 = asymptoticPQ(p2, q2, -y);
  if (S2 === null) return null;
  return dom + cosr * sb * sr * Math.exp(lb - lr + er) * S2.sum;
}

function m1f1Series(a, b, x) {
  return hyperSeries(k => (a + k) / ((b + k) * (k + 1)) * x, 0, 100000);
}

/**
 * Kummer's confluent hypergeometric function M(a, b, x) = ₁F₁(a; b; x), real a, b, x.
 * Paths: polynomial when a is a non-positive integer (and e^x × polynomial when b − a is, x < 0);
 * the power series (x ≥ 0) or Kummer's transformation M = e^x M(b − a, b, −x) (x < 0) for |x| ≤ 700;
 * the large-|x| asymptotic expansion (DLMF 13.7.2) for |x| ≥ 30 whenever it is accurate to full precision
 * (its exponentially small second term is either negligible or the leading series terminates).
 * Accuracy ~1e-14 relative typically; each path checks its cancellation and the function throws
 * rather than return fewer than ~12 digits. Throws for b a non-positive integer (pole).
 * Overflow for x ≳ 700 returns Infinity.
 */
function hyp1f1(a, b, x) {
  const who = 'hyp1f1';
  finite(who, { a, b, x });
  need(!isNonPosInt(b) || (isNonPosInt(a) && a > b), `${who}: b = ${b} is a non-positive integer (pole)`);
  if (x === 0) return 1;
  const poly = (aa, xx) => hyperPolynomial([aa], b, xx, -aa);
  if (isNonPosInt(a)) return poly(a, x);
  if (x < 0 && isNonPosInt(b - a)) return Math.exp(x) * poly(b - a, -x);
  if (Math.abs(x) >= 30) {
    const v = m1f1Asymptotic(a, b, x);
    if (v !== null) return v;

  if (Math.abs(x) <= 700) {
    const tries = x >= 0 ? [[a, x, 1]] : [[b - a, -x, Math.exp(x)], [a, x, 1]];
    for (const [aa, xx, pre] of tries) {
      const r = m1f1Series(aa, b, xx);
      if (r && r.big <= CANCEL * Math.abs(r.sum)) return pre * r.sum;
    }

}

// ================================================================= elliptic functions

/**
 * Complete elliptic integral of the second kind E(m) = ∫₀^{π/2} √(1 − m sin²θ) dθ, parameter m = k²
 * (same convention as ellipticK in core/numerics.mjs), m ≤ 1. Arithmetic–geometric mean with
 * E = K(1 − Σ 2^{n−1} c_n²) (A&S 17.6). Accuracy ~1e-15. E(1) = 1. Throws for m > 1.
 */
function ellipticE(m) {
  finite('ellipticE', { m });
  need(m <= 1, `ellipticE: parameter m = k² must be ≤ 1 (got ${m})`);
  if (m === 1) return 1;
  let a = 1, b = Math.sqrt(1 - m), c = 0, sum = m / 2, pow = 0.5;
  for (let i = 0; i < 60; i++) {
    const an = (a + b) / 2;
    c = (i === 0 ? m : c * c) / (4 * an);                       // c_{n+1} = c_n²/(4a_{n+1}): no cancellation
    b = Math.sqrt(a * b); a = an;
    pow *= 2;
    sum += pow * c * c;
    if (Math.abs(c) <= EPS * a) break;
  }
  return Math.PI / (2 * a) * (1 - sum);
}

/** sn, cn, dn, am for 0 < m < 1 by the descending Landen / AGM scheme (A&S 16.4). */
function jacobiCore(u, m) {
  const a = [1], c = [Math.sqrt(m)];
  let b = Math.sqrt(1 - m), n = 0;
  while (c[n] > EPS * a[n] && n < 60) {
    const an = (a[n] + b) / 2;
    c.push(c[n] * c[n] / (4 * an));
    b = Math.sqrt(a[n] * b);
    a.push(an);
    n++;
  }
  let phi = Math.pow(2, n) * a[n] * u;
  for (let k = n; k > 0; k--) phi = (phi + Math.asin(c[k] * Math.sin(phi) / a[k])) / 2;
  const sn = Math.sin(phi), cn = Math.cos(phi);
  return { sn, cn, dn: Math.sqrt(cn * cn + (1 - m) * sn * sn), am: phi };   // dn² = cn² + m′sn²: no cancellation
}

/**
 * Jacobi elliptic functions sn(u|m), cn(u|m), dn(u|m) and the amplitude am(u|m) (sn = sin am,
 * cn = cos am), parameter m = k² (A&S ch. 16 convention), any real u and m.
 * 0 < m < 1: descending Landen transformation (A&S 16.4); m = 0, 1: circular / hyperbolic limits;
 * m > 1 and m < 0: reciprocal- and negative-parameter transformations (A&S 16.11, 16.10).
 * am is continuous and increasing for m < 1 (am(u + 2K) = am(u) + π); for m > 1 it is asin(sn).
 * Accuracy ~1e-15 absolute for sn, cn, dn with |u| ≲ 1e3·K (phase error grows ∝ |u|·eps).
 * Returns { sn, cn, dn, am }.
 */
function jacobiElliptic(u, m) {
  finite('jacobiElliptic', { u, m });
  if (m === 0) return { sn: Math.sin(u), cn: Math.cos(u), dn: 1, am: u };
  if (m === 1) {
    const t = Math.tanh(u), sech = 1 / Math.cosh(u);
    return { sn: t, cn: sech, dn: sech, am: 2 * Math.atan(Math.tanh(u / 2)) };

    const mu = Math.sqrt(m), r = jacobiCore(u * mu, 1 / m);
    const sn = r.sn / mu;
    return { sn, cn: r.dn, dn: r.cn, am: Math.asin(sn) };

  if (m < 0) {
    const M = -m, mu = M / (1 + M), v = u * Math.sqrt(1 + M), r = jacobiCore(v, mu);
    const sn = r.sn / (Math.sqrt(1 + M) * r.dn), cn = r.cn / r.dn, dn = 1 / r.dn;
    const base = Math.atan2(sn, cn), K = ellipticK(m);
    const am = base + 2 * Math.PI * Math.round((Math.PI * u / (2 * K) - base) / (2 * Math.PI));

  return jacobiCore(u, m);
}

// ================================================================= Γ-related

/**
 * Digamma ψ(x) = Γ′(x)/Γ(x), real x ≠ 0, −1, −2, … (throws at the poles). Reflection
 * ψ(1−x) − ψ(x) = π cot πx for x < 0, upward recurrence to x ≥ 12, then the asymptotic series
 * (DLMF 5.11.2). Accuracy ~1e-15 absolute·(1 + |ln x|); relative near the positive root 1.4616…
 * is limited to the absolute error.
 */
function digamma(x) {
  finite('digamma', { x });
  need(!isNonPosInt(x), `digamma: pole at x = ${x}`);
  if (x < 0) return digamma(1 - x) - Math.PI * cotpi(x);
  let shift = 0, y = x;
  while (y < 12) { shift -= 1 / y; y += 1; }
  const r = 1 / (y * y);
  const series = r * (1 / 12 - r * (1 / 120 - r * (1 / 252 - r * (1 / 240 - r * (1 / 132 - r * (691 / 32760 - r / 12))))));
  return shift + Math.log(y) - 0.5 / y - series;
}

const STIRLING = [1 / 12, -1 / 360, 1 / 1260, -1 / 1680, 1 / 1188, -691 / 360360, 1 / 156];
/** ln Γ(a + b) − ln Γ(a) for a ≥ 15, b > 0, without cancelling two large ln Γ values (Stirling). */
function lgammaDiff(a, b) {
  const ab = a + b;
  let corr = 0, pa = 1 / a, pab = 1 / ab;
  const ra = pa * pa, rab = pab * pab;
  for (const c of STIRLING) { corr += c * (pab - pa); pa *= ra; pab *= rab; }
  return (a - 0.5) * Math.log1p(b / a) + b * Math.log(ab) - b + corr;
}

/**
 * ln B(a, b) = ln Γ(a) + ln Γ(b) − ln Γ(a + b), a, b > 0. When max(a, b) ≥ 15 the difference
 * ln Γ(a+b) − ln Γ(max) is formed directly from Stirling's series (no cancellation), so a ≫ b
 * (e.g. Student t with ν ~ 1e9) stays accurate. Absolute accuracy ~eps·(1 + |ln Γ(min(a, b))|).
 */
function logBeta(a, b) {
  finite('logBeta', { a, b });
  need(a > 0 && b > 0, `logBeta: need a, b > 0 (got ${a}, ${b})`);
  const hi = Math.max(a, b), lo = Math.min(a, b);
  if (hi < 15) return lgamma(a) + lgamma(b) - lgamma(a + b);
  return lgamma(lo) - lgammaDiff(hi, lo);
}

/**
 * Beta function B(a, b) = Γ(a)Γ(b)/Γ(a+b), a, b > 0. Direct Γ ratio when a + b < 170 (~1e-14
 * relative), otherwise exp(logBeta) (relative error ~eps·|ln B|: ~1e-13 for |ln B| ~ 1e3).
 */
function beta(a, b) {
  finite('beta', { a, b });
  need(a > 0 && b > 0, `beta: need a, b > 0 (got ${a}, ${b})`);
  if (a + b < 170) return (gamma(a) / gamma(a + b)) * gamma(b);
  return Math.exp(logBeta(a, b));
}

function betaCF(a, b, x, xc) {
  const tiny = 1e-300, qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = x > 0.5 ? (1 - b + qab * xc) / qap : 1 - qab * x / qap;   // 1 − (a+b)x/(a+1) without cancellation
  if (Math.abs(d) < tiny) d = tiny;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= 100000; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny;
    c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny;
    c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) return h;
  }
  throw new Error('incompleteBeta: continued fraction did not converge');
}

/** I_x(a, b) with the complement xc = 1 − x supplied exactly. */
function incBeta(x, xc, a, b) {
  if (x <= 0) return 0;
  if (xc <= 0) return 1;
  const lx = x > 0.5 ? Math.log1p(-xc) : Math.log(x), lxc = xc > 0.5 ? Math.log1p(-x) : Math.log(xc);
  const front = Math.exp(-logBeta(a, b) + a * lx + b * lxc);
  if (x < (a + 1) / (a + b + 2)) return front * betaCF(a, b, x, xc) / a;
  return 1 - front * betaCF(b, a, xc, x) / b;
}

/**
 * Regularised incomplete beta function I_x(a, b) = B(x; a, b)/B(a, b), 0 ≤ x ≤ 1, a, b > 0.
 * Lentz continued fraction with the symmetry I_x(a,b) = 1 − I_{1−x}(b,a) (Numerical Recipes §6.4).
 * Accuracy ~1e-14 for a, b ≲ 100; when both a and b are large (≳ 1e4) the prefactor x^a(1−x)^b/B
 * cancels and the error grows ~eps·min(a, b) (≈1e-12 at 1e4). a ≫ b (large-ν Student t) stays accurate.
 * Binomial tails: P(X ≥ k) = I_p(k, n−k+1); F-distribution and Student-t p-values (see studentTPValue).
 */
function incompleteBeta(x, a, b) {
  finite('incompleteBeta', { x, a, b });
  need(a > 0 && b > 0, `incompleteBeta: need a, b > 0 (got ${a}, ${b})`);
  need(x >= 0 && x <= 1, `incompleteBeta: need 0 ≤ x ≤ 1 (got ${x})`);
  return incBeta(x, 1 - x, a, b);
}

/** Two-sided tail I_{ν/(ν+t²)}(ν/2, ½) = P(|T| ≥ |t|). */
function studentTail(t, nu) {
  const logRatio = 2 * Math.log(Math.abs(t)) - Math.log(nu);
  if (logRatio > Math.log(Number.MAX_VALUE)) {
    // x = ν/(ν+t²) underflows but x^(ν/2) need not (e.g. the Cauchy 1/t tail).
    const a = nu / 2, logX = -logRatio;
    return Math.exp(a * logX - Math.log(a) - logBeta(a, 0.5));
  }
  const ratio = Math.exp(logRatio);
  return incBeta(1 / (1 + ratio), ratio / (1 + ratio), nu / 2, 0.5);
}

/**
 * Cumulative distribution of Student's t with ν > 0 degrees of freedom (ν need not be an integer):
 * P(T ≤ t). Accuracy ~1e-14 absolute (the small tail itself is accurate relatively: use studentTPValue).
 */
function studentTCdf(t, nu) {
  need(!Number.isNaN(t), 'studentTCdf: t must be a number');
  finite('studentTCdf', { nu });
  need(nu > 0, `studentTCdf: ν must be > 0 (got ${nu})`);
  if (!Number.isFinite(t)) return t > 0 ? 1 : 0;
  const tail = studentTail(t, nu) / 2;
  return t > 0 ? 1 - tail : tail;
}

/**
 * p-value of a Student-t statistic with ν > 0 degrees of freedom. tails = 2: P(|T| ≥ |t|);
 * tails = 1: upper tail P(T ≥ t). Small p-values keep full relative accuracy (~1e-13) for ν ≲ 1e6;
 * the absolute error grows beyond (~1e-10 at ν = 1e8): use the normal limit there.
 */
function studentTPValue(t, nu, tails = 2) {
  need(!Number.isNaN(t), 'studentTPValue: t must be a number');
  finite('studentTPValue', { nu });
  need(nu > 0, `studentTPValue: ν must be > 0 (got ${nu})`);
  need(tails === 1 || tails === 2, 'studentTPValue: tails must be 1 or 2');
  if (!Number.isFinite(t)) return tails === 2 ? 0 : (t > 0 ? 0 : 1);
  const two = studentTail(t, nu);
  if (tails === 2) return two;
  return t >= 0 ? two / 2 : 1 - two / 2;
}

// ================================================================= ζ and polylogarithms

const BORWEIN = (() => {                                           // Borwein (2000), algorithm 2, n = 30
  const n = 30, d = [1];
  let T = 1;
  for (let i = 1; i <= n; i++) { T *= 4 * (n + i - 1) * (n - i + 1) / ((2 * i) * (2 * i - 1)); d.push(d[i - 1] + T); }
  return d.slice(0, n).map(dk => (d[n] - dk) / d[n]);
})();

/** Dirichlet η(s) = Σ (−1)^{k−1} k^{−s} for s > 0 (Borwein acceleration, error < 1e-20). */
function etaPositive(s) {
  let sum = 0;
  for (let k = 0; k < BORWEIN.length; k++) sum += (k % 2 ? -1 : 1) * BORWEIN[k] * Math.pow(k + 1, -s);
  return sum;
}

/**
 * Riemann zeta function ζ(s) for real s ≠ 1 (throws at the pole). s > 0: Borwein's accelerated
 * alternating series for η(s) and ζ = η/(1 − 2^{1−s}); s < 0: the functional equation
 * (log-scaled, so large |s| neither overflows nor underflows early); exact zeros at negative even
 * integers. Accuracy ~1e-15 relative for s > 0, ~1e-14·(1 + ln|s|) for s < 0.
 * ζ(2) = π²/6, ζ(3) = 1.2020569…, ζ(3/2) = 2.6123753… (Bose–Einstein condensation).
 */
function zeta(s) {
  finite('zeta', { s });
  need(s !== 1, 'zeta: pole at s = 1');
  if (s === 0) return -0.5;
  // The reflection formula multiplies sin(πs/2) by the pole ζ(1−s), which loses
  // all relative accuracy when 1−s rounds to 1. Use the analytic expansion at zero.
  if (Math.abs(s) < 1e-7) return -0.5 - 0.5 * Math.log(2 * Math.PI) * s - 1.0031782279542925 * s * s;
  if (s > 0) return etaPositive(s) / -Math.expm1((1 - s) * Math.LN2);
  if (Number.isInteger(s) && s % 2 === 0) return 0;
  const sn = sinpi(s / 2), z1 = zeta(1 - s);
  if (1 - s < 170) return Math.pow(2, s) * Math.pow(Math.PI, s - 1) * sn * gamma(1 - s) * z1;
  return Math.sign(sn) * Math.exp(s * Math.LN2 + (s - 1) * Math.log(Math.PI) + Math.log(Math.abs(sn)) + lgamma(1 - s) + Math.log(z1));
}

/** η(s) = (1 − 2^{1−s}) ζ(s), all real s (η(1) = ln 2). */
function eta(s) {
  if (s === 1) return Math.LN2;
  if (s > 0) return etaPositive(s);
  return -Math.expm1((1 - s) * Math.LN2) * zeta(s);
}

/** Σ_{k≥1} z^k k^{−s}; null if not converged or cancelled. */
function polylogSeries(s, z, maxTerms) {
  let sum = 0, big = 0, p = 1, small = 0;
  for (let k = 1; k <= maxTerms; k++) {
    p *= z;
    const term = p * Math.pow(k, -s);
    sum += term; big = Math.max(big, Math.abs(term));
    small = Math.abs(term) <= 1e-17 * Math.abs(sum) && k > -s ? small + 1 : 0;
    if (small >= 2) return big <= CANCEL * Math.abs(sum) ? sum : null;
  }
  return null;
}

/** Li_s(e^μ) for −0.7 < μ < 0 (DLMF 25.12.12 and its integer-s limit). */
function polylogLog(s, mu) {
  if (!Number.isInteger(s)) {
    // Γ(1−s)(−μ)^(s−1) and ζ(s−k) contain cancelling poles near integer s.
    // Reject this expansion before parameter-rounding error contaminates the result.
    const distance = Math.abs(s - Math.round(s));
    need(distance >= 1e-4, `polylog: order s = ${s} too close to an integer for the logarithmic expansion; unsupported`);
  }

  if (Number.isInteger(s) && s >= 2) {
    let H = 0, fact = 1;
    for (let k = 1; k < s; k++) { H += 1 / k; fact *= k; }
    sum = Math.pow(mu, s - 1) / fact * (H - Math.log(-mu));
    start = 0;
  } else {
    sum = gamma(1 - s) * Math.pow(-mu, s - 1);
    start = 0;
  }
  big = Math.abs(sum);
  let p = 1, small = 0;
  for (let k = start; k < 200; k++) {
    if (k > 0) p *= mu / k;
    if (Number.isInteger(s) && s >= 2 && k === s - 1) continue;
    const term = zeta(s - k) * p;
    sum += term; big = Math.max(big, Math.abs(term));
    small = Math.abs(term) <= 1e-17 * Math.abs(sum) && k > s + 2 ? small + 1 : 0;
    if (small >= 3) break;
  }
  need(big <= CANCEL * Math.abs(sum), `polylog: cancellation near integer order s = ${s}; unsupported`);
  return sum;
}

/**
 * Polylogarithm Li_s(z) = Σ_{k≥1} z^k/k^s for real order s and real z ≤ 1 (Li_s(1) = ζ(s), s > 1).
 * Paths: power series (|z| ≤ ½); the expansion in μ = ln z about z = 1 (DLMF 25.12.12) for ½ < z < 1;
 * duplication Li_s(z) + Li_s(−z) = 2^{1−s} Li_s(z²) for −1 < z < −½ with s > 1, the alternating series
 * there for s ≤ 1; Li_s(−1) = −η(s); inversion formulae for z < −1 with integer s (DLMF 25.12.4-type).
 * Li₁(z) = −ln(1 − z). Bose–Einstein integrals: g_s(z) = Li_s(z); Fermi–Dirac: f_s(z) = −Li_s(−z).
 * Accuracy ~1e-14 typically (each path checks its cancellation); orders within ~1e-4 of an integer
 * in the μ-expansion lose digits and throw. Throws for z > 1 (complex), z = 1 with s ≤ 1, and z < −1
 * with non-integer s (unsupported).
 */
function polylog(s, z) {
  const who = 'polylog';
  finite(who, { s, z });
  if (z === 0) return 0;
  need(z <= 1, `${who}: z = ${z} > 1 gives a complex value`);
  if (s === 1) return -Math.log1p(-z);
  if (z === 1) { need(s > 1, `${who}: Li_s(1) = ζ(s) diverges for s ≤ 1`); return zeta(s); }
  if (z === -1) return -eta(s);
  if (z < -1) {
    need(Number.isInteger(s), `${who}: z < −1 is supported only for integer order s (got s = ${s})`);
    if (s === 0) return z / (1 - z);
    if (s < 0) return -((-s) % 2 ? -1 : 1) * polylog(s, 1 / z);
    const L = Math.log(-z);
    let rest = 0, fact = 1;
    for (let k = 1; k <= s; k++) fact *= k;
    rest -= Math.pow(L, s) / fact;
    for (let k = 1; 2 * k <= s; k++) {
      let f = 1;
      for (let i = 2; i <= s - 2 * k; i++) f *= i;
      rest -= 2 * Math.pow(L, s - 2 * k) / f * eta(2 * k);
    }
    return -(s % 2 ? -1 : 1) * polylog(s, 1 / z) + rest;
  }
  if (Math.abs(z) <= 0.5) {
    const v = polylogSeries(s, z, 10000);
    need(v !== null, `${who}: series cancellation for s = ${s}, z = ${z}; unsupported`);
    return v;
  }
  if (z > 0) return polylogLog(s, Math.log(z));
  if (s > 1) return Math.pow(2, 1 - s) * polylog(s, z * z) - polylog(s, -z);
  const v = polylogSeries(s, z, 400000);
  need(v !== null, `${who}: z = ${z} too close to −1 for order s = ${s} ≤ 1; unsupported`);
  return v;
}

// ================================================================= exponential integrals

/**
 * Generalised exponential integral E_n(x) = ∫₁^∞ e^{−xt} t^{−n} dt, integer n ≥ 0, x ≥ 0
 * (x = 0 needs n ≥ 2: E_n(0) = 1/(n−1)). Series (x ≤ 1) or Lentz continued fraction (x > 1),
 * Numerical Recipes §6.3. Accuracy ~1e-15 relative; underflows to 0 for x ≳ 700.
 */
function expintEn(n, x) {
  intArg('expintEn', 'n', n); finite('expintEn', { x });
  need(x >= 0, `expintEn: x must be ≥ 0 (got ${x}); E_n is complex for x < 0`);
  if (n === 0) return x === 0 ? Infinity : Math.exp(-x) / x;
  if (x === 0) { need(n >= 2, 'expintEn: E_1(0) diverges'); return 1 / (n - 1); }
  if (x > 1) {
    let b = x + n, c = 1e300, d = 1 / b, h = d;
    for (let i = 1; i < 10000; i++) {
      const an = -i * (n - 1 + i);
      b += 2;
      d = 1 / (an * d + b);
      c = b + an / c;
      const del = c * d;
      h *= del;
      if (Math.abs(del - 1) < 1e-16) return h * Math.exp(-x);
    }
    throw new Error('expintEn: continued fraction did not converge');
  }
  const nm1 = n - 1;
  let ans = nm1 !== 0 ? 1 / nm1 : -Math.log(x) - EULER, fact = 1;
  for (let i = 1; i < 1000; i++) {
    fact *= -x / i;
    let del;
    if (i !== nm1) del = -fact / (i - nm1);
    else {
      let psi = -EULER;
      for (let k = 1; k <= nm1; k++) psi += 1 / k;
      del = fact * (-Math.log(x) + psi);
    }
    ans += del;
    if (Math.abs(del) < Math.abs(ans) * 1e-17) return ans;
  }
  throw new Error('expintEn: series did not converge');
}

/** Exponential integral E₁(x) = ∫ₓ^∞ e^{−t}/t dt, x > 0 (E₁(0) = Infinity). See expintEn. */
function expintE1(x) {
  finite('expintE1', { x });
  need(x >= 0, `expintE1: x must be ≥ 0 (got ${x}); for x < 0 use −expintEi(−x)`);
  return x === 0 ? Infinity : expintEn(1, x);
}

/**
 * Exponential integral Ei(x) = −PV∫_{−x}^∞ e^{−t}/t dt, real x ≠ 0 (Ei(0) = −Infinity; Ei(x) = −E₁(−x)
 * for x < 0). Positive x: power series γ + ln x + Σ x^k/(k·k!) for x ≤ 40, asymptotic e^x/x Σ k!/x^k
 * beyond. Accuracy ~1e-15 relative (absolute ~1e-16 near the root x₀ = 0.37250741…); overflows to
 * Infinity for x ≳ 710.
 */
function expintEi(x) {
  finite('expintEi', { x });
  if (x === 0) return -Infinity;
  if (x < 0) return -expintE1(-x);
  if (x <= 40) {
    let term = 1, sum = 0;
    for (let k = 1; k < 500; k++) {
      term *= x / k;
      const add = term / k;
      sum += add;
      if (add < 1e-17 * sum) break;
    }
    return EULER + Math.log(x) + sum;
  }
  let term = 1, sum = 1;
  for (let k = 1; k < 100; k++) {
    const next = term * k / x;
    if (next > term) break;
    term = next; sum += term;
    if (term < 1e-17 * sum) break;
  }
  const half = Math.exp(x / 2);
  return ((half / x) * sum) * half;
}

// ================================================================= Dawson's integral

const DAWSON_H = 0.2, DAWSON_C = Array.from({ length: 18 }, (_, i) => Math.exp(-(((2 * i + 1) * DAWSON_H) ** 2)));

/**
 * Dawson's integral F(x) = e^{−x²} ∫₀ˣ e^{t²} dt (= (√π/2) e^{−x²} erfi x), any real x (odd).
 * Power series for |x| < 1, Rybicki's exponentially convergent sampling formula (h = 0.2,
 * truncation error ~e^{−(π/2h)²} ≈ 1e-27) for 1 ≤ |x| ≤ 50, asymptotic series 1/(2x) Σ (2k−1)!!/(2x²)^k
 * beyond. Accuracy ~1e-15 relative. Maximum F = 0.5410442246… at x = 0.9241388730….
 * Appears in plasma dispersion (Re Z), Voigt profiles and ion-acoustic responses.
 */
function dawson(x) {
  finite('dawson', { x });
  const ax = Math.abs(x), sign = x < 0 ? -1 : 1;
  if (ax < 1) {
    let term = ax, sum = ax;
    const q = 2 * ax * ax;
    for (let k = 0; k < 100; k++) {
      term *= -q / (2 * k + 3);
      sum += term;
      if (Math.abs(term) <= 1e-17 * Math.abs(sum)) break;
    }
    return sign * sum;
  }
  if (ax > 50) {
    const r = 1 / (2 * ax * ax);
    let term = 1, sum = 1;
    for (let k = 1; k < 40; k++) { term *= (2 * k - 1) * r; sum += term; if (term < 1e-17 * sum) break; }
    return sign * sum / (2 * ax);
  }
  const n0 = 2 * Math.round(ax / (2 * DAWSON_H)), xp = ax - n0 * DAWSON_H;
  let e1 = Math.exp(2 * xp * DAWSON_H);
  const e2 = e1 * e1;
  let d1 = n0 + 1, d2 = d1 - 2, sum = 0;
  for (const c of DAWSON_C) {
    sum += c * (e1 / d1 + 1 / (d2 * e1));
    d1 += 2; d2 -= 2; e1 *= e2;
  }
  return sign * Math.exp(-xp * xp) * sum / SQRT_PI;
}

// ================================================================= Wigner symbols (exact)

const FACT = [1n];
function factBig(n) {
  while (FACT.length <= n) FACT.push(FACT[FACT.length - 1] * BigInt(FACT.length));
  return FACT[n];

const absBig = v => (v < 0n ? -v : v);
function gcdBig(u, v) {

}
const bitLength = v => (v === 0n ? 0 : v.toString(2).length);
/** A/B (positive BigInts), rounded to binary64 with ties to even, including subnormals. */

  if (exponent > 1023) return Infinity;

/** Doubled integer 2j for an integer or half-integer j. */

  return 2 * j;
}
/** Triangle condition on doubled values: |a−b| ≤ c ≤ a+b and a+b+c even. */
const triangle = (a, b, c) => c >= Math.abs(a - b) && c <= a + b && (a + b + c) % 2 === 0;
/** Δ(abc) on doubled values as [numerator, denominator]. */
const delta = (a, b, c) => [factBig((a + b - c) / 2) * factBig((a - b + c) / 2) * factBig((-a + b + c) / 2), factBig((a + b + c) / 2 + 1)];

/** Exact square of a symbol: value = sign·√(num/den), reduced. */
function exactResult(sign, num, den) {

const toValue = r => (r.sign === 0 ? 0 : r.sign * Math.sqrt(ratioToNumber(r.num, r.den)));

function threeJExact(J1, J2, J3, M1, M2, M3) {

  const cap = t => el('p', { class: 'psim-hint' }, t);
  figs.append(
    el('div', {}, comp.el, cap('Solid: computed (Lie–Poisson splitting). Dashed: exact Jacobi-elliptic solution of the same spin-axis component. A flip is the spin-axis component passing through zero.')),
    el('div', {}, pol.el, cap('Each point is the direction of L in the nut’s frame. Dashed: the separatrix through the bolt axis; a bolt-axis spin starts next to it and is carried from +bolt to −bolt and back. Wing and face spins circle their own axis.')));

  const cur = { s: null };
  const k = () => AXIS_KEY[cur.s.params.axis];
  const others = () => [0, 1, 2].filter(i => i !== k());
  const factor = () => { const [i, j] = others(), Ik = INERTIA[k()]; return (Ik - INERTIA[i]) * (INERTIA[j] - Ik) / (INERTIA[i] * INERTIA[j]); };
  const Om = () => 2 * Math.PI * cur.s.params.spin;
  const I_ = s => M.sub(M.i('I'), M.i(s));
  const stab = createEquation({
    title: 'Why only the middle axis flips: a small wobble grows exponentially at rate σ (linearised Euler equations)',
    lhs: { mathml: M.sup(M.i('σ'), M.n(2)), label: 'σ² > 0: wobble grows; < 0: it oscillates', unit: 's⁻²', value: () => Om() ** 2 * factor() },
    op: '=',
    terms: [
      { id: 'om', mathml: M.sup(M.i('Ω'), M.n(2)), label: 'spin rate squared', color: '--body-3', unit: 's⁻²', value: () => Om() ** 2 },
      { id: 'geo', sign: '×', mathml: M.frac(`${M.paren(`${I_('k')}<mo>−</mo>${I_('i')}`)}${M.paren(`${I_('j')}<mo>−</mo>${I_('k')}`)}`, `${I_('i')}${I_('j')}`), label: 'shape factor: positive only if the spin axis k has the middle moment', color: COL.bolt, digits: 4, value: () => factor() },
    ],
    where: [
      { mathml: I_('wing'), meaning: 'moment about the wing axis (smallest)', value: () => INERTIA[0] * 1e9, unit: 'g mm²' },
      { mathml: I_('bolt'), meaning: 'moment about the bolt axis (middle)', value: () => INERTIA[1] * 1e9, unit: 'g mm²' },
      { mathml: I_('face'), meaning: 'moment about the flat-face axis (largest)', value: () => INERTIA[2] * 1e9, unit: 'g mm²' },
    ],
  });
  const flip = createEquation({
    title: 'Flip interval of the bolt-axis spin (exact, Jacobi elliptic functions)',
    lhs: { mathml: M.sub(M.i('T'), M.i('flip')), label: 'time between flips', unit: 's', digits: 5, value: () => cur.s.ref.flipInterval },
    op: '=',
    terms: [
      { id: 'K', mathml: `${M.n(2)}${M.i('K')}${M.paren(M.i('m'))}`, label: 'complete elliptic integral: grows as ln(1/ε) for a cleaner spin', color: COL.bolt, digits: 4, value: () => 2 * cur.s.ref.K },
      { id: 'lam', sign: '×', mathml: M.frac(M.n(1), M.i('λ')), label: '1/λ, λ → σ for a small imperfection', color: '--body-3', unit: 's', digits: 4, value: () => 1 / cur.s.ref.lambda },
    ],
    where: [
      { mathml: M.i('m'), meaning: 'elliptic parameter (1 on the separatrix)', value: () => cur.s.ref.m, digits: 8 },
      { mathml: M.i('σ'), meaning: 'linear growth rate of the bolt spin', value: () => growthRate(Om()), unit: 's⁻¹' },
    ],
    link: comp,
  });
  eqs.append(stab.el, flip.el);

  // separatrix ellipse projected on the (wing, bolt) plane: x² (1/I1 − 1/I3)/(1/I2 − 1/I3) + y² = 1
  const a = Math.sqrt((1 / INERTIA[1] - 1 / INERTIA[2]) / (1 / INERTIA[0] - 1 / INERTIA[2]));
  const sep = Array.from({ length: 241 }, (_, i) => { const th = 2 * Math.PI * i / 240; return [a * Math.sin(th), Math.cos(th)]; });
  let shownFor = null, lastN = -1;
  return {
    update(sim, t, { rebuilt }) {
      cur.s = sim; stab.update(); flip.update();
      const kk = k();
      if (rebuilt || shownFor !== sim) {
        shownFor = sim; lastN = -1;
        comp.setX({ min: 0, max: sim.duration });
        comp.fn('exact', x => sim.exact.at(x)[kk] / sim.Lmag, { color: '--muted', dash: true, label: `exact (${AXIS_NAMES[kk]})`, width: 1.3 });
        pol.data('sep', sep, { color: '--muted', dash: true, label: 'separatrix' });
        pol.marker('ax+', 0, 1, { color: COL.bolt, label: '+bolt' });
        pol.marker('ax-', 0, -1, { color: COL.bolt, label: '−bolt' });
        pol.marker('axw', 1, 0, { color: COL.wing, label: 'wing' });
        pol.marker('axf', 0, 0, { color: COL.face, label: 'face (end-on)' });
      }
      const H = sim.hist, n = H.t.length;
      if (n !== lastN) {
        lastN = n;
        comp.data('w', H.t.map((x, i) => [x, H.Lb[i][0]]), { color: COL.wing, label: 'wing' });
        comp.data('f', H.t.map((x, i) => [x, H.Lb[i][2]]), { color: COL.face, label: 'face' });
        comp.data('b', H.t.map((x, i) => [x, H.Lb[i][1]]), { color: COL.bolt, label: 'bolt', width: 2 });
        pol.data('path', H.Lb.map(v => [v[0], v[1]]), { color: '--body-3', label: 'computed L direction' });
        const lb = H.Lb[n - 1];
        pol.marker('now', lb[0], lb[1], { color: '--ink' });
        comp.invalidate(); pol.invalidate();
      }
      comp.draw(); pol.draw();
    },
  };
}

const markers = sim => {
  if (sim.params.axis === 'bolt') {
    return sim.flipTimes.map((t, j) => ({ t, label: `flip ${j + 1}: bolt axis ⟂ L (exact, (2j − 1)·K/λ)`, short: j === 0 ? 'flip 1' : `${j + 1}`, kind: 'computed' }));
  }
  const P = sim.exact.period;
  return P <= sim.duration ? [{ t: P, label: `one wobble period of the ${AXIS_NAMES[AXIS_KEY[sim.params.axis]]} spin (exact)`, short: 'wobble period', kind: 'computed' }] : [];
};

createInstrument({
  title: 'Dzhanibekov effect: the flipping wing nut',
  subtitle: 'Torque-free steel wing nut: spun about its bolt axis (the middle principal axis) it turns over again and again; spins about the other two axes stay steady',
  tier: 'validated',
  tierReason: 'Euler’s equations for a torque-free rigid body solved by a 4th-order Lie–Poisson splitting and checked against the exact Jacobi-elliptic solution (≤ 8×10⁻⁸ over six flips), with conserved L, observed order 4.00, time reversal, and the inertia checked by voxel integration. Scope: an ideal rigid body without dissipation; the nut’s dimensions are illustrative.',
  layout: 'workbench',
  gl: true,
  params: PARAMS,
  create: createSim,
  drawGL, draw, bench,
  onPointer(canvas) { cam.attach(canvas); },
  onFit(view) { cam.fit(BOX, view.W / view.H, 1.05); },
  timeUnit: 's', timeLabel: 'time since release', speed: 1, speedRange: [0.05, 4], timeDigits: 2,
  hudError: false,
  hudLine: sim => `spin ${+sim.params.spin.toPrecision(3)} rev/s about the ${AXIS_NAMES[AXIS_KEY[sim.params.axis]]} · ε = ${+sim.params.tilt.toPrecision(3)}°`,
  timeline: {
    duration: sim => sim.duration,
    markers,
    note: sim => sim.params.axis === 'bolt'
      ? `The run covers three full periods of the motion (six flips), then stops; in this friction-free model it would repeat forever.`
      : `Same span as six flips of a bolt-axis spin with this spin rate and ε, for comparison: this spin never flips.`,
  },
  presets: [
    { label: 'Spin about the bolt: it flips', values: { axis: 'bolt', spin: 2, tilt: 1 } },
    { label: 'Spin about the wing axis: steady', values: { axis: 'wing', spin: 2, tilt: 1 } },
    { label: 'Spin about the flat faces: steady', values: { axis: 'face', spin: 2, tilt: 1 } },
    { label: 'A 100× cleaner release (ε = 0.01°): flips later, still flips', values: { axis: 'bolt', spin: 2, tilt: 0.01 } },
  ],
  texts: { presets: 'Try this' },
  model: {
    legend: [
      'green arrow: angular momentum L (fixed in space)',
      'axes: orange bolt · blue wing · purple face; trail: bolt tip, last 1 s',
    ],
    equations: [],
    assumptions: [
      'Torque-free rigid body in free fall: no gravity gradient, air drag or friction, no deformation and no internal energy loss.',
      `Wing nut shape (illustrative, M8 size): hexagonal hub 13 mm across flats, 9 mm high, 8 mm bore; two flat wings 13 × 2.4 × 15 mm; steel 7850 kg/m³ → ${(MASS * 1e3).toFixed(1)} g. Moments of inertia about the centre of mass: ${INERTIA.map(v => (v * 1e9).toFixed(0)).join(', ')} g·mm² (wing, bolt, face axes).`,
      'The release imperfection ε is the angle between L and the spin axis at t = 0, leaning towards the face axis (bolt spin) or the bolt axis (other spins).',
      'Real objects with internal friction slowly lose energy at fixed |L| and drift towards spin about the largest-moment axis (Explorer 1, 1958); over a few seconds of a steel nut this is negligible and not modelled.',
    ],
    conventions: [
      'Time: seconds since release, played at real time (1 s/s) by default. At high spin rates slow the playback, or the spin aliases on a 60 Hz screen.',
      'Space frame: L points up the screen and never moves; the camera can be dragged. "Body frame" plots rotate with the nut.',
      'The axis lines and the arrow are drawing aids; the length of the L arrow is not to scale.',
      'Principal axes are labelled by the nut’s geometry: wing axis along the wings, bolt axis through the bore, face axis normal to the wings’ flat faces.',
    ],
    references: [
      'L. D. Landau & E. M. Lifshitz, Mechanics, 3rd ed., §§35–37 (Euler’s equations, stability of free rotation, exact solution).',
      'M. S. Ashbaugh, C. C. Chicone & R. H. Cushman, “The twisting tennis racket”, J. Dyn. Differ. Equ. 3, 67 (1991).',
      'R. I. McLachlan, Phys. Rev. Lett. 71, 3043 (1993); A. Dullweber, B. Leimkuhler & R. McLachlan, J. Chem. Phys. 107, 5840 (1997): splitting integrator.',
      'V. A. Dzhanibekov observed the flipping wing nut aboard Salyut 7 in 1985 (Soyuz T-13 mission).',
    ],
  },
});

</script>
