<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {

.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;

.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);

  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }

/* ---------- figures (ui/plot.mjs) ---------- */

.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }

.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;

.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }

.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }

.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {

@media (max-width: 860px) {

  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);
  backdrop-filter: blur(3px);
}

/* ---------- full screen (scene + HUD + legend + playback bar) ---------- */
.psim-fs { background: var(--stage, var(--bg)); border-radius: 0 !important; border: 0 !important; }
.psim-app .psim-fs .psim-transport { position: absolute; left: 50%; right: auto; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; }
.psim-pseudo-fs { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; max-height: none !important; z-index: 1000; margin: 0 !important; }
.psim-fsbtn { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; }
.psim-fsbtn:hover { background: var(--raise); color: var(--ink); }
.psim-fsbtn svg { width: 15px; height: 15px; }

/* ---------- timeline: the run's span and its key times (spec.timeline) ---------- */
.psim-timeline { position: absolute; left: 50%; transform: translateX(-50%); bottom: 78px; width: min(560px, 62%); z-index: 3;
  font: 10.5px var(--mono); color: var(--muted); pointer-events: auto; }
.psim-canvaswrap > .psim-timeline { bottom: 14px; }
.psim-app .psim-fs > .psim-timeline { bottom: 86px; }
.psim-timeline .bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); cursor: pointer; }
.psim-timeline .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--accent); }
.psim-timeline .m { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.psim-timeline .ticks { position: relative; height: 30px; }
.psim-timeline .lab { position: absolute; bottom: 2px; transform: translateX(-50%); white-space: nowrap; color: var(--ink-2); }
.psim-timeline .lab.r1 { bottom: 16px; }
.psim-timeline .ends { display: flex; justify-content: space-between; margin-top: 3px; }
.psim-timeline .m.measured, .psim-tlrow i.measured { background: var(--good, #4cc38a); }
.psim-timeline .lab.measured { color: var(--good, #4cc38a); }
.psim-timeline .m.requested, .psim-tlrow i.requested { background: var(--warn, #e0a030); }
.psim-timeline .lab.requested { color: var(--warn, #e0a030); }
.psim-timeline { background: color-mix(in srgb, var(--stage) 78%, transparent); padding: 4px 12px 6px; border-radius: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.psim-tlrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: baseline; margin: 6px 0; font-size: 12px; }
.psim-tlrow i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.psim-tlrow code { font: 12px var(--mono); color: var(--ink); }
.psim-tlrow small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
@media (max-width: 860px) {
  .psim-timeline { left: 10px; transform: none; width: calc(50% - 16px); bottom: 70px; }
  .psim-app .psim-legend { max-width: calc(50% - 16px); }
  .psim-canvaswrap > .psim-timeline { bottom: 12px; }
  .psim-timeline .lab { font-size: 9.5px; }
}
</style>

// ---------------------------------------------------------------- 3D volumes

/**
 * A 3D scalar field (index i + nx·(j + ny·k)) rendered by ray marching through its box.
 * update(values, nx, ny, nz, { range, log }); draw(camera, { box: [[x0,y0,z0],[x1,y1,z1]],
 * colormap, opacity, steps, mode }) with mode 'emission' (glowing gas: colour ∝ density, adds up)
 * or 'absorption' (emission–absorption: nearer matter hides farther). Opacity is a display
 * transfer function, not a physical optical depth unless you derive it from one: say which.
 * smooth: false shows each cell as a uniform block (honest for coarse grids, e.g. a lattice).
 * Smooth volumes are ray-marched at reduced resolution (≤ ~1.5 M rays) and upscaled; pass
 * resolution: 1 (fraction of the layer's pixels per axis) to force full resolution.
 * update(…, { signed: true }) shows a field of either sign (charge density, vorticity, Re ψ): the
 * colour map's middle is zero, colour gives the sign and opacity |value|; range is symmetric,

void main() { vNDC = aXY * 2.0 - 1.0; gl_Position = vec4(vNDC, 0.0, 1.0); }`, `#version 300 es
precision highp float; precision highp sampler3D;

  const vao = gl.createVertexArray(), buf = gl.createBuffer(), tex = gl.createTexture();
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'aXY'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  let ready = false, signed = false;

  const comp = compile(gl, `#version 300 es
in vec2 aXY; out vec2 vUV;
void main() { vUV = aXY; gl_Position = vec4(aXY * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es
precision mediump float;

  gl.bindVertexArray(compVao); gl.bindBuffer(gl.ARRAY_BUFFER, buf);

      gl.uniform1f(u.uOpacity, opacity); gl.uniform1f(u.uSteps, Math.min(1000, steps)); gl.uniform1f(u.uMode, mode === 'emission' ? 0 : 1);

}

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */
function createSphereRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;
void main() {
  vec3 c = (uView * vec4(aCenter, 1.0)).xyz;
  float d = length(c), r = aRadius;
  float s = r * d / sqrt(max(d * d - r * r, 1e-12)) * 1.05;
  vec3 q = c + vec3(aCorner * s, 0.0);

  gl_Position = uProj * vec4(q, 1.0);
}`, `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;
out vec4 frag;
void main() {
  vec3 dir = normalize(vPos);

  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);

      if (!spheres.length) return;

      spheres.forEach((sp, i) => {
        const c = rgb(sp.color ?? '#cfd8e3');
        data.set([sp.center[0] - t[0], sp.center[1] - t[1], sp.center[2] - t[2], sp.radius, c[0], c[1], c[2], sp.emissive ? 1 : 0], 8 * i);
      });
      const { view, proj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight, { relative: true });
      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, inst); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);

      gl.uniform3f(u.uLight, ...lv); gl.uniform1f(u.uPoint, point ? 1 : 0); gl.uniform1f(u.uAmbient, ambient);

    },
  };
}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.
 * Dashed lines are for reference overlays (analytic curves), solid for computed paths.
 */
function createLineRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;

  vec2 off = nrm * aCorner.y * uWidth / uViewport;

precision highp float;

  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 0, 1, 1, -1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);

    const loc = gl.getAttribLocation(p, name);

    draw(camera, { aspect, width = 2, color = '#9fb3c8', opacity = 1, dash = null, depthTest = true } = {}) {

      let n = 0;

            buf[o] = l[i] - t0; buf[o + 1] = l[i + 1] - t1; buf[o + 2] = l[i + 2] - t2;

}

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */

/** Seeded PRNG (mulberry32), uniform in [0, 1). Deterministic for a given seed. */

  if (!(hmax > 0) || (hmax !== Infinity && !Number.isFinite(hmax)) || (h0 != null && !(Number.isFinite(h0) && h0 !== 0))) throw new Error('dopri5: step sizes must be non-zero and finite (hmax may be Infinity)');
  if (!(Number.isSafeInteger(maxSteps) && maxSteps > 0)) throw new Error('dopri5: maxSteps must be a positive integer');
  const n = y0.length, dir = Math.sign(t1 - t0) || 1;
  let t = t0;
  const y = Float64Array.from(y0);
  let h = dir * Math.min(Math.abs(h0 ?? (t1 - t0) / 100), hmax);
  const k = Array.from({ length: 7 }, () => new Float64Array(n));
  const yt = new Float64Array(n), yn = new Float64Array(n);
  let steps = 0, rejected = 0, stopped = false;
  const maxAttempts = 4 * maxSteps;
  k[0].set(f(t, y));
  while (dir * (t1 - t) > 0 && steps < maxSteps && steps + rejected < maxAttempts) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    // This checks floating-point progress, not a dimensional time threshold. A
    // femtosecond step can be perfectly resolvable and still need error control.
    if (h === 0 || t + h === t) throw new Error(`dopri5: step underflow at t = ${t}; cannot meet tolerance`);
    for (let s = 1; s < 7; s++) {
      for (let i = 0; i < n; i++) {
        let acc = y[i];
        for (let j = 0; j < s; j++) acc += h * DP.a[s][j] * k[j][i];
        yt[i] = acc;
      }
      k[s].set(f(t + DP.c[s] * h, yt));
    }
    let err = 0;
    for (let i = 0; i < n; i++) {
      let acc = y[i], e = 0;
      for (let j = 0; j < 7; j++) { acc += h * DP.b[j] * k[j][i]; e += h * DP.e[j] * k[j][i]; }
      yn[i] = acc;
      const sc = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(acc));
      err = Math.max(err, Math.abs(e) / sc);
    }
    if (!Number.isFinite(err)) throw new Error(`dopri5: non-finite derivative or state at t = ${t}`);
    if (err <= 1) {
      t += h; y.set(yn); k[0].set(k[6]); steps++;      // FSAL: k7 of this step = k1 of the next
      if (onStep && onStep(t, y) === false) { stopped = true; break; }
    } else rejected++;
    const fac = err === 0 ? 5 : Math.min(5, Math.max(0.2, 0.9 * Math.pow(err, -0.2)));
    h = dir * Math.min(Math.abs(h * fac), hmax);
  }
  if (!stopped && dir * (t1 - t) > 0) throw new Error(`dopri5: step budget exhausted at t = ${t}, before t = ${t1}`);
  return { t, y, steps, rejected, stopped };
}

// ---------------------------------------------------------------- quadrature

const GL_CACHE = new Map();
/** Gauss–Legendre nodes and weights on [−1, 1] (Newton iteration on P_n). */
function gaussLegendreNodes(n) {
  if (GL_CACHE.has(n)) return GL_CACHE.get(n);
  const x = new Float64Array(n), w = new Float64Array(n);
  for (let i = 0; i < Math.ceil(n / 2); i++) {
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), dp = 0;
    for (let it = 0; it < 100; it++) {
      let p0 = 1, p1 = z;
      for (let k = 2; k <= n; k++) { const p2 = ((2 * k - 1) * z * p1 - (k - 1) * p0) / k; p0 = p1; p1 = p2; }
      const pn = n === 1 ? z : p1, pm = n === 1 ? 1 : p0;
      dp = n * (z * pn - pm) / (z * z - 1);
      const dz = pn / dp;
      z -= dz;
      if (Math.abs(dz) < 1e-16) break;
    }
    x[i] = -z; x[n - 1 - i] = z;
    w[i] = w[n - 1 - i] = 2 / ((1 - z * z) * dp * dp);
  }
  const out = { x, w };
  GL_CACHE.set(n, out);
  return out;
}

/** ∫_a^b f(x) dx with n-point Gauss–Legendre (exact for polynomials of degree 2n−1). */
function gaussLegendre(f, a, b, n = 32) {
  const { x, w } = gaussLegendreNodes(n);
  const m = (b - a) / 2, c = (a + b) / 2;
  let s = 0;
  for (let i = 0; i < n; i++) s += w[i] * f(m * x[i] + c);
  return s * m;
}

/** Adaptive Simpson quadrature to absolute tolerance tol. */
function adaptiveSimpson(f, a, b, tol = 1e-10, maxDepth = 50) {
  const simpson = (fl, fmid, fr, lo, hi) => (hi - lo) / 6 * (fl + 4 * fmid + fr);
  const recurse = (lo, hi, fl, fmid, fr, whole, eps, depth) => {
    const mid = (lo + hi) / 2, lm = (lo + mid) / 2, rm = (mid + hi) / 2;
    const flm = f(lm), frm = f(rm);
    const left = simpson(fl, flm, fmid, lo, mid), right = simpson(fmid, frm, fr, mid, hi);
    if (depth <= 0 || Math.abs(left + right - whole) <= 15 * eps) return left + right + (left + right - whole) / 15;
    return recurse(lo, mid, fl, flm, fmid, left, eps / 2, depth - 1) + recurse(mid, hi, fmid, frm, fr, right, eps / 2, depth - 1);
  };
  const fa = f(a), fb = f(b), fm = f((a + b) / 2);
  return recurse(a, b, fa, fm, fb, simpson(fa, fm, fb, a, b), tol, maxDepth);
}

/** ∫_0^∞ f(x) dx via the substitution x = t/(1−t) and Gauss–Legendre panels. */
function integrateToInfinity(f, { panels = 16, n = 32 } = {}) {
  const g = t => { const x = t / (1 - t); return f(x) / ((1 - t) * (1 - t)); };
  let s = 0;
  for (let p = 0; p < panels; p++) s += gaussLegendre(g, p / panels, (p + 1) / panels, n);   // nodes never hit t = 1
  return s;
}

// ---------------------------------------------------------------- roots

/** Brent's method: root of f in [a, b] where f(a)·f(b) < 0. */
function brent(f, lo, hi, tol = 1e-14, maxIter = 200) {
  let a = lo, b = hi;                      // b: best estimate; a: previous; c: bracket partner
  let fa = f(a), fb = f(b);
  if (fa * fb > 0) throw new Error('brent: root not bracketed');
  let c = a, fc = fa, d = b - a, e = d;
  for (let i = 0; i < maxIter; i++) {
    if (fb * fc > 0) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol1 = 2 * Number.EPSILON * Math.abs(b) + tol / 2, m = (c - b) / 2;
    if (Math.abs(m) <= tol1 || fb === 0) return b;
    if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {
      let p, q, r;
      const s = fb / fa;
      if (a === c) { p = 2 * m * s; q = 1 - s; }
      else { q = fa / fc; r = fb / fc; p = s * (2 * m * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }
      if (p > 0) q = -q; else p = -p;
      if (2 * p < Math.min(3 * m * q - Math.abs(tol1 * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = m; e = d; }
    } else { d = m; e = d; }
    a = b; fa = fb;
    b += Math.abs(d) > tol1 ? d : (m > 0 ? tol1 : -tol1);
    fb = f(b);
  }
  return b;
}

// ---------------------------------------------------------------- special functions

const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

/** ln Γ(x) for x > 0 (Lanczos, g = 7, n = 9; relative error ~1e-15). */
function lgamma(z) {
  if (z <= 0 && Number.isInteger(z)) return Infinity;   // poles of Γ
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  const x = z - 1;
  let a = LANCZOS[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}

function gamma(x) {
  if (x <= 0 && Number.isInteger(x)) return NaN;        // poles of Γ
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}

function factorial(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Error function (Abramowitz–Stegun 7.1.26 is too coarse; this uses a series / continued fraction, |err| < 1e-14). */
function erf(x) {
  const ax = Math.abs(x);
  if (ax > 6) return Math.sign(x);                      // erfc(6) ≈ 2e-17 < double precision near 1
  if (ax < 2.5) {
    let sum = ax, term = ax;
    for (let n = 1; n < 100; n++) {
      term *= -ax * ax / n;
      const add = term / (2 * n + 1);
      sum += add;
      if (Math.abs(add) < 1e-17 * Math.abs(sum)) break;
    }
    return Math.sign(x) * 2 / Math.sqrt(Math.PI) * sum;
  }
  // erfc continued fraction (Lentz)
  let f = ax, C = ax, D = 0;
  for (let n = 1; n < 200; n++) {
    const an = n / 2;
    D = ax + an * D; D = 1 / (D === 0 ? 1e-300 : D);
    C = ax + an / C; if (C === 0) C = 1e-300;
    const delta = C * D;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-16) break;
  }
  const erfc = Math.exp(-ax * ax) / Math.sqrt(Math.PI) / f;
  return Math.sign(x) * (1 - erfc);
}

/**
 * Regularised lower incomplete gamma P(a, x) = γ(a, x)/Γ(a), a > 0, x ≥ 0. Series for x < a + 1,
 * Lentz continued fraction for Q otherwise (Numerical Recipes §6.2), |err| ≈ 1e-14.
 */
function gammaP(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaP: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? gammaSeries(a, x) : 1 - gammaCF(a, x);
}

/** Regularised upper incomplete gamma Q(a, x) = 1 − P(a, x); the χ² upper-tail p-value is Q(dof/2, χ²/2). */
function gammaQ(a, x) {
  if (!(a > 0) || !(x >= 0)) throw new Error(`gammaQ: need a > 0 and x ≥ 0 (got a = ${a}, x = ${x})`);
  return x < a + 1 ? 1 - gammaSeries(a, x) : gammaCF(a, x);
}

function gammaSeries(a, x) {
  if (x === 0) return 0;
  let ap = a, del = 1 / a, sum = del;
  for (let n = 0; n < 1000; n++) {
    ap++; del *= x / ap; sum += del;
    if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
  }
  return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
}

function gammaCF(a, x) {
  if (x === Infinity) return 0;
  const tiny = 1e-300;
  let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
  for (let i = 1; i < 1000; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
    c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-16) break;
  }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}

/** Modified Bessel function of the first kind I_n(x), integer n ≥ 0 (power series; fine for x ≲ 50). */
function besselI(n, x) {
  let term = Math.pow(x / 2, n) / factorial(n), sum = term;
  for (let k = 1; k < 500; k++) {
    term *= (x * x / 4) / (k * (k + n));
    sum += term;
    if (Math.abs(term) < 1e-17 * Math.abs(sum)) break;
  }
  return sum;
}

/**
 * Bessel function of the first kind J_n(x), integer n ≥ 0, any real x. Miller's backward
 * recurrence normalised by J₀ + 2ΣJ₂ₖ = 1: relative accuracy also where J_n is tiny (x ≪ n),
 * absolute accuracy ~1e-15·√(x) for large x. J_n(−x) = (−1)ⁿJ_n(x).
 */
function besselJ(n, x) {
  if (!(Number.isInteger(n) && n >= 0)) throw new Error('besselJ: order must be an integer ≥ 0');
  if (!Number.isFinite(x)) return Number.isNaN(x) ? NaN : 0;     // J_n(±∞) = 0
  if (x < 0) return (n % 2 ? -1 : 1) * besselJ(n, -x);
  if (x === 0) return n === 0 ? 1 : 0;
  const top = Math.max(n, x);
  const m = 2 * Math.ceil((top + 20 + Math.sqrt(60 * top)) / 2);    // even start index well above n and x
  let jp = 0, j = 1e-300, norm = 0, result = 0;
  for (let k = m; k > 0; k--) {
    const jm = (2 * k / x) * j - jp;                                  // J_{k−1} from J_k, J_{k+1}
    jp = j; j = jm;
    if (Math.abs(j) > 1e250) { j *= 1e-250; jp *= 1e-250; norm *= 1e-250; result *= 1e-250; }
    if (k - 1 === n) result = j;
    if ((k - 1) % 2 === 0 && k - 1 > 0) norm += 2 * j;
  }
  return result / (norm + j);
}

/**
 * First `count` positive zeros j_{n,1} < j_{n,2} < … of J_n (integer n ≥ 0): bracketed by a scan
 * finer than the zero spacing (always > π), refined with Brent. Mode frequencies of circular
 * membranes, waveguides and diffraction minima: ω_{n,s} = c·j_{n,s}/R.
 */
function besselJZeros(n, count) {
  if (!(Number.isInteger(n) && n >= 0 && Number.isInteger(count) && count > 0)) throw new Error('besselJZeros: need integers n ≥ 0, count > 0');
  const zeros = [], step = 0.5;
  let a = n === 0 ? 1 : n, fa = besselJ(n, a);                        // j_{n,1} > n for n > 0, j_{0,1} > 2
  while (zeros.length < count) {
    const b = a + step, fb = besselJ(n, b);
    if (fa === 0) zeros.push(a);
    else if (fa * fb < 0) zeros.push(brent(x => besselJ(n, x), a, b, 1e-15));
    a = b; fa = fb;
  }
  return zeros;
}

/**
 * Complete elliptic integral of the first kind K(m) = ∫₀^{π/2} dθ / √(1 − m sin²θ), parameter
 * m = k² < 1, by the arithmetic–geometric mean: K = π / (2 AGM(1, √(1 − m))).
 */
function ellipticK(m) {
  if (!(m < 1)) return m === 1 ? Infinity : NaN;
  let a = 1, b = Math.sqrt(1 - m);
  for (let i = 0; i < 40 && Math.abs(a - b) > 1e-16 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)];
  return Math.PI / (2 * a);
}

/** Generalised Laguerre polynomial L_n^(α)(x) by three-term recurrence. */
function laguerre(n, alpha, x) {
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + alpha - x;
  for (let k = 1; k < n; k++) {
    const l2 = ((2 * k + 1 + alpha - x) * l1 - (k + alpha) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}

/** Associated Legendre P_l^m(x), m ≥ 0, with the Condon–Shortley phase (−1)^m. */
function legendreP(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const s = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * s; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = ((2 * ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/**
 * Fully normalised associated Legendre function P̄_l^m(x) = N_lm P_l^m(x) with
 * N_lm = √((2l+1)/(4π) · (l−m)!/(l+m)!), Condon–Shortley phase included. Uses the standard
 * stable recurrences (no factorials), so it is accurate for large l and m.
 */
function normalizedLegendre(l, m, x) {
  const s = Math.sqrt(Math.max(0, (1 - x) * (1 + x)));
  let pmm = 1 / Math.sqrt(4 * Math.PI);
  for (let i = 1; i <= m; i++) pmm *= -Math.sqrt((2 * i + 1) / (2 * i)) * s;
  if (l === m) return pmm;
  let pm1 = x * Math.sqrt(2 * m + 3) * pmm;
  if (l === m + 1) return pm1;
  let pl = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    const a = Math.sqrt((4 * ll * ll - 1) / (ll * ll - m * m));
    const b = Math.sqrt(((ll - 1) ** 2 - m * m) / (4 * (ll - 1) ** 2 - 1));
    pl = a * (x * pm1 - b * pmm);
    pmm = pm1; pm1 = pl;
  }
  return pl;
}

/**
 * Real (tesseral) spherical harmonic, orthonormal on the sphere.
 * m > 0: √2 P̄_l^m cos(mφ); m < 0: √2 P̄_l^|m| sin(|m|φ); m = 0: P̄_l^0.
 * The Condon–Shortley phase is removed, so p_x ∝ +x, p_y ∝ +y.
 */
function realYlm(l, m, theta, phi) {
  const am = Math.abs(m);
  const P = normalizedLegendre(l, am, Math.cos(theta)) * (am % 2 ? -1 : 1);
  if (m === 0) return P;
  return Math.SQRT2 * P * (m > 0 ? Math.cos(am * phi) : Math.sin(am * phi));
}

/**
 * Complex spherical harmonic Y_l^m(θ, φ) with the Condon–Shortley phase (the quantum-mechanics
 * convention): Y_l^m = P̄_l^|m|(cos θ) e^{imφ} for m ≥ 0 and Y_l^{−m} = (−1)^m conj(Y_l^m).
 * Orthonormal on the sphere; eigenfunctions of L² and L_z. Returns { re, im }.
 */
function complexYlm(l, m, theta, phi) {
  if (!(Number.isInteger(l) && Number.isInteger(m) && l >= 0 && Math.abs(m) <= l)) throw new Error('complexYlm: need integers l ≥ 0, |m| ≤ l');
  const am = Math.abs(m), P = normalizedLegendre(l, am, Math.cos(theta));
  const sign = m < 0 && am % 2 ? -1 : 1;
  return { re: sign * P * Math.cos(m * phi), im: sign * P * Math.sin(m * phi) };
}

/**
 * Radial function R_nl(r) of a hydrogen-like atom (one electron, nuclear charge Z, point nucleus,
 * non-relativistic), normalised so ∫R²r²dr = 1:
 *   R_nl = √((2Z/na₀)³ (n−l−1)!/(2n (n+l)!)) e^{−ρ/2} ρ^l L_{n−l−1}^{(2l+1)}(ρ),  ρ = 2Zr/(na₀).
 * Lengths in units of a₀ unless a0 is given (use the reduced-mass a₀ for exact spectroscopy).
 */
function hydrogenRadial(n, l, r, { Z = 1, a0 = 1 } = {}) {
  if (!(Number.isInteger(n) && Number.isInteger(l) && n >= 1 && l >= 0 && l < n)) throw new Error('hydrogenRadial: need integers n ≥ 1, 0 ≤ l < n');
  const rho = 2 * Z * r / (n * a0);
  const lnNorm = 1.5 * Math.log(2 * Z / (n * a0)) + 0.5 * (lgamma(n - l) - lgamma(n + l + 1) - Math.log(2 * n));
  return Math.exp(lnNorm - rho / 2) * rho ** l * laguerre(n - l - 1, 2 * l + 1, rho);
}

// ---------------------------------------------------------------- linear algebra

/** Solve a tridiagonal system (Thomas algorithm). a: sub, b: diag, c: super, d: rhs. Works for complex via callers. */
function solveTridiagonal(a, b, c, d) {
  const n = b.length, cp = new Float64Array(n), dp = new Float64Array(n), x = new Float64Array(n);
  cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
  for (let i = 1; i < n; i++) {
    const m = b[i] - a[i] * cp[i - 1];
    cp[i] = c[i] / m;
    dp[i] = (d[i] - a[i] * dp[i - 1]) / m;
  }
  x[n - 1] = dp[n - 1];
  for (let i = n - 2; i >= 0; i--) x[i] = dp[i] - cp[i] * x[i + 1];
  return x;
}

/**
 * All eigenvalues and eigenvectors of a real symmetric tridiagonal matrix (implicit QL with
 * Wilkinson shifts; Numerical Recipes "tqli"). diag: n diagonal entries; off: n−1 entries
 * coupling i and i+1. Returns { values, vectors } with vectors[i] the unit eigenvector of
 * values[i] (unsorted). Cost O(n³) with eigenvectors: fine to n ≈ 500 in a browser.
 * { vectors: false } returns eigenvalues only, in O(n²) (n = 10⁴ in ~3 s); for the lowest few use
 * lowestTridiagonal (bisection, O(n) per level).
 */
function eigenTridiagonal(diag, off, { vectors: wantVectors = true } = {}) {
  const n = diag.length;
  if (off.length !== n - 1) throw new Error('eigenTridiagonal: off must have n − 1 entries');
  const d = Float64Array.from(diag), e = new Float64Array(n);
  e.set(off);
  const z = wantVectors ? new Float64Array(n * n) : null;
  if (z) for (let i = 0; i < n; i++) z[i * n + i] = 1;
  for (let l = 0; l < n; l++) {
    let iter = 0, m;
    do {
      for (m = l; m < n - 1; m++) {
        const dd = Math.abs(d[m]) + Math.abs(d[m + 1]);
        if (Math.abs(e[m]) <= Number.EPSILON * dd) break;
      }
      if (m !== l) {
        if (iter++ === 60) throw new Error('eigenTridiagonal: no convergence');
        let g = (d[l + 1] - d[l]) / (2 * e[l]);
        let r = Math.hypot(g, 1);
        g = d[m] - d[l] + e[l] / (g + (g >= 0 ? r : -r));
        let s = 1, c = 1, p = 0, i;
        for (i = m - 1; i >= l; i--) {
          let f = s * e[i];
          const b = c * e[i];
          r = Math.hypot(f, g);
          e[i + 1] = r;
          if (r === 0) { d[i + 1] -= p; e[m] = 0; break; }
          s = f / r; c = g / r;
          g = d[i + 1] - p;
          r = (d[i] - g) * s + 2 * c * b;
          p = s * r;
          d[i + 1] = g + p;
          g = c * r - b;
          if (z) {for (let k = 0; k < n; k++) {
            f = z[k * n + i + 1];
            z[k * n + i + 1] = s * z[k * n + i] + c * f;
            z[k * n + i] = c * z[k * n + i] - s * f;
          }}

      Va[k] = a; Vb[k] = b; Vc[k] = c;
      Pr[k] = Math.cos(m * tau); Pi[k] = -Math.sin(m * tau);
      Cc[k] = Math.cos(r * tau);
      const s = r > 1e-300 ? Math.sin(r * tau) / r : tau;
      Sd[k] = s * d; Sc[k] = s * c;
      E0[k] = m - r; E1[k] = m + r;
      // lower eigenvector: (d + r) g0 + c g1 = 0  or  c g0 + (r − d) g1 = 0 (better conditioned one)
      let g0, g1;
      if (d >= 0) { g0 = c; g1 = -(d + r); } else { g0 = r - d; g1 = -c; }
      const gn = Math.hypot(g0, g1);
      if (gn > 0) { G0[k] = g0 / gn; G1[k] = g1 / gn; } else { G0[k] = 1; G1[k] = 0; }   // exact degeneracy: either
      trans[k] = phi[i] >= Math.PI / 2 ? 1 : 0;
    }
  }
  // kinetic phase per Fourier mode
  const kfreq = (n, h) => Float64Array.from({ length: n }, (_, i) => 2 * Math.PI * (i < n / 2 ? i : i - n) / (n * h));
  const kphi = kfreq(nphi, dphi), kx = kfreq(nx, dx);
  const Tk = new Float64Array(N), Kc = new Float64Array(N), Ks = new Float64Array(N);
  for (let j = 0; j < nx; j++) for (let i = 0; i < nphi; i++) {
    const k = i + nphi * j, T = 0.5 * p.minv * kphi[i] ** 2 + 0.5 * p.omega * kx[j] ** 2;
    Tk[k] = T; Kc[k] = Math.cos(T * dt); Ks[k] = -Math.sin(T * dt);
  }
  // wavefunction (diabatic components)
  const r0 = new Float64Array(N), i0 = new Float64Array(N), r1 = new Float64Array(N), i1 = new Float64Array(N);
  if (init === 'fc' || init.state != null) {
    const state = init === 'fc' ? 1 : init.state, x0 = init === 'fc' ? 0 : (init.x0 ?? 0);
    // φ factor: ground state of ½Ṽ₀(1 − cos φ) with kinetic −(1/2m)∂²φ (x = 0 slice of V₀₀)
    const { states } = stationaryStates1D({ V: Float64Array.from(phi, f => 0.5 * p.V0 * (1 - Math.cos(f))), dx: dphi, count: 1, mass: 1 / p.minv });
    const fphi = states[0];
    // x factor: exact ground state of ½ωx² with kinetic −(ω/2)∂²x (dimensionless), displaced by x0
    const gx = Float64Array.from(xs, x => Math.PI ** -0.25 * Math.exp(-0.5 * (x - x0) ** 2));
    const R = state === 1 ? r1 : r0;
    for (let j = 0; j < nx; j++) for (let i = 0; i < nphi; i++) R[i + nphi * j] = fphi[i] * gx[j];
    let n = 0; for (let k = 0; k < N; k++) n += R[k] * R[k];
    const f = 1 / Math.sqrt(n * dV); for (let k = 0; k < N; k++) R[k] *= f;
  }
  const wr = new Float64Array(N), wi = new Float64Array(N);   // scratch for kinetic energy

  function halfV() {
    for (let k = 0; k < N; k++) {
      const a0 = r0[k], b0 = i0[k], a1 = r1[k], b1 = i1[k], C = Cc[k], sd = Sd[k], sc = Sc[k];
      // u = [C − i(sd σz + sc σx)] ψ
      const u0r = C * a0 + sd * b0 + sc * b1, u0i = C * b0 - sd * a0 - sc * a1;
      const u1r = C * a1 - sd * b1 + sc * b0, u1i = C * b1 + sd * a1 - sc * a0;
      const pr = Pr[k], pi = Pi[k];
      r0[k] = u0r * pr - u0i * pi; i0[k] = u0r * pi + u0i * pr;
      r1[k] = u1r * pr - u1i * pi; i1[k] = u1r * pi + u1i * pr;
    }
  }
  function kinetic(re, im) {
    fftND(re, im, shape);
    for (let k = 0; k < N; k++) { const a = re[k], b = im[k], c = Kc[k], s = Ks[k]; re[k] = a * c - b * s; im[k] = a * s + b * c; }
    fftND(re, im, shape, true);
  }
  const s = {
    t: 0, steps: 0, N, nphi, nx, dphi, dx, dt, phi, xs, shape, r0, i0, r1, i1, E0, E1, G0, G1, trans,
    step() { halfV(); kinetic(r0, i0); kinetic(r1, i1); halfV(); s.t += dt; s.steps++; },
    /** All population observables in one pass. */
    observe() {
      let p0 = 0, p1 = 0, s0 = 0, s1 = 0, s0t = 0, s0c = 0, d1t = 0, d0c = 0, phiS1 = 0, xm = 0;
      for (let k = 0; k < N; k++) {
        const a = r0[k] * r0[k] + i0[k] * i0[k], b = r1[k] * r1[k] + i1[k] * i1[k];
        const gr = G0[k] * r0[k] + G1[k] * r1[k], gi = G0[k] * i0[k] + G1[k] * i1[k], g = gr * gr + gi * gi;
        p0 += a; p1 += b; s0 += g; s1 += a + b - g;
        if (trans[k]) { s0t += g; d1t += b; } else { s0c += g; d0c += a; }
        xm += (a + b) * xs[Math.floor(k / nphi)];
      }
      const f = dV;
      return { P0: p0 * f, P1: p1 * f, S0: s0 * f, S1: s1 * f, transS0: s0t * f, cisS0: s0c * f, trans1: d1t * f, cis0: d0c * f, norm: (p0 + p1) * f, xMean: xm * f, phiS1 };
    },
    /** ⟨H⟩ = ⟨T⟩ + ⟨V⟩ (spectral kinetic energy). */
    energy() {
      let ev = 0;
      for (let k = 0; k < N; k++) {
        const a = r0[k] * r0[k] + i0[k] * i0[k], b = r1[k] * r1[k] + i1[k] * i1[k];
        ev += Va[k] * a + Vb[k] * b + 2 * Vc[k] * (r0[k] * r1[k] + i0[k] * i1[k]);
      }
      let et = 0;
      for (const [re, im] of [[r0, i0], [r1, i1]]) {
        wr.set(re); wi.set(im); fftND(wr, wi, shape);
        for (let k = 0; k < N; k++) et += Tk[k] * (wr[k] * wr[k] + wi[k] * wi[k]);
      }
      return ev * dV + et * dV / N;
    },
    /** Probability density on each adiabatic surface, per grid point (density per rad per unit x). */
    adiabaticDensity(out0 = new Float32Array(N), out1 = new Float32Array(N)) {
      for (let k = 0; k < N; k++) {
        const a = r0[k] * r0[k] + i0[k] * i0[k] + r1[k] * r1[k] + i1[k] * i1[k];
        const gr = G0[k] * r0[k] + G1[k] * r1[k], gi = G0[k] * i0[k] + G1[k] * i1[k], g = gr * gr + gi * gi;
        out0[k] = g; out1[k] = Math.max(0, a - g);
      }
      return [out0, out1];
    },
    /** Largest density within 1 x-unit of the x edges, relative to the peak (wrap-around guard). */
    edgeFraction() {
      let edge = 0, peak = 0; const w = Math.round(1 / dx);
      for (let j = 0; j < nx; j++) for (let i = 0; i < nphi; i++) {
        const k = i + nphi * j, d = r0[k] ** 2 + i0[k] ** 2 + r1[k] ** 2 + i1[k] ** 2;
        if (d > peak) peak = d;
        if ((j < w || j >= nx - w) && d > edge) edge = d;
      }
      return edge / peak;
    },
  };
  return s;
}

// ------------------------------------------------------------------ the page's simulation

const yieldOf = o => o.transS0 / (o.transS0 + o.cisS0);

function createSim(params) {
  const p = { ...params };
  const prop = createPropagator(p);
  const sampleEvery = 8;                                // history row every 8 steps (1.05 fs)
  const hist = { t: [], S1: [], transS0: [], cisS0: [], trans1: [], Y: [], E: [] };
  const o0 = prop.observe(), E0 = prop.energy();
  let last = o0, maxNormErr = 0, maxEnergyErr = 0, lastE = E0, ySum = 0, yN = 0;
  const avgFrom = 500;                                  // fs: time average of the yield over [500, 1000] fs
  const record = () => {
    const o = prop.observe(), E = prop.energy(), tf = prop.t * FS;
    last = o; lastE = E;
    maxNormErr = Math.max(maxNormErr, Math.abs(o.norm - o0.norm) / o0.norm);
    maxEnergyErr = Math.max(maxEnergyErr, Math.abs(E - E0) / Math.abs(E0));
    hist.t.push(tf); hist.S1.push(o.S1); hist.transS0.push(o.transS0); hist.cisS0.push(o.cisS0); hist.trans1.push(o.trans1);
    hist.Y.push(o.transS0 + o.cisS0 > 0.02 ? yieldOf(o) : NaN); hist.E.push(E);
    if (tf >= avgFrom) { ySum += yieldOf(o); yN++; }
  };
  record();
  const tEndUnits = T_END_FS / FS;
  const sim = {
    params: p, prop, hist, E0,
    get t() { return prop.t * FS; },
    get done() { return prop.t >= tEndUnits - 1e-9; },
    step() {
      if (sim.done) return;
      prop.step();
      if (prop.steps % sampleEvery === 0 || sim.done) record();
    },
    get obs() { return last; },
    get yieldAvg() { return yN ? ySum / yN : NaN; },
    get yieldNow() { return last.transS0 + last.cisS0 > 0.02 ? yieldOf(last) : NaN; },
    get energyNow() { return lastE; },
    get maxNormErr() { return maxNormErr; },
    get maxEnergyErr() { return maxEnergyErr; },
    diagnostics() {
      const y = sim.yieldNow, ya = sim.yieldAvg;
      return [
        { key: 'norm', label: 'Norm drift |Δ‖ψ‖²|', value: Math.max(maxNormErr, 1e-16), kind: 'error', good: 1e-11, warn: 1e-9 },
        { key: 'energy', label: 'Energy drift |Δ⟨H⟩/⟨H⟩|', value: Math.max(maxEnergyErr, 1e-16), kind: 'error', good: 1e-4, warn: 1e-3 },
        { key: 'S1', label: 'Excited state P(S₁)', value: last.S1, kind: 'value', text: last.S1.toFixed(3) },
        { key: 'trans', label: 'Photoproduct P(S₀, trans)', value: last.transS0, kind: 'value', text: last.transS0.toFixed(3) },
        { key: 'yield', label: 'Yield trans/(cis + trans) in S₀', value: Number.isFinite(y) ? y : 0, kind: 'value', text: Number.isFinite(y) ? y.toFixed(3) : '', pending: !Number.isFinite(y) },
        { key: 'yavg', label: 'Yield, mean over 500–1000 fs', value: Number.isFinite(ya) ? ya : 0, kind: 'value', text: Number.isFinite(ya) ? ya.toFixed(3) : '', pending: !Number.isFinite(ya) },
        { key: 'E', label: '⟨H⟩ (conserved)', value: lastE, kind: 'value', unit: 'eV', text: `${lastE.toFixed(5)} eV` },
      ];
    },
    state() {
      return { t: sim.t, S1: last.S1, S0: last.S0, P1: last.P1, transS0: last.transS0, cisS0: last.cisS0, trans1: last.trans1, norm: last.norm, energy: lastE, params: p };
    },
    record() {
      return { header: ['t_fs', 'P_S1', 'P_S0_trans', 'P_S0_cis', 'P_diab1_trans', 'yield', 'H_eV'],
        rows: hist.t.map((t, k) => [t, hist.S1[k], hist.transS0[k], hist.cisS0[k], hist.trans1[k], hist.Y[k], hist.E[k]]) };
    },
  };
  return sim;
}

// ------------------------------------------------------------------ verification

const defaults = () => Object.fromEntries(PARAMS.map(q => [q.key, q.value]));
// tUnits must be a whole multiple of every Δt compared, or the runs end at different times
// and the global phase e^{−i⟨H⟩Δt} dominates ‖Δψ‖.
const run = (p, opts, tUnits) => {
  const s = createPropagator(p, opts), n = Math.round(tUnits / s.dt);
  if (Math.abs(n * s.dt - tUnits) > 1e-9) throw new Error('run: end time not a multiple of Δt');
  for (let k = 0; k < n; k++) s.step();
  return s;
};
const diffNorm = (a, b) => {                 // ‖ψa − ψb‖ on a common grid
  let d = 0; for (let k = 0; k < a.N; k++) d += (a.r0[k] - b.r0[k]) ** 2 + (a.i0[k] - b.i0[k]) ** 2 + (a.r1[k] - b.r1[k]) ** 2 + (a.i1[k] - b.i1[k]) ** 2;
  return Math.sqrt(d * a.dphi * a.dx);
};
/** Run to tFs and return the time series of yield-related observables (sampled every ~1 fs). */
function trajectory(p, opts, tFs) {
  const s = createPropagator(p, opts), n = Math.round(tFs / FS / s.dt), every = Math.max(1, Math.round(1 / FS / s.dt)), series = [];
  for (let k = 1; k <= n; k++) { s.step(); if (k % every === 0) series.push({ t: s.t * FS, ...s.observe() }); }
  return { s, series };
}
const avgYield = (series, t0) => { const w = series.filter(o => o.t >= t0); return w.reduce((a, o) => a + yieldOf(o), 0) / w.length; };

function verify({ log } = {}) {
  const P = defaults(), checks = [], notes = [];
  const t0 = Date.now(), el = () => `${((Date.now() - t0) / 1000).toFixed(0)} s`;

  // 1. Production run: norm, energy, populations, yield, diabatic vs adiabatic, edges.
  log?.('production run to 1000 fs (512 × 64, Δt = 0.2 ħ/eV)');
  const prod = createPropagator(P), nEnd = Math.round(T_END_FS / FS / DT), every = Math.round(1 / FS / DT);
  const n0 = prod.observe().norm, H0 = prod.energy();
  let maxN = 0, maxE = 0, maxEdge = 0, maxSum = 0, maxDiabAd = 0, boundViol = -Infinity, boundAt = 0;
  // |ψ₁|² − |⟨S₀|ψ⟩|² = s²(|ψ₁|² − |ψ₀|²) − 2sc Re(ψ₀*ψ₁) with S₀ = (s, c): bounded by (s² + |s|)|ψ|²
  const mixBound = () => {
    let b = 0;
    for (let k = 0; k < prod.N; k++) if (prod.trans[k]) { const sg = Math.abs(prod.G0[k]); b += (sg * sg + sg) * (prod.r0[k] ** 2 + prod.i0[k] ** 2 + prod.r1[k] ** 2 + prod.i1[k] ** 2); }
    return b * prod.dphi * prod.dx;
  };
  const series = [];
  for (let k = 1; k <= nEnd; k++) {
    prod.step();
    if (k % every === 0) {
      const o = prod.observe(); series.push({ t: prod.t * FS, ...o });
      maxN = Math.max(maxN, Math.abs(o.norm - n0));
      maxSum = Math.max(maxSum, Math.abs(o.S0 + o.S1 - o.P0 - o.P1));
      if (prod.t * FS >= 300 && k % (every * 10) === 0) {
        const dd = Math.abs(o.transS0 - o.trans1), bb = mixBound();
        if (dd > maxDiabAd) { maxDiabAd = dd; boundAt = bb; }
        boundViol = Math.max(boundViol, dd - bb);
      }
      if (k % (every * 20) === 0) { maxE = Math.max(maxE, Math.abs(prod.energy() - H0) / H0); maxEdge = Math.max(maxEdge, prod.edgeFraction()); }
    }
  }
  log?.(`  done (${el()})`);
  const at = tf => series.reduce((b, o) => (Math.abs(o.t - tf) < Math.abs(b.t - tf) ? o : b));
  const fc = createPropagator(P).observe();
  checks.push({ label: 'Franck–Condon start: all population on S₁ (adiabatic) at t = 0', value: `P(S₁) = ${fc.S1.toFixed(6)}`, pass: fc.S1 > 0.99 && Math.abs(fc.norm - 1) < 1e-10 });
  const budget = Math.sqrt(nEnd) * 1e-15 * Math.sqrt(prod.N);
  checks.push({ label: `Norm conserved over ${nEnd} steps (unitary split operator, no absorber)`, value: `max |Δ‖ψ‖²| = ${maxN.toExponential(1)} (round-off budget ${budget.toExponential(1)})`, pass: maxN < 10 * budget });
  checks.push({ label: 'Energy ⟨H⟩ conserved (closed system, no dissipation), checked every 20 fs', value: `max |Δ⟨H⟩/⟨H⟩| = ${maxE.toExponential(1)}, ⟨H⟩ = ${H0.toFixed(4)} eV`, pass: maxE < 1e-3 });
  checks.push({ label: 'Adiabatic and diabatic total populations agree (local rotation is unitary)', value: `max |ΣP_adiab − ΣP_diab| = ${maxSum.toExponential(1)}`, pass: maxSum < 1e-12 });
  checks.push({ label: 'Product in the trans region, adiabatic S₀ vs diabatic |1⟩ (t ≥ 300 fs): difference within the mixing-angle bound ∫(s² + |s|)|ψ|²', value: `max |ΔP| = ${maxDiabAd.toFixed(3)} (bound there ${boundAt.toFixed(3)})`, pass: boundViol <= 1e-12 });
  // the projection itself: S₀ vector is the lower eigenvector of V at every grid point
  let res = 0;
  for (let k = 0; k < prod.N; k++) {
    const i = k % prod.nphi, j = Math.floor(k / prod.nphi), { a, b, c } = potential(P, prod.phi[i], prod.xs[j]), g0 = prod.G0[k], g1 = prod.G1[k];
    res = Math.max(res, Math.abs(a * g0 + c * g1 - prod.E0[k] * g0), Math.abs(c * g0 + b * g1 - prod.E0[k] * g1));
  }
  checks.push({ label: 'Adiabatic projector: (V − E_S₀)|S₀⟩ = 0 at every grid point', value: `max residual ${res.toExponential(1)} eV`, pass: res < 1e-12 });
  checks.push({ label: 'Packet never reaches the x edges of the periodic box', value: `max edge density / peak = ${maxEdge.toExponential(1)}`, pass: maxEdge < 1e-6 });

  // timescale: S1 decay and product appearance
  const half = series.find(o => o.S1 < 0.5), rise = series.find(o => o.transS0 > 0.3);
  checks.push({ label: 'S₁ population first falls below 1/2 (literature: product within ~200 fs)', value: `t = ${half ? half.t.toFixed(0) : '>1000'} fs`, pass: !!half && half.t < 300 });
  const yAvg = avgYield(series, 500);
  const y200 = yieldOf(at(200));
  checks.push({ label: 'Yield trans/(cis + trans) in S₀, mean over 500–1000 fs vs Hahn & Stock 0.63 (model) and 0.65 ± 0.01 (measured, Kim et al. 2001)', value: `Y = ${yAvg.toFixed(3)} (Y(200 fs) = ${y200.toFixed(3)})`, pass: Number.isFinite(yAvg), state: Math.abs(yAvg - 0.63) < 0.1 ? undefined : 'warn' });

  // 2. Single-surface limits against exact harmonic dynamics of the coupling mode.
  log?.(`single-surface limits (${el()})`);
  const free = { ...P, lambda: 0 };
  {
    // Strang splitting shifts the oscillator frequency by O((ωΔt)²): the error must fall 4× when Δt halves
    const errAt = h => {
      const s = createPropagator(free, { init: { state: 0, x0: 2 }, dt: h }), n = Math.round(228 / h);
      let err = 0;
      for (let k = 1; k <= n; k++) { s.step(); if (k % Math.round(4 / h) === 0) err = Math.max(err, Math.abs(s.observe().xMean - 2 * Math.cos(free.omega * s.t))); }
      return err;
    };
    const eA = errAt(DT), eB = errAt(DT / 2), ord = Math.log2(eA / eB);
    checks.push({ label: 'λ = 0, ground surface: ⟨x⟩(t) = x₀ cos ωt (exact, separable harmonic mode), 150 fs, Δt and Δt/2', value: `max |Δ⟨x⟩| = ${eA.toExponential(1)} → ${eB.toExponential(1)} (order ${ord.toFixed(2)}, x₀ = 2)`, pass: eA < 1e-2 && Math.abs(ord - 2) < 0.3 });
  }
  {
    const s = createPropagator(free, { init: { state: 1, x0: 0 } }), n = Math.round(150 / FS / DT), k0 = free.kappa / free.omega;
    let err = 0, leak = 0;
    for (let k = 1; k <= n; k++) { s.step(); if (k % 20 === 0) { const o = s.observe(); err = Math.max(err, Math.abs(o.xMean + k0 * (1 - Math.cos(free.omega * s.t)))); leak = Math.max(leak, o.P0); } }
    checks.push({ label: 'λ = 0, excited surface: ⟨x⟩(t) = −(κ/ω)(1 − cos ωt) and no transfer to |0⟩', value: `max |Δ⟨x⟩| = ${err.toExponential(1)}, max P₀ = ${leak.toExponential(1)}`, pass: err < 5e-3 && leak < 1e-12 });
  }
  {
    // Same single-surface problem with core/fields schrodingerND (independent implementation,
    // isotropic mass only): with y = x·√(m⁻¹/ω), −(ω/2)∂²x = −(m⁻¹/2)∂²y, so mass = m on both axes.
    const s = createPropagator(free, { init: { state: 0, x0: 2 } }), sc = Math.sqrt(free.minv / free.omega);
    const V = new Float64Array(s.N);
    for (let j = 0; j < s.nx; j++) for (let i = 0; i < s.nphi; i++) V[i + s.nphi * j] = potential(free, s.phi[i], s.xs[j]).a;
    const ref = schrodingerND({ re0: s.r0, im0: s.i0, V, shape: s.shape, spacing: [s.dphi, s.dx * sc], dt: DT, mass: 1 / free.minv });
    const n = Math.round(100 / FS / DT);
    for (let k = 0; k < n; k++) { s.step(); ref.step(); }
    let d = 0; for (let k = 0; k < s.N; k++) d += (s.r0[k] - ref.re[k]) ** 2 + (s.i0[k] - ref.im[k]) ** 2;
    d = Math.sqrt(d * s.dphi * s.dx);
    checks.push({ label: 'λ = 0 ground surface vs core schrodingerND (independent code, same Strang scheme), 100 fs', value: `‖Δψ‖ = ${d.toExponential(1)}`, pass: d < 1e-9 });
  }

  // 3. Time-step refinement (fixed grid) at 150 fs, while the packet passes the intersection.
  log?.(`time-step refinement (${el()})`);
  const T_REF = 228;                       // ħ/eV = 150.07 fs, divisible by every Δt below
  const dts = [0.4, 0.2, 0.1, 0.05].map(h => run(P, { dt: h }, T_REF));
  const e1 = diffNorm(dts[0], dts[3]), e2 = diffNorm(dts[1], dts[3]), e3 = diffNorm(dts[2], dts[3]);
  const order = Math.log2((diffNorm(dts[0], dts[1])) / diffNorm(dts[1], dts[2]));
  const prodErr = Math.abs(dts[1].observe().transS0 - dts[3].observe().transS0);
  checks.push({ label: 'Δt refinement at 150 fs (same end time): ‖ψ(Δt) − ψ(0.05)‖ for Δt = 0.4, 0.2, 0.1 ħ/eV', value: `${e1.toExponential(1)}, ${e2.toExponential(1)}, ${e3.toExponential(1)}; order ${order.toFixed(2)}`, pass: Math.abs(order - 2) < 0.3 && e2 < 2e-2 });
  checks.push({ label: 'Production Δt = 0.2 ħ/eV (0.13 fs): error in P(S₀, trans) at 150 fs', value: prodErr.toExponential(1), pass: prodErr < 2e-3 });

    const yl = scan.filter(s => s.label.startsWith('λ')).map(s => [s.lambda, s.yield]);
    const ym = scan.filter(s => s.label.startsWith('1/m')).map(s => [s.minv / d.minv, s.yield]);
    if (prod) { yl.push([d.lambda, prod.yieldAvg]); ym.push([1, prod.yieldAvg]); }
    yl.sort((a, b) => a[0] - b[0]); ym.sort((a, b) => a[0] - b[0]);
    scanL.data('y', yl, { color: '--body-0', dots: true, label: 'computed' }).hline('m', 0.65, { label: 'measured 0.65', dash: [4, 4] });
    scanM.data('y', ym, { color: '--body-1', dots: true, label: 'computed' }).hline('m', 0.65, { label: 'measured 0.65', dash: [4, 4] });
    const j = scan.find(s => s.label.startsWith('Johnson'));
    if (j) scanL.marker('j', j.lambda, j.yield, { label: 'Johnson set' });
    scanL.draw(); scanM.draw();
  }
  // the Hamiltonian, term by term (values at the conical intersection and at the current mean)
  let cur = null;
  const ph = M.i('φ'), x = M.i('x');
  const eq = createEquation({
    title: 'Diabatic potential matrix V(φ, x): the excited diabat at the Franck–Condon point, term by term',
    lhs: { mathml: M.sub(M.i('V'), M.n('11')), label: 'excited diabat |1⟩ at φ = 0', unit: 'eV', value: () => cur?.E1 ?? 0 },
    terms: [
      { id: 'e1', mathml: M.sub(M.i('E'), M.n(1)), label: 'vertical excitation', color: '--warn', unit: 'eV', value: () => cur?.E1 ?? 0 },
      { id: 'tor', sign: '−', mathml: `${M.frac(M.sub(M.i('Ṽ'), M.n(1)), M.n(2))}${M.paren(`<mn>1</mn><mo>−</mo><mi>cos</mi>${ph}`)}`, label: 'torsional slope (downhill on S₁)', color: '--body-0', unit: 'eV at φ = 90°', value: () => (cur?.V1 ?? 0) / 2 },
      { id: 'osc', sign: '+', mathml: `${M.frac(M.i('ω'), M.n(2))}${M.sup(x, M.n(2))}<mo>+</mo>${M.i('κ')}${x}`, label: 'coupling mode, displaced by κ', color: '--body-1', unit: 'eV at x = 1', value: () => (cur ? cur.omega / 2 + cur.kappa : 0) },
    ],
    where: [
      { mathml: `${M.sub(M.i('V'), M.n('00'))}<mo>=</mo>${M.frac(M.sub(M.i('Ṽ'), M.n(0)), M.n(2))}${M.paren(`<mn>1</mn><mo>−</mo><mi>cos</mi>${ph}`)}<mo>+</mo>${M.frac(M.i('ω'), M.n(2))}${M.sup(x, M.n(2))}`, meaning: 'ground diabat |0⟩: barrier Ṽ₀ at φ = 180°', value: () => cur?.V0 ?? 0, unit: 'eV' },
      { mathml: `${M.sub(M.i('V'), M.n('01'))}<mo>=</mo>${M.i('λ')}${x}`, meaning: 'coupling: zero at x = 0, so the surfaces touch there (the cone)', value: () => cur?.lambda ?? 0, unit: 'eV' },
      { mathml: `${M.i('T')}<mo>=</mo><mo>−</mo>${M.frac(M.n(1), `<mn>2</mn>${M.i('m')}`)}${M.frac(`<msup><mo>∂</mo><mn>2</mn></msup>`, `<mo>∂</mo>${M.sup(ph, M.n(2))}`)}<mo>−</mo>${M.frac(M.i('ω'), M.n(2))}${M.frac(`<msup><mo>∂</mo><mn>2</mn></msup>`, `<mo>∂</mo>${M.sup(x, M.n(2))}`)}`, meaning: 'kinetic energy, 1/m (torsion)', value: () => cur?.minv ?? 0, unit: 'eV' },
      { mathml: `${M.sub(ph, M.i('CI'))}`, meaning: 'conical intersection (V₀₀ = V₁₁ at x = 0)', value: () => (cur ? deg(intersection(cur)[0] ?? NaN) : 0), unit: '°' },
    ],
    note: 'Split operator: e^{−iVΔt/2} is applied as the exact exponential of this 2×2 matrix at each grid point; e^{−iTΔt} in Fourier space.',
  });
  eqs.append(eq.el);
  const btns = document.createElement('div'); btns.className = 'psim-btns';
  for (const [key, set] of Object.entries(SETS)) {
    const b = document.createElement('button'); b.textContent = `Load ${set.label}`;
    b.onclick = () => setParams({ lambda: set.lambda, minv: set.minv, E1: set.E1, V0: set.V0, V1: set.V1, kappa: set.kappa, omega: set.omega }, { play: true });
    btns.append(b);
  }
  eqs.append(btns);
  let lastN = -1, lastSim = null;
  return {
    update(sim) {
      cur = sim.params; eq.update();
      const h = sim.hist;
      if (sim !== lastSim) {
        lastSim = sim; lastN = -1;
        for (const plot of [pop, yld]) { plot.remove('bS1'); plot.remove('bTr'); }
        if (prod && isDefault(sim)) {
          pop.data('bTr', prod.series.map(r => [r[0], r[1]]), { color: COL.trans, alpha: 0.3 });
          pop.data('bS1', prod.series.map(r => [r[0], r[2]]), { color: COL.S1, alpha: 0.3 });
        }
      }
      if (h.t.length === lastN) return;
      lastN = h.t.length;
      const ser = arr => h.t.map((t, k) => [t, arr[k]]);
      pop.data('S1', ser(h.S1), { color: COL.S1, label: 'P(S₁) excited' })
        .data('tr', ser(h.transS0), { color: COL.trans, label: 'P(S₀, trans) product' })
        .data('cis', ser(h.cisS0), { color: COL.cis, label: 'P(S₀, cis) back to start' })
        .data('d1', ser(h.trans1), { color: COL.trans, dash: [4, 4], label: 'diabatic |1⟩, trans' });
      pop.draw();
      yld.data('Y', ser(h.Y).filter(r => Number.isFinite(r[1])), { color: COL.trans, label: 'computed yield' });
      if (Number.isFinite(sim.yieldAvg)) { yld.hline('avg', sim.yieldAvg, { label: '' }); yld.marker('avgm', 260, sim.yieldAvg, { label: `mean 500–1000 fs: ${sim.yieldAvg.toFixed(3)}` }); } else { yld.remove('avg'); yld.remove('avgm'); }
      yld.draw();
      en.data('E', h.t.map((t, k) => [t, (h.E[k] - h.E[0]) * 1e3]), { color: '--body-2', label: 'Δ⟨H⟩' });
      en.draw();
    },
  };
}

createInstrument({
  title: 'The first step of vision: light twists retinal through a conical intersection',
  subtitle: 'Two-state, two-mode Hahn–Stock model of 11-cis → all-trans retinal in rhodopsin · exact 2×2 split-operator wave packet (reduced model, not ab initio)',
  tier: 'approximate',
  tierReason: 'The quantum dynamics of the stated two-mode model is solved to verified accuracy (norm, energy, exact limits, Δt and grid convergence), but the model itself is a reduced fit with two coordinates and no protein bath; its parameters were checked against secondary tabulations only.',
  params: PARAMS, create: createSim, gl: true, drawGL, draw, layout: 'workbench', bench,
  timeline: {
    duration: () => (longRun ? T_END_FS : T_EVENT),
    markers: (sim, v) => [
      ...(isDefault(v) && BUILD?.production?.tHalf ? [{ t: BUILD.production.tHalf, label: 'S₁ population halves (computed)', short: 'S₁ half-life', kind: 'computed' }] : []),
      { t: 200, label: 'photorhodopsin ≈ 200 fs (measured, Schoenlein 1991; the requested timescale)', short: 'photorhodopsin (measured)', kind: 'measured' },
      ...(longRun ? [{ t: 500, label: 'yield average from here (computed)', kind: 'computed' }] : []),
    ],
    note: () => (longRun ? '300–1000 fs: the hot ground-state packet keeps recrossing (no bath); the yield is averaged over 500–1000 fs.' : 'Run covers the isomerisation (≈ 200 fs). View → “Long run” continues to 1000 fs for the long-time yield.'),
  },
  timeUnit: 'fs', timeLabel: 'time after the photon', timeDigits: 1, speed: 12, speedRange: [1, 200], duration: T_END_FS, frameBudget: 12,
  hudLine: sim => `P(S₁) ${sim.obs.S1.toFixed(2)} · trans ${sim.obs.transS0.toFixed(2)} · cis ${sim.obs.cisS0.toFixed(2)}`,
  presets: [
    { label: 'Hahn & Stock 2000', values: { lambda: SETS.hs2000.lambda, minv: SETS.hs2000.minv, E1: SETS.hs2000.E1, V0: SETS.hs2000.V0, V1: SETS.hs2000.V1, kappa: SETS.hs2000.kappa, omega: SETS.hs2000.omega }, play: true },
    { label: 'Johnson 2017 (faster torsion)', values: { lambda: SETS.johnson2017.lambda, minv: SETS.johnson2017.minv, E1: SETS.johnson2017.E1, V0: SETS.johnson2017.V0, V1: SETS.johnson2017.V1, kappa: SETS.johnson2017.kappa, omega: SETS.johnson2017.omega }, play: true },
    { label: 'Strong coupling λ = 0.3 eV', values: { lambda: 0.3 }, play: true },
  ],
  onPointer(canvas) { cam.attach(canvas); },
  onFit(view) { cam.fit(BOX, view.W / view.H, 0.95); },
  viewControls(body, { toggle, select, slider }) {
    body.append(toggle('Long run to 1000 fs (long-time yield average)', longRun, v => { longRun = v; window.psim.restart(); }));
    body.append(toggle('Density as height bump', view3.lift, v => { view3.lift = v; }));
    body.append(slider({ label: 'Bump height', min: 0.1, max: 1.2, value: view3.liftScale, digits: 2, onInput: v => { view3.liftScale = v; } }));
    body.append(select([{ value: 'inferno', label: 'inferno' }, { value: 'viridis', label: 'viridis' }, { value: 'magma', label: 'magma' }], view3.map, v => { view3.map = v; }));
  },
  model: {
    legend: [
      'Height = computed energy of S₀ (blue) and S₁ (amber) over torsion φ and mode x',
      'Colour and bump = √ wave-packet density on each surface (bump is not energy)',
    ],
    equations: [],
    assumptions: [
      'Reduced model: two electronic states and two nuclear coordinates (torsion φ and one coupling/tuning mode x) stand in for a 3N-dimensional chromophore in a protein. Parameters are fitted to reproduce rhodopsin’s spectra and timescales (Hahn & Stock 2000), not computed ab initio.',
      'Closed system: no protein/solvent bath, so no vibrational cooling. The hot ground-state wave packet can recross the barrier, so the yield keeps oscillating instead of settling; the page shows its 500–1000 fs mean.',
      'Sudden (δ-pulse) Condon excitation: the ground vibrational state of |0⟩ is placed on |1⟩ at t = 0. Real experiments use finite pulses and a thermal, inhomogeneously broadened ensemble.',
      'Cis = |φ| < 90°, trans = 90°…270° (Tscherbul & Brumer’s convention). Adiabatic populations are local projections onto the eigenvectors of V; the derivative couplings act in the dynamics.',
      'Grid 512 (φ, periodic) × 64 (x ∈ [−9, 9), periodic box; the density never reaches the edges, measured). Δt = 0.2 ħ/eV = 0.13 fs. The page runs the same calculation live; the build-time report repeats it in Node.',
    ],
    conventions: [
      'ħ = 1, energies in eV, time unit ħ/eV = 0.658 fs; displayed time is in fs after an instantaneous excitation.',
      'World axes: 1 unit per radian of φ; x scaled × 0.4; energy × 0.75. Only |x| ≤ 5 is drawn.',
      'Density colour/bump uses a square-root transfer and is renormalised every frame; it shows where the packet is, not absolute probability.',
      'The molecule drawing is a cartoon of the C10–C11=C12–C13 fragment; only its opacities (the computed cis, S₁ and trans populations) are data.',
    ],
    references: [
      'S. Hahn & G. Stock, “Quantum-mechanical modeling of the femtosecond isomerization in rhodopsin”, J. Phys. Chem. B 104, 1146 (2000): the model (original not retrieved; parameters from the tabulations below).',
      'T. V. Tscherbul & P. Brumer, J. Phys. Chem. A 118, 3100 (2014), arXiv:1402.4214: parameter table, cis/trans projectors, Y_TD = 0.63, measured 0.65 ± 0.01.',
      'C. Chuang & P. Brumer, arXiv:2011.14342 and arXiv:2202.00533: the Johnson et al. 2017 parameter update and the sensitivity of the yield to 1/m.',
      'R. W. Schoenlein et al., Science 254, 412 (1991): photoproduct formed within 200 fs.',
      'D. Polli et al., Nature 467, 440 (2010): conical-intersection dynamics observed directly.',
      'J. E. Kim, M. J. Tauber & R. A. Mathies, Biochemistry 40, 13774 (2001): quantum yield 0.65 (wavelength-independent).',
    ],
  },
});
window.psim.fit = () => { const v = document.querySelector('canvas.psim-gl'); if (v) cam.fit(BOX, v.clientWidth / v.clientHeight, 0.95); };

</script>
