<!doctype html>
<html lang="en" data-theme="dark">
<head>

<title>Double slit, one electron at a time</title>
<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */

      else insets.bottom = Math.max(insets.bottom, c.height - o.y);
    }
    overlayCache = { at: now, list, insets };
    return overlayCache;
  }

  let benchApi = null;
  // ------------------------------------------------------------ timeline: the run's span and its key times
  // spec.timeline = { duration, markers: [{ t, label, kind: 'computed' | 'measured' | 'requested' }], note }
  // (each may also be a function of the sim). The run stops exactly at `duration`; markers are drawn
  // on a bar under the time readout; clicking the bar jumps to that time (recomputing if earlier).
  let tl = null;
  const tlEl = $('.psim-timeline');
  if (benchParts) benchParts.wrap.append(tlEl);              // inside the scene card in the workbench layout
  const secTimeline = timelineSpec ? section(texts.timeline ?? 'Timeline', { aside: 'key times' }) : null;
  const shortLabel = m => m.short ?? m.label.replace(/\s*\(.*$/, '').slice(0, 28);
  function resolveTimeline() {
    if (!timelineSpec) { tl = null; tlEl.hidden = true; return; }
    const val = v => (typeof v === 'function' ? v(sim, values) : v);
    // the run spans [start, duration] on the page's own clock: start = the sim's initial time (0 usually;
    // e.g. −1 for a log₁₀ clock); duration is the END time on that clock
    const start = Number.isFinite(+val(timelineSpec.start)) ? +val(timelineSpec.start) : (sim.t ?? 0);
    const duration = +val(timelineSpec.duration);
    if (!(duration > start)) throw new Error(`timeline.duration (the end time) must be later than the start ${start}`);
    const span = duration - start, tol = 1e-9 * Math.max(Math.abs(duration), span);
    const markers = (val(timelineSpec.markers) ?? []).filter(m => Number.isFinite(m.t));
    for (const m of markers) if (m.t < start - tol || m.t > duration + tol) throw new Error(`timeline marker "${m.label}" at ${m.t} lies outside the run ${start}…${duration}`);
    tl = { start, duration, markers, note: val(timelineSpec.note) ?? '' };
    tlEl.hidden = false;
    const fmt = t => (formatTime ? formatTime(t) : `${+t.toPrecision(4)} ${timeUnit}`);
    // the bar: one tick per key time, short labels above (staggered when close), full text as a tooltip
    const bar = tlEl.querySelector('.bar'), ticks = tlEl.querySelector('.ticks');
    bar.querySelectorAll('.m').forEach(e => e.remove());
    ticks.replaceChildren(...markers.slice().sort((a, b) => a.t - b.t).map(m => {
      const x = 100 * (m.t - start) / span;
      bar.append(el('span', { class: `m ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%`, title: `${m.label}: ${fmt(m.t)}` }));
      const sl = shortLabel(m), withTime = /\d/.test(sl) ? sl : `${sl} · ${fmt(m.t)}`;   // no repeated time
      // near the ends, anchor the label at its tick instead of centring it (never clipped by the bar's edges)
      const anchor = x < 15 ? 'translateX(0)' : x > 85 ? 'translateX(-100%)' : 'translateX(-50%)';
      return el('span', { class: `lab ${m.kind ?? 'computed'}`, style: `left:${x.toFixed(3)}%;transform:${anchor}`, title: `${m.label}: ${fmt(m.t)}` }, withTime);
    }));
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.textContent = fmt(start); b.textContent = `${fmt(duration)} (end)`;
    layoutTimelineLabels();
    // the side panel lists every key time in full, with its kind, and the note
    if (secTimeline) {
      const kinds = { computed: 'computed in this model', measured: 'measured (literature)', requested: 'named in the request' };
      secTimeline.body.replaceChildren(
        row('run', `${fmt(start)} – ${fmt(duration)}`),
        ...markers.map(m => el('div', { class: 'psim-tlrow' }, el('i', { class: m.kind ?? 'computed' }), el('span', {}, m.label), el('code', {}, fmt(m.t)), el('small', {}, kinds[m.kind ?? 'computed']))),
        tl.note ? el('p', { class: 'psim-hint' }, tl.note) : null);
    }
  }
  // Labels are placed by their measured widths: each goes in the lowest of three rows where it does
  // not touch another label; one that fits nowhere is hidden (its tick keeps the tooltip, and the
  // side panel lists every key time). Rerun when the bar changes size (phone, full screen).
  const TL_ROWS = 3, TL_ROW_H = 13, TL_GAP = 6;
  function layoutTimelineLabels() {
    if (!tl || tlEl.hidden) return;
    const labs = [...tlEl.querySelectorAll('.ticks .lab')];
    labs.forEach(l => { l.style.bottom = '2px'; l.style.visibility = ''; l.classList.remove('hid'); });
    const box = tlEl.querySelector('.ticks').getBoundingClientRect();
    if (!(box.width > 0)) return;
    const rows = Array.from({ length: TL_ROWS }, () => []);
    let used = labs.length ? 1 : 0;
    for (const l of labs) {
      const r = l.getBoundingClientRect(), lo = Math.max(r.left, box.left), hi = Math.min(r.right, box.right);
      const k = rows.findIndex(slots => slots.every(([a, b]) => hi + TL_GAP <= a || lo >= b + TL_GAP));
      if (k < 0) { l.style.visibility = 'hidden'; l.classList.add('hid'); continue; }
      rows[k].push([lo, hi]); used = Math.max(used, k + 1);
      l.style.bottom = `${2 + k * TL_ROW_H}px`;
    }
    tlEl.querySelector('.ticks').style.height = `${4 + used * TL_ROW_H}px`;
    // the two end labels: drop the start when they would touch
    const [a, b] = tlEl.querySelectorAll('.ends span');
    a.style.visibility = '';
    if (a.getBoundingClientRect().right + TL_GAP > b.getBoundingClientRect().left) a.style.visibility = 'hidden';
  }
  new ResizeObserver(() => layoutTimelineLabels()).observe(tlEl);

  tlEl.querySelector('.bar').addEventListener('click', e => {
    if (!tl) return;
    const r = e.currentTarget.getBoundingClientRect(), T = tl.start + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (tl.duration - tl.start);
    if (T < tDisplay) rebuild();
    window.psim.advanceTo(T);
  });

  function rebuild() {
    sim = create({ ...values });
    tDisplay = sim.t ?? 0;
    resolveTimeline();
    diagPlot.clear();
    renderDiag(true);
    benchApi?.update?.(sim, tDisplay, { rebuilt: true });
    status.set('params', values);
  }

  // ------------------------------------------------------------ full screen
  // The scene (canvas, HUD, legend) and the playback bar fill the screen. Falls back to filling the
  // window with CSS where the Fullscreen API is missing or refused (iPhone Safari, sandboxed frames).
  const scene = benchParts?.wrap ?? stage;
  let pseudoFs = false, fsBtn = null;
  const fsElement = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
  const isFullscreen = () => pseudoFs || fsElement() === scene;
  function afterFullscreen() {
    const on = isFullscreen();
    scene.classList.toggle('psim-fs', on);
    if (tp) { if (on && tp.parentNode !== scene) scene.append(tp); else if (!on && tp.parentNode !== stage) stage.append(tp); tp.setFullscreen(on); }
    if (fsBtn) fsBtn.innerHTML = on ? ICONS.exitFullscreen : ICONS.fullscreen;
    requestAnimationFrame(() => spec.onFit?.(view));
  }
  function setPseudo(on) { pseudoFs = on; scene.classList.toggle('psim-pseudo-fs', on); afterFullscreen(); }
  function toggleFullscreen() {
    if (isFullscreen()) {
      if (pseudoFs) setPseudo(false);
      else (document.exitFullscreen ?? document.webkitExitFullscreen)?.call(document);
      return;
    }
    const request = scene.requestFullscreen ?? scene.webkitRequestFullscreen;
    if (!request) { setPseudo(true); return; }
    try { Promise.resolve(request.call(scene)).catch(() => setPseudo(true)); } catch { setPseudo(true); }
  }
  addEventListener('fullscreenchange', afterFullscreen);
  addEventListener('webkitfullscreenchange', afterFullscreen);

  // ------------------------------------------------------------ transport
  const timeDependent = spec.timeDependent !== false;
  let tp = null;
  if (timeDependent) {
    tp = transport({
      speed: speed0, speedLabel: s => `${sci(s, 2)} ${timeUnit}/s`, range: speedRange,
      onToggle: () => togglePlay(),
      onStep: () => { setPlaying(false); if (!isDone()) { sim.step(); tDisplay = sim.t; } },
      onRestart: () => rebuild(),
      onFit: () => spec.onFit?.(view),
      onFullscreen: () => toggleFullscreen(),
      onSpeed: s => { clock.speed = s; },
    });
    stage.append(tp);
  } else {
    fsBtn = el('button', { class: 'psim-fsbtn', title: 'Full screen (F)', 'aria-label': 'Full screen', html: ICONS.fullscreen, onclick: () => toggleFullscreen() });
    scene.append(fsBtn);
    stage.querySelector('.psim-hud').querySelector('.dim').textContent = '';
  }
  function setPlaying(p) { clock.playing = p; tp?.setPlaying(p); }
  // A model that ends (a merger, everything decayed, the last particle left) sets sim.done (or
  // sim.ended): the clock stops there instead of counting time in which nothing is computed,
  // and play starts the run again from the beginning.
  // the end shown on the clock: exactly the declared duration when the steps' float sum lands within round-off of it
  const endTime = () => (tl && Math.abs(sim.t - tl.duration) <= 1e-9 * Math.max(Math.abs(tl.duration), tl.duration - tl.start) ? tl.duration : tl ? Math.min(sim.t, tl.duration) : sim.t);
  const isDone = () => sim?.done === true || sim?.ended === true || (tl != null && (sim?.t ?? 0) >= tl.duration - 1e-12 * Math.max(Math.abs(tl.duration), tl.duration - tl.start));
  function togglePlay() {
    if (!clock.playing && isDone()) { rebuild(); setPlaying(true); return; }
    setPlaying(!clock.playing);
  }


  // ------------------------------------------------------------ side panel
  const secParams = section(texts.parameters ?? 'Parameters');
  const paramInputs = new Map();
  // set one or several parameters as if typed: every control shows the new value, one rebuild
  function setParams(next, { play } = {}) {
    for (const [k, v] of Object.entries(next)) { values[k] = v; paramInputs.get(k)?.setValue?.(v); }
    rebuild();
    if (play != null && timeDependent) setPlaying(play);
  }
  const setParam = (k, v) => setParams({ [k]: v });
  if (presets.length) {
    secParams.body.append(el('div', { class: 'psim-presets' },
      el('span', { class: 'psim-hint' }, texts.presets ?? 'Try this'),
      ...presets.map(pr => button(pr.label, () => setParams(pr.values ?? {}, { play: pr.play ?? true })))));
  }
  if (params.length) {
    const note = texts.paramsNote ?? 'Changing a parameter recomputes the model from its initial state.';
    if (note) secParams.body.append(el('p', { class: 'psim-hint' }, note));
    for (const p of params) {
      if (p.options) {
        const sel = select(p.options, p.value, v => { values[p.key] = isNaN(+v) ? v : +v; rebuild(); });
        sel.setValue = v => { sel.value = String(v); };
        paramInputs.set(p.key, sel);
        secParams.body.append(el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, p.label)), sel));
      } else {
        const sl = slider({
          label: p.label, min: p.min, max: p.max, value: p.value, log: p.log, unit: p.unit ?? '', digits: p.digits ?? 3,
          integer: p.integer, limits: p.limits,
          onInput: v => { values[p.key] = v; rebuild(); },
        });
        paramInputs.set(p.key, sl);
        secParams.body.append(sl);
      }
      if (p.hint) secParams.body.append(el('p', { class: 'psim-hint', style: 'margin-top:-4px;font-size:11.5px' }, p.hint));
    }
  }
  if (controls) controls(secParams.body, { values, rebuild, setParam, setParams, play: () => setPlaying(true), pause: () => setPlaying(false), getSim: () => sim });

  // presentation-only controls (projection, colour map, slice): never rebuild the model
  const secView = viewControls ? section(texts.view ?? 'View') : null;
  if (secView) secView.body.append(el('p', { class: 'psim-hint' }, texts.viewNote ?? 'These change only how the results are shown, not the calculation.'));

  const secDiag = section(texts.diagnostics ?? 'Diagnostics', { aside: 'live' });
  const diagPlot = logPlot({ caption: '', yMin: 1e-16, yMax: 1 });
  const diagSeries = diagPlot.addSeries('--accent');
  const diagRows = new Map();
  secDiag.body.append(diagPlot.el);
  let nextPlot = 0;
  function renderDiag(reset = false) {
    const d = sim.diagnostics();
    if (reset) {
      diagRows.forEach(r => r.remove());
      diagRows.clear();
      nextPlot = 0;
      const firstErr = d.find(x => x.kind === 'error');
      diagPlot.el.style.display = firstErr ? '' : 'none';
      diagPlot.el.querySelector('.cap').textContent = firstErr ? `${firstErr.label}   vs   t` : '';
      if (spec.duration) diagPlot.setXMax(spec.duration);
    }
    for (const x of d) {
      let r = diagRows.get(x.key);
      if (!r) { r = row(x.label); diagRows.set(x.key, r); secDiag.body.append(r); }
      // pending: a quantity that is not measured yet (e.g. before enough Monte Carlo samples)
      const text = x.pending ? (x.text ?? texts.pending ?? 'measuring…') : x.text ?? (x.kind === 'error' ? sci(x.value) : `${sci(x.value, 4)}${x.unit ? ` ${x.unit}` : ''}`);
      r.set(text, !x.pending && x.kind === 'error' && x.good != null ? grade(x.value, x.good, x.warn ?? x.good * 1000) : '');
    }
    const firstErr = d.find(x => x.kind === 'error' && !x.pending);
    if (firstErr && timeDependent && sim.t >= nextPlot) {
      diagPlot.push(diagSeries, sim.t, Math.max(firstErr.value, 1e-17));
      nextPlot = sim.t + (spec.duration ?? 10) / 800;
    }
    diagPlot.draw();
    return d;
  }

  const secVerify = section('Verification', { aside: report ? 'report embedded' : 'no report' });
  if (report?.checks) {
    secVerify.body.append(el('p', { class: 'psim-hint' }, report.summary ?? `Measured when this page was built (${(report.generated ?? '').slice(0, 10)}):`));
    for (const c of report.checks) {
      secVerify.body.append(el('div', { class: 'psim-check' },
        el('i', { class: c.pass !== true ? 'bad' : c.state === 'warn' ? 'warn' : '' }),
        el('span', {}, c.label), el('code', {}, c.value)));
    }
    if (report.notes) for (const n of report.notes) secVerify.body.append(el('p', { class: 'psim-hint' }, n));
  } else {
    secVerify.body.append(el('p', { class: 'psim-hint' }, 'No build-time verification report is embedded in this page.'));
  }

  const secModel = section('Model, assumptions & limits', { open: false });
  secModel.body.append(
    el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, `${trustLabel}. `), tierReason ?? '')),
    ...(model.equations ?? []).flatMap(eq => [
      eq.caption ? el('p', { class: 'psim-hint' }, eq.caption) : null,
      el('div', { class: 'psim-math', html: eq.mathml }),
    ]),
    model.assumptions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Assumptions and limits')), el('ul', {}, model.assumptions.map(a => el('li', {}, a)))) : null,
    model.conventions ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'Visual conventions')), el('ul', {}, model.conventions.map(a => el('li', {}, a)))) : null,
    model.references ? el('div', { class: 'psim-prose' }, el('p', {}, el('b', {}, 'References')), el('ul', {}, model.references.map(a => el('li', {}, el('cite', {}, a))))) : null,
  );
  tierBtn.addEventListener('click', () => { secModel.open = true; secModel.scrollIntoView({ behavior: 'smooth' }); });

  const secExport = section('Export', { open: false });
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  secExport.body.append(el('div', { class: 'psim-btns' },
    button('State JSON', () => download(`${slug}-state.json`, JSON.stringify({
      generator: 'p-simtor', title, tier: tierBtn.dataset.tier, params: values, t: sim.t, state: sim.state(), diagnostics: sim.diagnostics(), verification: report,
    }, null, 2), 'application/json')),
    button('Data CSV', () => {
      const r = sim.record?.();
      if (!r) { toast(stage, 'This model records no tabular data'); return; }
      download(`${slug}-data.csv`, [`# p-simtor | ${title}`, r.header.join(','), ...r.rows.map(x => x.join(','))].join('\n'), 'text/csv');
    }),
    button('PNG image', () => {
      // composite the GPU layer (if any) under the 2D overlay
      const out = document.createElement('canvas');
      out.width = canvas.width; out.height = canvas.height;
      const c = out.getContext('2d');
      if (glLayer?.ok) c.drawImage(glLayer.canvas, 0, 0);
      c.drawImage(canvas, 0, 0);
      out.toBlob(b => el('a', { href: URL.createObjectURL(b), download: `${slug}.png` }).click());
    }),
  ));

  side.append(...[secParams, secView, secTimeline, secDiag, secVerify, secModel, secExport].filter(s => s && (s !== secParams || params.length || controls)));
  if (viewControls) viewControls(secView.body, { el, slider, select, toggle, button, view, getSim: () => sim });
  if (spec.extraSections) spec.extraSections(side, { section, el, row, slider, toggle, button, values, rebuild, view });

  // ------------------------------------------------------------ canvas & loop
  function resize() {
    view.dpr = devicePixelRatio || 1;
    view.W = canvas.clientWidth; view.H = canvas.clientHeight;
    canvas.width = Math.round(view.W * view.dpr); canvas.height = Math.round(view.H * view.dpr);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();
  if (onPointer) onPointer(canvas, view, () => sim);

  // Adaptive GL resolution: when frames take longer than the display refresh while the JavaScript
  // part is small, the GPU is the bottleneck (large or fullscreen windows, ray marching): render the
  // GL layer at a lower pixel ratio, and raise it again when there is headroom. Display only.
  if (glLayer && typeof glResolution === 'number') glLayer.scale = Math.min(1, Math.max(0.25, glResolution));
  const perf = { last: null, interval: null, js: 0, refresh: Infinity, lastAdjust: 0, calm: 0 };
  function adaptResolution(now, jsMs) {
    if (!glLayer?.ok || glResolution !== 'auto') return;
    if (perf.last != null) {
      const dt = now - perf.last;
      if (dt > 0 && dt < 250) {
        perf.refresh = Math.min(perf.refresh * 1.0005, Math.max(dt, 4));
        perf.interval = perf.interval == null ? dt : 0.9 * perf.interval + 0.1 * dt;
        perf.js = 0.9 * perf.js + 0.1 * jsMs;
        const floor = Math.max(0.35, 0.75 / (view.dpr || 1)), slow = perf.interval > 1.3 * perf.refresh;
        if (slow && perf.interval - perf.js > 0.5 * perf.refresh && now - perf.lastAdjust > 500 && glLayer.scale > floor) {
          glLayer.scale = Math.max(floor, glLayer.scale * 0.8); perf.lastAdjust = now; perf.calm = 0;
        } else if (!slow && perf.interval < 1.1 * perf.refresh) {
          if (++perf.calm > 120 && glLayer.scale < 1 && now - perf.lastAdjust > 2000) { glLayer.scale = Math.min(1, glLayer.scale * 1.15); perf.lastAdjust = now; perf.calm = 0; }
        } else perf.calm = 0;
      }
    }
    perf.last = now;
  }

  let frames = 0, lastUi = 0;
  const frameWaiters = [];   // resolved right after a frame has been drawn (GPU self-tests read pixels then)
  function frame(now) {
    const frameStart = performance.now();
    if (timeDependent) {
      const target = tl ? Math.min(tl.duration, clock.tick(now, tDisplay)) : clock.tick(now, tDisplay);
      if (target > tDisplay) {
        // frameBudget ms of computing per frame, checked after every step, so a slow step
        // (a Monte Carlo sweep) runs at most once past the budget; fast steps run in thousands
        const deadline = performance.now() + frameBudget;
        while (sim.t < target && !isDone()) {
          sim.step();
          if (performance.now() > deadline) break;
        }
        limited = sim.t < target && !isDone();
        tDisplay = Math.min(target, sim.t);
        if (isDone()) { tDisplay = endTime(); setPlaying(false); }
      }
    }
    if (glLayer?.ok) { glLayer.sync(view.dpr); drawGL?.(glLayer.gl, sim, view, tDisplay); }
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, view.W, view.H);
    if (glLayer && !glLayer.ok) { ctx.fillStyle = cssVar('--muted'); ctx.font = '13px system-ui, sans-serif'; ctx.fillText(`${glLayer.reason}: the 3D view cannot be shown.`, 16, view.H - 20); }
    draw(ctx, sim, view, tDisplay);
    if (now - lastUi > 100) {
      lastUi = now;
      const d = renderDiag();
      hud.t.textContent = timeDependent ? (formatTime ? formatTime(tDisplay) : `${fix(tDisplay, timeDigits)} ${timeUnit}`) : '';
      if (tl) tlEl.querySelector('.fill').style.width = `${(100 * Math.max(0, Math.min(1, (tDisplay - tl.start) / (tl.duration - tl.start)))).toFixed(2)}%`;
      const firstErr = d.find(x => x.kind === 'error' && !x.pending);
      hud.a.textContent = firstErr && hudError ? `${firstErr.label} ${sci(firstErr.value)}` : '';
      hud.b.textContent = spec.hudLine?.(sim) ?? '';
      hud.flag.textContent = isDone() ? (texts.finished ?? 'finished · play restarts')
        : limited ? 'compute-limited: playback slowed to keep the calculation exact' : '';
      benchApi?.update?.(sim, tDisplay, { rebuilt: false });
      status.set('t', timeDependent ? tDisplay : 1);
      if (firstErr) { status.set('drift', firstErr.value); status.set('driftLabel', firstErr.label); }
    }
    if (++frames === 1 || frames % 30 === 0) status.set('frames', frames);   // first frame at once: slow pages count as live
    adaptResolution(now, performance.now() - frameStart);
    if (frameWaiters.length) { const w = frameWaiters.splice(0); w.forEach(f => f()); }
    requestAnimationFrame(frame);
  }

  window.psim = {
    model: 'generic',
    get t() { return tDisplay; },
    state: () => ({ t: sim.t, ...sim.state() }),
    params: () => ({ ...values }),
    advanceTo: t => {
      const T = tl ? Math.min(t, tl.duration) : t;
      while (sim.t < T && !isDone()) sim.step();
      tDisplay = isDone() ? endTime() : Math.max(tDisplay, Math.min(T, sim.t));
      return window.psim.state();
    },
    /** The run's declared span and key times ({ duration, markers, note }), or null. */
    get timeline() { return tl ? { start: tl.start, duration: tl.duration, markers: tl.markers.map(m => ({ ...m })), note: tl.note } : null; },
    get done() { return isDone(); },
    restart: () => rebuild(),
    setParams: (next, opts) => setParams(next, opts),
    setParam: (k, v) => setParam(k, v),
    getSim: () => sim,
    toggleFullscreen: () => toggleFullscreen(),
    /** Resolves after the next frame has been drawn: await it in a self-test before reading GPU pixels. */
    nextFrame: () => new Promise(res => frameWaiters.push(res)),
    report,
    get fullscreen() { return isFullscreen(); },
    testSteps,
    play: () => setPlaying(true), pause: () => setPlaying(false),
    steps: n => { if (typeof sim.step === "function") for (let i = 0; i < n; i++) sim.step(); tDisplay = sim.t ?? 0; return window.psim.state(); },
  };

  if (bench && benchParts) {
    benchApi = bench({
      ...benchParts, createPlot, createEquation, createDerivation, M, values, report,
      setParam, setParams, play: () => setPlaying(true), pause: () => setPlaying(false),
      getSim: () => sim,
    }) ?? null;
  }
  rebuild();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setPlaying(timeDependent && (query.get('autoplay') ? query.get('autoplay') !== '0' : !reduced));
  addEventListener('keydown', e => {
    if (e.target.closest('input, select, textarea')) return;
    if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleFullscreen(); return; }
    if (e.key === 'Escape' && pseudoFs) { setPseudo(false); return; }

// ------------------------------------------------------------------ the simulation (page contract)
const MAX_ELECTRONS = 2_000_000;
function createSim(params) {
  const p = { ...PARAMS.reduce((o, q) => ({ ...o, [q.key]: q.value }), {}), ...params };

  const rand = rng(Math.round(+p.seed) || 1);

  const grow = () => {
    const cap = hits.y.length * 2, g = (A, k = 1) => { const B = new A.constructor(cap * k); B.set(A); return B; };

  const addHit = (o, k) => {

  };

  const draw3 = () => [rand(), rand(), rand()];
  let current = 0;                                           // index of the electron in flight
  let u0 = draw3(), live0 = null, cumLive = 0;               // electron 0: decided online as its flux arrives
  let t = 0;                                                 // lab time, code units

    flight: f, hits, zHalf, Twin, rhoLabel: f.mode === 'whichpath' ? 'ρ = |ψ_U|² + |ψ_L|²' : '|ψ|²',
    get t() { return t * T_UNIT_FS; },
    get electron() { return current; },

    get live() { return !f.done; },

    step() {

    },
    /** Display frame index (fractional) for the current electron's replay. */
    frameAt() { return Math.min(f.frames.length - 1, sim.tau / (GEOM.snapEvery * f.dt)); },
    hitsInWindow() { return outcomes[current]; },
    diagnostics() {
      const out = [{ key: 'budget', label: 'Probability budget error', kind: 'error', value: f.budgetErrorNow(), good: 3e-3, warn: 1e-2 }];
      out.push({ key: 'sent', label: 'Electrons sent', kind: 'value', value: sim.sent, text: `${sim.sent.toLocaleString('en-US')}` });
      out.push({ key: 'det', label: 'Detected on the screen', kind: 'value', value: hits.n, text: `${hits.n.toLocaleString('en-US')}${sim.sent > 1 ? ` (${(100 * hits.n / sim.sent).toFixed(1)} %)` : ''}` });

  if (L.wide) {
    ctx.textAlign = 'center'; ctx.fillText('hits / bin', hx0 + hw / 2, hy0 - 6); ctx.textAlign = 'start';
    // shared y axis (nm) on the right
    ctx.font = mono; ctx.fillStyle = C('--faint');
    for (let y = -20; y <= 20; y += 10) { const py = L.fy(y); ctx.fillRect(hx0 + hw + 1, py, 4, 1); ctx.fillText(`${y}`, hx0 + hw + 8, py + 3.5); }
    ctx.fillText('y nm', hx0 + hw + 6, hy0 + hh + 15);
  }
  if (!f.done) {
    ctx.fillStyle = C('--muted'); ctx.font = sans;
    const msg = `Computing electron 1's wave live: step ${f.steps} / ${f.nSteps}`;
    ctx.fillText(msg, L.wide ? dx0 + 6 : dx0 + 4, L.wide ? dy0 + dh - 10 : dy0 + dh - 8);
  }
}

// ------------------------------------------------------------------ workbench: equations and figures
function bench({ eqs, figs, createPlot, createEquation, M }) {
  const screen = createPlot({ title: 'Screen distribution: computed vs detected', height: 280, x: { label: 'position on the screen y', unit: 'nm', min: -22.6, max: 22.6 }, y: { label: 'probability density', unit: '1/nm', min: 0, max: 0.2 } });
  const budget = createPlot({ title: 'Where one electron’s probability goes (electron 1, computed)', height: 280, x: { label: 'time since leaving the source', unit: 'fs', min: 0, max: 90 }, y: { label: 'probability', unit: '', min: 0, max: 1.05 } });
  const arrival = createPlot({ title: 'Arrival time at the screen: computed flux vs detected', height: 280, x: { label: 'arrival time', unit: 'fs', min: 0, max: 90 }, y: { label: 'probability density', unit: '1/fs', min: 0, max: 0.05 } });
  figs.append(screen.el, budget.el, arrival.el);
  const cap = (plot, text) => plot.el.append(Object.assign(document.createElement('p'), { className: 'psim-hint', textContent: text }));
  cap(screen, 'Solid: time-integrated probability current through the screen line (2D Schrödinger, validated). Dots: detected electrons per 0.4 nm bin with Poisson error bars (Monte Carlo draws from the solid curve). Dashed: textbook Fraunhofer shape cos²(πd sinθ/λ)·sinc²(πa sinθ/λ), scaled to the computed peak, for reference only.');
  cap(budget, 'Probability inside the box, through the screen, and out through the other edges (mostly reflected by the plate). The sum stays 1 within the probability-budget error shown in Diagnostics.');
  cap(arrival, 'Solid: computed screen flux ∫ j_x dy versus time, normalised to the detected fraction. Dots: arrival times of the detected electrons (each dot on the screen is drawn jointly in time and position).');

  let curSim = null;
  const lam = M.i('λ');
  const debroglie = createEquation({
    title: 'de Broglie wavelength of the electron',
    lhs: { mathml: lam, label: 'wavelength', unit: 'nm', value: () => curSim?.flight.lambda ?? 1, digits: 4 },
    terms: [{ id: 'db', mathml: M.frac(M.i('h'), M.sqrt(`${M.n(2)}${M.sub(M.i('m'), M.i('e'))}${M.i('E')}`)), label: 'h / p for kinetic energy E (non-relativistic)', color: '--body-2', unit: 'nm', value: () => deBroglieNm(curSim?.flight.E ?? 1.5), digits: 4 }],
  });
  const spacing = createEquation({
    title: 'Fringe spacing on the screen (far-field, small angles)',
    lhs: { mathml: `<mi>Δ</mi>${M.i('y')}`, label: 'measured between the minima beside the centre (once electron 1 has arrived)', unit: 'nm', value: () => (curSim?.flight.done && curSim.flight.mode === 'both' ? fringeSpacing(curSim.flight) : NaN), digits: 4 },
    op: '≈',
    terms: [{ id: 'far', mathml: M.frac(`${lam}${M.i('L')}`, M.i('d')), label: 'λ L / d', color: '--accent', unit: 'nm', value: () => { const f = curSim?.flight; return f ? f.lambda * f.L / f.d : NaN; }, digits: 4 }],
    where: [
      { mathml: M.i('L'), meaning: 'plate mid-plane to screen', value: () => curSim?.flight.L ?? 30.1, unit: 'nm' },
      { mathml: M.i('d'), meaning: 'slit separation (centre to centre)', value: () => curSim?.flight.d ?? 8, unit: 'nm' },
    ],
    link: screen,
  });
  const flux = createEquation({
    title: 'Where a dot can land: the probability current through the screen',
    lhs: { mathml: `${M.i('P')}${M.paren(M.i('y'))}`, label: 'peak chance per nm to be detected (per electron sent; after electron 1 has arrived)', unit: '1/nm', value: () => { const f = curSim?.flight; if (!f?.done) return NaN; return Math.max(...f.P) / f.dx; } },
    terms: [{ id: 'jx', mathml: `<mo>∫</mo>${M.frac(M.i('ħ'), M.i('m'))}<mi>Im</mi>${M.paren(`${M.sup(M.i('ψ'), '<mo>*</mo>')}${M.frac('<mi>∂</mi><mi>ψ</mi>', '<mi>∂</mi><mi>x</mi>')}`)}<mi>d</mi><mi>t</mi>`, label: 'time-integrated current j_x at the screen line (peak value shown)', color: '--body-1', unit: '1/nm', value: () => { const f = curSim?.flight; if (!f?.done) return NaN; return Math.max(...f.P) / f.dx; } }],
    link: screen,
  });
  eqs.append(debroglie.el, spacing.el, flux.el);

  let lastKey = '';
  return {
    update(sim, t, { rebuilt }) {
      curSim = sim;
      const f = sim.flight;
      debroglie.update?.(); spacing.update?.(); flux.update?.();
      const key = `${f.steps}|${sim.hits.n}|${rebuilt}`;
      if (key === lastKey && !rebuilt) return;
      lastKey = key;
      const tMax = f.tEnd * FS;
      budget.setX({ min: 0, max: tMax }); arrival.setX({ min: 0, max: tMax });
      // budget
      budget.data('box', f.budget.map(b => [b.t * FS, b.box]), { color: '--body-0', label: 'in the box' });
      budget.data('scr', f.budget.map(b => [b.t * FS, b.screen]), { color: '--accent', label: 'through the screen' });
      budget.data('else', f.budget.map(b => [b.t * FS, b.elsewhere]), { color: '--body-3', label: 'out elsewhere' });
      budget.data('sum', f.budget.map(b => [b.t * FS, b.box + b.screen + b.elsewhere]), { color: '--ink', dash: true, label: 'sum' });
      budget.draw();
      // screen distribution
      const ys = [], Pc = [];
      let P = f.done ? f.P : null, tot = f.done ? f.detectable : 0;
      if (!P && (f.screenSoFar ?? 0) > 1e-6) {                // during electron 1's flight: the flux accumulated so far (shape)
        P = new Float64Array(f.nRows);
        for (let m = 0; m < f.steps; m++) for (let q = 0; q < f.nRows; q++) P[q] += f.inc[m * f.nRows + q];
        tot = P.reduce((s, v) => s + v, 0);
      }
      if (P) {
        for (let q = 0; q < f.nRows; q++) { ys.push(f.Y(f.j0 + q)); Pc.push(P[q] / tot / f.dx); }
        const peak = Math.max(...Pc);
        screen.setY({ min: 0, max: peak * 1.15 });
        screen.data('P', ys.map((y, i) => [y, Pc[i]]), { color: '--accent', label: f.done ? 'computed P(y)' : 'computed flux so far (shape)' });
        const th = y => y / Math.hypot(y, f.L), sinc = x => (Math.abs(x) < 1e-9 ? 1 : Math.sin(x) / x);
        const env = (y, yc) => { const s = (y - yc) / Math.hypot(y - yc, f.L); return sinc(Math.PI * f.a * s / f.lambda) ** 2; };
        const shape = f.mode === 'both' ? y => Math.cos(Math.PI * f.d * th(y) / f.lambda) ** 2 * sinc(Math.PI * f.a * th(y) / f.lambda) ** 2
          : f.mode === 'upper' ? y => env(y, f.d / 2) : y => env(y, f.d / 2) + env(y, -f.d / 2);
        let sm = 0; for (const y of ys) sm = Math.max(sm, shape(y));
        screen.fn('fraun', y => shape(y) / sm * peak, { color: '--muted', dash: true, label: 'Fraunhofer shape (ref.)' });
      } else { screen.remove('P'); screen.remove('fraun'); }
      const Hc = binCounts(sim), n = sim.hits.n;
      if (n) {
        const pts = [], err = [];
        for (let b = 0; b < hist.bins; b++) { const c = Hc.counts[b]; pts.push([Hc.y0 + (b + 0.5) * Hc.bw, c / n / Hc.bw]); err.push(Math.sqrt(Math.max(c, 1)) / n / Hc.bw); }
        screen.data('hits', pts, { color: '--warn', dots: true, r: 2, errors: err, label: `detected (${n.toLocaleString('en-US')})` });
        if (!P) screen.setY({ min: 0, max: Math.max(...pts.map(p => p[1])) * 1.2 || 0.2 });
      } else screen.remove('hits');
      screen.draw();
      // arrival times
      const at = [];
      for (let m = 0; m < f.steps; m++) at.push([(m + 0.5) * f.dt * FS, f.stepTotal[m] / (f.dt * FS)]);
      arrival.data('flux', at, { color: '--accent', label: 'computed flux' });
      let amax = 0; for (const p of at) amax = Math.max(amax, p[1]);
      if (n >= 20) {
        const nb = 40, bw = tMax / nb, c = new Float64Array(nb);
        for (let i = 0; i < n; i++) c[Math.min(nb - 1, Math.floor(sim.hits.tau[i] * FS / bw))]++;
        const det = f.done ? f.detectable : 1, pts = [], err = [];
        for (let b = 0; b < nb; b++) { pts.push([(b + 0.5) * bw, c[b] / n / bw * det]); err.push(Math.sqrt(Math.max(1, c[b])) / n / bw * det); }
        arrival.data('hits', pts, { color: '--warn', dots: true, r: 2, errors: err, label: 'detected' });
        for (const p of pts) amax = Math.max(amax, p[1]);
      } else arrival.remove('hits');
      arrival.setY({ min: 0, max: amax * 1.15 || 0.05 });
      arrival.draw();
    },
  };
}

// ------------------------------------------------------------------ the instrument
const app = createInstrument({
  title: 'Double slit, one electron at a time',
  subtitle: '2D time-dependent Schrödinger equation for a 1.5 eV electron (scaled, nanometre slits); detections sampled from the computed probability current',
  tier: 'validated',
  tierReason: 'The wave is a verified numerical solution of the 2D Schrödinger equation (split-operator FFT) for the stated geometry: exact free-packet benchmark, probability budget closed to 3×10⁻⁴, fringe spacing within 3 % of λL/d, single-slit minima against the Rayleigh–Sommerfeld integral, and time-step and grid refinement. The detection dots are Monte Carlo draws from that computed distribution (KS and χ² tested); they are not computed electron paths. The geometry is scaled down about 10⁴× from real experiments so that the wave fits on a 256 × 256 grid.',
  layout: 'workbench', bench,
  params: PARAMS, create: createSim, gl: true, drawGL, draw,
  timeUnit: 'fs', timeLabel: 'lab time', speed: 150, speedRange: [5, 5e6], frameBudget: 11, testSteps: 40,
  timeline: {
    duration: sim => N_RUN * sim.Twin * FS,
    markers: (sim, v) => [
      { t: 1000 * sim.Twin * FS, label: '1 000 electrons sent (k·T, T = computed flight window)', short: '1 000 e⁻', kind: 'computed' },
      { t: 10000 * sim.Twin * FS, label: '10 000 electrons sent (k·T, T = computed flight window)', short: '10 000 e⁻', kind: 'computed' },
      ...(isDefaultGeom(v) && DETECTABLE > 0 ? [{ t: Math.ceil(20000 / DETECTABLE) * sim.Twin * FS, label: `≈ 20 000 detected (computed transmission ${(100 * DETECTABLE).toFixed(2)} %; the size of the build report’s KS test)`, short: '≈ 20 000 hits', kind: 'computed' }] : []),
    ],
    note: sim => `One electron leaves every T = ${fix(sim.Twin * FS, 1)} fs (its computed flight window), so lab time counts electrons. The run ends after 100 000 electrons, when the histogram matches the computed P(y) within its shot noise; the first ${fix(sim.Twin * FS, 0)} fs are electron 1’s wave crossing the slits.`,
  },
  formatTime: t => (t < 1000 ? `${fix(t, 1)} fs` : t < 1e6 ? `${fix(t / 1000, 2)} ps` : `${fix(t / 1e6, 3)} ns`),
  hudLine: sim => {
    const f = sim.flight;
    if (!f.done) return `electron 1 in flight · its wave is being computed (${Math.round(100 * f.steps / f.nSteps)} %)`;
    const rate = app?.view?.speed ? app.view.speed / (sim.Twin * FS) : 0;
    return `electron ${sim.sent.toLocaleString('en-US')} in flight · ${sim.detected.toLocaleString('en-US')} detected · ${rate >= 1 ? `${sci(rate, 2)} electrons/s` : `one electron every ${fix(1 / Math.max(rate, 1e-9), 1)} s`}`;
  },
  presets: [
    { label: 'Two slits', values: { mode: 'both', E: 1.5, d: 8, a: 2.4 } },
    { label: 'Close one slit', values: { mode: 'upper', E: 1.5, d: 8, a: 2.4 } },
    { label: 'Which-path detector', values: { mode: 'whichpath', E: 1.5, d: 8, a: 2.4 } },
    { label: 'Faster electrons (2.4 eV)', values: { mode: 'both', E: 2.4, d: 8, a: 2.4 } },
  ],
  texts: { paramsNote: 'Changing a physical parameter recomputes the wave of electron 1 from the source (about 8 s, live) and clears the screen.' },
  viewControls(body, { select, slider, el }) {
    const field = (label, ctl) => el('div', { class: 'psim-field' }, el('div', { class: 'top' }, el('span', {}, label)), ctl);
    body.append(
      field('Wave display', select([{ value: 'brightness', label: '|ψ|² (log colour scale)' }, { value: 'phase', label: 'phase as hue, |ψ|² as brightness' }], viewState.display, v => { viewState.display = v; })),
      slider({ label: 'Brightness range', min: 2, max: 6, value: viewState.decades, unit: 'decades', digits: 2, onInput: v => { viewState.decades = v; } }),
      field('Colour map', select([{ value: 'inferno', label: 'inferno' }, { value: 'viridis', label: 'viridis' }, { value: 'magma', label: 'magma' }], viewState.cmap, v => { viewState.cmap = v; })),
      slider({ label: 'Dot size', min: 1, max: 4, value: viewState.dot, unit: 'px', digits: 2, onInput: v => { viewState.dot = v; } }),
    );
  },
  extraSections(side, { section, el, button }) {
    const sec = section('Build-up', { aside: 'Tonomura-style' });
    const note = el('p', { class: 'psim-hint' }, 'Every electron has the same computed wave; only where it is detected differs. Send many at once to watch the fringes emerge from random dots. (Or raise the playback speed.)');
    const status = el('p', { class: 'psim-hint' }, '');
    const send = n => () => {
      const sim = app.sim;
      if (sim.live) { status.textContent = 'Electron 1’s wave is still being computed; the build-up starts when it has reached the screen.'; return; }
      const end = window.psim.timeline?.duration ?? Infinity;
      if (window.psim.t >= end * (1 - 1e-9)) { status.textContent = `The run has ended after ${N_RUN.toLocaleString('en-US')} electrons; press play to start again.`; return; }
      window.psim.advanceTo(window.psim.t + n * sim.Twin * FS);
      status.textContent = window.psim.t >= end * (1 - 1e-9) ? `Reached the end of the run (${N_RUN.toLocaleString('en-US')} electrons).` : `Sent ${n.toLocaleString('en-US')} more electrons.`;
    };
    sec.body.append(note, el('div', { class: 'psim-btns' }, button('+10', send(10)), button('+100', send(100)), button('+1 000', send(1000)), button('+10 000', send(10000)), button('+100 000', send(100000))), status);
    side.insertBefore(sec, side.children[1] ?? null);
  },
  model: {
    legend: ['Left: computed |ψ|² of one electron, log colour scale over 4 decades', 'Middle: the screen seen face-on: one dot per detected electron, drawn from the computed flux (not a simulated path)', 'Right: hits per 0.4 nm bin vs computed expectation (dashed)'],
    equations: [
      { caption: 'Time-dependent Schrödinger equation for one electron (2D, x along the beam, y across the slits). V = V₀ = 4E inside the 0.8 nm slit plate, 0 elsewhere; complex absorbing layers −iW(x, y) in the outer 3 nm.', mathml: '<math display="block"><mi>i</mi><mi>ħ</mi><mfrac><mrow><mi>∂</mi><mi>ψ</mi></mrow><mrow><mi>∂</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mrow><mo>[</mo><mo>−</mo><mfrac><msup><mi>ħ</mi><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>m</mi><mi>e</mi></msub></mrow></mfrac><msup><mo>∇</mo><mn>2</mn></msup><mo>+</mo><mi>V</mi><mo>(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>)</mo><mo>−</mo><mi>i</mi><mi>W</mi><mo>(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>)</mo><mo>]</mo></mrow><mi>ψ</mi></math>' },
      { caption: 'Detection rule: the chance that the electron is detected at screen position y between t and t + dt is the probability current through the screen line (sampled jointly in t and y).', mathml: '<math display="block"><mi>d</mi><mi>P</mi><mo>=</mo><msub><mi>j</mi><mi>x</mi></msub><mo>(</mo><msub><mi>x</mi><mtext>s</mtext></msub><mo>,</mo><mi>y</mi><mo>,</mo><mi>t</mi><mo>)</mo><mi>d</mi><mi>y</mi><mi>d</mi><mi>t</mi><mo>,</mo><mspace width="0.6em"/><mi>𝐣</mi><mo>=</mo><mfrac><mi>ħ</mi><msub><mi>m</mi><mi>e</mi></msub></mfrac><mi>Im</mi><mo>(</mo><msup><mi>ψ</mi><mo>*</mo></msup><mo>∇</mo><mi>ψ</mi><mo>)</mo></math>' },
      { caption: 'Which-path detector (ideal, complete decoherence): the screen distribution is the incoherent sum of the two one-slit runs.', mathml: '<math display="block"><msub><mi>P</mi><mtext>which-path</mtext></msub><mo>(</mo><mi>y</mi><mo>)</mo><mo>=</mo><msub><mi>P</mi><mtext>upper only</mtext></msub><mo>(</mo><mi>y</mi><mo>)</mo><mo>+</mo><msub><mi>P</mi><mtext>lower only</mtext></msub><mo>(</mo><mi>y</mi><mo>)</mo></math>' },
    ],
    assumptions: [
      'The dots are not simulated electron paths. Each dot is one random draw from the computed probability current at the screen, so where a single electron lands is random and only the distribution of many dots is predicted. Quantum mechanics says nothing about a path between source and screen.',
      'Every electron is prepared identically: it has the same wave ψ (computed once, live, for electron 1, then replayed from stored frames). Electrons are sent one at a time; no two are ever in the apparatus together, as in the experiments.',
      'Scaled geometry: a 1.5 eV electron (λ = 1.00 nm), slits a = 2.4 nm wide and d = 8 nm apart, screen L = 30 nm behind the plate. Real experiments use ~10⁴–10⁵× larger ratios (e.g. 50 keV electrons, λ ≈ 5 pm) that cannot be resolved on a grid. Because the free Schrödinger equation with an opaque wall has no length scale of its own, the pattern depends only on a/λ, d/λ and L/λ.',
      'Two dimensions: the slits are infinitely long, so the pattern is uniform along them. The vertical coordinate of the dots in the face-on screen picture is therefore drawn uniformly at random (a disclosed drawing convention).',
      'The plate is a potential wall V₀ = 4E, 0.8 nm thick: tunnelling through it ~3×10⁻⁸. Electrons that miss the slits (about 75 %) are reflected and absorbed at the left edge: they are counted as sent but never detected, as in a real experiment.',
      'The incident packet has rms length 1.8 nm (4.4 % momentum spread) and rms width 5 nm across the slits; this coherence is idealised and the source size is not modelled.',
      'Accuracy (from the build report): at the production step the fringe spacing is within ~1 % of a run with a 4× smaller time step and 2× finer grid; the screen distribution’s total-variation change is ~2 %. Near-field effects of the thick plate (2 % superposition defect, envelope 15 % wider than Kirchhoff for a = 2.4λ) are physics of this geometry, not errors.',
      'Which-path mode models an ideal detector that gives complete path information (full decoherence) by adding the two one-slit patterns incoherently; partial which-path information, the detector’s mechanism and its back-action are not modelled. To the left of the plate the picture averages the two one-slit runs.',
      'Not modelled: spin, relativity (E/mc² ≈ 3×10⁻⁶), electron–electron interaction, the detector’s efficiency and resolution, image charges in the plate.',
    ],
    conventions: [
      'Wave field: colour (or brightness in the phase view) = log₁₀ of |ψ|² relative to the initial peak density, over the selected number of decades; below that it is black. The bright standing waves left of the plate are the incident and reflected waves interfering.',
      'Phase view: hue = arg ψ on a cyclic constant-lightness wheel; phase depends on the global phase convention (only phase differences are physical). Not available in which-path mode (a mixed state has no single phase).',
      'Dots: fixed size; their opacity falls as their number grows so dense fringes do not saturate. In the dark theme they glow additively. The newest detection is circled for half a second of wall-clock time.',
      'Histogram: hits per 0.4 nm bin (2 grid rows); dashed line: the computed expectation for the same number of hits. During electron 1’s flight the dashed line shows the flux accumulated so far (shape only).',
      'Time: lab time in femtoseconds; electron k leaves the source at k·T where T is the flight window (≈ 85 fs at 1.5 eV). Playback speed in fs per second sets the electron rate.',
      'Grid: 256 × 256 cells of 0.2 nm; the drawn region excludes the 3 nm absorbing layers.',
    ],
    references: [
      'C. Jönsson, Z. Phys. 161, 454 (1961): electron diffraction at multiple slits (quoted from memory, not re-checked).',
      'P. G. Merli, G. F. Missiroli, G. Pozzi, Am. J. Phys. 44, 306 (1976): single-electron build-up with an electron biprism (quoted from memory).',
      'A. Tonomura, J. Endo, T. Matsuda, T. Kawasaki, H. Ezawa, Am. J. Phys. 57, 117 (1989): build-up of an interference pattern one electron at a time, electron biprism (quoted from memory).',
      'R. Bach, D. Pope, S.-H. Liou, H. Batelaan, New J. Phys. 15, 033018 (2013): controlled double-slit electron diffraction with real slits, single-electron detection (quoted from memory).',
      'M. D. Feit, J. A. Fleck, A. Steiger, J. Comput. Phys. 47, 412 (1982): split-operator FFT method.',
      'L. N. Trefethen, Spectral Methods in MATLAB (SIAM 2000), ch. 3: Fourier differentiation matrix used for the probability current.',
      'CODATA 2018 constants (h, ħ, mₑ, e) from core/constants.mjs.',
    ],
  },
});
