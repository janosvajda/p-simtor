<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="p-simtor">
<title>Cavendish experiment: weighing the Earth</title>
<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.psim-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }
.psim-derivation li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; }
.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {
  padding: 6px 9px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 72%, transparent);

/** Rotation matrix (3×3, row-major) taking +z to the direction dir; pass it as transform({ rotate }). */

  return { lamp, spot: s, shift: s[0] - s0[0], s0 };
}

function drawGL(gl, sim, view) {
  if (!mr) {
    mr = createMeshRenderer(gl); lr = createLineRenderer(gl);
    meshes = { box: mr.add(geometry.box(1, 1, 1)), ball: mr.add(geometry.sphere(1, 40)), cyl: mr.add(geometry.cylinder(1, 1, 24)), plane: mr.add(geometry.plane(1, 1)), arrow: mr.add(geometry.arrow(1, { shaft: 0.012, head: 0.03, headLength: 0.07 })) };
  }
  const aspect = view.W / view.H;
  if (Math.abs(aspect - lastAspect) > 0.05) { lastAspect = aspect; if (aspect < 0.9) { cam.fit([[-1.15, -0.35, 0.35], [1.15, 0.5, 1.95]], aspect, 0.85); cam.target[2] -= 0.12; } }
  const C = view.color, light = C('--bg').toLowerCase() !== '#07090d' && parseInt(C('--bg').slice(1, 3), 16) > 128;
  const ap = sim.ap, mag = magOf(sim), thD = sim.theta * mag, psi = sim.psi;
  const lead = light ? '#7d8592' : '#9aa3b2', leadBig = light ? '#5f6774' : '#7c8594';
  const items = [];
  const box = (c, s, color, extra = {}) => items.push({ mesh: meshes.box, matrix: transform({ translate: c, scale: s }), color, ...extra });
  // floor
  items.push({ mesh: meshes.plane, matrix: transform({ translate: [0, 1.2, 0], scale: [7, 7, 1] }), color: light ? '#e4e0d6' : hexMix(C('--bg'), '#ffffff', 0.07), noShadow: true });
  // support frame and wire
  box([0, 0, WIRE_TOP + 0.03], [0.5, 0.12, 0.06], light ? '#8b6a4a' : '#6b5038');
  for (const sx of [-1, 1]) box([sx * 1.15, 0, (WIRE_TOP + 0.06) / 2], [0.06, 0.06, WIRE_TOP + 0.06], light ? '#8b6a4a' : '#6b5038');
  box([0, 0, WIRE_TOP + 0.09], [2.36, 0.08, 0.06], light ? '#8b6a4a' : '#6b5038');
  items.push({ mesh: meshes.cyl, matrix: transform({ translate: [0, 0, ZB], scale: [0.0035, 0.0035, WIRE_TOP - ZB] }), color: '#d9c38c', noShadow: true });
  // rotating crossbar with the large balls
  const LB = [[ap.Rarm * Math.cos(psi), ap.Rarm * Math.sin(psi)], [-ap.Rarm * Math.cos(psi), -ap.Rarm * Math.sin(psi)]];
  items.push({ mesh: meshes.box, matrix: transform({ translate: [0, 0, BAR_Z], rotate: [0, 0, psi], scale: [2 * ap.Rarm + 0.08, 0.05, 0.04] }), color: light ? '#6a5a4a' : '#5a4a3c' });
  items.push({ mesh: meshes.cyl, matrix: transform({ translate: [0, 0, BAR_Z + 0.02], scale: [0.05, 0.05, WIRE_TOP - BAR_Z - 0.02] }), color: light ? '#6a5a4a' : '#5a4a3c', opacity: 0.35 });
  for (const P of LB) {
    items.push({ mesh: meshes.cyl, matrix: transform({ translate: [P[0], P[1], ZB], scale: [0.012, 0.012, BAR_Z - ZB] }), color: '#8c8c8c' });
    items.push({ mesh: meshes.ball, matrix: transform({ translate: [P[0], P[1], ZB], scale: ap.RL }), color: leadBig });
  }
  // the beam (drawn rotation ×mag), small balls, mirror
  items.push({ mesh: meshes.box, matrix: transform({ translate: [0, 0, ZB], rotate: [0, 0, thD], scale: [2 * ap.a, 0.018, 0.018] }), color: light ? '#a27b52' : '#b88c5e' });
  const SB = [rot2([ap.a, 0], thD), rot2([-ap.a, 0], thD)];
  for (const p of SB) items.push({ mesh: meshes.ball, matrix: transform({ translate: [p[0], p[1], ZB], scale: ap.rs }), color: lead });
  items.push({ mesh: meshes.box, matrix: transform({ translate: [0, 0.012, ZB], rotate: [0, 0, thD], scale: [0.07, 0.006, 0.07] }), color: '#dfe8f2' });
  // optical lever: lamp and scale at distance D
  const ol = opticalLever(sim.theta);
  items.push({ mesh: meshes.cyl, matrix: transform({ translate: [ol.lamp[0], ol.lamp[1], ZB], rotate: alignZ([-ol.lamp[0], -ol.lamp[1], 0]), scale: [0.04, 0.04, 0.16] }), color: light ? '#444' : '#666d78' });
  box([ol.s0[0], view3.D + 0.02, ZB], [0.8, 0.012, 0.1], light ? '#f4f1e8' : '#c9cdd4');
  box([ol.s0[0], view3.D + 0.03, ZB - 0.25], [0.03, 0.03, 0.5], light ? '#888' : '#555b66');
  box([ol.lamp[0], view3.D, ZB - 0.25], [0.03, 0.03, 0.5], light ? '#888' : '#555b66');
  items.push({ mesh: meshes.ball, matrix: transform({ translate: [ol.spot[0], view3.D + 0.005, ZB], scale: 0.012 }), color: C('--warn'), noShadow: true });
  // force arrows, drawn 0.3 m above each small ball (length ∝ |F|)
  if (view3.forces) {
    const fr = sim.forces(), k = 0.32 / (ap.G * ap.M * ap.m / ap.r ** 2);
    for (const f of fr) {
      const len = f.F * k;
      if (len < 1e-4) continue;
      items.push({ mesh: meshes.arrow, matrix: compose(transform({ translate: [f.from[0], f.from[1], ZB + 0.3] }), transform({ rotate: alignZ([f.dir[0], f.dir[1], 0]), scale: [1, 1, len] })), color: f.near ? C('--body-0') : C('--body-2'), noShadow: true });
    }
  }
  // the glass case last (transparent)
  items.push({ mesh: meshes.box, matrix: transform({ translate: [0, 0, (CASE.z0 + CASE.z1) / 2], scale: [2 * CASE.x, 2 * CASE.y, CASE.z1 - CASE.z0] }), color: light ? '#9ab8d0' : '#7fa8c8', opacity: 0.13, noShadow: true });
  mr.draw(cam, items, { aspect, light: { direction: [0.45, -0.55, 1] }, ambient: light ? 0.45 : 0.3, shadows: { z: 0, opacity: light ? 0.22 : 0.4 } });
  // light ray of the optical lever and the stands of the force arrows
  const lines = [
    { points: [...ol.lamp, 0, 0.012, ZB], color: C('--warn'), opacity: 0.55 },
    { points: [0, 0.012, ZB, ...ol.spot], color: C('--warn'), opacity: 0.9 },
  ];
  if (view3.forces) for (const p of SB) lines.push({ points: [p[0], p[1], ZB + ap.rs, p[0], p[1], ZB + 0.3], color: C('--muted'), opacity: 0.5 });
  lr.update(lines);
  lr.draw(cam, { aspect, width: 1.6 });
  lr.update([{ points: [0, 0, ZB, 0, 0, WIRE_TOP], color: '#d9c38c', opacity: 0.9 }]);
  lr.draw(cam, { aspect, width: 1.2 });
}

// ------------------------------------------------------------------ 2D overlay: labels and the readout
function label(ctx, view, p, text, { color = '--ink', dx = 8, dy = -8, align = 'left', size = 11 } = {}) {
  const q = cam.project(p, view.W, view.H);
  if (!q.visible || q.x < 4 || q.x > view.W - 4 || q.y < 4 || q.y > view.H - 4) return;
  ctx.font = `${size}px ui-sans-serif, system-ui, sans-serif`; ctx.textAlign = align;
  const w = ctx.measureText(text).width, y = q.y + dy;
  let x = q.x + dx;
  if (align === 'left' && x + w > view.W - 6) x = view.W - 6 - w;
  const x0 = align === 'left' ? x - 3 : align === 'right' ? x - w - 3 : x - w / 2 - 3;
  ctx.fillStyle = view.color('--panel'); ctx.globalAlpha = 0.72; ctx.fillRect(x0, y - size, w + 6, size + 5); ctx.globalAlpha = 1;
  ctx.fillStyle = view.color(color); ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}
let legendNarrow = null;
function draw(ctx, sim, view) {
  if (view.glError) return;
  if ((view.W < 560) !== legendNarrow) { legendNarrow = view.W < 560; view.setLegend(legendNarrow ? ['beam angle computed; drawn ×N when labelled', 'arrows ∝ force · yellow ray: optical lever'] : LEGEND); }
  const ap = sim.ap, mag = magOf(sim), thD = sim.theta * mag, C = view.color, narrow = view.W < 560;
  const SB = [rot2([ap.a, 0], thD), rot2([-ap.a, 0], thD)], psi = sim.psi;
  const LB = [[ap.Rarm * Math.cos(psi), ap.Rarm * Math.sin(psi)], [-ap.Rarm * Math.cos(psi), -ap.Rarm * Math.sin(psi)]];
  if (!narrow) {
    label(ctx, view, [SB[1][0], SB[1][1], ZB - ap.rs], `small ball ${ap.m} kg`, { dy: 18, dx: -8, align: 'right', color: '--ink-2' });
    label(ctx, view, [LB[0][0], LB[0][1], ZB - ap.RL], `large ball ${ap.M} kg`, { dy: 16, color: '--ink-2' });
    label(ctx, view, [0, 0, (ZB + WIRE_TOP) / 2], 'torsion wire', { color: '--muted' });
    label(ctx, view, [0, 0, ZB + 0.05], 'mirror', { dx: 10, dy: -4, color: '--muted', size: 10.5 });
    label(ctx, view, [0.4, view3.D, ZB + 0.06], `scale at D = ${view3.D} m`, { color: '--muted' });
  }
  if (view3.forces) {
    const fr = sim.forces(), k = 0.32 / (ap.G * ap.M * ap.m / ap.r ** 2);
    for (const f of fr.filter(q => q.near && q.i === 0)) {
      const tip = [f.from[0] + f.dir[0] * f.F * k, f.from[1] + f.dir[1] * f.F * k, ZB + 0.3];
      label(ctx, view, tip, `F = ${sci(f.F, 3)} N`, { color: '--body-0' });
    }
    if (!narrow) for (const f of fr.filter(q => !q.near && q.i === 1)) label(ctx, view, [f.from[0], f.from[1], ZB + 0.3], `cross-pull ${sci(f.F, 2)} N`, { color: '--body-2', dy: -10, align: 'center' });
  }
  // readout card: what the experimenter actually sees
  const ol = opticalLever(sim.theta);
  const W = narrow ? view.W - 20 : 300, x0 = narrow ? 10 : view.W - W - 14, h = 112, y0 = view.H - h - 96;   // above the timeline bar
  ctx.fillStyle = C('--panel'); ctx.globalAlpha = 0.86; ctx.fillRect(x0, y0, W, h); ctx.globalAlpha = 1;
  ctx.strokeStyle = C('--line-strong'); ctx.strokeRect(x0 + 0.5, y0 + 0.5, W - 1, h - 1);
  ctx.font = '600 11.5px ui-sans-serif, system-ui'; ctx.fillStyle = C('--ink');
  ctx.fillText('Optical lever: light spot on the scale (true scale)', x0 + 10, y0 + 17);
  // ruler ±25 mm around the zero position with the spot
  const rx0 = x0 + 14, rx1 = x0 + W - 14, ry = y0 + 44, span = Math.max(25, Math.ceil(Math.abs(ol.shift * 1e3) / 25) * 25), X = mm => (rx0 + rx1) / 2 + mm / span * (rx1 - rx0) / 2;
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(rx0, ry); ctx.lineTo(rx1, ry); ctx.stroke();
  ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.fillStyle = C('--muted'); ctx.textAlign = 'center';
  const tick = span / 5;
  for (let v = -span; v <= span + 1e-9; v += tick) { ctx.beginPath(); ctx.moveTo(X(v), ry - 5); ctx.lineTo(X(v), ry + 5); ctx.stroke(); ctx.fillText(`${Math.round(v)}`, X(v), ry + 16); }
  ctx.fillText('mm', rx1 - 4, ry - 9);
  ctx.textAlign = 'left';
  const sx = X(ol.shift * 1e3);
  const grd = ctx.createRadialGradient(sx, ry, 0, sx, ry, 9); grd.addColorStop(0, C('--warn')); grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(sx, ry, 9, 0, 7); ctx.fill();
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.fillStyle = C('--ink-2');
  ctx.fillText(`spot ${(ol.shift * 1e3).toFixed(2)} mm ≈ 2Dθ   θ = ${(sim.theta * 1e3).toFixed(3)} mrad`, x0 + 10, y0 + 80);
  ctx.fillStyle = C('--muted');
  ctx.fillText(`arm end moves aθ = ${(ap.a * sim.theta * 1e3).toFixed(3)} mm (×${(2 * view3.D / ap.a).toFixed(1)})`, x0 + 10, y0 + 98);
  // status line
  const status = sim.swinging() ? 'large balls swinging…' : sim.side === 0 ? 'large balls: midway (no net torque)' : `large balls: position ${sim.side > 0 ? 'A' : 'B'}`;
  ctx.font = '12px ui-sans-serif, system-ui';
  const baseY = narrow ? y0 - 8 : view.H - 100;   // above the timeline bar
  ctx.fillStyle = C('--ink-2'); ctx.fillText(`${status} · next swing at ${sim.nextSwing().toFixed(0)} min`, 12, baseY);
  if (mag > 1) { ctx.fillStyle = C('--warn'); ctx.fillText(`beam rotation drawn ×${mag} (true angle in the readout)`, 12, baseY - 16); }
  if (sim.contact) { ctx.fillStyle = C('--bad'); ctx.fillText(`balls touched at ${(sim.contact.t / 60).toFixed(1)} min: outside the model`, 12, baseY - 32); }
}

// ------------------------------------------------------------------ workbench: equations and figures
function bench({ eqs, figs, createPlot, createEquation, createDerivation, M }) {
  // a value that exists only after a swing to each side has been fitted
  const pend = (v, k, d) => (v == null || !Number.isFinite(v) ? 'after a swing to each side' : +(v * k).toPrecision(d));
  const cur = { sim: null };
  const S = () => cur.sim, A = () => cur.sim.ap;
  const thPlot = createPlot({ title: 'Beam angle θ(t): readings, computed motion and fitted damped oscillations', height: 300,
    x: { label: 'time since start', unit: 'min', min: 0, max: 240 }, y: { label: 'θ', unit: 'mrad' } });
  const gPlot = createPlot({ title: 'G from the period and the deflection', height: 260,
    x: { label: 'time of the swing that closes each A/B pair', unit: 'min', min: 0, max: 240 }, y: { label: 'G', unit: '10⁻¹¹ m³ kg⁻¹ s⁻²', min: 6.5, max: 6.9 } });
  const rhoPlot = createPlot({ title: 'Earth’s mean density: 1 this run · 2 Cavendish 1798 · 3 his data re-averaged · 4 today', height: 240,
    x: { label: 'estimate', min: 0.5, max: 4.9 }, y: { label: 'ρ⊕', unit: 'g/cm³ (= × water)', min: 5.2, max: 5.8 } });
  figs.append(thPlot.el, gPlot.el, rhoPlot.el);

  const th = M.i('θ'), I_ = M.i('I'), k_ = M.i('κ'), c_ = M.i('c');
  const motion = createEquation({
    title: 'Equation of motion of the beam (live values, N m)',
    lhs: { mathml: `${I_}<mover><mi>θ</mi><mo>¨</mo></mover>`, label: 'angular acceleration × moment of inertia', unit: 'N m', value: () => { const s = S(), a = A(); return -a.kappa * s.theta - a.c * s.omega + a.G * geoTorque(a, s.theta, s.psi).tau; } },
    terms: [
      { id: 'wire', mathml: `<mo>−</mo>${k_}${th}`, label: 'wire twist (restoring)', color: '--body-1', unit: 'N m', value: () => -A().kappa * S().theta },
      { id: 'damp', mathml: `<mo>−</mo>${c_}<mover><mi>θ</mi><mo>˙</mo></mover>`, label: 'damping', color: '--muted', unit: 'N m', value: () => -A().c * S().omega },
      { id: 'grav', mathml: M.sub(M.i('τ'), M.i('g')), label: 'gravity of the 4 ball pairs', color: '--body-0', unit: 'N m', value: () => A().G * geoTorque(A(), S().theta, S().psi).tau },
    ],
    where: [
      { mathml: I_, meaning: 'moment of inertia 2m(a² + ⅖r_s²), a = L/2', value: () => A().I, unit: 'kg m²' },
      { mathml: `${k_}<mo>=</mo>${I_}${M.sup(M.paren(`<mn>2</mn><mi>π</mi><mo>/</mo>${M.sub(M.i('T'), M.n(0))}`), M.n(2))}`, meaning: 'torsion constant from the free period', value: () => A().kappa, unit: 'N m/rad' },
    ],
    link: thPlot,
  });
  const torque = createEquation({
    title: 'Gravitational torque at θ = 0 with the balls at A: near pull minus the far ball’s cross-pull',
    lhs: { mathml: M.sub(M.i('τ'), M.i('g')), label: 'total', unit: 'N m', value: () => A().G * geoTorque(A(), 0, A().psiA).tau },
    terms: [
      { id: 'near', mathml: `<mn>2</mn>${M.frac(`${M.i('G')}${M.i('M')}${M.i('m')}`, M.sup(M.i('r'), M.n(2)))}${M.i('a')}`, label: 'near large ball (both sides)', color: '--body-0', unit: 'N m', value: () => { const a = A(); return 2 * a.G * a.M * a.m / a.r ** 2 * a.a; } },
      { id: 'cross', sign: '−', mathml: `<mn>2</mn>${M.frac(`${M.i('G')}${M.i('M')}${M.i('m')}${M.i('r')}`, M.sup(M.i('d'), M.n(3)))}${M.i('a')}`, label: 'far large ball, d = √(L² + r²)', color: '--body-2', unit: 'N m', value: () => { const a = A(), d = Math.hypot(a.L, a.r); return 2 * a.G * a.M * a.m * a.r / d ** 3 * a.a; } },
    ],
  });
  const invert = createEquation({
    title: 'G from the readings (exact inversion of the model; cross-pull, damping and the gravity “negative spring” included)',
    lhs: { mathml: M.i('G'), label: 'measured', unit: '×10⁻¹¹', digits: 5, value: () => pend(S().analysis().combined?.G, 1e11, 5) },
    terms: [{ id: 'inv', mathml: M.frac(`${I_}${M.sup(M.i('Ω'), M.n(2))}<mi>Δ</mi>${th}`, `<mi>Δ</mi>${M.i('g')}<mo>−</mo>${M.i('g′')}<mi>Δ</mi>${th}`), label: 'Ω² = ω² + γ² from the fits, Δθ = θ_A − θ_B', color: '--accent', unit: '×10⁻¹¹', digits: 5, value: () => pend(S().analysis().combined?.G, 1e11, 5) }],
    where: [
      { mathml: `<mi>Δ</mi>${th}`, meaning: 'equilibrium shift between positions A and B (fits)', unit: 'mrad', value: () => { const p = S().analysis().pairs; return p.length ? p[p.length - 1].dth * 1e3 : 'after a swing to each side'; } },
      { mathml: M.i('T'), meaning: 'fitted period', unit: 'min', value: () => pend(S().analysis().combined?.period, 1 / 60, 5) },
      { mathml: `${M.i('G')}<mo>=</mo>${M.frac(`<mn>2</mn>${M.sup(M.i('π'), M.n(2))}${M.i('L')}${M.sup(M.i('r'), M.n(2))}${th}`, `${M.i('M')}${M.sup(M.i('T'), M.n(2))}`)}`, meaning: 'textbook shortcut, θ = Δθ/2 (no corrections)', unit: '×10⁻¹¹', digits: 5, value: () => { const p = S().analysis().pairs; return p.length ? p.reduce((x, q) => x + q.Gtext, 0) / p.length * 1e11 : 'after a swing to each side'; } },
    ],
    link: gPlot,
  });
  const earth = createEquation({
    title: 'Weighing the Earth: g = GM⊕/R² gives its mass and mean density',
    lhs: { mathml: M.sub(M.i('ρ'), M.i('⊕')), label: 'mean density (this run)', unit: 'g/cm³', digits: 4, value: () => pend(S().analysis().combined?.rho, 1e-3, 4) },
    terms: [{ id: 'rho', mathml: M.frac(`<mn>3</mn>${M.i('g')}`, `<mn>4</mn><mi>π</mi>${M.i('R')}${M.i('G')}`), label: 'g = 9.80665 m/s², R = 6371 km', color: '--body-3', unit: 'g/cm³', digits: 4, value: () => pend(S().analysis().combined?.rho, 1e-3, 4) }],
    where: [
      { mathml: `${M.sub(M.i('M'), M.i('⊕'))}<mo>=</mo>${M.frac(`${M.i('g')}${M.sup(M.i('R'), M.n(2))}`, M.i('G'))}`, meaning: `mass of the Earth (today: ${sci(M_EARTH, 4)} kg)`, unit: 'kg', value: () => pend(S().analysis().combined?.mass, 1, 4) },
    ],
    link: rhoPlot,
  });
  const steps = createDerivation([
    { mathml: `${M.i('F')}<mo>=</mo>${M.frac(`${M.i('G')}${M.i('M')}${M.i('m')}`, M.sup(M.i('r'), M.n(2)))}<mo>≈</mo><mn>1.5</mn><mo>×</mo>${M.sup(M.n(10), M.n('−7'))}<mtext>&#160;N</mtext>`, note: 'The pull of a 158 kg ball on a 0.73 kg ball 22.5 cm away: the weight of about 15 micrograms, 50 million times less than the small ball’s own weight.' },
    { mathml: `${M.sub(M.i('τ'), M.i('g'))}<mo>≈</mo><mn>2</mn>${M.i('F')}${M.i('a')}<mo>≈</mo><mn>2.7</mn><mo>×</mo>${M.sup(M.n(10), M.n('−7'))}<mtext>&#160;N m</mtext>`, note: 'Both ends are pulled the same way round, on a 0.9 m lever arm.' },
    { mathml: `${k_}<mo>=</mo>${I_}${M.sup(M.paren(`<mn>2</mn><mi>π</mi><mo>/</mo>${M.i('T')}`), M.n(2))}<mo>≈</mo><mn>2.3</mn><mo>×</mo>${M.sup(M.n(10), M.n('−4'))}<mtext>&#160;N m/rad</mtext>`, note: 'A 7.5-minute period means a wire that resists twisting extremely weakly; this is why the tiny torque turns the beam at all, and why the period measures κ without ever measuring the wire.' },
    { mathml: `${th}<mo>=</mo>${M.sub(M.i('τ'), M.i('g'))}<mo>/</mo>${k_}<mo>≈</mo><mn>1.2</mn><mtext>&#160;mrad</mtext><mo>,</mo><mspace width="0.6em"/>${M.i('a')}${th}<mo>≈</mo><mn>1.1</mn><mtext>&#160;mm</mtext>`, note: 'The ball moves about a millimetre. Cavendish watched a vernier on the arm end through telescopes in the shed walls, reading to 0.01 in (0.25 mm).' },
    { mathml: `<mi>Δ</mi>${M.i('x')}<mo>=</mo><mn>2</mn>${M.i('D')}${th}`, note: 'Optical lever (later instruments, e.g. Boys 1895, and classroom balances): turning a mirror by θ turns the reflected ray by 2θ, so a scale D metres away magnifies the angle by 2D; with D = 3 m the spot moves ~7 mm per mrad.' },
  ], { title: 'Why the force is so small, and how such a small angle is read' });
  eqs.append(motion.el, torque.el, invert.el, earth.el, steps);

  let shown = new Set(), last = { n: -1, sw: -1, sim: null };
  const put = (plot, id, kind, ...args) => { plot[kind](id, ...args); shown.add(`${plot === thPlot ? 't' : plot === gPlot ? 'g' : 'r'}:${id}`); };
  const rhoRefs = () => {
    const pts = [[2, CAVENDISH.rho], [3, CAVENDISH.rhoCorrected], [4, RHO_EARTH / 1000]];
    rhoPlot.data('refs', pts, { dots: true, color: '--muted', errors: [0, CAVENDISH.rhoCorrectedErr, 0], r: 4 });
    rhoPlot.marker('m2', 2, CAVENDISH.rho, { color: '--body-4', label: 'Cavendish 5.48' });
    rhoPlot.marker('m3', 3, CAVENDISH.rhoCorrected, { color: '--body-4', label: '5.448 ± 0.033' });
    rhoPlot.marker('m4', 4, RHO_EARTH / 1000, { color: '--good', label: (RHO_EARTH / 1000).toFixed(3) });
  };
  rhoRefs();

  return {
    update(sim, t, { rebuilt }) {
      cur.sim = sim;
      motion.update(); torque.update(); invert.update(); earth.update();
      if (rebuilt || last.sim !== sim) {
        for (const key of shown) { const [p, id] = [key[0], key.slice(2)]; ({ t: thPlot, g: gPlot, r: rhoPlot })[p].remove(id); }
        shown = new Set(); last = { n: -1, sw: -1, sim };
      }
      const R = sim.readings;
      if (R.length === last.n && sim.swings.length === last.sw) { thPlot.draw(); gPlot.draw(); rhoPlot.draw(); return; }
      last.n = R.length; last.sw = sim.swings.length;
      const tMax = Math.max(90, Math.ceil((sim.t + 20) / 30) * 30);
      thPlot.setX({ min: 0, max: tMax }); gPlot.setX({ min: 0, max: tMax });
      const stride = Math.max(1, Math.ceil(R.length / 1500));
      const reads = [], truth = [];
      for (let i = 0; i < R.length; i += stride) { reads.push([R[i].t / 60, R[i].read * 1e3]); truth.push([R[i].t / 60, R[i].truth * 1e3]); }
      sim.swings.forEach((s, k) => put(thPlot, `sw${k}`, 'band', s.t0 / 60, s.t1 / 60, { label: k === 0 ? 'swing' : '', alpha: 0.5 }));
      if (sim.params.sigma > 0) put(thPlot, 'reads', 'data', reads, { dots: true, r: 1.3, color: '--muted', label: 'readings (with noise)' });
      put(thPlot, 'truth', 'data', truth, { color: '--body-1', label: 'computed θ(t)', width: 1.4 });
      const an = sim.analysis();
      an.segs.forEach((sg, k) => {
        if (!sg.fit) return;
        const f = sg.fit, pts = [];
        for (let i = 0; i <= 160; i++) { const tt = sg.tStart + (sg.tEnd - sg.tStart) * i / 160, tau = tt - f.t0, e = Math.exp(-f.gamma * tau); pts.push([tt / 60, (f.thetaEq + e * (f.A * Math.cos(f.omega * tau) + f.B * Math.sin(f.omega * tau))) * 1e3]); }
        put(thPlot, `fit${k}`, 'data', pts, { color: '--body-0', dash: true, width: 1.6, label: k === an.segs.findIndex(q => q.fit) ? 'fitted damped sine' : '' });
        put(thPlot, `eq${k}`, 'data', [[sg.tStart / 60, f.thetaEq * 1e3], [sg.tEnd / 60, f.thetaEq * 1e3]], { color: sg.side === 'A' ? '--body-3' : '--body-2', width: 2.4, label: k < 2 ? `θ_eq at ${sg.side}` : '' });
      });
      // G figure
      const Gin = sim.ap.G * 1e11, Gc = 3 * gn / (4 * Math.PI * RearthMean * CAVENDISH.rho * RHO_WATER) * 1e11, Gcc = 3 * gn / (4 * Math.PI * RearthMean * CAVENDISH.rhoCorrected * RHO_WATER) * 1e11;
      const ys = [Gin, G_CODATA * 1e11, Gc, Gcc, ...an.pairs.map(q => q.G * 1e11)];
      const cmb = an.combined;
      if (cmb?.err != null) ys.push((cmb.G + 2 * cmb.err) * 1e11, (cmb.G - 2 * cmb.err) * 1e11);
      const lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(0.02, (hi - lo) * 0.15);
      gPlot.setY({ min: lo - pad, max: hi + pad });
      put(gPlot, 'codata', 'hline', G_CODATA * 1e11, { color: '--good', label: 'CODATA 2018: 6.6743' });
      if (Math.abs(Gin - G_CODATA * 1e11) > 1e-6) put(gPlot, 'gin', 'hline', Gin, { color: '--accent', label: `model input ${Gin.toFixed(4)}` });
      put(gPlot, 'cav', 'hline', Gc, { color: '--body-4', label: `Cavendish ρ⊕ = 5.48 ⇒ ${Gc.toFixed(3)}` });
      put(gPlot, 'cav2', 'hline', Gcc, { color: '--muted', label: `5.448 ⇒ ${Gcc.toFixed(3)}` });
      if (an.pairs.length) {
        put(gPlot, 'pairs', 'data', an.pairs.map(q => [q.tSwing / 60, q.G * 1e11]), { dots: true, r: 3, color: '--body-0', label: 'each A/B pair (inversion)' });
        put(gPlot, 'text', 'data', an.pairs.map(q => [q.tSwing / 60, q.Gtext * 1e11]), { dots: true, r: 2.2, color: '--muted', label: 'textbook shortcut' });
      }
      if (cmb?.err != null) put(gPlot, 'comb', 'data', [[sim.t, cmb.G * 1e11]], { dots: true, r: 4.5, color: '--accent', errors: [cmb.err * 1e11], label: `combined ${(cmb.G * 1e11).toFixed(4)} ± ${(cmb.err * 1e11).toFixed(4)} (jackknife)` });
      // density figure
      if (cmb) {
        put(rhoPlot, 'run', 'data', [[1, cmb.rho / 1000]], { dots: true, r: 4.5, color: '--accent', errors: [(cmb.rhoErr ?? NaN) / 1000], label: 'this run' });
        put(rhoPlot, 'runm', 'marker', 1, cmb.rho / 1000, { color: '--accent', label: cmb.rhoErr != null ? `${(cmb.rho / 1000).toFixed(3)} ± ${(cmb.rhoErr / 1000).toFixed(3)}` : (cmb.rho / 1000).toFixed(3) });
        const v = [cmb.rho / 1000, 5.448 - 0.04, 5.52];
        if (cmb.rhoErr != null) v.push((cmb.rho + 2 * cmb.rhoErr) / 1000, (cmb.rho - 2 * cmb.rhoErr) / 1000);
        rhoPlot.setY({ min: Math.min(5.38, ...v) - 0.03, max: Math.max(5.58, ...v) + 0.05 });
      }
      thPlot.invalidate(); gPlot.invalidate(); rhoPlot.invalidate();
      thPlot.draw(); gPlot.draw(); rhoPlot.draw();
    },
  };
}

// ------------------------------------------------------------------ the instrument
const inst = createInstrument({

  },
  timeUnit: 'min', timeLabel: 'time since start', timeDigits: 1, speed: 3, speedRange: [0.05, 60], duration: 482,

  presets: [

    { label: 'Cavendish, first wire (15 min)', values: { G: 6.6743, T0: 15, M: 158, m: 0.73, L: 1.8, r: 0.225, sigma: 0.1 } },

      select([{ value: 'auto', label: 'magnified (auto, labelled)' }, { value: 'true', label: 'true scale' }], 'auto', v => { view3.mag = v; })));
    body.append(slider({ label: 'Optical lever: scale distance D', min: 1, max: 6, value: 3, unit: 'm', digits: 2, onInput: v => { view3.D = v; } }));
    body.append(toggle('Force arrows', true, v => { view3.forces = v; }));

  onPointer(canvas) { cam.attach(canvas); },

  model: {

    equations: [

// GPU self-test: the large ball and the optical-lever spot are drawn where the camera puts them
window.psim.selfTest = () => {
  const glc = document.querySelector('canvas.psim-gl'), gl = glc?.getContext('webgl2');
  if (!gl) return { label: 'WebGL2 available', pass: false };
  const sim = inst.sim, view = inst.view;
  drawGL(gl, sim, view);
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight, dpr = W / view.W;
  const px = p => { const q = cam.project(p, view.W, view.H), b = new Uint8Array(4); gl.readPixels(Math.round(q.x * dpr), Math.round(H - 1 - q.y * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); return [...b]; };
  const P = [sim.ap.Rarm * Math.cos(sim.psi), sim.ap.Rarm * Math.sin(sim.psi), ZB];
  const ball = px(P), sky = px([0, -3, WIRE_TOP + 2.5]);
  const mag = magOf(sim), ol = opticalLever(1e-3), lever = Math.abs(ol.shift) / 1e-3 / (2 * view3.D);
  return [
    { label: 'Large ball rendered at its computed position', ball, sky, pass: ball[3] > 200 && sky[3] === 0 },
    { label: "Optical lever: |spot shift| = 2Dθ (small angle)", ratio: +lever.toFixed(5), pass: Math.abs(lever - 1) < 0.02 },
    { label: 'Magnification keeps balls apart', mag, pass: mag >= 1 && sim.ap.a * 3 * Math.abs(sim.equilibrium(sim.ap.psiA)) * mag <= 0.5 * (sim.ap.r - sim.ap.rs - sim.ap.RL) + 1e-12 },
  ];
};
