:root {

  --body-3: #9be08a;

    const t2 = t[0] ** 2 + t[1] ** 2 + t[2] ** 2;

    const s = t.map(q => 2 * q / (1 + t2));
    const uplus = [um[0] + up[1] * s[2] - up[2] * s[1], um[1] + up[2] * s[0] - up[0] * s[2], um[2] + up[0] * s[1] - up[1] * s[0]];
    for (let k = 0; k < 3; k++) u[k] = uplus[k] + h * E[k];
    const gn = gammaOf(u);
    for (let k = 0; k < 3; k++) x[k] += u[k] / gn * dt;
    tS += dt; steps++;
    if (steps % Math.max(1, Math.round(p.stepsPerGyration / 128)) === 0) {
      trail.push([...x]);
      if (trail.length > 6000) trail.splice(0, trail.length - 6000);
    }
    if (rows.length < 100000 && steps % Math.max(1, Math.round(p.stepsPerGyration / 64)) === 0) {
      rows.push([tS * NS, ...x, ...u.map(q => q / gn)]);
    }
  }

  return {
    get t() { return tS * NS; },
    dt, analytic: a, x, u, trail, params: p,
    step,
    gamma: () => gammaOf(u),
    diagnostics() {
      const g = gammaOf(u);
      const list = [];
      if (!p.E) list.push({ key: 'dg', label: '|Δγ/γ₀| (energy)', value: Math.abs(g - gamma0) / gamma0, kind: 'error', good: 1e-12, warn: 1e-9 });
      list.push(
        { key: 'r', label: 'Gyroradius r = γmv⊥/(qB)', value: a.radius, kind: 'value', unit: 'm' },
        { key: 'T', label: 'Gyroperiod T = 2πγm/(qB)', value: a.period * NS, kind: 'value', unit: 'ns' },
        { key: 'g', label: 'Lorentz factor γ', value: g, kind: 'value' },
        { key: 'beta', label: 'Speed v/c', value: Math.sqrt(1 - 1 / (g * g)), kind: 'value' },
      );
      if (p.E) list.push({ key: 'vd', label: 'E×B drift E/B', value: p.E / p.B, kind: 'value', unit: 'm/s' });
      list.push({ key: 'steps', label: 'Steps', value: steps, kind: 'value', text: steps.toLocaleString() });
      return list;
    },
    state: () => ({ x: [...x], v: u.map(q => q / gammaOf(u)), steps }),
    record: () => ({ header: ['t_ns', 'x_m', 'y_m', 'z_m', 'vx_m_s', 'vy_m_s', 'vz_m_s'], rows }),
  };
}

// ------------------------------------------------------------------ verification

function run(p, gyrations) {
  const sim = createSim(p);
  const n = Math.round(gyrations * p.stepsPerGyration);
  let rMax = 0, rMin = Infinity;
  for (let i = 0; i < n; i++) {
    sim.step();
    const r = Math.hypot(sim.x[0], sim.x[1]);
    rMax = Math.max(rMax, r); rMin = Math.min(rMin, r);
  }
  return { sim, rMax, rMin };
}

/** Phase error after one analytic period, as an angle (E = 0). */
function phaseError(p) {
  const { sim } = run(p, 1);
  const ang = Math.atan2(sim.x[1], sim.x[0]);
  return Math.abs(Math.atan2(Math.sin(ang + Math.PI / 2), Math.cos(ang + Math.PI / 2)));
}

function verify() {
  const checks = [];
  const base = { B: 1, KE: 1, pitch: 90, E: 0, stepsPerGyration: 256 };

  // 1. Energy: a pure magnetic field does no work; Boris conserves |u| to round-off.
  const e1 = run(base, 200);
  const dg = Math.abs(e1.sim.gamma() - e1.sim.analytic.gamma) / e1.sim.analytic.gamma;
  checks.push({ label: 'Energy conserved in pure B (200 gyrations)', value: `|Δγ/γ| = ${dg.toExponential(2)}`, pass: dg < 1e-13 });

  // 2. Orbit radius matches Boris' known discrete radius r·√(1+(ΩΔt/2)²), and → r as Δt → 0.
  const a = e1.sim.analytic, w = a.omega * e1.sim.dt;
  const rPred = a.radius * Math.sqrt(1 + (w / 2) ** 2);
  const rMeas = (e1.rMax + e1.rMin) / 2;
  const relR = Math.abs(rMeas - rPred) / rPred;
  checks.push({ label: 'Orbit radius vs exact discrete-Boris radius', value: `rel. diff ${relR.toExponential(2)}`, pass: relR < 1e-9 });
  const rErr = Math.abs(rMeas - a.radius) / a.radius;
  checks.push({ label: 'Orbit radius vs analytic γmv⊥/(qB), 256 steps/gyration', value: `rel. err ${rErr.toExponential(2)}`, pass: rErr < 1e-4 });

  // 2b. Orbit centred on the origin (half-step start): extremes of the discrete circle.
  {
    const cs = createSim({ ...base, stepsPerGyration: 32 });
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < 32 * 100; i++) {
      cs.step();
      x0 = Math.min(x0, cs.x[0]); x1 = Math.max(x1, cs.x[0]); y0 = Math.min(y0, cs.x[1]); y1 = Math.max(y1, cs.x[1]);
    }
    const off = Math.hypot((x0 + x1) / 2, (y0 + y1) / 2) / cs.analytic.radius;
    checks.push({ label: 'Orbit centred on the guiding centre (32 steps/gyration)', value: `offset ${off.toExponential(1)} r`, pass: off < 1e-4 });
  }

  // 3. Convergence: phase error after one period scales as Δt² (2nd-order method).
  const pe = [128, 256, 512].map(s => phaseError({ ...base, stepsPerGyration: s }));
  const order = Math.log2(pe[1] / pe[2]);
  checks.push({ label: 'Phase-error convergence order (expected 2)', value: order.toFixed(2), pass: Math.abs(order - 2) < 0.1 });

  // 4. Relativistic gyroperiod at 1 GeV: measure the period from orbit crossings.
  const rel = { ...base, KE: 1000, stepsPerGyration: 2048 };
  const sim = createSim(rel);
  const crossings = [];
  let prevX = sim.x[0], tPrev = 0;
  while (crossings.length < 6) {
    tPrev = sim.t; prevX = sim.x[0];
    sim.step();
    if (prevX < 0 && sim.x[0] >= 0) crossings.push(tPrev + (sim.t - tPrev) * (-prevX) / (sim.x[0] - prevX));
  }
  const Tmeas = (crossings[5] - crossings[0]) / 5;
  const Tex = sim.analytic.period * 1e9;
  const relT = Math.abs(Tmeas - Tex) / Tex;
  checks.push({ label: `Relativistic gyroperiod at 1 GeV (γ = ${sim.analytic.gamma.toFixed(4)})`, value: `${Tmeas.toFixed(4)} ns vs ${Tex.toFixed(4)} ns`, pass: relT < 1e-5 });

  // 5. E×B drift: guiding-centre velocity averaged over whole gyrations equals E/B.
  const drift = { B: 1, KE: 0.01, pitch: 90, E: 1e4, stepsPerGyration: 512 };
  // Guiding centre R = x + (γm/(qB)) (w × B̂), with w = v − v_E the velocity in the drift
  // frame: removes the gyration exactly, so ΔR/Δt is the drift velocity.
  const ds = createSim(drift);
  const vE = drift.E / drift.B;
  const gc = () => {
    const g = ds.gamma(), vx = ds.u[0] / g, vy = ds.u[1] / g;
    const k = g * mp / (qe * drift.B);
    // (w × ẑ) = (w_y, −w_x, 0), with w = (v_x − v_E, v_y)
    return [ds.x[0] + k * vy, ds.x[1] - k * (vx - vE)];
  };
  const R0 = gc(), t0 = ds.t;
  for (let i = 0; i < 50 * drift.stepsPerGyration; i++) ds.step();
  const R1 = gc();
  const vd = (R1[0] - R0[0]) / ((ds.t - t0) * 1e-9);
  const relD = Math.abs(vd - drift.E / drift.B) / (drift.E / drift.B);
  checks.push({ label: 'E×B drift speed vs E/B (non-relativistic)', value: `${vd.toFixed(1)} vs ${(drift.E / drift.B).toFixed(1)} m/s`, pass: relD < 1e-3 });

  return {
    summary: 'Relativistic Boris pusher checked against exact single-particle results:',
    checks,
    notes: ['Radiation reaction (synchrotron loss) is neglected; for protons below TeV energies in ≤10 T it is many orders of magnitude below the integration error.'],
  };
}

return { PARAMS, analytic, createSim, verify };
})();

// ---- page
const { createInstrument } = __psim["ui/instrument-app.mjs"];
const { sci } = __psim["ui/instrument.mjs"];
const { PARAMS, createSim } = __psim["local:physics.mjs"];
const BOLD_B = '𝐁', BOLD_E = '𝐄', BOLD_U = '𝐮';
// yaw about B; elev = angle of the eye above the orbital plane (0: side-on, π/2: looking down B).
const cam = { yaw: -0.55, elev: 0.42 };

function project(view, p, scale, center) {
  const x = p[0] - center[0], y = p[1] - center[1], z = p[2] - center[2];
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = cy * x - sy * y, y1 = sy * x + cy * y;
  const ce = Math.cos(cam.elev), se = Math.sin(cam.elev);
  const up = ce * z + se * y1;            // +z (along B) points up the screen
  return [view.W / 2 + x1 * scale, view.H / 2 - up * scale, ce * y1 - se * z];
}

function niceStep(raw) {
  const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e;
}
function fmtLen(m) {
  if (m >= 1) return `${+m.toPrecision(3)} m`;
  if (m >= 1e-2) return `${+(m * 100).toPrecision(3)} cm`;
  if (m >= 1e-3) return `${+(m * 1000).toPrecision(3)} mm`;
  return `${+(m * 1e6).toPrecision(3)} µm`;
}

function draw(ctx, sim, view) {
  const C = view.color;
  const a = sim.analytic, p = sim.params;
  const r = a.radius;
  const scale = 0.2 * Math.min(view.W, view.H) / r;
  // Follow the particle along B and the guiding centre across it.
  const vE = p.E / p.B;
  const center = [p.E ? sim.x[0] - (sim.x[0] - vE * sim.t * 1e-9) : 0, 0, sim.x[2]];
  if (p.E) center[0] = vE * sim.t * 1e-9;

  // Field lines: B ∥ ẑ, uniform. Drawn as a lattice of parallel lines with direction ticks.
  const step = niceStep(r * 1.1);
  ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {for (let j = -2; j <= 2; j++) {
    const px = Math.round(center[0] / step) * step + i * step, py = j * step;
    const zSpan = 3 * r;
    const A = project(view, [px, py, center[2] - zSpan], scale, center);
    const B = project(view, [px, py, center[2] + zSpan], scale, center);
    ctx.strokeStyle = C('--grid-strong');
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    // direction tick (chevron) at a z that scrolls with the field, not with time
    const zt = Math.floor(center[2] / step) * step + step / 2;
    const T0 = project(view, [px, py, zt], scale, center), T1 = project(view, [px, py, zt + step * 0.12], scale, center);
    const ang = Math.atan2(T1[1] - T0[1], T1[0] - T0[0]);
    ctx.fillStyle = C('--grid-strong');
    ctx.beginPath(); ctx.moveTo(T1[0], T1[1]);
    ctx.lineTo(T1[0] - 6 * Math.cos(ang - 0.5), T1[1] - 6 * Math.sin(ang - 0.5));
    ctx.lineTo(T1[0] - 6 * Math.cos(ang + 0.5), T1[1] - 6 * Math.sin(ang + 0.5));
    ctx.fill();
  }}

  // Analytic gyro-circle (E = 0 only): exact reference the computed orbit should overlay.
  if (!p.E) {
    ctx.setLineDash([3, 5]); ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k <= 96; k++) {
      const th = 2 * Math.PI * k / 96;
      const Q = project(view, [r * Math.cos(th), r * Math.sin(th), sim.x[2]], scale, center);
      k ? ctx.lineTo(Q[0], Q[1]) : ctx.moveTo(Q[0], Q[1]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Computed trajectory (integrator states only).
  const tr = sim.trail;
  const N = tr.length, CH = 24;
  const col = C('--body-1');
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const per = Math.max(1, Math.ceil(N / CH));
  for (let c = 0; c * per < N - 1; c++) {
    const i0 = c * per, i1 = Math.min(N - 1, (c + 1) * per);
    const age = 1 - i1 / (N - 1);
    ctx.globalAlpha = 0.08 + 0.92 * Math.pow(1 - age, 1.5);
    ctx.lineWidth = 0.7 + 1.1 * (1 - age);
    ctx.beginPath();
    for (let i = i0; i <= i1; i++) { const Q = project(view, tr[i], scale, center); i === i0 ? ctx.moveTo(Q[0], Q[1]) : ctx.lineTo(Q[0], Q[1]); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const last = project(view, tr[N - 1], scale, center), P = project(view, sim.x, scale, center);
  ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(P[0], P[1]); ctx.stroke();

  // Proton marker and velocity direction.
  const g = sim.gamma(), v = sim.u.map(q => q / g), vn = Math.hypot(...v);
  const V = project(view, [sim.x[0] + v[0] / vn * r * 0.45, sim.x[1] + v[1] / vn * r * 0.45, sim.x[2] + v[2] / vn * r * 0.45], scale, center);
  ctx.strokeStyle = C('--ink-2'); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(V[0], V[1]); ctx.stroke();
  const glow = C('--glow') === '1';
  if (glow) {
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(P[0], P[1], 0, P[0], P[1], 34);
    gr.addColorStop(0, 'rgba(255,111,154,0.55)'); gr.addColorStop(1, 'rgba(255,111,154,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(P[0], P[1], 34, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = C('--body-2');
  ctx.beginPath(); ctx.arc(P[0], P[1], 6, 0, 7); ctx.fill();
  ctx.fillStyle = glow ? 'rgba(255,255,255,0.9)' : C('--panel');
  ctx.font = '600 9px ui-sans-serif, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', P[0], P[1] + 0.5);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

  // Labels and scale bar.
  ctx.fillStyle = C('--muted'); ctx.font = '11px ui-monospace, Menlo, monospace';
  const lb = project(view, [Math.round(center[0] / step) * step + 2 * step, -2 * step, center[2] + 1.6 * r], scale, center);
  ctx.fillText(`${BOLD_B} = ${p.B} T ẑ`, lb[0] + 6, lb[1]);
  if (p.E) ctx.fillText(`${BOLD_E} = ${sci(p.E, 2)} V/m ŷ   drift → x̂`, 16, view.H - 64);
  const bar = niceStep(r * 0.8);
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(16, view.H - 34); ctx.lineTo(16, view.H - 28); ctx.lineTo(16 + bar * scale, view.H - 28); ctx.lineTo(16 + bar * scale, view.H - 34); ctx.stroke();
  ctx.fillText(fmtLen(bar), 16, view.H - 14);
}

function onPointer(canvas) {
  let drag = null;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, elev: cam.elev }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.yaw = drag.yaw + (e.clientX - drag.x) * 0.006;
    cam.elev = Math.max(0, Math.min(Math.PI / 2, drag.elev + (e.clientY - drag.y) * 0.006));
  });
  const end = () => { drag = null; canvas.style.cursor = 'grab'; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', () => { cam.yaw = -0.55; cam.elev = 0.42; });
}

    conventions: [

    ],
    references: [
      'J. P. Boris, Proc. 4th Conf. Numerical Simulation of Plasmas (1970).',

      'H. Qin et al., Phys. Plasmas 20, 084503 (2013): why the Boris algorithm conserves phase-space volume.',
    ],
  },
});
