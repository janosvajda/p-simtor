<style>/* psim:ui/instrument.css */
/* p-simtor instrument shell.
   A simulation page is a scientific instrument: a large stage for the physics,
   a quiet control column, and numbers you can trust at a glance.
   Colours are tokens so every domain view (orbits, fields, densities) can read them. */

:root {
  --bg: #07090d;
  --stage: #0a0d13;
  --panel: #0e1219;
  --raise: #141923;
  --line: rgba(196, 214, 255, 0.09);
  --line-strong: rgba(196, 214, 255, 0.18);
  --ink: #e6e9ef;
  --ink-2: #b6bdcb;
  --muted: #7b8396;
  --faint: #4a5163;
  --accent: #8cc8ff;
  --accent-ink: #06121f;
  --good: #7fd8a4;
  --warn: #f2c46d;
  --bad: #ff7a85;
  --grid: rgba(150, 175, 230, 0.06);
  --grid-strong: rgba(150, 175, 230, 0.13);
  --glow: 1;
  --body-0: #ffb35c;
  --body-1: #68c3ff;
  --body-2: #ff6f9a;
  --body-3: #9be08a;
  --body-4: #c49bff;
  --body-5: #ffe07a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --radius: 10px;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #efede7;
  --stage: #f7f5f0;
  --panel: #fbfaf7;
  --raise: #ffffff;
  --line: rgba(30, 34, 46, 0.09);
  --line-strong: rgba(30, 34, 46, 0.18);
  --ink: #171a21;
  --ink-2: #3a3f4b;
  --muted: #6b7180;
  --faint: #a4a8b2;
  --accent: #1c6fd1;
  --accent-ink: #ffffff;
  --good: #23864f;
  --warn: #a8700f;
  --bad: #c43b4a;
  --grid: rgba(30, 40, 70, 0.055);
  --grid-strong: rgba(30, 40, 70, 0.12);
  --glow: 0;
  --body-0: #d4731c;
  --body-1: #1a78bf;
  --body-2: #cf2f63;
  --body-3: #3a8f33;
  --body-4: #7a48cf;
  --body-5: #a88600;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.psim-app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */
.psim-head {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.psim-mark {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  position: relative;
}
.psim-mark::before, .psim-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.psim-mark::before { inset: 5px; border: 1px solid var(--accent); transform: scaleX(1.6) rotate(-25deg); opacity: .8; }
.psim-mark::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--ink); }
.psim-title { min-width: 0; flex: 0 1 auto; }
.psim-title h1 {
  margin: 0; font: 600 15px/1.2 var(--sans); letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.psim-head .spacer { flex: 1; }

.psim-tier {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap;
}
.psim-tier i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.psim-tier[data-tier="approximate"] i { background: var(--warn); }
.psim-tier[data-tier="unverified"] i { background: var(--warn); }
.psim-tier[data-tier="analytical"] i { background: var(--accent); }
.psim-tier[data-tier="conceptual"] i { background: var(--muted); }

.psim-iconbtn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.psim-iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.psim-iconbtn svg { width: 16px; height: 16px; }

/* ---------- stage ---------- */
.psim-stage {
  position: relative; min-height: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 92%, var(--accent) 8%) 0%, var(--stage) 60%);
}
.psim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.psim-stage canvas.grab { cursor: grab; }
.psim-stage canvas.grabbing { cursor: grabbing; }
.psim-stage canvas.move { cursor: move; }

.psim-hud {
  position: absolute; left: 16px; top: 14px;
  display: grid; gap: 2px; pointer-events: none;
  font: 12px/1.35 var(--mono); color: var(--ink-2);
}
.psim-hud b { font-weight: 500; color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
.psim-hud .dim { color: var(--muted); }
.psim-hud .flag { color: var(--warn); }

.psim-legend {
  position: absolute; right: 16px; top: 14px; display: grid; gap: 4px; justify-items: end;
  font: 11px/1.3 var(--sans); color: var(--muted); pointer-events: none; text-align: right;
}

.psim-transport {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 5px; border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  max-width: calc(100% - 32px);
}
.psim-transport button {
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  display: inline-grid; place-items: center; font: 500 12px var(--sans);
}
.psim-transport button:hover { background: var(--raise); color: var(--ink); }
.psim-transport button.primary { background: var(--ink); color: var(--bg); width: 40px; }
.psim-transport svg { width: 15px; height: 15px; }
.psim-transport .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.psim-transport label { display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.psim-transport input[type=range] { width: 110px; }
.psim-transport output { font: 12px var(--mono); color: var(--ink-2); min-width: 64px; }

.psim-scalebar {
  position: absolute; left: 16px; bottom: 22px; pointer-events: none;
  font: 11px var(--mono); color: var(--muted);
}
.psim-scalebar span { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; }

/* ---------- side column ---------- */
.psim-side {
  min-height: 0; overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  scrollbar-width: thin;
}
.psim-sec { border-bottom: 1px solid var(--line); }
.psim-sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 13px 18px;
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.psim-sec > summary::-webkit-details-marker { display: none; }
.psim-sec > summary::after {
  content: ""; margin-left: auto; width: 6px; height: 6px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.psim-sec[open] > summary::after { transform: rotate(45deg); }
.psim-sec > summary .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--faint); }
.psim-sec > summary .aside + ::after { margin-left: 8px; }
.psim-body { padding: 2px 18px 16px; display: grid; gap: 10px; }

.psim-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; }
.psim-row .k { color: var(--muted); }
.psim-row .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-row .v.good { color: var(--good); }
.psim-row .v.warn { color: var(--warn); }
.psim-row .v.bad { color: var(--bad); }

.psim-field { display: grid; gap: 6px; }
.psim-field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.psim-field .top span { color: var(--ink-2); }
.psim-field .top input[type=number], .psim-num {
  width: 108px; text-align: right;
  font: 12px var(--mono); color: var(--ink);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
}
.psim-field .top input[type=number]:hover, .psim-num:hover { border-color: var(--line); }
.psim-field .top input[type=number]:focus, .psim-num:focus { outline: none; border-color: var(--accent); }
.psim-hint { color: var(--muted); font-size: 12px; margin: 0; }
.psim-limit { color: var(--warn); font: 11px var(--mono); }
.psim-limit:empty { display: none; }
.psim-hint b { color: var(--ink-2); font-weight: 500; }

select.psim-select {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--raise); color: var(--ink); border: 1px solid var(--line);
  font: 13px var(--sans);
}

input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel);
}
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }

.psim-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font: 500 12px var(--sans);
}
.psim-btn:hover { background: var(--raise); }
.psim-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.psim-btn:disabled { opacity: .5; cursor: progress; }
.psim-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.psim-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink-2); cursor: pointer; }
.psim-toggle input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.psim-toggle input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.psim-toggle input:checked { background: var(--accent); }
.psim-toggle input:checked::after { transform: translateX(12px); background: var(--accent-ink); }

/* body cards */
.psim-bodycard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; }
.psim-bodycard header { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.psim-bodycard header i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
.psim-bodycard header .m { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.psim-vec { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.psim-vec span { color: var(--muted); font: 11px var(--mono); }
.psim-vec input { width: 100%; min-width: 0; text-align: right; font: 11.5px var(--mono); color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 5px; }
.psim-vec input:focus { outline: none; border-color: var(--accent); }

/* plots */
.psim-plot { position: relative; height: 112px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line); }
.psim-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.psim-plot .cap { position: absolute; left: 8px; top: 6px; font: 10.5px var(--mono); color: var(--muted); pointer-events: none; }

/* model / maths */
.psim-math { overflow-x: auto; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 60%, transparent); border: 1px solid var(--line); }
.psim-math math { font-size: 15px; color: var(--ink); }
.psim-prose { color: var(--ink-2); font-size: 12.5px; }
.psim-prose p { margin: 0 0 8px; }
.psim-prose ul { margin: 0; padding-left: 18px; }
.psim-prose li { margin: 3px 0; }
.psim-prose cite { font-style: normal; color: var(--muted); }

.psim-check { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; row-gap: 2px; align-items: baseline; }
.psim-check code { grid-column: 2; overflow-wrap: anywhere; }
.psim-check i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.psim-check i.warn { background: var(--warn); }
.psim-check i.bad { background: var(--bad); }
.psim-check span { color: var(--ink-2); }
.psim-check code { font: 11.5px var(--mono); color: var(--ink); }

.psim-toast {
  position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px); opacity: 0;
  padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.psim-toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .psim-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  .psim-head { gap: 10px; }
  .psim-title { flex: 1; }
  .psim-tier { padding: 6px; }
  .psim-tier span { display: none; }
  .psim-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .psim-head { padding: 10px 16px; }
  .psim-title p { display: none; }
  .psim-transport label.speed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- figures (ui/plot.mjs) ---------- */
.psim-figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.psim-plot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.psim-plot-head .t { font: 600 12px/1.3 var(--sans); color: var(--ink-2); }
.psim-plot-head .l { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.psim-plot-head .k { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--sans); color: var(--muted); cursor: default; }
.psim-plot-head .k.on { color: var(--ink); }
.psim-plot-head .k i { width: 12px; height: 2.5px; border-radius: 2px; }
.psim-plot2 { position: relative; border-radius: 10px; background: color-mix(in srgb, var(--stage) 75%, transparent); border: 1px solid var(--line); }
.psim-plot2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- equations split into terms (ui/equation.mjs) ---------- */
.psim-equation { display: grid; gap: 10px; }
.psim-equation h3, .psim-derivation h3 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.psim-eqrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.psim-eqrow .op { align-self: center; font: 20px var(--serif); color: var(--muted); padding: 0 2px; }
.psim-term {
  display: grid; grid-template-rows: auto 3px auto auto; justify-items: center; align-content: start; gap: 5px;
  padding: 10px 12px 9px; border-radius: 10px; min-width: 88px;
  background: color-mix(in srgb, var(--stage) 70%, transparent); border: 1px solid var(--line);
  transition: opacity .15s, border-color .15s; outline: none;
}
.psim-term[data-id]:not([data-id=""]) { cursor: default; }
.psim-term:hover, .psim-term:focus-visible { border-color: var(--line-strong); }
.psim-term.dim { opacity: .35; }
.psim-term.lhs { background: transparent; border-style: dashed; }
.psim-term .mx { font-size: 19px; line-height: 1.2; color: var(--ink); min-height: 30px; display: grid; place-items: center; }
.psim-term .mx math { font-size: 19px; }
.psim-term .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.psim-term .lb { font: 11px/1.25 var(--sans); color: var(--muted); text-align: center; max-width: 150px; }
.psim-term .v { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.psim-term { min-width: 0; max-width: 100%; }
.psim-where { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-left: 2px solid var(--line-strong); }
.psim-where .kw { grid-column: 1 / -1; font: italic 12px var(--serif); color: var(--muted); }
.psim-where .w { display: contents; }
.psim-where .mx math { font-size: 15px; color: var(--ink); }
.psim-where .mean { color: var(--ink-2); font-size: 12.5px; }
.psim-where .v { font: 12px var(--mono); color: var(--ink); text-align: right; }
.psim-derivation ol { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 8px; }

.psim-derivation li::before { content: counter(step); grid-row: span 2; align-self: start; margin-top: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font: 10.5px/18px var(--mono); text-align: center; color: var(--muted); }
.psim-derivation .mx { overflow-x: auto; padding: 4px 0; min-width: 0; }
.psim-derivation .mx math { font-size: 17px; color: var(--ink); }
.psim-derivation .why { font-size: 12px; color: var(--muted); }

/* ---------- workbench layout: stage + figures + equations (instrument-app layout: 'workbench') ---------- */
.psim-app.workbench .psim-stage { overflow: auto; background: var(--stage); }
.psim-bench { position: relative; display: grid; gap: 18px; padding: 18px 18px 84px; min-height: 100%; }
.psim-bench .psim-canvaswrap { position: relative; height: clamp(300px, 52vh, 620px); border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--stage) 90%, var(--accent) 10%) 0%, var(--stage) 65%); }
.psim-bench .psim-canvaswrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.psim-bench .psim-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.psim-bench .psim-eqs { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.psim-app.workbench .psim-transport { position: fixed; left: calc((100vw - 372px) / 2); }
.psim-app.workbench .psim-hud { left: 30px; top: 30px; }
.psim-app.workbench .psim-legend { right: 30px; top: 30px; }
@media (max-width: 860px) {
  .psim-app.workbench .psim-transport { left: 50%; }
  .psim-bench { padding: 12px 12px 84px; }
}

@media (max-width: 860px) {
  /* phones: legend bottom-right, clear of HUD (top-left), scale bars (bottom-left) and transport */
  .psim-legend { top: auto; bottom: 70px; left: auto; right: 14px; max-width: 58%; justify-items: end; text-align: right; font-size: 10.5px; }
  .psim-app.workbench { grid-template-rows: auto auto auto; }
  .psim-app.workbench .psim-stage { overflow: visible; }
  .psim-app.workbench .psim-transport { position: absolute; }
  .psim-app.workbench .psim-legend { top: auto; bottom: 14px; left: auto; right: 26px; }
  .psim-bench .psim-canvaswrap { height: 70vh; }
}

/* GPU layer (ui/gl.mjs): under the 2D canvas, which keeps labels and pointer events */
.psim-gl { pointer-events: none; }

/* "Try this" presets (createInstrument presets) */
.psim-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
.psim-presets .psim-hint { width: 100%; margin: 0; }

/* Over a GPU scene the HUD and legend get a soft backing so they stay readable on bright content */
.psim-app.has-gl .psim-hud, .psim-app.has-gl .psim-legend {

 * update(values, nx, ny, nz, { range, log }); draw(camera, { box: [[x0,y0,z0],[x1,y1,z1]],
 * colormap, opacity, steps, mode }) with mode 'emission' (glowing gas: colour ∝ density, adds up)
 * or 'absorption' (emission–absorption: nearer matter hides farther). Opacity is a display
 * transfer function, not a physical optical depth unless you derive it from one: say which.
 * smooth: false shows each cell as a uniform block (honest for coarse grids, e.g. a lattice).
 * Smooth volumes are ray-marched at reduced resolution (≤ ~1.5 M rays) and upscaled; pass
 * resolution: 1 (fraction of the layer's pixels per axis) to force full resolution.
 * update(…, { signed: true }) shows a field of either sign (charge density, vorticity, Re ψ): the
 * colour map's middle is zero, colour gives the sign and opacity |value|; range is symmetric,
 * [−M, M] with M = max|value| unless given. Use a diverging map ('coolwarm').
 * Values ≤ 0 are transparent otherwise (opacity ∝ normalised value).

  const { p, u } = compile(gl, `#version 300 es
in vec2 aXY; out vec2 vNDC;
void main() { vNDC = aXY * 2.0 - 1.0; gl_Position = vec4(vNDC, 0.0, 1.0); }`, `#version 300 es
precision highp float; precision highp sampler3D;
in vec2 vNDC;

uniform float uOpacity, uSteps, uMode, uSigned;
out vec4 frag;

    float v = uSigned > 0.5 ? abs(raw) : raw;
    if (v <= 0.0) continue;
    vec3 c = texture(uMap, vec2(uSigned > 0.5 ? 0.5 + 0.5 * raw : v, 0.5)).rgb;
    float k = uOpacity * v * dt / len * 8.0;

  }

}`);
  const vao = gl.createVertexArray(), buf = gl.createBuffer(), tex = gl.createTexture();
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'aXY'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  let ready = false, signed = false;
  // offscreen target for reduced-resolution ray marching, and a composite pass that upscales it
  const comp = compile(gl, `#version 300 es
in vec2 aXY; out vec2 vUV;
void main() { vUV = aXY; gl_Position = vec4(aXY * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es
precision mediump float;
in vec2 vUV; uniform sampler2D uTex; out vec4 frag;
void main() { frag = texture(uTex, vUV); }`);
  const compVao = gl.createVertexArray();
  gl.bindVertexArray(compVao); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const cl = gl.getAttribLocation(comp.p, 'aXY'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

    update(values, nx, ny, nz, { range, log = false, signed: isSigned = false } = {}) {

        let M = range ? Math.max(Math.abs(range[0]), Math.abs(range[1])) : 0;
        if (!range) for (const v of values) if (Number.isFinite(v)) M = Math.max(M, Math.abs(v));
        if (!(M > 0)) M = 1;
        const data = Float32Array.from(values, v => (Number.isFinite(v) ? Math.max(-1, Math.min(1, v / M)) : 0));
        gl.bindTexture(gl.TEXTURE_3D, tex);

        for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.CLAMP_TO_EDGE);

      for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.CLAMP_TO_EDGE);

    draw(camera, { aspect, box = [[-1, -1, -1], [1, 1, 1]], colormap: map = 'inferno', opacity = 1, steps = 160, mode = 'emission', smooth = true, resolution } = {}) {
      if (!ready) return;

          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      const { viewProj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight);
      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.uniformMatrix4fv(u.uInvVP, false, invert(viewProj));
      gl.uniform3f(u.uMin, ...box[0]); gl.uniform3f(u.uMax, ...box[1]);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, tex); gl.uniform1i(u.uVol, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, cmapTexture(gl, map)); gl.uniform1i(u.uMap, 1);
      gl.uniform1f(u.uOpacity, opacity); gl.uniform1f(u.uSteps, Math.min(1000, steps)); gl.uniform1f(u.uMode, mode === 'emission' ? 0 : 1);

        gl.useProgram(comp.p); gl.bindVertexArray(compVao);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, target); gl.uniform1i(comp.u.uTex, 0);

}

// ---------------------------------------------------------------- spheres

/**
 * Lit spheres drawn as exact ray-cast impostors: true silhouettes, per-pixel shading and correct
 * overlap (depth) between spheres. draw(camera, spheres, { aspect, light, ambient }) where each
 * sphere is { center: [x, y, z], radius, color, emissive? } and light is a point [x, y, z]
 * (e.g. the Sun's centre: each sphere is lit from its own direction, giving the right
 * day/night line) or { direction: [x, y, z] } for parallel light. emissive spheres glow
 * unshaded (the Sun). Brightness ∝ max(0, n·l): the geometric share of light, not a photograph.
 */
function createSphereRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aCenter; in float aRadius; in vec3 aColor; in float aEmit;
uniform mat4 uView, uProj;
out vec3 vPos; out vec3 vCenter; out float vRadius; out vec3 vColor; out float vEmit;
void main() {
  vec3 c = (uView * vec4(aCenter, 1.0)).xyz;
  float d = length(c), r = aRadius;
  float s = r * d / sqrt(max(d * d - r * r, 1e-12)) * 1.05;
  vec3 q = c + vec3(aCorner * s, 0.0);
  vPos = q; vCenter = c; vRadius = r; vColor = aColor; vEmit = aEmit;
  gl_Position = uProj * vec4(q, 1.0);
}`, `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vCenter; in float vRadius; in vec3 vColor; in float vEmit;
uniform mat4 uProj; uniform vec3 uLight; uniform float uPoint, uAmbient;
out vec4 frag;
void main() {
  vec3 dir = normalize(vPos);
  float b = dot(dir, vCenter), cc = dot(vCenter, vCenter) - vRadius * vRadius, disc = b * b - cc;
  if (disc < 0.0) discard;
  vec3 h = dir * (b - sqrt(disc));
  vec3 n = (h - vCenter) / vRadius;
  vec3 l = uPoint > 0.5 ? normalize(uLight - vCenter) : normalize(uLight);
  float k = vEmit > 0.5 ? 1.0 : uAmbient + (1.0 - uAmbient) * max(dot(n, l), 0.0);
  vec4 clip = uProj * vec4(h, 1.0);
  gl_FragDepth = clip.z / clip.w * 0.5 + 0.5;

}`);
  const vao = gl.createVertexArray(), corner = gl.createBuffer(), inst = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);

    const loc = gl.getAttribLocation(p, name);

    draw(camera, spheres, { aspect, light = { direction: [1, 0, 0] }, ambient = 0.08 } = {}) {
      if (!spheres.length) return;
      const t = camera.target, data = new Float32Array(8 * spheres.length);
      spheres.forEach((sp, i) => {
        const c = rgb(sp.color ?? '#cfd8e3');
        data.set([sp.center[0] - t[0], sp.center[1] - t[1], sp.center[2] - t[2], sp.radius, c[0], c[1], c[2], sp.emissive ? 1 : 0], 8 * i);
      });
      const { view, proj } = camera.matrices(aspect ?? gl.drawingBufferWidth / gl.drawingBufferHeight, { relative: true });
      gl.useProgram(p); gl.bindVertexArray(vao);

      const lv = point

    },
  };
}

// ---------------------------------------------------------------- lines

/**
 * Thick polylines in 3D (orbits, trajectories, field lines, axes), constant width in screen
 * pixels. update(lines) with lines = [[x,y,z, x,y,z, …], …] (or one flat array), where a line may
 * also be { points, color, opacity } to give it its own colour (e.g. age-faded tracks in one draw);
 * draw(camera, { aspect, width, color, opacity, dash: [on, off] in world units, depthTest }).
 * A line's own opacity multiplies the draw opacity; lines without a colour use the draw colour.
 * Dashed lines are for reference overlays (analytic curves), solid for computed paths.
 */
function createLineRenderer(gl) {
  const { p, u } = compile(gl, `#version 300 es
in vec2 aCorner; in vec3 aA; in vec3 aB; in vec2 aS; in vec4 aC;
uniform mat4 uVP; uniform vec2 uViewport; uniform float uWidth;

  vec4 a = uVP * vec4(aA, 1.0), b = uVP * vec4(aB, 1.0);

  vec2 off = nrm * aCorner.y * uWidth / uViewport;

precision highp float;
in float vS; in vec4 vC; uniform float uOpacity; uniform vec2 uDash;
out vec4 frag;

  float a = vC.a * uOpacity;
  frag = vec4(vC.rgb * a, a);

  const vao = gl.createVertexArray(), corner = gl.createBuffer(), inst = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 0, 1, 1, -1, 1, 1]), gl.STATIC_DRAW);
  const cl = gl.getAttribLocation(p, 'aCorner'); gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, inst);

    const loc = gl.getAttribLocation(p, name);

    update(data) { lines = Array.isArray(data) && data.length && typeof data[0] !== 'number' ? data : [data]; },

      gl.uniformMatrix4fv(u.uVP, false, viewProj);
      gl.uniform2f(u.uViewport, gl.drawingBufferWidth / 2, gl.drawingBufferHeight / 2);

}

// ---------------------------------------------------------------- solid objects (meshes)

/**
 * Geometry for solid objects, z up, centred on the origin unless stated. Each returns
 * { positions, normals, indices } (Float32Array/Uint32Array) for createMeshRenderer.add().
 *   box(sx, sy, sz) · cylinder(r, h, n) (axis z, from z = 0 to h) · cone(r, h, n) (apex at z = h)
 *   sphere(r, n) · disc(r, n) (in the xy-plane, normal +z) · plane(sx, sy) (xy-plane, normal +z)
 *   arrow(length, { shaft, head, headLength, n }) along +z from the origin (orient with alignZ)
 */
const geometry = (() => {
  const make = (pos, nrm, idx) => ({ positions: Float32Array.from(pos), normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) });
  const quad = (P, N, I, a, b, c, d, n) => { const o = P.length / 3; P.push(...a, ...b, ...c, ...d); for (let k = 0; k < 4; k++) N.push(...n); I.push(o, o + 1, o + 2, o, o + 2, o + 3); };
  return {
    box(sx = 1, sy = 1, sz = 1) {
      const x = sx / 2, y = sy / 2, z = sz / 2, P = [], N = [], I = [];
      quad(P, N, I, [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1]);
      quad(P, N, I, [-x, y, -z], [x, y, -z], [x, -y, -z], [-x, -y, -z], [0, 0, -1]);
      quad(P, N, I, [x, -y, -z], [x, y, -z], [x, y, z], [x, -y, z], [1, 0, 0]);
      quad(P, N, I, [-x, y, -z], [-x, -y, -z], [-x, -y, z], [-x, y, z], [-1, 0, 0]);
      quad(P, N, I, [x, y, -z], [-x, y, -z], [-x, y, z], [x, y, z], [0, 1, 0]);
      quad(P, N, I, [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [0, -1, 0]);
      return make(P, N, I);
    },
    cylinder(r = 0.5, h = 1, n = 32) {
      const P = [], N = [], I = [];
      for (let i = 0; i < n; i++) {
        const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n, c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        const o = P.length / 3;
        P.push(r * c0, r * s0, 0, r * c1, r * s1, 0, r * c1, r * s1, h, r * c0, r * s0, h); N.push(c0, s0, 0, c1, s1, 0, c1, s1, 0, c0, s0, 0);
        I.push(o, o + 1, o + 2, o, o + 2, o + 3);
        for (const [zz, nz] of [[h, 1], [0, -1]]) { const q = P.length / 3; P.push(0, 0, zz, r * c0, r * s0, zz, r * c1, r * s1, zz); N.push(0, 0, nz, 0, 0, nz, 0, 0, nz); I.push(...(nz > 0 ? [q, q + 1, q + 2] : [q, q + 2, q + 1])); }
      }
      return make(P, N, I);

  return { sim, rMax, rMin };
}

/** Phase error after one analytic period, as an angle (E = 0). */
function phaseError(p) {
  const { sim } = run(p, 1);
  const ang = Math.atan2(sim.x[1], sim.x[0]);
  return Math.abs(Math.atan2(Math.sin(ang + Math.PI / 2), Math.cos(ang + Math.PI / 2)));
}

function verify() {
  const checks = [];
  const base = { B: 1, KE: 1, pitch: 90, E: 0, stepsPerGyration: 256 };

  // 1. Energy: a pure magnetic field does no work; Boris conserves |u| to round-off.
  const e1 = run(base, 200);
  const dg = Math.abs(e1.sim.gamma() - e1.sim.analytic.gamma) / e1.sim.analytic.gamma;
  checks.push({ label: 'Energy conserved in pure B (200 gyrations)', value: `|Δγ/γ| = ${dg.toExponential(2)}`, pass: dg < 1e-13 });

  // 2. Orbit radius matches Boris' known discrete radius r·√(1+(ΩΔt/2)²), and → r as Δt → 0.
  const a = e1.sim.analytic, w = a.omega * e1.sim.dt;
  const rPred = a.radius * Math.sqrt(1 + (w / 2) ** 2);
  const rMeas = (e1.rMax + e1.rMin) / 2;
  const relR = Math.abs(rMeas - rPred) / rPred;
  checks.push({ label: 'Orbit radius vs exact discrete-Boris radius', value: `rel. diff ${relR.toExponential(2)}`, pass: relR < 1e-9 });
  const rErr = Math.abs(rMeas - a.radius) / a.radius;
  checks.push({ label: 'Orbit radius vs analytic γmv⊥/(qB), 256 steps/gyration', value: `rel. err ${rErr.toExponential(2)}`, pass: rErr < 1e-4 });

  // 2b. Orbit centred on the origin (half-step start): extremes of the discrete circle.
  {
    const cs = createSim({ ...base, stepsPerGyration: 32 });
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < 32 * 100; i++) {
      cs.step();
      x0 = Math.min(x0, cs.x[0]); x1 = Math.max(x1, cs.x[0]); y0 = Math.min(y0, cs.x[1]); y1 = Math.max(y1, cs.x[1]);
    }
    const off = Math.hypot((x0 + x1) / 2, (y0 + y1) / 2) / cs.analytic.radius;
    checks.push({ label: 'Orbit centred on the guiding centre (32 steps/gyration)', value: `offset ${off.toExponential(1)} r`, pass: off < 1e-4 });
  }

  // 3. Convergence: phase error after one period scales as Δt² (2nd-order method).
  const pe = [128, 256, 512].map(s => phaseError({ ...base, stepsPerGyration: s }));
  const order = Math.log2(pe[1] / pe[2]);
  checks.push({ label: 'Phase-error convergence order (expected 2)', value: order.toFixed(2), pass: Math.abs(order - 2) < 0.1 });

  // 4. Relativistic gyroperiod at 1 GeV: measure the period from orbit crossings.
  const rel = { ...base, KE: 1000, stepsPerGyration: 2048 };
  const sim = createSim(rel);
  const crossings = [];
  let prevX = sim.x[0], tPrev = 0;
  while (crossings.length < 6) {
    tPrev = sim.t; prevX = sim.x[0];
    sim.step();
    if (prevX < 0 && sim.x[0] >= 0) crossings.push(tPrev + (sim.t - tPrev) * (-prevX) / (sim.x[0] - prevX));
  }
  const Tmeas = (crossings[5] - crossings[0]) / 5;
  const Tex = sim.analytic.period * 1e9;
  const relT = Math.abs(Tmeas - Tex) / Tex;
  checks.push({ label: `Relativistic gyroperiod at 1 GeV (γ = ${sim.analytic.gamma.toFixed(4)})`, value: `${Tmeas.toFixed(4)} ns vs ${Tex.toFixed(4)} ns`, pass: relT < 1e-5 });

  // 5. E×B drift: guiding-centre velocity averaged over whole gyrations equals E/B.
  const drift = { B: 1, KE: 0.01, pitch: 90, E: 1e4, stepsPerGyration: 512 };
  // Guiding centre R = x + (γm/(qB)) (w × B̂), with w = v − v_E the velocity in the drift
  // frame: removes the gyration exactly, so ΔR/Δt is the drift velocity.
  const ds = createSim(drift);
  const vE = drift.E / drift.B;
  const gc = () => {
    const g = ds.gamma(), vx = ds.u[0] / g, vy = ds.u[1] / g;
    const k = g * mp / (qe * drift.B);
    // (w × ẑ) = (w_y, −w_x, 0), with w = (v_x − v_E, v_y)
    return [ds.x[0] + k * vy, ds.x[1] - k * (vx - vE)];
  };
  const R0 = gc(), t0 = ds.t;
  for (let i = 0; i < 50 * drift.stepsPerGyration; i++) ds.step();
  const R1 = gc();
  const vd = (R1[0] - R0[0]) / ((ds.t - t0) * 1e-9);
  const relD = Math.abs(vd - drift.E / drift.B) / (drift.E / drift.B);
  checks.push({ label: 'E×B drift speed vs E/B (non-relativistic)', value: `${vd.toFixed(1)} vs ${(drift.E / drift.B).toFixed(1)} m/s`, pass: relD < 1e-3 });

  return {
    summary: 'Relativistic Boris pusher checked against exact single-particle results:',
    checks,
    notes: ['Radiation reaction (synchrotron loss) is neglected; for protons below TeV energies in ≤10 T it is many orders of magnitude below the integration error.'],
  };
}

return { PARAMS, analytic, createSim, verify };
})();

const { createInstrument } = __psim["ui/instrument-app.mjs"];

const BOLD_B = '𝐁', BOLD_E = '𝐄', BOLD_U = '𝐮';
// yaw about B; elev = angle of the eye above the orbital plane (0: side-on, π/2: looking down B).
const cam = { yaw: -0.55, elev: 0.42 };

function project(view, p, scale, center) {
  const x = p[0] - center[0], y = p[1] - center[1], z = p[2] - center[2];
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = cy * x - sy * y, y1 = sy * x + cy * y;
  const ce = Math.cos(cam.elev), se = Math.sin(cam.elev);
  const up = ce * z + se * y1;            // +z (along B) points up the screen
  return [view.W / 2 + x1 * scale, view.H / 2 - up * scale, ce * y1 - se * z];
}

function niceStep(raw) {
  const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e;
}
function fmtLen(m) {
  if (m >= 1) return `${+m.toPrecision(3)} m`;
  if (m >= 1e-2) return `${+(m * 100).toPrecision(3)} cm`;
  if (m >= 1e-3) return `${+(m * 1000).toPrecision(3)} mm`;
  return `${+(m * 1e6).toPrecision(3)} µm`;
}

function draw(ctx, sim, view) {
  const C = view.color;
  const a = sim.analytic, p = sim.params;
  const r = a.radius;
  const scale = 0.2 * Math.min(view.W, view.H) / r;
  // Follow the particle along B and the guiding centre across it.
  const vE = p.E / p.B;
  const center = [p.E ? sim.x[0] - (sim.x[0] - vE * sim.t * 1e-9) : 0, 0, sim.x[2]];
  if (p.E) center[0] = vE * sim.t * 1e-9;

  // Field lines: B ∥ ẑ, uniform. Drawn as a lattice of parallel lines with direction ticks.
  const step = niceStep(r * 1.1);
  ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {for (let j = -2; j <= 2; j++) {
    const px = Math.round(center[0] / step) * step + i * step, py = j * step;
    const zSpan = 3 * r;
    const A = project(view, [px, py, center[2] - zSpan], scale, center);
    const B = project(view, [px, py, center[2] + zSpan], scale, center);
    ctx.strokeStyle = C('--grid-strong');
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    // direction tick (chevron) at a z that scrolls with the field, not with time
    const zt = Math.floor(center[2] / step) * step + step / 2;
    const T0 = project(view, [px, py, zt], scale, center), T1 = project(view, [px, py, zt + step * 0.12], scale, center);
    const ang = Math.atan2(T1[1] - T0[1], T1[0] - T0[0]);
    ctx.fillStyle = C('--grid-strong');
    ctx.beginPath(); ctx.moveTo(T1[0], T1[1]);
    ctx.lineTo(T1[0] - 6 * Math.cos(ang - 0.5), T1[1] - 6 * Math.sin(ang - 0.5));
    ctx.lineTo(T1[0] - 6 * Math.cos(ang + 0.5), T1[1] - 6 * Math.sin(ang + 0.5));
    ctx.fill();

  // Analytic gyro-circle (E = 0 only): exact reference the computed orbit should overlay.
  if (!p.E) {
    ctx.setLineDash([3, 5]); ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k <= 96; k++) {
      const th = 2 * Math.PI * k / 96;
      const Q = project(view, [r * Math.cos(th), r * Math.sin(th), sim.x[2]], scale, center);
      k ? ctx.lineTo(Q[0], Q[1]) : ctx.moveTo(Q[0], Q[1]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Computed trajectory (integrator states only).
  const tr = sim.trail;
  const N = tr.length, CH = 24;
  const col = C('--body-1');
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const per = Math.max(1, Math.ceil(N / CH));
  for (let c = 0; c * per < N - 1; c++) {
    const i0 = c * per, i1 = Math.min(N - 1, (c + 1) * per);
    const age = 1 - i1 / (N - 1);
    ctx.globalAlpha = 0.08 + 0.92 * Math.pow(1 - age, 1.5);
    ctx.lineWidth = 0.7 + 1.1 * (1 - age);
    ctx.beginPath();
    for (let i = i0; i <= i1; i++) { const Q = project(view, tr[i], scale, center); i === i0 ? ctx.moveTo(Q[0], Q[1]) : ctx.lineTo(Q[0], Q[1]); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const last = project(view, tr[N - 1], scale, center), P = project(view, sim.x, scale, center);
  ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(P[0], P[1]); ctx.stroke();

  // Proton marker and velocity direction.
  const g = sim.gamma(), v = sim.u.map(q => q / g), vn = Math.hypot(...v);
  const V = project(view, [sim.x[0] + v[0] / vn * r * 0.45, sim.x[1] + v[1] / vn * r * 0.45, sim.x[2] + v[2] / vn * r * 0.45], scale, center);
  ctx.strokeStyle = C('--ink-2'); ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(V[0], V[1]); ctx.stroke();
  const glow = C('--glow') === '1';
  if (glow) {
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(P[0], P[1], 0, P[0], P[1], 34);
    gr.addColorStop(0, 'rgba(255,111,154,0.55)'); gr.addColorStop(1, 'rgba(255,111,154,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(P[0], P[1], 34, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = C('--body-2');
  ctx.beginPath(); ctx.arc(P[0], P[1], 6, 0, 7); ctx.fill();
  ctx.fillStyle = glow ? 'rgba(255,255,255,0.9)' : C('--panel');
  ctx.font = '600 9px ui-sans-serif, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', P[0], P[1] + 0.5);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

  // Labels and scale bar.
  ctx.fillStyle = C('--muted'); ctx.font = '11px ui-monospace, Menlo, monospace';
  const lb = project(view, [Math.round(center[0] / step) * step + 2 * step, -2 * step, center[2] + 1.6 * r], scale, center);
  ctx.fillText(`${BOLD_B} = ${p.B} T ẑ`, lb[0] + 6, lb[1]);
  if (p.E) ctx.fillText(`${BOLD_E} = ${sci(p.E, 2)} V/m ŷ   drift → x̂`, 16, view.H - 64);
  const bar = niceStep(r * 0.8);
  ctx.strokeStyle = C('--muted'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(16, view.H - 34); ctx.lineTo(16, view.H - 28); ctx.lineTo(16 + bar * scale, view.H - 28); ctx.lineTo(16 + bar * scale, view.H - 34); ctx.stroke();
  ctx.fillText(fmtLen(bar), 16, view.H - 14);
}

function onPointer(canvas) {
  let drag = null;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, elev: cam.elev }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;

    cam.elev = Math.max(0, Math.min(Math.PI / 2, drag.elev + (e.clientY - drag.y) * 0.006));
  });

  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', () => { cam.yaw = -0.55; cam.elev = 0.42; });
}
