<script type="application/json" id="psim-verification">null</script>
<script type="module">
import { createInstrument } from 'psim:ui/instrument-app.mjs';
import { PARAMS, createSim, colorLUT } from './physics.mjs';

// ------------------------------------------------------------------ GPU ray tracer
// Each pixel: one photon traced backwards from the observer. Its orbit lies in the
// plane spanned by the observer direction e₁ and the ray's transverse direction e₂;
// in that plane u = 1/r obeys d²u/dφ² = −u + 3u² (M = 1), integrated with RK4 in φ,
// exactly as core/schwarzschild.mjs tracePhoton() (tested against exact quadrature).
const VERT = `#version 300 es
in vec2 p; out vec2 v; void main() { v = p; gl_Position = vec4(p, 0., 1.); }`;
const FRAG = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform vec2 uRes; uniform float uRo, uIncl, uTanHalf, uRout, uTmax, uExposure, uT0, uT1, uLutN;
uniform int uDisk, uSky, uEffects, uRings;
uniform sampler2D uLUT;
const float PI = 3.141592653589793;
float shapeT(float x) { return pow(x, -0.75) * pow(max(0., 1. - sqrt(1. / x)), 0.25); }
vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
void main() {
  vec3 N = vec3(0., 0., 1.);
  vec3 e1 = vec3(sin(uIncl), 0., cos(uIncl));              // observer direction from the hole
  vec3 f = -e1;
  vec3 upHint = uIncl < 1e-3 ? vec3(-1., 0., 0.) : N;
  vec3 right = normalize(cross(f, upHint)), up = cross(right, f);
  float aspect = uRes.x / uRes.y;
  vec3 d = normalize(f + v.x * uTanHalf * aspect * right + v.y * uTanHalf * up);
  float cosA = clamp(dot(d, f), -1., 1.), sinA = sqrt(max(0., 1. - cosA * cosA));
  float b = uRo * sinA / sqrt(1. - 2. / uRo);
  vec3 tr = d - dot(d, e1) * e1;
  vec3 e2 = length(tr) > 1e-7 ? normalize(tr) : right;
  float u = 1. / uRo;
  float w2 = 1. / (b * b) - u * u * (1. - 2. * u);
  float w = (cosA > 0. ? 1. : -1.) * sqrt(max(0., w2));
  float phi = 0., dphi = 0.012;
  float zPrev = dot(e1, N);
  vec3 col = vec3(0.);
  bool done = false;
  for (int i = 0; i < 1600; i++) {
    float k1u = w, k1w = -u + 3. * u * u;
    float u2 = u + .5 * dphi * k1u, w2_ = w + .5 * dphi * k1w;
    float k2u = w2_, k2w = -u2 + 3. * u2 * u2;
    float u3 = u + .5 * dphi * k2u, w3 = w + .5 * dphi * k2w;
    float k3u = w3, k3w = -u3 + 3. * u3 * u3;
    float u4 = u + dphi * k3u, w4 = w + dphi * k3w;
    float k4u = w4, k4w = -u4 + 3. * u4 * u4;
    float un = u + dphi / 6. * (k1u + 2. * k2u + 2. * k3u + k4u);
    float wn = w + dphi / 6. * (k1w + 2. * k2w + 2. * k3w + k4w);
    float phin = phi + dphi;
    vec3 rhat = cos(phin) * e1 + sin(phin) * e2;
    float z = dot(rhat, N);
    if (uDisk == 1 && z * zPrev < 0. && un > 0.) {
      float t = zPrev / (zPrev - z);
      float r = 1. / mix(u, un, t);
      if (r >= 6. && r <= uRout) {
        float T = uTmax * shapeT(r / 6.) / shapeT(49. / 36.);
        float lambda = -b * dot(cross(e1, e2), N);          // L_z / E of the physical photon
        float g = 1.;
        if (uEffects == 0) g = sqrt(1. - 3. / r) / (1. - pow(r, -1.5) * lambda) / sqrt(1. - 2. / uRo);
        else if (uEffects == 1) g = sqrt(1. - 2. / r) / sqrt(1. - 2. / uRo);
        float Tobs = g * T;
        float s = clamp(log(Tobs / uT0) / log(uT1 / uT0), 0., 1.);
        vec3 c = toLin(texture(uLUT, vec2((s * (uLutN - 1.) + .5) / uLutN, .5)).rgb);   // texel centres
        float I = uExposure * pow(Tobs / uTmax, 4.);         // bolometric intensity ∝ g⁴T⁴
        col = c * I / (1. + I);                              // Reinhard tone map (display only)
        if (uRings == 1) {                                   // measurement aid: rings every 2M
          float dr = abs(fract(r / 2. + .5) - .5) * 2.;
          col *= 1. - .55 * smoothstep(.07, .0, dr);
        }
        done = true; break;
      }
    }
    zPrev = z;
    if (un >= .5) { done = true; break; }                    // crossed the event horizon
    if (un <= 0.) {                                          // escaped to infinity
      vec3 s = rhat;
      if (uSky == 0) { col = vec3(1.); done = true; break; }
      float lat = asin(clamp(s.z, -1., 1.)), lon = atan(s.y, s.x);
      float g15 = radians(20.);
      float dl = abs(fract(lat / g15 + .5) - .5) * g15, dn = abs(fract(lon / g15 + .5) - .5) * g15 * cos(lat);
      float line = max(smoothstep(.006, .0, dl), smoothstep(.006, .0, dn));
      float eq = smoothstep(.012, .0, abs(lat));
      col = vec3(.010, .014, .028) + line * vec3(.10, .13, .20) + eq * vec3(.18, .14, .08);
      done = true; break;
    }
    u = un; w = wn; phi = phin;
  }
  o = vec4(pow(col, vec3(1. / 2.2)), 1.);
}`;

function createTracer(wrap) {
  const gc = document.createElement('canvas');
  gc.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
  wrap.prepend(gc);
  const gl = gc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const lut = colorLUT();
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, lut.n, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, lut.data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  const U = n => gl.getUniformLocation(prog, n);
  return {
    gc, gl,
    render(p, { scale = 1, disk = true, sky = true } = {}) {
      const W = Math.max(2, Math.round(gc.clientWidth * scale)), H = Math.max(2, Math.round(gc.clientHeight * scale));
      if (gc.width !== W || gc.height !== H) { gc.width = W; gc.height = H; }
      gl.viewport(0, 0, W, H);
      gl.uniform2f(U('uRes'), W, H);
      gl.uniform1f(U('uRo'), p.ro);
      gl.uniform1f(U('uIncl'), p.incl * Math.PI / 180);
      gl.uniform1f(U('uTanHalf'), Math.tan(p.fov * Math.PI / 360));
      gl.uniform1f(U('uRout'), p.rout);
      gl.uniform1f(U('uTmax'), p.Tmax);
      gl.uniform1f(U('uExposure'), p.exposure);
      gl.uniform1f(U('uT0'), lut.T0); gl.uniform1f(U('uT1'), lut.T1); gl.uniform1f(U('uLutN'), lut.n);
      gl.uniform1i(U('uDisk'), disk ? 1 : 0);
      gl.uniform1i(U('uSky'), sky ? 1 : 0);
      gl.uniform1i(U('uEffects'), { full: 0, grav: 1, none: 2 }[p.effects]);
      gl.uniform1i(U('uRings'), p.rings === 'on' ? 1 : 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      return { W, H };
    },
  };
}

// ------------------------------------------------------------------ page
let tracer = null, lastSim = null, lastSize = '', failed = null;

function draw(ctx, sim, view) {
  const p = sim.params;
  if (!tracer && !failed) {
    try { tracer = createTracer(ctx.canvas.parentNode); if (!tracer) failed = 'WebGL2 is not available in this browser.'; }
    catch (e) { failed = `Shader error: ${e.message}`; }
  }
  if (failed) {
    ctx.fillStyle = view.color('--bad'); ctx.font = '13px ui-sans-serif, system-ui';
    ctx.fillText(failed, 24, view.H / 2);
    return;
  }
  const size = `${view.W}x${view.H}`;
  if (sim !== lastSim || size !== lastSize) {
    tracer.render(p, { scale: Math.min(1.5, devicePixelRatio || 1) });
    lastSim = sim; lastSize = size;
  }
  // Analytic overlay: exact shadow edge, sin α = 3√3 M/r₀ · √(1 − 2M/r₀).
  const rpx = Math.tan(sim.shadow) / Math.tan(p.fov * Math.PI / 360) * (view.H / 2);
  ctx.save();
  ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(160,190,255,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(view.W / 2, view.H / 2, rpx, 0, 2 * Math.PI); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(190,210,255,0.8)'; ctx.font = '11px ui-monospace, Menlo, monospace';
  const lx = view.W / 2 + rpx * Math.cos(-0.8) + 8, ly = view.H / 2 + rpx * Math.sin(-0.8) - 6;
  ctx.fillText('exact shadow edge  b = 3√3 M', lx, ly);
  ctx.restore();
}

const eqLens = `<math display="block"><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>u</mi></mrow><mrow><mi>d</mi><msup><mi>φ</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mo>−</mo><mi>u</mi><mo>+</mo><mn>3</mn><mi>M</mi><msup><mi>u</mi><mn>2</mn></msup><mo>,</mo><mspace width="1em"/><mi>u</mi><mo>=</mo><mfrac><mn>1</mn><mi>r</mi></mfrac></math>`;
const eqShadow = `<math display="block"><mi>sin</mi><msub><mi>α</mi><mtext>sh</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>M</mi></mrow><msub><mi>r</mi><mn>0</mn></msub></mfrac><msqrt><mrow><mn>1</mn><mo>−</mo><mfrac><mrow><mn>2</mn><mi>M</mi></mrow><msub><mi>r</mi><mn>0</mn></msub></mfrac></mrow></msqrt></math>`;
const eqG = `<math display="block"><mi>g</mi><mo>=</mo><mfrac><msub><mi>E</mi><mtext>obs</mtext></msub><msub><mi>E</mi><mtext>em</mtext></msub></mfrac><mo>=</mo><mfrac><msqrt><mrow><mn>1</mn><mo>−</mo><mn>3</mn><mi>M</mi><mo>/</mo><mi>r</mi></mrow></msqrt><mrow><mo>(</mo><mn>1</mn><mo>−</mo><mi>Ω</mi><mi>λ</mi><mo>)</mo><msqrt><mrow><mn>1</mn><mo>−</mo><mn>2</mn><mi>M</mi><mo>/</mo><msub><mi>r</mi><mn>0</mn></msub></mrow></msqrt></mrow></mfrac><mo>,</mo><mspace width="0.8em"/><msub><mi>T</mi><mtext>obs</mtext></msub><mo>=</mo><mi>g</mi><mi>T</mi><mo>,</mo><mspace width="0.8em"/><msub><mi>I</mi><mtext>obs</mtext></msub><mo>∝</mo><msup><mi>g</mi><mn>4</mn></msup><msup><mi>T</mi><mn>4</mn></msup></math>`;

const app = createInstrument({
  title: 'Schwarzschild black hole',
  subtitle: 'GPU-traced null geodesics · black-body accretion disk · exact gravitational and Doppler shifts',
  tier: 'validated',
  tierReason: 'Every pixel is a photon orbit integrated through the exact Schwarzschild geometry; the shadow edge, light bending and orbital redshifts are checked against exact general relativity. The disk temperature profile is a standard approximation (see assumptions).',
  params: PARAMS,
  create: createSim,
  draw,
  timeDependent: false,
  hudLine: sim => `r₀ = ${sim.params.ro} M · i = ${sim.params.incl}° · shadow ${(2 * sim.shadow * 180 / Math.PI).toFixed(2)}° across`,
  model: {
    legend: ['G = c = 1, lengths in M · sky: coordinate grid on the distant sky', 'dashed: exact shadow edge · disk colour: black-body at the observed temperature'],
    equations: [
      { caption: 'Photon orbits (exact, Schwarzschild); traced per pixel with RK4 in φ', mathml: eqLens },
      { caption: 'Shadow seen by a static observer at r₀ (drawn dashed)', mathml: eqShadow },
      { caption: 'Light shift for a disk orbiting at Ω = √(M/r³), photon with λ = L_z/E', mathml: eqG },
    ],
    assumptions: [
      'Non-rotating (Schwarzschild) black hole; test photons and a test disk (no self-gravity).',
      'Geometrically thin, optically thick disk in the equatorial plane from the ISCO (6M) outward, on circular geodesics.',
      'Disk temperature: Shakura–Sunyaev profile T ∝ r^(−3/4)(1 − √(6M/r))^(1/4) (Newtonian zero-torque form). The relativistic Page–Thorne profile differs by tens of per cent near the ISCO.',
      'Emission is black-body at the local temperature; observed spectrum is black-body at gT and bolometric intensity scales as g⁴T⁴ (Liouville).',
      'Observer is static at r₀; aberration is exact for a static observer.',
    ],
    conventions: [
      'Dark lines on the disk mark r = 8M, 10M, 12M… (measurement aid). Brightness is tone-mapped (Reinhard) with a display exposure (not physics). Colour is the black-body colour at the observed temperature (CIE 1931 → sRGB).',
      'The sky is a coordinate grid at infinity so lensing distortions are visible; it is not a star map.',
      'Only the first crossing of the disk is drawn (opaque disk); higher-order images appear where the first crossing misses.',
    ],
    references: [
      'J.-P. Luminet, Astron. Astrophys. 75, 228 (1979): first image of a black hole with a thin disk.',
      'C. T. Cunningham, Astrophys. J. 202, 788 (1975): redshifts from disks around black holes.',
      'N. I. Shakura & R. A. Sunyaev, Astron. Astrophys. 24, 337 (1973).',
      'C. R. Keeton & A. O. Petters, Phys. Rev. D 72, 104006 (2005): weak-deflection series.',
    ],
  },
});

// GPU self-test, used by psim check: render without disk on a white sky and measure the
// radius of the black region along the image's middle row against the exact formula.
window.psim.selfTest = () => {
  const sim = app.sim, p = sim.params;
  const { W, H } = tracer.render(p, { scale: 1, disk: false, sky: false });
  const gl = tracer.gl, row = new Uint8Array(W * 4);
  gl.readPixels(0, Math.floor(H / 2), W, 1, gl.RGBA, gl.UNSIGNED_BYTE, row);
  let edge = 0;
  for (let x = Math.floor(W / 2); x < W; x++) { if (row[4 * x] > 127) { edge = x - W / 2; break; } }
  const expected = Math.tan(sim.shadow) / Math.tan(p.fov * Math.PI / 360) * (H / 2);
  lastSim = null;                                         // re-render the real image next frame
  return { label: 'GPU shadow radius vs exact formula', measuredPx: edge, expectedPx: +expected.toFixed(2), pass: Math.abs(edge - expected) <= 1.5 };
};
</script>
