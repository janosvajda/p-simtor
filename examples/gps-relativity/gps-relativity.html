      kin -= h * (last.kin + now.kin) / 2;
      last = now;
      if (sys.steps % Math.max(1, Math.round(300 / p.dt)) === 0) history.push([sys.t / HOUR, offset * 1e6, grav * 1e6, kin * 1e6]);
    },
    offset: () => offset,
    parts: () => ({ grav, kin }),
    rate: () => last,
    history,
    /** Linear (secular) drift: what remains after removing the periodic eccentricity term. */
    secularRate: () => circularOffset(a),
    /**
     * Analytic periodic term at the current time. With vis-viva, the periodic rate is
     * −2GM(1/r − 1/a)/c² = −(2/c²) d(r·v)/dt, so the offset is −2 r·v/c² = F e √a sin E.
     */
    periodicAnalytic() {
      const E = solveKepler(n * sys.t, e);

    },
    position() { return [sys.x[3] - sys.x[0], sys.x[4] - sys.x[1]]; },
    diagnostics() {
      const r = rateNow(), En = r.v2 / 2 - GM_EARTH / r.r;

        { key: 'dE', label: 'Orbit energy |ΔE/E₀|', value: Math.abs((En - E0) / E0), kind: 'error', good: 1e-9, warn: 1e-6 },
        { key: 'off', label: 'Satellite clock ahead of ground clock', value: offset * 1e6, kind: 'value', unit: 'µs' },
        { key: 'err', label: 'Ranging error if not corrected (c × offset)', value: c * offset / 1000, kind: 'value', unit: 'km' },
        { key: 'rate', label: 'Average drift', value: circularOffset(a) * MICRO_PER_DAY, kind: 'value', unit: 'µs/day' },
        { key: 'T', label: 'Orbital period', value: period / HOUR, kind: 'value', unit: 'h' },
        { key: 'f', label: 'Factory clock setting for 10.23 MHz in orbit', value: 0, kind: 'value', text: `${(GPS_F0 * (1 - circularOffset(a)) / 1e6).toFixed(11)} MHz` },

    state: () => ({ t: sys.t, offset, x: Array.from(sys.x.subarray(3, 6)) }),

}

function verify() {

  const f = GPS_F0 * (1 - off);
  checks.push({ label: 'Factory frequency offset vs GPS ICD 10.22999999543 MHz', value: `${(f / 1e6).toFixed(11)} MHz`, pass: Math.abs(f - 10.22999999543e6) < 1e-4 });
  checks.push({ label: 'Net drift of a GPS clock (textbook ≈ 38.6 µs/day)', value: `${(off * MICRO_PER_DAY).toFixed(3)} µs/day`, pass: Math.abs(off * MICRO_PER_DAY - 38.6) < 0.1 });

  const Ficd = -2 * Math.sqrt(3.986005e14) / (c * c);
  checks.push({ label: 'Relativistic constant F vs IS-GPS-200 (−4.442807633×10⁻¹⁰ s/√m, μ = 3.986005×10¹⁴)', value: Ficd.toExponential(9), pass: Math.abs(Ficd / -4.442807633e-10 - 1) < 1e-9 });

  const day = createSim({ a: GPS_A / 1e3, e: 0, dt: 10 });
  while (day.sys.t < 86400 - 1e-9) day.step();
  const rel = Math.abs(day.offset() / (off * day.sys.t) - 1);
  checks.push({ label: 'Integrated clock offset over 1 day vs (W₀ − 3GM/2a)/c² × t', value: `${(day.offset() * 1e6).toFixed(6)} µs (rel. diff ${rel.toExponential(1)})`, pass: rel < 1e-6 });
  // eccentric orbit: periodic part vs F e √a sin E
  const ecc = createSim({ a: GPS_A / 1e3, e: 0.02, dt: 5 });
  let worst = 0, amp = 0;
  while (ecc.sys.t < ecc.period) {
    ecc.step();
    const periodic = ecc.offset() - circularOffset(ecc.a) * ecc.sys.t;
    const analytic = ecc.periodicAnalytic();
    worst = Math.max(worst, Math.abs(periodic - analytic)); amp = Math.max(amp, Math.abs(analytic));
  }
  checks.push({ label: 'Eccentric orbit (e = 0.02): periodic clock term vs F e √a sin E (IS-GPS-200)', value: `amplitude ${(amp * 1e9).toFixed(2)} ns, max diff ${(worst * 1e12).toFixed(1)} ps`, pass: worst < 0.01 * amp });
  const T = day.period;
  checks.push({ label: 'GPS orbital period vs half a sidereal day (43 082.05 s)', value: `${T.toFixed(2)} s`, pass: Math.abs(T - 43082.045) < 1 });
  return {
    summary: 'Clock rates, orbit and GPS constants checked against IAU, IERS and the GPS interface specification (IS-GPS-200):',
    checks,
    notes: ['Earth is a point mass here; its oblateness (J₂) changes GPS clock rates by ~10⁻¹³, far below the 4.5×10⁻¹⁰ effect shown.'],
  };
}



return { HOUR, PARAMS, createSim, verify, R_EARTH, GM_EARTH, W0, circularOffset, MICRO_PER_DAY };

// ---- page
const { createInstrument } = __psim["ui/instrument-app.mjs"];

const { PARAMS, createSim, R_EARTH, GM_EARTH, W0, circularOffset, MICRO_PER_DAY } = __psim["local:physics.mjs"];
const C2 = 299792458 ** 2;

// ------------------------------------------------------------------ stage: Earth, orbit, two clocks
function clockFace(ctx, x, y, R, label, seconds, extra, color, C) {
  ctx.strokeStyle = C('--line-strong'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
  for (let k = 0; k < 60; k++) {
    const a = k / 60 * 2 * Math.PI, r1 = k % 5 ? R * 0.9 : R * 0.82;
    ctx.beginPath(); ctx.moveTo(x + Math.sin(a) * r1, y - Math.cos(a) * r1); ctx.lineTo(x + Math.sin(a) * R * 0.97, y - Math.cos(a) * R * 0.97); ctx.stroke();
  }
  const s = seconds % 60, a = s / 60 * 2 * Math.PI;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(a) * R * 0.85, y - Math.cos(a) * R * 0.85); ctx.stroke();
  ctx.fillStyle = C('--ink'); ctx.font = '600 12px ui-sans-serif, system-ui'; ctx.textAlign = 'center';
  ctx.fillText(label, x, y + R + 18);
  ctx.font = '11px ui-monospace, Menlo, monospace'; ctx.fillStyle = C('--muted');
  ctx.fillText(extra, x, y + R + 34);
  ctx.textAlign = 'start';
}

function draw(ctx, sim, view) {
  const { W, H } = view, C = view.color;
  const narrow = W < 640;
  const ox = narrow ? W / 2 : W * 0.36, oy = narrow ? H * 0.36 : H / 2;
  const maxR = sim.a * (1 + sim.e);
  const scale = (narrow ? Math.min(W, H * 0.62) : Math.min(W * 0.62, H)) * 0.44 / maxR;
  // Earth (to scale) with the equator line
  const re = R_EARTH * scale;
  const g = ctx.createRadialGradient(ox - re * 0.3, oy - re * 0.3, re * 0.1, ox, oy, re);
  g.addColorStop(0, '#3d7bd6'); g.addColorStop(1, '#13325f');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, re, 0, 7); ctx.fill();
  ctx.fillStyle = C('--muted'); ctx.font = '11px ui-sans-serif, system-ui'; ctx.textAlign = 'center';
  ctx.fillText('Earth (to scale)', ox, oy + re + 14); ctx.textAlign = 'start';
  // orbit ellipse (analytic shape, perigee on +x) and the computed trail
  const a = sim.a * scale, b = a * Math.sqrt(1 - sim.e ** 2), cxo = ox - sim.a * sim.e * scale;
  ctx.setLineDash([3, 5]); ctx.strokeStyle = C('--grid-strong');
  ctx.beginPath(); ctx.ellipse(cxo, oy, a, b, 0, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
  const [px, py] = sim.position();
  const sx = ox + px * scale, sy = oy - py * scale;
  // signal path to a ground receiver
  const ang = Math.atan2(-(sy - oy), sx - ox);
  const gx = ox + Math.cos(ang) * re, gy = oy - Math.sin(ang) * re;
  ctx.strokeStyle = C('--accent'); ctx.globalAlpha = 0.5; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.fillStyle = C('--body-1'); ctx.beginPath(); ctx.arc(gx, gy, 3.5, 0, 7); ctx.fill();
  // satellite
  ctx.fillStyle = C('--body-0'); ctx.fillRect(sx - 4, sy - 4, 8, 8);
  ctx.fillRect(sx - 14, sy - 1.5, 8, 3); ctx.fillRect(sx + 6, sy - 1.5, 8, 3);
  ctx.fillStyle = C('--ink-2'); ctx.font = '11px ui-sans-serif, system-ui';
  ctx.fillText('GPS satellite', sx + 16, sy - 8);

  // two clocks: same coordinate time, different proper times
  const t = sim.sys.t, off = sim.offset();
  const cx1 = narrow ? W * 0.28 : W * 0.8, cx2 = narrow ? W * 0.72 : W * 0.8;
  const cy1 = narrow ? H * 0.78 : H * 0.27, cy2 = narrow ? H * 0.78 : H * 0.66;
  const R = narrow ? Math.min(W * 0.16, 52) : Math.min(H * 0.13, 62);
  clockFace(ctx, cx1, cy1, R, 'Ground clock', t, `τ = t − ${sci(W0 / C2 * t * 1e6, 3)} µs`, C('--body-1'), C);
  clockFace(ctx, cx2, cy2, R, 'Satellite clock', t + off, `${off >= 0 ? '+' : '−'}${Math.abs(off * 1e6).toFixed(4)} µs ahead`, C('--body-0'), C);
  ctx.fillStyle = C('--warn'); ctx.font = '600 12px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
  const errKm = 299792.458 * off;
  ctx.fillText(`uncorrected position error ≈ ${Math.abs(errKm).toFixed(2)} km`, narrow ? W / 2 : cx2, narrow ? H * 0.95 : cy2 + R + 62);
  ctx.textAlign = 'start';
}

function bench({ eqs, figs, createPlot, createEquation, createDerivation, M }) {

    title: 'Satellite clock minus ground clock', height: 260,
    x: { label: 'time', unit: 'hours', min: 0, max: 24 }, y: { label: 'offset', unit: 'µs', min: -10, max: 50 },
  });
  const wobble = createPlot({
    title: 'Periodic part from the eccentric orbit', height: 260,
    x: { label: 'time', unit: 'hours', min: 0, max: 24 }, y: { label: 'offset − mean drift', unit: 'ns', min: -60, max: 60 },
  });
  figs.append(drift.el, wobble.el);
  let sim = null;
  const r = () => sim?.rate() ?? { r: 26561.75e3, v2: GM_EARTH / 26561.75e3 };
  const e10 = x => x * 1e10;
  const eq = createEquation({
    title: 'Clock rate of the satellite relative to the ground (values now, in units of 10⁻¹⁰)',
    lhs: { mathml: `<mfrac><mrow><msub><mi>dτ</mi><mtext>sat</mtext></msub><mo>−</mo><msub><mi>dτ</mi><mtext>ground</mtext></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac>`, label: 'fractional rate difference', value: () => e10((W0 - GM_EARTH / r().r - r().v2 / 2) / C2), unit: '×10⁻¹⁰', digits: 5 },
    terms: [
      { id: 'ground', mathml: M.frac(M.sub(M.i('W'), M.n(0)), M.sup(M.i('c'), M.n(2))), label: 'ground clock sits deep in Earth’s potential (+ rotation): it runs slow', color: '--body-1', value: () => e10(W0 / C2), unit: '×10⁻¹⁰', digits: 5 },
      { id: 'grav', sign: '−', mathml: M.frac(`${M.i('G')}${M.i('M')}`, `${M.i('r')}${M.sup(M.i('c'), M.n(2))}`), label: 'satellite is higher up: less slowing by gravity (general relativity)', color: '--good', value: () => e10(GM_EARTH / r().r / C2), unit: '×10⁻¹⁰', digits: 5 },
      { id: 'vel', sign: '−', mathml: M.frac(M.sup(M.i('v'), M.n(2)), `${M.n(2)}${M.sup(M.i('c'), M.n(2))}`), label: 'satellite moves at ~3.9 km/s: time dilation (special relativity)', color: '--bad', value: () => e10(r().v2 / 2 / C2), unit: '×10⁻¹⁰', digits: 5 },
    ],

    { mathml: `<msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>a</mi></mfrac><mspace width="0.5em"/><mtext>(circular orbit)</mtext><mspace width="0.5em"/><mo>⇒</mo><mspace width="0.5em"/><mfrac><mrow><mi>Δ</mi><mi>τ</mi></mrow><mi>t</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>W</mi><mn>0</mn></msub><mo>−</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>a</mi></mfrac></mrow><msup><mi>c</mi><mn>2</mn></msup></mfrac><mo>=</mo><mn>4.4647</mn><mo>×</mo><msup><mn>10</mn><mn>−10</mn></msup>`, note: 'For GPS (a = 26 561.75 km): +45.8 µs/day from gravity, −7.2 µs/day from speed.' },

  return {

function solveE(t, s) {
  const n = 2 * Math.PI / s.period, Mn = (n * t) % (2 * Math.PI);
